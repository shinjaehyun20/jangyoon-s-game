<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>샌드위치 주문</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:Arial,sans-serif;background:#fff4d6;color:#42210b}.wrap{max-width:480px;height:100%;margin:auto;padding:10px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud,.order,.tray,footer{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:10px}.order{justify-content:center;font-size:30px;min-height:68px}.tray{flex:1;flex-direction:column;justify-content:center;gap:12px}.stack{font-size:42px;min-height:56px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}.choices button,.btn{min-height:52px;border:0;border-radius:14px;background:#ffb703;font-size:24px;font-weight:800}.msg{min-height:24px;font-weight:700;text-align:center}.home{color:#42210b}.overlay{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.card{max-width:360px;background:#fff;border-radius:22px;padding:24px;text-align:center;display:grid;gap:14px}.hidden{display:none}
</style></head><body><main class="wrap"><h1>🥪 샌드위치 주문</h1><div class="hud"><b>완성 <span id="score">0</span></b><b>시간 <span id="time">45</span></b></div><div class="order" id="order">🍞 🥬 🧀 🍞</div><section class="tray"><div class="stack" id="stack">접시가 비었어요</div><div class="choices" id="choices"><button data-x="🍞">🍞</button><button data-x="🥬">🥬</button><button data-x="🧀">🧀</button><button data-x="🍅">🍅</button><button data-x="🥚">🥚</button><button data-x="🥓">🥓</button></div><p class="msg" id="msg">주문 순서대로 재료를 눌러요!</p></section><footer><small>틀려도 다시 주문하면 돼요</small><a class="home" href="../index.html">← 홈으로</a></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🥪 주문을 기억해요</h2><p>위에 보이는 재료를 왼쪽부터 차례로 눌러 샌드위치를 완성하세요.</p><button class="btn" id="startBtn">시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🎉 주방 마감!</h2><b id="finalScore"></b><p id="best"></p><button class="btn" id="restartBtn">다시 하기</button></div></div><script>
(()=>{'use strict';const ALL=['🥬','🧀','🍅','🥚','🥓'],BREAD='🍞';let goal=[],made=[],score=0,left=45,timer;const $=id=>document.getElementById(id);function next(){goal=[BREAD,...Array.from({length:2+Math.min(2,Math.floor(score/3))},()=>ALL[Math.floor(Math.random()*ALL.length)]),BREAD];made=[];$('order').textContent=goal.join(' ');draw()}function draw(){$('stack').textContent=made.length?made.join(' '):'접시가 비었어요'}function tap(x){if(x===goal[made.length]){made.push(x);draw();if(made.length===goal.length){score++;$('score').textContent=score;$('msg').textContent='완성! 다음 주문이에요 👏';setTimeout(next,350)}}else{$('msg').textContent='순서를 다시 봐요 🙂';made=[];draw()}}function start(){score=0;left=45;$('score').textContent=0;$('time').textContent=left;$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');next();clearInterval(timer);timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0)end()},1000)}function end(){clearInterval(timer);const old=+(localStorage.getItem('sandwich-order_best')||0),best=Math.max(old,score);localStorage.setItem('sandwich-order_best',best);$('finalScore').textContent=`${score}개 완성!`;$('best').textContent=`최고 기록 ${best}개`;$('endOverlay').classList.remove('hidden')}$('choices').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&left>0)tap(b.dataset.x)});$('startBtn').onclick=start;$('restartBtn').onclick=start})();
</script></body></html>
