<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍂 가을 낙엽 패턴 놀이터 - 장윤이의 게임세상 #323</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #e17055;
      font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2d3436;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(circle at top, #ffeaa7 0%, #fab1a0 60%, #e17055 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.25);
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      z-index: 25;
      border-bottom: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 0 0 20px 20px;
    }
    .back-btn {
      text-decoration: none;
      color: #d63031;
      font-weight: 800;
      font-size: 0.95rem;
      background: #ffeaa7;
      padding: 6px 14px;
      border-radius: 12px;
      transition: transform 0.1s;
    }
    .back-btn:active {
      transform: scale(0.95);
    }
    .hud-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: #d63031;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-stats {
      display: flex;
      gap: 8px;
    }
    .stat-badge {
      background: #ffffff;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #e17055;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    #stage-area {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }
    .squirrel-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(214, 48, 49, 0.15);
      margin-bottom: 14px;
      width: 92%;
    }
    .squirrel-avatar {
      font-size: 2.8rem;
      animation: squirrelWiggle 2s infinite ease-in-out;
    }
    @keyframes squirrelWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg) scale(1.05); }
      75% { transform: rotate(8deg) scale(1.05); }
    }
    .speech-bubble {
      font-size: 0.98rem;
      font-weight: 800;
      color: #2d3436;
      line-height: 1.35;
    }

    /* Pattern Track */
    .pattern-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 18px 14px;
      width: 96%;
      box-shadow: 0 10px 25px rgba(225, 112, 85, 0.25);
      border: 3px solid #ff7675;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pattern-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: #b2bec3;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .pattern-track {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
    }
    .track-tile {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #fff5eb;
      border: 2px solid #fdcb6e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .track-tile.target-slot {
      border: 3px dashed #ff4757;
      background: #ffeaa7;
      color: #ff4757;
      font-size: 2rem;
      font-weight: 900;
      animation: pulseSlot 1s infinite alternate;
    }
    .track-tile.target-slot.correct {
      border-style: solid;
      border-color: #2ed573;
      background: #ffffff;
      animation: correctPop 0.4s ease;
    }
    @keyframes pulseSlot {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    @keyframes correctPop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* Choice Options */
    #choice-area {
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }
    .choice-prompt {
      font-size: 1.05rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      margin-bottom: 12px;
    }
    .choice-grid {
      display: flex;
      gap: 14px;
      justify-content: center;
      width: 100%;
    }
    .choice-btn {
      flex: 1;
      max-width: 90px;
      height: 90px;
      border-radius: 22px;
      background: #ffffff;
      border: 3px solid #fab1a0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }
    .choice-btn:active {
      transform: scale(0.92);
      border-color: #ff4757;
    }
    .choice-name {
      font-size: 0.75rem;
      font-weight: 800;
      color: #636e72;
      margin-top: 2px;
    }

    /* Background Leaf Particles */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Modal */
    #celebration-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }
    .modal-card {
      background: #ffffff;
      border-radius: 30px;
      padding: 30px 24px;
      text-align: center;
      width: 85%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-emoji {
      font-size: 4rem;
      margin-bottom: 10px;
    }
    .modal-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #e17055;
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 1.05rem;
      color: #636e72;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .btn-action {
      background: linear-gradient(135deg, #e17055, #d63031);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.15rem;
      font-weight: 900;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(214, 48, 49, 0.4);
      width: 100%;
    }
    .btn-action:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../index.html" class="back-btn">← 메인</a>
      <div class="hud-title">🍂 낙엽 패턴 놀이터</div>
      <div class="hud-stats">
        <div class="stat-badge" id="hud-round">1 / 8</div>
        <div class="stat-badge" id="hud-acorn">🌰 0</div>
      </div>
    </header>

    <div id="stage-area">
      <div class="squirrel-box">
        <div class="squirrel-avatar" id="squirrel-avatar">🐿️</div>
        <div class="speech-bubble" id="squirrel-speech">
          안녕 장윤아! 빈칸에 쏙 들어갈 가을 친구를 찾아줄래?
        </div>
      </div>

      <div class="pattern-card">
        <div class="pattern-label" id="pattern-type-label">패턴 규칙 찾기</div>
        <div class="pattern-track" id="pattern-track">
          <!-- Tiles injected by JS -->
        </div>
      </div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <div id="choice-area">
      <div class="choice-prompt">❓ 빈칸에 알맞은 자연물을 골라보세요!</div>
      <div class="choice-grid" id="choice-grid">
        <!-- 3-4 options injected by JS -->
      </div>
    </div>

    <!-- Modal -->
    <div id="celebration-modal">
      <div class="modal-card">
        <div class="modal-emoji" id="modal-emoji">🎉</div>
        <div class="modal-title" id="modal-title">규칙 발견 대성공!</div>
        <div class="modal-desc" id="modal-desc">다람쥐 토토가 신나게 춤을 춥니다!</div>
        <button class="btn-action" id="modal-btn">다음 숲속 길로 가기 ➔</button>
      </div>
    </div>
  </div>

  <script>
    // Audio synthesis
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.2) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playPop() {
      playTone(520, 'sine', 0.12, 0.25);
    }
    function playCorrect() {
      playTone(440, 'triangle', 0.12, 0.2); // A4
      setTimeout(() => playTone(554.37, 'triangle', 0.14, 0.25), 110); // C#5
      setTimeout(() => playTone(659.25, 'triangle', 0.2, 0.3), 220); // E5
      setTimeout(() => playTone(880, 'triangle', 0.3, 0.35), 330); // A5
    }
    function playWrong() {
      playTone(200, 'sawtooth', 0.18, 0.15);
    }
    function playFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => {
        setTimeout(() => playTone(f, 'sine', 0.35, 0.3), i * 140);
      });
    }

    // Natural items
    const ITEMS = {
      maple: { emoji: "🍁", name: "단풍잎" },
      ginkgo: { emoji: "🍂", name: "은행잎" },
      acorn: { emoji: "🌰", name: "도토리" },
      pine: { emoji: "🌲", name: "솔방울" },
      mushroom: { emoji: "🍄", name: "버섯" },
      apple: { emoji: "🍎", name: "사과" }
    };

    // 8 stages covering 1st grade pattern curriculum
    const STAGES = [
      {
        ruleName: "AB 반복 패턴",
        sequence: ["maple", "ginkgo", "maple", "ginkgo", "maple", "?"],
        answer: "ginkgo",
        options: ["ginkgo", "maple", "acorn"]
      },
      {
        ruleName: "AB 반복 패턴",
        sequence: ["acorn", "pine", "acorn", "pine", "acorn", "?"],
        answer: "pine",
        options: ["pine", "acorn", "mushroom"]
      },
      {
        ruleName: "AAB 반복 패턴",
        sequence: ["maple", "maple", "ginkgo", "maple", "maple", "?"],
        answer: "ginkgo",
        options: ["ginkgo", "maple", "pine"]
      },
      {
        ruleName: "ABB 반복 패턴",
        sequence: ["mushroom", "acorn", "acorn", "mushroom", "acorn", "?"],
        answer: "acorn",
        options: ["acorn", "mushroom", "apple"]
      },
      {
        ruleName: "ABC 반복 패턴",
        sequence: ["maple", "ginkgo", "acorn", "maple", "ginkgo", "?"],
        answer: "acorn",
        options: ["acorn", "maple", "ginkgo"]
      },
      {
        ruleName: "AABB 반복 패턴",
        sequence: ["pine", "pine", "apple", "apple", "pine", "?"],
        answer: "pine",
        options: ["pine", "apple", "maple"]
      },
      {
        ruleName: "ABC 반복 패턴 (가운데 빈칸)",
        sequence: ["mushroom", "?", "ginkgo", "mushroom", "acorn", "ginkgo"],
        answer: "acorn",
        options: ["acorn", "mushroom", "ginkgo"]
      },
      {
        ruleName: "가을 숲 마스터 패턴",
        sequence: ["maple", "acorn", "pine", "maple", "acorn", "?"],
        answer: "pine",
        options: ["pine", "maple", "acorn", "ginkgo"]
      }
    ];

    let currentStageIdx = 0;
    let acorns = 0;
    let particles = [];

    // Falling autumn leaves
    class FallingLeaf {
      constructor(w, h) {
        this.w = w;
        this.h = h;
        this.reset();
        this.y = Math.random() * h;
      }
      reset() {
        this.x = Math.random() * this.w;
        this.y = -30;
        this.emoji = ["🍁", "🍂", "🌰", "🍃"][Math.floor(Math.random() * 4)];
        this.size = 18 + Math.random() * 16;
        this.speedY = 0.8 + Math.random() * 1.2;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.05;
        this.alpha = 0.4 + Math.random() * 0.4;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.02) * 0.5;
        this.rotation += this.rotSpeed;
        if (this.y > this.h + 40) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font = `${this.size}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.emoji, 0, 0);
        ctx.restore();
      }
    }

    let leaves = [];
    let pCanvas, pCtx;

    function initLeaves() {
      pCanvas = document.getElementById("particle-canvas");
      pCtx = pCanvas.getContext("2d");
      resizeLeafCanvas();
      window.addEventListener("resize", resizeLeafCanvas);

      leaves = [];
      for (let i = 0; i < 18; i++) {
        leaves.push(new FallingLeaf(pCanvas.width, pCanvas.height));
      }
      requestAnimationFrame(leafLoop);
    }

    function resizeLeafCanvas() {
      const container = document.getElementById("game-container");
      pCanvas.width = container.clientWidth;
      pCanvas.height = container.clientHeight;
    }

    function leafLoop() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      leaves.forEach(l => {
        l.update();
        l.draw(pCtx);
      });
      requestAnimationFrame(leafLoop);
    }

    function renderStage() {
      const stage = STAGES[currentStageIdx];
      document.getElementById("hud-round").textContent = `${currentStageIdx + 1} / ${STAGES.length}`;
      document.getElementById("hud-acorn").textContent = `🌰 ${acorns}`;
      document.getElementById("pattern-type-label").textContent = `✨ ${stage.ruleName}`;

      const track = document.getElementById("pattern-track");
      track.innerHTML = "";

      stage.sequence.forEach((itemKey, idx) => {
        const tile = document.createElement("div");
        tile.className = "track-tile";
        if (itemKey === "?") {
          tile.classList.add("target-slot");
          tile.id = "target-slot-tile";
          tile.textContent = "❓";
        } else {
          tile.textContent = ITEMS[itemKey].emoji;
        }
        track.appendChild(tile);
      });

      // Render choice buttons
      const choiceGrid = document.getElementById("choice-grid");
      choiceGrid.innerHTML = "";

      stage.options.forEach(optKey => {
        const btn = document.createElement("div");
        btn.className = "choice-btn";
        btn.innerHTML = `<span>${ITEMS[optKey].emoji}</span><span class="choice-name">${ITEMS[optKey].name}</span>`;
        btn.addEventListener("click", () => handleChoice(optKey));
        choiceGrid.appendChild(btn);
      });

      document.getElementById("squirrel-speech").textContent = 
        `규칙을 보고 ❓ 자리에 쏙 들어갈 친구를 골라줘!`;
    }

    function handleChoice(chosenKey) {
      initAudio();
      const stage = STAGES[currentStageIdx];
      const slotTile = document.getElementById("target-slot-tile");

      if (chosenKey === stage.answer) {
        playCorrect();
        acorns += 10;
        document.getElementById("hud-acorn").textContent = `🌰 ${acorns}`;

        slotTile.classList.remove("target-slot");
        slotTile.classList.add("correct");
        slotTile.textContent = ITEMS[chosenKey].emoji;

        document.getElementById("squirrel-speech").textContent = 
          `우와! 정답이야! '${ITEMS[chosenKey].name}'가 맞았어! (+10 🌰)`;
        document.getElementById("squirrel-avatar").textContent = "🐿️🎉";

        setTimeout(() => {
          if (currentStageIdx >= STAGES.length - 1) {
            playFanfare();
            showCelebrationModal(true);
          } else {
            showCelebrationModal(false);
          }
        }, 500);
      } else {
        playWrong();
        document.getElementById("squirrel-speech").textContent = 
          `앗, 다시 한 번 앞뒤 규칙을 살펴볼까?`;
        document.getElementById("squirrel-avatar").textContent = "🐿️💦";

        slotTile.style.transform = "translateX(-8px)";
        setTimeout(() => slotTile.style.transform = "translateX(8px)", 70);
        setTimeout(() => slotTile.style.transform = "translateX(0)", 140);
      }
    }

    function showCelebrationModal(isFinal) {
      const modal = document.getElementById("celebration-modal");
      const title = document.getElementById("modal-title");
      const desc = document.getElementById("modal-desc");
      const emoji = document.getElementById("modal-emoji");
      const btn = document.getElementById("modal-btn");

      if (isFinal) {
        emoji.textContent = "🏆";
        title.textContent = "가을 패턴 숲 완주!";
        desc.textContent = `장윤이가 모든 규칙을 풀고 도토리 ${acorns}개를 모았어요!`;
        btn.textContent = "처음부터 다시 놀기 🔄";
      } else {
        emoji.textContent = "🌰";
        title.textContent = "규칙 발견 성공!";
        desc.textContent = `도토리 10개를 획득했어요! 다음 숲속 길로 가볼까요?`;
        btn.textContent = "다음 패턴 도전! ➔";
      }

      modal.style.display = "flex";
    }

    document.getElementById("modal-btn").addEventListener("click", () => {
      document.getElementById("celebration-modal").style.display = "none";
      document.getElementById("squirrel-avatar").textContent = "🐿️";
      if (currentStageIdx >= STAGES.length - 1) {
        currentStageIdx = 0;
        acorns = 0;
      } else {
        currentStageIdx++;
      }
      renderStage();
    });

    window.addEventListener("load", () => {
      initLeaves();
      renderStage();
    });
  </script>
</body>
</html>
