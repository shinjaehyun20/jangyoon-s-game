<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9966" />
      <stop offset="100%" stop-color="#ff5e62" />
    </linearGradient>
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#e84118" />
    </linearGradient>
    <linearGradient id="leaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa502" />
      <stop offset="100%" stop-color="#eccc68" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.25" />
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Autumn Background -->
  <rect width="512" height="512" rx="48" fill="url(#bg)" />

  <!-- Soft Forest Floor Arch -->
  <path d="M 0 420 Q 256 360 512 420 L 512 512 L 0 512 Z" fill="#6d4c41" opacity="0.35" />

  <!-- Falling Floating Leaves -->
  <!-- Maple Leaf -->
  <g transform="translate(90, 100) rotate(-15) scale(0.9)" filter="url(#shadow)">
    <path d="M 0 -45 C 8 -25 22 -30 35 -20 C 25 -10 35 5 45 10 C 30 15 25 30 15 45 C 5 35 -5 35 -15 45 C -25 30 -30 15 -45 10 C -35 5 -25 -10 -35 -20 C -22 -30 -8 -25 0 -45 Z" fill="url(#leaf1)" />
    <path d="M 0 -45 L 0 55" stroke="#c23616" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ginkgo Leaf -->
  <g transform="translate(420, 120) rotate(25) scale(0.95)" filter="url(#shadow)">
    <path d="M 0 35 Q -35 30 -45 -10 C -45 -35 45 -35 45 -10 Q 35 30 0 35 Z" fill="url(#leaf2)" />
    <path d="M 0 35 L 5 60" stroke="#d35400" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Pattern Train / Tiles -->
  <g transform="translate(256, 210)">
    <!-- Base Pattern Ribbon -->
    <rect x="-210" y="-55" width="420" height="110" rx="24" fill="#ffffff" opacity="0.95" filter="url(#shadow)" />
    
    <!-- Item 1: Maple 🍁 -->
    <rect x="-190" y="-40" width="80" height="80" rx="18" fill="#ffeaa7" />
    <text x="-150" y="14" font-size="44" text-anchor="middle">🍁</text>

    <!-- Item 2: Ginkgo 🍂 -->
    <rect x="-95" y="-40" width="80" height="80" rx="18" fill="#ffeaa7" />
    <text x="-55" y="14" font-size="44" text-anchor="middle">🍂</text>

    <!-- Item 3: Maple 🍁 -->
    <rect x="0" y="-40" width="80" height="80" rx="18" fill="#ffeaa7" />
    <text x="40" y="14" font-size="44" text-anchor="middle">🍁</text>

    <!-- Item 4: Target Box ❓ -->
    <rect x="95" y="-40" width="95" height="80" rx="18" fill="#ff7675" stroke="#ffffff" stroke-width="3" />
    <text x="142" y="16" font-family="'Pretendard', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">❓</text>
  </g>

  <!-- Cute Squirrel Mascot -->
  <g transform="translate(256, 350)" filter="url(#shadow)">
    <!-- Fluffy Tail -->
    <path d="M -20 20 C -60 20 -90 -40 -60 -70 C -40 -90 -10 -60 -25 -20 Z" fill="#d35400" />
    <path d="M -25 15 C -55 15 -75 -30 -50 -55 C -35 -70 -15 -45 -28 -15 Z" fill="#e67e22" />

    <!-- Squirrel Body -->
    <ellipse cx="10" cy="15" rx="36" ry="40" fill="#d35400" />
    <ellipse cx="18" cy="18" rx="22" ry="26" fill="#f5cd79" />

    <!-- Head -->
    <circle cx="20" cy="-30" r="30" fill="#d35400" />
    <circle cx="6" cy="-52" r="10" fill="#d35400" />
    <circle cx="34" cy="-52" r="10" fill="#d35400" />
    <circle cx="6" cy="-52" r="6" fill="#f5cd79" />
    <circle cx="34" cy="-52" r="6" fill="#f5cd79" />

    <!-- Cheeks & Eyes -->
    <circle cx="12" cy="-30" r="4.5" fill="#2d3436" />
    <circle cx="28" cy="-30" r="4.5" fill="#2d3436" />
    <ellipse cx="20" cy="-22" rx="5" ry="3.5" fill="#2d3436" />
    <circle cx="5" cy="-22" r="7" fill="#ff7675" opacity="0.6" />
    <circle cx="35" cy="-22" r="7" fill="#ff7675" opacity="0.6" />

    <!-- Acorn in Paws -->
    <g transform="translate(28, 5) scale(0.7)">
      <path d="M 0 0 C 15 0 20 20 0 32 C -20 20 -15 0 0 0 Z" fill="#795548" />
      <path d="M -16 2 Q 0 -10 16 2 Z" fill="#4e342e" />
      <rect x="-2" y="-9" width="4" height="6" fill="#3e2723" />
    </g>
  </g>

  <!-- Title Banner -->
  <rect x="56" y="424" width="400" height="64" rx="32" fill="#ffffff" filter="url(#glow)" />
  <text x="256" y="468" font-family="'Pretendard', sans-serif" font-size="28" font-weight="900" fill="#d35400" text-anchor="middle">가을 낙엽 패턴 놀이터</text>
</svg>
