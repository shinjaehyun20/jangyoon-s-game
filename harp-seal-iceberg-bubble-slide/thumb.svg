<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="auroraSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3d"/>
      <stop offset="50%" stop-color="#193b68"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#70e000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="icebergSlope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="40%" stop-color="#b2ebf2"/>
      <stop offset="100%" stop-color="#4dd0e1"/>
    </linearGradient>
    <radialGradient id="rainbowBubble" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#80d8ff"/>
      <stop offset="70%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#ff80ab"/>
    </radialGradient>
    <radialGradient id="sealWhite" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </radialGradient>
  </defs>

  <!-- Aurora Night Sky -->
  <rect width="400" height="300" fill="url(#auroraSky)"/>

  <!-- Northern Lights / Aurora Ribbon -->
  <path d="M 0,40 Q 100,10 200,50 T 400,20 L 400,100 Q 280,60 160,90 T 0,70 Z" fill="url(#auroraGlow)" opacity="0.65"/>

  <!-- Distant Icebergs -->
  <polygon points="40,150 90,80 150,150" fill="#90caf9" opacity="0.5"/>
  <polygon points="260,160 330,70 390,160" fill="#90caf9" opacity="0.6"/>

  <!-- Curved Iceberg Slide -->
  <path d="M 0,110 Q 180,130 280,210 T 400,250 L 400,300 L 0,300 Z" fill="url(#icebergSlope)"/>
  <path d="M 0,110 Q 180,130 280,210 T 400,250" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.9"/>
  <!-- Slide Ice Crystals & Sparkles -->
  <circle cx="90" cy="135" r="3" fill="#fff"/>
  <circle cx="170" cy="160" r="4" fill="#fff"/>
  <circle cx="260" cy="210" r="3.5" fill="#fff"/>
  <circle cx="340" cy="245" r="4.5" fill="#fff"/>

  <!-- Floating Rainbow Bubbles -->
  <g transform="translate(100, 85)">
    <circle cx="0" cy="0" r="18" fill="url(#rainbowBubble)" opacity="0.85"/>
    <ellipse cx="-5" cy="-6" rx="5" ry="3" fill="#ffffff" opacity="0.9"/>
    <text x="14" y="-8" font-size="14" fill="#ffd54f">✨</text>
  </g>
  <g transform="translate(320, 140)">
    <circle cx="0" cy="0" r="16" fill="url(#rainbowBubble)" opacity="0.85"/>
    <ellipse cx="-4" cy="-5" rx="4" ry="2.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Baby Harp Seal sliding happily on belly -->
  <g transform="translate(200, 165) rotate(16)">
    <!-- Snow Puff Particles from Slide -->
    <circle cx="-50" cy="18" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="-65" cy="14" r="4.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="-80" cy="8" r="3" fill="#ffffff" opacity="0.4"/>

    <!-- Round Plump White Body -->
    <ellipse cx="0" cy="10" rx="48" ry="24" fill="url(#sealWhite)"/>

    <!-- Rear Flippers (Tail) -->
    <g transform="translate(-46, 12)">
      <ellipse cx="-8" cy="-4" rx="10" ry="5" fill="url(#sealWhite)" transform="rotate(-15)"/>
      <ellipse cx="-8" cy="4" rx="10" ry="5" fill="url(#sealWhite)" transform="rotate(15)"/>
    </g>

    <!-- Side Flippers -->
    <ellipse cx="-4" cy="24" rx="12" ry="7" fill="url(#sealWhite)" transform="rotate(25)"/>
    <ellipse cx="14" cy="22" rx="11" ry="6" fill="url(#sealWhite)" transform="rotate(20)"/>

    <!-- Cute Chubby Head -->
    <circle cx="36" cy="2" r="22" fill="url(#sealWhite)"/>

    <!-- Big Sparkly Eyes -->
    <circle cx="34" cy="-2" r="4.5" fill="#1a1a1a"/>
    <circle cx="32" cy="-4" r="1.8" fill="#ffffff"/>
    <circle cx="48" cy="-2" r="4.5" fill="#1a1a1a"/>
    <circle cx="46" cy="-4" r="1.8" fill="#ffffff"/>

    <!-- Cute Black Nose & Whiskers -->
    <ellipse cx="42" cy="7" rx="3.5" ry="2.5" fill="#1a1a1a"/>
    <path d="M 39,12 Q 42,14 45,12" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Soft Whiskers -->
    <line x1="33" y1="8" x2="24" y2="7" stroke="#78909c" stroke-width="1.2"/>
    <line x1="33" y1="11" x2="23" y2="13" stroke="#78909c" stroke-width="1.2"/>
    <line x1="51" y1="8" x2="60" y2="7" stroke="#78909c" stroke-width="1.2"/>
    <line x1="51" y1="11" x2="61" y2="13" stroke="#78909c" stroke-width="1.2"/>

    <!-- Cheeks (Blush) -->
    <circle cx="28" cy="6" r="4" fill="#ff80ab" opacity="0.6"/>
    <circle cx="54" cy="6" r="4" fill="#ff80ab" opacity="0.6"/>

    <!-- Star / Heart Catch in Front -->
    <g transform="translate(62, -15)">
      <polygon points="0,-12 3,-3 12,-3 5,3 8,12 0,6 -8,12 -5,3 -12,-3 -3,-3" fill="#ffd54f" stroke="#fff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#fff"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(200, 270)">
    <rect x="-155" y="-18" width="310" height="34" rx="17" fill="rgba(11, 27, 61, 0.85)" stroke="#00f5d4" stroke-width="2"/>
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🦭 뽀송 하프물범의 빙하 무지개 슬라이드
    </text>
  </g>
</svg>