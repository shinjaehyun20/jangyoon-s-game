<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#skyGrad)"/>

  <!-- Rainbow Cloud Platform -->
  <g transform="translate(100, 160)">
    <!-- Cloud Shadows & Body -->
    <path d="M -60 0 Q -70 -20 -40 -25 Q -10 -45 25 -25 Q 65 -30 65 0 Z" fill="#FFFFFF"/>
    <path d="M -50 -5 C -20 -20 20 -20 50 -5" stroke="url(#rainbowGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <polygon points="40,40 43,48 51,51 43,54 40,62 37,54 29,51 37,48" fill="#FDE047"/>
  <polygon points="160,50 162,56 168,58 162,60 160,66 158,60 152,58 158,56" fill="#F472B6"/>

  <!-- Fluffy Jumping Baby Alpaca -->
  <g transform="translate(100, 95)">
    <!-- Back Little Legs -->
    <rect x="-14" y="24" width="6" height="14" rx="3" fill="#E0E7FF"/>
    <rect x="8" y="24" width="6" height="14" rx="3" fill="#E0E7FF"/>

    <!-- Cloud-like Body -->
    <ellipse cx="0" cy="14" rx="24" ry="18" fill="#FFFFFF"/>
    <!-- Tail -->
    <ellipse cx="-24" cy="10" rx="5" ry="5" fill="#FFFFFF"/>

    <!-- Fluffy Neck -->
    <rect x="6" y="-14" width="12" height="24" rx="6" fill="#FFFFFF"/>

    <!-- Head -->
    <ellipse cx="12" cy="-18" rx="14" ry="12" fill="#FFFFFF"/>

    <!-- Cute Long Ears -->
    <ellipse cx="6" cy="-30" rx="4" ry="9" fill="#FFFFFF" transform="rotate(-15 6 -30)"/>
    <ellipse cx="6" cy="-30" rx="2" ry="6" fill="#FCE7F3" transform="rotate(-15 6 -30)"/>
    <ellipse cx="16" cy="-30" rx="4" ry="9" fill="#FFFFFF" transform="rotate(15 16 -30)"/>
    <ellipse cx="16" cy="-30" rx="2" ry="6" fill="#FCE7F3" transform="rotate(15 16 -30)"/>

    <!-- Alpaca Cheeks & Eyes -->
    <ellipse cx="18" cy="-14" rx="3" ry="2" fill="#FDA4AF" opacity="0.8"/>
    <circle cx="16" cy="-19" r="2.5" fill="#1E1B4B"/>
    <circle cx="17" cy="-20" r="0.8" fill="#FFFFFF"/>

    <!-- Snout & Smile -->
    <ellipse cx="23" cy="-16" rx="4" ry="3" fill="#F5F3FF"/>
    <path d="M 23 -16 L 23 -14 M 22 -14 Q 23 -13 24 -14" stroke="#4B5563" stroke-width="1" fill="none"/>

    <!-- Pretty Flower Garland on Head -->
    <circle cx="10" cy="-26" r="3" fill="#F43F5E"/>
    <circle cx="15" cy="-27" r="3" fill="#FBBF24"/>
    <circle cx="19" cy="-26" r="3" fill="#38BDF8"/>
  </g>
</svg>
