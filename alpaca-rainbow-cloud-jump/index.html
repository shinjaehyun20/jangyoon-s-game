<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🦙 보들보들 아기 알파카의 무지개 구름점프</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #A5B4FC 0%, #C7D2FE 50%, #FBCFE8 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #818cf8;
      box-shadow: 0 10px 35px rgba(165, 180, 252, 0.4);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      color: #3730A3;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      border-bottom: 1px solid rgba(165, 180, 252, 0.3);
      backdrop-filter: blur(8px);
    }
    .home-btn {
      color: #4F46E5;
      text-decoration: none;
      font-size: 14px;
      background: rgba(99, 102, 241, 0.15);
      padding: 5px 12px;
      border-radius: 14px;
      transition: background 0.2s;
    }
    .badge {
      background: rgba(99, 102, 241, 0.15);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #4338CA;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #EEF2FF;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(238, 242, 255, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #312E81;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(8px);
    }
    .overlay h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #4F46E5;
      text-shadow: 0 0 16px rgba(99, 102, 241, 0.3);
    }
    .overlay p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
      color: #4338CA;
    }
    .btn {
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .instructions {
      margin-top: 15px;
      font-size: 13px;
      color: #6366F1;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../index.html" class="home-btn">🏠 아케이드</a>
      <div id="score-display">높이: 0m</div>
      <div class="badge" id="combo-display">최고: 0m</div>
    </header>
    <canvas id="gameCanvas"></canvas>

    <div id="start-overlay" class="overlay">
      <h1>🦙 아기 알파카의 구름점프</h1>
      <p>폭신폭신한 무지개 구름을 밟고 하늘 높이 퐁퐁 뛰어올라요!<br>화면 좌우를 터치하거나 마우스를 움직여 방향을 조절하세요.<br>반짝이는 별풍선을 타면 슈퍼 점프!</p>
      <button class="btn" id="start-btn">점프 시작!</button>
      <div class="instructions">화면 좌/우 터치 또는 드래그 = 좌우 이동</div>
    </div>

    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h1>☁️ 퐁당 착지!</h1>
      <p id="gameover-msg">구름 나라 여행을 마쳤어요!</p>
      <button class="btn" id="restart-btn">다시 뛰기</button>
    </div>
  </div>

  <script>
    // Audio Context Synth
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playBounceSound(isSuper = false) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const startFreq = isSuper ? 550 : 350;
        const endFreq = isSuper ? 1100 : 700;
        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const comboDisplay = document.getElementById('combo-display');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const gameoverMsg = document.getElementById('gameover-msg');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight - 50;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = false;
    let score = 0;
    let bestScore = 0;
    let targetX = 0;

    const alpaca = {
      x: 200,
      y: 400,
      vx: 0,
      vy: 0,
      width: 32,
      height: 40,
      facingRight: true
    };

    let platforms = [];
    let items = [];
    let particles = [];
    const PLATFORM_COUNT = 8;

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: 2 + Math.random() * 3,
          color: color,
          life: 1
        });
      }
    }

    function initPlatforms() {
      platforms = [];
      // Ground platform
      platforms.push({
        x: width / 2 - 40,
        y: height - 60,
        width: 80,
        height: 16,
        isRainbow: true
      });

      for (let i = 1; i < PLATFORM_COUNT; i++) {
        platforms.push({
          x: Math.random() * (width - 70),
          y: height - (i * (height / PLATFORM_COUNT)),
          width: 65,
          height: 14,
          isRainbow: Math.random() < 0.3
        });
      }
    }

    function resetGame() {
      score = 0;
      alpaca.x = width / 2;
      alpaca.y = height - 100;
      alpaca.vx = 0;
      alpaca.vy = -10;
      targetX = alpaca.x;
      initPlatforms();
      items = [];
      particles = [];
      scoreDisplay.textContent = '높이: 0m';
      comboDisplay.textContent = `최고: ${bestScore}m`;
    }

    function update() {
      if (!isPlaying) return;

      // Horizontal movement towards targetX
      const dx = targetX - alpaca.x;
      alpaca.vx = dx * 0.12;
      alpaca.x += alpaca.vx;

      if (alpaca.vx > 0.5) alpaca.facingRight = true;
      else if (alpaca.vx < -0.5) alpaca.facingRight = false;

      // Screen wrap
      if (alpaca.x < 0) alpaca.x = width;
      if (alpaca.x > width) alpaca.x = 0;

      // Gravity & Vertical movement
      alpaca.vy += 0.38;
      alpaca.y += alpaca.vy;

      // Camera scroll up when alpaca is in upper half
      if (alpaca.y < height / 2) {
        const delta = height / 2 - alpaca.y;
        alpaca.y = height / 2;
        score += Math.round(delta * 0.1);
        scoreDisplay.textContent = `높이: ${score}m`;
        if (score > bestScore) {
          bestScore = score;
          comboDisplay.textContent = `최고: ${bestScore}m`;
        }

        for (let plat of platforms) {
          plat.y += delta;
          if (plat.y > height) {
            plat.y = 0;
            plat.x = Math.random() * (width - 70);
            plat.isRainbow = Math.random() < 0.35;

            // Chance to spawn star bubble
            if (Math.random() < 0.25) {
              items.push({
                x: plat.x + plat.width / 2,
                y: plat.y - 25,
                radius: 12
              });
            }
          }
        }

        for (let item of items) {
          item.y += delta;
        }
      }

      // Platform bounce collision (only falling down)
      if (alpaca.vy > 0) {
        for (let plat of platforms) {
          if (
            alpaca.x + alpaca.width / 2 > plat.x &&
            alpaca.x - alpaca.width / 2 < plat.x + plat.width &&
            alpaca.y + alpaca.height / 2 >= plat.y &&
            alpaca.y + alpaca.height / 2 <= plat.y + plat.height + alpaca.vy
          ) {
            alpaca.vy = plat.isRainbow ? -13 : -10;
            playBounceSound(plat.isRainbow);
            addParticles(alpaca.x, plat.y, plat.isRainbow ? '#F43F5E' : '#FFFFFF', 10);
            break;
          }
        }
      }

      // Collectible items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        const dist = Math.hypot(alpaca.x - it.x, alpaca.y - it.y);
        if (dist < 25) {
          alpaca.vy = -16; // Super Jump!
          playBounceSound(true);
          addParticles(it.x, it.y, '#FDE047', 15);
          items.splice(i, 1);
          continue;
        }
        if (it.y > height) {
          items.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Game Over: Fall off bottom
      if (alpaca.y > height + 50) {
        isPlaying = false;
        gameoverMsg.textContent = `구름 위를 ${score}m 까지 뛰어올랐어요!`;
        gameoverOverlay.style.display = 'flex';
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Sky Pastel Gradient
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#C7D2FE');
      grad.addColorStop(0.6, '#E0E7FF');
      grad.addColorStop(1, '#FCE7F3');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Platforms (Fluffy Clouds)
      for (let plat of platforms) {
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.roundRect(plat.x, plat.y, plat.width, plat.height, 10);
        ctx.fill();

        if (plat.isRainbow) {
          const rGrad = ctx.createLinearGradient(plat.x, plat.y, plat.x + plat.width, plat.y);
          rGrad.addColorStop(0, '#F43F5E');
          rGrad.addColorStop(0.3, '#FBBF24');
          rGrad.addColorStop(0.7, '#34D399');
          rGrad.addColorStop(1, '#818CF8');
          ctx.strokeStyle = rGrad;
          ctx.lineWidth = 3;
          ctx.stroke();
        } else {
          ctx.strokeStyle = '#E0E7FF';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }

      // Items (Star Bubbles)
      for (let it of items) {
        ctx.fillStyle = 'rgba(253, 224, 71, 0.4)';
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.radius + 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FBBF24';
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(it.x - 3, it.y - 3, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Draw Baby Alpaca
      ctx.save();
      ctx.translate(alpaca.x, alpaca.y);
      if (!alpaca.facingRight) ctx.scale(-1, 1);

      // Fluffy Cloud Body
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(0, 4, 18, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Neck & Head
      ctx.beginPath();
      ctx.roundRect(4, -18, 10, 18, 5);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(10, -18, 9, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.beginPath();
      ctx.ellipse(5, -26, 3, 7, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FCE7F3';
      ctx.beginPath();
      ctx.ellipse(5, -26, 1.5, 4, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // Eyes & Cheek
      ctx.fillStyle = '#1E1B4B';
      ctx.beginPath();
      ctx.arc(12, -19, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FDA4AF';
      ctx.beginPath();
      ctx.arc(14, -15, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Little Legs (Tucked when jumping)
      ctx.fillStyle = '#E0E7FF';
      ctx.beginPath();
      ctx.arc(-8, 16, 4, 0, Math.PI * 2);
      ctx.arc(8, 16, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();

    // Controls
    function handlePointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      targetX = clientX - rect.left;
    }
    window.addEventListener('mousemove', (e) => handlePointer(e.clientX));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handlePointer(e.touches[0].clientX);
    }, { passive: true });
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) handlePointer(e.touches[0].clientX);
    }, { passive: true });

    startBtn.addEventListener('click', () => {
      initAudio();
      startOverlay.style.display = 'none';
      resetGame();
      isPlaying = true;
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      gameoverOverlay.style.display = 'none';
      resetGame();
      isPlaying = true;
    });
  </script>
</body>
</html>
