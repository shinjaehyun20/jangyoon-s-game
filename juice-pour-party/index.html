<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🍹 주스 따르기 파티</title>
<style>
:root{--bg:#11203b;--panel:#1e3154;--cream:#fff8e8;--mint:#7de2c3;--pink:#ff8caa;--yellow:#ffd166}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;background:radial-gradient(circle at 50% 15%,#294c72 0,#11203b 65%);color:var(--cream)}body{display:flex;justify-content:center}.wrap{width:min(100%,480px);height:100vh;height:100dvh;padding:12px;display:flex;flex-direction:column;gap:9px}h1{font-size:clamp(22px,6vw,30px);text-align:center;letter-spacing:-1px}.hud{display:flex;justify-content:space-between;align-items:center;background:#ffffff16;border:1px solid #ffffff20;border-radius:15px;padding:10px 14px;font-weight:800}.hud b{color:var(--yellow);font-size:20px}.bar{height:8px;background:#ffffff1a;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mint),var(--yellow));transform-origin:left;transition:transform .2s}.game{position:relative;flex:1;min-height:250px;border-radius:24px;background:linear-gradient(180deg,#7bd9df 0%,#d9f5d0 67%,#9acb7d 67%);overflow:hidden;box-shadow:inset 0 0 0 3px #ffffff50}.cloud{position:absolute;font-size:40px;opacity:.75}.c1{top:12%;left:8%}.c2{top:24%;right:9%}.counter{position:absolute;bottom:22%;left:5%;right:5%;height:12px;border-radius:12px;background:#ce815c;box-shadow:0 7px 0 #9f5d49}.pour-zone{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:92px;height:80px;border:4px dashed #ffffffbb;border-radius:20px;background:#ffffff28;text-align:center;padding-top:17px;font-size:35px}.jug{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);width:96px;height:86px;border-radius:20px 20px 30px 30px;background:linear-gradient(90deg,#ff8caa,#ffb4a2);border:4px solid #9a4969;cursor:grab;user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center;font-size:43px;z-index:3;box-shadow:0 8px 0 #8f4d68}.jug:after{content:'';position:absolute;right:-26px;top:17px;width:28px;height:38px;border:8px solid #9a4969;border-left:0;border-radius:0 22px 22px 0}.stream{position:absolute;z-index:2;width:18px;border-radius:20px;background:linear-gradient(#fff5a8,#ffad76);display:none;transform:translateX(-50%)}.cup{position:absolute;bottom:25%;width:70px;height:62px;border-radius:7px 7px 20px 20px;border:4px solid #6b507b;border-top:0;text-align:center;padding-top:18px;font-size:25px;cursor:pointer;transition:.2s;z-index:2}.cup:before{content:'';position:absolute;left:-7px;right:-7px;top:-10px;height:15px;border:4px solid #6b507b;border-radius:50%;background:#ffffff45}.cup.good{background:#7de2c3}.cup.bad{background:#ffb0b9}.cup span{position:absolute;bottom:-29px;left:0;right:0;font-size:12px;font-weight:800;color:#28445b}.cup1{left:8%}.cup2{right:8%}.cup3{left:50%;transform:translateX(-50%)}footer{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#d2e3f2}.home-link{color:var(--cream);text-decoration:none;background:#ffffff18;border-radius:12px;padding:10px 12px;min-height:44px}.overlay{position:fixed;inset:0;background:#071126b8;display:grid;place-items:center;padding:20px;z-index:10}.overlay.hidden{display:none}.card{width:min(100%,370px);text-align:center;background:linear-gradient(145deg,#294b73,#182944);border:2px solid #ffffff30;border-radius:26px;padding:28px 22px;box-shadow:0 18px 50px #0008}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.55;margin-bottom:20px;color:#dcebf5}.start{border:0;border-radius:16px;min-height:52px;padding:0 28px;background:var(--yellow);color:#392b2d;font-size:19px;font-weight:900;cursor:pointer}.result{font-size:42px;color:var(--yellow);font-weight:900;margin:8px}.toast{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;opacity:0;pointer-events:none}.toast.show{animation:pop .7s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}35%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}
</style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🍹 주스 따르기 파티 — 색깔 주전자를 알맞은 컵 위로 드래그해 45초 동안 맛있는 주스를 따라 보는 놀이 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🍹 주스 따르기 파티 | 장윤이 게임 놀이터">
<meta property="og:description" content="🍹 주스 따르기 파티 — 색깔 주전자를 알맞은 컵 위로 드래그해 45초 동안 맛있는 주스를 따라 보는 놀이 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body><main class="wrap"><h1>🍹 주스 따르기 파티</h1><div class="hud"><div>점수 <b id="score">0</b></div><div>남은 시간 <b id="time">45</b>초<div class="bar"><i id="timeBar"></i></div></div><div>최고 <b id="best">0</b></div></div><section class="game" id="game"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="pour-zone">따르기<br><small>여기로!</small></div><div class="stream" id="stream"></div><div class="counter"></div><div class="cup cup1" data-color="orange">🍊<span>오렌지</span></div><div class="cup cup2" data-color="grape">🍇<span>포도</span></div><div class="cup cup3" data-color="mint">🍈<span>민트</span></div><div class="jug" id="jug" aria-label="주스 주전자">🍹</div><div class="toast" id="toast">맛있다!</div></section><footer><span>주전자를 컵 위로 끌어 주스를 따라요!</span><a class="home-link" href="../index.html">← 홈으로</a></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🍹 주스 따르기 파티</h2><p>주전자를 컵 위로 끌고 가서<br>알맞은 주스를 따라 주세요!</p><button class="start" id="startBtn">파티 시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🎉 파티 끝!</h2><div class="result" id="finalScore">0점</div><p id="message"></p><button class="start" id="restartBtn">다시 따르기</button></div></div>
<script>
(()=>{'use strict';const ID='juice-pour-party',DURATION=45,colors=['orange','grape','mint'];const $=s=>document.querySelector(s);const game=$('#game'),jug=$('#jug'),stream=$('#stream');let state={running:false,score:0,time:DURATION,color:'orange',drag:false};let timer=null;const best=()=>Number(localStorage.getItem(ID+'_best')||0);$('#best').textContent=best();function choose(){state.color=colors[Math.floor(Math.random()*colors.length)];jug.dataset.color=state.color;jug.textContent=state.color==='orange'?'🍊':state.color==='grape'?'🍇':'🍈';document.querySelectorAll('.cup').forEach(c=>c.classList.remove('good','bad'))}function render(){ $('#score').textContent=state.score;$('#time').textContent=state.time;$('#timeBar').style.transform='scaleX('+state.time/DURATION+')'}function start(){state={running:true,score:0,time:DURATION,color:'orange',drag:false};choose();$('#startOverlay').classList.add('hidden');$('#endOverlay').classList.add('hidden');render();clearInterval(timer);timer=setInterval(()=>{state.time--;render();if(state.time<=0)finish()},1000)}function finish(){if(!state.running)return;state.running=false;clearInterval(timer);stream.style.display='none';const old=best();if(state.score>old)localStorage.setItem(ID+'_best',state.score);$('#best').textContent=Math.max(old,state.score);$('#finalScore').textContent=state.score+'점';$('#message').textContent=state.score>=8?'최고의 주스 마스터예요!':'다음엔 더 맛있게 따라봐요!';$('#endOverlay').classList.remove('hidden')}function pos(e){const r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function move(e){if(!state.running||!state.drag)return;e.preventDefault();const p=pos(e);jug.style.left=p.x+'px';jug.style.top=(p.y-42)+'px';jug.style.bottom='auto';stream.style.display='block';stream.style.left=p.x+'px';stream.style.top=(p.y+28)+'px';stream.style.height=Math.max(20,game.clientHeight-p.y-62)+'px'}function drop(){if(!state.drag)return;state.drag=false;stream.style.display='none';const jr=jug.getBoundingClientRect();let hit=null;document.querySelectorAll('.cup').forEach(c=>{const r=c.getBoundingClientRect();if(jr.left<r.right&&jr.right>r.left&&jr.bottom>r.top&&jr.top<r.bottom)hit=c});if(hit){const ok=hit.dataset.color===state.color;hit.classList.add(ok?'good':'bad');if(ok){state.score++;$('#toast').textContent='찰랑! +1';}else $('#toast').textContent='앗, 다른 맛!';$('#toast').classList.remove('show');void $('#toast').offsetWidth;$('#toast').classList.add('show');setTimeout(()=>hit.classList.remove('good','bad'),300);choose();render()}jug.style.left='50%';jug.style.top='auto';jug.style.bottom='25%'}jug.addEventListener('pointerdown',e=>{if(!state.running)return;e.preventDefault();state.drag=true;try{jug.setPointerCapture(e.pointerId)}catch(_){} });window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',drop);$('#startBtn').addEventListener('pointerdown',start);$('#restartBtn').addEventListener('pointerdown',start);render()})();
</script></body></html>
