<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4e73"/>
      <stop offset="60%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#0e2338"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- 도로 -->
  <rect x="0" y="140" width="320" height="40" fill="#3a3a3a"/>
  <rect x="0" y="140" width="320" height="4" fill="rgba(255,255,255,0.35)" opacity="0.7"/>
  <g stroke="#555" stroke-width="3" stroke-dasharray="14 10">
    <line x1="0" y1="160" x2="320" y2="160"/>
  </g>

  <!-- 균형 트랙 -->
  <rect x="30" y="18" width="180" height="12" rx="6" fill="rgba(0,0,0,0.35)"/>
  <rect x="98" y="18" width="44" height="12" rx="6" fill="rgba(46,204,113,0.55)"/>
  <circle cx="120" cy="24" r="9" fill="#ffb703"/>

  <!-- 자전거 탄 아이 -->
  <g transform="translate(30,60)">
    <circle cx="0" cy="60" r="20" fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="60" cy="60" r="20" fill="none" stroke="#fff" stroke-width="5"/>
    <line x1="0" y1="60" x2="32" y2="18" stroke="#ffb703" stroke-width="6" stroke-linecap="round"/>
    <line x1="32" y1="18" x2="60" y2="60" stroke="#ffb703" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="60" x2="44" y2="40" stroke="#ffb703" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="40" x2="60" y2="60" stroke="#ffb703" stroke-width="6" stroke-linecap="round"/>
    <circle cx="34" cy="8" r="14" fill="#ffe4c4"/>
    <path d="M20 2 Q34 -14 48 2 L45 8 Q34 -4 23 8 Z" fill="#e63946"/>
  </g>

  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="22" font-weight="900" fill="#ffb703">자전거 균형 타기</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="2">BICYCLE BALANCE</text>
  </g>
</svg>
