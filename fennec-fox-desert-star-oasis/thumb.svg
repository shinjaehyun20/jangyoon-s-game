<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E1B4B"/>
      <stop offset="80%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="desertDune" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="oasisWater" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="fennecEars" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="fennecEarInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="200" height="200" rx="24" fill="url(#nightSky)"/>

  <!-- Stars & Constellations -->
  <g fill="#FEF08A" opacity="0.85">
    <circle cx="25" cy="30" r="1.5"/>
    <circle cx="50" cy="18" r="2.2" filter="url(#starGlow)"/>
    <circle cx="85" cy="35" r="1.2"/>
    <circle cx="120" cy="20" r="2.5" filter="url(#starGlow)"/>
    <circle cx="155" cy="40" r="1.8"/>
    <circle cx="180" cy="25" r="2.0"/>
    <circle cx="35" cy="65" r="1.2"/>
    <circle cx="165" cy="70" r="1.5"/>
  </g>

  <!-- Crescent Moon -->
  <path d="M 160 20 A 18 18 0 1 0 178 38 A 14 14 0 1 1 160 20 Z" fill="#FDE047" filter="url(#starGlow)"/>

  <!-- Desert Sand Dunes in Background -->
  <path d="M -10 140 Q 60 115 130 135 T 210 120 L 210 200 L -10 200 Z" fill="url(#desertDune)" opacity="0.6"/>
  <path d="M -10 160 Q 70 145 150 165 T 210 155 L 210 200 L -10 200 Z" fill="url(#desertDune)"/>

  <!-- Shimmering Oasis Pond -->
  <ellipse cx="100" cy="178" rx="80" ry="18" fill="url(#oasisWater)" opacity="0.9"/>
  <ellipse cx="100" cy="178" rx="65" ry="12" fill="#E0F2FE" opacity="0.35"/>

  <!-- Palm Tree silhouette -->
  <path d="M 28 175 Q 32 135 25 105 L 30 105 Q 36 135 34 175 Z" fill="#78350F"/>
  <path d="M 27 105 Q 10 90 0 98 Q 12 105 27 107 Z" fill="#059669"/>
  <path d="M 27 105 Q 20 80 18 70 Q 28 85 29 105 Z" fill="#10B981"/>
  <path d="M 29 105 Q 45 80 55 85 Q 42 98 29 107 Z" fill="#047857"/>

  <!-- Cute Fennec Fox -->
  <g transform="translate(100, 142)">
    <!-- Giant Big Ears -->
    <!-- Left Ear -->
    <path d="M -12 -12 C -28 -42 -42 -52 -36 -58 C -30 -62 -14 -40 0 -18 Z" fill="url(#fennecEars)"/>
    <path d="M -12 -14 C -24 -38 -34 -46 -30 -50 C -26 -52 -14 -36 -2 -18 Z" fill="url(#fennecEarInner)"/>

    <!-- Right Ear -->
    <path d="M 12 -12 C 28 -42 42 -52 36 -58 C 30 -62 14 -40 0 -18 Z" fill="url(#fennecEars)"/>
    <path d="M 12 -14 C 24 -38 34 -46 30 -50 C 26 -52 14 -36 2 -18 Z" fill="url(#fennecEarInner)"/>

    <!-- Fluffy Body -->
    <ellipse cx="0" cy="16" rx="22" ry="16" fill="url(#fennecEars)"/>
    <ellipse cx="0" cy="18" rx="14" ry="10" fill="#FFFBEB"/>

    <!-- Cute Big Head -->
    <circle cx="0" cy="-6" r="20" fill="url(#fennecEars)"/>
    <!-- White Fur Cheeks -->
    <ellipse cx="-9" cy="0" rx="9" ry="8" fill="#FFFBEB"/>
    <ellipse cx="9" cy="0" rx="9" ry="8" fill="#FFFBEB"/>

    <!-- Shiny Big Eyes -->
    <ellipse cx="-7" cy="-7" rx="3.5" ry="4.5" fill="#1E293B"/>
    <circle cx="-6" cy="-8.5" r="1.4" fill="#FFFFFF"/>
    <ellipse cx="7" cy="-7" rx="3.5" ry="4.5" fill="#1E293B"/>
    <circle cx="8" cy="-8.5" r="1.4" fill="#FFFFFF"/>

    <!-- Cute Nose & Smile -->
    <ellipse cx="0" cy="-1.5" rx="2" ry="1.4" fill="#0F172A"/>
    <path d="M -3 2 Q 0 4.5 3 2" fill="none" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="-13" cy="-1" rx="3" ry="1.8" fill="#F472B6" opacity="0.6"/>
    <ellipse cx="13" cy="-1" rx="3" ry="1.8" fill="#F472B6" opacity="0.6"/>

    <!-- Big Fluffy Tail curled around -->
    <path d="M 18 16 C 35 14 42 0 34 -6 C 26 -12 20 8 16 18 Z" fill="url(#fennecEars)"/>
    <path d="M 34 -6 C 36 -2 32 4 28 6 C 26 2 28 -4 34 -6 Z" fill="#FFFBEB"/>
  </g>

  <!-- Glowing Falling Star in Fox's sight -->
  <g transform="translate(100, 68)" filter="url(#starGlow)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#FDE047"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>
