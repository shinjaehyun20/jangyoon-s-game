<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>반짝반짝 반딧불이 호롱불</title>
<link rel="icon" href="data:,">
<style>
:root{--gold:#facc15;--amber:#f59e0b;--emerald:#34d399;--dark:#0f172a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100vh;height:100dvh;margin:0;overflow:hidden;touch-action:manipulation;font-family:"Pretendard","Malgun Gothic",sans-serif;color:#fff;background:#050814}
body{background:radial-gradient(circle at 50% 20%,#1e1b4b 0%,#050814 100%)}
.wrap{position:relative;width:100%;max-width:520px;height:100vh;height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:clamp(19px,5vw,25px);margin:0;color:#fef08a;text-shadow:0 0 12px rgba(250,204,21,.5)}
.sub{font-size:11px;font-weight:700;color:#cbd5e1;margin-top:2px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{padding:6px;text-align:center;border-radius:14px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border:1px solid rgba(250,204,21,.25);font-size:11px;color:#cbd5e1}
.chip b{display:block;font-size:17px;color:#fff;margin-top:2px}
#canvas-box{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;border:1px solid rgba(250,204,21,.3);background:radial-gradient(circle at 50% 50%,#0f172a 0%,#020617 100%);box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.footer{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#94a3b8}
.home-link{color:#fde047;font-weight:900;text-decoration:none;font-size:12px}
.overlay{position:fixed;z-index:10;inset:0;padding:20px;display:grid;place-items:center;background:rgba(5,8,20,.85);backdrop-filter:blur(8px)}
.overlay.hidden{display:none}
.card{width:min(380px,100%);padding:24px 20px;text-align:center;border-radius:24px;border:1px solid rgba(250,204,21,.3);background:linear-gradient(160deg,#1e1b4b,#0f172a);box-shadow:0 16px 40px rgba(0,0,0,.6)}
.card h2{margin:0 0 10px;font-size:24px;color:#fef08a;text-shadow:0 0 10px rgba(250,204,21,.4)}
.card p{margin:0 0 16px;font-size:13px;line-height:1.6;color:#e2e8f0}
.btn{padding:12px 26px;border:0;border-radius:14px;background:linear-gradient(135deg,#facc15,#eab308);color:#0f172a;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 16px rgba(234,179,8,.4)}
.btn:active{transform:scale(.96)}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div><h1>✨ 반짝반짝 반딧불이 호롱불</h1><div class="sub">밤하늘 반딧불이를 터치해 호롱불을 밝혀주세요!</div></div>
  <div class="chip" style="min-width:70px">최고 <b id="best">0</b></div>
</header>
<section class="hud">
  <div class="chip">호롱불 빛<b id="score">0</b></div>
  <div class="chip">남은 시간<b id="timer">40초</b></div>
  <div class="chip">콤보<b id="combo">0x</b></div>
</section>
<div id="canvas-box"><canvas id="cvs"></canvas></div>
<footer class="footer"><span>💡 황금 반딧불이는 보너스 3배!</span><a class="home-link" href="../index.html">← 홈</a></footer>
</main>
<div class="overlay" id="startOverlay">
  <div class="card">
    <h2>✨ 반딧불이 숲의 호롱불</h2>
    <p>어두운 밤하늘 숲속을 날아다니는<br>반짝이는 반딧불이를 손가락으로 톡톡 터치하세요!<br>호롱불에 빛을 모아 환하게 밝혀요! 🌟</p>
    <button class="btn" id="startBtn">숲속으로 출발 🚀</button>
  </div>
</div>
<div class="overlay hidden" id="endOverlay">
  <div class="card">
    <h2>🎉 탐험 완료!</h2>
    <p id="endText">호롱불이 환하게 밝아졌어요!</p>
    <button class="btn" id="restartBtn">다시 하기 🔄</button>
  </div>
</div>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const comboEl = document.getElementById('combo');
const bestEl = document.getElementById('best');
const startOverlay = document.getElementById('startOverlay');
const endOverlay = document.getElementById('endOverlay');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const endText = document.getElementById('endText');

let width = 0, height = 0;
let score = 0, timeLeft = 40, combo = 0, comboTimer = null;
let gameRunning = false, lastTime = 0, timerInterval = null;
let fireflies = [], particles = [];

let bestScore = parseInt(localStorage.getItem('jangyoon_firefly_best') || '0', 10);
bestEl.textContent = bestScore;

// Sound Synthesizer
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, duration = 0.15, type = 'sine') {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

function resize() {
  const rect = cvs.parentElement.getBoundingClientRect();
  width = rect.width;
  height = rect.height;
  cvs.width = width * window.devicePixelRatio;
  cvs.height = height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resize);
resize();

class Firefly {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * (width - 60) + 30;
    this.y = Math.random() * (height - 60) + 30;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    this.radius = 12 + Math.random() * 8;
    this.isGold = Math.random() < 0.2; // 20% golden firefly
    this.phase = Math.random() * Math.PI * 2;
    this.color = this.isGold ? '#facc15' : '#34d399';
    this.glowColor = this.isGold ? 'rgba(250,204,21,0.6)' : 'rgba(52,211,153,0.6)';
    this.active = true;
  }
  update(dt) {
    this.phase += dt * 3;
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 30 || this.x > width - 30) this.vx *= -1;
    if (this.y < 30 || this.y > height - 30) this.vy *= -1;
  }
  draw() {
    const pulse = Math.sin(this.phase) * 0.3 + 0.7;
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 2 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = this.glowColor;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 1.0;
    this.decay = Math.random() * 0.03 + 0.02;
    this.size = Math.random() * 4 + 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function handleTouch(e) {
  if (!gameRunning) return;
  e.preventDefault();
  const rect = cvs.getBoundingClientRect();
  const touches = e.touches ? e.touches : [e];
  
  for (let t of touches) {
    const px = t.clientX - rect.left;
    const py = t.clientY - rect.top;
    
    for (let f of fireflies) {
      const dist = Math.hypot(px - f.x, py - f.y);
      if (dist < f.radius * 2.5) {
        // Hit firefly!
        const pts = f.isGold ? 30 : 10;
        combo++;
        score += pts * combo;
        scoreEl.textContent = score;
        comboEl.textContent = combo + 'x';
        
        playTone(f.isGold ? 880 : 523.25 + combo * 40, 0.2, f.isGold ? 'triangle' : 'sine');
        spawnParticles(f.x, f.y, f.color, f.isGold ? 20 : 12);
        
        f.reset();
        
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => {
          combo = 0;
          comboEl.textContent = '0x';
        }, 1200);
        break;
      }
    }
  }
}

cvs.addEventListener('pointerdown', handleTouch);

function startGame() {
  initAudio();
  score = 0;
  timeLeft = 40;
  combo = 0;
  fireflies = [];
  particles = [];
  
  for (let i = 0; i < 9; i++) {
    fireflies.push(new Firefly());
  }
  
  scoreEl.textContent = '0';
  timerEl.textContent = '40초';
  comboEl.textContent = '0x';
  
  startOverlay.classList.add('hidden');
  endOverlay.classList.add('hidden');
  gameRunning = true;
  lastTime = performance.now();
  
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft + '초';
    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);
  
  requestAnimationFrame(loop);
}

function endGame() {
  gameRunning = false;
  clearInterval(timerInterval);
  playTone(440, 0.4, 'triangle');
  
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('jangyoon_firefly_best', bestScore);
    bestEl.textContent = bestScore;
  }
  
  endText.innerHTML = `최종 획득한 호롱불 빛: <b style="color:#fef08a;font-size:22px">${score}점</b><br>최고 기록: ${bestScore}점`;
  endOverlay.classList.remove('hidden');
}

function loop(timestamp) {
  if (!gameRunning) return;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  
  ctx.clearRect(0, 0, width, height);
  
  // Background forest glow
  const grad = ctx.createRadialGradient(width/2, height*0.7, 10, width/2, height*0.7, width*0.8);
  grad.addColorStop(0, 'rgba(30,27,75,0.4)');
  grad.addColorStop(1, 'rgba(5,8,20,0.8)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);
  
  // Update and draw fireflies
  for (let f of fireflies) {
    f.update(dt);
    f.draw();
  }
  
  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
</script>
</body>
</html>
