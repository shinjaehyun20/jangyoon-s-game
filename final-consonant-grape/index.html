<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1eafa"><title>송이송이 받침 포도 농장</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#29364a;background:var(--bg)}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #156da8;outline-offset:3px}button:disabled{cursor:default}main{height:100vh;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;gap:clamp(7px,1.5vh,14px);padding:clamp(12px,3vw,24px);padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--accent)}h1{font-size:clamp(20px,4.5vw,30px);line-height:1.25;margin:3px 0}h2{font-size:clamp(19px,4.5vw,27px);margin:0}p{margin:0;line-height:1.5}.sound{border:1px solid #d2d9cf;border-radius:16px;background:#fff;padding:10px;white-space:nowrap;font-size:12px;min-height:44px}.progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}.dots{display:flex;gap:7px}.dot{width:13px;height:13px;border-radius:50%;background:#d9ded5}.dot.on{background:var(--accent)}.scene{background:#fffdf8;border:2px solid #ffffff;border-radius:28px;box-shadow:0 7px 0 #253d3210;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:clamp(10px,2vh,20px);text-align:center;position:relative;overflow:hidden}.hint{font-size:clamp(13px,3.4vw,16px);color:#526358}.feedback{min-height:48px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.6vw,17px);font-weight:700;line-height:1.4;padding:3px 6px}.next{width:100%;min-height:48px;background:var(--accent);border:0;border-radius:17px;color:white;font-weight:800;padding:13px;box-shadow:0 4px 0 var(--shadow)}.next:disabled{background:#c7cfca;box-shadow:0 4px 0 #b1bbb5;color:#fff}.choices{display:flex;justify-content:center;gap:clamp(7px,2vw,14px)}.choice{border:2px solid #fff;background:white;box-shadow:0 5px 0 #d5ddce;min-height:64px;border-radius:21px;font-weight:800;transition:transform .15s,background .15s}.choice:active{transform:translateY(3px)}.choice.good{background:#d7f6cb;border-color:#58a83a}.choice.wrong{background:#ffeadb;border-color:#dc975e}.foot{font-size:11px;text-align:center;color:#607267}.end{font-size:clamp(56px,13vw,90px)}[hidden]{display:none!important}@media(max-height:650px){main{gap:5px;padding:10px}.feedback{min-height:37px}.choice{min-height:53px}.next{min-height:44px;padding:10px}.foot{display:none}.scene{border-radius:20px;padding:8px}h1{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}:root{--bg:#f1eafa;--accent:#7750a8;--shadow:#51367a}.orchard{font-size:clamp(48px,11vh,100px);line-height:1}.word{font-size:clamp(36px,8vw,65px);font-weight:900;letter-spacing:4px}.missing{display:inline-block;border-bottom:4px dashed #ab87ca;padding:0 10px;color:#7750a8}.recipe{background:#f1eafa;padding:8px 16px;border-radius:15px;font-size:clamp(17px,4vw,24px);font-weight:700}.choice{width:clamp(48px,15vw,94px);border-radius:50% 50% 45% 45%;background:#8b61b5;color:white;font-size:clamp(24px,6vw,36px);box-shadow:0 5px 0 #65428d}.choice.good,.choice.wrong{color:#29364a}
/* Keep the puzzle and home control reachable on short mobile screens. */
@media (max-height:500px) and (orientation:landscape){
main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:44px 18px minmax(64px,1fr) 28px 44px 34px;gap:5px;padding:8px;max-width:900px}
header{grid-column:1/3;grid-row:1}h1{font-size:20px}.progress{grid-column:1/3;grid-row:2}
.scene{grid-column:1;grid-row:3/7;padding:6px;gap:3px;justify-content:space-evenly;border-radius:16px}
.scene .hint{display:none}.question{font-size:18px}.seesaws{width:100%;min-height:0;flex:1;display:flex;flex-direction:column;justify-content:center}.balance{min-height:0;flex:1}.balance svg{width:100%;height:100%;max-height:82px}
.choices{grid-column:2;grid-row:3;align-self:center;gap:6px}.choice{min-height:48px;padding:6px;min-width:0}.animal{font-size:28px}
.feedback{grid-column:2;grid-row:4;min-height:0;font-size:12px;padding:0}.next{grid-column:2;grid-row:5;min-height:44px;padding:8px}
.foot{display:block;grid-column:2;grid-row:6;font-size:10px;line-height:1.1}.foot a{padding:5px!important}.orchard{font-size:50px}.word{font-size:34px}.recipe{font-size:16px}.end{font-size:52px}
}
@media (max-height:700px) and (orientation:portrait){
main{gap:6px;padding:10px}h1{font-size:20px}.scene{padding:6px;gap:3px}.scene .hint{font-size:12px}.question{font-size:18px}.balance svg{max-height:90px}.choice{min-height:48px;padding:6px}.animal{font-size:28px}.feedback{min-height:30px;font-size:13px}.next{min-height:44px;padding:8px}.foot{display:block;font-size:10px}.foot a{padding:5px!important}.orchard{font-size:55px}.word{font-size:38px}.recipe{font-size:16px}
}
</style></head><body><main><header><div><div class="eyebrow">초등 1학년 · 국어 놀이터</div><h1>송이송이 받침 포도 농장</h1></div><button class="sound" id="sound" aria-pressed="false">소리 꺼짐</button></header><div class="progress"><span id="count"></span><div class="dots" id="dots" aria-hidden="true"></div></div><section class="scene" id="scene" aria-label="문제"></section><div class="choices" id="choices" role="group" aria-label="답 고르기"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" disabled>다음 문제 →</button><div class="foot"><a id="homeBtn" href="../index.html" style="display:inline-block;padding:8px;color:inherit;font-weight:700">🏠 게임 모음</a> · 버튼을 눌러 골라요 · 키보드는 탭 키와 엔터 키로 놀아요</div></main><script>'use strict';const GAME='grape';const $=s=>document.querySelector(s);let turn=0,solved=false,misses=0,sound=false,audio;const total=6;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'소리 켜짐':'소리 꺼짐';$('#sound').setAttribute('aria-pressed',sound);if(sound)tone(true)};function tone(ok){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?660:260;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.start();o.stop(audio.currentTime+.23)}catch{}}function progress(){ $('#count').textContent=(turn+1)+' / '+total+' 문제';$('#dots').innerHTML=Array.from({length:total},(_,i)=>'<span class="dot '+(i<turn?'on':'')+'"></span>').join('');$('#next').disabled=true;$('#feedback').textContent='';solved=false}function result(btn,ok,message){if(solved)return;tone(ok);if(ok){solved=true;btn.classList.add('good');document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('#feedback').textContent=message;$('#next').disabled=false;$('#next').textContent=turn===total-1?'오늘의 수확 보기':'다음 문제 →'}else{misses++;btn.classList.add('wrong');$('#feedback').textContent=message}}$('#next').onclick=()=>{if(!solved)return;turn++;if(turn===total)finish();else render()};function finish(){$('#count').textContent='여섯 문제 완성!';document.querySelectorAll('.dot').forEach(x=>x.classList.add('on'));$('#scene').innerHTML='<div class="end">'+(GAME==='grape'?'🍇':'🏅')+'</div><h2>참 잘했어요!</h2><p>여섯 문제를 끝까지 풀었어요.<br>차근차근 생각한 내가 멋져요!</p>';$('#choices').innerHTML='';$('#feedback').textContent=misses===0?'모든 문제를 한 번에 해결했어요!':'다시 생각하며 끝까지 해냈어요!';$('#next').textContent='다시 놀기 ↻';$('#next').disabled=false;$('#next').onclick=()=>location.reload();$('#next').focus()}
const questions=[{word:'수박',base:'바',tail:'ㄱ',emoji:'🍉',clue:'시원하고 달콤한 여름 과일',prefix:'수'},{word:'구름',base:'르',tail:'ㅁ',emoji:'☁️',clue:'하늘에 둥실둥실 떠 있어요',prefix:'구'},{word:'별',base:'벼',tail:'ㄹ',emoji:'⭐',clue:'밤하늘에서 반짝반짝 빛나요',prefix:''},{word:'산',base:'사',tail:'ㄴ',emoji:'⛰️',clue:'나무가 많고 높이 솟아 있어요',prefix:''},{word:'공',base:'고',tail:'ㅇ',emoji:'⚽',clue:'데굴데굴 굴리고 뻥 차요',prefix:''},{word:'달',base:'다',tail:'ㄹ',emoji:'🌙',clue:'밤하늘에서 환하게 비춰요',prefix:''}];function render(){progress();const q=questions[turn];$('#scene').innerHTML='<div class="hint">포도알 받침을 골라 낱말을 완성해요!</div><div class="orchard" aria-hidden="true">'+q.emoji+'</div><p>'+q.clue+'</p><div class="word">'+q.prefix+'<span class="missing">'+q.base+'<small style="font-size:.45em">＋ ?</small></span></div><div class="recipe">'+q.base+' ＋ <span id="letter">?</span> ＝ <span id="complete">?</span></div>';$('#choices').replaceChildren();['ㄱ','ㄴ','ㄹ','ㅁ','ㅇ'].forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.setAttribute('aria-label','받침 '+c);b.onclick=()=>{const ok=c===q.tail;if(ok){$('#letter').textContent=c;$('#complete').textContent=q.word.slice(-1);$('.word').textContent=q.word}result(b,ok,ok?'맞았어요! '+q.base+'에 '+c+' 받침을 붙이면 '+q.word.slice(-1)+', '+q.word+'!':'그림과 낱말을 보고 다시 골라요. 괜찮아요!')};$('#choices').append(b)})}render();</script></body></html>
