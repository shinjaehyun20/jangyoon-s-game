<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf3df"><title>영차영차 시소 무게 비교</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#29364a;background:var(--bg)}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #156da8;outline-offset:3px}button:disabled{cursor:default}main{height:100vh;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;gap:clamp(7px,1.5vh,14px);padding:clamp(12px,3vw,24px);padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--accent)}h1{font-size:clamp(20px,4.5vw,30px);line-height:1.25;margin:3px 0}h2{font-size:clamp(19px,4.5vw,27px);margin:0}p{margin:0;line-height:1.5}.sound{border:1px solid #d2d9cf;border-radius:16px;background:#fff;padding:10px;white-space:nowrap;font-size:12px;min-height:44px}.progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}.dots{display:flex;gap:7px}.dot{width:13px;height:13px;border-radius:50%;background:#d9ded5}.dot.on{background:var(--accent)}.scene{background:#fffdf8;border:2px solid #ffffff;border-radius:28px;box-shadow:0 7px 0 #253d3210;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:clamp(10px,2vh,20px);text-align:center;position:relative;overflow:hidden}.hint{font-size:clamp(13px,3.4vw,16px);color:#526358}.feedback{min-height:48px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.6vw,17px);font-weight:700;line-height:1.4;padding:3px 6px}.next{width:100%;min-height:48px;background:var(--accent);border:0;border-radius:17px;color:white;font-weight:800;padding:13px;box-shadow:0 4px 0 var(--shadow)}.next:disabled{background:#c7cfca;box-shadow:0 4px 0 #b1bbb5;color:#fff}.choices{display:flex;justify-content:center;gap:clamp(7px,2vw,14px)}.choice{border:2px solid #fff;background:white;box-shadow:0 5px 0 #d5ddce;min-height:64px;border-radius:21px;font-weight:800;transition:transform .15s,background .15s}.choice:active{transform:translateY(3px)}.choice.good{background:#d7f6cb;border-color:#58a83a}.choice.wrong{background:#ffeadb;border-color:#dc975e}.foot{font-size:11px;text-align:center;color:#607267}.end{font-size:clamp(56px,13vw,90px)}[hidden]{display:none!important}@media(max-height:650px){main{gap:5px;padding:10px}.feedback{min-height:37px}.choice{min-height:53px}.next{min-height:44px;padding:10px}.foot{display:none}.scene{border-radius:20px;padding:8px}h1{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}:root{--bg:#eaf3df;--accent:#427649;--shadow:#2d5532}.seesaws{display:flex;flex-direction:column;width:100%;gap:0;flex:1;min-height:0;justify-content:space-evenly}.balance{flex:1;min-height:0;max-height:150px;height:clamp(90px,18vh,150px);width:100%;max-width:440px;margin:auto;position:relative}.balance svg{width:100%;height:100%;overflow:visible}.choice{flex:1;max-width:180px;padding:8px 4px;font-size:clamp(14px,3.5vw,19px)}.animal{display:block;font-size:clamp(30px,6vh,46px)}.question{color:#32653b}.scene{justify-content:flex-start;gap:4px}
/* Keep the puzzle and home control reachable on short mobile screens. */
@media (max-height:500px) and (orientation:landscape){
main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:44px 18px minmax(64px,1fr) 28px 44px 34px;gap:5px;padding:8px;max-width:900px}
header{grid-column:1/3;grid-row:1}h1{font-size:20px}.progress{grid-column:1/3;grid-row:2}
.scene{grid-column:1;grid-row:3/7;padding:6px;gap:3px;justify-content:space-evenly;border-radius:16px}
.scene .hint{display:none}.question{font-size:18px}.seesaws{width:100%;min-height:0;flex:1;display:flex;flex-direction:column;justify-content:center}.balance{min-height:0;flex:1}.balance svg{width:100%;height:100%;max-height:82px}
.choices{grid-column:2;grid-row:3;align-self:center;gap:6px}.choice{min-height:48px;padding:6px;min-width:0}.animal{font-size:28px}
.feedback{grid-column:2;grid-row:4;min-height:0;font-size:12px;padding:0}.next{grid-column:2;grid-row:5;min-height:44px;padding:8px}
.foot{display:block;grid-column:2;grid-row:6;font-size:10px;line-height:1.1}.foot a{padding:5px!important}.orchard{font-size:50px}.word{font-size:34px}.recipe{font-size:16px}.end{font-size:52px}
}
@media (max-height:700px) and (orientation:portrait){
main{gap:6px;padding:10px}h1{font-size:20px}.scene{padding:6px;gap:3px}.scene .hint{font-size:12px}.question{font-size:18px}.balance svg{max-height:90px}.choice{min-height:48px;padding:6px}.animal{font-size:28px}.feedback{min-height:30px;font-size:13px}.next{min-height:44px;padding:8px}.foot{display:block;font-size:10px}.foot a{padding:5px!important}.orchard{font-size:55px}.word{font-size:38px}.recipe{font-size:16px}
}
</style></head><body><main><header><div><div class="eyebrow">초등 1학년 · 수학 놀이터</div><h1>영차영차 시소 무게 비교</h1></div><button class="sound" id="sound" aria-pressed="false">소리 꺼짐</button></header><div class="progress"><span id="count"></span><div class="dots" id="dots" aria-hidden="true"></div></div><section class="scene" id="scene" aria-label="문제"></section><div class="choices" id="choices" role="group" aria-label="답 고르기"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" disabled>다음 문제 →</button><div class="foot"><a id="homeBtn" href="../index.html" style="display:inline-block;padding:8px;color:inherit;font-weight:700">🏠 게임 모음</a> · 버튼을 눌러 골라요 · 키보드는 탭 키와 엔터 키로 놀아요</div></main><script>'use strict';const GAME='safari';const $=s=>document.querySelector(s);let turn=0,solved=false,misses=0,sound=false,audio;const total=6;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'소리 켜짐':'소리 꺼짐';$('#sound').setAttribute('aria-pressed',sound);if(sound)tone(true)};function tone(ok){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?660:260;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.start();o.stop(audio.currentTime+.23)}catch{}}function progress(){ $('#count').textContent=(turn+1)+' / '+total+' 문제';$('#dots').innerHTML=Array.from({length:total},(_,i)=>'<span class="dot '+(i<turn?'on':'')+'"></span>').join('');$('#next').disabled=true;$('#feedback').textContent='';solved=false}function result(btn,ok,message){if(solved)return;tone(ok);if(ok){solved=true;btn.classList.add('good');document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('#feedback').textContent=message;$('#next').disabled=false;$('#next').textContent=turn===total-1?'오늘의 수확 보기':'다음 문제 →'}else{misses++;btn.classList.add('wrong');$('#feedback').textContent=message}}$('#next').onclick=()=>{if(!solved)return;turn++;if(turn===total)finish();else render()};function finish(){$('#count').textContent='여섯 문제 완성!';document.querySelectorAll('.dot').forEach(x=>x.classList.add('on'));$('#scene').innerHTML='<div class="end">'+(GAME==='grape'?'🍇':'🏅')+'</div><h2>참 잘했어요!</h2><p>여섯 문제를 끝까지 풀었어요.<br>차근차근 생각한 내가 멋져요!</p>';$('#choices').innerHTML='';$('#feedback').textContent=misses===0?'모든 문제를 한 번에 해결했어요!':'다시 생각하며 끝까지 해냈어요!';$('#next').textContent='다시 놀기 ↻';$('#next').disabled=false;$('#next').onclick=()=>location.reload();$('#next').focus()}
const animals=[{name:'코끼리',icon:'🐘'},{name:'곰',icon:'🐻'},{name:'토끼',icon:'🐰'}];const rounds=[{rank:[0,1,2],heavy:true,flip:[false,false]},{rank:[1,2,0],heavy:false,flip:[true,false]},{rank:[2,0,1],heavy:true,flip:[true,true]},{rank:[0,2,1],heavy:false,flip:[false,true]},{rank:[1,0,2],heavy:true,flip:[true,false]},{rank:[2,1,0],heavy:false,flip:[false,true]}];function balance(heavy,light,flip,n){const left=animals[flip?light:heavy],right=animals[flip?heavy:light],ly=flip?62:112,ry=flip?112:62;return '<div class="balance"><svg viewBox="0 0 400 155" role="img" aria-label="'+n+'번 시소: '+animals[heavy].name+' 쪽은 아래, '+animals[light].name+' 쪽은 위"><path d="M177 147 L200 94 L223 147Z" fill="#d7ad70" stroke="#9c793e" stroke-width="3"/><line x1="56" y1="'+ly+'" x2="344" y2="'+ry+'" stroke="#669a68" stroke-width="14" stroke-linecap="round"/><circle cx="200" cy="87" r="7" fill="#fff6db"/><text x="66" y="'+(ly-18)+'" text-anchor="middle" font-size="40">'+left.icon+'</text><text x="334" y="'+(ry-18)+'" text-anchor="middle" font-size="40">'+right.icon+'</text><text x="66" y="'+(ly+26)+'" text-anchor="middle" font-size="15" fill="#294d31">'+left.name+'</text><text x="334" y="'+(ry+26)+'" text-anchor="middle" font-size="15" fill="#294d31">'+right.name+'</text></svg></div>'}function render(){progress();const q=rounds[turn],r=q.rank;$('#scene').innerHTML='<h2 class="question">가장 '+(q.heavy?'무거운':'가벼운')+' 동물은?</h2><p class="hint">무거운 쪽은 아래로 내려가요.<br>두 시소를 함께 살펴봐요!</p><div class="seesaws">'+balance(r[0],r[1],q.flip[0],1)+balance(r[1],r[2],q.flip[1],2)+'</div>';$('#choices').replaceChildren();animals.forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span class="animal" aria-hidden="true">'+a.icon+'</span>'+a.name;b.onclick=()=>{const ok=i===(q.heavy?r[0]:r[2]);result(b,ok,ok?'맞았어요! 무거운 순서: '+r.map(x=>animals[x].name).join(' → '):'아래로 내려간 쪽이 더 무거워요. 두 시소를 이어 생각해요!')};$('#choices').append(b)})}render();</script></body></html>
