<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10002b" />
      <stop offset="35%" stop-color="#240046" />
      <stop offset="70%" stop-color="#3c096c" />
      <stop offset="100%" stop-color="#5a189a" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="100%" stop-color="#ffd166" />
    </linearGradient>
    <linearGradient id="owlBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#480ca8" />
    </linearGradient>
    <linearGradient id="owlBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0aaff" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#5a189a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Night Sky Canvas -->
  <rect width="512" height="512" rx="48" fill="url(#nightSky)" />

  <!-- Crescent Moon -->
  <g transform="translate(390, 110)" filter="url(#glow)">
    <path d="M0 -45 A45 45 0 1 0 45 40 A36 36 0 1 1 0 -45 Z" fill="url(#moonGrad)" />
  </g>

  <!-- Distant Twinkling Stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="80" r="2.5" opacity="0.9" />
    <circle cx="160" cy="140" r="3" opacity="0.8" />
    <circle cx="280" cy="70" r="2" opacity="0.7" />
    <circle cx="330" cy="180" r="2.5" opacity="0.9" />
    <circle cx="70" cy="240" r="2" opacity="0.8" />
    <circle cx="450" cy="270" r="3" opacity="0.85" />
    <circle cx="210" cy="230" r="2" opacity="0.75" />
  </g>

  <!-- Four-Pointed Bright Stars -->
  <g fill="#ffe66d" filter="url(#glow)">
    <path d="M120 180 Q120 192 125 195 Q120 198 120 210 Q120 198 115 195 Q120 192 120 180 Z" />
    <path d="M420 330 Q420 340 424 343 Q420 346 420 356 Q420 346 416 343 Q420 340 420 330 Z" />
    <path d="M260 130 Q260 138 263 140 Q260 142 260 150 Q260 142 257 140 Q260 138 260 130 Z" />
  </g>

  <!-- Dreamy Pastel Clouds at Bottom -->
  <path d="M-20 440 Q40 390 110 420 Q180 380 250 410 Q330 370 410 410 Q470 380 530 420 L530 512 L-20 512 Z" fill="#3c096c" opacity="0.6" />
  <path d="M-20 460 Q60 410 140 440 Q220 400 300 430 Q380 390 460 430 Q510 410 530 440 L530 512 L-20 512 Z" fill="#240046" opacity="0.8" />

  <!-- Constellation Flight Trail (Dotted stardust arc) -->
  <path d="M60 360 Q140 220 230 250 T380 220" fill="none" stroke="#e0aaff" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.75" />

  <!-- Flying Little Starry Owl -->
  <g transform="translate(230, 240)" filter="url(#shadow)">
    <!-- Flapping Wings -->
    <!-- Left Wing (Spread out) -->
    <path d="M-30 10 C-75 -15 -100 20 -80 50 C-60 40 -40 30 -25 25 Z" fill="url(#wingGrad)" />
    <!-- Right Wing (Spread out) -->
    <path d="M30 10 C75 -15 100 20 80 50 C60 40 40 30 25 25 Z" fill="url(#wingGrad)" />

    <!-- Owl Body & Head (Plump rounded) -->
    <ellipse cx="0" cy="15" rx="46" ry="52" fill="url(#owlBody)" />

    <!-- Starry Owl Belly -->
    <ellipse cx="0" cy="25" rx="30" ry="34" fill="url(#owlBelly)" />
    <!-- Little feather chevron patterns on belly -->
    <path d="M-12 18 Q0 24 12 18 M-14 30 Q0 36 14 30 M-10 42 Q0 48 10 42" fill="none" stroke="#9d4edd" stroke-width="2.5" stroke-linecap="round" />

    <!-- Feather Ear Tufts -->
    <polygon points="-32,-28 -48,-52 -18,-38" fill="url(#owlBody)" />
    <polygon points="-30,-26 -42,-46 -20,-35" fill="#e0aaff" />
    <polygon points="32,-28 48,-52 18,-38" fill="url(#owlBody)" />
    <polygon points="30,-26 42,-46 20,-35" fill="#e0aaff" />

    <!-- Large Cute Luminous Eyes -->
    <circle cx="-18" cy="-5" r="18" fill="#ffffff" filter="url(#glow)" />
    <circle cx="18" cy="-5" r="18" fill="#ffffff" filter="url(#glow)" />

    <circle cx="-18" cy="-5" r="14" fill="#ffbe0b" />
    <circle cx="18" cy="-5" r="14" fill="#ffbe0b" />

    <!-- Pupils -->
    <circle cx="-16" cy="-5" r="8" fill="#10002b" />
    <circle cx="16" cy="-5" r="8" fill="#10002b" />

    <!-- Big Sparkly Eye Highlights -->
    <circle cx="-19" cy="-8" r="3.5" fill="#ffffff" />
    <circle cx="-13" cy="-3" r="1.5" fill="#ffffff" />
    <circle cx="13" cy="-8" r="3.5" fill="#ffffff" />
    <circle cx="19" cy="-3" r="1.5" fill="#ffffff" />

    <!-- Little Golden Beak -->
    <polygon points="-5,8 5,8 0,18" fill="#fb5607" />

    <!-- Rosy Blushing Cheeks -->
    <circle cx="-32" cy="12" r="7" fill="#ff758f" opacity="0.65" />
    <circle cx="32" cy="12" r="7" fill="#ff758f" opacity="0.65" />

    <!-- Cute little talons clutching a glowing star -->
    <ellipse cx="-10" cy="64" rx="6" ry="4" fill="#fb5607" />
    <ellipse cx="10" cy="64" rx="6" ry="4" fill="#fb5607" />

    <path d="M0 72 L3 78 L8 79 L4 83 L5 89 L0 86 L-5 89 L-4 83 L-8 79 L-3 78 Z" fill="#ffe66d" filter="url(#glow)" />
  </g>

  <!-- Title Banner -->
  <rect x="126" y="440" width="260" height="46" rx="23" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)" />
  <text x="256" y="471" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="20" fill="#240046">밤하늘 별빛 비행 🌌</text>
</svg>
