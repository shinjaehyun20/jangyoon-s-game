<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="별빛 고래의 하늘 비행">
<defs>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="40%" stop-color="#0f172a"/>
    <stop offset="80%" stop-color="#1e1b4b"/>
    <stop offset="100%" stop-color="#31104b"/>
  </linearGradient>
  <radialGradient id="whaleGlow" cx="40%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#93c5fd"/>
    <stop offset="50%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </radialGradient>
  <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fef08a"/>
    <stop offset="50%" stop-color="#facc15" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="320" height="180" rx="18" fill="url(#skyGrad)"/>

<!-- Background Stars & Nebula -->
<circle cx="35" cy="25" r="1.5" fill="#ffffff" opacity="0.8"/>
<circle cx="80" cy="40" r="2" fill="#93c5fd" opacity="0.9"/>
<circle cx="130" cy="18" r="1.2" fill="#ffffff" opacity="0.7"/>
<circle cx="210" cy="30" r="1.8" fill="#fef08a" opacity="0.8"/>
<circle cx="285" cy="22" r="1.5" fill="#ffffff" opacity="0.9"/>
<circle cx="295" cy="65" r="2" fill="#c084fc" opacity="0.7"/>
<circle cx="45" cy="95" r="1.5" fill="#67e8f9" opacity="0.6"/>
<circle cx="115" cy="140" r="1.2" fill="#ffffff" opacity="0.8"/>

<!-- Crescent Moon -->
<path d="M40 28 A16 16 0 1 0 54 52 A13 13 0 1 1 40 28 Z" fill="#fef08a" filter="url(#glow)"/>

<!-- Floating Cloud Silhouettes -->
<path d="M-10 160 Q20 140 60 155 Q90 145 120 160 Q150 140 180 165 L180 180 L-10 180 Z" fill="#0f172a" opacity="0.6"/>
<path d="M140 165 Q180 145 220 158 Q260 140 300 160 Q320 150 340 165 L340 180 L140 180 Z" fill="#1e1b4b" opacity="0.7"/>

<!-- Starlight Whale (Center) -->
<g transform="translate(150, 85)" filter="url(#glow)">
  <!-- Water spout / starlight fountain -->
  <path d="M-10 -18 C-18 -32 -25 -30 -22 -40 C-15 -35 -5 -25 -6 -18" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="-22" cy="-42" r="3" fill="#fef08a"/>
  <circle cx="-12" cy="-36" r="2" fill="#a5f3fc"/>
  <circle cx="-28" cy="-32" r="1.5" fill="#ffffff"/>

  <!-- Whale Body -->
  <path d="M-45 -5 C-40 -22 10 -22 35 -6 C48 3 55 12 45 18 C28 26 -15 24 -40 14 C-48 10 -50 0 -45 -5 Z" fill="url(#whaleGlow)"/>
  <!-- Belly -->
  <path d="M-38 6 C-15 16 20 16 42 10 C32 18 5 22 -30 16 C-36 13 -38 10 -38 6 Z" fill="#e0f2fe" opacity="0.9"/>
  <!-- Flippers -->
  <path d="M-5 4 C5 14 15 18 10 24 C2 24 -4 14 -5 4 Z" fill="#2563eb"/>
  <!-- Whale Tail -->
  <path d="M35 -6 C50 -12 60 -18 64 -15 C60 -4 52 0 45 2 C54 6 62 14 58 17 C50 14 42 6 35 2 Z" fill="#1d4ed8"/>
  <!-- Whale Eye -->
  <circle cx="-32" cy="-4" r="3.5" fill="#0f172a"/>
  <circle cx="-33" cy="-5" r="1.5" fill="#ffffff"/>
  <!-- Rosy Cheek -->
  <ellipse cx="-26" cy="4" rx="4" ry="2.5" fill="#f472b6" opacity="0.8"/>
  <!-- Star markings on whale back -->
  <circle cx="-10" cy="-10" r="1.8" fill="#fef08a"/>
  <circle cx="5" cy="-8" r="1.5" fill="#fef08a"/>
  <circle cx="18" cy="-4" r="1.2" fill="#fef08a"/>
</g>

<!-- Floating Stars & Candies to collect -->
<g filter="url(#glow)">
  <polygon points="85,68 88,75 96,75 89,80 92,87 85,82 78,87 81,80 74,75 82,75" fill="#facc15"/>
  <polygon points="230,62 232,67 238,67 233,71 235,76 230,72 225,76 227,71 222,67 228,67" fill="#67e8f9"/>
  <polygon points="265,108 267,112 272,112 268,115 270,119 265,116 260,119 262,115 258,112 263,112" fill="#f472b6"/>
</g>

<!-- Titles -->
<text x="296" y="148" text-anchor="end" font-family="Pretendard,Malgun Gothic,sans-serif" font-size="20" font-weight="900" fill="#bae6fd">별빛 고래의 하늘 비행</text>
<text x="296" y="166" text-anchor="end" font-family="Pretendard,Arial,sans-serif" font-size="10" font-weight="700" fill="#7dd3fc" letter-spacing="2">STARLIGHT WHALE FLIGHT</text>
<rect x="0.5" y="0.5" width="319" height="179" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
</svg>
