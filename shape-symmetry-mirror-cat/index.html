<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아기 고양이 거울 모양 맞추기</title>
<style>
  :root {
    --bg-top: #EEF6FF;
    --bg-bottom: #D6E8FF;
    --primary: #3B6FD8;
    --primary-dark: #1F479C;
    --mirror-line: #FF6B8B;
    --text: #1E2B48;
    --tile-empty: #F5F8FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body {
    width: 100%; height: 100dvh; overflow: hidden;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--text);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: rgba(255,255,255,0.9);
    border-bottom: 2px solid #B8D2FA; flex-shrink: 0;
  }
  .home-link {
    text-decoration: none; color: var(--primary-dark); font-weight: 800;
    font-size: 0.95rem; padding: 6px 12px; border-radius: 999px;
    background: #E2EEFF; border: 2px solid #9DC0F9;
  }
  .score-box { display: flex; gap: 10px; font-weight: 800; font-size: 0.95rem; }
  .badge {
    background: #FFF; padding: 5px 11px; border-radius: 999px;
    border: 2px solid #9DC0F9; color: var(--text);
  }
  .main-stage {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: space-evenly; padding: 8px 14px; max-width: 540px;
    width: 100%; margin: 0 auto; overflow: hidden;
  }
  .title-banner { text-align: center; }
  .title-banner h1 { font-size: 1.32rem; color: var(--primary-dark); margin-bottom: 2px; }
  .title-banner p { font-size: 0.88rem; color: #3D5480; font-weight: 600; }
  .mirror-board {
    width: 100%; background: #FFFFFF; border-radius: 22px;
    border: 3px solid #90B8F8; padding: 14px;
    box-shadow: 0 8px 18px rgba(31,71,156,0.12);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .pattern-title {
    font-size: 1rem; font-weight: 800; color: var(--primary-dark);
    background: #EDF4FF; padding: 5px 14px; border-radius: 999px;
  }
  .boards-wrap {
    display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
  }
  .side-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .side-label { font-size: 0.82rem; font-weight: 800; color: #4A6396; }
  .grid-3x3 {
    display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px);
    gap: 5px; background: #DCE9FF; padding: 6px; border-radius: 14px;
  }
  .cell {
    width: 46px; height: 46px; border-radius: 10px; background: var(--tile-empty);
    border: 2px solid #BDD3FA; display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem; cursor: pointer; transition: transform 0.08s, background 0.12s;
  }
  .cell.locked { cursor: default; }
  .cell.active { background: #FFE3EC; border-color: #FF5C8A; box-shadow: inset 0 0 0 2px #FF5C8A; }
  .cell.right-active { background: #DFF7E8; border-color: #269954; box-shadow: inset 0 0 0 2px #269954; }
  .mirror-divider {
    width: 6px; height: 156px; border-radius: 999px;
    background: repeating-linear-gradient(180deg, var(--mirror-line) 0 10px, #FFD1DC 10px 18px);
  }
  .controls-row {
    display: flex; gap: 10px; width: 100%;
  }
  .action-btn {
    flex: 1; padding: 12px; border-radius: 16px; font-size: 1.05rem; font-weight: 900;
    cursor: pointer; border: none;
  }
  .clear-btn { background: #EDF3FF; color: var(--primary-dark); border: 2px solid #9DC0F9; }
  .check-btn { background: var(--primary); color: #FFF; box-shadow: 0 4px 0 var(--primary-dark); }
  .feedback-bar {
    min-height: 26px; font-size: 1rem; font-weight: 800; color: var(--primary-dark); text-align: center;
  }
  .footer-bar {
    padding: 8px 14px; text-align: center; font-size: 0.8rem; color: #3D5480;
    background: rgba(255,255,255,0.75); flex-shrink: 0; font-weight: 600;
  }
</style>
</head>
<body>
  <header class="top-bar">
    <a class="home-link" href="../index.html">← 홈으로</a>
    <div class="score-box">
      <span class="badge">🐱 완성 <strong id="scoreVal">0</strong>개</span>
      <span class="badge">🏆 최고 <strong id="bestVal">0</strong>개</span>
    </div>
  </header>

  <main class="main-stage">
    <div class="title-banner">
      <h1>🐱 아기 고양이 거울 모양 맞추기</h1>
      <p>가운데 분홍 거울선을 기준으로 왼쪽 모양과 마주 보게 오른쪽 칸을 터치해요!</p>
    </div>

    <section class="mirror-board">
      <div class="pattern-title" id="patternTitle">1단계: 아기 고양이 발자국</div>
      <div class="boards-wrap">
        <div class="side-col">
          <span class="side-label">왼쪽 거울 앞</span>
          <div class="grid-3x3" id="leftGrid"></div>
        </div>
        <div class="mirror-divider" aria-hidden="true"></div>
        <div class="side-col">
          <span class="side-label">오른쪽 거울 속 (터치!)</span>
          <div class="grid-3x3" id="rightGrid"></div>
        </div>
      </div>
    </section>

    <div class="feedback-bar" id="feedbackBar">거울에 비친 것처럼 오른쪽 칸을 똑같이 채워 보세요!</div>

    <div class="controls-row">
      <button type="button" class="action-btn clear-btn" id="clearBtn">🧹 다시 지우기</button>
      <button type="button" class="action-btn check-btn" id="checkBtn">✨ 거울 완성 확인!</button>
    </div>
  </main>

  <footer class="footer-bar">
    장윤이를 위한 1학년 수학 도형·데칼코마니 대칭 감각 놀이 · 칸을 터치해 별을 켜고 꺼요!
  </footer>

<script>
(function(){
  const STORAGE_KEY = "jangyoon_shape_symmetry_mirror_cat_best_v1";
  const PATTERNS = [
    { name: "하트 날개 모양", icon: "💖", left: [[0,1,1],[0,1,0],[0,1,1]] },
    { name: "아기 고양이 귀 모양", icon: "🐾", left: [[1,0,1],[1,1,1],[0,1,0]] },
    { name: "반짝이는 화살표", icon: "⭐", left: [[0,0,1],[0,1,1],[0,0,1]] },
    { name: "나비의 왼쪽 날개", icon: "🦋", left: [[1,1,0],[0,1,1],[1,1,0]] },
    { name: "로켓 날개 모양", icon: "🚀", left: [[0,0,1],[0,1,1],[1,1,1]] },
    { name: "보석 왕관 모양", icon: "👑", left: [[1,0,1],[1,1,1],[1,1,1]] },
    { name: "물고기 꼬리 모양", icon: "🐟", left: [[1,0,0],[1,1,1],[1,0,0]] },
    { name: "네잎클로버 잎사귀", icon: "🍀", left: [[0,1,1],[1,1,0],[0,1,1]] }
  ];

  let score = 0;
  let best = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
  let idx = 0;
  let userGrid = [[0,0,0],[0,0,0],[0,0,0]];

  const scoreVal = document.getElementById("scoreVal");
  const bestVal = document.getElementById("bestVal");
  const patternTitle = document.getElementById("patternTitle");
  const leftGrid = document.getElementById("leftGrid");
  const rightGrid = document.getElementById("rightGrid");
  const feedbackBar = document.getElementById("feedbackBar");
  const clearBtn = document.getElementById("clearBtn");
  const checkBtn = document.getElementById("checkBtn");

  bestVal.textContent = best;

  function playTone(freq, dur) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.14, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch (e) {}
  }

  function expectedMirror(leftMat) {
    return leftMat.map(row => [row[2], row[1], row[0]]);
  }

  function renderPattern() {
    const p = PATTERNS[idx % PATTERNS.length];
    patternTitle.textContent = p.icon + " " + p.name;
    userGrid = [[0,0,0],[0,0,0],[0,0,0]];

    leftGrid.innerHTML = "";
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const cell = document.createElement("div");
        cell.className = "cell locked" + (p.left[r][c] ? " active" : "");
        cell.textContent = p.left[r][c] ? p.icon : "";
        leftGrid.appendChild(cell);
      }
    }
    renderRightGrid(p);
  }

  function renderRightGrid(p) {
    rightGrid.innerHTML = "";
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell" + (userGrid[r][c] ? " right-active" : "");
        cell.textContent = userGrid[r][c] ? p.icon : "";
        cell.addEventListener("click", () => {
          userGrid[r][c] = userGrid[r][c] ? 0 : 1;
          playTone(userGrid[r][c] ? 520 : 360, 0.09);
          renderRightGrid(p);
        });
        rightGrid.appendChild(cell);
      }
    }
  }

  clearBtn.addEventListener("click", () => {
    const p = PATTERNS[idx % PATTERNS.length];
    userGrid = [[0,0,0],[0,0,0],[0,0,0]];
    renderRightGrid(p);
    feedbackBar.textContent = "오른쪽 거울 칸을 깨끗이 지웠어요! 다시 터치해 볼까요?";
  });

  checkBtn.addEventListener("click", () => {
    const p = PATTERNS[idx % PATTERNS.length];
    const target = expectedMirror(p.left);
    let ok = true;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (userGrid[r][c] !== target[r][c]) ok = false;
      }
    }
    if (ok) {
      score += 1;
      scoreVal.textContent = score;
      if (score > best) {
        best = score;
        bestVal.textContent = best;
        try { localStorage.setItem(STORAGE_KEY, String(best)); } catch(e){}
      }
      feedbackBar.textContent = "야옹~ 정답이에요! 거울 대칭 모양을 완벽하게 맞췄어요!";
      playTone(660, 0.16);
      setTimeout(() => playTone(880, 0.22), 120);
      setTimeout(() => {
        idx += 1;
        renderPattern();
        feedbackBar.textContent = "다음 거울 모양도 맞춰 볼까요?";
      }, 900);
    } else {
      feedbackBar.textContent = "거울 선에서 가까운 칸끼리, 먼 칸끼리 마주 보는지 다시 확인해 봐요!";
      playTone(250, 0.2);
    }
  });

  renderPattern();
})();
</script>
</body>
</html>
