<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>태권도 품새 리듬</title>
<style>:root{--navy:#0b1530;--blue:#2f6dff;--red:#ff4d5e;--gold:#ffd45c;--white:#fff}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:"Malgun Gothic",sans-serif;background:radial-gradient(circle at 50% 15%,#213b78,var(--navy) 66%);color:var(--white)}.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud{display:flex;justify-content:space-around;background:#ffffff18;border:1px solid #ffffff26;border-radius:14px;padding:7px;font-weight:800}.dojang{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;background:linear-gradient(#bce4ff 0 54%,#e8d7ad 54%);box-shadow:inset 0 0 0 2px #ffffff24}.dojang:before{content:"";position:absolute;left:0;right:0;top:54%;height:2px;background:#845c3d}.flag{position:absolute;top:12px;left:14px;font-size:34px}.cue{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#0b1530dd;padding:9px 16px;border-radius:18px;text-align:center;font-weight:900}.cue b{display:block;font-size:32px;color:var(--gold)}.kid{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:88px;filter:drop-shadow(0 10px 5px #0004);transition:.15s}.kid.hit{transform:translate(-50%,-50%) scale(1.18) rotate(-5deg)}.belt{position:absolute;left:50%;top:65%;width:62px;height:8px;background:var(--red);transform:translateX(-50%);border-radius:5px}.combo{position:absolute;left:50%;top:78%;transform:translateX(-50%);font-size:22px;font-weight:900;color:#163773}.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pad{min-height:52px;border:0;border-radius:16px;font-size:18px;font-weight:900;color:white;box-shadow:0 5px 0 #071021;user-select:none}.pad:active{transform:translateY(4px);box-shadow:0 1px 0 #071021}.punch{background:var(--red)}.kick{background:var(--blue)}.block{background:#16a36a}.stance{background:#a05cff}footer{display:flex;justify-content:space-between;align-items:center;font-size:12px}.home-link{color:#b9d1ff;min-height:44px;display:flex;align-items:center}.overlay{position:fixed;inset:0;background:#050b19dd;display:flex;align-items:center;justify-content:center;padding:22px;z-index:5}.overlay.hidden{display:none}.card{width:min(390px,100%);background:linear-gradient(155deg,#17366f,#101b39);padding:24px;border-radius:24px;text-align:center;border:1px solid #ffffff30}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.6}.btn{margin-top:18px;min-height:52px;width:100%;border:0;border-radius:16px;background:var(--gold);font-size:20px;font-weight:900;color:#172044}</style></head>
<body><main class="wrap"><h1>🥋 태권도 품새 리듬</h1><div class="hud"><span>점수 <b id="score">0</b></span><span>콤보 <b id="combo">0</b></span><span>시간 <b id="time">45</b></span></div><section class="dojang" id="gameArea"><div class="flag">🇰🇷</div><div class="cue">다음 동작<b id="cueIcon">👊</b><span id="cueText">지르기</span></div><div class="kid" id="kid">🥋</div><div class="belt"></div><div class="combo" id="message">동작을 맞춰 보자!</div></section><div class="pads"><button class="pad punch" data-move="punch">👊 지르기</button><button class="pad kick" data-move="kick">🦵 앞차기</button><button class="pad block" data-move="block">🛡️ 막기</button><button class="pad stance" data-move="stance">↔️ 서기</button></div><footer><small>그림과 같은 동작을 빠르게 눌러요.</small><a class="home-link" href="../index.html">← 홈으로</a></footer></main>
<div class="overlay" id="startOverlay"><div class="card"><h2>🥋 품새 리듬</h2><p>사범님이 보여 주는 동작을 찾아 눌러요.<br>연속으로 맞히면 콤보 점수가 올라가요!</p><button class="btn" id="startBtn">차렷, 시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🎉 수련 완료!</h2><p>오늘 점수</p><div style="font-size:52px;font-weight:900" id="finalScore">0</div><p id="resultMsg"></p><button class="btn" id="restartBtn">다시 수련하기</button></div></div>
<script>(function(){'use strict';const CONFIG={seconds:45,key:'taekwondo-poomsae_best'};const moves={punch:{icon:'👊',text:'지르기'},kick:{icon:'🦵',text:'앞차기'},block:{icon:'🛡️',text:'막기'},stance:{icon:'↔️',text:'서기'}};let state={running:false,score:0,combo:0,time:CONFIG.seconds,target:'punch',timer:null};const $=id=>document.getElementById(id);function next(){const keys=Object.keys(moves);let n;do{n=keys[Math.floor(Math.random()*keys.length)]}while(n===state.target);state.target=n;$('cueIcon').textContent=moves[n].icon;$('cueText').textContent=moves[n].text}function paint(){$('score').textContent=state.score;$('combo').textContent=state.combo;$('time').textContent=state.time}function answer(move){if(!state.running)return;if(move===state.target){state.combo++;state.score+=10+Math.min(state.combo,10)*2;$('message').textContent=state.combo>=5?'🔥 '+state.combo+'콤보!':'좋아! 정확해요';$('kid').classList.add('hit');setTimeout(()=>$('kid').classList.remove('hit'),140);next()}else{state.combo=0;$('message').textContent='괜찮아, 그림을 다시 봐요!'}paint()}function finish(){state.running=false;clearInterval(state.timer);const best=Math.max(state.score,Number(localStorage.getItem(CONFIG.key)||0));localStorage.setItem(CONFIG.key,best);$('finalScore').textContent=state.score;$('resultMsg').textContent='최고 기록 '+best+'점 · '+(state.score>=400?'검은띠 집중력!':state.score>=250?'파란띠 실력!':'한 동작씩 멋지게!');$('endOverlay').classList.remove('hidden')}function start(){clearInterval(state.timer);state={running:true,score:0,combo:0,time:CONFIG.seconds,target:'punch',timer:null};$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');next();paint();state.timer=setInterval(()=>{state.time--;paint();if(state.time<=0)finish()},1000)}document.querySelectorAll('.pad').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();answer(b.dataset.move)}));$('startBtn').addEventListener('click',start);$('restartBtn').addEventListener('click',start)})();</script></body></html>
