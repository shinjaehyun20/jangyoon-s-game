<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>미로 탈출</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #1a0a2e;
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 8px; gap: 6px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(20px, 5.5vw, 28px);
      color: #fff;
      text-align: center;
      text-shadow: 0 0 12px #a78bfa;
    }
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 6px 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }
    #gameArea {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }
    canvas {
      border-radius: 12px;
      display: block;
      touch-action: none;
    }
    footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: rgba(255,255,255,0.5);
    }
    .home-link {
      color: #a78bfa; text-decoration: none; font-weight: 700;
    }

    /* 오버레이 */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: linear-gradient(135deg, #2d1b69, #1a0a2e);
      border: 2px solid #a78bfa;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      color: #fff;
      max-width: 320px; width: 90%;
      box-shadow: 0 0 30px rgba(167,139,250,0.4);
    }
    .overlay-card h2 { font-size: 24px; margin-bottom: 10px; }
    .overlay-card p  { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.8); margin-bottom: 18px; }
    .result-score { font-size: 48px; font-weight: 900; color: #fbbf24; margin-bottom: 8px; }
    .btn-start {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: #fff; border: none; border-radius: 14px;
      padding: 14px 32px; font-size: 18px; font-weight: 700;
      cursor: pointer; min-height: 44px; width: 100%;
    }
    .btn-start:active { opacity: 0.85; transform: scale(0.97); }

    /* 레벨 뱃지 */
    .level-badge {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 48px; font-weight: 900; color: #fbbf24;
      text-shadow: 0 0 20px #f59e0b;
      pointer-events: none; opacity: 0;
      transition: opacity 0.3s;
      z-index: 5;
    }
    .level-badge.show { opacity: 1; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🌀 미로 탈출</h1>
  <div class="hud">
    <span>⏱️ <span id="timeDisplay">0</span>초</span>
    <span>🏆 최고: <span id="bestDisplay">—</span></span>
    <span>🔑 레벨 <span id="levelDisplay">1</span></span>
  </div>
  <div id="gameArea">
    <canvas id="maze"></canvas>
    <div class="level-badge" id="levelBadge">🎉</div>
  </div>
  <footer>
    <small>손가락으로 캐릭터를 드래그하세요!</small>
    <a class="home-link" href="../index.html">← 홈으로</a>
  </footer>
</div>

<!-- 시작 오버레이 -->
<div class="overlay" id="startOverlay">
  <div class="overlay-card">
    <h2>🌀 미로 탈출</h2>
    <p>🟣 보라 공을 드래그해서<br>⭐ 별까지 이동하세요!<br><br>벽에 닿으면 처음으로 돌아가요.<br>시간 제한 없이 모든 미로를 탈출해요! ⏱️</p>
    <button class="btn-start" id="startBtn">시작!</button>
  </div>
</div>

<!-- 결과 오버레이 -->
<div class="overlay hidden" id="endOverlay">
  <div class="overlay-card">
    <h2>🎉 미로 완주!</h2>
    <div class="result-score" id="finalScore">0</div>
    <p id="resultMsg"></p>
    <button class="btn-start" id="restartBtn">다시 하기</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── CONFIG ── */
  const CONFIG = {
    CELL: 40,          // 기본 셀 크기 (px)
    PLAYER_R: 10,      // 플레이어 반지름
    GOAL_R: 12,        // 골 반지름
    LEVELS: [
      { cols: 7,  rows: 7  },
      { cols: 9,  rows: 9  },
      { cols: 11, rows: 11 },
      { cols: 13, rows: 11 },
    ],
    WALL_COLOR: '#4c1d95',
    BG_COLOR:   '#1e1035',
    PATH_COLOR: '#2d1b69',
    PLAYER_COLOR: '#a78bfa',
    GOAL_COLOR:   '#fbbf24',
  };

  /* ── DOM ── */
  const canvas      = document.getElementById('maze');
  const ctx         = canvas.getContext('2d');
  const timeDisplay = document.getElementById('timeDisplay');
  const bestDisplay = document.getElementById('bestDisplay');
  const levelDisplay= document.getElementById('levelDisplay');
  const startBtn    = document.getElementById('startBtn');
  const restartBtn  = document.getElementById('restartBtn');
  const startOverlay= document.getElementById('startOverlay');
  const endOverlay  = document.getElementById('endOverlay');
  const finalScore  = document.getElementById('finalScore');
  const resultMsg   = document.getElementById('resultMsg');
  const levelBadge  = document.getElementById('levelBadge');

  /* ── STATE ── */
  let state = {
    running: false,
    elapsed: 0,
    cleared: 0,
    levelIdx: 0,
    maze: [],
    cols: 0, rows: 0,
    cellW: 0, cellH: 0,
    player: { x: 0, y: 0 },
    goal: { x: 0, y: 0 },
    dragging: false,
    timer: null,
    best: parseInt(localStorage.getItem('maze-escape_besttime') || '0', 10),
  };

  bestDisplay.textContent = state.best > 0 ? state.best + '초' : '—';

  /* ── RESIZE ── */
  function resizeCanvas() {
    const area = document.getElementById('gameArea');
    const aw = area.clientWidth;
    const ah = area.clientHeight;
    const lv = CONFIG.LEVELS[Math.min(state.levelIdx, CONFIG.LEVELS.length - 1)];
    const cw = Math.floor((aw - 4) / lv.cols);
    const ch = Math.floor((ah - 4) / lv.rows);
    const cell = Math.max(20, Math.min(cw, ch));
    canvas.width  = cell * lv.cols;
    canvas.height = cell * lv.rows;
    state.cellW = cell;
    state.cellH = cell;
    state.cols  = lv.cols;
    state.rows  = lv.rows;
  }

  /* ── MAZE GENERATION (Recursive Backtracker DFS) ── */
  function generateMaze(cols, rows) {
    // walls[r][c] = { right: bool, bottom: bool }
    const walls = Array.from({ length: rows }, () =>
      Array.from({ length: cols }, () => ({ right: true, bottom: true }))
    );
    const visited = Array.from({ length: rows }, () => new Array(cols).fill(false));

    function carve(r, c) {
      visited[r][c] = true;
      const dirs = [[0,1],[0,-1],[1,0],[-1,0]].sort(() => Math.random() - 0.5);
      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || visited[nr][nc]) continue;
        // 벽 제거
        if (dr === 0 && dc === 1)  walls[r][c].right  = false;
        if (dr === 0 && dc === -1) walls[r][nc].right = false;
        if (dr === 1 && dc === 0)  walls[r][c].bottom  = false;
        if (dr === -1 && dc === 0) walls[nr][c].bottom = false;
        carve(nr, nc);
      }
    }
    carve(0, 0);
    return walls;
  }

  /* ── DRAW ── */
  function draw() {
    const { maze, cols, rows, cellW, cellH, player, goal } = state;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 배경
    ctx.fillStyle = CONFIG.PATH_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 벽
    ctx.strokeStyle = CONFIG.WALL_COLOR;
    ctx.lineWidth = 3;

    // 외곽 테두리
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, canvas.height);
    ctx.stroke();

    // 시작 오버레이가 열린 초기 상태에는 아직 미로가 생성되지 않았다.
    if (!maze.length || !maze[0]) return;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = c * cellW, y = r * cellH;
        if (maze[r][c].right && c < cols - 1) {
          ctx.beginPath();
          ctx.moveTo(x + cellW, y);
          ctx.lineTo(x + cellW, y + cellH);
          ctx.stroke();
        }
        if (maze[r][c].bottom && r < rows - 1) {
          ctx.beginPath();
          ctx.moveTo(x, y + cellH);
          ctx.lineTo(x + cellW, y + cellH);
          ctx.stroke();
        }
      }
    }

    // 목표 (별)
    drawStar(goal.x, goal.y, CONFIG.GOAL_R, 5);

    // 플레이어
    ctx.beginPath();
    ctx.arc(player.x, player.y, CONFIG.PLAYER_R, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.PLAYER_COLOR;
    ctx.shadowColor = '#a78bfa';
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawStar(cx, cy, r, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const angle = (i * Math.PI) / points - Math.PI / 2;
      const radius = i % 2 === 0 ? r : r * 0.45;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = CONFIG.GOAL_COLOR;
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  /* ── PLAYER PIXEL POSITION ── */
  function cellToPixel(r, c) {
    return {
      x: c * state.cellW + state.cellW / 2,
      y: r * state.cellH + state.cellH / 2,
    };
  }

  function pixelToCell(px, py) {
    return {
      r: Math.floor(py / state.cellH),
      c: Math.floor(px / state.cellW),
    };
  }

  /* ── WALL CHECK ── */
  function canMove(fromR, fromC, toR, toC) {
    const { maze, rows, cols } = state;
    if (toR < 0 || toR >= rows || toC < 0 || toC >= cols) return false;
    const dr = toR - fromR, dc = toC - fromC;
    if (Math.abs(dr) + Math.abs(dc) !== 1) return false;
    if (dr === 0 && dc === 1)  return !maze[fromR][fromC].right;
    if (dr === 0 && dc === -1) return !maze[fromR][toC].right;
    if (dr === 1 && dc === 0)  return !maze[fromR][fromC].bottom;
    if (dr === -1 && dc === 0) return !maze[toR][fromC].bottom;
    return false;
  }

  /* ── POINTER DRAG MOVEMENT ── */
  let activePointerId = null;
  let lastPointer = null;

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      px: (e.clientX - rect.left) * canvas.width / rect.width,
      py: (e.clientY - rect.top) * canvas.height / rect.height,
    };
  }

  function endDrag(e) {
    if (e && activePointerId !== null && e.pointerId !== activePointerId) return;
    const pointerId = activePointerId;
    state.dragging = false;
    activePointerId = null;
    lastPointer = null;
    if (pointerId !== null && canvas.hasPointerCapture(pointerId)) {
      try { canvas.releasePointerCapture(pointerId); } catch (_) { /* capture already lost */ }
    }
  }

  function movePlayerBy(dx, dy) {
    const distance = Math.hypot(dx, dy);
    const maxStep = Math.max(2, Math.min(CONFIG.PLAYER_R / 2, state.cellW / 4, state.cellH / 4));
    const steps = Math.max(1, Math.ceil(distance / maxStep));

    for (let i = 0; i < steps; i++) {
      const stepX = dx / steps;
      const stepY = dy / steps;

      for (const axis of ['x', 'y']) {
        const candidate = { x: state.player.x, y: state.player.y };
        const delta = axis === 'x' ? stepX : stepY;
        candidate[axis] += delta;

        // 닫힌 벽에서는 시작점으로 되돌리지 않고 공의 가장자리가 벽에 닿는
        // 위치까지만 이동한다. 이렇게 해야 드래그 중 순간이동이 없고,
        // 손가락을 반대로 움직였을 때 같은 드래그로 벽에서 빠져나올 수 있다.
        const cell = pixelToCell(state.player.x, state.player.y);
        if (axis === 'x' && delta > 0 && state.maze[cell.r][cell.c].right) {
          candidate.x = Math.min(candidate.x, (cell.c + 1) * state.cellW - CONFIG.PLAYER_R);
        } else if (axis === 'x' && delta < 0) {
          const hasLeftWall = cell.c === 0 || state.maze[cell.r][cell.c - 1].right;
          if (hasLeftWall) candidate.x = Math.max(candidate.x, cell.c * state.cellW + CONFIG.PLAYER_R);
        } else if (axis === 'y' && delta > 0 && state.maze[cell.r][cell.c].bottom) {
          candidate.y = Math.min(candidate.y, (cell.r + 1) * state.cellH - CONFIG.PLAYER_R);
        } else if (axis === 'y' && delta < 0) {
          const hasTopWall = cell.r === 0 || state.maze[cell.r - 1][cell.c].bottom;
          if (hasTopWall) candidate.y = Math.max(candidate.y, cell.r * state.cellH + CONFIG.PLAYER_R);
        }

        candidate.x = Math.max(CONFIG.PLAYER_R, Math.min(canvas.width - CONFIG.PLAYER_R, candidate.x));
        candidate.y = Math.max(CONFIG.PLAYER_R, Math.min(canvas.height - CONFIG.PLAYER_R, candidate.y));

        const from = pixelToCell(state.player.x, state.player.y);
        const to = pixelToCell(candidate.x, candidate.y);
        if (from.r !== to.r || from.c !== to.c) {
          if (!canMove(from.r, from.c, to.r, to.c)) continue;
        }
        state.player = candidate;
      }
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!state.running || activePointerId !== null) return;
    const { px, py } = getCanvasPos(e);
    const hitRadius = Math.max(20, CONFIG.PLAYER_R + 8);
    if (Math.hypot(px - state.player.x, py - state.player.y) > hitRadius) return;
    e.preventDefault();
    state.dragging = true;
    activePointerId = e.pointerId;
    lastPointer = { px, py };
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!state.dragging || !state.running || e.pointerId !== activePointerId || !lastPointer) return;
    e.preventDefault();
    const { px, py } = getCanvasPos(e);
    const dx = px - lastPointer.px;
    const dy = py - lastPointer.py;
    lastPointer = { px, py };
    movePlayerBy(dx, dy);
    draw();
    checkGoal();
  });

  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('lostpointercapture', endDrag);

  /* ── GAME LOGIC ── */
  function resetPlayer() {
    const p = cellToPixel(0, 0);
    state.player = { x: p.x, y: p.y };
  }

  function checkGoal() {
    const dx = state.player.x - state.goal.x;
    const dy = state.player.y - state.goal.y;
    if (Math.sqrt(dx * dx + dy * dy) < CONFIG.PLAYER_R + CONFIG.GOAL_R) {
      state.cleared++;
      showLevelBadge();
      // 마지막 난이도 미로까지 풀면 완주 (시간 제한 없음)
      if (state.levelIdx >= CONFIG.LEVELS.length - 1) {
        winGame();
      } else {
        nextLevel();
      }
    }
  }

  function showLevelBadge() {
    levelBadge.textContent = `🎉 +1`;
    levelBadge.classList.add('show');
    setTimeout(() => levelBadge.classList.remove('show'), 800);
  }

  function nextLevel() {
    endDrag();
    if (state.levelIdx < CONFIG.LEVELS.length - 1) state.levelIdx++;
    levelDisplay.textContent = state.levelIdx + 1;
    startLevel();
  }

  function startLevel() {
    resizeCanvas();
    state.maze = generateMaze(state.cols, state.rows);
    resetPlayer();
    // 목표 = 우하단
    const gp = cellToPixel(state.rows - 1, state.cols - 1);
    state.goal = { x: gp.x, y: gp.y };
    draw();
  }

  function startGame() {
    state.running = true;
    state.elapsed = 0;
    state.cleared = 0;
    state.levelIdx = 0;
    levelDisplay.textContent = 1;
    timeDisplay.textContent = 0;
    startLevel();

    // 카운트업 — 걸린 시간 기록용 (게임을 끝내지 않음)
    clearInterval(state.timer);
    state.timer = setInterval(() => {
      state.elapsed++;
      timeDisplay.textContent = state.elapsed;
    }, 1000);
  }

  function winGame() {
    endDrag();
    state.running = false;
    clearInterval(state.timer);
    // 최고 기록 = 가장 빠른 완주 시간 (작을수록 좋음)
    const newRecord = (state.best === 0 || state.elapsed < state.best);
    if (newRecord) {
      state.best = state.elapsed;
      localStorage.setItem('maze-escape_besttime', state.best);
      bestDisplay.textContent = state.best + '초';
    }
    finalScore.textContent = `${state.elapsed}초`;
    resultMsg.textContent = newRecord
      ? '🏆 최고 기록! 미로 천재! 🧠'
      : '모든 미로를 완주했어요! 멋져요! 🌟';
    endOverlay.classList.remove('hidden');
  }

  /* ── EVENTS ── */
  startBtn.addEventListener('click', () => {
    startOverlay.classList.add('hidden');
    startGame();
  });
  restartBtn.addEventListener('click', () => {
    endOverlay.classList.add('hidden');
    startGame();
  });

  window.render_game_to_text = () => {
    const cell = state.maze.length ? pixelToCell(state.player.x, state.player.y) : { r: 0, c: 0 };
    const directions = [
      ['up', -1, 0], ['right', 0, 1], ['down', 1, 0], ['left', 0, -1],
    ].filter(([, dr, dc]) => state.maze.length && canMove(cell.r, cell.c, cell.r + dr, cell.c + dc))
      .map(([name]) => name);
    return JSON.stringify({
      coordinateSystem: 'canvas pixels; origin top-left; x right; y down',
      mode: state.running ? 'playing' : (endOverlay.classList.contains('hidden') ? 'ready' : 'complete'),
      level: state.levelIdx + 1,
      cleared: state.cleared,
      elapsed: state.elapsed,
      dragging: state.dragging,
      cellSize: state.cellW,
      openDirections: directions,
      player: { x: Math.round(state.player.x), y: Math.round(state.player.y), r: CONFIG.PLAYER_R },
      goal: { x: Math.round(state.goal.x), y: Math.round(state.goal.y), r: CONFIG.GOAL_R },
    });
  };

  window.advanceTime = (ms) => {
    if (state.running && ms > 0) {
      state.elapsed += ms / 1000;
      timeDisplay.textContent = Math.floor(state.elapsed);
    }
    draw();
  };

  /* ── INIT ── */
  resizeCanvas();
  draw();
})();
</script>
</body>
</html>
