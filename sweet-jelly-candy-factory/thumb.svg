<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="candyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="60%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#candyGrad)"/>

  <!-- Conveyor Belt -->
  <rect x="0" y="140" width="400" height="60" rx="10" fill="#475569"/>
  <line x1="0" y1="140" x2="400" y2="140" stroke="#334155" stroke-width="4"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#334155" stroke-width="4"/>

  <!-- Target Zone -->
  <circle cx="200" cy="170" r="32" fill="rgba(253,224,71,0.25)" stroke="#fde047" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Jellies -->
  <g transform="translate(100, 170)">
    <circle cx="0" cy="0" r="22" fill="#ef4444"/>
    <circle cx="-6" cy="-6" r="5" fill="#fff" opacity="0.8"/>
    <text x="0" y="7" font-size="18" text-anchor="middle">🍓</text>
  </g>
  <g transform="translate(200, 170)" filter="url(#glow)">
    <circle cx="0" cy="0" r="24" fill="#eab308"/>
    <circle cx="-6" cy="-6" r="6" fill="#fff" opacity="0.9"/>
    <text x="0" y="8" font-size="20" text-anchor="middle">🍋</text>
  </g>
  <g transform="translate(300, 170)">
    <circle cx="0" cy="0" r="22" fill="#3b82f6"/>
    <circle cx="-6" cy="-6" r="5" fill="#fff" opacity="0.8"/>
    <text x="0" y="7" font-size="18" text-anchor="middle">🫐</text>
  </g>

  <!-- Title Badge -->
  <rect x="55" y="240" width="290" height="42" rx="21" fill="rgba(131, 24, 67, 0.9)" stroke="#fde047" stroke-width="1.5"/>
  <text x="200" y="267" fill="#fde047" font-family="'Pretendard', sans-serif" font-size="15" font-weight="900" text-anchor="middle">🍬 달콤 젤리 사탕 공장</text>
</svg>
