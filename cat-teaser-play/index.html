<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>고양이 낚싯대 놀이</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: #2c1f3d;
    color: #fff;
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 10px 12px 8px; gap: 8px;
    margin: 0 auto;
  }
  h1 {
    font-size: clamp(20px, 5.5vw, 28px);
    text-align: center;
    color: #ffd6e8;
    text-shadow: 0 0 14px rgba(255,182,213,0.4);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 14px;
  }
  #gameArea {
    position: relative;
    flex: 1;
    border-radius: 18px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #6a4c93 0%, #3d2a5c 55%, #221733 100%);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.55);
    perspective: 700px;
    perspective-origin: 50% 70%;
    touch-action: none;
    outline: none;
    cursor: grab;
  }
  /* 방 바닥: perspective + rotateX 로 원근 바닥 표현 (기존 diving-board-jump 기법 재사용) */
  .room-floor {
    position: absolute;
    left: -20%; right: -20%; bottom: 0;
    height: 46%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 40px, transparent 40px 80px),
      linear-gradient(180deg, rgba(122,90,168,0.35), rgba(40,26,64,0.65));
    transform: rotateX(62deg) translateZ(-30px);
    transform-origin: 50% 100%;
    opacity: 0.8;
  }
  /* 고양이: 그림자+본체 레이어 분리, translate 로 좌표 이동 */
  .cat {
    position: absolute;
    left: 0; top: 0;
    width: 58px; height: 58px;
    margin: -29px 0 0 -29px;
    transform-style: preserve-3d;
    will-change: transform;
    z-index: 3;
  }
  .cat-wrap {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    animation: catBob 0.6s ease-in-out infinite;
  }
  .cat-shadow {
    position: absolute;
    left: 8px; right: 8px; bottom: -6px;
    height: 12px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(0,0,0,0.5), transparent 72%);
    filter: blur(3px);
    transform: translateZ(-20px);
  }
  .cat-emoji {
    position: absolute; inset: 0;
    font-size: 46px;
    display: flex; align-items: center; justify-content: center;
    transform: translateZ(12px);
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.3));
    transition: transform 0.12s ease-out;
  }
  @keyframes catBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* 깃털 낚싯대: 손가락/마우스가 이끄는 목표 지점 */
  .feather {
    position: absolute;
    left: 0; top: 0;
    width: 36px; height: 36px;
    margin: -18px 0 0 -18px;
    font-size: 32px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.35));
    z-index: 4;
    transition: transform 0.05s linear;
  }

  .yarn {
    position: absolute;
    width: 36px; height: 36px;
    margin: -18px 0 0 -18px;
    font-size: 32px;
    display: flex; align-items: center; justify-content: center;
    animation: yarnPulse 1s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes yarnPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  .yarn.caught { animation: yarnPop 0.28s forwards; }
  @keyframes yarnPop { to { opacity: 0; transform: scale(1.9); } }
  .yarn.fading { animation: yarnFade 0.35s forwards; }
  @keyframes yarnFade { to { opacity: 0; transform: scale(0.4); } }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(30,15,45,0.84);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay-card {
    background: rgba(60,38,84,0.95);
    border-radius: 18px;
    padding: 24px 28px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.5);
  }
  .overlay-card h2 { color: #ffd6e8; margin-bottom: 10px; font-size: 22px; }
  .overlay-card p { color: #f0dcff; font-size: 14px; margin-bottom: 16px; line-height: 1.5; }
  .btn-start {
    min-height: 44px;
    padding: 10px 26px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#ffb6d5,#ff8fb3);
    color: #4a1030;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
  }
  .result-score { font-size: 40px; font-weight: 900; color: #ffd166; margin: 8px 0; }
  footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #d9c2ec; }
  .home-link { color: #ffd6e8; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    .cat-wrap, .yarn { animation: none; }
  }
</style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🧶 고양이 낚싯대 놀이 — 드래그로 깃털을 움직여 고양이를 실뭉치로 이끄는 놀이, 40초 도전 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🧶 고양이 낚싯대 놀이 | 장윤이 게임 놀이터">
<meta property="og:description" content="🧶 고양이 낚싯대 놀이 — 드래그로 깃털을 움직여 고양이를 실뭉치로 이끄는 놀이, 40초 도전 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
<div class="wrap">
  <h1>🧶 고양이 낚싯대 놀이</h1>
  <div class="hud">
    <div>모은 실뭉치: <span id="score">0</span></div>
    <div>최고: <span id="best">0</span></div>
    <div>시간: <span id="timeLeft">40</span>초</div>
  </div>

  <div id="gameArea" tabindex="0">
    <div class="room-floor"></div>
    <div class="cat" id="cat">
      <div class="cat-wrap">
        <div class="cat-shadow"></div>
        <div class="cat-emoji">🐱</div>
      </div>
    </div>
    <div class="feather" id="feather">🪶</div>

    <div class="overlay" id="startOverlay">
      <div class="overlay-card">
        <h2>🧶 고양이 낚싯대 놀이</h2>
        <p>화면을 손가락으로 눌러 드래그하면<br>깃털이 움직여요. 고양이를 실뭉치🧶<br>있는 곳으로 이끌어 주세요!<br>40초 동안 최대한 많이 모아보세요!</p>
        <button class="btn-start" id="startBtn">시작!</button>
      </div>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <div class="overlay-card">
        <h2>🎉 게임 종료!</h2>
        <div class="result-score" id="finalScore">0</div>
        <p id="resultMsg"></p>
        <button class="btn-start" id="restartBtn">다시 하기</button>
      </div>
    </div>
  </div>

  <footer>
    <small>화면을 드래그해서 고양이를 이끌어보세요</small>
    <a class="home-link" href="../index.html">← 홈으로</a>
  </footer>
</div>

<script>
(function () {
  'use strict';
  const CONFIG = {
    DURATION: 40,
    CAT_LERP: 0.09,
    CATCH_RADIUS: 32,
    MAX_YARN: 2,
    SPAWN_CHECK_MS: 900,
    YARN_LIFETIME_MS: 5000,
    EDGE_PAD: 26
  };

  const gameArea = document.getElementById('gameArea');
  const catEl = document.getElementById('cat');
  const featherEl = document.getElementById('feather');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const timeEl = document.getElementById('timeLeft');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const resultMsgEl = document.getElementById('resultMsg');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  const BEST_KEY = 'cat-teaser-play_best';
  bestEl.textContent = localStorage.getItem(BEST_KEY) || '0';

  let state = null;
  let dragging = false;
  let lastTime = 0;

  function pointerToXY(e) {
    const rect = gameArea.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    x = Math.max(CONFIG.EDGE_PAD, Math.min(rect.width - CONFIG.EDGE_PAD, x));
    y = Math.max(CONFIG.EDGE_PAD, Math.min(rect.height - CONFIG.EDGE_PAD, y));
    return { x: x, y: y };
  }

  function setFeather(x, y) {
    state.featherX = x;
    state.featherY = y;
    featherEl.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }

  function spawnYarn() {
    const w = gameArea.clientWidth;
    const h = gameArea.clientHeight;
    const x = CONFIG.EDGE_PAD + Math.random() * (w - CONFIG.EDGE_PAD * 2);
    const y = CONFIG.EDGE_PAD + Math.random() * (h * 0.7 - CONFIG.EDGE_PAD);
    const el = document.createElement('div');
    el.className = 'yarn';
    el.textContent = '🧶';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    gameArea.appendChild(el);
    state.yarns.push({ el: el, x: x, y: y, spawnTime: performance.now(), resolved: false });
  }

  function removeYarn(y, animClass) {
    if (y.resolved) return;
    y.resolved = true;
    y.el.classList.add(animClass);
    setTimeout(function () { if (y.el.parentNode) y.el.parentNode.removeChild(y.el); }, 400);
    state.yarns = state.yarns.filter(function (o) { return o !== y; });
  }

  function addScore(delta) {
    state.score = Math.max(0, state.score + delta);
    scoreEl.textContent = state.score;
  }

  function trySpawn() {
    if (!state.running) return;
    if (state.yarns.length < CONFIG.MAX_YARN) spawnYarn();
  }

  function loop(now) {
    if (!state.running) return;
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    const lerp = Math.min(1, CONFIG.CAT_LERP * (dt * 60));
    state.catX += (state.featherX - state.catX) * lerp;
    state.catY += (state.featherY - state.catY) * lerp;
    catEl.style.transform = 'translate(' + state.catX + 'px,' + state.catY + 'px)';

    state.yarns.slice().forEach(function (y) {
      if (y.resolved) return;
      const dx = state.catX - y.x;
      const dy = state.catY - y.y;
      if (Math.hypot(dx, dy) < CONFIG.CATCH_RADIUS) {
        addScore(10);
        removeYarn(y, 'caught');
      } else if (now - y.spawnTime > CONFIG.YARN_LIFETIME_MS) {
        removeYarn(y, 'fading');
      }
    });

    requestAnimationFrame(loop);
  }

  function startGame() {
    state = {
      running: true,
      score: 0,
      timeLeft: CONFIG.DURATION,
      catX: gameArea.clientWidth / 2,
      catY: gameArea.clientHeight / 2,
      featherX: gameArea.clientWidth / 2,
      featherY: gameArea.clientHeight / 2 - 50,
      yarns: [],
      spawnTimer: null,
      tickTimer: null
    };
    document.querySelectorAll('.yarn').forEach(function (el) { el.remove(); });
    scoreEl.textContent = '0';
    timeEl.textContent = state.timeLeft;
    catEl.style.transform = 'translate(' + state.catX + 'px,' + state.catY + 'px)';
    setFeather(state.featherX, state.featherY);
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');

    spawnYarn();
    state.spawnTimer = setInterval(trySpawn, CONFIG.SPAWN_CHECK_MS);
    state.tickTimer = setInterval(function () {
      state.timeLeft -= 1;
      timeEl.textContent = state.timeLeft;
      if (state.timeLeft <= 0) endGame();
    }, 1000);

    lastTime = performance.now();
    gameArea.focus();
    requestAnimationFrame(loop);
  }

  function endGame() {
    state.running = false;
    clearInterval(state.spawnTimer);
    clearInterval(state.tickTimer);
    const best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    if (state.score > best) {
      localStorage.setItem(BEST_KEY, String(state.score));
      bestEl.textContent = state.score;
      resultMsgEl.textContent = '🎉 최고 기록 경신!';
    } else {
      resultMsgEl.textContent = '최고 기록: ' + best;
    }
    finalScoreEl.textContent = state.score;
    endOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  gameArea.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    dragging = true;
    if (state && state.running) {
      const p = pointerToXY(e);
      setFeather(p.x, p.y);
    }
  });
  gameArea.addEventListener('pointermove', function (e) {
    if (!dragging || !state || !state.running) return;
    const p = pointerToXY(e);
    setFeather(p.x, p.y);
  });
  window.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('pointercancel', function () { dragging = false; });
})();
</script>
</body>
</html>
