<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1f52"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </radialGradient>
    <radialGradient id="holeGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#3a1f1f"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="180" fill="url(#bg)"/>

  <!-- 미로 벽 -->
  <g fill="#4c3a86" stroke="rgba(255,255,255,0.12)">
    <rect x="20" y="46" width="140" height="10"/>
    <rect x="120" y="82" width="140" height="10"/>
    <rect x="20" y="118" width="140" height="10"/>
  </g>

  <!-- 구멍 -->
  <circle cx="188" cy="64" r="10" fill="url(#holeGrad)"/>
  <circle cx="92" cy="100" r="10" fill="url(#holeGrad)"/>

  <!-- 목표 별 -->
  <g transform="translate(60,140)">
    <path d="M0,-14 L3.3,-4.3 L13.3,-4.3 L5.3,1.6 L8.2,11.3 L0,5.4 L-8.2,11.3 L-5.3,1.6 L-13.3,-4.3 L-3.3,-4.3 Z" fill="#facc15"/>
  </g>

  <!-- 구슬 -->
  <circle cx="45" cy="70" r="11" fill="url(#ballGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <circle cx="41" cy="66" r="3" fill="rgba(255,255,255,0.6)"/>

  <!-- 내부 경계선 -->
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- 우하단 타이틀 -->
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="22" font-weight="900" fill="#a78bfa">구슬 미로 굴리기</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="2">MARBLE ROLL</text>
  </g>
</svg>
