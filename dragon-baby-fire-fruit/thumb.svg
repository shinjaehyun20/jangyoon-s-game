<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#FFCCBC"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
    <linearGradient id="dragonGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <radialGradient id="flameGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFEE58"/>
      <stop offset="70%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#D84315"/>
    </radialGradient>
    <linearGradient id="marshmallowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="300" height="300" rx="28" fill="url(#bgGrad)"/>

  <!-- Warm background glows -->
  <circle cx="150" cy="180" r="100" fill="#FFE082" opacity="0.35"/>
  <circle cx="230" cy="120" r="60" fill="#FFAB91" opacity="0.4"/>

  <!-- Sparkles & Embers -->
  <circle cx="45" cy="80" r="4" fill="#FFD54F" opacity="0.6"/>
  <circle cx="70" cy="120" r="3" fill="#FF7043" opacity="0.5"/>
  <circle cx="260" cy="70" r="5" fill="#FFE082" opacity="0.7"/>
  <circle cx="275" cy="180" r="3" fill="#FF5722" opacity="0.6"/>

  <!-- Skewer with Marshmallow & Fruit -->
  <g transform="translate(205, 140) rotate(-20)">
    <!-- Stick -->
    <line x1="0" y1="-50" x2="0" y2="70" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
    <!-- Golden toasted marshmallow -->
    <rect x="-24" y="-35" width="48" height="38" rx="10" fill="url(#marshmallowGrad)" stroke="#FFA000" stroke-width="2"/>
    <!-- Cute smile on marshmallow -->
    <circle cx="-8" cy="-18" r="2.5" fill="#5D4037"/>
    <circle cx="8" cy="-18" r="2.5" fill="#5D4037"/>
    <path d="M -5,-10 Q 0,-6 5,-10" stroke="#5D4037" stroke-width="1.5" fill="none"/>
    <!-- Toasted Fruit (Apple) -->
    <circle cx="0" cy="20" r="18" fill="#E53935" stroke="#C62828" stroke-width="2"/>
    <ellipse cx="4" cy="8" rx="5" ry="3" fill="#66BB6A"/>
  </g>

  <!-- Playful Fire Breath Stream -->
  <path d="M 115,160 Q 150,140 185,145 Q 160,170 120,175 Z" fill="url(#flameGrad)" opacity="0.9"/>
  <circle cx="170" cy="145" r="12" fill="url(#flameGrad)"/>
  <circle cx="185" cy="138" r="7" fill="#FFEE58"/>

  <!-- Baby Dragon Character -->
  <g transform="translate(85, 180)">
    <!-- Wing -->
    <path d="M -15,-10 L -45,-38 L -30,-5 L -45,15 Z" fill="#81C784"/>

    <!-- Tail -->
    <path d="M -35,20 C -55,25 -50,45 -30,35 Z" fill="#388E3C"/>
    <polygon points="-48,32 -42,22 -38,30" fill="#FFD54F"/>

    <!-- Body -->
    <ellipse cx="0" cy="10" rx="36" ry="42" fill="url(#dragonGreen)"/>

    <!-- Tummy -->
    <ellipse cx="6" cy="14" rx="20" ry="26" fill="#FFF59D"/>

    <!-- Head -->
    <circle cx="15" cy="-22" r="28" fill="url(#dragonGreen)"/>

    <!-- Horns -->
    <polygon points="5,-46 0,-62 12,-50" fill="#FFD54F"/>
    <polygon points="22,-46 25,-62 30,-50" fill="#FFD54F"/>

    <!-- Spikes on back -->
    <polygon points="-8,-30 -16,-36 -6,-22" fill="#FFD54F"/>
    <polygon points="-16,-10 -26,-15 -14,-2" fill="#FFD54F"/>

    <!-- Mouth breathing fire -->
    <ellipse cx="38" cy="-14" rx="7" ry="9" fill="#FF7043"/>
    <ellipse cx="36" cy="-14" rx="4" ry="6" fill="#D84315"/>

    <!-- Eye -->
    <circle cx="20" cy="-28" r="6" fill="#1B5E20"/>
    <circle cx="22" cy="-30" r="2.5" fill="#FFFFFF"/>

    <!-- Rosy Cheek -->
    <circle cx="10" cy="-16" r="4.5" fill="#FF8A80" opacity="0.6"/>

    <!-- Feet -->
    <ellipse cx="-12" cy="48" rx="10" ry="6" fill="#2E7D32"/>
    <ellipse cx="14" cy="48" rx="10" ry="6" fill="#2E7D32"/>
  </g>

  <!-- Title Badge -->
  <rect x="25" y="16" width="250" height="38" rx="19" fill="#E64A19" opacity="0.95"/>
  <text x="150" y="41" font-family="'Pretendard', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🐲 아기 용 불꽃 과일 굽기</text>
</svg>
