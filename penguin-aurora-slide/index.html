<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐧 아기 펭귄의 북극 오로라 미끄럼틀</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #0B1021 0%, #1A237E 60%, #004D40 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #0A1128;
      box-shadow: 0 10px 35px rgba(0, 229, 255, 0.25);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 25, 47, 0.85);
      color: #E0F7FA;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
    }
    .home-btn {
      color: #80DEEA;
      text-decoration: none;
      font-size: 14px;
      background: rgba(0, 229, 255, 0.15);
      padding: 5px 12px;
      border-radius: 14px;
      transition: background 0.2s;
    }
    .badge {
      background: rgba(0, 229, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #00E5FF;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #050B14;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 11, 20, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(5px);
    }
    .overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #80D8FF;
      text-shadow: 0 0 16px rgba(0, 229, 255, 0.6);
    }
    .overlay p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
      color: #B2EBF2;
    }
    .btn {
      background: linear-gradient(135deg, #00E5FF 0%, #00B0FF 100%);
      color: #00363A;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../index.html" class="home-btn">🏠 홈으로</a>
      <div style="font-size: 16px;">🐧 오로라 미끄럼틀</div>
      <div class="badge" id="score-display">✨ 0점</div>
    </header>
    <canvas id="gameCanvas"></canvas>
    
    <div id="start-overlay" class="overlay">
      <h1>🐧 아기 펭귄의<br>북극 오로라 미끄럼틀!</h1>
      <p>신비로운 오로라 무지개 레일을 타고 슝슝 미끄러져요!<br>화면을 좌우로 터치하거나 드래그해 방향을 조종해요.<br>반짝이는 별가루를 획득하고 얼음 바위를 피해보세요!</p>
      <button class="btn" id="start-btn">미끄럼틀 타기! 🌌</button>
    </div>

    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h1 id="gameover-title">신나는 북극 여행 완주!</h1>
      <p id="gameover-desc">아기 펭귄이 북극 하늘 가득 별빛을 수놓았어요!</p>
      <button class="btn" id="restart-btn">다시 미끄러지기 🔄</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let W, H;
    function resize() {
      const rect = canvas.getBoundingClientRect();
      W = canvas.width = rect.width;
      H = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio Chime Engine
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playSfx(type) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'crystal') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          osc.frequency.setValueAtTime(1320, now + 0.16);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'swoosh') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.3);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {}
    }

    let state = 'START';
    let score = 0;
    let speed = 4.8;
    let animTime = 0;

    const penguin = {
      x: 0,
      targetX: 0,
      y: 0,
      radius: 24,
      tilt: 0
    };

    let items = []; // stars & ice crystals
    let obstacles = []; // ice boulders
    let particles = [];
    let bgStars = [];

    function initStars() {
      bgStars = [];
      for (let i = 0; i < 45; i++) {
        bgStars.push({
          x: Math.random() * 480,
          y: Math.random() * 800,
          size: Math.random() * 2 + 1,
          alpha: Math.random() * 0.7 + 0.3,
          speed: Math.random() * 0.5 + 0.2
        });
      }
    }

    function resetGame() {
      score = 0;
      speed = 4.8;
      animTime = 0;
      penguin.x = W / 2;
      penguin.targetX = W / 2;
      penguin.y = H - 110;
      penguin.tilt = 0;
      items = [];
      obstacles = [];
      particles = [];
      scoreDisplay.innerText = `✨ 0점`;
      initStars();
    }

    function spawnElements() {
      // Spawn star or crystal
      if (Math.random() < 0.045) {
        const isSuper = Math.random() < 0.25;
        const laneX = W * 0.2 + Math.random() * (W * 0.6);
        items.push({
          x: laneX,
          y: -30,
          radius: isSuper ? 16 : 13,
          type: isSuper ? 'crystal' : 'star',
          collected: false
        });
      }

      // Spawn Ice Boulder
      if (Math.random() < 0.02 && (obstacles.length === 0 || obstacles[obstacles.length - 1].y > 150)) {
        const obsX = W * 0.25 + Math.random() * (W * 0.5);
        obstacles.push({
          x: obsX,
          y: -40,
          radius: 20
        });
      }
    }

    function addSparkles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5 - 1,
          life: 1,
          color,
          size: Math.random() * 4 + 2
        });
      }
    }

    // Touch & Pointer controls
    let isDragging = false;
    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
      initAudio();
      isDragging = true;
      const rect = canvas.getBoundingClientRect();
      const pointerX = e.clientX - rect.left;
      penguin.targetX = Math.max(W * 0.15, Math.min(W * 0.85, pointerX));
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const pointerX = e.clientX - rect.left;
      penguin.targetX = Math.max(W * 0.15, Math.min(W * 0.85, pointerX));
    });

    window.addEventListener('pointerup', () => { isDragging = false; });
    window.addEventListener('pointercancel', () => { isDragging = false; });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.key === 'ArrowLeft') {
        penguin.targetX = Math.max(W * 0.15, penguin.targetX - 50);
      } else if (e.key === 'ArrowRight') {
        penguin.targetX = Math.min(W * 0.85, penguin.targetX + 50);
      }
    });

    startBtn.addEventListener('click', () => {
      initAudio();
      resetGame();
      state = 'PLAYING';
      startOverlay.style.display = 'none';
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      resetGame();
      state = 'PLAYING';
      gameoverOverlay.style.display = 'none';
    });

    function update() {
      if (state !== 'PLAYING') return;

      animTime += 0.05;
      speed += 0.0007;

      // Smooth Penguin tracking
      const dx = penguin.targetX - penguin.x;
      penguin.x += dx * 0.12;
      penguin.tilt = (dx * 0.02);

      // Trailing aurora stardust behind penguin
      if (Math.random() < 0.5) {
        addSparkles(penguin.x + (Math.random() - 0.5) * 16, penguin.y + penguin.radius + 6, '#00E5FF', 2);
      }

      spawnElements();

      // Update items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += speed;

        const dist = Math.hypot(penguin.x - it.x, penguin.y - it.y);
        if (dist < penguin.radius + it.radius && !it.collected) {
          it.collected = true;
          if (it.type === 'star') {
            score += 10;
            playSfx('crystal');
            addSparkles(it.x, it.y, '#FFD54F', 12);
          } else {
            score += 30;
            playSfx('crystal');
            addSparkles(it.x, it.y, '#00E5FF', 18);
          }
          scoreDisplay.innerText = `✨ ${score}점`;
        }

        if (it.y > H + 40 || it.collected) {
          items.splice(i, 1);
        }
      }

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += speed;

        const dist = Math.hypot(penguin.x - obs.x, penguin.y - obs.y);
        if (dist < penguin.radius + obs.radius - 4) {
          playSfx('hit');
          addSparkles(penguin.x, penguin.y, '#FF5252', 25);
          state = 'GAMEOVER';
          document.getElementById('gameover-desc').innerHTML = `오로라 하늘에서 반짝이는 별빛 <b>${score}점</b>을 모았어요!<br>빙하 미끄럼틀을 완주했어요! 🌌`;
          gameoverOverlay.style.display = 'flex';
          return;
        }

        if (obs.y > H + 50) {
          obstacles.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawPenguin(x, y, r, tilt) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);

      // Cute sliding belly board / sled effect
      ctx.fillStyle = '#00E5FF';
      ctx.shadowColor = '#00E5FF';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(0, r + 4, r * 0.9, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Dark Blue Penguin Body
      ctx.fillStyle = '#1A237E';
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.85, r, 0, 0, Math.PI * 2);
      ctx.fill();

      // White Belly
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(0, 3, r * 0.6, r * 0.72, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cute Wings (Flippers)
      ctx.fillStyle = '#1A237E';
      ctx.beginPath();
      ctx.ellipse(-r * 0.88, -2, 5, r * 0.45, Math.PI / 6, 0, Math.PI * 2);
      ctx.ellipse(r * 0.88, -2, 5, r * 0.45, -Math.PI / 6, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#212121';
      ctx.beginPath();
      ctx.arc(-7, -r * 0.45, 3.2, 0, Math.PI * 2);
      ctx.arc(7, -r * 0.45, 3.2, 0, Math.PI * 2);
      ctx.fill();

      // Eye glimmer
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(-6, -r * 0.48, 1.2, 0, Math.PI * 2);
      ctx.arc(8, -r * 0.48, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Orange Beak
      ctx.fillStyle = '#FF9100';
      ctx.beginPath();
      ctx.moveTo(-5, -r * 0.25);
      ctx.lineTo(5, -r * 0.25);
      ctx.lineTo(0, -r * 0.05);
      ctx.closePath();
      ctx.fill();

      // Warm Cozy Scarf
      ctx.fillStyle = '#FF4081';
      ctx.beginPath();
      ctx.roundRect(-r * 0.65, -r * 0.18, r * 1.3, 7, 3);
      ctx.fill();
      // Scarf tail
      ctx.fillRect(r * 0.2, -r * 0.15, 6, 14);

      ctx.restore();
    }

    function drawAuroraTrack() {
      // Flowing luminous rainbow aurora waves
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, 'rgba(0, 229, 255, 0.25)');
      grad.addColorStop(0.3, 'rgba(105, 240, 174, 0.35)');
      grad.addColorStop(0.7, 'rgba(224, 64, 251, 0.3)');
      grad.addColorStop(1, 'rgba(0, 176, 255, 0.35)');

      ctx.save();
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(W * 0.1, 0);
      ctx.bezierCurveTo(W * 0.18, H * 0.4, W * 0.05, H * 0.7, W * 0.1, H);
      ctx.lineTo(W * 0.9, H);
      ctx.bezierCurveTo(W * 0.95, H * 0.7, W * 0.82, H * 0.4, W * 0.9, 0);
      ctx.closePath();
      ctx.fill();

      // Neon Slide Rails
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.7)';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00E5FF';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(W * 0.15, 0);
      ctx.lineTo(W * 0.15, H);
      ctx.moveTo(W * 0.85, 0);
      ctx.lineTo(W * 0.85, H);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    function drawItem(it) {
      ctx.save();
      ctx.translate(it.x, it.y);

      if (it.type === 'star') {
        ctx.fillStyle = '#FFD54F';
        ctx.shadowColor = '#FFD54F';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * it.radius, -Math.sin((18 + i * 72) * Math.PI / 180) * it.radius);
          ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (it.radius * 0.5), -Math.sin((54 + i * 72) * Math.PI / 180) * (it.radius * 0.5));
        }
        ctx.closePath();
        ctx.fill();
      } else {
        // Glowing Aurora Crystal
        ctx.fillStyle = '#00E5FF';
        ctx.shadowColor = '#00E5FF';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(0, -it.radius * 1.2);
        ctx.lineTo(it.radius, 0);
        ctx.lineTo(0, it.radius * 1.2);
        ctx.lineTo(-it.radius, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawObstacle(obs) {
      ctx.save();
      ctx.translate(obs.x, obs.y);

      // Icy Blue Snow Boulder
      ctx.fillStyle = '#80DEEA';
      ctx.shadowColor = '#0097A7';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, obs.radius, 0, Math.PI * 2);
      ctx.fill();

      // Sharp ice facets
      ctx.fillStyle = '#E0F7FA';
      ctx.beginPath();
      ctx.moveTo(-obs.radius * 0.5, -obs.radius * 0.5);
      ctx.lineTo(obs.radius * 0.3, -obs.radius * 0.7);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      // Starry Space Background
      ctx.fillStyle = '#050B14';
      ctx.fillRect(0, 0, W, H);

      // Twinkling stars
      ctx.fillStyle = '#FFFFFF';
      bgStars.forEach(s => {
        ctx.globalAlpha = s.alpha + Math.sin(animTime * s.speed * 2) * 0.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Draw Aurora Rainbow Track
      drawAuroraTrack();

      // Draw items
      items.forEach(drawItem);

      // Draw obstacles
      obstacles.forEach(drawObstacle);

      // Draw Penguin
      drawPenguin(penguin.x, penguin.y, penguin.radius, penguin.tilt);

      // Draw particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      update();
      requestAnimationFrame(render);
    }

    resetGame();
    render();
  </script>
</body>
</html>
