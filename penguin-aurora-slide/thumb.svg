<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1021"/>
      <stop offset="50%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#004D40"/>
    </linearGradient>
    <linearGradient id="auroraWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#69F0AE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E040FB" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#auroraBg)"/>
  
  <!-- Aurora Waves -->
  <path d="M 0 100 Q 50 60 100 110 T 200 80 L 200 160 Q 150 180 100 140 T 0 160 Z" fill="url(#auroraWave)"/>
  
  <!-- Sparkling Background Stars -->
  <circle cx="35" cy="40" r="2" fill="#FFF" opacity="0.9"/>
  <circle cx="165" cy="35" r="2.5" fill="#FFF" opacity="0.9"/>
  <circle cx="120" cy="25" r="1.5" fill="#80D8FF"/>
  <circle cx="80" cy="70" r="1.5" fill="#FFF"/>

  <!-- Sliding Baby Penguin -->
  <g transform="translate(100, 115)">
    <!-- Cyan Aurora Sled Glow -->
    <ellipse cx="0" cy="26" rx="28" ry="7" fill="#00E5FF" opacity="0.7"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="22" ry="26" fill="#1A237E"/>
    <!-- White Belly -->
    <ellipse cx="0" cy="4" rx="15" ry="18" fill="#FFFFFF"/>
    
    <!-- Flippers -->
    <ellipse cx="-23" cy="-2" rx="4" ry="11" fill="#1A237E" transform="rotate(25 -23 -2)"/>
    <ellipse cx="23" cy="-2" rx="4" ry="11" fill="#1A237E" transform="rotate(-25 23 -2)"/>

    <!-- Eyes -->
    <circle cx="-6" cy="-11" r="3" fill="#212121"/>
    <circle cx="6" cy="-11" r="3" fill="#212121"/>
    <circle cx="-5" cy="-12" r="1" fill="#FFF"/>
    <circle cx="7" cy="-12" r="1" fill="#FFF"/>

    <!-- Beak -->
    <polygon points="-4,-6 4,-6 0,-1" fill="#FF9100"/>

    <!-- Cozy Pink Scarf -->
    <rect x="-16" y="-5" width="32" height="6" rx="3" fill="#FF4081"/>
    <rect x="5" y="-3" width="6" height="12" rx="2" fill="#FF4081"/>
  </g>

  <!-- Glowing Star Item -->
  <g transform="translate(155, 140)">
    <polygon points="0,-12 3,-3 12,-3 5,2 7,11 0,6 -7,11 -5,2 -12,-3 -3,-3" fill="#FFD54F"/>
    <circle cx="0" cy="0" r="3" fill="#FFF"/>
  </g>
</svg>
