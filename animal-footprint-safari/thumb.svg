<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="safariBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="318" height="178" rx="18" fill="url(#safariBg)" stroke="#34d399" stroke-width="2"/>
  <!-- Decorative jungle leaves background -->
  <path d="M0,0 Q60,30 20,80 Q-10,30 0,0 Z" fill="#047857" opacity="0.3"/>
  <path d="M300,10 Q280,70 320,100 Z" fill="#047857" opacity="0.3"/>

  <!-- Right side: Footprints & Safari Magnifier -->
  <g transform="translate(180, 25)">
    <!-- Sand / Path patch -->
    <ellipse cx="60" cy="70" rx="55" ry="45" fill="#fef3c7" opacity="0.25"/>
    
    <!-- Animal Paw Print 1 (Tiger/Cat) -->
    <g fill="#fde047" opacity="0.9">
      <ellipse cx="45" cy="50" rx="12" ry="10"/>
      <circle cx="35" cy="35" r="4"/>
      <circle cx="43" cy="32" r="4.5"/>
      <circle cx="51" cy="34" r="4.5"/>
      <circle cx="57" cy="38" r="3.8"/>
    </g>

    <!-- Bird / Duck print -->
    <g stroke="#34d399" stroke-width="3" stroke-linecap="round">
      <line x1="85" y1="85" x2="85" y2="70"/>
      <line x1="85" y1="78" x2="75" y2="65"/>
      <line x1="85" y1="78" x2="95" y2="65"/>
      <line x1="85" y1="78" x2="85" y2="60"/>
    </g>

    <!-- Magnifying Glass -->
    <circle cx="52" cy="50" r="30" fill="none" stroke="#fbbf24" stroke-width="5"/>
    <circle cx="52" cy="50" r="26" fill="#67e8f9" opacity="0.25"/>
    <line x1="74" y1="72" x2="105" y2="103" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
    <line x1="74" y1="72" x2="105" y2="103" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <!-- Glass reflection -->
    <path d="M38,36 A20,20 0 0,1 66,36" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Left side: Typography -->
  <g font-family="Pretendard, Noto Sans KR, sans-serif" font-weight="700" fill="#f8fafc">
    <text x="18" y="46" font-size="20" fill="#a7f3d0">신비한</text>
    <text x="18" y="76" font-size="22" fill="#ffffff">동물 발자국 사파리</text>
    <rect x="18" y="94" width="70" height="22" rx="6" fill="url(#badgeGrad)"/>
    <text x="53" y="109" font-size="11" font-weight="800" fill="#022c22" text-anchor="middle">초1 국어</text>
    <text x="18" y="140" font-size="11" fill="#d1fae5">발자국을 돋보기로 보고</text>
    <text x="18" y="156" font-size="11" fill="#d1fae5">동물 낱말을 맞춰요!</text>
  </g>
</svg>
