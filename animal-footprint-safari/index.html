<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신비한 동물 발자국 사파리 - 초1 국어 탐구</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100vh; height: 100dvh; overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #064e3b, #022c22 90%);
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    color: #f8fafc; touch-action: manipulation; user-select: none;
    display: flex; justify-content: center; align-items: center;
  }
  .wrap {
    width: 100%; max-width: 480px; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 10px 12px; position: relative; overflow-y: auto;
  }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(6, 78, 59, 0.9); border: 1.5px solid rgba(52, 211, 153, 0.4);
    border-radius: 14px; padding: 8px 12px; flex-shrink: 0; gap: 6px;
  }
  .home-link {
    color: #a7f3d0; text-decoration: none; font-size: 14px; font-weight: 800;
    padding: 8px 10px; border-radius: 10px; background: rgba(4, 120, 87, 0.7);
    min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid rgba(52, 211, 153, 0.3); transition: transform 0.1s;
  }
  .home-link:active { transform: scale(0.95); }
  .hud-metrics { display: flex; gap: 8px; font-size: 14px; font-weight: 800; }
  .metric-box {
    background: rgba(2, 44, 34, 0.9); padding: 6px 10px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .metric-box span { color: #fde047; }
  .hud-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: rgba(2, 44, 34, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);
    color: #f8fafc; font-size: 16px; border-radius: 10px; min-width: 44px; min-height: 44px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }

  .stage {
    flex: 1; margin: 8px 0; border-radius: 18px;
    border: 2px solid #34d399; background: rgba(6, 78, 59, 0.8);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 12px; position: relative; overflow: hidden;
  }
  .stage-header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
  }
  .stage-title { font-size: 15px; font-weight: 900; color: #fde047; }
  .clue-badge {
    background: rgba(2, 44, 34, 0.85); color: #6ee7b7; font-size: 12px;
    font-weight: 800; padding: 4px 10px; border-radius: 8px; border: 1px solid #10b981;
  }

  .safari-trail {
    position: relative; width: 100%; max-width: 340px; height: 230px;
    background: radial-gradient(circle, #fef3c7 10%, #d97706 90%);
    border-radius: 16px; border: 3px solid #b45309;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.35);
    display: flex; justify-content: center; align-items: center; overflow: hidden;
  }
  #footprintSvg { width: 100%; height: 100%; }

  .animal-reveal {
    position: absolute; inset: 0; background: rgba(6, 78, 59, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    z-index: 20;
  }
  .animal-reveal.show { opacity: 1; pointer-events: auto; }
  .reveal-emoji { font-size: 68px; animation: bounce 0.6s infinite alternate; }
  .reveal-name { font-size: 26px; font-weight: 900; color: #fde047; margin-top: 6px; }
  .reveal-sfx { font-size: 14px; font-weight: 800; color: #a7f3d0; margin-top: 4px; }

  @keyframes bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-10px) scale(1.08); }
  }

  .clue-box {
    width: 100%; background: rgba(2, 44, 34, 0.9); border-radius: 12px;
    padding: 8px 12px; border: 1.5px solid rgba(52, 211, 153, 0.3);
    text-align: center; font-size: 13px; font-weight: 800; color: #e2e8f0;
  }
  .clue-box span { color: #fde047; }

  .choice-grid {
    width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-shrink: 0;
  }
  .choice-btn {
    background: rgba(2, 44, 34, 0.95); border: 2px solid #10b981;
    color: #ffffff; font-size: 17px; font-weight: 900; border-radius: 14px;
    padding: 12px 8px; cursor: pointer; min-height: 52px;

    transition: transform 0.12s, border-color 0.12s, background-color 0.12s;
  }
  .choice-btn:active { transform: scale(0.95); }
  .choice-btn.correct {
    background: #047857; border-color: #fde047;
    box-shadow: 0 0 14px rgba(253, 224, 71, 0.7);
  }
  .choice-btn.wrong {
    background: #7f1d1d; border-color: #f87171;
  }

  .overlay {
    position: absolute; inset: 0; background: rgba(2, 44, 34, 0.95);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 24px; border-radius: 18px; z-index: 50; text-align: center; gap: 16px;

  .overlay.hidden { display: none; }
  .overlay-badge { font-size: 54px; }
  .overlay-title { font-size: 24px; font-weight: 900; color: #fde047; }
  .overlay-desc { font-size: 14px; color: #d1fae5; line-height: 1.6; }
  .btn-primary {
    background: linear-gradient(135deg, #10b981, #059669); color: #ffffff;
    font-size: 16px; font-weight: 900; border: none; border-radius: 14px;
    padding: 12px 28px; cursor: pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);

  }

  @media (max-width: 420px) {

    .safari-trail { height: 190px; }
    .choice-btn { font-size: 15px; min-height: 48px; padding: 8px 4px; }
    .stage { padding: 8px; margin: 4px 0; }
  }
  @media (max-height: 640px) {

    .stage { padding: 6px; margin: 4px 0; }
    .clue-box { font-size: 11px; padding: 4px 8px; }
    .choice-btn { font-size: 14px; min-height: 44px; padding: 6px 4px; }

</style>
</head>
<body>

<script>
(function() {
  // Web Audio Synth
  let audioCtx = null;
  let muted = false;
  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, dur, type = 'sine') {
    if (muted) return;
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  }

  function playSuccess() {
    playTone(587.33, 0.1, 'sine'); // D5
    setTimeout(() => playTone(739.99, 0.12, 'sine'), 80); // F#5
    setTimeout(() => playTone(880.00, 0.2, 'sine'), 160); // A5
  }

  function playWrong() {
    playTone(220, 0.15, 'sawtooth');
  }

    const melody = [523.25, 659.25, 783.99, 1046.5];

            <!-- 4 slender fingers with round tips -->
            <line x1="150" y1="120" x2="115" y2="85" />
            <circle cx="115" cy="85" r="4.5" />
            <line x1="150" y1="120" x2="135" y2="70" />
            <circle cx="135" cy="70" r="4.5" />
            <line x1="150" y1="120" x2="165" y2="70" />
            <circle cx="165" cy="70" r="4.5" />
            <line x1="150" y1="120" x2="185" y2="85" />
            <circle cx="185" cy="85" r="4.5" />
          </g>
        `;
      },
      choices: ['개구리', '호랑이', '토끼', '펭귄']
    },
    {
      id: 'squirrel',
      name: '다람쥐',
      emoji: '🐿️',
      sfx: '쪼르르! 볼에 도토리를 가득 물고 달려요',
      terrain: '🍂 낙엽 쌓인 오솔길',
      clue: '힌트: 작고 가느다란 발가락 5개! 도토리를 모으는 귀요미.',
      drawFootprint: function(svg) {
        svg.innerHTML = `
          <g stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="#78350f">
            <!-- Mini paired tracks -->
            <!-- Front left -->
            <circle cx="120" cy="120" r="5" />
            <line x1="120" y1="120" x2="105" y2="100" />
            <line x1="120" y1="120" x2="115" y2="95" />
            <line x1="120" y1="120" x2="128" y2="95" />
            <line x1="120" y1="120" x2="138" y2="102" />
            <!-- Front right -->
            <circle cx="170" cy="115" r="5" />
            <line x1="170" y1="115" x2="155" y2="95" />
            <line x1="170" y1="115" x2="165" y2="90" />
            <line x1="170" y1="115" x2="178" y2="90" />
            <line x1="170" y1="115" x2="188" y2="97" />
          </g>
        `;
      },
      choices: ['다람쥐', '곰', '코끼리', '악어']
    }
  ];

  // Game State
  const state = {
    qIdx: 0,
    score: 0,
    answered: false
  };

  // Elements
  const qVal = document.getElementById('qVal');
  const scoreVal = document.getElementById('scoreVal');
  const trailTheme = document.getElementById('trailTheme');
  const stepBadge = document.getElementById('stepBadge');
  const footprintSvg = document.getElementById('footprintSvg');
  const animalReveal = document.getElementById('animalReveal');
  const revealEmoji = document.getElementById('revealEmoji');
  const revealName = document.getElementById('revealName');
  const revealSfx = document.getElementById('revealSfx');
  const clueText = document.getElementById('clueText');
  const choiceGrid = document.getElementById('choiceGrid');
  const startOverlay = document.getElementById('startOverlay');
  const clearOverlay = document.getElementById('clearOverlay');
  const clearSummary = document.getElementById('clearSummary');
  const muteBtn = document.getElementById('muteBtn');
  const clueBtn = document.getElementById('clueBtn');

  function loadQuestion(idx) {
    state.qIdx = idx;
    state.answered = false;
    qVal.textContent = String(idx + 1);
    stepBadge.textContent = `단서 ${idx + 1}`;

    const q = ANIMALS[idx];
    trailTheme.textContent = q.terrain;
    clueText.textContent = q.clue;

    // Reset reveal
    animalReveal.classList.remove('show');

    // Draw footprint SVG
    q.drawFootprint(footprintSvg);

    // Render choice buttons
    choiceGrid.innerHTML = '';
    q.choices.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = ch;
      btn.addEventListener('click', () => handleChoice(ch, btn, q));
      choiceGrid.appendChild(btn);
    });
  }

  function handleChoice(selected, btnEl, q) {
    if (state.answered) return;
    state.answered = true;

    if (selected === q.name) {
      // Correct!
      btnEl.classList.add('correct');
      state.score += 10;
      scoreVal.textContent = String(state.score);
      playSuccess();

      // Reveal animal
      revealEmoji.textContent = q.emoji;
      revealName.textContent = q.name;
      revealSfx.textContent = q.sfx;
      animalReveal.classList.add('show');
      clueText.innerHTML = `정답입니다! <span>[${q.name}]</span>의 발자국이었어요! 🎉`;

      setTimeout(() => {
        if (state.qIdx + 1 < ANIMALS.length) {
          loadQuestion(state.qIdx + 1);
        } else {
          // Finished all!
          playFanfare();
          clearSummary.textContent = `10종의 동물 발자국을 모두 찾아냈어요! 총 점수: ${state.score}점`;
          clearOverlay.classList.remove('hidden');
        }
      }, 1500);
    } else {
      // Wrong!
      btnEl.classList.add('wrong');
      playWrong();
      clueText.innerHTML = `아쉬워요! 다시 한번 힌트를 자세히 살펴볼까요? 🔍`;

      // Allow retry
      setTimeout(() => {
        btnEl.classList.remove('wrong');
        state.answered = false;
      }, 700);
    }
  }

  // Clue Magnifier
  clueBtn.addEventListener('click', () => {
    const q = ANIMALS[state.qIdx];
    playTone(520, 0.1, 'sine');
    clueText.innerHTML = `🔎 돋보기 관찰: <span>${q.sfx}</span>`;
  });

  // Mute
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  function startGame() {
    startOverlay.classList.add('hidden');
    clearOverlay.classList.add('hidden');
    state.score = 0;
    scoreVal.textContent = '0';
    loadQuestion(0);
    playTone(523.25, 0.15, 'sine');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
