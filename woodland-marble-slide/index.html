<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌲 숲속 구슬길 퍼즐 — 후보</title>
<style>
:root{--ink:#37200f;--wood:#75421e;--wood2:#b9783f;--cream:#ffe2a2;--path:#f6d486;--green:#72d646;--accent:#ffd44d}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100vh;height:100dvh;overflow:hidden;background:#251309;color:#fff;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;user-select:none}.app{max-width:480px;height:100vh;height:100dvh;margin:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 50% 0,#784326,#251309 65%)}h1{text-align:center;font-size:clamp(20px,5.6vw,27px);letter-spacing:-1px;text-shadow:0 2px #301406}.hud{display:flex;justify-content:space-around;padding:7px;background:#ffffff17;border:1px solid #ffffff1f;border-radius:14px}.stat{text-align:center}.label{font-size:11px;opacity:.74}.value{font-size:20px;color:var(--accent);font-weight:900}.mission{text-align:center;min-height:20px;color:#ffe8ae;font-weight:800;font-size:14px}.game{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.frame{width:min(94vw,430px,64vh);aspect-ratio:1;padding:11px;border:8px solid #4b2711;border-radius:18px;background:linear-gradient(135deg,#a66232,#563017);box-shadow:inset 0 0 0 3px #d89858,0 10px 24px #0008}.board{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:3px;background:#2b1308;padding:4px;border-radius:7px}.tile{position:relative;overflow:hidden;border-radius:5px;border:1px solid #3b1d0b;background:linear-gradient(135deg,#f1c878,#b87a3d);box-shadow:inset 2px 2px #ffe7a7,inset -2px -2px #80501f;cursor:pointer;transition:transform .16s ease,filter .16s ease}.tile:active{transform:scale(.95)}.tile.fixed{cursor:default;filter:saturate(.82)}.tile.empty{background:#241107;box-shadow:inset 1px 1px #0009;border-color:#1a0b03}.tile.empty:after{content:'↔';position:absolute;inset:0;display:grid;place-items:center;color:#ffffff27;font-size:23px}.tile svg{width:100%;height:100%;display:block}.tile .ball{position:absolute;width:18%;aspect-ratio:1;border-radius:50%;left:42%;top:42%;background:radial-gradient(circle at 30% 28%,#fff,#e5e5e5 38%,#7d8a92 70%);box-shadow:0 1px 4px #0008;opacity:0;z-index:3}.tile.start .ball{opacity:1}.tile.end{background:linear-gradient(135deg,#8ade55,#3e932e)}.tile.end:after{content:'🏁';position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(17px,6vw,30px);filter:drop-shadow(0 1px #fff8)}.tile.start:after{content:'🚂';position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(17px,6vw,30px);filter:drop-shadow(0 1px #fff8)}.tile.hint{animation:hint .65s ease-in-out 3;outline:3px solid #fff25b;z-index:2}@keyframes hint{50%{transform:scale(1.08);filter:brightness(1.2)}}.tile.success{animation:flash .35s ease-in-out 4}@keyframes flash{50%{filter:brightness(1.55);transform:scale(1.03)}}.controls{display:flex;gap:8px}.controls button{flex:1;min-height:46px;border:0;border-radius:12px;background:#ffffff18;color:white;font-size:15px;font-weight:900;cursor:pointer}.controls button.primary{background:var(--accent);color:#4a260a;box-shadow:0 3px #bd8823}.controls button:active{transform:translateY(2px)}footer{display:flex;align-items:center;justify-content:space-between;font-size:12px;opacity:.8}.home{color:#ffdc76;text-decoration:none;padding:6px 9px;min-height:34px;display:flex;align-items:center}.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:#160a04d9}.overlay.hidden{display:none}.card{width:min(340px,100%);padding:25px 22px;border-radius:22px;text-align:center;background:linear-gradient(150deg,#8b4f28,#3d1e0d);border:2px solid #ffc46b55;box-shadow:0 14px 38px #000a}.card h2{font-size:27px;margin-bottom:11px}.card p{font-size:16px;line-height:1.65;margin-bottom:19px}.card strong{color:#ffe375}.big{font-size:48px;color:#ffe36c;font-weight:900;margin:6px}.start{width:100%;min-height:56px;border:0;border-radius:15px;background:var(--accent);color:#4b280b;font-size:21px;font-weight:900;box-shadow:0 4px #b77d1c}.start:active{transform:translateY(3px);box-shadow:0 1px #b77d1c}@media(max-height:620px){.app{gap:5px;padding-top:6px}.hud{padding:4px}.mission{font-size:12px}.controls button{min-height:38px}h1{font-size:20px}}
</style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🪵 숲속 구슬길 — 나무 블록과 숲속 길을 이리저리 슬라이드해 구슬이 🏁 결승점까지 굴러가도록 경로를 완성하세요! 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🪵 숲속 구슬길 | 장윤이 게임 놀이터">
<meta property="og:description" content="🪵 숲속 구슬길 — 나무 블록과 숲속 길을 이리저리 슬라이드해 구슬이 🏁 결승점까지 굴러가도록 경로를 완성하세요! 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
<div class="app">
<h1>🌲 숲속 구슬길 퍼즐 <small style="font-size:11px;color:#ffd56a">후보</small></h1>
<div class="hud"><div class="stat"><div class="label">스테이지</div><div class="value" id="level">1</div></div><div class="stat"><div class="label">움직임</div><div class="value" id="moves">0</div></div><div class="stat"><div class="label">최고 별</div><div class="value" id="best">0</div></div></div>
<div class="mission" id="mission">빈칸 옆 레일 블록을 밀어 구슬길을 이어요!</div>
<div class="game"><div class="frame"><div class="board" id="board" aria-label="구슬길 퍼즐판"></div></div></div>
<div class="controls"><button id="hintBtn">💡 한 칸 힌트</button><button class="primary" id="resetBtn">↻ 다시 섞기</button></div>
<footer><small>빈칸과 맞닿은 블록만 움직일 수 있어요.</small><a class="home" href="../../index.html">← 홈으로</a></footer>
</div>
<div class="overlay" id="startOverlay"><div class="card"><h2>🌲 숲속 구슬길</h2><p>나무 레일 블록을 <strong>빈칸으로 밀어</strong><br>🚂에서 🏁까지 구슬이 갈 길을 만들어 주세요.<br>레일이 이어지면 구슬이 출발해요!</p><button class="start" id="startBtn">퍼즐 시작! ✨</button></div></div>
<div class="overlay hidden" id="endOverlay"><div class="card"><h2>🎉 길이 완성됐어요!</h2><div class="big" id="resultStars">⭐⭐⭐</div><p id="resultText">구슬이 무사히 도착했어요!</p><button class="start" id="nextBtn">다음 숲길 🌲</button></div></div>
<script>
(()=>{'use strict';
const N=1,E=2,S=4,W=8,DIR={1:[0,-1],2:[1,0],4:[0,1],8:[-1,0]},OP={1:4,2:8,4:1,8:2};
const rail=(id,links,extra='')=>({id,links,fixed:false,...extra});
const BASE=[
 {id:'start',links:E,fixed:true,kind:'start'}, rail('a',W|E),rail('b',W|S),rail('c',N|S),
 rail('d',E|S),rail('e',W|E),rail('f',N|W),rail('g',N|S),
 rail('h',N|E),rail('i',W|E),rail('j',W|S),rail('k',W|E),
 null,rail('m',N|S),rail('n',N|E),{id:'end',links:W,fixed:true,kind:'end'}
];
const SCRAMBLES=[[15,14,13,9,5,6,10,11,7,3,2,1,5,9,13,14],[15,11,10,6,5,9,13,14,10,6,5,1,2,3,7,11],[15,14,13,9,5,1,2,6,10,14,13,9,5,1,2,6]];
let state={level:0,tiles:[],moves:0,playing:false,best:+localStorage.getItem('woodland-marble-slide_best')||0};
const $=id=>document.getElementById(id),board=$('board');
function cloneBase(){return BASE.map(x=>x?{...x}:null)}
function init(level){state.level=level%3;state.tiles=cloneBase();state.moves=0;state.playing=true;const seq=SCRAMBLES[state.level];for(const target of seq){const empty=state.tiles.findIndex(x=>x===null);const near=[empty-4,empty+4,empty-1,empty+1].filter(i=>i>=0&&i<16&&Math.abs((i%4)-(empty%4))<=1);const pick=near.find(i=>i===target&&state.tiles[i]&&!state.tiles[i].fixed)||near.find(i=>state.tiles[i]&&!state.tiles[i].fixed);if(pick!==undefined)[state.tiles[empty],state.tiles[pick]]=[state.tiles[pick],state.tiles[empty]]}render();}
function svg(links){let p='';const line=(x1,y1,x2,y2)=>`<path d="M ${x1} ${y1} L ${x2} ${y2}"/>`;if((links&E)&&(links&W))p+=line(0,50,100,50);if((links&N)&&(links&S))p+=line(50,0,50,100);if((links&N)&&(links&E))p+=`<path d="M50 0V50H100"/>`;if((links&N)&&(links&W))p+=`<path d="M50 0V50H0"/>`;if((links&S)&&(links&E))p+=`<path d="M50 100V50H100"/>`;if((links&S)&&(links&W))p+=`<path d="M50 100V50H0"/>`;return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#6b3a19" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">${p}</g><g fill="none" stroke="#f9d78a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">${p}</g><g fill="none" stroke="#fff0bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${p}</g></svg>`}
function render(){board.innerHTML='';state.tiles.forEach((t,i)=>{const d=document.createElement('button');d.className='tile';d.type='button';d.dataset.index=i;if(!t)d.classList.add('empty');else{/* Safe: svg() only serializes fixed, local rail constants; no user-controlled input. */d.innerHTML=svg(t.links);if(t.fixed)d.classList.add('fixed');if(t.kind)d.classList.add(t.kind);if(t.kind==='start')d.innerHTML+=`<span class="ball"></span>`;}d.addEventListener('click',()=>move(i));board.appendChild(d)});$('level').textContent=state.level+1;$('moves').textContent=state.moves;$('best').textContent=state.best;}
function adjacent(a,b){return Math.abs(a-b)===4||(Math.floor(a/4)===Math.floor(b/4)&&Math.abs(a-b)===1)}
function move(i){if(!state.playing||!state.tiles[i]||state.tiles[i].fixed)return;const e=state.tiles.findIndex(x=>x===null);if(!adjacent(i,e)){flash(i);return}[state.tiles[i],state.tiles[e]]=[state.tiles[e],state.tiles[i]];state.moves++;render();if(connected())win();}
function flash(i){const el=board.children[i];el.classList.add('hint');setTimeout(()=>el.classList.remove('hint'),900)}
function connected(){let pos=state.tiles.findIndex(x=>x&&x.kind==='start'),dir=E,seen=new Set;for(let step=0;step<18;step++){const t=state.tiles[pos];if(!t||!(t.links&dir))return false;if(t.kind==='end')return true;const [dx,dy]=DIR[dir],next=pos+dx+dy*4;if(next<0||next>=16||Math.abs((next%4)-(pos%4))>1)return false;const nt=state.tiles[next];if(!nt||!(nt.links&OP[dir]))return false;const choices=[N,E,S,W].filter(x=>(nt.links&x)&&x!==OP[dir]);if(nt.kind==='end')return true;if(choices.length!==1)return false;pos=next;dir=choices[0];if(seen.has(pos+':'+dir))return false;seen.add(pos+':'+dir)}return false}
function win(){state.playing=false;[...board.children].forEach(x=>x.classList.add('success'));const stars=state.moves<=13?3:state.moves<=19?2:1;state.best=Math.max(state.best,stars);localStorage.setItem('woodland-marble-slide_best',state.best);setTimeout(()=>{$('resultStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('resultText').textContent=`${state.moves}번 움직여 구슬이 도착했어요!`;$('endOverlay').classList.remove('hidden')},900)}
function hint(){if(!state.playing)return;const e=state.tiles.findIndex(x=>x===null);const options=[e-4,e+4,e-1,e+1].filter(i=>i>=0&&i<16&&adjacent(i,e)&&state.tiles[i]&&!state.tiles[i].fixed);if(options.length)flash(options[Math.floor(Math.random()*options.length)])}
$('startBtn').onclick=()=>{$('startOverlay').classList.add('hidden');init(0)};$('nextBtn').onclick=()=>{$('endOverlay').classList.add('hidden');init(state.level+1)};$('resetBtn').onclick=()=>init(state.level);$('hintBtn').onclick=hint;render();
})();
</script>
</body></html>
