<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5c42"/>
      <stop offset="100%" stop-color="#0a2419"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>
  <!-- clouds -->
  <circle cx="60" cy="34" r="14" fill="rgba(255,255,255,0.08)"/>
  <circle cx="74" cy="38" r="10" fill="rgba(255,255,255,0.08)"/>
  <circle cx="230" cy="24" r="12" fill="rgba(255,255,255,0.06)"/>
  <!-- ground -->
  <rect x="0" y="160" width="320" height="20" fill="rgba(0,0,0,0.25)"/>
  <!-- bow -->
  <path d="M 42 150 A 34 34 0 0 1 42 96" fill="none" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="42" y1="96" x2="52" y2="123" stroke="#e0e0e0" stroke-width="2"/>
  <line x1="52" y1="123" x2="42" y2="150" stroke="#e0e0e0" stroke-width="2"/>
  <!-- arrow -->
  <line x1="52" y1="123" x2="100" y2="123" stroke="#ffcc02" stroke-width="4"/>
  <polygon points="100,123 92,118 92,128" fill="#ffcc02"/>
  <!-- balloons -->
  <ellipse cx="160" cy="70" rx="20" ry="24" fill="#ff6fd8"/>
  <circle cx="153" cy="62" r="6" fill="rgba(255,255,255,0.5)"/>
  <ellipse cx="220" cy="50" rx="18" ry="22" fill="#4fc3f7"/>
  <circle cx="214" cy="43" r="5" fill="rgba(255,255,255,0.5)"/>
  <ellipse cx="252" cy="100" rx="16" ry="19" fill="#ffd700" stroke="#fff" stroke-width="1.5"/>
  <text x="252" y="105" text-anchor="middle" font-size="12" fill="#fff">★</text>
  <ellipse cx="120" cy="115" rx="15" ry="18" fill="#56c870"/>
  <!-- pop sparkle -->
  <text x="190" y="95" font-size="16">✨</text>
  <!-- Title -->
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="20" font-weight="900" fill="#ffcc02">화살 풍선 맞추기</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="2">ARCHERY BALLOON</text>
  </g>
</svg>
