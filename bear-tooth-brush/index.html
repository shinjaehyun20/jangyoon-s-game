<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>곰돌이 이 닦기</title><style>
:root{--bg:#4d2f6d;--accent:#8ef0d1;--text:#fff}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text)}.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud{display:flex;justify-content:space-around;padding:8px;border-radius:12px;background:#ffffff18;font-weight:800}.value{color:var(--accent)}#gameArea{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}.message{height:23px;text-align:center;font-weight:800}.bear{position:relative;flex:1;min-height:0;border-radius:28px;background:linear-gradient(#8c5e39,#5f3820);overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 4px #ffffff1c}.ear{position:absolute;top:8%;width:24%;aspect-ratio:1;border-radius:50%;background:#704225}.ear.left{left:10%}.ear.right{right:10%}.face{position:relative;width:min(78vw,330px);aspect-ratio:1;border-radius:45%;background:#c98c58;z-index:1}.eye{position:absolute;top:28%;font-size:clamp(26px,8vw,43px)}.eye.left{left:22%}.eye.right{right:22%}.nose{position:absolute;top:43%;left:50%;transform:translateX(-50%);font-size:clamp(25px,8vw,42px)}.mouth{position:absolute;left:10%;right:10%;bottom:11%;height:38%;background:#552b40;border-radius:16px 16px 48% 48%;padding:5%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:4px;touch-action:none}.tooth{border:0;border-radius:7px;background:#d8b67d;color:#9d6738;font-size:clamp(15px,5vw,24px);font-weight:900;touch-action:none}.tooth.clean{background:#fff;color:#8ef0d1;box-shadow:0 0 11px #fff}.brush{position:absolute;z-index:3;display:none;pointer-events:none;font-size:46px;transform:translate(-30%,-70%) rotate(-25deg);filter:drop-shadow(0 3px 2px #0005)}.mainbtn{border:0;border-radius:16px;min-height:56px;width:100%;font-size:20px;font-weight:900;color:#442657;background:var(--accent)}footer{display:flex;justify-content:space-between;font-size:13px}.home-link{color:#fff}.overlay{position:fixed;inset:0;z-index:5;background:#22132dcc;display:grid;place-items:center;padding:22px}.hidden{display:none}.card{width:min(390px,100%);padding:26px 20px;border-radius:24px;text-align:center;background:linear-gradient(150deg,#764b98,#442657);box-shadow:0 10px 30px #0008}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.55;margin-bottom:18px}.result{font-size:42px;color:var(--accent);font-weight:900;margin:10px}.spark{position:absolute;animation:up .65s ease-out forwards;font-size:24px;pointer-events:none}@keyframes up{to{transform:translateY(-45px) scale(1.5);opacity:0}}
</style><!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🪥 곰돌이 이 닦기 — 드래그로 곰돌이의 이를 깨끗이 닦는 5판 생활 습관 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">

<meta property="og:description" content="🪥 곰돌이 이 닦기 — 드래그로 곰돌이의 이를 깨끗이 닦는 5판 생활 습관 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head><body><main class="wrap"><h1>🪥 곰돌이 이 닦기</h1><div class="hud"><span>깨끗한 이 <b class="value" id="score">0</b>/8</span><span>판 <b class="value" id="round">1</b>/5</span><span>기록 <b class="value" id="best">0</b></span></div><section id="gameArea"><p class="message" id="message">치아를 문질문질 깨끗하게 닦아줘요!</p><div class="bear" id="bear"><div class="ear left"></div><div class="ear right"></div><div class="face"><span class="eye left">👁</span><span class="eye right">👁</span><span class="nose">🐻</span><div class="mouth" id="mouth"></div></div><div class="brush" id="brush">🪥</div></div></section><footer><small>치아 위를 드래그해요</small><a class="home-link" href="../index.html">← 홈으로</a></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🪥 곰돌이 이 닦기</h2><p>치아 위를 손가락으로 문질문질!<br>더러운 이 8개를 깨끗하게 닦아줘요.</p><button class="mainbtn" id="startBtn">닦기 시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>✨ 반짝반짝!</h2><div class="result" id="finalScore"></div><p id="resultMsg"></p><button class="mainbtn" id="restartBtn">다시 닦기</button></div></div><script>
(()=>{'use strict';const C={teeth:8,rounds:5,passes:3};let state;const $=id=>document.getElementById(id),mouth=$('mouth'),brush=$('brush');$('best').textContent=localStorage.getItem('bear-tooth-brush_best')||0;function setup(){state={round:1,clean:0,passes:Array(C.teeth).fill(0),drag:false,total:0};$('round').textContent=1;newRound()}function newRound(){state.clean=0;state.passes=Array(C.teeth).fill(0);$('score').textContent=0;mouth.innerHTML='';for(let i=0;i<C.teeth;i++){const b=document.createElement('button');b.className='tooth';b.dataset.i=i;b.textContent='✦';mouth.append(b)}$('message').textContent='치아를 문질문질 깨끗하게 닦아줘요!'}function clean(target){if(!state.drag||!target.classList.contains('tooth')||target.classList.contains('clean'))return;const i=Number(target.dataset.i);state.passes[i]++;target.style.opacity=Math.min(1,.5+state.passes[i]/C.passes*.5);if(state.passes[i]>=C.passes){target.classList.add('clean');target.textContent='✨';state.clean++;state.total++;$('score').textContent=state.clean;const s=document.createElement('span');s.className='spark';s.textContent='✨';s.style.left=target.offsetLeft+12+'px';s.style.top=target.offsetTop+'px';mouth.append(s);setTimeout(()=>s.remove(),700);if(state.clean===C.teeth)setTimeout(next,450)}}function next(){if(state.round>=C.rounds){const best=Math.max(Number(localStorage.getItem('bear-tooth-brush_best')||0),state.total);localStorage.setItem('bear-tooth-brush_best',best);$('best').textContent=best;$('finalScore').textContent='🦷 '+state.total+'개';$('resultMsg').textContent='곰돌이 미소가 반짝반짝 빛나요!';$('endOverlay').classList.remove('hidden');return}state.round++;$('round').textContent=state.round;$('message').textContent='잘했어요! 다음 이를 닦아볼까요?';setTimeout(newRound,600)}function showBrush(e){const r=$('bear').getBoundingClientRect();brush.style.display='block';brush.style.left=(e.clientX-r.left)+'px';brush.style.top=(e.clientY-r.top)+'px'}mouth.addEventListener('pointerdown',e=>{state.drag=true;mouth.setPointerCapture(e.pointerId);showBrush(e);clean(e.target)});mouth.addEventListener('pointermove',e=>{if(!state.drag)return;showBrush(e);clean(document.elementFromPoint(e.clientX,e.clientY))});['pointerup','pointercancel'].forEach(ev=>mouth.addEventListener(ev,()=>{state.drag=false;brush.style.display='none'}));function start(){setup();$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden')}$('startBtn').addEventListener('click',start);$('restartBtn').addEventListener('click',start)})();
</script></body></html>
