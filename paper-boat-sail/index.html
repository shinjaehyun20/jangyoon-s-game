<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>종이배 항해</title>
<style>
:root{--bg:#073b59;--accent:#ffd166;--text:#fff}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text)}.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud{display:flex;justify-content:space-around;padding:8px;border-radius:12px;background:#ffffff18;font-weight:800}.value{color:var(--accent)}#river{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:20px;background:linear-gradient(90deg,#1c7785 0 9%,#38a4bd 9% 91%,#1c7785 91%);box-shadow:inset 0 0 0 3px #ffffff20}.wave{position:absolute;width:130%;height:42px;left:-15%;background:repeating-radial-gradient(ellipse at center,#ffffff20 0 6px,transparent 7px 18px);animation:flow 2s linear infinite}.gate,.rock,.star,#boat{position:absolute;transform:translate(-50%,-50%);user-select:none}.gate{width:46%;height:18px;border-top:8px solid #f3b72b;border-bottom:8px solid #f3b72b;border-radius:16px;box-shadow:0 0 12px #ffd166}.rock{font-size:clamp(26px,8vw,42px)}.star{font-size:clamp(24px,7vw,38px);filter:drop-shadow(0 0 7px #fff)}#boat{bottom:7%;left:50%;font-size:clamp(48px,15vw,72px);filter:drop-shadow(0 5px 2px #063246);transition:left .08s linear}.controls{display:flex;gap:10px}.controls button,.mainbtn{border:0;border-radius:16px;min-height:58px;font-size:21px;font-weight:900;color:#073b59;background:var(--accent);flex:1;touch-action:none}.controls button:active,.mainbtn:active{transform:scale(.97)}footer{display:flex;justify-content:space-between;font-size:13px}.home-link{color:#fff}.overlay{position:fixed;inset:0;z-index:5;background:#001d2dcc;display:grid;place-items:center;padding:22px}.overlay.hidden{display:none}.card{width:min(390px,100%);padding:26px 20px;border-radius:24px;text-align:center;background:linear-gradient(150deg,#145d79,#073b59);box-shadow:0 10px 30px #0008}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.55;margin-bottom:18px}.mainbtn{width:100%;min-height:56px}.result{font-size:44px;color:var(--accent);font-weight:900;margin:10px}.hint{height:22px;text-align:center;font-weight:800}@keyframes flow{to{transform:translateY(50px)}}
</style><!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="⛵ 종이배 항해 — 좌우로 종이배를 조종해 별을 모으고 바위를 피하는 강물 항해 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="⛵ 종이배 항해 | 장윤이 게임 놀이터">
<meta property="og:description" content="⛵ 종이배 항해 — 좌우로 종이배를 조종해 별을 모으고 바위를 피하는 강물 항해 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head><body><main class="wrap"><h1>⛵ 종이배 항해</h1><div class="hud"><span>별 <b class="value" id="score">0</b></span><span>시간 <b class="value" id="time">40</b></span><span>기록 <b class="value" id="best">0</b></span></div><section id="river" aria-label="강물 항해 구역"><div class="wave" style="top:10%"></div><div class="wave" style="top:55%;animation-delay:-1s"></div><div id="boat">⛵</div></section><p class="hint" id="hint">별을 모으며 바위와 강둑을 피하세요!</p><div class="controls"><button id="left" aria-label="왼쪽으로 조종">◀ 왼쪽</button><button id="right" aria-label="오른쪽으로 조종">오른쪽 ▶</button></div><footer><small>버튼을 꾹 눌러 조종해요</small><a class="home-link" href="../index.html">← 홈으로</a></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>⛵ 종이배 항해</h2><p>좌우 버튼을 꾹 눌러 종이배를 조종해요.<br>반짝이는 별은 모으고 바위는 피해요!</p><button class="mainbtn" id="startBtn">출발!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🎉 항해 완료!</h2><div class="result" id="finalScore">0</div><p id="resultMsg"></p><button class="mainbtn" id="restartBtn">다시 항해하기</button></div></div><script>
(()=>{'use strict';const C={duration:40,spawn:780,boatStep:2.6,bound:11};let state,timer,spawner,raf;const $=id=>document.getElementById(id),river=$('river'),boat=$('boat');$('best').textContent=localStorage.getItem('paper-boat-sail_best')||0;function reset(){state={x:50,score:0,left:false,right:false,seconds:C.duration,objects:[]};$('score').textContent=0;$('time').textContent=C.duration;boat.style.left='50%';river.querySelectorAll('.gate,.rock,.star').forEach(x=>x.remove())}function spawn(){const type=Math.random()<.45?'star':Math.random()<.7?'rock':'gate',el=document.createElement('div');el.className=type;el.textContent=type==='star'?'⭐':type==='rock'?'🪨':'';const o={el,type,x:16+Math.random()*68,y:-8,speed:1.25+Math.random()*1.15};el.style.left=o.x+'%';el.style.top=o.y+'%';river.append(el);state.objects.push(o)}function loop(){if(!state)return;if(state.left)state.x-=C.boatStep;if(state.right)state.x+=C.boatStep;state.x=Math.max(C.bound,Math.min(100-C.bound,state.x));boat.style.left=state.x+'%';state.objects=state.objects.filter(o=>{o.y+=o.speed;o.el.style.top=o.y+'%';if(o.y>112){o.el.remove();return false}if(o.y>78&&o.y<94&&Math.abs(o.x-state.x)<(o.type==='gate'?22:10)){if(o.type==='star'){state.score++;$('score').textContent=state.score;$('hint').textContent='반짝! 별을 모았어요!';o.el.remove();return false}if(o.type==='rock'){end('앗, 바위를 만났어요!');return false}if(o.type==='gate'){state.score+=2;$('score').textContent=state.score;$('hint').textContent='멋져요! 강문을 통과했어요!';o.el.remove();return false}}return true});raf=requestAnimationFrame(loop)}function end(message){cancelAnimationFrame(raf);clearInterval(timer);clearInterval(spawner);state.left=state.right=false;const best=Math.max(Number(localStorage.getItem('paper-boat-sail_best')||0),state.score);localStorage.setItem('paper-boat-sail_best',best);$('best').textContent=best;$('finalScore').textContent='⭐ '+state.score+'개';$('resultMsg').textContent=message||'끝까지 항해했어요!';$('endOverlay').classList.remove('hidden')}function start(){reset();$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');timer=setInterval(()=>{state.seconds--;$('time').textContent=state.seconds;if(!state.seconds)end()},1000);spawner=setInterval(spawn,C.spawn);loop()}[['left','left'],['right','right']].forEach(([id,key])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();state[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>state&&(state[key]=false)))});$('startBtn').addEventListener('click',start);$('restartBtn').addEventListener('click',start)})();
</script></body></html>
