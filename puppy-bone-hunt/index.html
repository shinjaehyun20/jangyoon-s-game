<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🐶 강아지 뼈다귀 찾기</title>
<style>
  :root{
    --bg:#3d2b1f;
    --accent:#f5b942;
    --text:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100vh;height:100dvh;
    overflow:hidden;
    touch-action:manipulation;
    font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
    background:linear-gradient(180deg,#5a3d28 0%,var(--bg) 100%);
    color:var(--text);
  }
  .wrap{
    width:100%;max-width:480px;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    padding:10px 12px 8px;gap:8px;
    margin:0 auto;
    position:relative;
  }
  h1{
    font-size:clamp(20px,5.5vw,28px);
    text-align:center;
    text-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .hud{
    display:flex;flex-direction:row;justify-content:space-between;
    background:rgba(255,255,255,0.12);
    border-radius:12px;
    padding:8px 14px;
    font-size:15px;font-weight:700;
  }
  .hud span{color:var(--accent);}
  #gameArea{
    flex:1;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(4, 1fr);
    gap:8px;
    border-radius:16px;
    padding:8px;
    background:#2a1c12;
  }
  .hole{
    position:relative;
    border-radius:14px;
    background:radial-gradient(ellipse at center, #1a1008 0%, #3d2b1f 70%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    touch-action:manipulation;
  }
  .dirt{
    position:absolute;inset:0;
    font-size:28px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s;
  }
  .content{
    position:absolute;
    font-size:30px;
    opacity:0;
    transform:scale(.3);
    transition:transform .15s, opacity .15s;
    pointer-events:none;
  }
  .hole.dug .dirt{ transform:scale(0) rotate(20deg); opacity:0; }
  .hole.dug .content{ opacity:1; transform:scale(1); }
  footer{
    display:flex;flex-direction:row;justify-content:space-between;align-items:center;
    font-size:12px;color:rgba(255,255,255,0.7);
  }
  .home-link{color:var(--accent);text-decoration:none;font-weight:700;}
  .overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }
  .overlay.hidden{display:none;}
  .overlay-card{
    background:#4a3320;
    border-radius:20px;
    padding:26px 22px;
    text-align:center;
    width:min(86%,340px);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .overlay-card h2{font-size:22px;margin-bottom:10px;}
  .overlay-card p{font-size:14px;margin-bottom:16px;line-height:1.5;color:rgba(255,255,255,0.85);}
  .btn-start{
    min-height:44px;
    font-size:16px;font-weight:800;
    background:var(--accent);
    color:#3d2500;
    border:none;border-radius:12px;
    padding:10px 28px;
    cursor:pointer;
  }
  .result-score{font-size:42px;font-weight:900;color:var(--accent);margin:8px 0;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>🐶 강아지 뼈다귀 찾기</h1>
    <div class="hud">
      <div>뼈다귀 <span id="score">0</span>/<span id="total">6</span></div>
      <div>시간 <span id="time">40</span>s</div>
      <div>최고 <span id="best">0</span></div>
    </div>
    <div id="gameArea"></div>
    <footer>
      <small>흙더미를 파서 숨은 뼈다귀 🦴 를 모두 찾아요! 두더지는 피해요 🦔</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>

    <div class="overlay" id="startOverlay">
      <div class="overlay-card">
        <h2>🐶 강아지 뼈다귀 찾기</h2>
        <p>흙더미 16칸 중 6개에 뼈다귀가 숨어있어요.<br>손가락으로 파서 모두 찾아보세요! 두더지 칸은 -1점.</p>
        <button class="btn-start" id="startBtn">시작!</button>
      </div>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <div class="overlay-card">
        <h2>🎉 결과 발표!</h2>
        <div class="result-score" id="finalScore">0</div>
        <p id="resultMsg"></p>
        <button class="btn-start" id="restartBtn">다시 하기</button>
      </div>
    </div>
  </div>

<script>
(function(){
  'use strict';
  const CONFIG = {
    GRID: 16,
    BONES: 6,
    MOLES: 3,
    DURATION: 40,
    STORAGE_KEY: 'puppy-bone-hunt_best'
  };

  const gameArea = document.getElementById('gameArea');
  const scoreEl = document.getElementById('score');
  const totalEl = document.getElementById('total');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const resultMsgEl = document.getElementById('resultMsg');

  totalEl.textContent = CONFIG.BONES;

  let state = {
    score: 0,
    found: 0,
    timeLeft: CONFIG.DURATION,
    running: false,
    tickTimer: null,
    cells: []
  };

  function getBest(){
    return parseInt(localStorage.getItem(CONFIG.STORAGE_KEY) || '0', 10);
  }
  function setBest(v){
    localStorage.setItem(CONFIG.STORAGE_KEY, String(v));
  }
  bestEl.textContent = getBest();

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildGrid(){
    gameArea.innerHTML = '';
    state.cells = [];

    const contents = [];
    for(let i = 0; i < CONFIG.BONES; i++) contents.push('bone');
    for(let i = 0; i < CONFIG.MOLES; i++) contents.push('mole');
    while(contents.length < CONFIG.GRID) contents.push('empty');
    shuffle(contents);

    for(let i = 0; i < CONFIG.GRID; i++){
      const hole = document.createElement('div');
      hole.className = 'hole';
      hole.dataset.type = contents[i];
      hole.dataset.dug = '0';

      const dirt = document.createElement('div');
      dirt.className = 'dirt';
      dirt.textContent = '⛰️';
      hole.appendChild(dirt);

      const content = document.createElement('div');
      content.className = 'content';
      content.textContent = contents[i] === 'bone' ? '🦴' : (contents[i] === 'mole' ? '🦔' : '🕳️');
      hole.appendChild(content);

      hole.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        digHole(hole);
      });

      gameArea.appendChild(hole);
      state.cells.push(hole);
    }
  }

  function digHole(hole){
    if(!state.running) return;
    if(hole.dataset.dug === '1') return;
    hole.dataset.dug = '1';
    hole.classList.add('dug');

    const type = hole.dataset.type;
    if(type === 'bone'){
      state.score += 1;
      state.found += 1;
    } else if(type === 'mole'){
      state.score = Math.max(0, state.score - 1);
    }
    scoreEl.textContent = state.found;

    if(state.found >= CONFIG.BONES){
      endGame(true);
    }
  }

  function tick(){
    state.timeLeft -= 1;
    timeEl.textContent = state.timeLeft;
    if(state.timeLeft <= 0){
      endGame(false);
    } else {
      state.tickTimer = setTimeout(tick, 1000);
    }
  }

  function startGame(){
    state.score = 0;
    state.found = 0;
    state.timeLeft = CONFIG.DURATION;
    state.running = true;
    scoreEl.textContent = '0';
    timeEl.textContent = String(CONFIG.DURATION);
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    buildGrid();
    state.tickTimer = setTimeout(tick, 1000);
  }

  function endGame(cleared){
    state.running = false;
    clearTimeout(state.tickTimer);

    const finalScore = state.found;
    const best = getBest();
    if(finalScore > best){
      setBest(finalScore);
      bestEl.textContent = finalScore;
      resultMsgEl.textContent = cleared ? '뼈다귀 다 찾았어요! 최고 기록! 🎉' : '최고 기록 갱신! 🎉';
    } else {
      resultMsgEl.textContent = cleared ? '뼈다귀를 모두 찾았어요! 잘했어요 🐶' : '시간 종료! 다시 도전해볼까요?';
    }
    finalScoreEl.textContent = finalScore + ' / ' + CONFIG.BONES;
    endOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(); });
  restartBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(); });
})();
</script>
</body>
</html>
