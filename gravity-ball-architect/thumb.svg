<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ball-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Grid lines -->
  <path d="M0,75 H400 M0,150 H400 M0,225 H400 M100,0 V300 M200,0 V300 M300,0 V300" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- Track Rails -->
  <path d="M 40,80 Q 120,160 180,140 T 320,220" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 40,80 Q 120,160 180,140 T 320,220" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Interactive Spring -->
  <circle cx="180" cy="140" r="16" fill="#10b981" filter="url(#glow)"/>
  <text x="180" y="145" font-size="16" text-anchor="middle" fill="#ffffff">🟢</text>

  <!-- Booster -->
  <circle cx="260" cy="180" r="16" fill="#f59e0b" filter="url(#glow)"/>
  <text x="260" y="185" font-size="16" text-anchor="middle" fill="#ffffff">🌀</text>

  <!-- Stars -->
  <text x="110" y="110" font-size="22" text-anchor="middle" filter="url(#glow)">⭐</text>
  <text x="220" y="90" font-size="22" text-anchor="middle" filter="url(#glow)">⭐</text>
  <text x="310" y="160" font-size="22" text-anchor="middle" filter="url(#glow)">⭐</text>

  <!-- Glowing Ball -->
  <circle cx="140" cy="130" r="14" fill="url(#ball-grad)" filter="url(#glow)"/>
  <circle cx="136" cy="126" r="4" fill="#ffffff"/>

  <!-- Goal Cup -->
  <rect x="300" y="210" width="40" height="30" rx="8" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="3"/>
  <text x="320" y="230" font-size="14" text-anchor="middle" fill="#ffffff">🏁</text>

  <!-- Title Badge -->
  <rect x="25" y="248" width="350" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="272" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">🧲 중력 구슬 건축가</text>
</svg>
