<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="pastelSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1c71"/>
      <stop offset="50%" stop-color="#d76d77"/>
      <stop offset="100%" stop-color="#ffaf7b"/>
    </linearGradient>
    <linearGradient id="rainbowScarf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff80ab"/>
      <stop offset="25%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#69f0ae"/>
      <stop offset="75%" stop-color="#40c4ff"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>
  </defs>

  <!-- Warm Andes Pastel Sky -->
  <rect width="400" height="300" fill="url(#pastelSky)"/>

  <!-- Soft Fluffy Clouds -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="80" cy="65" r="22"/>
    <circle cx="105" cy="62" r="26"/>
    <circle cx="130" cy="68" r="20"/>
    <circle cx="290" cy="55" r="20"/>
    <circle cx="315" cy="52" r="25"/>
    <circle cx="338" cy="58" r="18"/>
  </g>

  <!-- Green Hills -->
  <path d="M 0,300 L 0,210 Q 110,175 220,205 Q 320,175 400,200 L 400,300 Z" fill="#2e7d32" opacity="0.65"/>

  <!-- Cute Fluffy Alpaca -->
  <g transform="translate(145, 138)">
    <!-- Fluffy Body -->
    <circle cx="0" cy="35" r="32" fill="#fff8e1"/>
    <circle cx="25" cy="38" r="26" fill="#fff8e1"/>
    <circle cx="-18" cy="40" r="24" fill="#fff8e1"/>
    <!-- Neck & Head -->
    <rect x="-16" y="-22" width="28" height="45" rx="14" fill="#fff8e1"/>
    <circle cx="-2" cy="-26" r="24" fill="#fffdf7"/>
    <!-- Ears -->
    <ellipse cx="-14" cy="-48" rx="6" ry="13" fill="#fff8e1" stroke="#ffccbc" stroke-width="2"/>
    <ellipse cx="10" cy="-48" rx="6" ry="13" fill="#fff8e1" stroke="#ffccbc" stroke-width="2"/>
    <!-- Cute Face -->
    <circle cx="-9" cy="-28" r="3.5" fill="#3e2723"/>
    <circle cx="6" cy="-28" r="3.5" fill="#3e2723"/>
    <ellipse cx="-14" cy="-21" rx="5" ry="3" fill="#ff8a80" opacity="0.75"/>
    <ellipse cx="11" cy="-21" rx="5" ry="3" fill="#ff8a80" opacity="0.75"/>
    <path d="M -4,-22 Q -1,-18 2,-22" stroke="#3e2723" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Rainbow Scarf around Neck -->
    <rect x="-20" y="-4" width="38" height="14" rx="7" fill="url(#rainbowScarf)" stroke="#fff" stroke-width="1.5"/>
    <rect x="6" y="4" width="12" height="24" rx="5" fill="#ff80ab" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- Colorful Yarn Balls on Right -->
  <g transform="translate(275, 118)">
    <circle cx="0" cy="0" r="22" fill="#ff80ab" stroke="#fff" stroke-width="2"/>
    <path d="M -12,-8 Q 0,4 12,-8 M -14,4 Q 0,14 14,4" stroke="#fff" stroke-width="2" fill="none"/>
    <circle cx="48" cy="24" r="22" fill="#ffd54f" stroke="#fff" stroke-width="2"/>
    <path d="M 36,16 Q 48,28 60,16 M 34,28 Q 48,38 62,28" stroke="#fff" stroke-width="2" fill="none"/>
    <circle cx="8" cy="54" r="22" fill="#40c4ff" stroke="#fff" stroke-width="2"/>
    <path d="M -4,46 Q 8,58 20,46 M -6,58 Q 8,68 22,58" stroke="#fff" stroke-width="2" fill="none"/>
  </g>

  <text x="65" y="135" font-size="26">🧶</text>
  <text x="225" y="95" font-size="24">✨</text>

  <!-- Bottom Banner -->
  <rect x="30" y="246" width="340" height="40" rx="20" fill="#2c1654" opacity="0.95" stroke="#ffd54f" stroke-width="2.5"/>
  <text x="200" y="272" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="middle">🦙 보송보송 알파카 무지개 털실 공방</text>
</svg>
