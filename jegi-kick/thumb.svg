      <stop offset="55%" stop-color="#ffd7a8"/>
      <stop offset="55%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#6b4426"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="264" cy="28" r="20" fill="rgba(255,255,255,0.35)"/>
  <!-- character -->
