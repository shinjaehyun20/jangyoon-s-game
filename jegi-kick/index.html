<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🪁 제기차기</title>
  <style>
    :root {
      --bg: #ff9c5c;
      --accent: #e63946;
      --accent2: #ffd166;
      --text: #ffffff;
      --card: rgba(255,255,255,0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: linear-gradient(#87ceeb, #ff9c5c);
      color: var(--text);
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 8px; gap: 6px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(18px, 5vw, 26px);
      font-weight: 900;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border-radius: 14px;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    #game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #canvas {
      width: 100%;
      max-width: 400px;
      touch-action: none;
      border-radius: 16px;
    }
    .tap-hint {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      margin-top: 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .combo-flash {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: 900;
      color: var(--accent2);
      text-shadow: 0 0 12px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
    }
    .combo-flash.show { opacity: 1; }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      padding: 0 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .home-link { color: #fff; text-decoration: none; font-weight: 700; }
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: linear-gradient(135deg, #7a2e2e 0%, #3d1414 100%);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    .overlay-card h2 { font-size: 28px; margin-bottom: 10px; }
    .overlay-card p { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 18px; line-height: 1.7; }
    .btn-start {
      background: linear-gradient(135deg, var(--accent2), #f4a261);
      border: none; border-radius: 14px;
      color: #3d1414; font-size: 18px; font-weight: 900;
      padding: 14px 36px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,209,102,0.4);
      transition: transform 0.1s;
    }
    .btn-start:active { transform: scale(0.94); }
    .result-score {
      font-size: 52px; font-weight: 900;
      color: var(--accent2);
      margin: 8px 0;
    }
    #bestMsg { font-size: 13px; color: var(--accent2); margin: 4px 0 12px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🪁 제기차기</h1>
    <div class="hud">
      <span>🔥 연속 <span id="combo">0</span></span>
      <span>🏆 최고 <span id="best">0</span></span>
    </div>
    <div id="game-area">
      <canvas id="canvas"></canvas>
      <div class="combo-flash" id="comboFlash">NICE!</div>
      <div class="tap-hint">드래그해서 제기 밑으로 이동!</div>
    </div>
    <footer>
      <small>제기가 떨어지기 전에 발밑으로!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <!-- 시작 오버레이 -->
  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🪁 제기차기</h2>
      <p>손가락으로 화면을 드래그해서<br>아이를 좌우로 움직여요!<br><br>제기가 떨어지면 발밑으로 이동해<br>딱 맞춰 차올리세요!<br>놓치면 게임 종료, 연속 기록에 도전!</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>

  <!-- 결과 오버레이 -->
  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 게임 종료!</h2>
      <div class="result-score" id="finalScore">0</div>
      <div id="bestMsg"></div>
      <p id="resultMsg">잘했어요!</p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    const CONFIG = {
      charRadius: 22,
      jegiRadius: 13,
      catchRadius: 40,
      gravity: 0.32,
      baseKickPower: 9.0,
      kickPowerGrowth: 0.12,
      kickPowerCap: 14.5,
      baseDriftDist: 14,
      driftGrowthEvery: 5,
      driftGrowthAmt: 6,
      driftDistCap: 55,
      groundOffset: 46,
      followEase: 0.26,
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const $ = id => document.getElementById(id);

    let W, H;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      W = canvas.width = Math.min(rect.width, 400);
      H = canvas.height = Math.min(rect.height * 0.86, 520);
    }

    function groundY() { return H - CONFIG.groundOffset; }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    let state = {
      combo: 0,
      running: false,
      charX: 0,
      targetX: 0,
      jegi: { x: 0, y: 0, vx: 0, vy: 0, rot: 0 },
      particles: [],
      frame: 0,
      animId: null,
      comboTimer: null,
    };

    function updateHUD() {
      $('combo').textContent = state.combo;
      $('best').textContent = localStorage.getItem('jegi-kick_best') || '0';
    }

    function launchJegi(fromX, driftDist, kickPower) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      const flightFrames = Math.max(1, (2 * kickPower) / CONFIG.gravity);
      const dist = driftDist * (0.3 + Math.random() * 0.7);
      state.jegi.x = fromX;
      state.jegi.y = groundY() - 6;
      state.jegi.vy = -kickPower;
      state.jegi.vx = (dir * dist) / flightFrames;
    }

    function drawBg() {
      const grad = ctx.createLinearGradient(0, 0, 0, groundY() + 34);
      grad.addColorStop(0, '#7ec9f0');
      grad.addColorStop(1, '#ffd7a8');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, groundY() + 34);
      // sun
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(W * 0.82, 36, 26, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawGround() {
      const gy = groundY() + 34;
      ctx.fillStyle = '#8a5a34';
      ctx.fillRect(0, gy, W, H - gy);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
      // 전통 문양 느낌의 점선
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 8]);
      ctx.beginPath();
      ctx.moveTo(0, gy + 10);
      ctx.lineTo(W, gy + 10);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawCharacter() {
      const gy = groundY();
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath();
      ctx.ellipse(state.charX, gy + 32, 20, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '40px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('🧒', state.charX, gy + 28);
    }

    function drawJegi() {
      const j = state.jegi;
      ctx.save();
      ctx.translate(j.x, j.y);
      ctx.rotate(j.rot);
      const colors = ['#e63946', '#f4a261', '#2a9d8f', '#264653', '#e9c46a'];
      for (let i = 0; i < colors.length; i++) {
        const ang = (i / (colors.length - 1) - 0.5) * 1.1;
        ctx.strokeStyle = colors[i];
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.sin(ang) * 5, 17 + Math.cos(ang) * 2);
        ctx.stroke();
      }
      ctx.fillStyle = '#f1faee';
      ctx.beginPath();
      ctx.arc(0, 0, CONFIG.jegiRadius * 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1d3557';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    function spawnKickParticles(x, y) {
      for (let i = 0; i < 10; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 2.5;
        state.particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 1, life: 1 });
      }
    }

    function updateParticles() {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.05;
        if (p.life <= 0) state.particles.splice(i, 1);
      }
    }

    function drawParticles() {
      state.particles.forEach(p => {
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = '#fff3b0';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function showCombo(text) {
      const el = $('comboFlash');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(state.comboTimer);
      state.comboTimer = setTimeout(() => el.classList.remove('show'), 600);
    }

    function gameLoop() {
      if (!state.running) return;
      state.frame++;
      drawBg();
      drawGround();

      state.charX += (state.targetX - state.charX) * CONFIG.followEase;
      state.charX = clamp(state.charX, CONFIG.charRadius + 4, W - CONFIG.charRadius - 4);

      const j = state.jegi;
      j.x += j.vx;
      j.y += j.vy;
      j.vy += CONFIG.gravity;
      j.rot += 0.14 + Math.abs(j.vx) * 0.05;

      if (j.x < CONFIG.jegiRadius) { j.x = CONFIG.jegiRadius; j.vx *= -0.8; }
      if (j.x > W - CONFIG.jegiRadius) { j.x = W - CONFIG.jegiRadius; j.vx *= -0.8; }

      const gy = groundY();
      if (j.vy > 0 && j.y >= gy - 4) {
        const dx = Math.abs(j.x - state.charX);
        if (dx <= CONFIG.catchRadius) {
          state.combo++;
          const kickPower = Math.min(CONFIG.kickPowerCap, CONFIG.baseKickPower + state.combo * CONFIG.kickPowerGrowth);
          const driftDist = Math.min(CONFIG.driftDistCap, CONFIG.baseDriftDist + Math.floor(state.combo / CONFIG.driftGrowthEvery) * CONFIG.driftGrowthAmt);
          launchJegi(state.charX, driftDist, kickPower);
          spawnKickParticles(state.charX, gy);
          showCombo(state.combo % 5 === 0 ? `${state.combo} 콤보! 대박! 🎊` : `${state.combo} 연속! 👏`);
          updateHUD();
        } else {
          drawJegi();
          endGame();
          return;
        }
      }

      drawJegi();
      drawCharacter();
      updateParticles();
      drawParticles();

      state.animId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      cancelAnimationFrame(state.animId);
      resize();
      state = {
        combo: 0, running: true,
        charX: W / 2, targetX: W / 2,
        jegi: { x: 0, y: 0, vx: 0, vy: 0, rot: 0 },
        particles: [], frame: 0, animId: null, comboTimer: null,
      };
      launchJegi(state.charX, CONFIG.baseDriftDist, CONFIG.baseKickPower);
      updateHUD();

      $('startOverlay').classList.add('hidden');
      $('endOverlay').classList.add('hidden');
      gameLoop();
    }

    function endGame() {
      state.running = false;
      cancelAnimationFrame(state.animId);
      const best = parseInt(localStorage.getItem('jegi-kick_best') || '0', 10);
      const isNew = state.combo > best;
      if (isNew) localStorage.setItem('jegi-kick_best', state.combo);
      $('finalScore').textContent = state.combo + '연속';
      $('bestMsg').textContent = isNew ? '🏆 최고 기록 갱신!' : `최고 기록: ${Math.max(best, state.combo)}연속`;
      const msgs = ['제기왕! 🪁', '멋진 발놀림! 👟', '한 번 더 도전!'];
      $('resultMsg').textContent = msgs[Math.floor(Math.random() * msgs.length)];
      $('endOverlay').classList.remove('hidden');
      updateHUD();
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      return { x: (e.clientX - rect.left) * scaleX };
    }

    let dragging = false;
    canvas.addEventListener('pointerdown', (e) => {
      if (!state.running) return;
      e.preventDefault();
      dragging = true;
      state.targetX = getPos(e).x;
    });
    window.addEventListener('pointermove', (e) => {
      if (!dragging || !state.running) return;
      state.targetX = getPos(e).x;
    });
    window.addEventListener('pointerup', () => { dragging = false; });

    $('startBtn').addEventListener('pointerdown', startGame);
    $('restartBtn').addEventListener('pointerdown', startGame);
    window.addEventListener('resize', () => { if (state.running) resize(); });
    resize();
    updateHUD();
  })();
  </script>
</body>
</html>
