<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEFA"/>
      <stop offset="100%" stop-color="#E0FFFF"/>
    </linearGradient>
    <linearGradient id="apple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="basket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#bg)"/>
  
  <!-- Basket -->
  <path d="M 50 140 Q 50 130 60 130 L 140 130 Q 150 130 150 140 L 145 170 Q 140 180 130 180 L 70 180 Q 60 180 55 170 Z" fill="url(#basket)" stroke="#873600" stroke-width="4"/>
  <path d="M 70 130 Q 70 90 100 90 Q 130 90 130 130" fill="none" stroke="#873600" stroke-width="6"/>
  
  <!-- Apples inside basket -->
  <circle cx="80" cy="140" r="14" fill="url(#apple)"/>
  <circle cx="105" cy="135" r="15" fill="url(#apple)"/>
  <circle cx="125" cy="142" r="13" fill="url(#apple)"/>
  
  <!-- Falling Apples -->
  <g transform="translate(60, 50)">
    <circle cx="0" cy="0" r="16" fill="url(#apple)"/>
    <path d="M 0 -16 Q 5 -22 8 -20" fill="none" stroke="#27AE60" stroke-width="3"/>
    <ellipse cx="-5" cy="-5" rx="3" ry="6" fill="white" opacity="0.6" transform="rotate(-20 -5 -5)"/>
  </g>

  <g transform="translate(130, 70)">
    <circle cx="0" cy="0" r="14" fill="#2ECC71"/>
    <path d="M 0 -14 Q 3 -18 5 -16" fill="none" stroke="#7D6608" stroke-width="2"/>
    <ellipse cx="-4" cy="-4" rx="2" ry="5" fill="white" opacity="0.6" transform="rotate(-20 -4 -4)"/>
  </g>
  
  <!-- Bomb -->
  <g transform="translate(150, 30)">
    <circle cx="0" cy="0" r="12" fill="#2C3E50"/>
    <rect x="-3" y="-15" width="6" height="4" fill="#7F8C8D"/>
    <path d="M 0 -15 Q 5 -20 10 -18" fill="none" stroke="#E67E22" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="10" y="-15" font-size="12">💥</text>
  </g>
</svg>