<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚀 우주 탐사차의 크리스탈 대쉬 | 장윤이의 게임 놀이터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: #090a0f;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ui-layer {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 10;
      pointer-events: none;
    }
    .home-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(8px);
      transition: transform 0.15s;
    }
    .home-btn:active {
      transform: scale(0.95);
    }
    .status-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 800;
      color: #f3e8ff;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .badge span {
      color: #c084fc;
      font-weight: 900;
    }
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(12px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #fff;
    }
    .overlay-screen.hidden {
      display: none;
    }
    .overlay-title {
      font-size: 32px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      margin-bottom: 12px;
    }
    .overlay-desc {
      font-size: 16px;
      color: #cbd5e1;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 28px;
    }
    .start-btn {
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
      color: #fff;
      border: none;
      padding: 14px 44px;
      font-size: 19px;
      font-weight: 900;
      border-radius: 32px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
      transition: transform 0.15s;
    }
    .start-btn:active {
      transform: scale(0.96);
    }
    .jump-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      z-index: 10;
      pointer-events: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="ui-layer">
    <a href="../index.html" class="home-btn">🏠 놀이터로</a>
    <div class="status-group">
      <div class="badge">거리 <span id="distVal">0m</span></div>
      <div class="badge">크리스탈 <span id="crystalVal">0</span></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <div class="jump-hint">화면을 탭하여 저중력 부스터 점프! 🚀</div>

  <div id="startScreen" class="overlay-screen">
    <div class="overlay-title">🚀 우주 탐사차의 크리스탈 대쉬</div>
    <div class="overlay-desc">
      달과 화성의 신비로운 분화구를 누비는<br>
      꼬마 우주 탐사차 루나 1호!<br>
      분화구를 훌쩍 뛰어넘고<br>
      반짝이는 에너지 크리스탈을 모아보세요! 💎
    </div>
    <button class="start-btn" id="startBtn">우주 탐사 출발!</button>
  </div>

  <div id="gameOverScreen" class="overlay-screen hidden">
    <div class="overlay-title">🌌 탐사 임무 완료!</div>
    <div class="overlay-desc" id="gameResultDesc">
      총 <b>250m</b>를 달리고<br>
      크리스탈 20개를 수집했습니다!
    </div>
    <button class="start-btn" id="restartBtn">다시 출발하기</button>
  </div>

  <script>
    // Audio Context
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.25, gainVal = 0.2) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playJumpSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(580, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    function playCrystalSound() {
      playTone(1046.50, 'sine', 0.2, 0.25);
      setTimeout(() => playTone(1567.98, 'triangle', 0.3, 0.25), 60);
    }

    function playCrashSound() {
      playTone(120, 'sawtooth', 0.4, 0.35);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    // Lunar Rover Player
    const rover = {
      x: 80,
      y: 0,
      vy: 0,
      width: 52,
      height: 32,
      groundY: 0,
      isGrounded: false,
      wheelRot: 0,
      invincibleTime: 0
    };

    let isPlaying = false;
    let distance = 0;
    let crystals = 0;
    let gameSpeed = 220;
    let gravity = 620;
    let jumpForce = -360;

    let obstacles = [];
    let items = [];
    let particles = [];
    let bgStars = [];

    for (let i = 0; i < 70; i++) {
      bgStars.push({
        x: Math.random() * width,
        y: Math.random() * height * 0.7,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 0.3 + 0.1
      });
    }

    function resetGame() {
      rover.groundY = height * 0.75;
      rover.y = rover.groundY;
      rover.vy = 0;
      rover.isGrounded = true;
      rover.invincibleTime = 0;

      distance = 0;
      crystals = 0;
      gameSpeed = 220;
      obstacles = [];
      items = [];
      particles = [];
      isPlaying = true;

      document.getElementById('distVal').textContent = '0m';
      document.getElementById('crystalVal').textContent = '0';
    }

    function jump() {
      if (!isPlaying) return;
      initAudio();
      if (rover.isGrounded) {
        rover.vy = jumpForce;
        rover.isGrounded = false;
        playJumpSound();
        spawnRocketParticles(rover.x - 14, rover.y + 10, 10);
      } else if (rover.vy > -100 && rover.vy < 150) {
        // Double booster kick
        rover.vy = jumpForce * 0.85;
        playJumpSound();
        spawnRocketParticles(rover.x - 14, rover.y + 10, 16);
      }
    }

    window.addEventListener('pointerdown', (e) => {
      // Ignore click on home button
      if (e.target.closest('.home-btn')) return;
      jump();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') {
        jump();
      }
    });

    function spawnRocketParticles(x, y, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: -(Math.random() * 120 + 60),
          vy: (Math.random() - 0.5) * 60,
          size: Math.random() * 5 + 3,
          color: Math.random() < 0.5 ? '#38bdf8' : '#c084fc',
          life: 1.0,
          decay: Math.random() * 0.04 + 0.03
        });
      }
    }

    function spawnCrystalParticles(x, y, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 90 + 30;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 4 + 2,
          color: '#38bdf8',
          life: 1.0,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    let spawnTimer = 0;
    function updateEntities(dt) {
      distance += (gameSpeed * dt) * 0.1;
      document.getElementById('distVal').textContent = `${Math.floor(distance)}m`;
      gameSpeed = Math.min(420, 220 + distance * 0.4);

      // Physics
      rover.vy += gravity * dt;
      rover.y += rover.vy * dt;

      if (rover.y >= rover.groundY) {
        rover.y = rover.groundY;
        rover.vy = 0;
        rover.isGrounded = true;
      }

      rover.wheelRot += (gameSpeed * dt) * 0.2;

      // Spawn Obstacles & Crystals
      spawnTimer += dt;
      if (spawnTimer > 1.6) {
        spawnTimer = 0;
        // Obstacle (Crater / Spike)
        obstacles.push({
          x: width + 40,
          y: rover.groundY + 16,
          width: 32,
          height: 36
        });

        // Crystal item floating above
        items.push({
          x: width + 140,
          y: rover.groundY - (Math.random() * 80 + 40),
          r: 14,
          rot: 0
        });
      }

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed * dt;

        // Collision Check
        const rx = rover.x;
        const ry = rover.y;
        if (
          rx + rover.width * 0.5 > obs.x - obs.width * 0.5 &&
          rx - rover.width * 0.5 < obs.x + obs.width * 0.5 &&
          ry + rover.height * 0.5 > obs.y - obs.height &&
          ry - rover.height * 0.5 < obs.y
        ) {
          playCrashSound();
          gameOver();
          return;
        }

        if (obs.x < -60) obstacles.splice(i, 1);
      }

      // Update Items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.x -= gameSpeed * dt;
        it.rot += dt * 3;

        // Collision Check
        const dist = Math.hypot(rover.x - it.x, rover.y - it.y);
        if (dist < rover.height * 0.6 + it.r) {
          crystals += 1;
          document.getElementById('crystalVal').textContent = crystals;
          playCrystalSound();
          spawnCrystalParticles(it.x, it.y, 14);
          items.splice(i, 1);
          continue;
        }

        if (it.x < -40) items.splice(i, 1);
      }
    }

    function gameOver() {
      isPlaying = false;
      document.getElementById('gameResultDesc').innerHTML = `
        총 탐사 거리: <b>${Math.floor(distance)}m</b><br>
        수집한 크리스탈: <b>${crystals}개</b><br>
        달과 화성의 용감한 우주 탐험가 장윤이! 🚀
      `;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    // Drawing Rover
    function drawRover() {
      ctx.save();
      ctx.translate(rover.x, rover.y);

      // Cabin Body
      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.roundRect(-24, -16, 48, 24, 8);
      ctx.fill();

      // Front Window Dome
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(12, -8, 9, -Math.PI * 0.5, Math.PI * 0.5);
      ctx.fill();

      // Golden Solar Panel / Antenna
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-10, -16);
      ctx.lineTo(-14, -28);
      ctx.stroke();

      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(-14, -28, 4, 0, Math.PI * 2);
      ctx.fill();

      // Rocket Booster Pipe
      ctx.fillStyle = '#64748b';
      ctx.fillRect(-28, -6, 6, 12);

      // Wheels (3 wheels)
      const wheelOffsets = [-16, 0, 16];
      wheelOffsets.forEach(ox => {
        ctx.save();
        ctx.translate(ox, 12);
        ctx.rotate(rover.wheelRot);

        // Tire
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();

        // Rim
        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        // Spoke line
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-7, 0);
        ctx.lineTo(7, 0);
        ctx.stroke();

        ctx.restore();
      });

      ctx.restore();
    }

    // Main Loop
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      rover.groundY = height * 0.75;

      if (isPlaying) {
        updateEntities(dt);
      }

      ctx.clearRect(0, 0, width, height);

      // Background Nebula / Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#090a0f');
      skyGrad.addColorStop(0.6, '#1e1b4b');
      skyGrad.addColorStop(1, '#311042');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Draw Distant Stars
      bgStars.forEach(s => {
        s.x -= s.speed * (isPlaying ? (gameSpeed * 0.15) : 8) * dt;
        if (s.x < 0) s.x = width;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Distant Planet
      ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
      ctx.beginPath();
      ctx.arc(width * 0.8, height * 0.22, 45, 0, Math.PI * 2);
      ctx.fill();

      // Ground Surface (Moon / Mars Crust)
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(0, rover.groundY + 16);
      ctx.lineTo(width, rover.groundY + 16);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();

      // Surface Line
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, rover.groundY + 16);
      ctx.lineTo(width, rover.groundY + 16);
      ctx.stroke();

      // Draw Obstacles (Spike Rocks)
      obstacles.forEach(obs => {
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.moveTo(obs.x - obs.width * 0.5, obs.y);
        ctx.lineTo(obs.x, obs.y - obs.height);
        ctx.lineTo(obs.x + obs.width * 0.5, obs.y);
        ctx.closePath();
        ctx.fill();

        // Inner glowing core
        ctx.fillStyle = '#fda4af';
        ctx.beginPath();
        ctx.moveTo(obs.x - obs.width * 0.25, obs.y);
        ctx.lineTo(obs.x, obs.y - obs.height * 0.6);
        ctx.lineTo(obs.x + obs.width * 0.25, obs.y);
        ctx.closePath();
        ctx.fill();
      });

      // Draw Items (Energy Crystals)
      items.forEach(it => {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.rot);

        // Crystal Diamond Shape
        ctx.fillStyle = '#38bdf8';
        ctx.strokeStyle = '#e0f2fe';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -it.r);
        ctx.lineTo(it.r * 0.8, 0);
        ctx.lineTo(0, it.r);
        ctx.lineTo(-it.r * 0.8, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      });

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      // Draw Rover
      drawRover();

      requestAnimationFrame(loop);
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      initAudio();
      document.getElementById('startScreen').classList.add('hidden');
      resetGame();
      requestAnimationFrame(loop);
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      document.getElementById('gameOverScreen').classList.add('hidden');
      resetGame();
    });
  </script>
</body>
</html>
