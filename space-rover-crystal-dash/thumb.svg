<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#spaceGrad)"/>

  <!-- Distant Planet -->
  <circle cx="320" cy="70" r="32" fill="#a855f7" opacity="0.6"/>

  <!-- Stars -->
  <circle cx="60" cy="50" r="1.5" fill="#fff"/>
  <circle cx="180" cy="40" r="1" fill="#fff"/>
  <circle cx="240" cy="90" r="2" fill="#fff"/>

  <!-- Ground -->
  <rect x="0" y="210" width="400" height="90" fill="#1e293b"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#a855f7" stroke-width="3"/>

  <!-- Crystal Item -->
  <g transform="translate(280, 150) rotate(25)" filter="url(#glow)">
    <polygon points="0,-16 12,0 0,16 -12,0" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Rover -->
  <g transform="translate(130, 180) scale(1.4)">
    <!-- Cabin -->
    <rect x="-24" y="-16" width="48" height="24" rx="8" fill="#f1f5f9"/>
    <!-- Dome -->
    <path d="M 12,-17 A 9 9 0 0 1 12,1 Z" fill="#38bdf8"/>
    <!-- Wheels -->
    <circle cx="-16" cy="12" r="8" fill="#334155"/>
    <circle cx="-16" cy="12" r="3" fill="#94a3b8"/>
    <circle cx="0" cy="12" r="8" fill="#334155"/>
    <circle cx="0" cy="12" r="3" fill="#94a3b8"/>
    <circle cx="16" cy="12" r="8" fill="#334155"/>
    <circle cx="16" cy="12" r="3" fill="#94a3b8"/>
    <!-- Rocket exhaust -->
    <polygon points="-24,-4 -36,-8 -36,4" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Title Badge -->
  <rect x="55" y="240" width="290" height="42" rx="21" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="267" fill="#38bdf8" font-family="'Pretendard', sans-serif" font-size="15" font-weight="900" text-anchor="middle">🚀 우주 탐사차의 크리스탈 대쉬</text>
</svg>
