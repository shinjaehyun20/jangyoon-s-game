<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F8F5" />
      <stop offset="100%" stop-color="#D1F2EB" />
    </linearGradient>
    <linearGradient id="leafGradG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" />
      <stop offset="100%" stop-color="#27AE60" />
    </linearGradient>
    <linearGradient id="leafGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C" />
      <stop offset="100%" stop-color="#C0392B" />
    </linearGradient>
    <linearGradient id="leafGradY" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#F39C12" />
    </linearGradient>
    <linearGradient id="leafGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6" />
      <stop offset="100%" stop-color="#8E44AD" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad2)" rx="16" />

  <!-- Surrounding Leaves for Camouflage -->
  <!-- Top Left: Red -->
  <path d="M 30,50 Q 80,10 110,60 Q 60,90 30,50 Z" fill="url(#leafGradR)" opacity="0.85" />
  <line x1="30" y1="50" x2="110" y2="60" stroke="#922B21" stroke-width="2" />

  <!-- Top Right: Yellow -->
  <path d="M 370,40 Q 320,10 290,60 Q 340,90 370,40 Z" fill="url(#leafGradY)" opacity="0.85" />
  <line x1="370" y1="40" x2="290" y2="60" stroke="#B7950B" stroke-width="2" />

  <!-- Bottom Left: Purple -->
  <path d="M 40,240 Q 90,200 120,250 Q 70,280 40,240 Z" fill="url(#leafGradP)" opacity="0.85" />

  <!-- Bottom Right: Green -->
  <path d="M 360,230 Q 310,190 280,240 Q 330,270 360,230 Z" fill="url(#leafGradG)" opacity="0.85" />

  <!-- Tree Branch -->
  <rect x="50" y="165" width="300" height="24" rx="12" fill="#795548" stroke="#5D4037" stroke-width="3" />
  <line x1="70" y1="177" x2="330" y2="177" stroke="#A1887F" stroke-width="2" stroke-linecap="round" />

  <!-- Chameleon Character (sitting on branch) -->
  <g transform="translate(200, 135)">
    <!-- Curly Tail -->
    <path d="M 65,30 C 95,20 105,-15 80,-25 C 60,-32 50,-10 60,0 C 65,6 74,5 75,-2" fill="none" stroke="#2ECC71" stroke-width="12" stroke-linecap="round" />

    <!-- Chameleon Body -->
    <ellipse cx="0" cy="12" rx="65" ry="38" fill="#2ECC71" />
    <!-- Light Belly Pattern -->
    <ellipse cx="-10" cy="22" rx="42" ry="18" fill="#58D68D" opacity="0.6" />

    <!-- Cute Crest -->
    <polygon points="-35,-16 -28,-28 -21,-14" fill="#27AE60" />
    <polygon points="-18,-18 -11,-30 -4,-16" fill="#27AE60" />
    <polygon points="-1,-17 6,-29 13,-15" fill="#27AE60" />
    <polygon points="16,-14 23,-25 30,-12" fill="#27AE60" />

    <!-- Claws Grabbing Branch -->
    <circle cx="-38" cy="40" r="10" fill="#27AE60" />
    <circle cx="35" cy="40" r="10" fill="#27AE60" />

    <!-- Head -->
    <ellipse cx="-58" cy="-5" rx="30" ry="26" fill="#2ECC71" />

    <!-- Huge Turret Eye -->
    <circle cx="-64" cy="-8" r="14" fill="#27AE60" />
    <circle cx="-64" cy="-8" r="10" fill="#FFFFFF" />
    <circle cx="-67" cy="-8" r="5" fill="#1C2833" />
    <circle cx="-69" cy="-10" r="1.8" fill="#FFFFFF" />

    <!-- Smiling Mouth -->
    <path d="M -78,7 Q -70,14 -60,8" fill="none" stroke="#196F3D" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cute Blush -->
    <circle cx="-50" cy="6" r="6" fill="#F1948A" opacity="0.6" />

    <!-- Sparkles of camouflage -->
    <circle cx="10" cy="-6" r="3" fill="#F1C40F" />
    <circle cx="30" cy="18" r="2.5" fill="#E74C3C" />
    <circle cx="-25" cy="6" r="2" fill="#9B59B6" />
  </g>

  <!-- 4 Color Bubbles at the bottom -->
  <g transform="translate(110, 240)">
    <circle cx="0" cy="0" r="16" fill="#2ECC71" stroke="#FFF" stroke-width="3" />
    <text x="0" y="5" font-size="12" font-family="sans-serif" fill="#FFF" font-weight="bold" text-anchor="middle">초록</text>
  </g>
  <g transform="translate(170, 240)">
    <circle cx="0" cy="0" r="16" fill="#E74C3C" stroke="#FFF" stroke-width="3" />
    <text x="0" y="5" font-size="12" font-family="sans-serif" fill="#FFF" font-weight="bold" text-anchor="middle">빨강</text>
  </g>
  <g transform="translate(230, 240)">
    <circle cx="0" cy="0" r="16" fill="#F1C40F" stroke="#FFF" stroke-width="3" />
    <text x="0" y="5" font-size="12" font-family="sans-serif" fill="#7D6608" font-weight="bold" text-anchor="middle">노랑</text>
  </g>
  <g transform="translate(290, 240)">
    <circle cx="0" cy="0" r="16" fill="#9B59B6" stroke="#FFF" stroke-width="3" />
    <text x="0" y="5" font-size="12" font-family="sans-serif" fill="#FFF" font-weight="bold" text-anchor="middle">보라</text>
  </g>
</svg>
