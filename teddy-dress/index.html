<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🧸 곰돌이 옷 입히기</title>
  <style>
    :root {
      --bg: #3d1a4a;
      --accent: #ce93d8;
      --warm: #ff8a65;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(135deg, #3d1a4a 0%, #5c2d72 50%, #3d1a4a 100%);
      color: var(--text);
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 8px; gap: 6px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(18px, 5vw, 26px);
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.1);
      border-radius: 12px; padding: 6px 16px;
      font-size: 15px; font-weight: bold;
    }
    .hud .score { color: #ffcc02; }
    .hud .combo { color: var(--accent); font-size: 13px; }
    .hud .best { color: #f48fb1; font-size: 13px; }
    #gameArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #bearStage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      border: 2px solid rgba(206,147,216,0.3);
    }
    #bearDisplay {
      font-size: clamp(60px, 18vw, 100px);
      text-align: center;
      line-height: 1.1;
      transition: transform 0.3s ease;
      user-select: none;
    }
    #bearDisplay.dressed { transform: scale(1.08); }
    #outfitLabel {
      position: absolute; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.4);
      padding: 4px 12px; border-radius: 20px;
      font-size: 13px; white-space: nowrap;
    }
    #clothesArea {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 4px;
    }
    .cloth-item {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 8px 4px;
      cursor: pointer;
      font-size: clamp(26px, 6vw, 36px);
      min-height: 64px;
      border: 2px solid transparent;
      transition: transform 0.1s, background 0.15s, border-color 0.2s;
      user-select: none; -webkit-user-select: none;
    }
    .cloth-item span.label {
      font-size: 11px; margin-top: 2px; opacity: 0.8;
    }
    .cloth-item:active { transform: scale(0.9); }
    .cloth-item.selected {
      background: rgba(206,147,216,0.25);
      border-color: var(--accent);
    }
    .cloth-item.matched {
      background: rgba(255,204,2,0.2);
      border-color: #ffcc02;
      animation: pop 0.4s ease;
    }
    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    #mission {
      background: rgba(255,255,255,0.1);
      border-radius: 10px; padding: 8px 14px;
      font-size: 14px; text-align: center;
    }
    #mission .target { color: #ffcc02; font-weight: bold; font-size: 16px; }
    footer {
      display: flex; justify-content: space-between; align-items: center;
    }
    footer small { font-size: 12px; opacity: 0.7; }
    .home-link {
      color: var(--accent); text-decoration: none;
      font-size: 13px; font-weight: bold;
      background: rgba(255,255,255,0.1);
      padding: 6px 12px; border-radius: 8px;
      min-height: 44px; display: flex; align-items: center;
    }
    .overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75); z-index: 100;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: linear-gradient(135deg, #5c2d72, #3d1a4a);
      border: 2px solid var(--accent);
      border-radius: 20px; padding: 28px 24px;
      text-align: center; max-width: 320px; width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .overlay-card h2 { font-size: 26px; margin-bottom: 10px; }
    .overlay-card p { font-size: 14px; line-height: 1.7; opacity: 0.9; margin-bottom: 18px; }
    .result-score { font-size: 48px; font-weight: 900; color: #ffcc02; margin: 10px 0; }
    .btn-start {
      background: linear-gradient(135deg, #ab47bc, #7b1fa2);
      color: white; border: none; border-radius: 12px;
      font-size: 18px; font-weight: bold;
      padding: 14px 32px; cursor: pointer;
      min-height: 44px; width: 100%;
      box-shadow: 0 4px 12px rgba(171,71,188,0.4);
      transition: transform 0.1s;
    }
    .btn-start:active { transform: scale(0.96); }
    .celebrate {
      position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
      font-size: 36px; z-index: 200;
      animation: flyup 0.8s ease forwards;
      pointer-events: none;
    }
    @keyframes flyup {
      0% { opacity:1; transform: translateX(-50%) translateY(0); }
      100% { opacity:0; transform: translateX(-50%) translateY(-80px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧸 곰돌이 옷 입히기</h1>

    <div class="hud">
      <span class="score">⭐ <span id="scoreDisplay">0</span>점</span>
      <span class="combo" id="comboDisplay"></span>
      <span class="best">최고 <span id="bestDisplay">0</span></span>
    </div>

    <div id="gameArea">
      <div id="mission">
        <div>이 옷을 입혀요!</div>
        <div class="target" id="missionTarget">🎩 모자</div>
      </div>

      <div id="bearStage">
        <div id="bearDisplay">🧸</div>
        <div id="outfitLabel">기본 곰돌이</div>
      </div>

      <div id="clothesArea"></div>
    </div>

    <footer>
      <small>🧸 올바른 옷을 탭해요!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🧸 곰돌이<br>옷 입히기</h2>
      <p>화면 아래에서<br><strong>미션에 맞는 옷</strong>을 찾아<br>탭해서 입혀요!</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 완성!</h2>
      <div class="result-score" id="finalScore">0</div>
      <p id="resultMsg"></p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const STORAGE_KEY = 'teddy-dress_best';

    const CLOTHES = [
      { id: 'hat',      emoji: '🎩', label: '모자',    bear: '🧸🎩', outfitName: '신사 곰' },
      { id: 'tie',      emoji: '👔', label: '넥타이',  bear: '👔🧸', outfitName: '멋쟁이 곰' },
      { id: 'crown',    emoji: '👑', label: '왕관',    bear: '👑🧸', outfitName: '왕자 곰' },
      { id: 'glasses',  emoji: '🕶️', label: '선글라스', bear: '🧸🕶️', outfitName: '쿨한 곰' },
      { id: 'scarf',    emoji: '🧣', label: '목도리',  bear: '🧣🧸', outfitName: '따뜻한 곰' },
      { id: 'bow',      emoji: '🎀', label: '리본',    bear: '🎀🧸', outfitName: '귀여운 곰' },
      { id: 'cape',     emoji: '🦸', label: '망토',    bear: '🦸🧸', outfitName: '영웅 곰' },
      { id: 'flower',   emoji: '🌸', label: '꽃장식',  bear: '🌸🧸', outfitName: '봄 곰' },
      { id: 'star',     emoji: '⭐', label: '별 스티커', bear: '⭐🧸', outfitName: '스타 곰' },
      { id: 'rainbow',  emoji: '🌈', label: '무지개',  bear: '🌈🧸', outfitName: '레인보우 곰' },
    ];

    let state = {
      score: 0, combo: 0, round: 0,
      targetIdx: -1, gameActive: false,
      totalRounds: 10,
    };
    const $ = id => document.getElementById(id);

    function getBest() { return parseInt(localStorage.getItem(STORAGE_KEY) || '0'); }
    function saveBest(v) { localStorage.setItem(STORAGE_KEY, v); }

    function updateHUD() {
      $('scoreDisplay').textContent = state.score;
      $('bestDisplay').textContent = getBest();
      $('comboDisplay').textContent = state.combo >= 2 ? `🔥 ${state.combo}콤보!` : '';
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function nextRound() {
      if (state.round >= state.totalRounds) { endGame(); return; }
      state.round++;

      // 새 미션 선정
      state.targetIdx = Math.floor(Math.random() * CLOTHES.length);
      const target = CLOTHES[state.targetIdx];

      $('missionTarget').textContent = `${target.emoji} ${target.label}`;
      $('bearDisplay').textContent = '🧸';
      $('bearDisplay').classList.remove('dressed');
      $('outfitLabel').textContent = '기본 곰돌이';

      // 옷 섞어서 4개 표시 (정답 1 + 오답 3)
      const others = CLOTHES.filter((_, i) => i !== state.targetIdx);
      const shown = shuffle([...others]).slice(0, 3);
      shown.push(target);
      shuffle(shown);

      const area = $('clothesArea');
      area.innerHTML = '';
      shown.forEach(cloth => {
        const div = document.createElement('div');
        div.className = 'cloth-item';
        div.innerHTML = `<span>${cloth.emoji}</span><span class="label">${cloth.label}</span>`;
        div.dataset.id = cloth.id;
        div.addEventListener('pointerdown', onClothTap);
        area.appendChild(div);
      });

      updateHUD();
    }

    function onClothTap(e) {
      if (!state.gameActive) return;
      const div = e.currentTarget;
      const isCorrect = (div.dataset.id === CLOTHES[state.targetIdx].id);

      if (isCorrect) {
        div.classList.add('matched');
        state.score += 10 + state.combo * 2;
        state.combo++;

        const target = CLOTHES[state.targetIdx];
        $('bearDisplay').textContent = target.bear;
        $('bearDisplay').classList.add('dressed');
        $('outfitLabel').textContent = target.outfitName;

        // 축하 이모지
        const cel = document.createElement('div');
        cel.className = 'celebrate';
        cel.textContent = ['⭐','🎉','✨','🌟'][Math.floor(Math.random()*4)];
        document.body.appendChild(cel);
        setTimeout(() => cel.remove(), 900);

        setTimeout(nextRound, 700);
      } else {
        div.style.opacity = '0.3';
        state.combo = 0;
        updateHUD();
      }
    }

    function startGame() {
      state = { score: 0, combo: 0, round: 0, targetIdx: -1, gameActive: true, totalRounds: 10 };
      $('startOverlay').classList.add('hidden');
      $('endOverlay').classList.add('hidden');
      nextRound();
    }

    function endGame() {
      state.gameActive = false;
      const best = getBest();
      if (state.score > best) saveBest(state.score);
      $('finalScore').textContent = state.score + '점';
      const msg = state.score >= 90 ? '🏆 완벽한 패셔니스타!' :
                  state.score >= 60 ? '🌟 멋진 스타일리스트!' :
                  state.score >= 30 ? '😊 귀여운 곰 완성!' : '🧸 다시 도전해봐요!';
      $('resultMsg').textContent = msg + ` 최고: ${Math.max(state.score, best)}점`;
      $('endOverlay').classList.remove('hidden');
    }

    $('startBtn').addEventListener('pointerdown', startGame);
    $('restartBtn').addEventListener('pointerdown', startGame);
    updateHUD();
  })();
  </script>
</body>
</html>
