  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- 옷 아이템 장식 -->
  <text x="18" y="55" font-size="22" opacity="0.4">👑</text>
  <text x="18" y="100" font-size="22" opacity="0.35">🎀</text>
  <text x="18" y="145" font-size="22" opacity="0.4">🧣</text>
  <text x="58" y="35" font-size="18" opacity="0.3">🕶️</text>
