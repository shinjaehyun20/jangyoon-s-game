<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d132c"/>
      <stop offset="100%" stop-color="#1a0826"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bgGrad2)"/>
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,67,132,0.2)"/>
  
  <!-- Monster and Cookie Illustration -->
  <g transform="translate(100, 30)">
    <!-- Monster Body -->
    <rect x="20" y="20" width="80" height="80" rx="20" fill="#801336" stroke="#ff4384" stroke-width="3"/>
    <!-- Monster Eyes -->
    <circle cx="45" cy="45" r="10" fill="#ffffff"/>
    <circle cx="45" cy="45" r="4" fill="#000000"/>
    <circle cx="75" cy="45" r="10" fill="#ffffff"/>
    <circle cx="75" cy="45" r="4" fill="#000000"/>
    <!-- Open Mouth -->
    <ellipse cx="60" cy="75" rx="18" ry="12" fill="#2d132c" stroke="#ff4384" stroke-width="2"/>
    
    <!-- Cookie Floating -->
    <g transform="translate(10, 85)">
      <circle cx="20" cy="20" r="16" fill="#ee6f57"/>
      <circle cx="14" cy="14" r="3" fill="#4a2e2b"/>
      <circle cx="24" cy="22" r="3" fill="#4a2e2b"/>
      <circle cx="16" cy="26" r="3" fill="#4a2e2b"/>
    </g>
  </g>

  <!-- Titles -->
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="22" font-weight="900" fill="#ff4384">아기 몬스터 쿠키</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="2">MONSTER COOKIE FEED</text>
  </g>
</svg>
