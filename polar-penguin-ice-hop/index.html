<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐧 꼬마 펭귄의 빙하 퐁당퐁당 | 장윤이의 게임 놀이터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 40%, #075985 70%, #0c4a6e 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ui-layer {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 10;
      pointer-events: none;
    }
    .home-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #38bdf8;
      color: #0284c7;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      transition: transform 0.15s;
    }
    .home-btn:active {
      transform: scale(0.95);
    }
    .score-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .score-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #38bdf8;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 900;
      color: #0369a1;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lives-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #f43f5e;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 900;
      color: #be123c;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
    }
    .game-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 74, 110, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 24px;
    }
    .game-overlay h1 {
      font-size: 32px;
      color: #ffffff;
      margin-bottom: 12px;
      text-shadow: 0 4px 12px rgba(56, 189, 248, 0.6);
    }
    .game-overlay p {
      font-size: 16px;
      color: #e0f2fe;
      margin-bottom: 24px;
      line-height: 1.6;
      max-width: 420px;
    }
    .start-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      color: #ffffff;
      padding: 16px 42px;
      border-radius: 36px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .start-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="ui-layer">
    <a href="../index.html" class="home-btn">🏠 홈으로</a>
    <div class="score-group">
      <div class="lives-badge">❤️ 생명: <span id="livesVal">❤️❤️❤️</span></div>
      <div class="score-badge">🐟 점수: <span id="scoreVal">0</span></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="startOverlay" class="game-overlay">
    <h1>🐧 꼬마 펭귄의 빙하 퐁당퐁당</h1>
    <p>바다 위를 둥실둥실 떠내려오는 얼음 유빙을 타이밍 맞춰 건너세요!<br>화면을 탭하면 펭귄이 퐁당 뛰어올라 다음 빙하로 착지합니다!</p>
    <button id="startBtn" class="start-btn">빙하 점프 시작! ❄️</button>
  </div>

  <div id="gameOverOverlay" class="game-overlay" style="display: none;">
    <h1 id="endTitle">신나는 바다 모험 완료! 🌊</h1>
    <p id="endDesc">꼬마 펭귄이 멋지게 빙하를 건넜어요!</p>
    <button id="restartBtn" class="start-btn">다시 건너기! 🔄</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let W = 0, H = 0;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio API
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', dur = 0.15, gain = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gain, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function playJumpSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(650, now + 0.16);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.18);
      } catch (e) {}
    }

    function playSplashSound() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.22);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    function playItemSound() {
      playTone(587.33, 'triangle', 0.1, 0.18);
      setTimeout(() => playTone(880.00, 'sine', 0.18, 0.2), 70);
    }

    // Ice Floes
    class IceFloe {
      constructor(y, isStatic = false) {
        this.y = y;
        this.width = Math.min(W * 0.36, 150) + Math.random() * 30;
        this.height = 36;
        this.x = isStatic ? (W * 0.5 - this.width * 0.5) : (Math.random() * (W - this.width));
        this.vx = isStatic ? 0 : ((Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 1.8));
        this.hasItem = !isStatic && Math.random() < 0.65;
        this.itemType = Math.random() < 0.5 ? '🐟' : '🦐';
        this.wobble = Math.random() * Math.PI * 2;
      }

      update() {
        this.x += this.vx;
        this.wobble += 0.04;
        if (this.vx > 0 && this.x + this.width > W + 20) {
          this.vx = -Math.abs(this.vx);
        } else if (this.vx < 0 && this.x < -20) {
          this.vx = Math.abs(this.vx);
        }
      }

      draw() {
        ctx.save();
        const floatY = this.y + Math.sin(this.wobble) * 3;

        // Floe shadow
        ctx.beginPath();
        ctx.roundRect(this.x + 4, floatY + 8, this.width, this.height, 16);
        ctx.fillStyle = 'rgba(7, 89, 133, 0.4)';
        ctx.fill();

        // Floe underwater body
        ctx.beginPath();
        ctx.roundRect(this.x, floatY + 6, this.width, this.height, 16);
        ctx.fillStyle = '#bae6fd';
        ctx.fill();

        // Floe top ice surface
        ctx.beginPath();
        ctx.roundRect(this.x, floatY, this.width, this.height - 6, 16);
        ctx.fillStyle = '#f0f9ff';
        ctx.fill();

        ctx.strokeStyle = '#e0f2fe';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Shiny ice glint
        ctx.beginPath();
        ctx.moveTo(this.x + 14, floatY + 6);
        ctx.lineTo(this.x + this.width - 14, floatY + 6);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Optional item on ice
        if (this.hasItem) {
          ctx.font = '22px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.itemType, this.x + this.width * 0.5, floatY + 12);
        }

        ctx.restore();
      }
    }

    let gameState = 'start'; // 'start', 'play', 'gameover'
    let score = 0;
    let lives = 3;
    let floes = [];
    let currentFloeIndex = 0;
    let particles = [];

    // Penguin state
    let penguin = {
      x: 0,
      y: 0,
      targetX: 0,
      targetY: 0,
      isJumping: false,
      jumpProgress: 0,
      jumpDuration: 18,
      wobble: 0
    };

    function initGame() {
      score = 0;
      lives = 3;
      scoreVal.textContent = score;
      updateLivesUI();

      floes = [];
      const floeSpacing = Math.min(H * 0.22, 120);
      const baseY = H * 0.78;

      // Base floe
      floes.push(new IceFloe(baseY, true));
      for (let i = 1; i < 7; i++) {
        floes.push(new IceFloe(baseY - i * floeSpacing));
      }

      currentFloeIndex = 0;
      penguin.x = floes[0].x + floes[0].width * 0.5;
      penguin.y = floes[0].y + 10;
      penguin.isJumping = false;
      penguin.jumpProgress = 0;
    }

    function updateLivesUI() {
      livesVal.textContent = '❤️'.repeat(Math.max(0, lives));
    }

    function jumpForward() {
      if (gameState !== 'play' || penguin.isJumping) return;

      playJumpSound();
      penguin.isJumping = true;
      penguin.jumpProgress = 0;

      const nextFloe = floes[currentFloeIndex + 1];
      penguin.startX = penguin.x;
      penguin.startY = penguin.y;
      penguin.targetFloe = nextFloe;
    }

    function updatePenguin() {
      if (!penguin.isJumping) {
        // Ride current floe
        const currentFloe = floes[currentFloeIndex];
        if (currentFloe) {
          penguin.x = currentFloe.x + currentFloe.width * 0.5;
          penguin.y = currentFloe.y + 10 + Math.sin(currentFloe.wobble) * 3;
        }
      } else {
        penguin.jumpProgress += 1;
        const t = penguin.jumpProgress / penguin.jumpDuration;

        // Current target floe position at this moment
        const tf = penguin.targetFloe;
        const targetX = tf.x + tf.width * 0.5;
        const targetY = tf.y + 10;

        penguin.x = penguin.startX + (targetX - penguin.startX) * t;
        // Parabolic arc for jump height
        const arcY = Math.sin(t * Math.PI) * -65;
        penguin.y = penguin.startY + (targetY - penguin.startY) * t + arcY;

        if (penguin.jumpProgress >= penguin.jumpDuration) {
          penguin.isJumping = false;

          // Check if landed safely on target floe
          const landX = penguin.x;
          if (landX >= tf.x - 10 && landX <= tf.x + tf.width + 10) {
            // Landed safely!
            currentFloeIndex++;
            score += 10;
            if (tf.hasItem) {
              tf.hasItem = false;
              score += 25;
              playItemSound();
            } else {
              playTone(523.25, 'triangle', 0.12, 0.15);
            }
            scoreVal.textContent = score;

            // Shift world down if penguin gets too high
            if (tf.y < H * 0.5) {
              const shift = H * 0.22;
              for (let f of floes) {
                f.y += shift;
              }
              // Spawn new floe at top
              const topY = floes[floes.length - 1].y - shift;
              floes.push(new IceFloe(topY));
            }
          } else {
            // Missed! Splash into water!
            playSplashSound();
            lives--;
            updateLivesUI();

            // Splash particles
            for (let i = 0; i < 20; i++) {
              particles.push({
                x: penguin.x,
                y: penguin.y + 15,
                vx: (Math.random() - 0.5) * 6,
                vy: -Math.random() * 6 - 2,
                life: 1.0,
                color: '#e0f2fe'
              });
            }

            if (lives <= 0) {
              gameState = 'gameover';
              setTimeout(() => {
                gameOverOverlay.style.display = 'flex';
                document.getElementById('endDesc').textContent = `최종 점수: ${score}점! 즐겁게 빙하를 건넜어요! 🐧`;
              }, 400);
            }
          }
        }
      }
    }

    function drawPenguin() {
      ctx.save();
      ctx.translate(penguin.x, penguin.y);

      // Penguin shadow
      ctx.beginPath();
      ctx.ellipse(0, 14, 18, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(7, 89, 133, 0.35)';
      ctx.fill();

      // Body (Black & White)
      ctx.beginPath();
      ctx.ellipse(0, -6, 20, 24, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // White Belly
      ctx.beginPath();
      ctx.ellipse(0, -3, 14, 18, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();

      // Eyes
      ctx.beginPath();
      ctx.arc(-6, -18, 4, 0, Math.PI * 2);
      ctx.arc(6, -18, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // Eye shines
      ctx.beginPath();
      ctx.arc(-5, -19, 1.5, 0, Math.PI * 2);
      ctx.arc(7, -19, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Cute Beak (Yellow/Orange)
      ctx.beginPath();
      ctx.moveTo(-5, -13);
      ctx.lineTo(5, -13);
      ctx.lineTo(0, -8);
      ctx.closePath();
      ctx.fillStyle = '#f59e0b';
      ctx.fill();

      // Pink Cheeks
      ctx.beginPath();
      ctx.arc(-11, -12, 3.5, 0, Math.PI * 2);
      ctx.arc(11, -12, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f43f5e';
      ctx.globalAlpha = 0.5;
      ctx.fill();
      ctx.globalAlpha = 1.0;

      // Flippers / Wings
      ctx.beginPath();
      ctx.ellipse(-18, -4, 6, 12, Math.PI * 0.15, 0, Math.PI * 2);
      ctx.ellipse(18, -4, 6, 12, -Math.PI * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // Feet
      ctx.beginPath();
      ctx.ellipse(-7, 14, 7, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(7, 14, 7, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();

      ctx.restore();
    }

    function gameLoop() {
      ctx.clearRect(0, 0, W, H);

      // Water ripples
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      for (let i = 0; i < 6; i++) {
        const rx = (W * 0.18 * i + Date.now() * 0.02) % (W + 60) - 30;
        const ry = (H * 0.16 * i + 40) % H;
        ctx.beginPath();
        ctx.ellipse(rx, ry, 30, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (gameState === 'play' || gameState === 'gameover') {
        // Update & draw floes
        for (let f of floes) {
          f.update();
          f.draw();
        }

        // Update & draw penguin
        updatePenguin();
        drawPenguin();

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.2;
          p.life -= 0.03;
          if (p.life <= 0) {
            particles.splice(i, 1);
          } else {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.restore();
          }
        }
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('pointerdown', (e) => {
      initAudio();
      jumpForward();
    });

    startBtn.addEventListener('click', () => {
      initAudio();
      startOverlay.style.display = 'none';
      initGame();
      gameState = 'play';
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      gameOverOverlay.style.display = 'none';
      initGame();
      gameState = 'play';
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
