<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#seaGrad)"/>
  
  <!-- Floating Ice Floes -->
  <g filter="url(#glow)">
    <!-- Top floe -->
    <rect x="140" y="55" width="120" height="26" rx="13" fill="#bae6fd"/>
    <rect x="140" y="50" width="120" height="20" rx="10" fill="#f0f9ff"/>
    <text x="200" y="65" font-size="18" text-anchor="middle">🦐</text>

    <!-- Middle landing floe -->
    <rect x="80" y="145" width="140" height="30" rx="15" fill="#bae6fd"/>
    <rect x="80" y="140" width="140" height="24" rx="12" fill="#f0f9ff"/>
    <text x="170" y="157" font-size="18" text-anchor="middle">🐟</text>

    <!-- Bottom floe with penguin -->
    <rect x="180" y="215" width="160" height="32" rx="16" fill="#bae6fd"/>
    <rect x="180" y="210" width="160" height="26" rx="13" fill="#f0f9ff"/>
  </g>

  <!-- Jumping Cute Penguin -->
  <g transform="translate(130, 110)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="20" ry="24" fill="#0f172a"/>
    <!-- Belly -->
    <ellipse cx="0" cy="3" rx="14" ry="18" fill="#f8fafc"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-8" r="3.5" fill="#0f172a"/>
    <circle cx="6" cy="-8" r="3.5" fill="#0f172a"/>
    <circle cx="-5" cy="-9" r="1.5" fill="#ffffff"/>
    <circle cx="7" cy="-9" r="1.5" fill="#ffffff"/>
    <!-- Beak -->
    <polygon points="-4,-4 4,-4 0,2" fill="#f59e0b"/>
    <!-- Wings -->
    <ellipse cx="-18" cy="2" rx="6" ry="12" fill="#0f172a" transform="rotate(25 -18 2)"/>
    <ellipse cx="18" cy="2" rx="6" ry="12" fill="#0f172a" transform="rotate(-25 18 2)"/>
    <!-- Feet -->
    <ellipse cx="-7" cy="22" rx="7" ry="4" fill="#f59e0b"/>
    <ellipse cx="7" cy="22" rx="7" ry="4" fill="#f59e0b"/>
  </g>

  <!-- Title text -->
  <text x="200" y="275" font-family="'Pretendard', sans-serif" font-weight="900" font-size="20" fill="#f0f9ff" text-anchor="middle" filter="url(#glow)">🐧 꼬마 펭귄의 빙하 퐁당퐁당</text>
</svg>