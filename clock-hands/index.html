<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111b38">
  <link rel="icon" href="data:,">
  <title>시계 바늘 맞추기</title>
  <style>
    :root { --bg:#111b38; --panel:#1b2a51; --accent:#ffd166; --mint:#69e6c6; --text:#f8fbff; --muted:#b9c6e4; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100vh; height:100dvh; overflow:hidden; touch-action:manipulation; font-family:Arial,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); }
    button, a { -webkit-tap-highlight-color:transparent; }
    .wrap { width:100%; max-width:480px; height:100vh; height:100dvh; margin:0 auto; padding:10px 12px 8px; display:flex; flex-direction:column; gap:8px; }
    h1 { text-align:center; font-size:clamp(20px,5.5vw,28px); line-height:1.15; }
    .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 12px; border-radius:14px; background:rgba(255,255,255,.09); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); font-size:14px; }
    .hud b { color:var(--accent); font-size:17px; }
    .game-area { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:8px; border-radius:20px; background:radial-gradient(circle at 50% 30%,#263b70 0,#172444 62%,#121b34 100%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
    .mission { text-align:center; }
    .mission small { color:var(--muted); display:block; margin-bottom:2px; }
    .target { color:var(--accent); font-size:clamp(22px,6.5vw,32px); font-weight:900; }
    .clock { position:relative; width:min(49vw,206px); aspect-ratio:1; border:7px solid #f8fbff; border-radius:50%; background:linear-gradient(145deg,#fff,#dae4f6); box-shadow:0 14px 30px #0006,inset 0 0 0 3px #a8b7d0; color:#19264a; }
    .tick { position:absolute; inset:7px; transform:rotate(calc(var(--i) * 30deg)); text-align:center; font-size:clamp(12px,3.4vw,16px); font-weight:900; }
    .tick span { display:inline-block; transform:rotate(calc(var(--i) * -30deg)); }
    .hand { position:absolute; left:50%; bottom:50%; width:5px; border-radius:99px; transform-origin:50% 100%; transition:transform .22s ease; }
    .hour { height:29%; background:#24345e; box-shadow:0 0 0 1px #fff8; }
    .minute { height:38%; width:4px; background:#f45b69; }
    .pin { position:absolute; left:50%; top:50%; width:15px; height:15px; border-radius:50%; background:var(--accent); border:3px solid #24345e; transform:translate(-50%,-50%); }
    .controls { width:100%; display:grid; grid-template-columns:1fr 1fr 1.15fr; gap:8px; }
    .control { min-height:50px; border:0; border-radius:14px; color:#17213c; background:#f5f8ff; font-size:16px; font-weight:900; box-shadow:0 4px 0 #b9c6e4; }
    .control[data-action="check"] { background:var(--accent); box-shadow:0 4px 0 #c58e16; }
    .control:active { transform:translateY(2px); box-shadow:0 2px 0 #8696b7; }
    .readout { min-height:24px; color:var(--mint); font-weight:900; text-align:center; font-size:15px; }
    footer { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .home-link { color:var(--accent); font-weight:800; text-decoration:none; min-height:32px; display:flex; align-items:center; }
    .overlay { position:fixed; inset:0; display:grid; place-items:center; padding:20px; background:rgba(5,10,25,.82); backdrop-filter:blur(5px); z-index:10; }
    .overlay.hidden { display:none; }
    .overlay-card { width:min(360px,100%); padding:24px; border-radius:24px; background:#fff; color:#15213f; text-align:center; display:grid; gap:14px; box-shadow:0 24px 70px #0008; }
    .overlay-card h2 { font-size:26px; }
    .overlay-card p { line-height:1.55; color:#4e5b78; }
    .result-score { color:#d68d00; font-size:32px; font-weight:900; }
    .btn-start { min-height:52px; border:0; border-radius:15px; background:var(--accent); color:#17213c; font-size:19px; font-weight:900; }
    @media (max-height:620px) { .wrap{gap:5px;padding-top:6px}.game-area{gap:5px;padding:5px}.clock{width:min(42vw,170px)}.control{min-height:44px}.hud{padding:6px 10px} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>⏰ 시계 바늘 맞추기</h1>
    <div class="hud"><span>정답 <b id="score">0</b></span><span>최고 <b id="bestScore">0</b></span><span>시간 <b id="time">60</b></span></div>
    <section class="game-area" aria-label="시계 맞추기 게임 영역">
      <div class="mission"><small>이 시간이 되도록 맞춰요</small><div class="target" id="target">3시 30분</div></div>
      <div class="clock" aria-label="아날로그 시계">
        <div class="tick" style="--i:1"><span>1</span></div><div class="tick" style="--i:2"><span>2</span></div><div class="tick" style="--i:3"><span>3</span></div>
        <div class="tick" style="--i:4"><span>4</span></div><div class="tick" style="--i:5"><span>5</span></div><div class="tick" style="--i:6"><span>6</span></div>
        <div class="tick" style="--i:7"><span>7</span></div><div class="tick" style="--i:8"><span>8</span></div><div class="tick" style="--i:9"><span>9</span></div>
        <div class="tick" style="--i:10"><span>10</span></div><div class="tick" style="--i:11"><span>11</span></div><div class="tick" style="--i:12"><span>12</span></div>
        <div class="hand hour" id="hourHand"></div><div class="hand minute" id="minuteHand"></div><div class="pin"></div>
      </div>
      <div class="controls">
        <button class="control" data-action="hour" type="button">시 +1</button>
        <button class="control" data-action="minute" type="button">분 +5</button>
        <button class="control" data-action="check" type="button">맞췄어요!</button>
      </div>
      <p class="readout" id="message" aria-live="polite">지금 12시 00분</p>
    </section>
    <footer><small>틀려도 바늘을 다시 움직이면 돼요</small><a class="home-link" href="../index.html">← 홈으로</a></footer>
  </main>

  <div class="overlay" id="startOverlay"><div class="overlay-card"><h2>⏰ 시간을 읽어요</h2><p><b>시 +1</b>과 <b>분 +5</b>를 눌러 목표 시간에 맞춘 뒤 <b>맞췄어요!</b>를 누르세요.</p><button class="btn-start" id="startBtn" type="button">시작!</button></div></div>
  <div class="overlay hidden" id="endOverlay"><div class="overlay-card"><h2>🎉 시간 박사!</h2><div class="result-score" id="finalScore">0개 정답</div><p id="resultMsg"></p><button class="btn-start" id="restartBtn" type="button">다시 하기</button></div></div>

  <script>
  (() => {
    'use strict';
    const CONFIG = { duration:60, minutes:[0,15,30,45], storageKey:'clock-hands_best' };
    const state = { running:false, score:0, seconds:CONFIG.duration, hour:12, minute:0, targetHour:3, targetMinute:30, timer:null, lastTarget:'' };
    const $ = id => document.getElementById(id);
    const els = { score:$('score'), best:$('bestScore'), time:$('time'), target:$('target'), hourHand:$('hourHand'), minuteHand:$('minuteHand'), message:$('message'), start:$('startOverlay'), end:$('endOverlay'), final:$('finalScore'), result:$('resultMsg') };
    function best() { try { return Number(localStorage.getItem(CONFIG.storageKey) || 0); } catch (_) { return 0; } }
    function saveBest(value) { try { localStorage.setItem(CONFIG.storageKey, String(value)); } catch (_) {} }
    function timeLabel(hour, minute) { return `${hour}시 ${String(minute).padStart(2,'0')}분`; }
    function drawClock() {
      const minuteAngle = state.minute * 6;
      const hourAngle = (state.hour % 12) * 30 + state.minute * .5;
      els.minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
      els.hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
      els.message.textContent = `지금 ${timeLabel(state.hour,state.minute)}`;
    }
    function newTarget() {
      let key;
      do {
        state.targetHour = 1 + Math.floor(Math.random() * 12);
        state.targetMinute = CONFIG.minutes[Math.floor(Math.random() * CONFIG.minutes.length)];
        key = `${state.targetHour}:${state.targetMinute}`;
      } while (key === state.lastTarget);
      state.lastTarget = key;
      state.hour = 12;
      state.minute = 0;
      els.target.textContent = timeLabel(state.targetHour,state.targetMinute);
      drawClock();
    }
    function check() {
      if (!state.running) return;
      if (state.hour === state.targetHour && state.minute === state.targetMinute) {
        state.score += 1;
        els.score.textContent = state.score;
        els.message.textContent = '딩동! 정확해요 👏';
        window.setTimeout(() => { if (state.running) newTarget(); }, 420);
      } else {
        const hourHint = state.hour === state.targetHour ? '시는 맞았어요!' : '시 바늘을 다시 봐요.';
        const minuteHint = state.minute === state.targetMinute ? ' 분도 맞았어요!' : ' 분 바늘도 확인해요.';
        els.message.textContent = hourHint + minuteHint;
      }
    }
    function startGame() {
      window.clearInterval(state.timer);
      state.running = true; state.score = 0; state.seconds = CONFIG.duration; state.lastTarget = '';
      els.score.textContent = '0'; els.time.textContent = state.seconds; els.best.textContent = best();
      els.start.classList.add('hidden'); els.end.classList.add('hidden');
      newTarget();
      state.timer = window.setInterval(() => {
        state.seconds -= 1; els.time.textContent = state.seconds;
        if (state.seconds <= 0) endGame();
      }, 1000);
    }
    function endGame() {
      if (!state.running) return;
      state.running = false; window.clearInterval(state.timer);
      const record = Math.max(best(), state.score); saveBest(record); els.best.textContent = record;
      els.final.textContent = `${state.score}개 정답`;
      els.result.textContent = state.score >= 8 ? `대단해요! 최고 기록 ${record}개` : `시계를 차근차근 읽었어요. 최고 기록 ${record}개`;
      els.end.classList.remove('hidden');
    }
    document.querySelector('.controls').addEventListener('pointerdown', event => {
      const button = event.target.closest('button[data-action]'); if (!button || !state.running) return;
      if (button.dataset.action === 'hour') { state.hour = state.hour % 12 + 1; drawClock(); }
      if (button.dataset.action === 'minute') { state.minute = (state.minute + 5) % 60; drawClock(); }
      if (button.dataset.action === 'check') check();
    });
    $('startBtn').addEventListener('pointerdown', startGame);
    $('restartBtn').addEventListener('pointerdown', startGame);
    els.best.textContent = best(); drawClock();
  })();
  </script>
</body>
</html>
