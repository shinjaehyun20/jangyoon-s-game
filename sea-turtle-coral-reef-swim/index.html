<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐢 아기 바다거북의 산호초 무지개 헤엄</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #0284C7 0%, #0369A1 50%, #0F766E 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #024E68;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 51, 68, 0.85);
      color: #E0F2FE;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(8px);
    }
    .home-btn {
      color: #F0FDF4;
      text-decoration: none;
      font-size: 14px;
      background: rgba(16, 185, 129, 0.35);
      padding: 5px 12px;
      border-radius: 14px;
      transition: background 0.2s;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }
    .badge {
      background: rgba(6, 182, 212, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #A5F3FC;
      border: 1px solid rgba(165, 243, 252, 0.3);
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 51, 68, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      z-index: 20;
      color: #F0FDFA;
      backdrop-filter: blur(6px);
    }
    .screen-overlay h1 {
      font-size: 26px;
      margin-bottom: 14px;
      color: #6EE7B7;
      text-shadow: 0 3px 14px rgba(52, 211, 153, 0.5);
      line-height: 1.3;
    }
    .screen-overlay p {
      font-size: 15px;
      color: #CFFAFE;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .start-btn {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #FFF;
      border: none;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .start-btn:active {
      transform: scale(0.96);
    }
    .stats-card {
      background: rgba(15, 118, 110, 0.4);
      border: 1px solid rgba(110, 231, 183, 0.3);
      border-radius: 16px;
      padding: 16px 28px;
      margin-bottom: 20px;
      color: #CFFAFE;
      font-size: 16px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../" class="home-btn">← 목록</a>
      <span class="badge" id="score-display">점수: 0</span>
      <span class="badge" id="timer-display">시간: 60초</span>
    </header>
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-overlay">
      <div style="font-size: 60px; margin-bottom: 12px; filter: drop-shadow(0 0 16px rgba(52, 211, 153, 0.8));">🐢</div>
      <h1>아기 바다거북의<br>산호초 무지개 헤엄</h1>
      <p>에메랄드빛 투명한 바닷속을 헤엄치며<br>화면을 터치해 아기 거북이를 이끌고<br>진주와 무지개 별을 모아보세요!</p>
      <button class="start-btn" id="start-button">바닷속 헤엄치기 시작</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen-overlay" style="display: none;">
      <div style="font-size: 54px; margin-bottom: 10px;">🌊🐢✨</div>
      <h1>신나는 바다 탐험 완료!</h1>
      <p id="gameover-desc">아기 거북이가 산호초 친구들과 즐거운 하루를 보냈어요!</p>
      <div class="stats-card">
        <div>모은 진주와 보석: <b id="final-score" style="color: #6EE7B7; font-size: 22px;">0</b> 점</div>
        <div>최대 수영 콤보: <b id="final-combo" style="color: #38BDF8;">0</b> 회</div>
      </div>
      <button class="start-btn" id="restart-button">다시 헤엄치기</button>
    </div>
  </div>

  <script>
    // --- Audio Synthesis (Ocean Harps & Water Bubble Pop) ---
    class OceanAudio {
      constructor() {
        this.ctx = null;
        this.notes = [349.23, 392.00, 440.00, 523.25, 587.33, 659.25, 698.46, 783.99]; // F Major Pentatonic
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playBubble(freqMultiplier = 1) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        const startFreq = 400 * freqMultiplier;
        const endFreq = 900 * freqMultiplier;
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.12);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
      }
      playHarp(combo = 0) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const freq = this.notes[combo % this.notes.length];
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.8);
      }
    }

    const audio = new OceanAudio();

    // --- Canvas & State ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const startButton = document.getElementById('start-button');
    const restartButton = document.getElementById('restart-button');
    const finalScoreEl = document.getElementById('final-score');
    const finalComboEl = document.getElementById('final-combo');

    let width = 0;
    let height = 0;
    let isPlaying = false;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let animationId = null;

    let items = [];
    let particles = [];
    let bubbles = [];
    let fishes = [];
    let spawnTimer = 0;

    // Turtle Mascot
    const turtle = {
      x: 240,
      y: 400,
      targetX: 240,
      targetY: 400,
      angle: 0,
      speed: 0.08,
      flipperAngle: 0,
      swimSpeed: 0.12
    };

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      if (!isPlaying) {
        turtle.x = width / 2;
        turtle.y = height / 2;
        turtle.targetX = width / 2;
        turtle.targetY = height / 2;
      }
    }
    window.addEventListener('resize', resize);

    // --- Collectible Items ---
    const ITEM_TYPES = [
      { type: 'pearl', points: 100, color: '#FFFFFF', glow: '#BAE6FD', size: 14, label: '진주' },
      { type: 'star', points: 250, color: '#FDE047', glow: '#FEF08A', size: 16, label: '별', isBonus: true },
      { type: 'kelp', points: 150, color: '#34D399', glow: '#A7F3D0', size: 15, label: '해초' }
    ];

    class Collectible {
      constructor() {
        const itemInfo = ITEM_TYPES[Math.random() < 0.25 ? 1 : (Math.random() < 0.6 ? 0 : 2)];
        this.info = itemInfo;
        this.x = 30 + Math.random() * (width - 60);
        this.y = height + 30;
        this.speed = 1.0 + Math.random() * 1.5;
        this.sway = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.02 + Math.random() * 0.02;
        this.radius = itemInfo.size;
      }
      update() {
        this.y -= this.speed;
        this.sway += this.swaySpeed;
        this.curX = this.x + Math.sin(this.sway) * 15;
        return this.y > -40;
      }
      draw(c) {
        c.save();
        c.translate(this.curX, this.y);
        c.shadowColor = this.info.glow;
        c.shadowBlur = 14;

        if (this.info.type === 'pearl') {
          // Pearly luster
          const grad = c.createRadialGradient(-3, -3, 2, 0, 0, this.radius);
          grad.addColorStop(0, '#FFFFFF');
          grad.addColorStop(0.6, '#E0F2FE');
          grad.addColorStop(1, '#93C5FD');
          c.fillStyle = grad;
          c.beginPath();
          c.arc(0, 0, this.radius, 0, Math.PI * 2);
          c.fill();
        } else if (this.info.type === 'star') {
          // Sea Star
          c.fillStyle = '#FDE047';
          c.beginPath();
          for (let i = 0; i < 5; i++) {
            const rot = (Math.PI * 2 / 5) * i - Math.PI / 2;
            const innerRot = rot + Math.PI / 5;
            const r1 = this.radius * 1.3;
            const r2 = this.radius * 0.6;
            if (i === 0) c.moveTo(Math.cos(rot) * r1, Math.sin(rot) * r1);
            else c.lineTo(Math.cos(rot) * r1, Math.sin(rot) * r1);
            c.lineTo(Math.cos(innerRot) * r2, Math.sin(innerRot) * r2);
          }
          c.closePath();
          c.fill();
        } else {
          // Kelp Leaf
          c.fillStyle = '#34D399';
          c.beginPath();
          c.ellipse(0, 0, this.radius * 0.7, this.radius * 1.4, Math.PI / 6, 0, Math.PI * 2);
          c.fill();
        }
        c.restore();
      }
      checkHit(tx, ty, tr) {
        const dx = tx - this.curX;
        const dy = ty - this.y;
        return (dx * dx + dy * dy) < (this.radius + tr) ** 2;
      }
    }

    // --- Particle Effect ---
    class WaterSparkle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 3.5;
        this.vx = Math.cos(ang) * spd;
        this.vy = Math.sin(ang) * spd;
        this.alpha = 1;
        this.size = 3 + Math.random() * 3;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy -= 0.04; // buoyant lift
        this.alpha -= 0.025;
        return this.alpha > 0;
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.fillStyle = this.color;
        c.shadowColor = this.color;
        c.shadowBlur = 6;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // --- Ambient Bubble ---
    class Bubble {
      constructor() {
        this.x = Math.random() * width;
        this.y = height + 10;
        this.radius = 2 + Math.random() * 5;
        this.speed = 1 + Math.random() * 2;
        this.sway = Math.random() * Math.PI * 2;
      }
      update() {
        this.y -= this.speed;
        this.sway += 0.03;
        this.x += Math.sin(this.sway) * 0.6;
        return this.y > -20;
      }
      draw(c) {
        c.save();
        c.strokeStyle = 'rgba(224, 242, 254, 0.7)';
        c.fillStyle = 'rgba(224, 242, 254, 0.2)';
        c.lineWidth = 1.2;
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        c.fill();
        c.stroke();
        c.restore();
      }
    }

    // --- Ambient Tiny Clownfish ---
    class MiniFish {
      constructor() {
        this.y = 80 + Math.random() * (height - 240);
        this.dir = Math.random() < 0.5 ? 1 : -1;
        this.x = this.dir === 1 ? -30 : width + 30;
        this.speed = (1 + Math.random() * 1.5) * this.dir;
        this.color = Math.random() < 0.5 ? '#FB923C' : '#38BDF8';
        this.wiggle = Math.random() * Math.PI * 2;
      }
      update() {
        this.x += this.speed;
        this.wiggle += 0.15;
        return this.dir === 1 ? this.x < width + 50 : this.x > -50;
      }
      draw(c) {
        c.save();
        c.translate(this.x, this.y + Math.sin(this.wiggle) * 4);
        c.scale(this.dir, 1);
        c.fillStyle = this.color;
        c.beginPath();
        c.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
        c.fill();
        // Tail fin
        c.beginPath();
        c.moveTo(-10, 0);
        c.lineTo(-18, -6);
        c.lineTo(-18, 6);
        c.closePath();
        c.fill();
        // Eye
        c.fillStyle = '#FFF';
        c.beginPath();
        c.arc(6, -2, 2, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#000';
        c.beginPath();
        c.arc(7, -2, 1, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // --- Draw Baby Sea Turtle ---
    function drawTurtle(c) {
      c.save();
      c.translate(turtle.x, turtle.y);
      c.rotate(turtle.angle + Math.PI / 2); // face forward swimming direction

      const flap = Math.sin(turtle.flipperAngle) * 0.25;

      // Back Flippers
      c.fillStyle = '#34D399';
      c.beginPath();
      c.ellipse(-14, 20, 5, 10, -0.4, 0, Math.PI * 2);
      c.ellipse(14, 20, 5, 10, 0.4, 0, Math.PI * 2);
      c.fill();

      // Front Flippers (Graceful stroke)
      c.save();
      c.translate(-14, -6);
      c.rotate(-0.5 + flap);
      c.beginPath();
      c.ellipse(-14, 0, 16, 6, -0.2, 0, Math.PI * 2);
      c.fill();
      c.restore();

      c.save();
      c.translate(14, -6);
      c.rotate(0.5 - flap);
      c.beginPath();
      c.ellipse(14, 0, 16, 6, 0.2, 0, Math.PI * 2);
      c.fill();
      c.restore();

      // Shell
      c.shadowColor = '#059669';
      c.shadowBlur = 10;
      c.fillStyle = '#059669';
      c.beginPath();
      c.ellipse(0, 4, 20, 24, 0, 0, Math.PI * 2);
      c.fill();

      // Shell Pattern
      c.shadowBlur = 0;
      c.fillStyle = '#047857';
      c.beginPath();
      c.ellipse(0, 2, 8, 10, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = '#6EE7B7';
      c.lineWidth = 1.5;
      c.stroke();

      // Head
      c.fillStyle = '#34D399';
      c.beginPath();
      c.ellipse(0, -22, 9, 11, 0, 0, Math.PI * 2);
      c.fill();

      // Big Cute Eyes
      c.fillStyle = '#064E3B';
      c.beginPath();
      c.arc(-5, -24, 3, 0, Math.PI * 2);
      c.arc(5, -24, 3, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#FFF';
      c.beginPath();
      c.arc(-6, -25, 1.2, 0, Math.PI * 2);
      c.arc(4, -25, 1.2, 0, Math.PI * 2);
      c.fill();

      // Cheeks
      c.fillStyle = 'rgba(244, 63, 94, 0.5)';
      c.beginPath();
      c.arc(-6, -20, 2, 0, Math.PI * 2);
      c.arc(6, -20, 2, 0, Math.PI * 2);
      c.fill();

      c.restore();
    }

    // --- Input Handling ---
    function setTarget(clientX, clientY) {
      if (!isPlaying) return;
      audio.init();

      const rect = canvas.getBoundingClientRect();
      turtle.targetX = Math.max(30, Math.min(width - 30, clientX - rect.left));
      turtle.targetY = Math.max(50, Math.min(height - 80, clientY - rect.top));
    }

    canvas.addEventListener('pointerdown', (e) => setTarget(e.clientX, e.clientY));
    canvas.addEventListener('pointermove', (e) => {
      if (e.buttons > 0) setTarget(e.clientX, e.clientY);
    });

    // --- Game Loop ---
    function gameLoop() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, width, height);

      // 1. Ambient Sunrays
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.beginPath();
      ctx.moveTo(width * 0.2, 0);
      ctx.lineTo(width * 0.4, 0);
      ctx.lineTo(width * 0.6, height);
      ctx.lineTo(width * 0.3, height);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(width * 0.6, 0);
      ctx.lineTo(width * 0.8, 0);
      ctx.lineTo(width, height);
      ctx.lineTo(width * 0.7, height);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 2. Corals & Seaweed at Bottom
      ctx.save();
      // Seaweed
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      for (let i = 0; i < width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, height);
        const wave = Math.sin(Date.now() * 0.002 + i) * 12;
        ctx.quadraticCurveTo(i + wave, height - 40, i - wave, height - 70);
        ctx.stroke();
      }
      // Pink Coral
      ctx.fillStyle = 'rgba(244, 63, 94, 0.7)';
      ctx.beginPath();
      ctx.arc(30, height - 20, 28, 0, Math.PI * 2);
      ctx.arc(width - 30, height - 20, 32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 3. Mini Fish
      if (Math.random() < 0.02) {
        fishes.push(new MiniFish());
      }
      for (let i = fishes.length - 1; i >= 0; i--) {
        const f = fishes[i];
        if (f.update()) {
          f.draw(ctx);
        } else {
          fishes.splice(i, 1);
        }
      }

      // 4. Ambient Bubbles
      if (Math.random() < 0.15) {
        bubbles.push(new Bubble());
      }
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (b.update()) {
          b.draw(ctx);
        } else {
          bubbles.splice(i, 1);
        }
      }

      // 5. Update Turtle Position & Rotation
      const dx = turtle.targetX - turtle.x;
      const dy = turtle.targetY - turtle.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 4) {
        turtle.x += dx * turtle.speed;
        turtle.y += dy * turtle.speed;
        const targetAngle = Math.atan2(dy, dx);
        // smooth angular lerp
        let diff = targetAngle - turtle.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        turtle.angle += diff * 0.1;
        turtle.flipperAngle += turtle.swimSpeed;
      }

      // 6. Spawn Collectibles
      spawnTimer++;
      if (spawnTimer > 40) {
        items.push(new Collectible());
        spawnTimer = 0;
      }

      // 7. Update & Draw Collectibles + Collision
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        if (item.update()) {
          item.draw(ctx);

          // Check turtle catch
          if (item.checkHit(turtle.x, turtle.y, 22)) {
            combo++;
            if (combo > maxCombo) maxCombo = combo;

            const pts = item.info.points + combo * 15;
            score += pts;
            scoreDisplay.textContent = `점수: ${score}`;

            audio.playBubble(1 + (combo % 5) * 0.15);
            audio.playHarp(combo);

            // Sparkles
            for (let p = 0; p < 16; p++) {
              particles.push(new WaterSparkle(item.curX, item.y, item.info.color));
            }

            items.splice(i, 1);
          }
        } else {
          items.splice(i, 1);
          if (combo > 0) combo = 0; // Miss reset
        }
      }

      // 8. Update & Draw Sparkles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.update()) {
          p.draw(ctx);
        } else {
          particles.splice(i, 1);
        }
      }

      // 9. Draw Turtle
      drawTurtle(ctx);

      // 10. Combo Display
      if (combo >= 2) {
        ctx.save();
        ctx.fillStyle = '#6EE7B7';
        ctx.shadowColor = '#059669';
        ctx.shadowBlur = 10;
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`🌊 ${combo} COMBO! 🌊`, width / 2, 45);
        ctx.restore();
      }

      animationId = requestAnimationFrame(gameLoop);
    }

    // --- Start / Stop ---
    function startGame() {
      audio.init();
      resize();

      score = 0;
      combo = 0;
      maxCombo = 0;
      timeLeft = 60;
      items = [];
      particles = [];
      bubbles = [];
      fishes = [];
      spawnTimer = 0;
      isPlaying = true;

      turtle.x = width / 2;
      turtle.y = height / 2;
      turtle.targetX = width / 2;
      turtle.targetY = height / 2;

      scoreDisplay.textContent = `점수: 0`;
      timerDisplay.textContent = `시간: 60초`;
      startScreen.style.display = 'none';
      gameoverScreen.style.display = 'none';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `시간: ${timeLeft}초`;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      cancelAnimationFrame(animationId);

      finalScoreEl.textContent = score.toLocaleString();
      finalComboEl.textContent = maxCombo;
      gameoverScreen.style.display = 'flex';
    }

    startButton.addEventListener('click', startGame);
    restartButton.addEventListener('click', startGame);

    // Initial resize
    resize();
  </script>
</body>
</html>
