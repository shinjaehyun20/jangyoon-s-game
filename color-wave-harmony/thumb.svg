<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#0c0816" rx="10"/>
  <!-- Color Wheel Background -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#rainbow-grad)" stroke-width="8"/>
  <!-- Needle -->
  <line x1="50" y1="50" x2="70" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="70" cy="30" r="3" fill="#ffffff"/>
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
  <!-- Target Color box -->
  <rect x="35" y="10" width="30" height="10" rx="3" fill="none" stroke="#ff007f" stroke-width="1"/>
  <circle cx="42" cy="15" r="3" fill="#ff0000"/>
  <text x="58" y="18" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#ff007f" text-anchor="middle">Red</text>
  <!-- Gradients -->
  <defs>
    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="20%" stop-color="#ffff00"/>
      <stop offset="40%" stop-color="#00ff00"/>
      <stop offset="60%" stop-color="#00ffff"/>
      <stop offset="80%" stop-color="#0000ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
  </defs>
</svg>
