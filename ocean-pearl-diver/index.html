<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌊 해저 진주 조개 찾기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      background: linear-gradient(180deg, #0b2b40 0%, #051824 100%);
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      color: #fff;
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 8px; gap: 8px;
      margin: 0 auto;
      position: relative;
    }
    h1 {
      font-size: clamp(20px, 5.5vw, 26px);
      text-align: center;
      color: #7ee8fa;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.1);
      padding: 8px 16px; border-radius: 12px;
      font-size: 16px; font-weight: bold;
      backdrop-filter: blur(4px);
    }
    .hud-val { color: #ffe600; font-size: 18px; }
    #gameArea {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #134e70 0%, #092233 100%);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .clam {
      position: absolute;
      width: 70px; height: 70px;
      display: flex; justify-content: center; align-items: center;
      font-size: 40px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    .clam:active { transform: scale(1.2); }
    .floating-pearl {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 8px #7ee8fa;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.4); }
    }
    footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: rgba(255,255,255,0.7);
    }
    .home-link {
      color: #7ee8fa; text-decoration: none; font-weight: bold;
      background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px;
    }
    .overlay {
      position: absolute; inset: 0;
      background: rgba(5, 24, 36, 0.85);
      display: flex; justify-content: center; align-items: center;
      z-index: 100; backdrop-filter: blur(6px);
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: #0d3852; border: 2px solid #7ee8fa;
      padding: 24px; border-radius: 20px; text-align: center;
      width: 85%; max-width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .overlay-card h2 { font-size: 24px; color: #7ee8fa; margin-bottom: 12px; }
    .overlay-card p { font-size: 15px; color: #d0eef7; margin-bottom: 20px; line-height: 1.5; }
    .btn-start {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff; border: none; padding: 14px 28px;
      font-size: 18px; font-weight: bold; border-radius: 30px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
      width: 100%; min-height: 48px;
    }
    .btn-start:active { transform: scale(0.98); }
    .bubble {
      position: absolute; background: rgba(255,255,255,0.15); border-radius: 50%;
      pointer-events: none; animation: rise 4s infinite linear;
    }
    @keyframes rise {
      0% { transform: translateY(100%) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🌊 해저 진주 조개 찾기</h1>

    <div class="hud">
      <div>⏱️ 시간: <span class="hud-val" id="timeVal">30</span>초</div>
      <div>✨ 진주: <span class="hud-val" id="scoreVal">0</span>개</div>
      <div>🏆 최고: <span class="hud-val" id="bestVal">0</span></div>
    </div>

    <div id="gameArea"></div>

    <footer>
      <small>💡 여는 조개를 터치해 반짝이는 진주를 모아요!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🌊 바닷속 진주 조개</h2>
      <p>바닷속에 톡톡 반짝이는 조개가 열려요!<br>조개를 터치해서 진짜 진주를 수집해보세요! ✨</p>
      <button class="btn-start" id="startBtn">탐험 시작!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 탐험 완료!</h2>
      <p id="resultMsg">멋져요! 진주를 0개 찾았어요!</p>
      <button class="btn-start" id="restartBtn">다시 탐험하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const GAME_TIME = 30;
    const STORAGE_KEY = 'ocean-pearl-diver_best';

    const gameArea = document.getElementById('gameArea');
    const timeVal = document.getElementById('timeVal');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resultMsg = document.getElementById('resultMsg');

    let score = 0;
    let timeLeft = GAME_TIME;
    let timer = null;
    let spawnTimer = null;
    let bestScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
    bestVal.textContent = bestScore;

    // Create background decorative bubbles
    for (let i = 0; i < 8; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = Math.random() * 15 + 10;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = Math.random() * 90 + '%';
      b.style.animationDuration = (Math.random() * 3 + 3) + 's';
      b.style.animationDelay = (Math.random() * 2) + 's';
      gameArea.appendChild(b);
    }

    function startGame() {
      score = 0;
      timeLeft = GAME_TIME;
      scoreVal.textContent = score;
      timeVal.textContent = timeLeft;

      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');

      // Clear existing clams
      const clams = gameArea.querySelectorAll('.clam');
      clams.forEach(c => c.remove());

      clearInterval(timer);
      clearInterval(spawnTimer);

      timer = setInterval(() => {
        timeLeft--;
        timeVal.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      spawnClam();
      spawnTimer = setInterval(spawnClam, 900);
    }

    function spawnClam() {
      if (timeLeft <= 0) return;
      const clamsCount = gameArea.querySelectorAll('.clam').length;
      if (clamsCount >= 5) return;

      const clam = document.createElement('div');
      clam.className = 'clam';
      clam.textContent = '🦪'; // closed clam

      const areaWidth = gameArea.clientWidth - 80;
      const areaHeight = gameArea.clientHeight - 80;

      const x = Math.max(10, Math.random() * areaWidth);
      const y = Math.max(10, Math.random() * areaHeight);

      clam.style.left = x + 'px';
      clam.style.top = y + 'px';

      let isOpen = false;
      let hasPearl = Math.random() > 0.3; // 70% chance of pearl

      // Clam opens after short delay
      setTimeout(() => {
        if (!clam.parentNode) return;
        isOpen = true;
        clam.textContent = hasPearl ? '🦪' : '🐚';
        clam.style.transform = 'scale(1.1)';
      }, Math.random() * 400 + 200);

      const handleTap = (e) => {
        e.preventDefault();
        if (!clam.parentNode) return;

        if (hasPearl) {
          score++;
          scoreVal.textContent = score;
          showFloatingPearl(x + 20, y, '+1 ✨');
        } else {
          showFloatingPearl(x + 20, y, '💦');
        }

        clam.remove();
      };

      clam.addEventListener('pointerdown', handleTap);

      // Clam disappears after 2 seconds
      setTimeout(() => {
        if (clam.parentNode) {
          clam.remove();
        }
      }, 2200);

      gameArea.appendChild(clam);
    }

    function showFloatingPearl(x, y, text) {
      const p = document.createElement('div');
      p.className = 'floating-pearl';
      p.textContent = text;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      gameArea.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }

    function endGame() {
      clearInterval(timer);
      clearInterval(spawnTimer);

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem(STORAGE_KEY, bestScore);
        bestVal.textContent = bestScore;
      }

      resultMsg.innerHTML = `대단해요! ✨ 진주 <strong>${score}개</strong>를 수집했어요!<br>(최고 기록: ${bestScore}개)`;
      endOverlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  })();
  </script>
</body>
</html>
