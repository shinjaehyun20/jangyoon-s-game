<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE"/>
      <stop offset="60%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="whaleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0277BD"/>
    </linearGradient>
  </defs>

  <!-- Rounded Background -->
  <rect width="300" height="300" rx="28" fill="url(#bgGrad)"/>

  <!-- Rainbow Fountain Streams -->
  <g transform="translate(150, 185)">
    <!-- Rainbow arcs -->
    <path d="M -25,0 Q -25,-120 0,-130 Q 25,-120 25,0" stroke="#FF1744" stroke-width="5" fill="none" opacity="0.9"/>
    <path d="M -20,0 Q -20,-115 0,-125 Q 20,-115 20,0" stroke="#FF9100" stroke-width="5" fill="none" opacity="0.9"/>
    <path d="M -15,0 Q -15,-110 0,-120 Q 15,-110 15,0" stroke="#FFEA00" stroke-width="5" fill="none" opacity="0.9"/>
    <path d="M -10,0 Q -10,-105 0,-115 Q 10,-105 10,0" stroke="#00E676" stroke-width="5" fill="none" opacity="0.9"/>
    <path d="M -5,0 Q -5,-100 0,-110 Q 5,-100 5,0" stroke="#00B0FF" stroke-width="5" fill="none" opacity="0.9"/>
  </g>

  <!-- Musical Notes & Stars bursting from fountain -->
  <circle cx="150" cy="55" r="14" fill="#FFD54F"/>
  <text x="150" y="60" font-size="14" text-anchor="middle" fill="#5D4037" font-weight="bold">⭐</text>

  <circle cx="110" cy="75" r="12" fill="#FF80AB"/>
  <text x="110" y="80" font-size="12" text-anchor="middle" fill="#FFFFFF">🎵</text>

  <circle cx="190" cy="75" r="12" fill="#B388FF"/>
  <text x="190" y="80" font-size="12" text-anchor="middle" fill="#FFFFFF">🎶</text>

  <!-- Water drops -->
  <circle cx="90" cy="110" r="5" fill="#80D8FF"/>
  <circle cx="210" cy="110" r="5" fill="#80D8FF"/>
  <circle cx="135" cy="40" r="4" fill="#FFF59D"/>
  <circle cx="165" cy="40" r="4" fill="#FFF59D"/>

  <!-- Ocean Waves -->
  <path d="M 0,230 Q 75,215 150,230 T 300,230 L 300,300 L 0,300 Z" fill="#01579B" opacity="0.6"/>

  <!-- Cute Baby Whale -->
  <g transform="translate(150, 215)">
    <!-- Tail -->
    <path d="M -55,-10 Q -75,-25 -85,-10 Q -70,5 -50,5 Z" fill="#0277BD"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="60" ry="38" fill="url(#whaleGrad)"/>
    <!-- White Belly -->
    <path d="M -45,10 Q 0,42 45,10 Q 0,22 -45,10 Z" fill="#E1F5FE"/>
    <!-- Flipper Fin -->
    <ellipse cx="10" cy="12" rx="16" ry="9" transform="rotate(25 10 12)" fill="#01579B"/>
    <!-- Eye -->
    <circle cx="35" cy="-8" r="4.5" fill="#01579B"/>
    <circle cx="37" cy="-10" r="2" fill="#FFFFFF"/>
    <!-- Rosy Cheek -->
    <circle cx="26" cy="3" r="6" fill="#FF8A80" opacity="0.7"/>
    <!-- Cute Smile -->
    <path d="M 38,-1 Q 45,6 52,-1" stroke="#01579B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
