<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🫧 제미니 우주 방울 팡팡</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Noto Sans KR', sans-serif;
    background: #0a1128;
    color: #fff;
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 12px 14px; gap: 10px;
    margin: 0 auto;
  }
  h1 {
    font-size: clamp(20px, 5vw, 26px);
    text-align: center;
    color: #80e5ff;
    text-shadow: 0 0 16px rgba(128,229,255,0.6);
  }
  .hud {
    display: flex; justify-content: space-between;
    background: rgba(255,255,255,0.08);
    border-radius: 14px; padding: 10px 16px;
    font-size: 15px; font-weight: 700;
    backdrop-filter: blur(8px);
  }
  #gameCanvas {
    position: relative; flex: 1;
    border-radius: 20px; overflow: hidden;
    background: radial-gradient(circle at 50% 80%, #1c2a4a 0%, #0c1833 60%, #050b18 100%);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 20px rgba(0,180,255,0.2);
    touch-action: none; cursor: pointer;
  }
  .bubble {
    position: absolute; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; cursor: pointer;
    box-shadow: inset -4px -4px 10px rgba(0,0,0,0.3), inset 4px 4px 10px rgba(255,255,255,0.6), 0 4px 15px rgba(0,180,255,0.3);
    border: 2px solid rgba(255,255,255,0.5);
    animation: riseUp 3.5s linear forwards;
  }
  @keyframes riseUp {
    0% { transform: translateY(0) scale(0.9); opacity: 0.9; }
    100% { transform: translateY(-550px) scale(1.1); opacity: 0.2; }
  }
  .pop-effect {
    position: absolute; pointer-events: none;
    font-size: 24px; animation: popFade 0.4s forwards ease-out;
  }
  @keyframes popFade {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  .overlay {
    position: absolute; inset: 0;
    background: rgba(8,14,30,0.88);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; border-radius: 20px; z-index: 10;
  }
  .btn-start {
    background: linear-gradient(135deg, #00d2ff, #3a7bd5);
    color: #fff; font-size: 20px; font-weight: 800;
    padding: 14px 32px; border: none; border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0,210,255,0.4);
    cursor: pointer; transition: transform 0.15s;
  }
  .btn-start:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🫧 제미니 우주 방울 팡팡</h1>
  <div class="hud">
    <div>⏱️ 시간: <span id="time">40</span>s</div>
    <div>🫧 터뜨림: <span id="score">0</span></div>
    <div>🏆 최고: <span id="best">0</span></div>
  </div>
  <div id="gameCanvas">
    <div id="overlay" class="overlay">
      <h2 style="color: #80e5ff; font-size: 24px;">우주 방울을 톡톡 터뜨려요!</h2>
      <p style="color: #c0e0ff; font-size: 15px; text-align: center; line-height: 1.5;">
        위로 올라가는 무중력 우주 방울을 톡톡 탭해서<br>40초 동안 최고의 방울 구조 기록을 세우세요!
      </p>
      <button class="btn-start" onclick="startGame()">🚀 시작하기</button>
    </div>
  </div>
</div>

<script>
let score = 0, time = 40, timerId = null, spawnId = null;
let best = parseInt(localStorage.getItem('gemini_bubble_best') || '0');
document.getElementById('best').innerText = best;

const canvas = document.getElementById('gameCanvas');
const timeEl = document.getElementById('time');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');

// Web Audio API 비눗방울 팡 소리
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playPopSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}

function startGame() {
  score = 0; time = 40;
  scoreEl.innerText = score;
  timeEl.innerText = time;
  overlay.style.display = 'none';

  document.querySelectorAll('.bubble').forEach(el => el.remove());

  timerId = setInterval(() => {
    time--;
    timeEl.innerText = time;
    if (time <= 0) endGame();
  }, 1000);

  spawnBubble();
  spawnId = setInterval(spawnBubble, 650);
}

function spawnBubble() {
  if (time <= 0) return;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const items = ['🚀', '👾', '🐱', '🐶', '🦄', '🛸', '⭐'];
  const bgColors = ['rgba(0,210,255,0.3)', 'rgba(168,85,247,0.3)', 'rgba(236,72,153,0.3)', 'rgba(34,197,94,0.3)'];
  
  const icon = items[Math.floor(Math.random() * items.length)];
  const size = 56 + Math.floor(Math.random() * 24);

  bubble.innerText = icon;
  bubble.style.width = size + 'px';
  bubble.style.height = size + 'px';
  bubble.style.background = bgColors[Math.floor(Math.random() * bgColors.length)];

  const rect = canvas.getBoundingClientRect();
  const x = 30 + Math.random() * (rect.width - 90);
  bubble.style.left = x + 'px';
  bubble.style.bottom = '-60px';

  bubble.onclick = (e) => {
    e.stopPropagation();
    score += (icon === '🚀' || icon === '🛸') ? 20 : 10;
    scoreEl.innerText = score;
    playPopSound();
    createPop(x, parseFloat(bubble.getBoundingClientRect().top - canvas.getBoundingClientRect().top));
    bubble.remove();
  };

  canvas.appendChild(bubble);
  setTimeout(() => { if (bubble.parentNode) bubble.remove(); }, 3600);
}

function createPop(x, y) {
  const pop = document.createElement('div');
  pop.className = 'pop-effect';
  pop.innerText = '💥';
  pop.style.left = x + 'px';
  pop.style.top = y + 'px';
  canvas.appendChild(pop);
  setTimeout(() => pop.remove(), 400);
}

function endGame() {
  clearInterval(timerId); clearInterval(spawnId);
  if (score > best) {
    best = score;
    localStorage.setItem('gemini_bubble_best', best);
    document.getElementById('best').innerText = best;
  }
  overlay.style.display = 'flex';
  overlay.querySelector('h2').innerText = '🎉 미션 완료!';
  overlay.querySelector('p').innerHTML = `터뜨린 방울 점수: <b style="color:#80e5ff; font-size:20px;">${score}점</b><br>최고 우주 기록: ${best}점`;
  overlay.querySelector('.btn-start').innerText = '🔄 다시 하기';
}
</script>
</body>
</html>
