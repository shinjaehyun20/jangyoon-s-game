  </g>

  <!-- 떠다니는 음식 -->
  <text x="228" y="60" font-size="26">🍎</text>
  <text x="252" y="100" font-size="26">🥛</text>
  <text x="224" y="140" font-size="26">🍦</text>

  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="22" font-weight="900" fill="#14608a">냉장고 정리하기</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(20,96,138,0.55)" letter-spacing="2">FRIDGE SORT</text>
