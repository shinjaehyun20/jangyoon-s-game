<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>냉장고 정리하기</title>
<style>
  :root {
    --bg: #eaf6ff;
    --accent: #4fc3f7;
    --text: #1b3a4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(180deg, #eaf6ff 0%, #d7ecfb 100%);
    color: var(--text);
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 10px 12px 8px; gap: 8px;
    margin: 0 auto;
  }
  h1 {
    font-size: clamp(20px, 5.5vw, 28px);
    text-align: center;
    color: #14608a;
  }
  .hud {
    display: flex; flex-direction: row; justify-content: space-between;
    background: rgba(255,255,255,0.7);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 700;
  }
  .hud span.value { color: #e07a1f; }
  #gameArea {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  #itemStage {
    flex: 1;
    position: relative;
    background: rgba(255,255,255,0.55);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
    touch-action: none;
  }
  #currentItem {
    font-size: 64px;
    cursor: grab;
    user-select: none;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    touch-action: none;
  }
  #currentItem.dragging { cursor: grabbing; }
  #currentItem.spoiled::after {
    content: '';
  }
  .bins {
    display: flex; flex-direction: row; gap: 8px;
    height: 30%;
  }
  .bin {
    flex: 1;
    border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 13px;
    font-weight: 800;
    gap: 4px;
    border: 3px dashed transparent;
  }
  .bin .emoji { font-size: 30px; }
  .bin[data-bin="fridge"] { background: #d0ecff; color: #0b578a; }
  .bin[data-bin="freezer"] { background: #e3f2ff; color: #17408f; }
  .bin[data-bin="room"] { background: #fff3d6; color: #9a6b00; }
  .bin.highlight { border-color: #4fc3f7; transform: scale(1.04); }
  footer {
    display: flex; flex-direction: row; justify-content: space-between;
    font-size: 12px;
    opacity: 0.8;
  }
  .home-link { color: #14608a; text-decoration: none; font-weight: 700; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,60,80,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  .overlay.hidden { display: none; }
  .overlay-card {
    background: #fff;
    border-radius: 20px;
    padding: 26px 24px;
    text-align: center;
    max-width: 340px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    color: #1b3a4b;
  }
  .overlay-card h2 { font-size: 22px; margin-bottom: 12px; }
  .overlay-card p { font-size: 14px; line-height: 1.6; margin-bottom: 16px; opacity: 0.85; }
  .btn-start {
    min-height: 44px;
    padding: 10px 28px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 0 #1b8fc7;
  }
  .btn-start:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b8fc7; }
  .result-score { font-size: 40px; font-weight: 900; color: #e07a1f; margin: 8px 0; }
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    font-size: 64px;
    z-index: 30;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
  }
</style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="냉장고 정리하기 — 음식을 냉장·냉동·실온에 드래그 분류 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="냉장고 정리하기 | 장윤이 게임 놀이터">
<meta property="og:description" content="냉장고 정리하기 — 음식을 냉장·냉동·실온에 드래그 분류 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
  <div class="wrap">
    <h1>🧊 냉장고 정리하기</h1>

    <div class="hud">
      <div>점수 <span class="value" id="hudScore">0</span></div>
      <div>남은시간 <span class="value" id="hudTime">40</span>초</div>
    </div>

    <div id="gameArea">
      <div id="itemStage">
        <div id="currentItem">🍎</div>
      </div>
      <div class="bins">
        <div class="bin" data-bin="fridge"><span class="emoji">🧊</span>냉장</div>
        <div class="bin" data-bin="freezer"><span class="emoji">❄️</span>냉동</div>
        <div class="bin" data-bin="room"><span class="emoji">🌡️</span>실온</div>
      </div>
    </div>

    <footer>
      <small>음식을 알맞은 칸으로 드래그! 상한 음식은 피해요</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🧊 냉장고 정리하기</h2>
      <p>음식을 손가락으로 끌어서<br>냉장 · 냉동 · 실온 칸에 알맞게 넣어요!<br>🤢 상한 음식이 나오면 아무 칸에나 넣어서 치워주세요.</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>
  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 정리 끝!</h2>
      <div class="result-score" id="finalScore">0</div>
      <p id="resultMsg"></p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  const CONFIG = {
    gameSeconds: 40,
    comboBonusStep: 3,   // 연속 정답 3개마다 보너스
    comboBonusScore: 5,
    baseScore: 10,
    spoiledPenalty: 0,   // 상한 음식은 어디에 넣어도 감점 없음(치우기만 하면 됨)
  };

  const ITEMS = [
    { emoji: '🍎', bin: 'room', spoiled: false },
    { emoji: '🥛', bin: 'fridge', spoiled: false },
    { emoji: '🍦', bin: 'freezer', spoiled: false },
    { emoji: '🥕', bin: 'fridge', spoiled: false },
    { emoji: '🍌', bin: 'room', spoiled: false },
    { emoji: '🧀', bin: 'fridge', spoiled: false },
    { emoji: '🍗', bin: 'freezer', spoiled: false },
    { emoji: '🍞', bin: 'room', spoiled: false },
    { emoji: '🥩', bin: 'freezer', spoiled: false },
    { emoji: '🍇', bin: 'fridge', spoiled: false },
    { emoji: '🥔', bin: 'room', spoiled: false },
    { emoji: '🍫', bin: 'room', spoiled: false },
    { emoji: '🐟', bin: 'freezer', spoiled: false },
    { emoji: '🥚', bin: 'fridge', spoiled: false },
    { emoji: '🍊', bin: 'room', spoiled: false },
  ];
  // 상한 음식(어떤 칸에 넣어도 정답 처리 — 치우는 게 목표)
  const SPOILED_EMOJIS = ['🤢🍎', '🤢🍌', '🤢🥛'];

  const currentItem = document.getElementById('currentItem');
  const itemStage = document.getElementById('itemStage');
  const bins = Array.from(document.querySelectorAll('.bin'));
  const hudScore = document.getElementById('hudScore');
  const hudTime = document.getElementById('hudTime');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScore = document.getElementById('finalScore');
  const resultMsg = document.getElementById('resultMsg');

  const BEST_KEY = 'fridge-sort_best';

  const state = {
    running: false,
    score: 0,
    combo: 0,
    timeLeft: CONFIG.gameSeconds,
    timerId: null,
    current: null,
    dragging: false,
    dragOffsetX: 0,
    dragOffsetY: 0,
    startX: 0,
    startY: 0,
  };

  function loadBest() {
    try {
      const v = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }

  function pickItem() {
    // 15% 확률로 상한 음식 등장
    if (Math.random() < 0.15) {
      const emoji = SPOILED_EMOJIS[Math.floor(Math.random() * SPOILED_EMOJIS.length)];
      return { emoji, bin: null, spoiled: true };
    }
    return ITEMS[Math.floor(Math.random() * ITEMS.length)];
  }

  function nextItem() {
    state.current = pickItem();
    currentItem.textContent = state.current.emoji;
    currentItem.style.left = '';
    currentItem.style.top = '';
    currentItem.style.position = '';
    currentItem.style.transform = '';
  }

  function resetVisualPosition() {
    currentItem.style.position = '';
    currentItem.style.left = '';
    currentItem.style.top = '';
    currentItem.style.transform = '';
  }

  function highlightBin(bin) {
    bins.forEach((b) => b.classList.toggle('highlight', b === bin));
  }

  function binAtPoint(x, y) {
    for (const b of bins) {
      const r = b.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return b;
    }
    return null;
  }

  currentItem.addEventListener('pointerdown', (e) => {
    if (!state.running) return;
    state.dragging = true;
    currentItem.classList.add('dragging');
    currentItem.setPointerCapture(e.pointerId);
    const rect = currentItem.getBoundingClientRect();
    state.dragOffsetX = e.clientX - (rect.left + rect.width / 2);
    state.dragOffsetY = e.clientY - (rect.top + rect.height / 2);
    currentItem.style.position = 'fixed';
    currentItem.style.zIndex = '25';
    currentItem.style.left = e.clientX + 'px';
    currentItem.style.top = e.clientY + 'px';
    currentItem.style.transform = 'translate(-50%, -50%)';
  });

  currentItem.addEventListener('pointermove', (e) => {
    if (!state.running || !state.dragging) return;
    currentItem.style.left = (e.clientX - state.dragOffsetX) + 'px';
    currentItem.style.top = (e.clientY - state.dragOffsetY) + 'px';
    highlightBin(binAtPoint(e.clientX, e.clientY));
  });

  function finishDrag(e) {
    if (!state.running || !state.dragging) return;
    state.dragging = false;
    currentItem.classList.remove('dragging');
    highlightBin(null);
    const targetBin = binAtPoint(e.clientX, e.clientY);
    if (targetBin) {
      judgeDrop(targetBin.dataset.bin);
    } else {
      resetVisualPosition();
    }
  }

  currentItem.addEventListener('pointerup', finishDrag);
  currentItem.addEventListener('pointercancel', () => {
    state.dragging = false;
    currentItem.classList.remove('dragging');
    highlightBin(null);
    resetVisualPosition();
  });

  function judgeDrop(binId) {
    const item = state.current;
    let correct;
    if (item.spoiled) {
      correct = true; // 상한 음식은 어디든 치우면 정답
    } else {
      correct = item.bin === binId;
    }

    if (correct) {
      state.combo += 1;
      let gained = CONFIG.baseScore;
      if (state.combo > 0 && state.combo % CONFIG.comboBonusStep === 0) {
        gained += CONFIG.comboBonusScore;
      }
      state.score += gained;
    } else {
      state.combo = 0;
    }
    hudScore.textContent = state.score;
    resetVisualPosition();
    nextItem();
  }

  function tickTimer() {
    state.timeLeft -= 1;
    hudTime.textContent = state.timeLeft;
    if (state.timeLeft <= 0) {
      endGame();
    }
  }

  function startGame() {
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    state.running = true;
    state.score = 0;
    state.combo = 0;
    state.timeLeft = CONFIG.gameSeconds;
    hudScore.textContent = '0';
    hudTime.textContent = String(state.timeLeft);
    nextItem();
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = setInterval(tickTimer, 1000);
  }

  function endGame() {
    state.running = false;
    if (state.timerId) clearInterval(state.timerId);
    const best = loadBest();
    if (state.score > best) saveBest(state.score);
    finalScore.textContent = state.score;
    resultMsg.textContent = state.score >= 100
      ? '냉장고 정리 완벽! 최고예요!'
      : '수고했어요! 다음엔 더 잘할 수 있어요.';
    endOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('pointerdown', startGame);
  restartBtn.addEventListener('pointerdown', startGame);

  nextItem();
})();
</script>
</body>
</html>
