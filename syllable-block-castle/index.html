<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3eefb"><title>차곡차곡 글자 블록 성 쌓기</title><style>:root{--bg:#f3eefb;--scene:#eee7fc;--ink:#60478a;--accent:#8970bc;--shade:#cec1e5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#18322a;background:var(--bg);overscroll-behavior:none}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:4px solid #f6bd2c;outline-offset:3px}button:disabled{cursor:default}button:active:not(:disabled){transform:translateY(2px)}.app{height:100vh;height:100dvh;max-width:650px;margin:auto;display:flex;flex-direction:column;gap:10px;padding:max(12px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;flex:none}.back{font-size:13px;color:var(--ink);text-decoration:none;font-weight:750}.tools{display:flex;gap:6px}.tool{background:#ffffffb8;color:var(--ink);border:1px solid #0000000b;border-radius:99px;padding:9px 12px;font-size:13px;min-height:38px}.title{text-align:center;flex:none}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink);margin:0 0 4px}.title h1{font-size:clamp(22px,5vw,31px);letter-spacing:-.07em;margin:0;font-weight:850;line-height:1.15}.title p{margin:7px 0 0;font-size:13px;color:#587065}.hud{display:flex;align-items:center;gap:12px;font-weight:750;font-size:13px;flex:none}.progress{height:8px;background:#ffffffa6;flex:1;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);border-radius:10px;transition:width .25s}.stage{min-height:0;flex:1;position:relative;border:1px solid #ffffff;border-radius:24px;overflow:hidden;background:var(--scene);box-shadow:0 8px 24px #203d2210;display:flex;align-items:center;justify-content:center}.scene-art{width:100%;height:100%;position:absolute;inset:0}.question{position:relative;z-index:2;text-align:center;background:#ffffffed;border:1px solid #ffffff;border-radius:22px;padding:17px 24px;max-width:86%;box-shadow:0 6px 20px #2b493116}.question .caption{font-size:13px;font-weight:650;color:#587065;margin-bottom:7px}.question .big{font-size:clamp(33px,8vw,47px);font-weight:850;letter-spacing:-.04em;line-height:1.2}.question .sub{font-size:13px;margin-top:7px;color:#587065}.answers{display:flex;gap:9px;flex:none}.answer{background:white;color:var(--ink);flex:1;min-width:0;min-height:65px;border-radius:18px;box-shadow:0 5px 0 var(--shade);border:2px solid #ffffff;font-size:clamp(18px,4vw,23px);font-weight:800;transition:transform .15s,background .15s}.answer.correct{background:var(--accent);color:white;border-color:var(--accent)}.answer.wrong{background:#fff0ed;border-color:#eb8a76}.answer.used{background:#e3e7e1;color:#849188;box-shadow:none}.feedback{flex:none;min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-size:14px;font-weight:700;line-height:1.4;padding:0 6px}.feedback.error{color:#a44130}.feedback.good{color:#217245}.actions{flex:none;display:flex;gap:8px;min-height:46px}.primary,.secondary{border-radius:14px;min-height:46px;padding:10px 16px;font-weight:800}.primary{background:var(--accent);color:#fff;flex:1;box-shadow:0 4px 0 var(--shade)}.primary:disabled{background:#d6dfd4;color:#83907c;box-shadow:none}.secondary{background:#ffffffba;color:var(--ink);border:1px solid #d9e3d1}.help{text-align:center;font-size:11px;color:#617268;flex:none;margin:0;line-height:1.3}.done{position:fixed;z-index:4;inset:0;max-width:650px;margin:auto;background:var(--scene);padding:24px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px}.done[hidden]{display:none}.done .medal{font-size:66px}.done h2{margin:0;font-size:27px;letter-spacing:-.06em}.done p{margin:0;font-size:15px;line-height:1.6}.done .primary{flex:none;min-width:180px}.bob{animation:bob 2.4s ease-in-out infinite}.jump{animation:jump .42s ease-out}.shake{animation:shake .24s ease-out}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes jump{50%{transform:translateY(-22px)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.pond-animal{position:absolute;bottom:5%;left:calc(50% - 34px);font-size:56px;z-index:2}.coin-summary{font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}.coin-summary span{font-size:13px}.coin-summary b{display:block;font-size:26px}.coin-tray{height:44px;display:flex;justify-content:center;align-items:center;gap:3px;margin-top:10px;overflow:hidden}.coin{width:31px;height:31px;border-radius:50%;background:#ffe5a4;border:2px solid #dba744;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;color:#815716}.coin.fifty{background:#e4e9ec;border-color:#aeb8be;color:#5c666d}.coin.ten{background:#e9b48d;border-color:#bb7d54;color:#75482b}.word-slots{display:flex;justify-content:center;gap:7px;margin-top:12px}.word-slot{width:47px;height:52px;background:#eee9ff;border:2px dashed #b6a6dc;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#624994}.word-slot.filled{border-style:solid;background:#ded4ff}.block-answers{flex-wrap:wrap}.block-answers .answer{flex:1 1 calc(25% - 9px);min-height:60px}.rabbit-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:13px}.stone{font-size:22px;font-weight:800;background:#fff5df;border:2px solid #e7cf9b;min-width:43px;height:45px;display:flex;align-items:center;justify-content:center;border-radius:15px}.stone.ask{background:var(--accent);color:#fff;border-color:var(--accent)}@media(max-height:690px){.app{gap:7px;padding:9px 14px}.title h1{font-size:24px}.title p{font-size:12px;margin-top:4px}.tool{padding:6px 10px;min-height:32px}.answer{min-height:53px}.block-answers .answer{min-height:50px}.feedback{min-height:36px;font-size:13px}.actions{min-height:42px}.primary,.secondary{min-height:42px;padding:8px 13px}.question{padding:12px 18px}.question .big{font-size:35px}.question .caption,.question .sub{font-size:12px}.pond-animal{font-size:43px;bottom:3%;left:calc(50% - 26px)}.coin-tray{height:33px;margin-top:6px}.coin-summary b{font-size:23px}.word-slot{width:40px;height:43px;font-size:25px}.rabbit-line{gap:5px}.stone{min-width:38px;height:38px;font-size:20px}}@media(max-height:560px){.app{gap:5px}.title p,.help{display:none}.title h1{font-size:22px}.hud{font-size:12px}.answer{min-height:45px;font-size:18px}.question .big{font-size:29px}.pond-animal{display:none}.question{padding:9px 14px}.feedback{min-height:31px;font-size:12px}.coin-tray{height:27px}.coin{width:25px;height:25px;font-size:9px}.word-slot{height:35px;width:35px;font-size:22px}.block-answers .answer{min-height:43px}.rabbit-line{margin-top:7px}.stone{height:32px;font-size:18px;min-width:34px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head>
<body><main class="app"><header class="top"><a class="back" href="../index.html" aria-label="게임 목록으로 돌아가기">‹ 게임 목록</a><div class="tools"><button class="tool" id="sound" aria-pressed="true">소리 켜짐</button><button class="tool" id="reset">처음부터</button></div></header><section class="title"><p class="eyebrow">즐겁게 배우는 하루</p><h1>차곡차곡 글자 블록 성 쌓기</h1><p>그림 설명을 읽고 빈 글자를 채워 성을 쌓아요.</p></section><div class="hud"><span id="round">1 / 10</span><div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div><span id="score">0점</span></div><section class="stage" aria-label="문제와 놀이 화면"><svg class="scene-art" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path fill="#eee7fc" d="M0 0h600v400H0z"/><g fill="#fff" opacity=".8"><ellipse cx="90" cy="65" rx="70" ry="18"/><ellipse cx="505" cy="95" rx="75" ry="20"/></g><path fill="#c3b4e7" d="M0 350q160-80 300 0t300 0v50H0z"/><g fill="#aa94d5"><path d="M50 340V225h17v18h17v-18h17v18h17v-18h17v115zM465 340V205h17v18h17v-18h17v18h17v-18h17v135z"/><path d="M110 340v-65h380v65z"/></g><path fill="#8c72bd" d="M280 340v-32a20 20 0 0 1 40 0v32z"/><path fill="#f1ad77" d="M64 225v-55l43 13-43 13m420 9v-55l43 13-43 13"/></svg><div class="question" id="question"><div class="caption" id="clue"></div><div class="big" id="word" aria-hidden="true"></div><div class="word-slots" id="slots"></div><span id="reward" style="position:absolute;right:8px;top:8px;font-size:26px" aria-hidden="true"></span></div><div style="position:absolute;bottom:9px;right:12px;text-align:center;font-size:11px;font-weight:750;color:#60478a"><div id="castleLayers" style="display:flex;flex-direction:column-reverse;align-items:center"></div><span id="castleCount">성벽 0층</span></div><div class="done" id="done" hidden><div class="medal" aria-hidden="true">🏅</div><h2>정말 잘했어요!</h2><p id="doneScore"></p><p>차근차근 생각한 내가 최고!</p><button class="primary" id="again">다시 놀기</button></div></section><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div><div class="actions"><button class="primary" id="next" disabled>다음 문제</button></div><p class="help">글자 버튼을 누르거나 숫자 1 · 2 · 3으로 골라요.</p></main><script>'use strict';let round=0,score=0,locked=false,soundOn=true,audio=null;const $=id=>document.getElementById(id);const feedback=$('feedback');function say(text,kind=''){feedback.textContent=text;feedback.className='feedback '+kind}function tone(ok=true){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;[ok?523:196,ok?784:147].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.11,t+i*.12+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.16);o.connect(g);g.connect(audio.destination);o.start(t+i*.12);o.stop(t+i*.12+.18)})}catch(e){}}function animate(id,cls){const e=$(id);if(!e)return;e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls)}function hud(){ $('round').textContent=(round+1)+' / '+ROUNDS.length; $('score').textContent=score+'점';$('bar').style.width=(round/ROUNDS.length*100)+'%'}function done(){locked=true;$('bar').style.width='100%';$('round').textContent=ROUNDS.length+' / '+ROUNDS.length;$('doneScore').textContent=score+'점 · '+ROUNDS.length+'문제를 모두 풀었어요!';$('done').hidden=false;$('again').focus();say('끝까지 해냈어요! 다시 도전할 수 있어요.','good')}function success(message){locked=true;score+=10;$('score').textContent=score+'점';tone(true);say(message,'good');$('next').disabled=false;$('next').textContent=round===ROUNDS.length-1?'결과 보기':'다음 문제';}function next(){if(!locked)return;round++;if(round>=ROUNDS.length){done();return}render()}function reset(){round=0;score=0;locked=false;$('done').hidden=true;render()}function baseRender(){locked=false;hud();$('next').disabled=true;$('next').textContent='다음 문제';say(INSTRUCTION)}$('next').addEventListener('click',next);$('reset').addEventListener('click',reset);$('again').addEventListener('click',reset);$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'소리 켜짐':'소리 꺼짐';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(true)});function keyOptions(e){if(e.altKey||e.ctrlKey||e.metaKey)return;const i=Number(e.key)-1;if(i>=0&&i<3){const b=document.querySelectorAll('#answers button')[i];if(b&&!b.disabled){e.preventDefault();b.click()}}if(e.key==='Enter'&&locked&&$('done').hidden){e.preventDefault();next()}}
const ROUNDS=[{icon:'🌻',clue:'해를 닮은 노란 꽃',word:'해바라기',blank:2,choices:['마','라','나']},{icon:'✈️',clue:'하늘을 나는 탈것',word:'비행기',blank:1,choices:['행','형','향']},{icon:'🐰',clue:'귀가 길고 깡충 뛰는 동물',word:'토끼',blank:0,choices:['고','도','토']},{icon:'🦒',clue:'목이 아주 긴 동물',word:'기린',blank:1,choices:['림','린','민']},{icon:'🐘',clue:'코가 길고 몸집이 큰 동물',word:'코끼리',blank:1,choices:['끼','기','키']},{icon:'🍌',clue:'길쭉하고 노란 과일',word:'바나나',blank:1,choices:['다','라','나']},{icon:'🚗',clue:'바퀴 네 개로 길을 달려요',word:'자동차',blank:1,choices:['동','통','돈']},{icon:'🌈',clue:'비가 그친 뒤 하늘에 뜨는 고운 띠',word:'무지개',blank:1,choices:['치','지','기']},{icon:'🎈',clue:'바람을 넣으면 둥글게 부풀어요',word:'풍선',blank:1,choices:['산','손','선']},{icon:'🐿️',clue:'도토리를 좋아하는 작은 동물',word:'다람쥐',blank:1,choices:['람','남','담']}];const INSTRUCTION='그림 설명을 읽고 빈칸에 들어갈 글자를 골라요.';function tower(){const n=score/10;$('castleCount').textContent='성벽 '+n+'층';$('castleLayers').innerHTML='';for(let i=0;i<n;i++){const b=document.createElement('span');b.style.cssText='display:block;height:5px;width:48px;border-radius:2px;background:#8d70b8;border:1px solid #eee7fc';$('castleLayers').append(b)}}function render(){baseRender();const q=ROUNDS[round];$('word').textContent=q.icon;$('clue').textContent=q.clue;$('reward').textContent='';$('slots').innerHTML='';[...q.word].forEach((c,i)=>{const s=document.createElement('span');s.className='word-slot'+(i!==q.blank?' filled':'');s.textContent=i===q.blank?'?':c;s.setAttribute('aria-label',(i+1)+'번째 '+(i===q.blank?'빈칸':c));$('slots').append(s)});$('answers').innerHTML='';q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=c;b.setAttribute('aria-label',(i+1)+'번 글자 '+c);b.addEventListener('click',()=>choose(b,c));$('answers').append(b)});tower()}function choose(b,c){if(locked)return;const q=ROUNDS[round],answer=[...q.word][q.blank];if(c!==answer){b.classList.add('wrong');tone(false);say('그림 설명을 다시 읽고 낱말을 소리 내어 말해 봐요.','error');animate('question','shake');return}b.classList.add('correct');document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);const s=$('slots').children[q.blank];s.textContent=c;s.classList.add('filled');s.setAttribute('aria-label',(q.blank+1)+'번째 글자 '+c);success('“'+q.word+'” 완성! 성벽이 한 층 쌓였어요.');tower();$('reward').textContent='👑';animate('reward','jump')}document.addEventListener('keydown',keyOptions);reset();</script></body></html>
