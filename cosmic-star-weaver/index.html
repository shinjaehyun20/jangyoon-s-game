<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ 우주 별자리 잇기 탐험 | 장윤이의 게임 놀이터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      background: #030712;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .ui-overlay {
      position: absolute; top: 16px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 10; pointer-events: none;
    }
    .stat-pill {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 16px; border-radius: 999px;
      font-size: 1.1rem; font-weight: 700; color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      display: flex; align-items: center; gap: 6px; pointer-events: auto;
    }
    .home-link { text-decoration: none; }
    .btn-action {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; cursor: pointer; pointer-events: auto;
      transition: transform 0.1s;
    }
    .btn-action:active { transform: scale(0.92); }
    .modal-backdrop {
      position: absolute; inset: 0;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(12px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
    }
    .modal-box {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 2px solid #a855f7; border-radius: 28px;
      padding: 32px 28px; max-width: 360px; width: 90%;
      text-align: center; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 1.6rem; font-weight: 800; margin-bottom: 12px;
      color: #e9d5ff; text-shadow: 0 2px 10px rgba(168, 85, 247, 0.4);
    }
    .modal-desc {
      font-size: 0.95rem; line-height: 1.5; color: #f3e8ff; margin-bottom: 24px;
    }
    .btn-start {
      background: linear-gradient(135deg, #c084fc, #818cf8);
      border: none; color: #1e1b4b; font-size: 1.2rem; font-weight: 800;
      padding: 14px 32px; border-radius: 999px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(192, 132, 252, 0.4);
      transition: transform 0.15s;
    }
    .btn-start:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <a href="../" class="home-link"><div class="stat-pill">🏠 홈</div></a>
    <div class="stat-pill" id="stagePill">🌌 별자리 1 / 5</div>
    <div class="btn-action" id="soundBtn">🔊</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="modal-backdrop" id="startModal">
    <div class="modal-box">
      <div style="font-size: 3.5rem; margin-bottom: 8px;">✨</div>
      <h1 class="modal-title">우주 별자리 잇기</h1>
      <p class="modal-desc">
        은하수에 흩어진 반짝이는 별들을 순서대로 이어 신비한 동물 별자리를 완성해봐요!<br><br>
        반짝이는 번호 별을 손가락으로 콕콕 터치해 보세요!
      </p>
      <button class="btn-start" id="startBtn">탐험 시작! 🚀</button>
    </div>
  </div>

  <div class="modal-backdrop" id="overModal" style="display: none;">
    <div class="modal-box">
      <div style="font-size: 3.5rem; margin-bottom: 8px;">👑</div>
      <h2 class="modal-title">은하수 마스터!</h2>
      <p class="modal-desc">모든 신비한 별자리를 모두 완성했어요! 축하합니다!</p>
      <button class="btn-start" id="restartBtn">처음부터 다시하기 🔄</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const stagePill = document.getElementById('stagePill');
    const soundBtn = document.getElementById('soundBtn');
    const startModal = document.getElementById('startModal');
    const overModal = document.getElementById('overModal');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let soundOn = true;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playTone(freq, dur=0.25) {
      if (!soundOn || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? '🔊' : '🔇';
    });

    let width = 0, height = 0;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    const constellations = [
      {
        name: "아기 곰 별자리 🐻",
        stars: [
          { x: 0.3, y: 0.35 },
          { x: 0.45, y: 0.28 },
          { x: 0.6, y: 0.35 },
          { x: 0.65, y: 0.55 },
          { x: 0.5, y: 0.65 },
          { x: 0.35, y: 0.6 }
        ]
      },
      {
        name: "푸른 고래 별자리 🐳",
        stars: [
          { x: 0.25, y: 0.5 },
          { x: 0.4, y: 0.35 },
          { x: 0.65, y: 0.38 },
          { x: 0.78, y: 0.48 },
          { x: 0.7, y: 0.65 },
          { x: 0.45, y: 0.68 },
          { x: 0.2, y: 0.6 }
        ]
      },
      {
        name: "신비한 유니콘 별자리 🦄",
        stars: [
          { x: 0.5, y: 0.22 },
          { x: 0.42, y: 0.38 },
          { x: 0.3, y: 0.55 },
          { x: 0.45, y: 0.68 },
          { x: 0.65, y: 0.6 },
          { x: 0.6, y: 0.4 }
        ]
      },
      {
        name: "반짝이 나비 별자리 🦋",
        stars: [
          { x: 0.5, y: 0.5 },
          { x: 0.3, y: 0.3 },
          { x: 0.25, y: 0.65 },
          { x: 0.5, y: 0.5 },
          { x: 0.7, y: 0.3 },
          { x: 0.75, y: 0.65 }
        ]
      },
      {
        name: "아기 고양이 별자리 🐱",
        stars: [
          { x: 0.35, y: 0.3 },
          { x: 0.45, y: 0.38 },
          { x: 0.55, y: 0.38 },
          { x: 0.65, y: 0.3 },
          { x: 0.68, y: 0.55 },
          { x: 0.5, y: 0.7 },
          { x: 0.32, y: 0.55 }
        ]
      }
    ];

    let currentStage = 0;
    let nextStarIndex = 0;
    let lines = [];
    let particles = [];
    let backgroundStars = [];

    for (let i = 0; i < 80; i++) {
      backgroundStars.push({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.8 + 0.5,
        twinkle: Math.random() * Math.PI * 2
      });
    }

    function createBurst(x, y, color) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const sp = Math.random() * 5 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * sp,
          vy: Math.sin(angle) * sp,
          life: 1,
          color
        });
      }
    }

    function handlePointer(clientX, clientY) {
      const c = constellations[currentStage];
      const target = c.stars[nextStarIndex];
      const tx = target.x * width;
      const ty = target.y * height;
      const dist = Math.hypot(clientX - tx, clientY - ty);

      if (dist < 36) {
        // Connected!
        playTone(392 + nextStarIndex * 60, 0.25);
        createBurst(tx, ty, '#fcd34d');

        if (nextStarIndex > 0) {
          const prev = c.stars[nextStarIndex - 1];
          lines.push({ x1: prev.x * width, y1: prev.y * height, x2: tx, y2: ty });
        }

        nextStarIndex++;

        if (nextStarIndex >= c.stars.length) {
          // Completed constellation!
          playTone(880, 0.4);
          setTimeout(() => playTone(1174, 0.5), 200);
          createBurst(width / 2, height / 2, '#c084fc');

          setTimeout(() => {
            currentStage++;
            if (currentStage >= constellations.length) {
              overModal.style.display = 'flex';
            } else {
              nextStarIndex = 0;
              lines = [];
              stagePill.textContent = `🌌 별자리 ${currentStage + 1} / ${constellations.length}`;
            }
          }, 1200);
        }
      }
    }

    window.addEventListener('pointerdown', (e) => {
      initAudio();
      handlePointer(e.clientX, e.clientY);
    });

    startBtn.addEventListener('click', () => {
      initAudio();
      playTone(523, 0.3);
      startModal.style.display = 'none';
      currentStage = 0;
      nextStarIndex = 0;
      lines = [];
      stagePill.textContent = `🌌 별자리 1 / ${constellations.length}`;
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      playTone(523, 0.3);
      overModal.style.display = 'none';
      currentStage = 0;
      nextStarIndex = 0;
      lines = [];
      stagePill.textContent = `🌌 별자리 1 / ${constellations.length}`;
    });

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Background stars
      backgroundStars.forEach(s => {
        s.twinkle += 0.03;
        const alpha = 0.4 + Math.sin(s.twinkle) * 0.4;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Connected lines
      ctx.strokeStyle = 'rgba(192, 132, 252, 0.8)';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 12;
      lines.forEach(l => {
        ctx.beginPath();
        ctx.moveTo(l.x1, l.y1);
        ctx.lineTo(l.x2, l.y2);
        ctx.stroke();
      });
      ctx.shadowBlur = 0;

      // Constellation stars
      if (currentStage < constellations.length) {
        const c = constellations[currentStage];

        // Draw title
        ctx.fillStyle = '#e9d5ff';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(c.name, width / 2, height * 0.15);

        c.stars.forEach((st, idx) => {
          const sx = st.x * width;
          const sy = st.y * height;
          const isDone = idx < nextStarIndex;
          const isCurrent = idx === nextStarIndex;

          ctx.save();
          ctx.translate(sx, sy);

          if (isCurrent) {
            ctx.strokeStyle = 'rgba(252, 211, 77, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 24 + Math.sin(Date.now() * 0.008) * 4, 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.fillStyle = isDone ? '#c084fc' : (isCurrent ? '#fcd34d' : 'rgba(255, 255, 255, 0.4)');
          ctx.beginPath();
          ctx.arc(0, 0, isCurrent ? 14 : 10, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = isDone ? '#fff' : '#030712';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(idx + 1, 0, 0);

          ctx.restore();
        });
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
