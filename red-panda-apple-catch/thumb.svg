<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd8" />
      <stop offset="50%" stop-color="#ffd8be" />
      <stop offset="100%" stop-color="#ffb5a7" />
    </linearGradient>
    <linearGradient id="redPandaFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e05738" />
      <stop offset="100%" stop-color="#b03a1e" />
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e05738" />
      <stop offset="25%" stop-color="#f8edeb" />
      <stop offset="50%" stop-color="#b03a1e" />
      <stop offset="75%" stop-color="#f8edeb" />
      <stop offset="100%" stop-color="#7f230e" />
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#c9184a" />
    </linearGradient>
    <linearGradient id="goldAppleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="512" height="512" rx="48" fill="url(#skyGrad)" />

  <!-- Autumn Hill & Grass -->
  <path d="M0 380 Q140 330 280 360 T512 350 L512 512 L0 512 Z" fill="#84a98c" />
  <path d="M0 420 Q180 390 340 420 T512 410 L512 512 L0 512 Z" fill="#52796f" />

  <!-- Autumn Tree Branches & Golden Foliage -->
  <circle cx="90" cy="110" r="85" fill="#f4a261" opacity="0.8" />
  <circle cx="160" cy="80" r="95" fill="#e76f51" opacity="0.85" />
  <circle cx="240" cy="90" r="80" fill="#e9c46a" opacity="0.8" />
  <circle cx="430" cy="110" r="90" fill="#e76f51" opacity="0.75" />

  <!-- Tree Trunk on Left -->
  <path d="M0 60 Q80 120 70 280 L0 340 Z" fill="#6f4e37" opacity="0.6" />

  <!-- Falling Autumn Leaves & Apples -->
  <!-- Falling Apples -->
  <g transform="translate(140, 160)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="20" ry="19" fill="url(#appleGrad)" />
    <path d="M0 -19 Q4 -28 10 -26" stroke="#583101" stroke-width="3" fill="none" stroke-linecap="round" />
    <ellipse cx="6" cy="-25" rx="7" ry="4" fill="#52b788" transform="rotate(-20 6 -25)" />
    <!-- Apple highlight -->
    <ellipse cx="-6" cy="-6" rx="5" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-30 -6 -6)" />
  </g>

  <g transform="translate(370, 190)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="24" ry="22" fill="url(#goldAppleGrad)" />
    <path d="M0 -22 Q5 -32 12 -30" stroke="#583101" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <ellipse cx="8" cy="-29" rx="8" ry="5" fill="#52b788" transform="rotate(-25 8 -29)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.5" />
    <!-- Sparkles around golden apple -->
    <path d="M-28 -5 Q-20 -5 -20 -13 Q-20 -5 -12 -5 Q-20 -5 -20 3 Q-20 -5 -28 -5 Z" fill="#fff" />
  </g>

  <!-- Baby Red Panda Character -->
  <g transform="translate(230, 290)" filter="url(#dropShadow)">
    <!-- Bushy Striped Tail -->
    <path d="M70 70 C120 70 140 20 160 5 C175 -5 185 20 170 45 C150 75 110 115 55 105 Z" fill="url(#tailGrad)" />

    <!-- Body -->
    <ellipse cx="10" cy="70" rx="52" ry="58" fill="url(#redPandaFur)" />
    <ellipse cx="10" cy="75" rx="36" ry="42" fill="#2b2d42" />

    <!-- Head -->
    <circle cx="10" cy="-5" r="55" fill="url(#redPandaFur)" />

    <!-- Fluffy Pointy Ears with White Inside -->
    <polygon points="-35,-45 -55,-10 -15,-20" fill="url(#redPandaFur)" />
    <polygon points="-33,-40 -48,-15 -20,-22" fill="#ffffff" />
    <polygon points="55,-45 75,-10 35,-20" fill="url(#redPandaFur)" />
    <polygon points="53,-40 68,-15 40,-22" fill="#ffffff" />

    <!-- White Eyebrow Patches & Cheek Fur -->
    <ellipse cx="-24" cy="-22" rx="10" ry="7" fill="#ffffff" />
    <ellipse cx="44" cy="-22" rx="10" ry="7" fill="#ffffff" />
    <!-- White Muzzle -->
    <ellipse cx="10" cy="15" rx="28" ry="20" fill="#ffffff" />
    <!-- Cute Dark Nose -->
    <ellipse cx="10" cy="8" rx="8" ry="6" fill="#1d1e2c" />
    <!-- Mouth -->
    <path d="M4 14 Q10 20 16 14" stroke="#1d1e2c" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Sparkling Eyes -->
    <circle cx="-14" cy="-5" r="8" fill="#1d1e2c" />
    <circle cx="-16" cy="-8" r="3" fill="#ffffff" />
    <circle cx="34" cy="-5" r="8" fill="#1d1e2c" />
    <circle cx="32" cy="-8" r="3" fill="#ffffff" />

    <!-- Rosy Cheeks -->
    <circle cx="-32" cy="10" r="9" fill="#ff758f" opacity="0.6" />
    <circle cx="52" cy="10" r="9" fill="#ff758f" opacity="0.6" />

    <!-- Woven Apple Basket in Paws -->
    <g transform="translate(10, 80)">
      <path d="M-45 0 L45 0 L35 48 L-35 48 Z" fill="#bc6c25" />
      <path d="M-45 0 L45 0" stroke="#dda15e" stroke-width="4" />
      <path d="M-30 0 L-24 48 M-10 0 L-8 48 M10 0 L8 48 M30 0 L24 48" stroke="#8a4f1a" stroke-width="2" />
      <path d="M-42 16 L42 16 M-39 32 L39 32" stroke="#8a4f1a" stroke-width="2" />
      <!-- Apples inside basket -->
      <circle cx="-20" cy="0" r="14" fill="url(#appleGrad)" />
      <circle cx="5" cy="-2" r="15" fill="url(#goldAppleGrad)" />
      <circle cx="22" cy="2" r="13" fill="url(#appleGrad)" />
    </g>

    <!-- Front Paws holding basket -->
    <ellipse cx="-38" cy="80" rx="12" ry="9" fill="#2b2d42" />
    <ellipse cx="58" cy="80" rx="12" ry="9" fill="#2b2d42" />
  </g>

  <!-- Title Pill Banner -->
  <rect x="116" y="440" width="280" height="46" rx="23" fill="#ffffff" fill-opacity="0.95" filter="url(#dropShadow)" />
  <text x="256" y="471" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="20" fill="#2b2d42">데굴데굴 사과 받기 🍎</text>
</svg>
