<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#022c43"/>
      <stop offset="60%" stop-color="#051923"/>
      <stop offset="100%" stop-color="#000814"/>
    </radialGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad)"/>

  <!-- Aurora -->
  <path d="M 0,80 Q 100,30 200,70 T 400,50 L 400,0 L 0,0 Z" fill="url(#auroraGrad)" filter="url(#glow)"/>

  <!-- Snow ground -->
  <rect x="0" y="210" width="400" height="90" fill="#e0f2fe"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#38bdf8" stroke-width="3"/>

  <!-- Snowflake -->
  <g transform="translate(290, 140) scale(1.4)" stroke="#38bdf8" stroke-width="2">
    <line x1="-12" y1="0" x2="12" y2="0"/>
    <line x1="0" y1="-12" x2="0" y2="12"/>
    <line x1="-8" y1="-8" x2="8" y2="8"/>
    <line x1="-8" y1="8" x2="8" y2="-8"/>
  </g>

  <!-- Polar Bear on Sled -->
  <g transform="translate(140, 180) scale(1.5)">
    <!-- Sled -->
    <rect x="-20" y="10" width="40" height="6" rx="3" fill="#b45309"/>
    <line x1="-24" y1="16" x2="22" y2="16" stroke="#94a3b8" stroke-width="3"/>
    <!-- Bear -->
    <ellipse cx="0" cy="-2" rx="16" ry="12" fill="#fff"/>
    <circle cx="8" cy="-12" r="9" fill="#fff"/>
    <circle cx="4" cy="-19" r="3" fill="#fff"/>
    <circle cx="12" cy="-19" r="3" fill="#fff"/>
    <circle cx="14" cy="-12" r="2" fill="#0f172a"/>
    <circle cx="10" cy="-14" r="1.5" fill="#0f172a"/>
    <rect x="2" y="-6" width="12" height="5" rx="2.5" fill="#ef4444"/>
  </g>

  <!-- Title Badge -->
  <rect x="55" y="240" width="290" height="42" rx="21" fill="rgba(2, 44, 67, 0.9)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="267" fill="#38bdf8" font-family="'Pretendard', sans-serif" font-size="15" font-weight="900" text-anchor="middle">❄️ 오로라 북극곰의 얼음 썰매</text>
</svg>
