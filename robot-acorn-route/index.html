<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도토리 배달 로봇</title><style>
:root{--ink:#263e55;--blue:#315c85;--paper:#fffaf0;--tile:#d9e9dc;--accent:#ecb665}*{box-sizing:border-box}body{margin:0;background:#e5edf2;color:var(--ink);font-family:'Malgun Gothic',sans-serif}main{max-width:580px;margin:auto;padding:18px 18px 32px}header{display:flex;justify-content:space-between;font-size:14px}a{color:inherit}h1{font-size:clamp(25px,7vw,36px);margin:22px 0 8px}p{line-height:1.6}.park{background:var(--paper);padding:16px;border-radius:24px;border:2px solid #b7cbd1;box-shadow:0 7px 0 #ccd9df}#board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{aspect-ratio:1;background:var(--tile);border-radius:10px;display:grid;place-items:center;font-size:clamp(22px,7vw,36px);border:2px solid transparent}.rock{background:#cbd2d3}.home{background:#f5d99f}.robot{background:#adcde9;border-color:var(--blue);transform:scale(.96)}button{font:inherit;cursor:pointer;touch-action:manipulation;min-width:46px;min-height:46px;border:0;border-radius:10px;background:var(--blue);color:white;padding:12px;font-weight:bold}button:focus-visible,a:focus-visible{outline:3px solid #cf682c;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.pad{display:flex;justify-content:center;gap:10px;margin:12px 0}.pad button{font-size:26px;background:#deebf3;color:var(--ink);border:1px solid #b5cddf;min-width:56px}#queue{display:flex;flex-wrap:wrap;gap:4px;min-height:52px;background:#eef2f3;border:1px dashed #a2b8c4;border-radius:10px;padding:8px}.command{background:white;padding:3px 8px;border-radius:6px;font-size:20px}.current{background:var(--accent)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quiet{background:#e6dfcf;color:var(--ink)}#message{min-height:54px;font-weight:bold;margin-bottom:0}#next{display:none;background:#387154}.small{font-size:13px;color:#536674}.caption{display:flex;justify-content:space-between;font-size:13px;margin:12px 0 6px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:360px){main{padding:12px 10px}.park{padding:12px}.pad{gap:6px}.pad button{min-width:50px}}
</style></head><body><main><header><a href="../index.html">← 게임 목록</a><span id="progress"></span></header><h1>🤖 도토리 배달 로봇</h1><p>화살표를 차례로 넣고 출발!<br>바위를 피해 다람쥐 집까지 도토리를 배달해요.</p><section class="park" aria-label="로봇 길찾기"><div id="board" role="img" aria-label="5행 5열 숲 지도"></div><div class="caption"><span>배달할 길을 순서대로 넣어 주세요</span><span id="count">0 / 20</span></div><div id="queue" aria-label="이동 명령 목록"></div><div class="pad" aria-label="방향 명령"><button data-dir="U" aria-label="위로">↑</button><button data-dir="L" aria-label="왼쪽으로">←</button><button data-dir="D" aria-label="아래로">↓</button><button data-dir="R" aria-label="오른쪽으로">→</button></div><div class="controls"><button id="go">출발!</button><button id="undo" class="quiet">한 칸 지우기</button><button id="clear" class="quiet">길 비우기</button><button id="next">다음 배달 →</button></div><p id="message" role="status" aria-live="polite"></p></section><p class="small">🤖 출발 · 🪨 지나갈 수 없는 바위 · 🐿️ 도착<br>키보드 방향키로도 길을 넣을 수 있어요. 시간 제한은 없어요.</p><button id="restart" class="quiet">처음부터</button></main>
<script>
'use strict';
const levels=[{start:[4,0],goal:[0,4],rocks:[[3,1],[2,1],[1,3]],name:'숲 입구'},{start:[4,0],goal:[0,4],rocks:[[4,2],[3,2],[2,2],[1,1]],name:'작은 돌담'},{start:[4,2],goal:[0,2],rocks:[[3,2],[2,1],[2,2],[2,3],[0,4]],name:'돌아가는 길'},{start:[4,4],goal:[0,0],rocks:[[3,4],[3,3],[2,1],[1,1],[1,2]],name:'굴곡진 산책로'},{start:[4,0],goal:[0,4],rocks:[[3,0],[3,1],[1,2],[2,3],[3,3]],name:'비밀 오솔길'},{start:[4,4],goal:[0,0],rocks:[[4,2],[3,2],[1,1],[1,2],[1,3],[2,0]],name:'큰 숲 배달'}];
const arrow={U:'↑',D:'↓',L:'←',R:'→'},delta={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]},$=id=>document.getElementById(id);let level=0,commands=[],position=[],running=false,won=false,timer=null;
function same(a,b){return a[0]===b[0]&&a[1]===b[1]}function isRock(p){return levels[level].rocks.some(r=>same(r,p))}
function draw(){const board=$('board');board.replaceChildren();for(let r=0;r<5;r++)for(let c=0;c<5;c++){const p=[r,c],cell=document.createElement('span');cell.className='tile';let label='빈길';if(isRock(p)){cell.textContent='🪨';cell.classList.add('rock');label='바위'}if(same(p,levels[level].goal)){cell.textContent='🐿️';cell.classList.add('home');label='다람쥐 집'}if(same(p,position)){cell.textContent=won?'🌰':'🤖';cell.classList.add('robot');label=won?'배달 완료':'로봇'}cell.setAttribute('aria-label',`${r+1}행 ${c+1}열 ${label}`);board.append(cell)}$('progress').textContent=`배달 ${level+1} / ${levels.length} · ${levels[level].name}`;board.setAttribute('aria-label',`${levels[level].name}. 로봇 ${position[0]+1}행 ${position[1]+1}열, 집 ${levels[level].goal[0]+1}행 ${levels[level].goal[1]+1}열. 바위 ${levels[level].rocks.map(r=>`${r[0]+1}행 ${r[1]+1}열`).join(', ')}`)}
function queue(active=-1){$('queue').replaceChildren();commands.forEach((d,i)=>{const s=document.createElement('span');s.className='command'+(i===active?' current':'');s.textContent=arrow[d];s.setAttribute('aria-label',`${i+1}번째 ${d}`);$('queue').append(s)});$('count').textContent=`${commands.length} / 20`}
function controls(){document.querySelectorAll('[data-dir],#undo,#clear,#go').forEach(b=>b.disabled=running||won)}
function reset(){clearTimeout(timer);timer=null;running=false;won=false;commands=[];position=[...levels[level].start];$('next').style.display='none';$('message').textContent='로봇은 화살표 한 개마다 한 칸씩 움직여요.';queue();draw();controls()}
function add(d){if(running||won)return;if(commands.length===20){$('message').textContent='한 번에 20칸까지 넣을 수 있어요. 한 칸 지우기로 고쳐 보세요.';return}commands.push(d);queue()}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>add(b.dataset.dir));document.addEventListener('keydown',e=>{const d={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(d){e.preventDefault();add(d)}});
function stop(message){running=false;$('message').textContent=message;controls()}
function step(i){if(i===commands.length){stop('아직 집에 도착하지 않았어요. 길을 고친 뒤 다시 출발해 보세요.');return}queue(i);const d=delta[commands[i]],p=[position[0]+d[0],position[1]+d[1]];if(p.some(v=>v<0||v>4)){stop('숲 밖으로 나갈 수 없어요. 화살표를 고쳐 주세요.');return}if(isRock(p)){stop('바위에 막혔어요! 돌아가는 길을 찾아보세요.');return}position=p;draw();if(same(position,levels[level].goal)){won=true;stop(level===5?'여섯 배달 모두 성공! 숲속 친구들이 고마워해요.':'도토리 배달 성공! 길을 아주 잘 만들었어요.');draw();$('next').style.display='inline-block';$('next').textContent=level===5?'한 번 더 배달하기':'다음 배달 →';return}timer=setTimeout(()=>step(i+1),380)}
$('go').onclick=()=>{if(!commands.length){$('message').textContent='먼저 화살표로 길을 넣어 주세요.';return}position=[...levels[level].start];running=true;$('message').textContent='로봇이 배달 중이에요…';controls();draw();step(0)};$('undo').onclick=()=>{commands.pop();position=[...levels[level].start];queue();draw()};$('clear').onclick=reset;$('next').onclick=()=>{level=(level+1)%levels.length;reset()};$('restart').onclick=()=>{level=0;reset()};reset();
</script></body></html>
