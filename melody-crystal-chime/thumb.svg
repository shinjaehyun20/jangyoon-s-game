<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="melody-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="319" height="179" rx="12" fill="url(#melody-bg)" stroke="rgba(192,132,252,0.3)"/>
  <g transform="translate(25, 20)">
    <circle cx="45" cy="45" r="20" fill="#f43f5e" filter="url(#glow)"/>
    <text x="45" y="52" font-size="20" text-anchor="middle" fill="#fff">🔔</text>

    <circle cx="95" cy="35" r="22" fill="#fbbf24" filter="url(#glow)"/>
    <text x="95" y="43" font-size="22" text-anchor="middle" fill="#fff">💎</text>

    <circle cx="150" cy="45" r="20" fill="#10b981" filter="url(#glow)"/>
    <text x="150" y="52" font-size="20" text-anchor="middle" fill="#fff">✨</text>

    <circle cx="200" cy="35" r="22" fill="#38bdf8" filter="url(#glow)"/>
    <text x="200" y="43" font-size="22" text-anchor="middle" fill="#fff">🎵</text>

    <text x="70" y="110" font-size="28" fill="#f472b6" filter="url(#glow)">🎶</text>
    <text x="130" y="120" font-size="32" fill="#fde047" filter="url(#glow)">🎼</text>
    <text x="180" y="105" font-size="28" fill="#a78bfa" filter="url(#glow)">🎹</text>
  </g>
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="146" text-anchor="end" font-size="21" font-weight="900" fill="#c084fc">멜로디 크리스탈 차임</text>
    <text x="296" y="165" text-anchor="end" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">MELODY CRYSTAL CHIME</text>
  </g>
</svg>