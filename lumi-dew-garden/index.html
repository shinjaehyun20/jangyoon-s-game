<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>루미 큐브정원</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#26314e;--navy:#27315e;--violet:#936cff;--mint:#54dfc5;--coral:#ff789a;--gold:#ffd561;--sky:#62c8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100vh;height:100dvh;margin:0;overflow:hidden;touch-action:manipulation;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff;background:#22295a}body{background:radial-gradient(circle at 50% -10%,#8774e4 0,transparent 31%),linear-gradient(160deg,#30367b 0%,#273a72 50%,#1f2a54 100%)}
.wrap{position:relative;isolation:isolate;width:100%;max-width:510px;height:100vh;height:100dvh;margin:auto;padding:clamp(10px,3vw,18px);display:flex;flex-direction:column;gap:9px;overflow:hidden}.wrap:before,.wrap:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(1px)}.wrap:before{width:300px;height:300px;left:-165px;bottom:-150px;background:radial-gradient(circle,rgba(88,230,202,.29),transparent 68%)}.wrap:after{width:290px;height:250px;right:-175px;top:20%;background:radial-gradient(circle,rgba(255,128,164,.23),transparent 68%)}
header{display:flex;align-items:center;justify-content:space-between;gap:7px}h1{font-size:clamp(22px,6.2vw,31px);line-height:1.04;letter-spacing:-1.5px;margin:0;text-shadow:0 3px 12px rgba(0,0,0,.24)}.sub{font-size:12px;font-weight:800;color:#dbe8ff;margin-top:4px}.best{font-size:12px;font-weight:800;white-space:nowrap;padding:8px 10px;border:1px solid rgba(255,255,255,.22);border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chip{padding:7px 5px;text-align:center;border:1px solid rgba(255,255,255,.19);border-radius:15px;background:rgba(255,255,255,.12);backdrop-filter:blur(9px);font-size:11px;color:#e2ecff}.chip b{display:block;font-size:18px;line-height:1.1;color:#fff;margin-top:2px}.mission{display:flex;gap:9px;align-items:center;min-height:44px;padding:7px 11px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(100deg,rgba(255,255,255,.17),rgba(255,255,255,.06));font-size:13px;font-weight:700;box-shadow:0 9px 22px rgba(5,10,40,.14)}.sprite{font-size:25px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));animation:bob 2.1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(4deg)}}
#garden{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,112px);align-content:center;gap:clamp(24px,4vh,34px) clamp(25px,8vw,49px);padding:4px clamp(26px,9vw,48px) 8px}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:white;box-shadow:0 0 9px 3px rgba(255,255,255,.65);opacity:.72;animation:twinkle var(--d) ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.18;transform:scale(.5)}}
.vessel{position:relative;height:112px;min-height:0;border:0;padding:0;background:transparent;cursor:pointer;touch-action:none;filter:drop-shadow(0 13px 12px rgba(0,0,0,.26));transition:transform .18s ease}.vessel:active{transform:scale(.97)}.vessel.selected{transform:translateY(-7px) scale(1.035);filter:drop-shadow(0 0 14px rgba(255,231,133,.86)) drop-shadow(0 13px 12px rgba(0,0,0,.26))}.vessel.selected .glass{border-color:#fff1a8;box-shadow:inset 0 0 19px rgba(255,255,255,.27),0 0 0 3px rgba(255,228,124,.27),0 0 28px rgba(255,224,117,.48)}
.glass{position:absolute;inset:0 7%;overflow:hidden;border:2px solid rgba(241,250,255,.71);border-top:0;border-radius:21px 21px 31px 31px;background:linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,.02) 28%,rgba(255,255,255,.1) 65%,rgba(255,255,255,.25));box-shadow:inset 0 0 19px rgba(255,255,255,.15),0 11px 17px rgba(5,10,34,.3)}.glass:before{content:"";position:absolute;top:-4px;left:11%;z-index:2;width:78%;height:18px;border:2px solid rgba(247,252,255,.86);border-radius:50%;background:rgba(198,232,255,.25);box-shadow:0 3px 8px rgba(0,0,0,.2)}.glass:after{content:"";position:absolute;z-index:3;top:20px;left:19%;width:10%;height:54%;border-radius:50%;background:linear-gradient(#fff9,transparent);opacity:.62;pointer-events:none}
.cubes{position:absolute;inset:22px 11px 9px;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:3px}.marble-row{flex:1;min-height:15px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;align-items:center}.marble{position:relative;aspect-ratio:1;border-radius:50%;background:var(--bg);border:1px solid rgba(255,255,255,.48);box-shadow:inset 3px 3px 5px rgba(255,255,255,.76),inset -3px -4px 6px rgba(35,29,70,.2),0 0 9px var(--glow);overflow:hidden}.marble:before{content:"";position:absolute;inset:13% 50% 52% 11%;border-radius:50%;background:rgba(255,255,255,.88);filter:blur(.1px)}.marble:after{content:"";position:absolute;width:62%;height:35%;bottom:-7%;left:24%;border-radius:50%;background:rgba(255,255,255,.24);filter:blur(2px)}.pour-marble{position:fixed;z-index:20;width:18px;height:18px;border-radius:50%;pointer-events:none;background:var(--bg);border:1px solid rgba(255,255,255,.6);box-shadow:inset 3px 3px 5px rgba(255,255,255,.76),inset -4px -5px 7px rgba(35,29,70,.2),0 0 13px var(--glow);transition:transform .46s cubic-bezier(.18,.85,.35,1),opacity .46s ease}.pour-marble:before{content:"";position:absolute;inset:14% 50% 52% 11%;border-radius:50%;background:rgba(255,255,255,.85)}.violet{--bg:linear-gradient(135deg,#7049d9,#c4b7ff 48%,#7750da);--glow:#9a7dff}.mint{--bg:linear-gradient(135deg,#1fc7a8,#aeffec 48%,#24bca0);--glow:#55e7c8}.coral{--bg:linear-gradient(135deg,#ec4f78,#ffc3d0 48%,#ed5b81);--glow:#ff829d}.gold{--bg:linear-gradient(135deg,#efa928,#fff0ae 48%,#efb329);--glow:#ffd861}.vlabel{position:absolute;left:0;right:0;bottom:-23px;text-align:center;font-size:11px;font-weight:900;color:#e2eaff;text-shadow:0 2px 5px #17214a}.hint{font-size:12px;text-align:center;font-weight:700;color:#e4edff}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;color:#b9caee}.home-link{color:#fff0b5;font-weight:900;text-decoration:none;white-space:nowrap;font-size:12px}
.overlay{position:fixed;z-index:9;inset:0;padding:23px;display:grid;place-items:center;background:rgba(11,14,43,.71);backdrop-filter:blur(11px)}.overlay.hidden{display:none}.card{width:min(395px,100%);padding:27px 23px 22px;text-align:center;border:1px solid rgba(255,255,255,.27);border-radius:31px;background:linear-gradient(145deg,rgba(83,93,180,.97),rgba(36,44,103,.98));box-shadow:0 23px 75px rgba(0,0,0,.48)}.hero{display:block;font-size:57px;margin-bottom:3px}.card h2{margin:0 0 9px;font-size:28px}.card p{margin:0 auto 17px;color:#e7edff;font-size:14px;line-height:1.65}.original{padding:9px;margin-bottom:16px;border-radius:14px;background:rgba(84,223,197,.13);color:#b8faed;font-size:12px;line-height:1.55}.start{min-width:184px;padding:15px 23px;border:0;border-radius:17px;background:linear-gradient(100deg,#ffe87a,#ffb9d0);box-shadow:0 8px 0 #c86f91,0 13px 22px rgba(0,0,0,.25);color:#29315e;font-size:18px;font-weight:900;cursor:pointer}.start:active{transform:translateY(5px);box-shadow:0 3px 0 #c86f91}.confetti{position:absolute;font-size:23px;animation:float 2.2s linear infinite}@keyframes float{from{transform:translateY(24px) rotate(0);opacity:0}20%{opacity:1}to{transform:translateY(-210px) rotate(240deg);opacity:0}}
@media(max-height:650px){.wrap{gap:6px}.vessel{min-height:105px}.mission{min-height:39px}.glass:before{height:14px}.cubes{inset:18px 8px 8px}.vlabel{bottom:-19px}.footer{font-size:9px}}
</style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🌱 루미 이슬정원 — 이슬을 굴려 정원의 꽃과 풀을 싹틔우세요! 꽃잎과 잎새를 조화롭게 피워내는 힐링 물리 퍼즐. 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🌱 루미 이슬정원 | 장윤이 게임 놀이터">
<meta property="og:description" content="🌱 루미 이슬정원 — 이슬을 굴려 정원의 꽃과 풀을 싹틔우세요! 꽃잎과 잎새를 조화롭게 피워내는 힐링 물리 퍼즐. 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
<main class="wrap">
<header><div><h1>🧊 루미 큐브정원</h1><div class="sub">알록달록 유리 큐브를 모아 별꽃을 피워요</div></div><div class="best">최고 꽃 <b id="best">0</b>송이</div></header>
<section class="hud"><div class="chip">정원 단계<b id="level">1 / 3</b></div><div class="chip">이동 횟수<b id="moves">0</b></div><div class="chip">별꽃<b id="flowers">0</b></div></section>
<div class="mission"><span class="sprite">🧚</span><span id="message">같은 색 큐브를 한 유리통에 모아 주세요!</span></div>
<section id="garden" aria-label="유리 큐브 정원"></section>
<div class="hint">반짝이는 큐브를 먼저 고르고, 옮길 유리통을 골라요</div>
<footer class="footer"><span>드래그 대신 두 번 톡! 쉬운 큐브 옮기기</span><a class="home-link" href="../index.html">← 홈</a></footer>
</main>
<div class="overlay" id="startOverlay"><div class="card"><span class="hero">🫙🧊✨</span><h2>루미 큐브정원</h2><p>반짝이는 네모 유리 큐브를 옮겨<br>같은 색 큐브로 별꽃을 피워 보세요.</p><div class="original">말랑한 젤리처럼 빛나고, 유리처럼 투명한<br>네모 큐브를 모으는 오리지널 퍼즐이에요.</div><button class="start" id="startBtn">정원 열기!</button></div></div>
<div class="overlay hidden" id="endOverlay"><div class="card"><span class="hero" id="endEmoji">🌸</span><h2 id="endTitle">별꽃 정원 완성!</h2><p id="endText"></p><button class="start" id="restartBtn">다시 심기</button></div></div>
<script>
(()=>{'use strict';
const KEY='lumi-dew-garden_best',names={violet:'보랏빛',mint:'민트빛',coral:'산호빛',gold:'햇살빛'};
const LEVELS=[[['violet','mint','coral','gold'],['gold','coral','mint','violet'],['mint','violet','gold','coral'],[]],[['violet','mint','coral','gold'],['mint','gold','violet','coral'],['coral','violet','gold','mint'],[]],[['violet','mint','coral','gold'],['gold','mint','violet','coral'],['coral','gold','mint','violet'],[]]];
let level=0,board=[],selected=null,moves=0,flowers=0,running=false;const $=id=>document.getElementById(id),garden=$('garden');$('best').textContent=localStorage.getItem(KEY)||0;
for(let i=0;i<17;i++){const s=document.createElement('i');s.className='spark';s.style.left=(4+Math.random()*92)+'%';s.style.top=(4+Math.random()*84)+'%';s.style.setProperty('--d',(1.3+Math.random()*2.2)+'s');garden.appendChild(s)}
function init(){board=LEVELS[level].map(v=>[...v]);selected=null;moves=0;render();say('같은 색 유리구슬을 한 유리통에 모아 주세요!')}function say(t){$('message').textContent=t}
function render(){[...garden.querySelectorAll('.vessel')].forEach(x=>x.remove());board.forEach((jar,i)=>{const b=document.createElement('button');b.className='vessel'+(selected===i?' selected':'');b.setAttribute('aria-label',(i+1)+'번 유리통');b.innerHTML='<span class="glass"><span class="cubes"></span></span><span class="vlabel">'+(i+1)+'번 유리통</span>';const rack=b.querySelector('.cubes');jar.forEach(c=>{const row=document.createElement('span');row.className='marble-row '+c;for(let n=0;n<5;n++){const x=document.createElement('span');x.className='marble';row.appendChild(x)}rack.appendChild(row)});b.addEventListener('pointerdown',e=>{e.preventDefault();tap(i)});garden.appendChild(b)});$('level').textContent=(level+1)+' / '+LEVELS.length;$('moves').textContent=moves;$('flowers').textContent=flowers}
function pour(fromIndex,toIndex,color,count,done){const vessels=[...document.querySelectorAll('.vessel')],a=vessels[fromIndex].getBoundingClientRect(),b=vessels[toIndex].getBoundingClientRect();for(let n=0;n<count*5;n++){const bit=document.createElement('i');bit.className='pour-marble '+color;const dx=(b.left+b.width*.5)-(a.left+a.width*.5)+(n%5-2)*8;const dy=(b.top+b.height*.6)-(a.top+a.height*.38)+Math.floor(n/5)*4;bit.style.left=(a.left+a.width*.5-9+(n%5-2)*5)+'px';bit.style.top=(a.top+a.height*.4+Math.floor(n/5)*5)+'px';bit.style.animationDelay=(n*.018)+'s';document.body.appendChild(bit);requestAnimationFrame(()=>{bit.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(n%2?24:-24)+'deg)';bit.style.opacity='0'});setTimeout(()=>bit.remove(),500)}setTimeout(done,460)}
function tap(i){if(!running)return;if(selected===null){if(!board[i].length){say('이 유리통은 비어 있어요. 구슬이 있는 곳을 골라요.');return}selected=i;say(names[board[i][board[i].length-1]]+' 유리구슬을 옮길 유리통을 골라요.');render();return}if(selected===i){selected=null;say('다시 구슬이 있는 유리통을 골라요.');render();return}const from=board[selected],to=board[i],top=from[from.length-1];if(to.length>=4){say('이 유리통은 가득 찼어요. 다른 곳을 골라요.');return}if(to.length&&to[to.length-1]!==top){say('다른 색 위에는 놓을 수 없어요. 같은 색이나 빈 곳을 골라요.');return}let count=1;for(let j=from.length-2;j>=0&&from[j]===top;j--)count++;count=Math.min(count,4-to.length);const source=selected;selected=null;running=false;say(count>1?'반짝반짝! 같은 색 유리구슬이 함께 흐르듯 쏟아져요.':'톡! 유리구슬 다섯 알이 함께 옮겨져요.');pour(source,i,top,count,()=>{for(let j=0;j<count;j++)to.push(from.pop());moves++;running=true;render();setTimeout(check,180)})}
function completeJar(j){return j.length===4&&j.every(c=>c===j[0])}function check(){if(board.every(j=>!j.length||completeJar(j))){flowers+=board.filter(completeJar).length;if(level<LEVELS.length-1){level++;say('새 별꽃 씨앗을 심어요!');setTimeout(init,500)}else end(true)}}
function end(win){running=false;const best=Math.max(+localStorage.getItem(KEY)||0,flowers);localStorage.setItem(KEY,best);$('best').textContent=best;$('endEmoji').textContent=win?'🌸✨🧊':'🌧️';$('endTitle').textContent=win?'별꽃 정원 완성!':'다시 심어 볼까요?';$('endText').textContent=win?'총 '+flowers+'송이의 별꽃을 피웠어요! 이번 정원은 '+moves+'번의 큐브 이동으로 완성했어요.':'유리 큐브를 다시 모아 별꽃을 피워요.';$('endOverlay').classList.remove('hidden');if(win)confetti()}
function confetti(){for(let i=0;i<20;i++){const p=document.createElement('span');p.className='confetti';p.textContent=['✨','🌸','🧊','⭐'][i%4];p.style.left=(5+Math.random()*90)+'%';p.style.bottom='3%';p.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),2800)}}
$('startBtn').addEventListener('pointerdown',e=>{e.preventDefault();$('startOverlay').classList.add('hidden');running=true;level=0;flowers=0;init()});$('restartBtn').addEventListener('pointerdown',e=>{e.preventDefault();$('endOverlay').classList.add('hidden');running=true;level=0;flowers=0;init()});
})();
</script>
</body></html>
