<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>루미 이슬정원</title>
<style>
:root{--ink:#18213d;--violet:#7b5cff;--mint:#58e0c6;--coral:#ff7d99;--gold:#ffd875;--glass:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100vh;height:100dvh;margin:0;overflow:hidden;touch-action:manipulation;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff;background:#1d2350}
body{background:radial-gradient(circle at 50% -10%,#765cc8 0,transparent 34%),linear-gradient(160deg,#252a68 0%,#1d2f5b 47%,#17243f 100%)}
.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;padding:clamp(9px,2.5vw,16px);display:flex;flex-direction:column;gap:10px;position:relative;isolation:isolate;overflow:hidden}
.wrap:before,.wrap:after{content:"";position:absolute;inset:auto;pointer-events:none;z-index:-1}.wrap:before{width:270px;height:270px;left:-125px;bottom:-130px;border-radius:50%;background:radial-gradient(circle,rgba(74,233,201,.27),transparent 67%)}.wrap:after{width:280px;height:240px;right:-155px;top:17%;background:radial-gradient(ellipse,rgba(255,125,153,.18),transparent 70%)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(21px,6vw,29px);letter-spacing:-1px;margin:0;line-height:1.1;text-shadow:0 3px 10px rgba(0,0,0,.25)}.sub{font-size:12px;font-weight:700;color:#d9e7ff;margin-top:4px}.best{font-size:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:8px 10px;white-space:nowrap}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.chip{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:8px 6px;text-align:center;backdrop-filter:blur(10px);font-size:12px;color:#dbe9ff}.chip b{display:block;font-size:18px;color:#fff;margin-top:1px}.mission{min-height:48px;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:18px;background:linear-gradient(100deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.19);font-size:13px;box-shadow:0 10px 22px rgba(6,12,40,.16)}.sprite{font-size:27px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(3deg)}}
#garden{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));column-gap:clamp(12px,4vw,21px);row-gap:38px;align-content:center;padding:4px 10px 8px}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 9px 3px rgba(255,255,255,.65);opacity:.75;animation:twinkle var(--d) ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.2;transform:scale(.55)}}
.vessel{position:relative;min-height:134px;border:0;background:transparent;padding:0;cursor:pointer;touch-action:none;filter:drop-shadow(0 14px 13px rgba(0,0,0,.24));transition:transform .18s ease}.vessel:active{transform:scale(.97)}.vessel.selected{transform:translateY(-7px) scale(1.035);filter:drop-shadow(0 0 13px rgba(255,230,151,.75)) drop-shadow(0 14px 13px rgba(0,0,0,.24))}.vessel.selected .glass{border-color:#fff0aa;box-shadow:inset 0 0 20px rgba(255,255,255,.24),0 0 0 3px rgba(255,226,121,.24),0 0 29px rgba(255,223,122,.45)}.glass{position:absolute;inset:0 6%;border:2px solid rgba(238,247,255,.62);border-top:0;border-radius:18px 18px 30px 30px;background:linear-gradient(90deg,rgba(255,255,255,.20),rgba(255,255,255,.02) 30%,rgba(255,255,255,.10) 64%,rgba(255,255,255,.25));box-shadow:inset 0 0 20px rgba(255,255,255,.14),0 11px 17px rgba(5,10,34,.3);overflow:hidden}.glass:before{content:"";position:absolute;top:-3px;left:12%;width:76%;height:18px;border:2px solid rgba(242,250,255,.8);border-radius:50%;background:rgba(191,227,255,.22);box-shadow:0 3px 8px rgba(0,0,0,.22)}.glass:after{content:"";position:absolute;top:17px;left:20%;height:55%;width:10%;border-radius:50%;background:linear-gradient(#fff8,transparent);opacity:.55}.drops{position:absolute;inset:22px 10px 10px;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:3px}.drop{height:calc((100% - 9px)/4);min-height:18px;border-radius:13px 13px 9px 9px;position:relative;box-shadow:inset 0 2px 5px rgba(255,255,255,.62),inset 0 -5px 8px rgba(0,0,0,.13),0 0 13px var(--c)}.drop:after{content:"";position:absolute;top:20%;left:16%;width:26%;height:18%;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(1px)}.drop.mint{--c:#58e0c6;background:linear-gradient(100deg,#2ad6bd,#9dffe9 48%,#25b89f)}.drop.violet{--c:#8e70ff;background:linear-gradient(100deg,#6441d9,#bcaeff 48%,#7149d4)}.drop.coral{--c:#ff8097;background:linear-gradient(100deg,#ee527b,#ffc1cc 48%,#ee5b7d)}.drop.gold{--c:#ffd875;background:linear-gradient(100deg,#e9ae28,#fff0a8 48%,#e4a526)}.vlabel{position:absolute;bottom:-24px;width:100%;text-align:center;font-size:12px;font-weight:800;color:#e9f5ff;text-shadow:0 2px 3px #142144}.hint{height:29px;text-align:center;font-size:13px;font-weight:700;color:#e6efff}.footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#c9dbfa}.home-link{color:#fff;font-weight:800;text-decoration:none;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.1)}
.overlay{position:fixed;inset:0;background:rgba(10,13,39,.69);backdrop-filter:blur(10px);display:grid;place-items:center;z-index:8;padding:24px}.overlay.hidden{display:none}.card{width:min(390px,100%);padding:27px 23px 22px;text-align:center;border-radius:30px;background:linear-gradient(145deg,rgba(75,82,160,.96),rgba(33,40,91,.97));border:1px solid rgba(255,255,255,.24);box-shadow:0 22px 70px rgba(0,0,0,.45)}.card .hero{font-size:56px;display:block;margin-bottom:4px}.card h2{font-size:28px;margin:0 0 10px}.card p{margin:0 auto 18px;line-height:1.65;font-size:14px;color:#e0eaff}.card .original{font-size:12px;color:#aee9de;background:rgba(88,224,198,.12);padding:9px;border-radius:14px;margin-bottom:16px}.start{border:0;border-radius:16px;padding:15px 25px;min-width:180px;font-size:18px;font-weight:900;color:#27305e;background:linear-gradient(100deg,#ffe77d,#ffb8d0);box-shadow:0 8px 0 #c87694,0 13px 21px rgba(0,0,0,.25);cursor:pointer}.start:active{transform:translateY(5px);box-shadow:0 3px 0 #c87694}.confetti{position:absolute;font-size:24px;animation:float 2.2s linear infinite}@keyframes float{from{transform:translateY(25px) rotate(0);opacity:0}20%{opacity:1}to{transform:translateY(-210px) rotate(240deg);opacity:0}}
@media(max-height:650px){.vessel{min-height:108px}.mission{min-height:42px}.wrap{gap:6px}.vlabel{bottom:-20px}.glass:before{height:14px}.drops{inset:18px 8px 8px}}
</style>
</head>
<body>
<main class="wrap">
<header><div><h1>💧 루미 이슬정원</h1><div class="sub">빛방울을 섞어 별꽃을 피워요</div></div><div class="best">최고 꽃 <b id="best">0</b>송이</div></header>
<section class="hud"><div class="chip">정원 단계<b id="level">1 / 3</b></div><div class="chip">이동 횟수<b id="moves">0</b></div><div class="chip">별꽃<b id="flowers">0</b></div></section>
<div class="mission"><span class="sprite">🧚</span><span id="message">같은 빛방울을 한 유리꽃병에 모아 주세요!</span></div>
<section id="garden" aria-label="빛방울 정원"></section>
<div class="hint" id="hint">빛방울을 먼저 고르고, 옮길 꽃병을 골라요</div>
<footer class="footer"><span>드래그 대신 두 번 톡! 쉬운 물방울 옮기기</span><a class="home-link" href="../index.html">← 홈</a></footer>
</main>
<div class="overlay" id="startOverlay"><div class="card"><span class="hero">🌙🫙✨</span><h2>루미 이슬정원</h2><p>유리 꽃병의 맨 위 빛방울을 옮겨<br>같은 색 이슬로 별꽃을 피워 보세요.</p><div class="original">블록 대신 반짝이는 ‘이슬’과 별꽃 정원을 채우는<br>드래그-선택형 퍼즐이에요.</div><button class="start" id="startBtn">정원 열기!</button></div></div>
<div class="overlay hidden" id="endOverlay"><div class="card"><span class="hero" id="endEmoji">🌸</span><h2 id="endTitle">별꽃 정원 완성!</h2><p id="endText"></p><button class="start" id="restartBtn">다시 심기</button></div></div>
<script>
(()=>{'use strict';
const KEY='lumi-dew-garden_best', colors=['violet','mint','coral','gold'], names={violet:'보랏빛',mint:'민트빛',coral:'산호빛',gold:'햇살빛'};
const LEVELS=[[['violet','mint','coral','gold'],['gold','coral','mint','violet'],['mint','violet','gold','coral'],[]], [['violet','mint','coral','gold'],['mint','gold','violet','coral'],['coral','violet','gold','mint'],[]], [['violet','mint','coral','gold'],['gold','mint','violet','coral'],['coral','gold','mint','violet'],[]]];
let level=0,board=[],selected=null,moves=0,flowers=0,running=false;
const $=id=>document.getElementById(id), garden=$('garden'); $('best').textContent=localStorage.getItem(KEY)||0;
for(let i=0;i<17;i++){let s=document.createElement('i');s.className='star';s.style.left=(4+Math.random()*92)+'%';s.style.top=(4+Math.random()*84)+'%';s.style.setProperty('--d',(1.3+Math.random()*2.2)+'s');garden.appendChild(s)}
function init(){board=LEVELS[level].map(v=>[...v]);selected=null;moves=0;render();say('같은 빛방울을 한 유리꽃병에 모아 주세요!');}
function say(t){$('message').textContent=t;}
function render(){[...garden.querySelectorAll('.vessel')].forEach(x=>x.remove());board.forEach((jar,i)=>{let b=document.createElement('button');b.className='vessel'+(selected===i?' selected':'');b.setAttribute('aria-label',(i+1)+'번 꽃병');b.innerHTML='<span class="glass"><span class="drops"></span></span><span class="vlabel">'+(i+1)+'번 꽃병</span>';let d=b.querySelector('.drops');jar.forEach(c=>{let x=document.createElement('span');x.className='drop '+c;d.appendChild(x)});b.addEventListener('pointerdown',e=>{e.preventDefault();tap(i)});garden.appendChild(b)});$('level').textContent=(level+1)+' / '+LEVELS.length;$('moves').textContent=moves;$('flowers').textContent=flowers;}
function tap(i){if(!running)return;if(selected===null){if(!board[i].length){say('이 꽃병은 비어 있어요. 빛방울이 있는 곳을 골라요.');return}selected=i;say(names[board[i][board[i].length-1]]+' 이슬을 옮길 꽃병을 골라요.');render();return}if(selected===i){selected=null;say('다시 빛방울이 있는 꽃병을 골라요.');render();return}let from=board[selected],to=board[i],top=from[from.length-1];if(to.length>=4){say('이 꽃병은 가득 찼어요. 다른 곳을 골라요.');return}if(to.length&&to[to.length-1]!==top){say('다른 색 위에는 놓을 수 없어요. 같은 색이나 빈 꽃병을 골라요.');return}let count=1;for(let j=from.length-2;j>=0&&from[j]===top;j--)count++;count=Math.min(count,4-to.length);for(let j=0;j<count;j++)to.push(from.pop());moves++;selected=null;say(count>1?'반짝! 같은 빛방울이 함께 흘렀어요.':'톡! 빛방울이 예쁘게 옮겨졌어요.');render();setTimeout(check,180)}
function completeJar(j){return j.length===4&&j.every(c=>c===j[0])}function check(){if(board.every(j=>!j.length||completeJar(j))){flowers+=board.filter(completeJar).length;if(level<LEVELS.length-1){level++;say('새 별꽃 씨앗을 심어요!');setTimeout(init,500)}else{end(true)}}}
function end(win){running=false;let best=Math.max(+localStorage.getItem(KEY)||0,flowers);localStorage.setItem(KEY,best);$('best').textContent=best;$('endEmoji').textContent=win?'🌸✨🌙':'🌧️';$('endTitle').textContent=win?'별꽃 정원 완성!':'다시 심어 볼까요?';$('endText').textContent=win?'총 '+flowers+'송이의 별꽃을 피웠어요! 이번 정원은 '+moves+'번의 이슬 이동으로 완성했어요.':'빛방울을 다시 모아 별꽃을 피워요.';$('endOverlay').classList.remove('hidden');if(win)confetti()}
function confetti(){for(let i=0;i<20;i++){let p=document.createElement('span');p.className='confetti';p.textContent=['✨','🌸','💧','⭐'][i%4];p.style.left=(5+Math.random()*90)+'%';p.style.bottom='3%';p.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),2800)}}
$('startBtn').addEventListener('pointerdown',e=>{e.preventDefault();$('startOverlay').classList.add('hidden');running=true;level=0;flowers=0;init()});$('restartBtn').addEventListener('pointerdown',e=>{e.preventDefault();$('endOverlay').classList.add('hidden');running=true;level=0;flowers=0;init()});
})();
</script>
</body></html>
