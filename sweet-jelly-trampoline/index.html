<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍮 말랑말랑 젤리 트램펄린 | 장윤이의 게임 놀이터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ui-overlay {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 10;
      pointer-events: none;
    }
    .stat-pill {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #d63031;
      box-shadow: 0 4px 15px rgba(214, 48, 49, 0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal {
      position: absolute;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 32px 40px;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 90%;
      width: 380px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .modal.active {
      display: flex;
    }
    .modal h1 {
      font-size: 1.8rem;
      color: #d63031;
      margin-bottom: 4px;
    }
    .modal p {
      font-size: 1.05rem;
      color: #636e72;
      line-height: 1.5;
    }
    .btn {
      background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
      color: #fff;
      border: none;
      padding: 14px 36px;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(214, 48, 49, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
      pointer-events: auto;
    }
    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <div class="stat-pill">✨ 점수: <span id="scoreVal">0</span></div>
    <div class="stat-pill">❤️ 하트: <span id="livesVal">❤️❤️❤️</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="startModal" class="modal active">
    <h1>🍮 젤리 트램펄린</h1>
    <p>화면을 터치하거나 마우스를 움직여 말랑말랑 젤리를 이동하세요!<br>떨어지는 곰인형과 별사탕을 통통 튕겨내요!</p>
    <button class="btn" id="startBtn">신나게 시작하기! 🚀</button>
  </div>

  <div id="overModal" class="modal">
    <h1>🎉 신나는 모험 완료!</h1>
    <p>최종 점수: <strong id="finalScore" style="color:#d63031; font-size:1.4rem;">0</strong>점<br>정말 멋지게 튕겨냈어요!</p>
    <button class="btn" id="restartBtn">다시 도전하기! 🔄</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const startModal = document.getElementById('startModal');
    const overModal = document.getElementById('overModal');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Sound FX (Web Audio)
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playBounceSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }
    function playCollectSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.18); // A5
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    }
    function playLoseSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(250, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    // Game Entities
    const paddle = {
      x: W / 2,
      y: H - 90,
      width: 140,
      height: 36,
      squish: 1,
      targetX: W / 2
    };

    let items = [];
    let particles = [];
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let lastSpawn = 0;
    let animId = null;

    function spawnItem() {
      const type = Math.random() < 0.65 ? 'bear' : 'candy';
      items.push({
        type: type,
        x: 40 + Math.random() * (W - 80),
        y: -30,
        vx: (Math.random() - 0.5) * 2,
        vy: 2 + Math.random() * 2,
        radius: type === 'bear' ? 24 : 16,
        color: type === 'candy' ? ['#ffd166', '#06d6a0', '#118ab2', '#ff7675'][Math.floor(Math.random() * 4)] : '#fdcb6e',
        bounces: 0
      });
    }

    function addParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 3 + Math.random() * 4,
          color: color,
          alpha: 1,
          life: 0.95
        });
      }
    }

    // Input handlers
    window.addEventListener('pointermove', e => {
      paddle.targetX = e.clientX;
    });
    window.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        paddle.targetX = e.touches[0].clientX;
      }
    }, { passive: true });

    function startGame() {
      initAudio();
      score = 0;
      lives = 3;
      items = [];
      particles = [];
      scoreVal.textContent = '0';
      livesVal.textContent = '❤️❤️❤️';
      startModal.classList.remove('active');
      overModal.classList.remove('active');
      isPlaying = true;
      lastSpawn = performance.now();
      if (animId) cancelAnimationFrame(animId);
      loop(performance.now());
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    function gameOver() {
      isPlaying = false;
      document.getElementById('finalScore').textContent = score;
      overModal.classList.add('active');
    }

    function loop(now) {
      if (!isPlaying) return;

      // Update paddle position with smooth lerp
      paddle.x += (paddle.targetX - paddle.x) * 0.25;
      paddle.x = Math.max(paddle.width / 2, Math.min(W - paddle.width / 2, paddle.x));
      paddle.y = H - 90;
      paddle.squish += (1 - paddle.squish) * 0.15;

      // Spawn item
      if (now - lastSpawn > 1200) {
        spawnItem();
        lastSpawn = now;
      }

      // Clear Canvas
      ctx.clearRect(0, 0, W, H);

      // Draw Paddle (Pudding Jelly)
      ctx.save();
      ctx.translate(paddle.x, paddle.y);
      ctx.scale(1 / paddle.squish, paddle.squish);
      
      // Jelly Base
      const pGrad = ctx.createLinearGradient(0, -paddle.height/2, 0, paddle.height/2);
      pGrad.addColorStop(0, '#fff5b7');
      pGrad.addColorStop(0.3, '#ff9a9e');
      pGrad.addColorStop(1, '#ff0844');
      ctx.fillStyle = pGrad;
      ctx.beginPath();
      ctx.roundRect(-paddle.width / 2, -paddle.height / 2, paddle.width, paddle.height, [18, 18, 12, 12]);
      ctx.fill();

      // Whipped Cream detail
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(-paddle.width * 0.25, -paddle.height * 0.2, 7, 0, Math.PI * 2);
      ctx.arc(0, -paddle.height * 0.3, 9, 0, Math.PI * 2);
      ctx.arc(paddle.width * 0.25, -paddle.height * 0.2, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Update & Draw Items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.x += item.vx;
        item.y += item.vy;
        item.vy += 0.14; // gravity

        // Bounce on walls
        if (item.x - item.radius < 0 || item.x + item.radius > W) {
          item.vx *= -1;
          item.x = Math.max(item.radius, Math.min(W - item.radius, item.x));
        }

        // Check collision with jelly paddle
        if (
          item.y + item.radius >= paddle.y - paddle.height / 2 &&
          item.y - item.radius <= paddle.y + paddle.height / 2 &&
          item.x >= paddle.x - paddle.width / 2 - 10 &&
          item.x <= paddle.x + paddle.width / 2 + 10 &&
          item.vy > 0
        ) {
          item.vy = -8.5 - Math.random() * 2;
          item.vx = (item.x - paddle.x) * 0.12;
          paddle.squish = 0.55;
          item.bounces++;
          
          if (item.type === 'candy') {
            score += 20;
            playCollectSound();
            addParticles(item.x, item.y, item.color, 16);
            items.splice(i, 1);
            scoreVal.textContent = score;
            continue;
          } else {
            score += 10;
            playBounceSound();
            addParticles(item.x, item.y, '#ffd166', 10);
            scoreVal.textContent = score;
          }
        }

        // Missed bottom
        if (item.y > H + 50) {
          if (item.type === 'bear') {
            lives--;
            playLoseSound();
            livesVal.textContent = '❤️'.repeat(Math.max(0, lives));
            if (lives <= 0) {
              gameOver();
              return;
            }
          }
          items.splice(i, 1);
          continue;
        }

        // Draw item
        ctx.save();
        ctx.translate(item.x, item.y);
        if (item.type === 'bear') {
          // Draw Teddy Bear
          ctx.fillStyle = '#fdcb6e';
          ctx.beginPath();
          ctx.arc(-16, -16, 9, 0, Math.PI * 2);
          ctx.arc(16, -16, 9, 0, Math.PI * 2);
          ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
          ctx.fill();

          // Face
          ctx.fillStyle = '#ff7675';
          ctx.beginPath();
          ctx.arc(-9, 5, 4, 0, Math.PI * 2);
          ctx.arc(9, 5, 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#2d3436';
          ctx.beginPath();
          ctx.arc(-7, -2, 2.5, 0, Math.PI * 2);
          ctx.arc(7, -2, 2.5, 0, Math.PI * 2);
          ctx.arc(0, 3, 3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Candy Star
          ctx.fillStyle = item.color;
          ctx.beginPath();
          ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-4, -4, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha *= p.life;
        if (p.alpha <= 0.05) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      animId = requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
