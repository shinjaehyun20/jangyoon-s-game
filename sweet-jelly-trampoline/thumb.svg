<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="100%" stop-color="#fecfef"/>
    </linearGradient>
    <radialGradient id="jellyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5b7"/>
      <stop offset="30%" stop-color="#ffb199"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </radialGradient>
    <radialGradient id="bearGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#ff0844" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- Star Candies -->
  <g opacity="0.85">
    <circle cx="60" cy="50" r="12" fill="#ffd166"/>
    <circle cx="340" cy="70" r="15" fill="#06d6a0"/>
    <circle cx="80" cy="180" r="10" fill="#118ab2"/>
    <circle cx="320" cy="190" r="14" fill="#ffd166"/>
  </g>

  <!-- Bouncing Teddy Bear -->
  <g transform="translate(200, 110)">
    <!-- Ears -->
    <circle cx="-26" cy="-28" r="14" fill="#fdcb6e"/>
    <circle cx="-26" cy="-28" r="7" fill="#e17055"/>
    <circle cx="26" cy="-28" r="14" fill="#fdcb6e"/>
    <circle cx="26" cy="-28" r="7" fill="#e17055"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="32" fill="url(#bearGrad)"/>
    <!-- Cheeks -->
    <circle cx="-16" cy="10" r="6" fill="#ff7675" opacity="0.6"/>
    <circle cx="16" cy="10" r="6" fill="#ff7675" opacity="0.6"/>
    <!-- Eyes -->
    <circle cx="-11" cy="-4" r="4" fill="#2d3436"/>
    <circle cx="11" cy="-4" r="4" fill="#2d3436"/>
    <circle cx="-9" cy="-6" r="1.5" fill="#ffffff"/>
    <circle cx="13" cy="-6" r="1.5" fill="#ffffff"/>
    <!-- Snout & Nose -->
    <ellipse cx="0" cy="8" rx="11" ry="8" fill="#ffffff"/>
    <ellipse cx="0" cy="5" rx="4" ry="2.5" fill="#2d3436"/>
    <path d="M -3 10 Q 0 13 3 10" stroke="#2d3436" stroke-width="2" fill="none"/>
  </g>

  <!-- Pudding Trampoline -->
  <g transform="translate(200, 240)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="90" ry="26" fill="url(#jellyGrad)"/>
    <ellipse cx="0" cy="-6" rx="75" ry="18" fill="#fff5b7" opacity="0.6"/>
    <!-- Cream & Cherry -->
    <circle cx="-40" cy="-6" r="6" fill="#ffffff"/>
    <circle cx="40" cy="-6" r="6" fill="#ffffff"/>
  </g>

  <!-- Title Text Banner -->
  <rect x="50" y="250" width="300" height="38" rx="19" fill="#ffffff" opacity="0.92"/>
  <text x="200" y="275" font-family="'Pretendard', sans-serif" font-size="17" font-weight="900" fill="#d63031" text-anchor="middle">🍮 말랑말랑 젤리 트램펄린</text>
</svg>