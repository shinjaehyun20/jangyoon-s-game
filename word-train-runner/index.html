<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚂 단어 기차 칙칙폭폭 - 장윤이의 게임세상 #318</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #1e3c72;
      font-family: 'Pretendard', 'Malgun Gothic', -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    #game-wrap {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(180deg, #4a90e2 0%, #87ceeb 50%, #74c69d 80%, #52b788 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    /* Header HUD */
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .hud-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .hud-stats {
      display: flex;
      gap: 12px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .badge {
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* Train Stage */
    .track-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      animation: floatCloud linear infinite;
    }
    @keyframes floatCloud {
      from { transform: translateX(120vw); }
      to { transform: translateX(-40vw); }
    }

    /* Train display */
    .train-container {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .train-container.depart {
      transform: translateX(120vw);
    }
    .train-container.enter {
      animation: trainEnter 0.5s ease-out;
    }
    @keyframes trainEnter {
      from { transform: translateX(-100vw); }
      to { transform: translateX(0); }
    }

    .train-engine {
      width: 110px;
      height: 90px;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      border-radius: 18px 24px 8px 8px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }
    .engine-window {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 32px;
      height: 28px;
      background: #c7ecee;
      border-radius: 6px;
      border: 3px solid #2f3542;
    }
    .engine-chimney {
      position: absolute;
      top: -18px;
      left: 20px;
      width: 18px;
      height: 20px;
      background: #2f3542;
      border-radius: 4px;
    }
    .smoke-puff {
      position: absolute;
      top: -30px;
      left: 18px;
      width: 18px;
      height: 18px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: puff 1.2s infinite;
    }
    @keyframes puff {
      0% { transform: scale(0.6) translateY(0); opacity: 0.8; }
      100% { transform: scale(1.8) translateY(-25px); opacity: 0; }
    }

    .train-cart {
      width: 130px;
      height: 85px;
      background: linear-gradient(135deg, #ffa502, #eccc68);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    }
    .wheel {
      position: absolute;
      bottom: -12px;
      width: 24px;
      height: 24px;
      background: #2f3542;
      border: 3px solid #ced6e0;
      border-radius: 50%;
    }
    .wheel.left { left: 16px; }
    .wheel.right { right: 16px; }

    /* Word Box inside Cart */
    .word-box {
      background: #ffffff;
      padding: 6px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 2.2rem;
      font-weight: 900;
      color: #2f3542;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
    }
    .word-blank {
      color: #ff4757;
      background: #ffeaa7;
      border: 2px dashed #ff9f43;
      padding: 0 8px;
      border-radius: 8px;
      min-width: 44px;
      text-align: center;
    }

    /* Rails */
    .rails {
      width: 100%;
      height: 18px;
      background: repeating-linear-gradient(90deg, #4b6584, #4b6584 10px, transparent 10px, transparent 24px),
                  linear-gradient(180deg, #778ca3 0%, #4b6584 100%);
      margin-top: 10px;
    }

    /* Hint Prompt */
    .hint-banner {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2f3542;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 20px;
      border-radius: 20px;
      margin-top: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Selection Zone */
    .answer-zone {
      padding: 24px 20px 36px 20px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border-radius: 28px 28px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .answer-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .options-grid {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }
    .opt-card {
      flex: 1;
      max-width: 110px;
      height: 90px;
      background: #ffffff;
      color: #2f3542;
      border: none;
      border-radius: 20px;
      font-size: 2.2rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.18), 0 3px 0 #ced6e0;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .opt-card:active {
      transform: translateY(4px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15), 0 0 0 #ced6e0;
    }
    .opt-card.correct {
      background: #2ed573;
      color: #fff;
      box-shadow: 0 8px 16px rgba(46, 213, 115, 0.4);
    }
    .opt-card.wrong {
      background: #ff4757;
      color: #fff;
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Modal / Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay-card {
      background: #ffffff;
      color: #2f3542;
      padding: 30px 24px;
      border-radius: 24px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.3);
    }
    .overlay-card h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #ff4757;
    }
    .overlay-card p {
      font-size: 1.05rem;
      margin-bottom: 24px;
      line-height: 1.5;
      color: #57606f;
    }
    .btn-start {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 71, 87, 0.4);
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <!-- Header -->
    <header>
      <div class="hud-title">🚂 단어 기차 칙칙폭폭</div>
      <div class="hud-stats">
        <div class="badge">⭐ 점수: <span id="score">0</span></div>
        <div class="badge">🚩 문제: <span id="current-q">1</span>/10</div>
      </div>
    </header>

    <!-- Track & Train -->
    <div class="track-area">
      <div class="cloud" style="width: 80px; height: 35px; top: 15%; animation-duration: 18s;"></div>
      <div class="cloud" style="width: 110px; height: 45px; top: 28%; animation-duration: 24s; animation-delay: -10s;"></div>

      <div class="train-container" id="train">
        <!-- Cart -->
        <div class="train-cart">
          <div class="word-box">
            <span id="prefix-text">호</span>
            <span class="word-blank" id="blank-text">?</span>
            <span id="suffix-text"></span>
          </div>
          <div class="wheel left"></div>
          <div class="wheel right"></div>
        </div>
        <!-- Engine -->
        <div class="train-engine">
          <div class="engine-chimney"></div>
          <div class="smoke-puff"></div>
          <div class="engine-window"></div>
          <div class="wheel left" style="left: 14px;"></div>
          <div class="wheel right" style="right: 14px;"></div>
        </div>
      </div>

      <div class="rails"></div>
      <div class="hint-banner" id="hint-text">알맞은 글자를 골라 기차를 출발시켜요! 🚂</div>
    </div>

    <!-- Options -->
    <div class="answer-zone">
      <div class="answer-title">도착할 글자 수레를 터치하세요!</div>
      <div class="options-grid" id="options">
        <button class="opt-card">랑</button>
        <button class="opt-card">박</button>
        <button class="opt-card">통</button>
      </div>
    </div>

    <!-- Start Overlay -->
    <div class="overlay" id="start-overlay">
      <div class="overlay-card">
        <h2>🚂 칙칙폭폭!</h2>
        <p>기차에 적힌 빈칸에 쏙 들어갈<br>알맞은 받침 글자를 찾아<br>신나게 기차를 출발시켜 볼까요?</p>
        <button class="btn-start" onclick="startGame()">출발하기 🏁</button>
      </div>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playWhistle() {
      if (!audioCtx) return;
      playTone(880, 0.4, 'triangle');
      setTimeout(() => playTone(1100, 0.5, 'triangle'), 150);
    }

    function playWrongSound() {
      if (!audioCtx) return;
      playTone(260, 0.2, 'sawtooth');
      setTimeout(() => playTone(220, 0.3, 'sawtooth'), 120);
    }

    // Question Bank (1st grade Korean, 받침 및 필수 어휘)
    const questions = [
      { prefix: "사", blank: "?", suffix: "", ans: "과", wrong: ["누", "거"], full: "사과 🍎", hint: "빨갛고 아삭아삭 맛있는 과일!" },
      { prefix: "호", blank: "?", suffix: "이", ans: "랑", wrong: ["동", "장"], full: "호랑이 🐯", hint: "어흥! 용감한 숲속의 왕!" },
      { prefix: "바", blank: "?", suffix: "", ans: "나나", wrong: ["나", "도"], full: "바나나 🍌", hint: "노랗고 달콤한 원숭이가 좋아하는 과일!" },
      { prefix: "연", blank: "?", suffix: "", ans: "필", wrong: ["물", "손"], full: "연필 ✏️", hint: "글씨를 예쁘게 쓸 때 써요!" },
      { prefix: "비", blank: "?", suffix: "기", ans: "행", wrong: ["행", "락"], full: "비행기 ✈️", hint: "하늘 높이 슝 날아가는 탈것!" },
      { prefix: "무", blank: "?", suffix: "개", ans: "지", wrong: ["비", "소"], full: "무지개 🌈", hint: "비 온 뒤 하늘에 뜨는 일곱 빛깔!" },
      { prefix: "태", blank: "?", suffix: "", ans: "양", wrong: ["양", "강"], full: "태양 ☀️", hint: "낮에 하늘을 밝게 비춰요!" },
      { prefix: "토", blank: "?", suffix: "", ans: "끼", wrong: ["끼", "마"], full: "토끼 🐰", hint: "깡충깡충 귀가 긴 귀여운 친구!" },
      { prefix: "자", blank: "?", suffix: "차", ans: "동", wrong: ["학", "명"], full: "자동차 🚗", hint: "부릉부릉 도로를 달려요!" },
      { prefix: "풍", blank: "?", suffix: "", ans: "선", wrong: ["달", "문"], full: "풍선 🎈", hint: "동글동글 하늘로 둥실 떠올라요!" }
    ];

    let currentIdx = 0;
    let score = 0;
    let isProcessing = false;

    function startGame() {
      initAudio();
      document.getElementById('start-overlay').style.display = 'none';
      currentIdx = 0;
      score = 0;
      document.getElementById('score').innerText = score;
      loadQuestion();
    }

    function loadQuestion() {
      if (currentIdx >= questions.length) {
        showClear();
        return;
      }
      isProcessing = false;
      const q = questions[currentIdx];
      document.getElementById('current-q').innerText = currentIdx + 1;
      document.getElementById('prefix-text').innerText = q.prefix;
      document.getElementById('blank-text').innerText = "?";
      document.getElementById('suffix-text').innerText = q.suffix;
      document.getElementById('hint-text').innerText = q.hint;

      const train = document.getElementById('train');
      train.className = 'train-container enter';

      // Build options (1 correct, 2 wrong)
      const opts = [q.ans, ...q.wrong].sort(() => Math.random() - 0.5);
      const optContainer = document.getElementById('options');
      optContainer.innerHTML = '';
      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-card';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, btn, q);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(chosen, btn, q) {
      if (isProcessing) return;
      isProcessing = true;

      if (chosen === q.ans) {
        btn.classList.add('correct');
        document.getElementById('blank-text').innerText = q.ans;
        document.getElementById('hint-text').innerText = `정답! ${q.full} 완성! 🎉`;
        score += 10;
        document.getElementById('score').innerText = score;
        playWhistle();

        setTimeout(() => {
          document.getElementById('train').className = 'train-container depart';
          setTimeout(() => {
            currentIdx++;
            loadQuestion();
          }, 600);
        }, 800);
      } else {
        btn.classList.add('wrong');
        playWrongSound();
        document.getElementById('hint-text').innerText = "다시 한번 생각해 볼까요? 😉";
        setTimeout(() => {
          btn.classList.remove('wrong');
          isProcessing = false;
        }, 500);
      }
    }

    function showClear() {
      playTone(523.25, 0.2);
      setTimeout(() => playTone(659.25, 0.2), 200);
      setTimeout(() => playTone(783.99, 0.4), 400);

      const overlay = document.getElementById('start-overlay');
      overlay.innerHTML = `
        <div class="overlay-card">
          <h2>🎉 대단해요!</h2>
          <p>모든 단어 기차를 멋지게 완성했어요!<br>최종 점수: <strong>${score}점</strong></p>
          <button class="btn-start" onclick="startGame()">다시 달리기 🔄</button>
        </div>
      `;
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>
