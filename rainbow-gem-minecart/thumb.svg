<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="무지개 보석 광산 열차">
<defs>
  <linearGradient id="mineBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#18181b"/>
    <stop offset="60%" stop-color="#27272a"/>
    <stop offset="100%" stop-color="#3f3f46"/>
  </linearGradient>
  <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="50%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>
  <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="320" height="180" rx="18" fill="url(#mineBg)"/>

<!-- Mine Cave Arch -->
<path d="M0 0 L320 0 L320 180 L280 180 C280 90 40 90 40 180 L0 180 Z" fill="#09090b" opacity="0.6"/>

<!-- Rail Track -->
<path d="M20 145 L300 145" stroke="#71717a" stroke-width="4"/>
<path d="M40 140 L40 150 M80 140 L80 150 M120 140 L120 150 M160 140 L160 150 M200 140 L200 150 M240 140 L240 150 M280 140 L280 150" stroke="#a1a1aa" stroke-width="3"/>

<!-- Minecart -->
<g transform="translate(160, 125)">
  <rect x="-35" y="-20" width="70" height="30" rx="6" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <circle cx="-20" cy="14" r="8" fill="#52525b" stroke="#27272a" stroke-width="2"/>
  <circle cx="20" cy="14" r="8" fill="#52525b" stroke="#27272a" stroke-width="2"/>
  <!-- Gems inside cart -->
  <polygon points="-18,-18 -10,-32 -2,-18" fill="#ef4444" filter="url(#glow2)"/>
  <polygon points="-4,-18 5,-34 14,-18" fill="#3b82f6" filter="url(#glow2)"/>
  <polygon points="10,-18 20,-30 28,-18" fill="#10b981" filter="url(#glow2)"/>
</g>

<!-- Falling Gems -->
<polygon points="70,30 80,10 90,30 80,45" fill="#facc15" filter="url(#glow2)"/>
<polygon points="230,45 240,25 250,45 240,60" fill="#a855f7" filter="url(#glow2)"/>

<!-- Titles -->
<text x="296" y="148" text-anchor="end" font-family="Pretendard,Malgun Gothic,sans-serif" font-size="20" font-weight="900" fill="#38bdf8">무지개 보석 광산 열차</text>
<text x="296" y="166" text-anchor="end" font-family="Pretendard,Arial,sans-serif" font-size="10" font-weight="700" fill="#bae6fd" letter-spacing="2">RAINBOW GEM MINECART</text>
<rect x="0.5" y="0.5" width="319" height="179" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>
</svg>