<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>신호등 안전 건너기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:Arial,'Apple SD Gothic Neo',sans-serif;background:#10233d;color:#fff}.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:10px 12px 8px;gap:8px}.title{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud{display:flex;justify-content:space-around;background:#ffffff18;padding:8px;border-radius:12px;font-weight:800}.scene{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:linear-gradient(#7ed7ff 0 47%,#5f6776 47% 100%)}.road{position:absolute;inset:48% 0 0;background:repeating-linear-gradient(90deg,#555 0 54px,#eee 54px 70px,#555 70px 124px)}.light{position:absolute;left:50%;top:5%;transform:translateX(-50%);width:86px;padding:10px;background:#263238;border-radius:18px;display:grid;gap:7px;box-shadow:0 8px 0 #111}.lamp{width:52px;height:52px;border-radius:50%;margin:auto;background:#111;opacity:.28}.lamp.on{opacity:1;box-shadow:0 0 22px currentColor}.red{color:#ff4d5e;background:#ff4d5e}.yellow{color:#ffd43b;background:#ffd43b}.green{color:#42e695;background:#42e695}.kid{position:absolute;left:8%;bottom:14%;font-size:58px;transition:left .55s ease,transform .2s}.kid.cross{left:78%;transform:rotate(5deg)}.msg{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);padding:8px 14px;border-radius:15px;background:#fff;color:#123;font-weight:900;white-space:nowrap}.go{min-height:54px;border:0;border-radius:16px;background:#42e695;color:#083c2b;font-size:22px;font-weight:900;box-shadow:0 5px 0 #19865a}.go:active{transform:translateY(3px);box-shadow:0 2px 0 #19865a}footer{display:flex;justify-content:space-between;font-size:12px}.home{color:#b9e8ff}.overlay{position:fixed;inset:0;background:#071426dd;display:grid;place-items:center;padding:24px;z-index:4}.overlay.hidden{display:none}.card{max-width:360px;text-align:center;background:#fff;color:#123;padding:24px;border-radius:24px}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.6}.start{margin-top:18px;min-height:50px;width:100%;border:0;border-radius:14px;background:#ffca3a;font-size:20px;font-weight:900}
</style></head>
<body><div class="wrap"><h1 class="title">🚦 신호등 안전 건너기</h1><div class="hud"><span>점수 <b id="score">0</b></span><span>시간 <b id="time">45</b></span><span>기회 <b id="life">❤️❤️❤️</b></span></div><main class="scene"><div class="road"></div><div class="light"><i class="lamp red"></i><i class="lamp yellow"></i><i class="lamp green"></i></div><div class="msg" id="msg">신호를 기다려요!</div><div class="kid" id="kid">🧒</div></main><button class="go" id="go">건너기!</button><footer><small>초록불에만 톡!</small><a class="home" href="../index.html">← 홈으로</a></footer></div>
<div class="overlay" id="startOverlay"><div class="card"><h2>🚦 안전 건너기</h2><p>빨간불과 노란불에는 기다리고<br><b>초록불일 때만</b> 건너기 버튼을 눌러요!</p><button class="start" id="startBtn">시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🎉 안전 연습 끝!</h2><p>점수 <b id="finalScore">0</b>점</p><button class="start" id="restartBtn">다시 하기</button></div></div>
<script>(function(){'use strict';const C={seconds:45,key:'traffic-light-crossing_best'};let state={run:false,score:0,life:3,time:C.seconds,signal:'red',step:0,timer:null,signalTimer:null};const $=s=>document.querySelector(s),lamps={red:$('.red'),yellow:$('.yellow'),green:$('.green')};function render(){score.textContent=state.score;time.textContent=state.time;life.textContent='❤️'.repeat(state.life)+'🖤'.repeat(3-state.life);Object.keys(lamps).forEach(k=>lamps[k].classList.toggle('on',k===state.signal))}function nextSignal(){if(!state.run)return;const seq=['green','red','yellow','green'];state.signal=seq[state.step++%seq.length];msg.textContent=state.signal==='green'?'초록불! 지금 건너요!':state.signal==='yellow'?'노란불! 멈춰요!':'빨간불! 기다려요!';render();const wait=state.signal==='green'?2400:1200+Math.random()*600;state.signalTimer=setTimeout(nextSignal,wait)}function cross(){if(!state.run)return;if(state.signal==='green'){state.score+=10;kid.classList.add('cross');msg.textContent='참 잘했어요! +10';setTimeout(()=>kid.classList.remove('cross'),550)}else{state.life--;msg.textContent='앗! 초록불을 기다려요';if(state.life<=0)return finish()}state.signal='red';render()}function start(){clearInterval(state.timer);clearTimeout(state.signalTimer);state={run:true,score:0,life:3,time:C.seconds,signal:'red',step:0,timer:null,signalTimer:null};startOverlay.classList.add('hidden');endOverlay.classList.add('hidden');render();nextSignal();state.timer=setInterval(()=>{state.time--;render();if(state.time<=0)finish()},1000)}function finish(){if(!state.run)return;state.run=false;clearInterval(state.timer);clearTimeout(state.signalTimer);const best=Math.max(state.score,+localStorage.getItem(C.key)||0);localStorage.setItem(C.key,best);finalScore.textContent=state.score;endOverlay.classList.remove('hidden')}go.addEventListener('pointerdown',()=>{});go.addEventListener('click',e=>{e.preventDefault();cross()});startBtn.onclick=start;restartBtn.onclick=start;render()})();</script></body></html>
