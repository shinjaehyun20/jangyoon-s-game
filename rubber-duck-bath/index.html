<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🦆 오리 목욕 놀이</title>
<style>
  :root{
    --bg:#0d3b52;
    --accent:#ffd54a;
    --text:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100vh;height:100dvh;
    overflow:hidden;
    touch-action:manipulation;
    font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
    background:linear-gradient(180deg,#1b5d7a 0%,var(--bg) 100%);
    color:var(--text);
  }
  .wrap{
    width:100%;max-width:480px;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    padding:10px 12px 8px;gap:8px;
    margin:0 auto;
    position:relative;
  }
  h1{
    font-size:clamp(20px,5.5vw,28px);
    text-align:center;
    text-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .hud{
    display:flex;flex-direction:row;justify-content:space-between;
    background:rgba(255,255,255,0.12);
    border-radius:12px;
    padding:8px 14px;
    font-size:15px;font-weight:700;
  }
  .hud span{color:var(--accent);}
  #gameArea{
    flex:1;
    position:relative;
    border-radius:16px;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 40%),
      linear-gradient(180deg,#2b7fa3 0%,#0d3b52 100%);
    touch-action:none;
  }
  .bubble{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.2) 70%);
    pointer-events:none;
    opacity:0;
  }
  .duck{
    position:absolute;
    font-size:40px;
    user-select:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));
    transition:transform .08s;
  }
  .duck.gold{ filter:drop-shadow(0 0 10px #ffd54a) drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  footer{
    display:flex;flex-direction:row;justify-content:space-between;align-items:center;
    font-size:12px;color:rgba(255,255,255,0.7);
  }
  .home-link{color:var(--accent);text-decoration:none;font-weight:700;}
  .overlay{
    position:absolute;inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }
  .overlay.hidden{display:none;}
  .overlay-card{
    background:#0f4a63;
    border-radius:20px;
    padding:26px 22px;
    text-align:center;
    width:min(86%,340px);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .overlay-card h2{font-size:22px;margin-bottom:10px;}
  .overlay-card p{font-size:14px;margin-bottom:16px;line-height:1.5;color:rgba(255,255,255,0.85);}
  .btn-start{
    min-height:44px;
    font-size:16px;font-weight:800;
    background:var(--accent);
    color:#4a3200;
    border:none;border-radius:12px;
    padding:10px 28px;
    cursor:pointer;
  }
  .result-score{font-size:42px;font-weight:900;color:var(--accent);margin:8px 0;}
  .splash{
    position:absolute;
    width:60px;height:60px;
    border:3px solid rgba(255,255,255,0.7);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    opacity:1;
    pointer-events:none;
  }
  @keyframes splashAnim{
    from{transform:translate(-50%,-50%) scale(0);opacity:1;}
    to{transform:translate(-50%,-50%) scale(1.8);opacity:0;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🦆 오리 목욕 놀이</h1>
    <div class="hud">
      <div>점수 <span id="score">0</span></div>
      <div>시간 <span id="time">30</span>s</div>
      <div>최고 <span id="best">0</span></div>
    </div>
    <div id="gameArea"></div>
    <footer>
      <small>노란 오리를 콕콕 눌러보세요! 황금 오리는 5점!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>

    <div class="overlay" id="startOverlay">
      <div class="overlay-card">
        <h2>🦆 오리 목욕 놀이</h2>
        <p>욕조에 둥둥 뜬 오리를 손가락으로 콕! 눌러 점수를 모아요.<br>반짝이는 황금 오리는 5점!</p>
        <button class="btn-start" id="startBtn">시작!</button>
      </div>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <div class="overlay-card">
        <h2>🎉 목욕 끝!</h2>
        <div class="result-score" id="finalScore">0</div>
        <p id="resultMsg"></p>
        <button class="btn-start" id="restartBtn">다시 하기</button>
      </div>
    </div>
  </div>

<script>
(function(){
  'use strict';
  const CONFIG = {
    DURATION: 30,
    SPAWN_MIN: 550,
    SPAWN_MAX: 950,
    GOLD_CHANCE: 0.18,
    DUCK_LIFETIME: 2600,
    STORAGE_KEY: 'rubber-duck-bath_best'
  };

  const gameArea = document.getElementById('gameArea');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const resultMsgEl = document.getElementById('resultMsg');

  let state = {
    score: 0,
    timeLeft: CONFIG.DURATION,
    running: false,
    spawnTimer: null,
    tickTimer: null,
    ducks: []
  };

  function getBest(){
    return parseInt(localStorage.getItem(CONFIG.STORAGE_KEY) || '0', 10);
  }
  function setBest(v){
    localStorage.setItem(CONFIG.STORAGE_KEY, String(v));
  }
  bestEl.textContent = getBest();

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function spawnDuck(){
    if(!state.running) return;
    const isGold = Math.random() < CONFIG.GOLD_CHANCE;
    const duck = document.createElement('div');
    duck.className = 'duck' + (isGold ? ' gold' : '');
    duck.textContent = isGold ? '🦆' : '🐤';
    if(!isGold) duck.textContent = '🦆';
    duck.style.color = isGold ? '#ffd54a' : '';
    const areaW = gameArea.clientWidth;
    const areaH = gameArea.clientHeight;
    const x = rand(20, areaW - 60);
    const y = rand(20, areaH - 60);
    duck.style.left = x + 'px';
    duck.style.top = y + 'px';
    duck.dataset.gold = isGold ? '1' : '0';
    gameArea.appendChild(duck);
    state.ducks.push(duck);

    const removeTimeout = setTimeout(() => {
      removeDuck(duck);
    }, CONFIG.DUCK_LIFETIME);
    duck.dataset.removeTimeout = '';

    duck.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if(!state.running) return;
      clearTimeout(removeTimeout);
      const gold = duck.dataset.gold === '1';
      state.score += gold ? 5 : 1;
      scoreEl.textContent = state.score;
      splashAt(x + 30, y + 30, gold);
      removeDuck(duck);
    }, { once:true });

    const nextDelay = rand(CONFIG.SPAWN_MIN, CONFIG.SPAWN_MAX);
    state.spawnTimer = setTimeout(spawnDuck, nextDelay);
  }

  function removeDuck(duck){
    if(duck.parentNode) duck.parentNode.removeChild(duck);
    state.ducks = state.ducks.filter(d => d !== duck);
  }

  function splashAt(x, y, gold){
    const s = document.createElement('div');
    s.className = 'splash';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.borderColor = gold ? 'rgba(255,213,74,0.9)' : 'rgba(255,255,255,0.7)';
    s.style.animation = 'splashAnim .4s ease-out forwards';
    gameArea.appendChild(s);
    setTimeout(() => { if(s.parentNode) s.parentNode.removeChild(s); }, 420);
  }

  function tick(){
    state.timeLeft -= 1;
    timeEl.textContent = state.timeLeft;
    if(state.timeLeft <= 0){
      endGame();
    } else {
      state.tickTimer = setTimeout(tick, 1000);
    }
  }

  function startGame(){
    state.score = 0;
    state.timeLeft = CONFIG.DURATION;
    state.running = true;
    scoreEl.textContent = '0';
    timeEl.textContent = String(CONFIG.DURATION);
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    state.ducks.forEach(removeDuck);
    spawnDuck();
    state.tickTimer = setTimeout(tick, 1000);
  }

  function endGame(){
    state.running = false;
    clearTimeout(state.spawnTimer);
    clearTimeout(state.tickTimer);
    state.ducks.forEach(removeDuck);

    const best = getBest();
    if(state.score > best){
      setBest(state.score);
      bestEl.textContent = state.score;
      resultMsgEl.textContent = '와! 최고 기록 갱신! 🎉';
    } else {
      resultMsgEl.textContent = '수고했어요! 다시 도전해볼까요?';
    }
    finalScoreEl.textContent = state.score;
    endOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(); });
  restartBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(); });
})();
</script>
</body>
</html>
