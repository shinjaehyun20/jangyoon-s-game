<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>받침 낚시왕</title><style>:root{--deep:#082b54;--sea:#0a9fbe;--sun:#ffd45c;--coral:#ff667d}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:"Malgun Gothic",sans-serif;background:linear-gradient(#78d7ff 0 32%,#0a9fbe 32%,#064e78);color:white}.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px);color:#08345c}.hud{display:flex;justify-content:space-around;background:#06365fd9;border-radius:14px;padding:7px;font-weight:900}.sea{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:22px;background:linear-gradient(#22bfd4,#07547d);box-shadow:inset 0 0 30px #003e64}.wave{position:absolute;left:-10%;right:-10%;top:-10px;height:24px;background:#d9fbff99;border-radius:50%}.fish{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:210px;height:118px;border-radius:60% 46% 46% 60%;background:linear-gradient(150deg,#ffd45c,#ff9f43);box-shadow:0 14px 0 #00405c50;display:flex;align-items:center;justify-content:center;color:#10375b;font-size:34px;font-weight:1000;transition:.25s}.fish:after{content:"";position:absolute;right:-52px;border-top:42px solid transparent;border-bottom:42px solid transparent;border-right:0;border-left:65px solid #ff9f43}.fish:before{content:"●";position:absolute;left:28px;top:25px;font-size:18px}.fish.caught{transform:translate(-50%,-90%) rotate(-8deg) scale(1.08)}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);white-space:nowrap;background:#032f52c9;padding:7px 12px;border-radius:14px;font-weight:800}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.answer{min-height:54px;border:0;border-radius:16px;background:#fff;color:#123e60;font-size:25px;font-weight:1000;box-shadow:0 5px 0 #06466d}.answer:active{transform:translateY(4px);box-shadow:0 1px 0 #06466d}footer{display:flex;justify-content:space-between;align-items:center;font-size:12px}.home-link{color:white;min-height:44px;display:flex;align-items:center}.overlay{position:fixed;inset:0;background:#022341e8;display:flex;align-items:center;justify-content:center;padding:22px;z-index:5}.overlay.hidden{display:none}.card{width:min(390px,100%);background:linear-gradient(150deg,#0a628d,#073254);padding:24px;border-radius:24px;text-align:center;border:1px solid #ffffff35}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.65}.btn{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:16px;background:var(--sun);color:#173d5a;font-size:20px;font-weight:900}</style><!-- jangyoon-s-game catalog metadata -->

<meta property="og:description" content="🎣 받침 낚시왕 — 낱말을 소리 내어 읽고 알맞은 받침을 골라 물고기 10마리를 잡는 한글 놀이 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head><body><main class="wrap"><h1>🎣 받침 낚시왕</h1><div class="hud"><span>물고기 <b id="score">0</b>/10</span><span>연속 <b id="combo">0</b></span><span>별 <b id="stars">0</b></span></div><section class="sea" id="gameArea"><div class="wave"></div><div class="fish" id="fish"><span id="word">고□</span></div><div class="hint" id="hint">알맞은 받침을 골라요!</div></section><div class="answers" id="answers"></div><footer><small>소리 내어 읽고 받침을 골라요.</small><a class="home-link" href="../index.html">← 홈으로</a></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🎣 받침 낚시왕</h2><p>물고기 배의 빈칸에 들어갈 받침을 골라요.<br>10마리를 잡으면 오늘의 낚시 끝!</p><button class="btn" id="startBtn">낚시 시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🐳 대단한 낚시!</h2><div style="font-size:52px;font-weight:900" id="finalScore">0</div><p id="resultMsg"></p><button class="btn" id="restartBtn">다시 낚시하기</button></div></div><script>(function(){'use strict';const CONFIG={rounds:10,key:'batchim-fishing_best'};const words=[['공','ㅇ','고'],['산','ㄴ','사'],['달','ㄹ','다'],['밤','ㅁ','바'],['집','ㅂ','지'],['꽃','ㅊ','꼬'],['책','ㄱ','채'],['옷','ㅅ','오'],['별','ㄹ','벼'],['눈','ㄴ','누'],['강','ㅇ','가'],['숲','ㅍ','수']];const consonants=['ㄱ','ㄴ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅊ','ㅍ'];let state={index:0,combo:0,stars:0,current:null,used:[]};const $=x=>document.getElementById(x);function pick(){let pool=words.filter(w=>!state.used.includes(w[0]));if(!pool.length){state.used=[];pool=words}state.current=pool[Math.floor(Math.random()*pool.length)];state.used.push(state.current[0]);$('word').textContent=state.current[2]+'□';const options=[state.current[1]];while(options.length<3){const c=consonants[Math.floor(Math.random()*consonants.length)];if(!options.includes(c))options.push(c)}options.sort(()=>Math.random()-.5);$('answers').replaceChildren();options.forEach(c=>{const b=document.createElement('button');b.className='answer';b.textContent=c;b.addEventListener('pointerdown',e=>{e.preventDefault();answer(c)});$('answers').appendChild(b)})}function paint(){$('score').textContent=state.index;$('combo').textContent=state.combo;$('stars').textContent=state.stars}function answer(c){if(!state.current)return;if(c===state.current[1]){state.combo++;state.stars+=1+Math.min(2,Math.floor(state.combo/3));state.index++;$('word').textContent=state.current[0];$('hint').textContent='잡았다! '+state.current[0]+' 🎉';$('fish').classList.add('caught');state.current=null;paint();setTimeout(()=>{if(state.index>=CONFIG.rounds)finish();else{$('fish').classList.remove('caught');$('hint').textContent='다음 물고기!';pick()}},520)}else{state.combo=0;$('hint').textContent='조금 아쉬워요. 다시 읽어 봐요!';paint()}}function start(){state={index:0,combo:0,stars:0,current:null,used:[]};$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');$('fish').classList.remove('caught');paint();pick()}function finish(){const best=Math.max(state.stars,Number(localStorage.getItem(CONFIG.key)||0));localStorage.setItem(CONFIG.key,best);$('finalScore').textContent=state.stars+'⭐';$('resultMsg').textContent='최고 기록 '+best+'별 · '+(state.stars>=15?'받침 박사예요!':'소리 내어 읽으면 더 쉬워요!');$('endOverlay').classList.remove('hidden')}$('startBtn').addEventListener('click',start);$('restartBtn').addEventListener('click',start)})();</script></body></html>
