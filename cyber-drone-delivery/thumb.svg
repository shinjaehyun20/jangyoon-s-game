<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="drone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="400" height="300" rx="16" fill="url(#sky-grad)"/>

  <!-- City Skyline Silhouette -->
  <path d="M20,240 L20,180 L60,180 L60,240 L90,240 L90,140 L150,140 L150,240 L180,240 L180,190 L240,190 L240,240 L280,240 L280,120 L350,120 L350,240 L380,240 L380,270 L20,270 Z" fill="#0b132b" fill-opacity="0.7"/>

  <!-- Wind Streams -->
  <path d="M 40,80 Q 120,60 200,90 T 360,70" fill="none" stroke="#48cae4" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.5"/>
  <path d="M 30,130 Q 110,110 190,140 T 350,120" fill="none" stroke="#48cae4" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.4"/>

  <!-- Landing Zone Helipad -->
  <rect x="270" y="210" width="90" height="16" rx="4" fill="#f72585" filter="url(#glow)"/>
  <circle cx="315" cy="218" r="6" fill="#ffffff"/>
  <text x="315" y="222" font-family="sans-serif" font-size="8" font-weight="bold" fill="#f72585" text-anchor="middle">H</text>

  <!-- Drone Body & Rotors -->
  <ellipse cx="150" cy="90" rx="22" ry="4" fill="#00f5d4" filter="url(#glow)"/>
  <ellipse cx="210" cy="90" rx="22" ry="4" fill="#00f5d4" filter="url(#glow)"/>
  <line x1="150" y1="94" x2="210" y2="94" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="94" x2="180" y2="110" stroke="#ffffff" stroke-width="3"/>
  <circle cx="180" cy="110" r="14" fill="url(#drone-grad)" filter="url(#glow)"/>
  <circle cx="180" cy="110" r="6" fill="#ffffff"/>

  <!-- Cargo Package -->
  <line x1="180" y1="124" x2="180" y2="136" stroke="#f5ee9e" stroke-width="2"/>
  <rect x="170" y="136" width="20" height="18" rx="3" fill="#f39c12" stroke="#d35400" stroke-width="1.5"/>
  <text x="180" y="149" font-size="10" text-anchor="middle" fill="#ffffff">📦</text>

  <!-- Title Badge -->
  <rect x="25" y="248" width="350" height="38" rx="10" fill="#0b132b" fill-opacity="0.9" stroke="#00f5d4" stroke-width="1.5"/>
  <text x="200" y="272" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#00f5d4" text-anchor="middle">🚁 사이버 드론 택배 비행사</text>
</svg>