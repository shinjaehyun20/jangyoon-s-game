<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🌟 제미니 별빛 스파크</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Noto Sans KR', sans-serif;
    background: #0f0c20;
    color: #fff;
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 12px 14px; gap: 10px;
    margin: 0 auto;
  }
  h1 {
    font-size: clamp(20px, 5vw, 26px);
    text-align: center;
    color: #ffd768;
    text-shadow: 0 0 16px rgba(255,215,104,0.6);
  }
  .hud {
    display: flex; justify-content: space-between;
    background: rgba(255,255,255,0.08);
    border-radius: 14px; padding: 10px 16px;
    font-size: 15px; font-weight: 700;
    backdrop-filter: blur(8px);
  }
  #gameCanvas {
    position: relative; flex: 1;
    border-radius: 20px; overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #201a40 0%, #110d24 60%, #080512 100%);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 20px rgba(120,90,255,0.2);
    touch-action: none; cursor: pointer;
  }
  .target-star {
    position: absolute; width: 60px; height: 60px;
    margin-left: -30px; margin-top: -30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; cursor: pointer;
    transition: transform 0.1s ease;
    animation: floatPulse 1.2s infinite ease-in-out alternate;
  }
  @keyframes floatPulse {
    0% { transform: scale(0.9) rotate(-6deg); }
    100% { transform: scale(1.1) rotate(6deg); }
  }
  .sparkle {
    position: absolute; pointer-events: none;
    font-size: 20px; animation: fadeUp 0.6s forwards ease-out;
  }
  @keyframes fadeUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-35px) scale(1.4); }
  }
  .overlay {
    position: absolute; inset: 0;
    background: rgba(10,8,22,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; border-radius: 20px; z-index: 10;
  }
  .btn-start {
    background: linear-gradient(135deg, #ffd768, #ff8c42);
    color: #1a0f00; font-size: 20px; font-weight: 800;
    padding: 14px 32px; border: none; border-radius: 30px;
    box-shadow: 0 6px 20px rgba(255,140,66,0.4);
    cursor: pointer; transition: transform 0.15s;
  }
  .btn-start:active { transform: scale(0.95); }
</style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🌟 제미니 별빛 스파크 — 밤하늘에 반짝이는 별과 마법 보석을 탭해 별빛 점수를 모으는 40초 터치 반응 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🌟 제미니 별빛 스파크 | 장윤이 게임 놀이터">
<meta property="og:description" content="🌟 제미니 별빛 스파크 — 밤하늘에 반짝이는 별과 마법 보석을 탭해 별빛 점수를 모으는 40초 터치 반응 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
<div class="wrap">
  <h1>🌟 제미니 별빛 스파크</h1>
  <div class="hud">
    <div>⏱️ 시간: <span id="time">40</span>s</div>
    <div>⭐ 별빛: <span id="score">0</span></div>
    <div>🏆 최고: <span id="best">0</span></div>
  </div>
  <div id="gameCanvas">
    <div id="overlay" class="overlay">
      <h2 style="color: #ffd768; font-size: 24px;">반짝이는 별빛을 모아봐요!</h2>
      <p style="color: #d1cbef; font-size: 15px; text-align: center; line-height: 1.5;">
        반짝이는 별과 마법 보석을 탭해서<br>40초 동안 최고의 별빛 점수를 기록하세요!
      </p>
      <button class="btn-start" onclick="startGame()">🚀 시작하기</button>
    </div>
  </div>
</div>

<script>
let score = 0, time = 40, timerId = null, spawnId = null;
let best = parseInt(localStorage.getItem('gemini_star_best') || '0');
document.getElementById('best').innerText = best;

const canvas = document.getElementById('gameCanvas');
const timeEl = document.getElementById('time');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');

// Web Audio API 효과음
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSparkleSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
  osc.frequency.exponentialRampToValueAtTime(1174.66, audioCtx.currentTime + 0.15); // D6
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

function startGame() {
  score = 0; time = 40;
  scoreEl.innerText = score;
  timeEl.innerText = time;
  overlay.style.display = 'none';

  // 기존 남아있는 타겟 소거
  document.querySelectorAll('.target-star').forEach(el => el.remove());

  timerId = setInterval(() => {
    time--;
    timeEl.innerText = time;
    if (time <= 0) endGame();
  }, 1000);

  spawnStar();
  spawnId = setInterval(spawnStar, 700);
}

function spawnStar() {
  if (time <= 0) return;
  const star = document.createElement('div');
  star.className = 'target-star';
  
  const stars = ['⭐', '🌟', '✨', '💎', '💫', '🌌'];
  const icon = stars[Math.floor(Math.random() * stars.length)];
  star.innerText = icon;

  const rect = canvas.getBoundingClientRect();
  const x = 40 + Math.random() * (rect.width - 80);
  const y = 40 + Math.random() * (rect.height - 80);

  star.style.left = x + 'px';
  star.style.top = y + 'px';

  star.onclick = (e) => {
    e.stopPropagation();
    score += (icon === '💎' || icon === '🌟') ? 20 : 10;
    scoreEl.innerText = score;
    playSparkleSound();
    createSparkle(x, y, icon === '💎' ? '+20 💎' : '+10 ⭐');
    star.remove();
  };

  canvas.appendChild(star);
  setTimeout(() => { if (star.parentNode) star.remove(); }, 1800);
}

function createSparkle(x, y, text) {
  const sp = document.createElement('div');
  sp.className = 'sparkle';
  sp.innerText = text;
  sp.style.left = (x - 10) + 'px';
  sp.style.top = (y - 10) + 'px';
  canvas.appendChild(sp);
  setTimeout(() => sp.remove(), 600);
}

function endGame() {
  clearInterval(timerId); clearInterval(spawnId);
  if (score > best) {
    best = score;
    localStorage.setItem('gemini_star_best', best);
    document.getElementById('best').innerText = best;
  }
  overlay.style.display = 'flex';
  overlay.querySelector('h2').innerText = '🎉 게임 완료!';
  overlay.querySelector('p').innerHTML = `모은 별빛 점수: <b style="color:#ffd768; font-size:20px;">${score}점</b><br>최고 별빛 기록: ${best}점`;
  overlay.querySelector('.btn-start').innerText = '🔄 다시 하기';
}
</script>
</body>
</html>
