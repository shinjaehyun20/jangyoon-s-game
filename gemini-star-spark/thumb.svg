<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3d2a68"/>
      <stop offset="100%" stop-color="#0f0c20"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <text x="60" y="70" font-size="52" text-anchor="middle" filter="url(#glow)">🌟</text>
  <text x="30" y="38" font-size="24">✨</text>
  <text x="90" y="95" font-size="22">💎</text>
</svg>
