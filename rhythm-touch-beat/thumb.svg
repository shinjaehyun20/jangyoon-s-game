<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="32" fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="60" cy="60" r="20" fill="#ec4899" opacity="0.8"/>
  <text x="60" y="68" font-size="28" text-anchor="middle" filter="url(#glow)">🎵</text>
  <text x="30" y="36" font-size="18">⚡</text>
  <text x="90" y="94" font-size="18">✨</text>
</svg>
