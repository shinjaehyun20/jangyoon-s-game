<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎵 리듬 터치 타임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    background: #0f051d;
    color: #fff;
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 10px 12px; gap: 8px;
    margin: 0 auto;
  }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.08); border-radius: 12px; padding: 6px 12px;
  }
  .btn-back {
    color: #c084fc; text-decoration: none; font-size: 14px; font-weight: 700;
    padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.05);
  }
  h1 { font-size: 18px; color: #f43f5e; text-shadow: 0 0 10px rgba(244,63,94,0.5); }
  .hud {
    display: flex; justify-content: space-between;
    background: rgba(255,255,255,0.06); border-radius: 12px; padding: 8px 14px;
    font-size: 14px; font-weight: 700;
  }
  .hud span { color: #f472b6; }
  .game-area {
    position: relative; flex: 1;
    border-radius: 16px; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #2e1065 0%, #1e1b4b 60%, #0f051d 100%);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(236,72,153,0.2);
    border: 2px solid rgba(236,72,153,0.3);
    touch-action: none; cursor: pointer;
  }
  .rhythm-node {
    position: absolute; width: 64px; height: 64px;
    margin-left: -32px; margin-top: -32px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; background: radial-gradient(circle, #f43f5e, #be123c);
    box-shadow: 0 0 15px rgba(244,63,94,0.6);
    border: 3px solid #fef08a; cursor: pointer;
    z-index: 5;
  }
  .approach-ring {
    position: absolute; border-radius: 50%;
    border: 3px solid #fef08a; pointer-events: none;
    box-shadow: 0 0 10px #fef08a;
    transform: translate(-50%, -50%);
    z-index: 4;
  }
  .judge-text {
    position: absolute; pointer-events: none; z-index: 10;
    font-size: 22px; font-weight: 900; text-shadow: 0 0 10px rgba(0,0,0,0.8);
    animation: judgePop 0.5s forwards ease-out;
  }
  @keyframes judgePop {
    0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
    100% { transform: translate(-50%, -100%) scale(1.3); opacity: 0; }
  }
  .combo-display {
    position: absolute; top: 12px; right: 14px; z-index: 6;
    font-size: 20px; font-weight: 900; color: #fef08a;
    text-shadow: 0 0 10px rgba(254,240,138,0.5);
  }
  .overlay {
    position: absolute; inset: 0; background: rgba(15,5,29,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 20; border-radius: 16px; text-align: center; padding: 20px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ec4899, #be123c);
    color: #fff; font-size: 18px; font-weight: 800;
    padding: 12px 28px; border: none; border-radius: 25px;
    box-shadow: 0 6px 18px rgba(236,72,153,0.4); cursor: pointer;
  }
  .btn-primary:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="../index.html" class="btn-back">◀ 전체 목록</a>
    <h1>🎵 리듬 터치 타임</h1>
    <div style="width: 60px;"></div>
  </div>
  <div class="hud">
    <div>⏱️ 시간: <span id="time">45</span>s</div>
    <div>🔥 콤보: <span id="combo">0</span></div>
    <div>⭐ 점수: <span id="score">0</span></div>
    <div>🏆 최고: <span id="best">0</span></div>
  </div>

  <div id="gameArea" class="game-area">
    <div id="comboDisplay" class="combo-display"></div>
    <div id="overlay" class="overlay">
      <h2 style="color: #f472b6; font-size: 24px;">🎵 리듬 터치 타임</h2>
      <p style="color: #cbd5e1; font-size: 14px; line-height: 1.6;">
        바깥쪽 노란 링이 딱 맞게 겹칠 때 타겟을 탭하세요!<br>45초 동안 신나는 리듬 콤보를 이어가봐요!
      </p>
      <button class="btn-primary" onclick="startGame()">🚀 게임 시작</button>
    </div>
  </div>
</div>

<script>
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let bestScore = parseInt(localStorage.getItem('rhythm_touch_beat_best') || '0');
  let timeLeft = 45;
  let timerId = null;
  let spawnIntervalId = null;
  let animFrameId = null;
  let nodes = [];
  let audioCtx = null;

  const notesScale = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];

  document.getElementById('best').textContent = bestScore;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playTone(freq, type = 'sine', duration = 0.15) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function startGame() {
    initAudio();
    document.getElementById('overlay').style.display = 'none';
    score = 0;
    combo = 0;
    maxCombo = 0;
    timeLeft = 45;
    document.getElementById('score').textContent = score;
    document.getElementById('combo').textContent = combo;
    document.getElementById('time').textContent = timeLeft;

    // Clear active nodes
    nodes.forEach(n => {
      if (n.nodeEl) n.nodeEl.remove();
      if (n.ringEl) n.ringEl.remove();
    });
    nodes = [];

    if (timerId) clearInterval(timerId);
    if (spawnIntervalId) clearInterval(spawnIntervalId);
    if (animFrameId) cancelAnimationFrame(animFrameId);

    timerId = setInterval(() => {
      timeLeft--;
      document.getElementById('time').textContent = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);

    spawnIntervalId = setInterval(spawnNode, 850);
    spawnNode();
    loop();
  }

  function spawnNode() {
    const area = document.getElementById('gameArea');
    const w = area.clientWidth;
    const h = area.clientHeight;
    if (w < 100 || h < 100) return;

    const x = 50 + Math.random() * (w - 100);
    const y = 50 + Math.random() * (h - 100);
    const scaleNote = notesScale[Math.floor(Math.random() * notesScale.length)];

    const nodeEl = document.createElement('div');
    nodeEl.className = 'rhythm-node';
    nodeEl.style.left = x + 'px';
    nodeEl.style.top = y + 'px';
    nodeEl.textContent = '🎵';

    const ringEl = document.createElement('div');
    ringEl.className = 'approach-ring';
    ringEl.style.left = x + 'px';
    ringEl.style.top = y + 'px';

    area.appendChild(ringEl);
    area.appendChild(nodeEl);

    const duration = 1200; // ms to reach perfect size
    const targetSize = 64;
    const startSize = 160;

    const nodeData = {
      x, y, scaleNote,
      nodeEl, ringEl,
      spawnTime: performance.now(),
      duration,
      targetSize,
      startSize,
      done: false
    };

    nodeEl.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      hitNode(nodeData);
    });

    nodes.push(nodeData);
  }

  function loop() {
    const now = performance.now();
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (n.done) continue;

      const elapsed = now - n.spawnTime;
      const progress = elapsed / n.duration;

      if (progress >= 1.2) {
        // Missed!
        n.done = true;
        showJudge(n.x, n.y, 'MISS', '#ef4444');
        combo = 0;
        document.getElementById('combo').textContent = combo;
        playTone(150, 'sawtooth', 0.15);
        removeNode(n);
        nodes.splice(i, 1);
      } else {
        const curSize = Math.max(n.targetSize, n.startSize - (n.startSize - n.targetSize) * progress);
        n.ringEl.style.width = curSize + 'px';
        n.ringEl.style.height = curSize + 'px';
      }
    }
    animFrameId = requestAnimationFrame(loop);
  }

  function hitNode(n) {
    if (n.done) return;
    n.done = true;

    const elapsed = performance.now() - n.spawnTime;
    const diff = Math.abs(elapsed - n.duration);

    let judge = 'MISS';
    let pts = 0;
    let color = '#ef4444';

    if (diff < 120) {
      judge = 'PERFECT!!';
      pts = 300;
      color = '#fef08a';
      combo++;
      playTone(n.scaleNote * 1.5, 'triangle', 0.2);
    } else if (diff < 220) {
      judge = 'GREAT!';
      pts = 150;
      color = '#38bdf8';
      combo++;
      playTone(n.scaleNote, 'sine', 0.15);
    } else if (diff < 350) {
      judge = 'GOOD';
      pts = 50;
      color = '#4ade80';
      combo++;
      playTone(n.scaleNote * 0.8, 'sine', 0.1);
    } else {
      combo = 0;
      playTone(150, 'sawtooth', 0.15);
    }

    if (combo > maxCombo) maxCombo = combo;
    score += pts + (combo * 10);
    document.getElementById('score').textContent = score;
    document.getElementById('combo').textContent = combo;

    showJudge(n.x, n.y, judge, color);
    removeNode(n);
    const idx = nodes.indexOf(n);
    if (idx !== -1) nodes.splice(idx, 1);
  }

  function removeNode(n) {
    if (n.nodeEl) n.nodeEl.remove();
    if (n.ringEl) n.ringEl.remove();
  }

  function showJudge(x, y, text, color) {
    const area = document.getElementById('gameArea');
    const el = document.createElement('div');
    el.className = 'judge-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    area.appendChild(el);
    setTimeout(() => el.remove(), 500);
  }

  function endGame() {
    clearInterval(timerId);
    clearInterval(spawnIntervalId);
    cancelAnimationFrame(animFrameId);

    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('rhythm_touch_beat_best', bestScore);
      document.getElementById('best').textContent = bestScore;
    }

    const overlay = document.getElementById('overlay');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2 style="color: #f472b6; font-size: 26px;">🎉 스테이지 완주!</h2>
      <p style="color: #cbd5e1; font-size: 16px;">
        최종 점수: <b style="color:#fef08a; font-size: 20px;">${score}점</b><br>
        최고 콤보: <b style="color:#f472b6;">${maxCombo} Combo</b><br>
        최고 기록: <b>${bestScore}점</b>
      </p>
      <button class="btn-primary" onclick="startGame()">🔄 다시 도전하기</button>
    `;
  }
</script>
</body>
</html>
