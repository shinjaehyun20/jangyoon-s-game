<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="icon" href="data:"><title>씨앗 새싹 달리기</title><style>
:root{--sky:#8ed7ff;--soil:#76502f;--leaf:#42c96b;--sun:#ffd85d;--text:#203047}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:linear-gradient(var(--sky),#e9fbff);color:var(--text)}.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud{display:flex;justify-content:space-around;padding:8px;border-radius:12px;background:#ffffff99;font-weight:900}.value{color:#0c8250}#gameArea{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}.message{height:22px;text-align:center;font-weight:900}.garden{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;background:linear-gradient(#8dd7ff 0 63%,#8c623f 63%);box-shadow:inset 0 0 0 3px #ffffff55}.cloud{position:absolute;top:8%;left:8%;font-size:46px;animation:float 3s ease-in-out infinite alternate}.sun{position:absolute;top:8%;right:9%;font-size:54px;animation:spin 8s linear infinite}.plant{position:absolute;left:50%;bottom:31%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:transform .3s}.plant .emoji{font-size:clamp(52px,18vw,92px);filter:drop-shadow(0 5px 3px #0002)}.plant.grow{animation:grow .35s}.track{position:absolute;left:8%;right:8%;bottom:8%;height:17px;border-radius:20px;background:#4c3528aa;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#73e28f,#ffe56f);transition:width .25s}.cue{position:absolute;top:32%;left:50%;transform:translateX(-50%);font-size:clamp(48px,17vw,80px);animation:pulse .7s infinite alternate}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control{border:0;border-radius:18px;min-height:64px;font-size:28px;font-weight:900;color:var(--text);box-shadow:inset 0 -5px #0002}.water{background:#83d8ff}.light{background:#ffe173}.control:active{transform:translateY(2px)}.mainbtn{border:0;border-radius:16px;min-height:56px;width:100%;font-size:20px;font-weight:900;color:#17462c;background:#7fe29a}footer{display:flex;justify-content:space-between;font-size:13px}.home-link{color:#173b58}.overlay{position:fixed;inset:0;z-index:5;background:#20465ddd;display:grid;place-items:center;padding:22px}.hidden{display:none}.card{width:min(390px,100%);padding:26px 20px;border-radius:24px;text-align:center;background:linear-gradient(150deg,#f4fff5,#c8f4d4);box-shadow:0 10px 30px #0006}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.55;margin-bottom:18px}.result{font-size:42px;color:#16874c;font-weight:900;margin:10px}@keyframes float{to{transform:translateX(25px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{to{transform:translateX(-50%) scale(1.13)}}@keyframes grow{50%{transform:translateX(-50%) scale(1.18)}}
</style><!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🌱 씨앗 새싹 달리기 — 표시된 물과 햇빛 버튼을 빠르게 골라 40초 동안 꽃을 피우는 새싹 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🌱 씨앗 새싹 달리기 | 장윤이 게임 놀이터">
<meta property="og:description" content="🌱 씨앗 새싹 달리기 — 표시된 물과 햇빛 버튼을 빠르게 골라 40초 동안 꽃을 피우는 새싹 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head><body><main class="wrap"><h1>🌱 씨앗 새싹 달리기</h1><div class="hud"><span>시간 <b class="value" id="time">40</b></span><span>꽃 <b class="value" id="flowers">0</b></span><span>최고 <b class="value" id="best">0</b></span></div><section id="gameArea"><p class="message" id="message">표시된 햇빛이나 물을 눌러요!</p><div class="garden"><div class="cloud">☁️</div><div class="sun">☀️</div><div class="cue" id="cue">💧</div><div class="plant" id="plant"><span class="emoji" id="plantEmoji">🫘</span></div><div class="track"><div class="bar" id="bar"></div></div></div><div class="controls"><button class="control water" data-action="water">💧 물 주기</button><button class="control light" data-action="sun">☀️ 햇빛 주기</button></div></section><footer><small>물과 햇빛을 번갈아 빠르게!</small><a class="home-link" href="../index.html">← 홈으로</a></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🌱 씨앗 새싹 달리기</h2><p>화면에 나온 💧 또는 ☀️ 버튼을 눌러요.<br>씨앗이 쑥쑥 자라 꽃이 피면 새 씨앗 출발!</p><button class="mainbtn" id="startBtn">새싹 출발!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🌼 정원 완성!</h2><div class="result" id="finalScore">0송이</div><p id="resultMsg"></p><button class="mainbtn" id="restartBtn">다시 키우기</button></div></div><script>
(()=>{'use strict';const CONFIG={seconds:40,steps:8,bestKey:'seed-sprout-race_best',stages:['🫘','🌱','🌿','☘️','🌷','🌻']};let state={},timer;const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll('.control')];$('best').textContent=localStorage.getItem(CONFIG.bestKey)||0;function nextCue(){state.need=Math.random()<.5?'water':'sun';$('cue').textContent=state.need==='water'?'💧':'☀️'}function render(){const ratio=state.step/CONFIG.steps;$('bar').style.width=(ratio*100)+'%';$('plantEmoji').textContent=CONFIG.stages[Math.min(CONFIG.stages.length-1,Math.floor(ratio*(CONFIG.stages.length-1)))];$('flowers').textContent=state.flowers}function act(action){if(!state.running)return;if(action!==state.need){state.step=Math.max(0,state.step-1);$('message').textContent='괜찮아! 표시를 다시 보고 눌러요 🙂';render();nextCue();return}state.step++;$('plant').classList.add('grow');setTimeout(()=>$('plant').classList.remove('grow'),360);$('message').textContent=action==='water'?'물을 쪼르르! 💦':'햇빛 반짝! ✨';if(state.step>=CONFIG.steps){state.flowers++;state.step=0;$('message').textContent='꽃이 피었어요! 새 씨앗 출발 🌼'}render();nextCue()}function tick(){state.time--;$('time').textContent=state.time;if(state.time<=0)finish()}function finish(){state.running=false;clearInterval(timer);const best=Math.max(Number(localStorage.getItem(CONFIG.bestKey)||0),state.flowers);localStorage.setItem(CONFIG.bestKey,best);$('best').textContent=best;$('finalScore').textContent=state.flowers+'송이';$('resultMsg').textContent=state.flowers>=4?'정원이 꽃으로 가득 찼어요!':'씨앗이 다음 햇빛을 기다리고 있어요!';$('endOverlay').classList.remove('hidden')}function start(){clearInterval(timer);state={running:true,time:CONFIG.seconds,step:0,flowers:0,need:'water'};$('time').textContent=CONFIG.seconds;$('flowers').textContent=0;$('message').textContent='표시된 햇빛이나 물을 눌러요!';$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');render();nextCue();timer=setInterval(tick,1000)}buttons.forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.action)}));$('startBtn').addEventListener('pointerdown',start);$('restartBtn').addEventListener('pointerdown',start)})();
</script></body></html>
