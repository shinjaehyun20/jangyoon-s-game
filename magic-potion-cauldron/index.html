<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ 마법 가마솥의 퐁당 물약 | 장윤이의 게임 놀이터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ui-layer {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 10;
      pointer-events: none;
    }
    .home-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #a855f7;
      color: #7e22ce;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3);
      transition: transform 0.15s;
    }
    .home-btn:active {
      transform: scale(0.95);
    }
    .score-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .score-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #fde047;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 900;
      color: #854d0e;
      box-shadow: 0 4px 12px rgba(253, 224, 71, 0.35);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lives-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #f43f5e;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 900;
      color: #e11d48;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }
    .game-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 24px;
    }
    .game-overlay h1 {
      font-size: 32px;
      color: #f8fafc;
      margin-bottom: 12px;
      text-shadow: 0 4px 12px rgba(168, 85, 247, 0.6);
    }
    .game-overlay p {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 24px;
      line-height: 1.6;
      max-width: 420px;
    }
    .start-btn {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none;
      color: #ffffff;
      padding: 16px 42px;
      border-radius: 36px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .start-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="ui-layer">
    <a href="../index.html" class="home-btn">🏠 홈으로</a>
    <div class="score-group">
      <div class="score-badge">✨ 점수: <span id="scoreVal">0</span></div>
      <div class="lives-badge">💜 <span id="livesVal">3</span></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="startOverlay" class="game-overlay">
    <h1>✨ 마법 가마솥의 퐁당 물약</h1>
    <p>하늘에서 떨어지는 별가루, 달빛 방울, 반짝 버섯 등 마법 재료를<br>가마솥을 좌우로 움직여 쏙 받아내세요!<br>마법 연기 폭탄(검은 연기)은 피해야 해요!</p>
    <button id="startBtn" class="start-btn">마법 만들기 시작! 🪄</button>
  </div>

  <div id="gameOverOverlay" class="game-overlay" style="display: none;">
    <h1 id="endTitle">물약 완성! 🌟</h1>
    <p id="endDesc">환상적인 오색 무지개 물약이 탄생했어요!</p>
    <button id="restartBtn" class="start-btn">다시 마법 만들기! 🔄</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let W = 0, H = 0;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio API
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', dur = 0.15, gain = 0.1) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gain, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function playCatchSound() {
      playTone(523.25, 'triangle', 0.1, 0.15); // C5
      setTimeout(() => playTone(659.25, 'sine', 0.15, 0.15), 50); // E5
      setTimeout(() => playTone(783.99, 'sine', 0.2, 0.12), 100); // G5
    }

    function playBombSound() {
      playTone(180, 'sawtooth', 0.25, 0.2);
      setTimeout(() => playTone(120, 'sawtooth', 0.3, 0.25), 80);
    }

    function playGameOverSound() {
      playTone(400, 'sine', 0.2, 0.15);
      setTimeout(() => playTone(350, 'sine', 0.2, 0.15), 150);
      setTimeout(() => playTone(300, 'sine', 0.3, 0.15), 300);
      setTimeout(() => playTone(220, 'sawtooth', 0.5, 0.2), 450);
    }

    // Game Variables
    let gameActive = false;
    let score = 0;
    let lives = 3;
    let spawnTimer = 0;
    let lastTime = 0;

    // Cauldron (Player)
    const cauldron = {
      x: W / 2,
      y: H - 90,
      width: 110,
      height: 70,
      targetX: W / 2,
      color: '#c084fc',
      bubblePhase: 0
    };

    const items = [];
    const particles = [];

    const ITEM_TYPES = [
      { name: 'star', char: '⭐', color: '#fbbf24', pts: 10, isBomb: false, speed: 2.2 },
      { name: 'moon', char: '🌙', color: '#67e8f9', pts: 15, isBomb: false, speed: 2.5 },
      { name: 'mushroom', char: '🍄', color: '#f43f5e', pts: 20, isBomb: false, speed: 2.8 },
      { name: 'crystal', char: '💎', color: '#a855f7', pts: 25, isBomb: false, speed: 3.0 },
      { name: 'clover', char: '🍀', color: '#4ade80', pts: 15, isBomb: false, speed: 2.4 },
      { name: 'bomb', char: '💀', color: '#64748b', pts: 0, isBomb: true, speed: 2.7 }
    ];

    function createExplosion(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 5 + 3,
          color,
          alpha: 1,
          life: 1
        });
      }
    }

    function spawnItem() {
      const typeIdx = Math.random() < 0.2 ? 5 : Math.floor(Math.random() * 5);
      const t = ITEM_TYPES[typeIdx];
      const margin = 50;
      items.push({
        x: Math.random() * (W - margin * 2) + margin,
        y: -30,
        radius: 24,
        type: t,
        vy: t.speed + Math.random() * 1.2 + (score / 150),
        angle: 0,
        vRot: (Math.random() - 0.5) * 0.08
      });
    }

    // Input handlers
    function handlePointer(clientX) {
      cauldron.targetX = Math.max(cauldron.width / 2, Math.min(W - cauldron.width / 2, clientX));
    }

    window.addEventListener('mousemove', (e) => {
      if (gameActive) handlePointer(e.clientX);
    });

    window.addEventListener('touchmove', (e) => {
      if (gameActive && e.touches.length > 0) {
        handlePointer(e.touches[0].clientX);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      if (e.key === 'ArrowLeft' || e.key === 'a') {
        cauldron.targetX = Math.max(cauldron.width / 2, cauldron.targetX - 45);
      } else if (e.key === 'ArrowRight' || e.key === 'd') {
        cauldron.targetX = Math.min(W - cauldron.width / 2, cauldron.targetX + 45);
      }
    });

    function startGame() {
      initAudio();
      score = 0;
      lives = 3;
      items.length = 0;
      particles.length = 0;
      scoreVal.textContent = score;
      livesVal.textContent = lives;
      cauldron.x = W / 2;
      cauldron.targetX = W / 2;
      cauldron.y = H - 90;
      spawnTimer = 0;
      gameActive = true;
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      lastTime = performance.now();
    }

    function endGame() {
      gameActive = false;
      playGameOverSound();
      document.getElementById('endTitle').textContent = `물약 완성! ✨`;
      document.getElementById('endDesc').innerHTML = `최종 점수: <strong>${score}점</strong><br>반짝이는 마법 물약이 완성되었습니다!`;
      gameOverOverlay.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Render loop
    function update(dt) {
      if (!gameActive) return;

      // Smooth cauldron move
      cauldron.x += (cauldron.targetX - cauldron.x) * 0.25;
      cauldron.bubblePhase += dt * 5;

      // Spawn
      spawnTimer += dt;
      const spawnInterval = Math.max(0.65, 1.4 - (score / 350));
      if (spawnTimer >= spawnInterval) {
        spawnItem();
        spawnTimer = 0;
      }

      // Update items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.vy * 60 * dt;
        item.angle += item.vRot;

        // Check collision with cauldron
        const cauldronTop = cauldron.y - cauldron.height / 2;
        const dx = Math.abs(item.x - cauldron.x);
        const dy = Math.abs(item.y - cauldronTop);

        if (dy < 24 && dx < cauldron.width / 2 + 10) {
          if (item.type.isBomb) {
            playBombSound();
            createExplosion(item.x, item.y, '#64748b', 24);
            lives--;
            livesVal.textContent = lives;
            if (lives <= 0) {
              endGame();
              return;
            }
          } else {
            playCatchSound();
            createExplosion(item.x, item.y, item.type.color, 18);
            score += item.type.pts;
            scoreVal.textContent = score;
          }
          items.splice(i, 1);
          continue;
        }

        // Missed bottom
        if (item.y > H + 40) {
          if (!item.type.isBomb) {
            // Slight penalty or just fall
          }
          items.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // gravity
        p.alpha -= dt * 1.5;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Starry background
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      for (let i = 0; i < 30; i++) {
        const sx = (i * 137.5) % W;
        const sy = (i * 243.1) % H;
        const r = ((i % 3) + 1) * 0.8;
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Draw cauldron
      const cx = cauldron.x;
      const cy = cauldron.y;
      const cw = cauldron.width;
      const ch = cauldron.height;

      // Glow behind cauldron
      const glowGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, cw);
      glowGrad.addColorStop(0, 'rgba(168, 85, 247, 0.4)');
      glowGrad.addColorStop(1, 'rgba(168, 85, 247, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, cw, 0, Math.PI * 2);
      ctx.fill();

      // Cauldron body
      ctx.save();
      ctx.fillStyle = '#1e1b4b';
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(cx, cy + 10, cw / 2, ch / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Rim
      ctx.fillStyle = '#312e81';
      ctx.beginPath();
      ctx.ellipse(cx, cy - ch / 4, cw / 2 + 6, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Magic liquid surface
      const liquidGrad = ctx.createLinearGradient(cx - cw / 2, cy, cx + cw / 2, cy);
      liquidGrad.addColorStop(0, '#ec4899');
      liquidGrad.addColorStop(0.5, '#8b5cf6');
      liquidGrad.addColorStop(1, '#06b6d4');
      ctx.fillStyle = liquidGrad;
      ctx.beginPath();
      ctx.ellipse(cx, cy - ch / 4 + 2, cw / 2 - 2, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Bubbles from liquid
      for (let b = 0; b < 4; b++) {
        const bx = cx - cw / 3 + b * (cw / 4.5) + Math.sin(cauldron.bubblePhase + b) * 4;
        const by = cy - ch / 4 - 6 - Math.abs(Math.sin(cauldron.bubblePhase * 1.5 + b)) * 14;
        ctx.fillStyle = 'rgba(236, 72, 153, 0.8)';
        ctx.beginPath();
        ctx.arc(bx, by, 4 + (b % 3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Draw items
      for (const item of items) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.angle);
        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = item.type.color;
        ctx.shadowBlur = 12;
        ctx.fillText(item.type.char, 0, 0);
        ctx.restore();
      }

      // Draw particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame((now) => {
      lastTime = now;
      gameLoop(now);
    });
  </script>
</body>
</html>
