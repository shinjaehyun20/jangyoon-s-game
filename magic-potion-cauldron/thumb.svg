<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="60" cy="50" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="120" cy="80" r="2" fill="#67e8f9" opacity="0.7"/>
  <circle cx="340" cy="60" r="3.5" fill="#f43f5e" opacity="0.9"/>
  <circle cx="290" cy="90" r="2" fill="#fbbf24" opacity="0.7"/>
  <!-- Magic Cauldron -->
  <ellipse cx="200" cy="200" rx="90" ry="50" fill="#1e1b4b" stroke="#a855f7" stroke-width="6"/>
  <ellipse cx="200" cy="165" rx="96" ry="20" fill="#312e81" stroke="#c084fc" stroke-width="5"/>
  <!-- Glowing Liquid -->
  <ellipse cx="200" cy="165" rx="86" ry="14" fill="url(#liquid)" filter="url(#glow)"/>
  <!-- Bubbles -->
  <circle cx="170" cy="140" r="9" fill="#ec4899" opacity="0.8" filter="url(#glow)"/>
  <circle cx="210" cy="130" r="12" fill="#8b5cf6" opacity="0.8" filter="url(#glow)"/>
  <circle cx="235" cy="145" r="7" fill="#06b6d4" opacity="0.8" filter="url(#glow)"/>
  <!-- Falling Ingredients -->
  <text x="130" y="90" font-size="34" text-anchor="middle">⭐</text>
  <text x="270" y="85" font-size="32" text-anchor="middle">🌙</text>
  <text x="200" y="65" font-size="34" text-anchor="middle">🍄</text>
  <!-- Title text -->
  <text x="200" y="265" font-family="'Pretendard', sans-serif" font-weight="900" font-size="20" fill="#f8fafc" text-anchor="middle" filter="url(#glow)">✨ 마법 가마솥의 퐁당 물약</text>
</svg>
