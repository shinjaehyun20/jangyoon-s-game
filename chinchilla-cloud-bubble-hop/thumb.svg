<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="50%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="chinchillaFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="chinchillaBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="bubbleRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Pastel Cloud Sky Background -->
  <rect width="200" height="200" rx="24" fill="url(#cloudSky)"/>

  <!-- Fluffy Floating Background Clouds -->
  <path d="M 20 50 Q 30 35 50 40 Q 70 30 85 45 Q 100 40 105 55 L 15 55 Z" fill="#FFFFFF" opacity="0.6"/>
  <path d="M 120 70 Q 135 55 155 60 Q 175 50 185 65 Q 195 60 200 75 L 115 75 Z" fill="#FFFFFF" opacity="0.5"/>

  <!-- Giant Rainbow Cloud Bubbles -->
  <!-- Bottom Left Bubble -->
  <circle cx="45" cy="165" r="32" fill="url(#bubbleRainbow)" opacity="0.45"/>
  <ellipse cx="38" cy="152" rx="10" ry="5" fill="#FFFFFF" opacity="0.6" transform="rotate(-30, 38, 152)"/>

  <!-- Bottom Right Bubble -->
  <circle cx="160" cy="155" r="28" fill="url(#bubbleRainbow)" opacity="0.45"/>
  <ellipse cx="152" cy="144" rx="8" ry="4" fill="#FFFFFF" opacity="0.6" transform="rotate(-30, 152, 144)"/>

  <!-- Center Main Bounce Cloud Bubble -->
  <circle cx="100" cy="158" r="42" fill="url(#bubbleRainbow)" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="100" cy="158" r="40" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="86" cy="138" rx="14" ry="7" fill="#FFFFFF" opacity="0.8" transform="rotate(-30, 86, 138)"/>
  <circle cx="120" cy="170" r="4" fill="#FFFFFF" opacity="0.6"/>

  <!-- Tiny floating shiny bubbles -->
  <circle cx="30" cy="95" r="10" fill="url(#bubbleRainbow)" opacity="0.6"/>
  <ellipse cx="27" cy="91" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="175" cy="105" r="12" fill="url(#bubbleRainbow)" opacity="0.6"/>
  <ellipse cx="171" cy="100" rx="3.5" ry="2" fill="#FFFFFF" opacity="0.8"/>

  <!-- Cute Chinchilla Character bouncing on bubble -->
  <g transform="translate(100, 92)">
    <!-- Round Fluffy Chinchilla Ears -->
    <!-- Left Ear -->
    <ellipse cx="-18" cy="-24" rx="11" ry="14" fill="url(#chinchillaFur)" transform="rotate(-15, -18, -24)"/>
    <ellipse cx="-18" cy="-24" rx="6" ry="9" fill="#FBCFE8" transform="rotate(-15, -18, -24)"/>

    <!-- Right Ear -->
    <ellipse cx="18" cy="-24" rx="11" ry="14" fill="url(#chinchillaFur)" transform="rotate(15, 18, -24)"/>
    <ellipse cx="18" cy="-24" rx="6" ry="9" fill="#FBCFE8" transform="rotate(15, 18, -24)"/>

    <!-- Big Round Fluffy Chinchilla Body -->
    <circle cx="0" cy="10" r="28" fill="url(#chinchillaFur)"/>
    <!-- Round White Belly -->
    <ellipse cx="0" cy="15" rx="18" ry="18" fill="url(#chinchillaBelly)"/>

    <!-- Big Chubby Head -->
    <circle cx="0" cy="-6" r="23" fill="url(#chinchillaFur)"/>
    <ellipse cx="0" cy="-2" rx="16" ry="12" fill="url(#chinchillaBelly)"/>

    <!-- Cute Big Dark Eyes -->
    <circle cx="-9" cy="-8" r="4.2" fill="#1E293B"/>
    <circle cx="-7.5" cy="-9.5" r="1.6" fill="#FFFFFF"/>
    <circle cx="9" cy="-8" r="4.2" fill="#1E293B"/>
    <circle cx="10.5" cy="-9.5" r="1.6" fill="#FFFFFF"/>

    <!-- Tiny Pink Nose & Whiskers -->
    <ellipse cx="0" cy="-2.5" rx="2" ry="1.4" fill="#F472B6"/>
    <!-- Whiskers -->
    <line x1="-8" y1="-2" x2="-24" y2="-5" stroke="#64748B" stroke-width="1" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="-23" y2="3" stroke="#64748B" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="-2" x2="24" y2="-5" stroke="#64748B" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="23" y2="3" stroke="#64748B" stroke-width="1" stroke-linecap="round"/>

    <!-- Soft Rosy Cheeks -->
    <ellipse cx="-14" cy="-2" rx="3.5" ry="2" fill="#FDA4AF" opacity="0.6"/>
    <ellipse cx="14" cy="-2" rx="3.5" ry="2" fill="#FDA4AF" opacity="0.6"/>

    <!-- Tiny Paws folded cute on chest -->
    <ellipse cx="-6" cy="10" rx="3.5" ry="4.5" fill="#FFFFFF"/>
    <ellipse cx="6" cy="10" rx="3.5" ry="4.5" fill="#FFFFFF"/>

    <!-- Big Fluffy Curled Squirrel/Chinchilla Tail -->
    <path d="M 22 18 C 36 24 44 8 36 -4 C 28 -14 20 2 16 12 Z" fill="url(#chinchillaFur)"/>
  </g>

  <!-- Star jellies floating in sky -->
  <g transform="translate(100, 28)" filter="url(#softGlow)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#FDE047"/>
    <circle cx="0" cy="0" r="3" fill="#FFF"/>
  </g>
  <g transform="translate(48, 38)" filter="url(#softGlow)">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#F472B6"/>
  </g>
  <g transform="translate(155, 34)" filter="url(#softGlow)">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#38BDF8"/>
  </g>
</svg>
