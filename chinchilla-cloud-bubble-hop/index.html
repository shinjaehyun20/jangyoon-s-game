<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🫧 친칠라의 구름 방울 퐁퐁</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #E0E7FF 0%, #FDF4FF 50%, #FCE7F3 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #F8FAFC;
      box-shadow: 0 10px 40px rgba(165, 180, 252, 0.4);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      color: #475569;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }
    .header-btn {
      background: #EEF2F6;
      border: 1px solid #CBD5E1;
      color: #334155;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .hud {
      display: flex;
      gap: 12px;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      color: #334155;
    }
    .overlay.hidden {
      display: none;
    }
    .overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #6366F1;
      text-shadow: 0 2px 10px rgba(99, 102, 241, 0.2);
    }
    .overlay p {
      font-size: 15px;
      line-height: 1.6;
      color: #64748B;
      margin-bottom: 24px;
    }
    .guide-box {
      background: #F8FAFC;
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: left;
      border: 1px solid #E2E8F0;
    }
    .guide-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .btn-start {
      background: linear-gradient(135deg, #818CF8 0%, #6366F1 100%);
      color: #FFF;
      font-size: 18px;
      font-weight: bold;
      padding: 14px 36px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-start:active {
      transform: scale(0.96);
    }
    .score-display {
      font-size: 38px;
      font-weight: 800;
      color: #6366F1;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../index.html" class="header-btn">🏠 홈</a>
      <div class="hud">
        <div class="hud-item">🫧 <span id="score-text">0</span></div>
        <div class="hud-item">❤️ <span id="lives-text">3</span></div>
        <div class="hud-item">⏳ <span id="timer-text">45</span>s</div>
      </div>
    </header>

    <canvas id="gameCanvas"></canvas>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
      <div style="font-size: 64px; margin-bottom: 10px;">🫧🐭☁️</div>
      <h1>친칠라의 구름 방울 퐁퐁</h1>
      <p>보송보송 귀여운 친칠라와 함께 구름 방울을 터뜨려요!<br>두둥실 떠오르는 무지개 방울을 톡톡 터치하세요.</p>
      <div class="guide-box">
        <div class="guide-row">🫧 <strong>무지개 구름 방울</strong>: +10점 & 통통 퐁퐁!</div>
        <div class="guide-row">🍓 <strong>딸기 젤리 방울</strong>: +20점 보너스 획득</div>
        <div class="guide-row">🌟 <strong>황금 별빛 방울</strong>: +50점 슈퍼 점수</div>
        <div class="guide-row">⛈️ <strong>먹구름 방울</strong>: 앗! 피하세요, 하트가 줄어요</div>
      </div>
      <button class="btn-start" id="start-btn">퐁퐁 모험 시작! ✨</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="overlay hidden">
      <div style="font-size: 64px; margin-bottom: 10px;" id="result-emoji">🎉</div>
      <h1 id="result-title">구름 방울 놀이 완결!</h1>
      <div class="score-display" id="final-score">0점</div>
      <p id="result-msg">친칠라와 함께 하늘 가득 달콤한 방울을 터뜨렸어요!</p>
      <button class="btn-start" id="restart-btn">다시 퐁퐁! 🔄</button>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'bubble') {
        // Water drop / bubble pop
        const freqs = [600, 720, 840, 960, 1080];
        const f = freqs[Math.floor(Math.random() * freqs.length)];
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        osc.frequency.exponentialRampToValueAtTime(f * 2.2, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'jelly') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.18);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'star') {
        // Twinkle chime
        const freqs = [1046.50, 1318.51, 1567.98];
        freqs.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, now + idx * 0.06);
          g.gain.setValueAtTime(0.2, now + idx * 0.06);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.18);
          o.start(now + idx * 0.06);
          o.stop(now + idx * 0.06 + 0.18);
        });
      } else if (type === 'storm') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, now + idx * 0.1);
          g.gain.setValueAtTime(0.25, now + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
          o.start(now + idx * 0.1);
          o.stop(now + idx * 0.1 + 0.25);
        });
      }
    }

    // Canvas & Game Elements
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const livesText = document.getElementById('lives-text');
    const timerText = document.getElementById('timer-text');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScore = document.getElementById('final-score');
    const resultTitle = document.getElementById('result-title');
    const resultMsg = document.getElementById('result-msg');
    const resultEmoji = document.getElementById('result-emoji');

    let width = 0;
    let height = 0;
    let score = 0;
    let lives = 3;
    let timeLeft = 45;
    let isRunning = false;
    let lastTime = 0;
    let timerInterval = null;

    // Chinchilla character at bottom
    const chinchilla = {
      x: 0,
      y: 0,
      targetX: 0,
      hopY: 0,
      hopVel: 0,
      wiggle: 0
    };

    let bubbles = [];
    let particles = [];
    let backgroundClouds = [];
    let spawnTimer = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
      chinchilla.y = height - 85;
      if (chinchilla.x === 0) {
        chinchilla.x = width / 2;
        chinchilla.targetX = width / 2;
      }
      initBackgroundClouds();
    }
    window.addEventListener('resize', resize);

    function initBackgroundClouds() {
      backgroundClouds = [];
      for (let i = 0; i < 6; i++) {
        backgroundClouds.push({
          x: Math.random() * width,
          y: Math.random() * (height * 0.8),
          size: Math.random() * 50 + 60,
          speed: Math.random() * 15 + 10
        });
      }
    }

    function spawnBubble() {
      const types = [
        { type: 'bubble', char: '🫧', points: 10, speed: 65, radius: 28, prob: 0.55 },
        { type: 'jelly', char: '🍓', points: 20, speed: 75, radius: 26, prob: 0.22 },
        { type: 'star', char: '🌟', points: 50, speed: 90, radius: 30, prob: 0.08 },
        { type: 'storm', char: '⛈️', points: -1, speed: 70, radius: 28, prob: 0.15 }
      ];

      const r = Math.random();
      let cumulative = 0;
      let selected = types[0];
      for (const t of types) {
        cumulative += t.prob;
        if (r <= cumulative) {
          selected = t;
          break;
        }
      }

      bubbles.push({
        x: Math.random() * (width - 70) + 35,
        y: height + 40,
        speed: selected.speed + Math.random() * 20,
        type: selected.type,
        char: selected.char,
        points: selected.points,
        radius: selected.radius,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: Math.random() * 2 + 1.5
      });
    }

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 2,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    // Touch / Tap pop detection
    function handlePointerDown(e) {
      if (!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const clickY = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      chinchilla.targetX = clickX;
      chinchilla.hopVel = -8; // Cute little hop on tap

      // Check hit bubble
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const dist = Math.hypot(clickX - b.x, clickY - b.y);
        if (dist <= b.radius + 15) {
          popBubble(i);
          break;
        }
      }
    }
    canvas.addEventListener('pointerdown', handlePointerDown);

    function popBubble(index) {
      const b = bubbles[index];
      if (b.type === 'storm') {
        lives--;
        livesText.textContent = lives;
        playSound('storm');
        addParticles(b.x, b.y, '#64748B', 12);
        if (lives <= 0) {
          endGame(false);
          return;
        }
      } else {
        score += b.points;
        scoreText.textContent = score;
        playSound(b.type);
        const colorMap = { bubble: '#A5B4FC', jelly: '#FDA4AF', star: '#FDE047' };
        addParticles(b.x, b.y, colorMap[b.type] || '#A5B4FC', 10);
      }
      bubbles.splice(index, 1);
    }

    function drawChinchilla(x, y) {
      ctx.save();
      ctx.translate(x, y + chinchilla.hopY);

      chinchilla.wiggle += 0.05;
      const earWiggle = Math.sin(chinchilla.wiggle) * 0.08;

      // Big Fluffy Tail
      ctx.fillStyle = '#94A3B8';
      ctx.beginPath();
      ctx.ellipse(22, 14, 14, 20, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      // Big Round Ears
      ctx.fillStyle = '#94A3B8';
      ctx.beginPath();
      ctx.ellipse(-18, -20, 11, 14, -Math.PI / 8 + earWiggle, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FBCFE8';
      ctx.beginPath();
      ctx.ellipse(-18, -20, 6, 9, -Math.PI / 8 + earWiggle, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#94A3B8';
      ctx.beginPath();
      ctx.ellipse(18, -20, 11, 14, Math.PI / 8 - earWiggle, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FBCFE8';
      ctx.beginPath();
      ctx.ellipse(18, -20, 6, 9, Math.PI / 8 - earWiggle, 0, Math.PI * 2);
      ctx.fill();

      // Chubby Body
      ctx.fillStyle = '#94A3B8';
      ctx.beginPath();
      ctx.arc(0, 10, 26, 0, Math.PI * 2);
      ctx.fill();

      // White Belly
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(0, 14, 18, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Chubby Head
      ctx.fillStyle = '#94A3B8';
      ctx.beginPath();
      ctx.arc(0, -5, 22, 0, Math.PI * 2);
      ctx.fill();

      // White Cheeks
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cute Eyes
      ctx.fillStyle = '#1E293B';
      ctx.beginPath();
      ctx.arc(-8, -6, 4, 0, Math.PI * 2);
      ctx.arc(8, -6, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(-7, -7.5, 1.5, 0, Math.PI * 2);
      ctx.arc(9, -7.5, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Pink Nose & Whiskers
      ctx.fillStyle = '#F472B6';
      ctx.beginPath();
      ctx.ellipse(0, -1, 2, 1.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Whiskers
      ctx.strokeStyle = '#64748B';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-6, -1); ctx.lineTo(-20, -4);
      ctx.moveTo(-6, 1);  ctx.lineTo(-20, 3);
      ctx.moveTo(6, -1);  ctx.lineTo(20, -4);
      ctx.moveTo(6, 1);   ctx.lineTo(20, 3);
      ctx.stroke();

      // Rosy Cheeks
      ctx.fillStyle = 'rgba(253, 164, 175, 0.65)';
      ctx.beginPath();
      ctx.ellipse(-13, 0, 3.5, 2, 0, 0, Math.PI * 2);
      ctx.ellipse(13, 0, 3.5, 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Paws on Belly
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(-6, 10, 3.5, 0, Math.PI * 2);
      ctx.arc(6, 10, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function update(dt) {
      // Smooth player tracking
      chinchilla.x += (chinchilla.targetX - chinchilla.x) * 0.15;

      // Hop physics
      chinchilla.hopY += chinchilla.hopVel;
      chinchilla.hopVel += 0.5;
      if (chinchilla.hopY > 0) {
        chinchilla.hopY = 0;
        chinchilla.hopVel = 0;
      }

      // Background clouds
      for (const c of backgroundClouds) {
        c.x += c.speed * dt;
        if (c.x > width + c.size) c.x = -c.size;
      }

      // Spawn bubbles
      spawnTimer += dt;
      if (spawnTimer > 0.6) {
        spawnBubble();
        spawnTimer = 0;
      }

      // Update bubbles floating upwards
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.speed * dt;
        b.wobble += b.wobbleSpeed * dt;
        b.x += Math.sin(b.wobble) * 0.8;

        // Auto pop if touched by chinchilla head
        const dist = Math.hypot(chinchilla.x - b.x, (chinchilla.y + chinchilla.hopY - 20) - b.y);
        if (dist <= b.radius + 20) {
          popBubble(i);
          continue;
        }

        if (b.y < -50) {
          bubbles.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // 1. Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#E0E7FF');
      skyGrad.addColorStop(0.5, '#FDF4FF');
      skyGrad.addColorStop(1, '#FCE7F3');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // 2. Background Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      for (const c of backgroundClouds) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size * 0.4, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 0.3, c.y - c.size * 0.1, c.size * 0.35, 0, Math.PI * 2);
        ctx.arc(c.x - c.size * 0.3, c.y + c.size * 0.05, c.size * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 3. Draw Floating Bubbles
      for (const b of bubbles) {
        // Bubble bubble circle with shine
        const bubbleGrad = ctx.createRadialGradient(b.x - b.radius * 0.3, b.y - b.radius * 0.3, 2, b.x, b.y, b.radius);
        if (b.type === 'storm') {
          bubbleGrad.addColorStop(0, 'rgba(148, 163, 184, 0.85)');
          bubbleGrad.addColorStop(1, 'rgba(71, 85, 105, 0.85)');
        } else {
          bubbleGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
          bubbleGrad.addColorStop(0.5, 'rgba(199, 210, 254, 0.5)');
          bubbleGrad.addColorStop(1, 'rgba(244, 114, 182, 0.5)');
        }
        ctx.fillStyle = bubbleGrad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();

        // Shimmer highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.ellipse(b.x - b.radius * 0.4, b.y - b.radius * 0.4, b.radius * 0.25, b.radius * 0.12, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();

        // Icon inside bubble
        ctx.font = `${b.radius * 1.1}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.char, b.x, b.y);
      }

      // 4. Ground Cloud Bank
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(0, height - 35);
      for (let x = 0; x <= width; x += 40) {
        ctx.quadraticCurveTo(x + 20, height - 55, x + 40, height - 35);
      }
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.fill();

      // 5. Draw Chinchilla
      drawChinchilla(chinchilla.x, chinchilla.y);

      // 6. Draw Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function gameLoop(timestamp) {
      if (!isRunning) return;
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      score = 0;
      lives = 3;
      timeLeft = 45;
      bubbles = [];
      particles = [];
      scoreText.textContent = score;
      livesText.textContent = lives;
      timerText.textContent = timeLeft;

      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      isRunning = true;
      lastTime = performance.now();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isRunning) return;
        timeLeft--;
        timerText.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame(true);
        }
      }, 1000);

      requestAnimationFrame(gameLoop);
    }

    function endGame(isClear) {
      isRunning = false;
      clearInterval(timerInterval);

      if (isClear) {
        playSound('win');
        resultEmoji.textContent = '🫧🐭🎉';
        resultTitle.textContent = '구름 방울 놀이 완결!';
        resultMsg.textContent = `친칠라와 함께 하늘 가득 달콤한 방울을 터뜨렸어요!`;
      } else {
        resultEmoji.textContent = '🥺🌧️';
        resultTitle.textContent = '먹구름이 몰려왔어요!';
        resultMsg.textContent = `조금만 더 조심해서 다시 퐁퐁 뛰어봐요!`;
      }

      finalScore.textContent = `${score}점`;
      gameoverOverlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Initial setup
    resize();
    draw();
  </script>
</body>
</html>
