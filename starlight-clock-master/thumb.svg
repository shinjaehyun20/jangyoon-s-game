<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="clockGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="400" height="300" fill="url(#nightSky)"/>

  <!-- Constellation lines & stars -->
  <line x1="50" y1="50" x2="90" y2="80" stroke="#48cae4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="90" y1="80" x2="140" y2="60" stroke="#48cae4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="300" y1="40" x2="350" y2="70" stroke="#48cae4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <circle cx="50" cy="50" r="3" fill="#fff" filter="url(#glow)"/>
  <circle cx="90" cy="80" r="4" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="140" cy="60" r="3.5" fill="#fff" filter="url(#glow)"/>
  <circle cx="280" cy="90" r="3" fill="#ffd166"/>
  <circle cx="300" cy="40" r="4.5" fill="#fff" filter="url(#glow)"/>
  <circle cx="350" cy="70" r="3.5" fill="#ffd166"/>
  <circle cx="70" cy="180" r="2.5" fill="#fff"/>
  <circle cx="340" cy="220" r="3" fill="#fff"/>

  <!-- Crescent Moon -->
  <path d="M 330 35 A 25 25 0 1 0 355 60 A 20 20 0 1 1 330 35 Z" fill="#ffeaa7" filter="url(#glow)"/>

  <!-- Clock Outer Ring -->
  <circle cx="200" cy="155" r="95" fill="none" stroke="url(#clockGold)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="200" cy="155" r="88" fill="#ffffff" opacity="0.95"/>

  <!-- Hour ticks -->
  <g stroke="#3a506b" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="73" x2="200" y2="85"/>
    <line x1="200" y1="225" x2="200" y2="237"/>
    <line x1="118" y1="155" x2="130" y2="155"/>
    <line x1="270" y1="155" x2="282" y2="155"/>
  </g>

  <!-- Numerals (12, 3, 6, 9) -->
  <text x="200" y="98" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" fill="#1c2541" text-anchor="middle">12</text>
  <text x="263" y="160" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" fill="#1c2541" text-anchor="middle">3</text>
  <text x="200" y="222" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" fill="#1c2541" text-anchor="middle">6</text>
  <text x="137" y="160" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" fill="#1c2541" text-anchor="middle">9</text>

  <!-- Clock Hands (3:30 or 3:00) -->
  <!-- Hour hand pointing to 3 -->
  <line x1="200" y1="155" x2="238" y2="155" stroke="#e63946" stroke-width="6" stroke-linecap="round"/>
  <!-- Minute hand pointing to 12 -->
  <line x1="200" y1="155" x2="200" y2="105" stroke="#1d3557" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Center Cap -->
  <circle cx="200" cy="155" r="7" fill="#f77f00"/>

  <!-- Star Character Beside Clock -->
  <g transform="translate(65, 195) scale(0.7)">
    <polygon points="50,5 64,36 98,39 72,61 80,95 50,77 20,95 28,61 2,39 36,36" fill="#ffd166" stroke="#f77f00" stroke-width="3"/>
    <!-- Face -->
    <circle cx="42" cy="48" r="4" fill="#333"/>
    <circle cx="58" cy="48" r="4" fill="#333"/>
    <path d="M 44 58 Q 50 66 56 58" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="54" r="3.5" fill="#ff758f"/>
    <circle cx="64" cy="54" r="3.5" fill="#ff758f"/>
  </g>

  <!-- Badge banner -->
  <rect x="60" y="258" width="280" height="34" rx="17" fill="#f77f00" filter="url(#glow)"/>
  <text x="200" y="281" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">⭐ 별빛 시계 바늘 맞추기 #320</text>
</svg>
