<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e130c"/>
      <stop offset="50%" stop-color="#2c1a0e"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Underground Cave -->
  <rect width="400" height="300" rx="16" fill="url(#cave-grad)"/>

  <!-- Underground Dirt Blocks Grid -->
  <rect x="40" y="80" width="40" height="40" fill="#4a2810" stroke="#331b0b" stroke-width="2"/>
  <rect x="80" y="80" width="40" height="40" fill="#4a2810" stroke="#331b0b" stroke-width="2"/>
  <rect x="120" y="80" width="40" height="40" fill="#3d210c" stroke="#331b0b" stroke-width="2"/>
  <rect x="160" y="80" width="40" height="40" fill="#4a2810" stroke="#331b0b" stroke-width="2"/>
  <rect x="200" y="80" width="40" height="40" fill="#4a2810" stroke="#331b0b" stroke-width="2"/>
  
  <rect x="40" y="120" width="40" height="40" fill="#3d210c" stroke="#331b0b" stroke-width="2"/>
  <rect x="200" y="120" width="40" height="40" fill="#3d210c" stroke="#331b0b" stroke-width="2"/>
  <rect x="240" y="120" width="40" height="40" fill="#4a2810" stroke="#331b0b" stroke-width="2"/>

  <!-- Dug Out Path (Tunnel) -->
  <rect x="80" y="120" width="120" height="80" fill="#150a04"/>

  <!-- Glowing Ore Crystals -->
  <circle cx="60" cy="100" r="8" fill="#ffd700" filter="url(#glow)"/>
  <text x="60" y="104" font-size="10" text-anchor="middle">✨</text>
  
  <circle cx="260" cy="140" r="9" fill="#00ffff" filter="url(#glow)"/>
  <text x="260" y="144" font-size="10" text-anchor="middle">💎</text>
  
  <circle cx="100" cy="220" r="8" fill="#ff4d4d" filter="url(#glow)"/>
  <text x="100" y="224" font-size="10" text-anchor="middle">🔴</text>

  <!-- Miner Character with Pickaxe -->
  <circle cx="140" cy="150" r="16" fill="#fbc531"/>
  <!-- Helmet Light Cone -->
  <polygon points="145,145 230,120 230,175" fill="#feca57" fill-opacity="0.35"/>
  <rect x="130" y="138" width="20" height="8" rx="3" fill="#e1b12c"/>
  <circle cx="148" cy="142" r="4" fill="#ffffff" filter="url(#glow)"/>

  <!-- Pickaxe Swing -->
  <line x1="152" y1="152" x2="175" y2="135" stroke="#718093" stroke-width="4" stroke-linecap="round"/>
  <polygon points="170,128 185,132 178,142" fill="#dcdde1"/>

  <!-- Digging Sparkles -->
  <circle cx="190" cy="135" r="3" fill="#fbc531" filter="url(#glow)"/>
  <circle cx="185" cy="125" r="2" fill="#ffd700"/>

  <!-- Title Badge -->
  <rect x="25" y="248" width="350" height="38" rx="10" fill="#1e130c" fill-opacity="0.9" stroke="#fbc531" stroke-width="1.5"/>
  <text x="200" y="272" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#fbc531" text-anchor="middle">⛏️ 픽셀 던전 광산 탐험가</text>
</svg>