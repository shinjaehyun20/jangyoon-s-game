<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#3A506B"/>
    </linearGradient>
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="iceSlope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <filter id="auroraBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Night Arctic Sky -->
  <rect width="200" height="200" rx="24" fill="url(#auroraSky)"/>

  <!-- Stars -->
  <circle cx="25" cy="20" r="1.2" fill="#FEF08A" opacity="0.8"/>
  <circle cx="70" cy="35" r="1.5" fill="#FEF08A" opacity="0.9"/>
  <circle cx="120" cy="18" r="1" fill="#FEF08A" opacity="0.7"/>
  <circle cx="175" cy="30" r="1.4" fill="#FEF08A" opacity="0.85"/>
  <circle cx="185" cy="65" r="1" fill="#FEF08A" opacity="0.6"/>

  <!-- Dancing Aurora Waves -->
  <path d="M 0 45 Q 50 15 100 40 T 200 25 L 200 65 Q 150 40 100 70 T 0 50 Z" fill="url(#auroraGlow)" filter="url(#auroraBlur)" opacity="0.75"/>
  <path d="M 0 65 Q 60 40 120 60 T 200 45 L 200 80 Q 140 60 80 85 T 0 70 Z" fill="url(#auroraGlow)" filter="url(#auroraBlur)" opacity="0.5"/>

  <!-- Ice Glaciers Background -->
  <polygon points="10,130 50,85 90,130" fill="#38BDF8" opacity="0.4"/>
  <polygon points="40,130 50,85 70,130" fill="#BAE6FD" opacity="0.6"/>

  <polygon points="130,130 165,75 200,130" fill="#38BDF8" opacity="0.4"/>
  <polygon points="150,130 165,75 185,130" fill="#BAE6FD" opacity="0.6"/>

  <!-- Curving Ice Slide Ramp -->
  <path d="M -10 135 Q 80 120 120 155 Q 150 180 210 185 L 210 210 L -10 210 Z" fill="url(#iceSlope)"/>
  <path d="M -10 135 Q 80 120 120 155 Q 150 180 210 185" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Shiny Fish Jelly floating -->
  <g transform="translate(160, 140) scale(0.9)">
    <ellipse cx="0" cy="0" rx="9" ry="5.5" fill="#F43F5E"/>
    <polygon points="-8,0 -14,-5 -14,5" fill="#F43F5E"/>
    <circle cx="4" cy="-1.5" r="1.5" fill="#FFF"/>
    <circle cx="5" cy="-1.5" r="0.8" fill="#881337"/>
  </g>

  <!-- Golden Star Gem -->
  <g transform="translate(45, 115) scale(0.8)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#FDE047"/>
    <circle cx="0" cy="0" r="3" fill="#FFF" opacity="0.8"/>
  </g>

  <!-- Baby Polar Bear sliding -->
  <g transform="translate(100, 138) rotate(15)">
    <!-- Fluffy Round Body -->
    <ellipse cx="0" cy="0" rx="22" ry="17" fill="#F8FAFC"/>
    <ellipse cx="0" cy="3" rx="18" ry="13" fill="#E2E8F0" opacity="0.5"/>

    <!-- Tiny Tail -->
    <circle cx="-20" cy="-2" r="5" fill="#F8FAFC"/>

    <!-- Sliding Back Paws -->
    <ellipse cx="-12" cy="14" rx="6" ry="4" fill="#E2E8F0" transform="rotate(-10, -12, 14)"/>
    <ellipse cx="12" cy="14" rx="6" ry="4" fill="#E2E8F0" transform="rotate(10, 12, 14)"/>
    <!-- Paw pads -->
    <circle cx="-12" cy="14" r="2" fill="#94A3B8"/>
    <circle cx="12" cy="14" r="2" fill="#94A3B8"/>

    <!-- Head -->
    <ellipse cx="16" cy="-10" rx="14" ry="13" fill="#FFFFFF"/>

    <!-- Ears -->
    <circle cx="12" cy="-22" r="4.5" fill="#FFFFFF"/>
    <circle cx="12" cy="-22" r="2.5" fill="#FDA4AF"/>
    <circle cx="22" cy="-21" r="4.5" fill="#FFFFFF"/>
    <circle cx="22" cy="-21" r="2.5" fill="#FDA4AF"/>

    <!-- Muzzle -->
    <ellipse cx="23" cy="-7" rx="6.5" ry="5.5" fill="#F1F5F9"/>

    <!-- Nose -->
    <ellipse cx="27" cy="-9" rx="2.5" ry="2" fill="#0F172A"/>

    <!-- Eye (Happy squinting smile) -->
    <path d="M 17 -12 Q 20 -15 23 -12" stroke="#0F172A" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="19" cy="-6" rx="3.5" ry="2" fill="#FB7185" opacity="0.6"/>

    <!-- Cozy Winter Scarf -->
    <path d="M 6 -4 Q 14 0 20 -6 L 22 -3 Q 14 4 5 -1 Z" fill="#EF4444"/>
    <rect x="4" y="-3" width="5" height="12" rx="2" fill="#EF4444" transform="rotate(20, 4, -3)"/>
    <!-- Scarf stripes -->
    <line x1="4" y1="2" x2="9" y2="2" stroke="#FEF08A" stroke-width="1.5"/>
  </g>
</svg>
