<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>숨결 비눗방울</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:Arial,'Apple SD Gothic Neo',sans-serif;background:#142344;color:#fff}.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:10px 12px 8px;gap:8px}.title{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud{display:flex;justify-content:space-around;background:#ffffff18;padding:8px;border-radius:12px;font-weight:800}.sky{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:22px;background:radial-gradient(circle at 50% 20%,#b4f1ff,#5e8ce6 56%,#273a78)}.target{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);border:7px dashed #fff9;border-radius:50%;width:160px;height:160px}.bubble{position:absolute;left:50%;top:48%;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 6%,#ffffff33 12%,#87fff066 55%,#e3a4ff88);border:3px solid #fff9;box-shadow:inset -10px -12px 20px #6b4bc744,0 0 25px #fff8;transition:width .04s,height .04s}.bubble.pop{animation:fly .75s ease-out forwards}@keyframes fly{to{top:3%;opacity:0;transform:translate(-50%,-50%) scale(1.35)}}.hint{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);background:#fff;color:#173058;padding:8px 13px;border-radius:16px;font-weight:900;white-space:nowrap}.hold{min-height:58px;border:0;border-radius:18px;background:#ffcf5c;color:#563a00;font-size:22px;font-weight:900;box-shadow:0 6px 0 #bc7f1a;touch-action:none}.hold.pressed{transform:translateY(4px);box-shadow:0 2px 0 #bc7f1a}footer{display:flex;justify-content:space-between;font-size:12px}.home{color:#c6f6ff}.overlay{position:fixed;inset:0;background:#08122ddd;display:grid;place-items:center;padding:24px;z-index:5}.overlay.hidden{display:none}.card{max-width:360px;text-align:center;background:white;color:#15305a;padding:24px;border-radius:24px}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.6}.start{margin-top:18px;min-height:50px;width:100%;border:0;border-radius:14px;background:#7de6d1;font-size:20px;font-weight:900}
</style></head><body><div class="wrap"><h1 class="title">🫧 숨결 비눗방울</h1><div class="hud"><span>라운드 <b id="round">1</b>/8</span><span>점수 <b id="score">0</b></span><span>최고 <b id="best">0</b></span></div><main class="sky"><div class="target" id="target"></div><div class="bubble" id="bubble"></div><div class="hint" id="hint">버튼을 꾹 눌러요</div></main><button class="hold" id="hold">꾹 누르고 목표 크기에서 떼기</button><footer><small>천천히 크게, 정확하게!</small><a class="home" href="../index.html">← 홈으로</a></footer></div><div class="overlay" id="startOverlay"><div class="card"><h2>🫧 비눗방울 호흡</h2><p>버튼을 누르면 방울이 커져요.<br>점선 원과 비슷해질 때 손을 떼세요!</p><button class="start" id="startBtn">시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🌈 방울 여행 끝!</h2><p>점수 <b id="finalScore">0</b>점</p><button class="start" id="restartBtn">다시 하기</button></div></div><script>
(function(){'use strict';const C={key:'breath-bubble_best',max:210,min:28,rounds:8};let s={run:false,round:1,score:0,size:C.min,grow:false,target:150,raf:0};const $=q=>document.querySelector(q);function render(){round.textContent=s.round;score.textContent=s.score;best.textContent=localStorage.getItem(C.key)||0;bubble.style.width=bubble.style.height=s.size+'px';target.style.width=target.style.height=s.target+'px'}function next(){s.size=C.min;s.target=100+Math.floor(Math.random()*91);s.grow=false;bubble.classList.remove('pop');hint.textContent='버튼을 꾹 눌러요';render()}function loop(){if(!s.run)return;if(s.grow){s.size=Math.min(C.max,s.size+1.9);render();if(s.size>=C.max)release()}s.raf=requestAnimationFrame(loop)}function press(e){if(!s.run||s.grow)return;e.preventDefault();s.grow=true;hold.classList.add('pressed');hint.textContent='점선 원을 잘 봐요!';try{hold.setPointerCapture(e.pointerId)}catch(_){}}function release(){if(!s.run||!s.grow)return;s.grow=false;hold.classList.remove('pressed');const diff=Math.abs(s.size-s.target);const gain=diff<10?100:diff<25?60:diff<45?30:10;s.score+=gain;hint.textContent=gain===100?'완벽해요! +100':gain>=60?'아주 좋아요! +60':gain>=30?'조금만 더! +30':'다시 천천히! +10';bubble.classList.add('pop');setTimeout(()=>{if(s.round>=C.rounds)finish();else{s.round++;next()}},800)}function start(){cancelAnimationFrame(s.raf);s={run:true,round:1,score:0,size:C.min,grow:false,target:150,raf:0};startOverlay.classList.add('hidden');endOverlay.classList.add('hidden');next();loop()}function finish(){s.run=false;cancelAnimationFrame(s.raf);const b=Math.max(s.score,+localStorage.getItem(C.key)||0);localStorage.setItem(C.key,b);finalScore.textContent=s.score;endOverlay.classList.remove('hidden');render()}hold.addEventListener('pointerdown',press);hold.addEventListener('pointerup',release);hold.addEventListener('pointercancel',release);startBtn.onclick=start;restartBtn.onclick=start;render()})();
</script></body></html>
