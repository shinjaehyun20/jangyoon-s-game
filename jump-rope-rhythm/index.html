<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>줄넘기 놀이</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  :root {
    --bg: #1976d2;
    --bg2: #0d47a1;
    --accent: #ffeb3b;
    --rope1: #e53935;
    --rope2: #ffffff;
    --text: #ffffff;
  }
  body {
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 10px 12px 8px; gap: 8px;
    margin: 0 auto;
  }
  h1 {
    font-size: clamp(20px, 5.5vw, 28px);
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .hud {
    display: flex; flex-direction: row; align-items: center; justify-content: space-around;
    background: rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 14px;
    font-weight: 700;
  }
  .hud span.value { color: var(--accent); font-size: 16px; margin-left: 4px; }

  #gameArea {
    flex: 1;
    position: relative;
    display: flex; flex-direction: column;
    min-height: 0;
    gap: 6px;
  }

  .msg-line {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    min-height: 22px;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
  }

  .sky {
    position: relative;
    flex: 1;
    min-height: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 60%, rgba(0,60,20,.25) 100%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
  }
  .sun {
    position: absolute; top: 6%; left: 8%;
    font-size: 34px;
    opacity: .9;
    filter: drop-shadow(0 0 10px rgba(255,235,59,.5));
  }
  .cloud {
    position: absolute;
    font-size: 26px;
    opacity: .85;
  }
  .cloud.c1 { top: 10%; right: 12%; }
  .cloud.c2 { top: 22%; right: 30%; font-size: 20px; opacity: .6; }

  .feet-zone {
    position: absolute;
    left: 10%; right: 10%;
    top: 66%; height: 16%;
    border: 3px dashed rgba(255,255,255,.45);
    border-radius: 14px;
    box-sizing: border-box;
    transition: box-shadow .15s, border-color .15s, background .15s;
  }
  .feet-zone.active {
    border-color: var(--accent);
    background: rgba(255,235,59,.12);
    box-shadow: 0 0 20px 4px rgba(255,235,59,.65);
  }

  .rope-bar {
    position: absolute;
    left: 6%; right: 6%;
    height: 10px;
    top: 10%;
    border-radius: 6px;
    background: repeating-linear-gradient(90deg, var(--rope1) 0 14px, var(--rope2) 14px 28px);
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
    transition: top .03s linear;
  }

  .character {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    font-size: 46px;
    transition: transform .12s;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.35));
  }
  .character.jumping { transform: translateX(-50%) translateY(-34px) scale(1.06); }
  .character.stumble { animation: stumbleAnim .42s ease; }
  @keyframes stumbleAnim {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    30% { transform: translateX(-50%) rotate(-14deg); }
    60% { transform: translateX(-50%) rotate(11deg); }
  }

  footer {
    display: flex; flex-direction: row; justify-content: space-between; align-items: center;
    font-size: 12px;
  }
  .home-link { color: var(--accent); text-decoration: none; min-height: 44px; display: flex; align-items: center; }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay-card {
    background: linear-gradient(160deg, #1e63b8, #0d3a7a);
    border-radius: 18px;
    padding: 26px 22px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,235,59,.4);
  }
  .overlay-card h2 { font-size: 22px; margin-bottom: 10px; }
  .overlay-card p { font-size: 14px; line-height: 1.5; margin-bottom: 16px; opacity: .9; }
  .result-score { font-size: 40px; font-weight: 900; color: var(--accent); margin-bottom: 6px; }
  .btn-start {
    min-height: 44px;
    padding: 10px 26px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #3a2e00;
    cursor: pointer;
  }
</style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🪢 줄넘기 놀이 — 돌아가는 줄이 발밑에 올 때 딱 맞춰 탭! 콤보를 쌓는 리듬 타이밍 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🪢 줄넘기 놀이 | 장윤이 게임 놀이터">
<meta property="og:description" content="🪢 줄넘기 놀이 — 돌아가는 줄이 발밑에 올 때 딱 맞춰 탭! 콤보를 쌓는 리듬 타이밍 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
  <div class="wrap">
    <h1>🪢 줄넘기 놀이</h1>

    <div class="hud">
      <div>목숨 <span class="value" id="lifeLabel">3</span></div>
      <div>콤보 <span class="value" id="comboLabel">0</span></div>
      <div>최고 <span class="value" id="bestLabel">0</span></div>
    </div>

    <div id="gameArea">
      <div class="msg-line" id="msgLine">줄이 발밑에 올 때 딱 맞춰 탭!</div>

      <div class="sky">
        <div class="sun">☀️</div>
        <div class="cloud c1">☁️</div>
        <div class="cloud c2">☁️</div>
        <div class="rope-bar" id="ropeBar"></div>
        <div class="feet-zone" id="feetZone"></div>
        <div class="character" id="character">🧒</div>
      </div>
    </div>

    <footer>
      <small>줄이 발밑 노란 구역에 닿을 때 화면을 톡!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🪢 줄넘기 놀이</h2>
      <p>줄이 빙글빙글 돌다가 발밑(노란 구역)에 닿는 순간<br>화면을 탭해서 폴짝 뛰어넘어요!<br>성공할수록 줄이 점점 빨라져요. 3번 놓치면 종료!</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>
  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 게임 종료!</h2>
      <div class="result-score" id="finalScore">0</div>
      <p id="resultMsg"></p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    const CONFIG = {
      PERIOD_START: 1500,
      PERIOD_MIN: 750,
      PERIOD_STEP: 90,
      HITS_PER_STEP: 5,
      ZONE_LOW: 0.82,
      RESET_LOW: 0.3,
      LIVES: 3,
      BEST_KEY: 'jump-rope-rhythm_best'
    };

    const els = {
      life: document.getElementById('lifeLabel'),
      combo: document.getElementById('comboLabel'),
      best: document.getElementById('bestLabel'),
      msg: document.getElementById('msgLine'),
      ropeBar: document.getElementById('ropeBar'),
      feetZone: document.getElementById('feetZone'),
      character: document.getElementById('character'),
      gameArea: document.getElementById('gameArea'),
      startOverlay: document.getElementById('startOverlay'),
      endOverlay: document.getElementById('endOverlay'),
      startBtn: document.getElementById('startBtn'),
      restartBtn: document.getElementById('restartBtn'),
      finalScore: document.getElementById('finalScore'),
      resultMsg: document.getElementById('resultMsg')
    };

    const state = {
      running: false,
      period: CONFIG.PERIOD_START,
      startTime: 0,
      life: CONFIG.LIVES,
      combo: 0,
      phase: 'ARMED',
      wasInZone: false
    };

    function getBest() {
      return parseInt(localStorage.getItem(CONFIG.BEST_KEY) || '0', 10);
    }
    function setBest(v) {
      if (v > getBest()) localStorage.setItem(CONFIG.BEST_KEY, String(v));
    }

    function updateHUD() {
      els.life.textContent = state.life;
      els.combo.textContent = state.combo;
      els.best.textContent = getBest();
    }

    function ropeYAt(t) {
      const elapsed = ((t - state.startTime) % state.period + state.period) % state.period;
      const angle = (elapsed / state.period) * Math.PI * 2;
      return (1 - Math.cos(angle)) / 2;
    }

    function resetGameState() {
      state.running = true;
      state.period = CONFIG.PERIOD_START;
      state.life = CONFIG.LIVES;
      state.combo = 0;
      state.phase = 'ARMED';
      state.wasInZone = false;
      state.startTime = performance.now();
      els.character.classList.remove('jumping', 'stumble');
      els.msg.textContent = '줄이 발밑에 올 때 딱 맞춰 탭!';
      updateHUD();
    }

    function startGame() {
      els.startOverlay.classList.add('hidden');
      els.endOverlay.classList.add('hidden');
      resetGameState();
      requestAnimationFrame(loop);
    }

    function resolveHit() {
      state.phase = 'RESOLVED';
      state.combo++;
      if (state.combo > getBest()) setBest(state.combo);
      els.character.classList.remove('stumble');
      els.character.classList.add('jumping');
      setTimeout(() => els.character.classList.remove('jumping'), 260);
      let msg = '폴짝! 성공 🎉';
      if (state.combo % CONFIG.HITS_PER_STEP === 0) {
        state.period = Math.max(CONFIG.PERIOD_MIN, state.period - CONFIG.PERIOD_STEP);
        msg += ' 점점 빨라져요!';
      }
      els.msg.textContent = msg;
      updateHUD();
    }

    function resolveMiss(text) {
      state.phase = 'RESOLVED';
      state.combo = 0;
      state.life--;
      els.character.classList.remove('jumping');
      els.character.classList.add('stumble');
      setTimeout(() => els.character.classList.remove('stumble'), 420);
      els.msg.textContent = text;
      updateHUD();
      if (state.life <= 0) {
        endGame();
      }
    }

    function tryJump() {
      if (!state.running) return;
      if (state.phase !== 'ARMED') return;
      const y = ropeYAt(performance.now());
      if (y >= CONFIG.ZONE_LOW) {
        resolveHit();
      } else {
        resolveMiss('너무 빨랐어요! 타이밍을 맞춰봐요');
      }
    }

    function loop(t) {
      if (!state.running) return;
      const y = ropeYAt(t);
      const topPercent = 10 + y * 70;
      els.ropeBar.style.top = topPercent + '%';
      const inZone = y >= CONFIG.ZONE_LOW;
      els.feetZone.classList.toggle('active', inZone);

      if (state.phase === 'ARMED') {
        if (!inZone && state.wasInZone) {
          resolveMiss('놓쳤어요! 줄에 걸렸어요');
        }
      } else if (state.phase === 'RESOLVED') {
        if (y < CONFIG.RESET_LOW) {
          state.phase = 'ARMED';
        }
      }
      state.wasInZone = inZone;

      requestAnimationFrame(loop);
    }

    function endGame() {
      state.running = false;
      const best = getBest();
      els.finalScore.textContent = best;
      els.resultMsg.textContent = best >= 15
        ? '줄넘기왕이네요! 정말 잘했어요 👑'
        : (best >= 7 ? '멋져요! 다음엔 더 길게 이어봐요!' : '재밌었죠? 한 번 더 도전해봐요!');
      els.endOverlay.classList.remove('hidden');
    }

    els.gameArea.addEventListener('pointerdown', tryJump);
    els.startBtn.addEventListener('click', startGame);
    els.restartBtn.addEventListener('click', startGame);

    els.best.textContent = getBest();
  })();
  </script>
</body>
</html>
