<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="caveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="50%" stop-color="#18153d"/>
      <stop offset="100%" stop-color="#2d225a"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cave Background -->
  <rect width="400" height="300" fill="url(#caveGrad)"/>

  <!-- Stalactites -->
  <polygon points="20,0 50,0 35,70" fill="#120f2e"/>
  <polygon points="70,0 110,0 90,90" fill="#201a45"/>
  <polygon points="140,0 170,0 155,60" fill="#120f2e"/>
  <polygon points="220,0 260,0 240,80" fill="#201a45"/>
  <polygon points="300,0 340,0 320,100" fill="#120f2e"/>
  <polygon points="360,0 395,0 380,65" fill="#201a45"/>

  <!-- Glowing Crystals Falling -->
  <!-- Ruby -->
  <g transform="translate(80, 110) rotate(15)" filter="url(#glow)">
    <polygon points="0,-22 16,0 0,22 -16,0" fill="#ff7675"/>
    <polygon points="0,-22 16,0 0,0" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Emerald -->
  <g transform="translate(290, 120) rotate(-20)" filter="url(#glow)">
    <polygon points="0,-24 18,0 0,24 -18,0" fill="#55efc4"/>
    <polygon points="0,-24 18,0 0,0" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Rainbow Prism Center -->
  <g transform="translate(195, 90)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#ffeaa7" opacity="0.3"/>
    <text x="0" y="8" font-size="36" text-anchor="middle">🌈</text>
  </g>
  <!-- Sapphire -->
  <g transform="translate(140, 160) rotate(30)" filter="url(#glow)">
    <polygon points="0,-18 14,0 0,18 -14,0" fill="#74b9ff"/>
    <polygon points="0,-18 14,0 0,0" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Amethyst -->
  <g transform="translate(250, 170) rotate(-10)" filter="url(#glow)">
    <polygon points="0,-20 15,0 0,20 -15,0" fill="#a29bfe"/>
    <polygon points="0,-20 15,0 0,0" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Sparkles -->
  <text x="50" y="200" font-size="20" fill="#fff" opacity="0.8">✨</text>
  <text x="340" y="190" font-size="20" fill="#fff" opacity="0.8">✨</text>
  <text x="200" y="45" font-size="18" fill="#fff" opacity="0.7">⭐</text>

  <!-- Cart / Minecart -->
  <g transform="translate(200, 225)">
    <rect x="-65" y="-20" width="130" height="40" rx="12" fill="url(#cartGrad)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
    <text x="0" y="8" font-size="24" text-anchor="middle">🔮✨</text>
    <circle cx="-35" cy="24" r="9" fill="#2d3436"/>
    <circle cx="35" cy="24" r="9" fill="#2d3436"/>
  </g>

  <!-- Title Banner -->
  <rect x="45" y="252" width="310" height="38" rx="19" fill="#ffffff" opacity="0.95"/>
  <text x="200" y="277" font-family="'Pretendard', sans-serif" font-weight="bold" font-size="16" fill="#1e1e2e" text-anchor="middle">🔮 반짝반짝 마법 수정 동굴 탐험</text>
</svg>
