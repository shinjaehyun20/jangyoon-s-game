<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d1a63"/>
      <stop offset="100%" stop-color="#1e1145"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#e9dcc4"/>
    </linearGradient>
    <linearGradient id="tileFallen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7f9df"/>
      <stop offset="100%" stop-color="#a9eab8"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- fallen dominoes (chain reaction in progress, left side) -->
  <g stroke="#2f9e52" stroke-width="2">
    <rect x="18" y="122" width="34" height="16" rx="3" fill="url(#tileFallen)" transform="rotate(85 35 130)"/>
    <rect x="44" y="118" width="34" height="16" rx="3" fill="url(#tileFallen)" transform="rotate(85 61 126)"/>
    <rect x="70" y="112" width="34" height="16" rx="3" fill="url(#tileFallen)" transform="rotate(85 87 120)"/>
  </g>

  <!-- standing dominoes about to fall -->
  <g stroke="#7a5c2e" stroke-width="2">
    <rect x="104" y="70" width="20" height="46" rx="4" fill="url(#tile)" transform="rotate(8 114 93)"/>
    <rect x="132" y="66" width="20" height="46" rx="4" fill="url(#tile)" transform="rotate(4 142 89)"/>
    <rect x="160" y="64" width="20" height="46" rx="4" fill="url(#tile)"/>
    <rect x="188" y="66" width="20" height="46" rx="4" fill="url(#tile)" transform="rotate(-4 198 89)"/>
    <rect x="216" y="70" width="20" height="46" rx="4" fill="url(#tile)" transform="rotate(-8 226 93)"/>
  </g>

  <!-- number badges on a few tiles -->
  <circle cx="234" cy="66" r="9" fill="#ff6b6b"/>
  <text x="234" y="70" text-anchor="middle" font-size="11" font-weight="900" fill="#fff" font-family="'Pretendard','Noto Sans KR',sans-serif">3</text>
  <circle cx="170" cy="60" r="9" fill="#ff6b6b"/>
  <text x="170" y="64" text-anchor="middle" font-size="11" font-weight="900" fill="#fff" font-family="'Pretendard','Noto Sans KR',sans-serif">1</text>
  <circle cx="198" cy="62" r="9" fill="#ff6b6b"/>
  <text x="198" y="66" text-anchor="middle" font-size="11" font-weight="900" fill="#fff" font-family="'Pretendard','Noto Sans KR',sans-serif">2</text>

  <!-- spark glow at the chain front -->
  <circle cx="100" cy="112" r="13" fill="#ffb703" opacity="0.55"/>
  <circle cx="100" cy="112" r="6" fill="#fff6c8" opacity="0.9"/>

  <!-- decorative small dots trailing -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="20" cy="30" r="2"/>
    <circle cx="40" cy="20" r="1.5"/>
    <circle cx="60" cy="35" r="1.5"/>
    <circle cx="250" cy="25" r="2"/>
    <circle cx="270" cy="40" r="1.5"/>
  </g>

  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="22" font-weight="900" fill="#ffb703">도미노 잇기</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="2">DOMINO CHAIN</text>
  </g>
</svg>
