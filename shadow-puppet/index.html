<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="icon" href="data:"><title>그림자 손놀이</title><style>
:root{--bg:#17132e;--panel:#282044;--accent:#ffd86b;--good:#7ff2c5;--text:#fff}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:radial-gradient(circle at 50% 25%,#4b3a78,var(--bg) 66%);color:var(--text)}.wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud{display:flex;justify-content:space-around;padding:8px;border-radius:12px;background:#ffffff16;font-weight:800}.value{color:var(--accent)}#gameArea{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}.message{height:22px;text-align:center;font-weight:800}.stage{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;background:linear-gradient(#19142e 0 30%,#3a2b5a);box-shadow:inset 0 0 0 3px #ffffff12}.lamp{position:absolute;top:5%;left:50%;transform:translateX(-50%);font-size:34px}.beam{position:absolute;left:11%;right:11%;top:15%;bottom:9%;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);background:linear-gradient(#fff4b8b0,#ffd86b1f)}.screen{position:absolute;inset:22% 9% 13%;border-radius:22px;background:#fff3c5;display:grid;place-items:center;box-shadow:0 0 30px #ffd86b88}.shadow{font-size:clamp(68px,24vw,122px);filter:grayscale(1) brightness(.15);transition:transform .25s}.shadow.pop{transform:scale(1.16) rotate(-4deg)}.sequence{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:center;gap:7px}.dot{width:13px;height:13px;border-radius:50%;background:#6c627c}.dot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}.dot.done{background:var(--good)}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad{border:0;border-radius:16px;min-height:62px;background:var(--panel);color:#fff;font-size:29px;font-weight:900;box-shadow:inset 0 -4px #0004}.pad:active,.pad.flash{transform:translateY(2px);background:#514079}.mainbtn{border:0;border-radius:16px;min-height:56px;width:100%;font-size:20px;font-weight:900;color:#2b2144;background:var(--accent)}footer{display:flex;justify-content:space-between;font-size:13px}.home-link{color:#fff}.overlay{position:fixed;inset:0;z-index:5;background:#100c21e8;display:grid;place-items:center;padding:22px}.hidden{display:none}.card{width:min(390px,100%);padding:26px 20px;border-radius:24px;text-align:center;background:linear-gradient(150deg,#574477,#251d42);box-shadow:0 10px 30px #0008}.card h2{font-size:28px;margin-bottom:12px}.card p{line-height:1.55;margin-bottom:18px}.result{font-size:42px;color:var(--accent);font-weight:900;margin:10px}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:shake .24s}
</style></head><body><main class="wrap"><h1>🐇 그림자 손놀이</h1><div class="hud"><span>막 <b class="value" id="round">1</b>/5</span><span>점수 <b class="value" id="score">0</b></span><span>최고 <b class="value" id="best">0</b></span></div><section id="gameArea"><p class="message" id="message">빛나는 순서를 잘 봐요!</p><div class="stage"><div class="lamp">🔦</div><div class="beam"></div><div class="screen" id="screen"><div class="sequence" id="sequence"></div><div class="shadow" id="shadow">🐇</div></div></div><div class="pads"><button class="pad" data-i="0" aria-label="토끼 손 그림자">🐇</button><button class="pad" data-i="1" aria-label="새 손 그림자">🕊️</button><button class="pad" data-i="2" aria-label="강아지 손 그림자">🐶</button></div></section><footer><small>빛난 동물을 같은 순서로 톡톡</small><a class="home-link" href="../index.html">← 홈으로</a></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🔦 그림자 손놀이</h2><p>무대에 나타나는 그림자 순서를 기억해요.<br>아래 동물을 같은 순서로 톡톡 누르면 공연 성공!</p><button class="mainbtn" id="startBtn">공연 시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🎭 멋진 공연!</h2><div class="result" id="finalScore">0점</div><p id="resultMsg"></p><button class="mainbtn" id="restartBtn">다시 공연하기</button></div></div><script>
(()=>{'use strict';const CONFIG={rounds:5,baseLength:3,showMs:520,gapMs:180,animals:['🐇','🕊️','🐶'],bestKey:'shadow-puppet_best'};let state={};const $=id=>document.getElementById(id),pads=[...document.querySelectorAll('.pad')];$('best').textContent=localStorage.getItem(CONFIG.bestKey)||0;function wait(ms){return new Promise(r=>setTimeout(r,ms))}function dots(){const box=$('sequence');box.innerHTML='';state.pattern.forEach((_,i)=>{const d=document.createElement('i');d.className='dot';d.dataset.i=i;box.append(d)})}async function showPattern(){state.locked=true;$('message').textContent='빛나는 순서를 잘 봐요!';dots();for(let i=0;i<state.pattern.length;i++){const n=state.pattern[i],p=pads[n],d=$('sequence').children[i];$('shadow').textContent=CONFIG.animals[n];p.classList.add('flash');d.classList.add('on');await wait(CONFIG.showMs);p.classList.remove('flash');d.classList.remove('on');await wait(CONFIG.gapMs)}state.locked=false;state.index=0;$('message').textContent='이제 같은 순서로 눌러요!'}function makeRound(){state.pattern=Array.from({length:CONFIG.baseLength+state.round-1},()=>Math.floor(Math.random()*3));$('round').textContent=state.round;showPattern()}function press(i){if(state.locked)return;const expected=state.pattern[state.index];if(i!==expected){state.locked=true;$('message').textContent='앗! 다시 한번 보여줄게요 🙂';$('screen').classList.add('shake');setTimeout(()=>{$('screen').classList.remove('shake');showPattern()},650);return}const d=$('sequence').children[state.index];d.className='dot done';$('shadow').textContent=CONFIG.animals[i];$('shadow').classList.add('pop');setTimeout(()=>$('shadow').classList.remove('pop'),220);state.index++;state.score+=10;$('score').textContent=state.score;if(state.index===state.pattern.length){state.locked=true;state.score+=state.round*5;$('score').textContent=state.score;$('message').textContent='막 성공! 박수 짝짝짝 👏';setTimeout(nextRound,700)}}function nextRound(){if(state.round>=CONFIG.rounds)return finish();state.round++;makeRound()}function finish(){const best=Math.max(Number(localStorage.getItem(CONFIG.bestKey)||0),state.score);localStorage.setItem(CONFIG.bestKey,best);$('best').textContent=best;$('finalScore').textContent=state.score+'점';$('resultMsg').textContent='그림자 순서를 끝까지 기억했어요!';$('endOverlay').classList.remove('hidden')}function start(){state={round:1,score:0,index:0,locked:true,pattern:[]};$('score').textContent=0;$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');makeRound()}pads.forEach(p=>p.addEventListener('pointerdown',e=>{e.preventDefault();press(Number(p.dataset.i))}));$('startBtn').addEventListener('pointerdown',start);$('restartBtn').addEventListener('pointerdown',start)})();
</script></body></html>
