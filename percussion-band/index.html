<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🥁 동물 밴드 연주</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  }
  :root {
    --bg: #2b1b4d;
    --accent: #ffb703;
    --text: #ffffff;
  }
  body {
    background: linear-gradient(160deg, #2b1b4d 0%, #4a2e7a 100%);
    color: var(--text);
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 10px 12px 8px; gap: 8px;
    margin: 0 auto;
  }
  h1 {
    font-size: clamp(20px, 5.5vw, 28px);
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .hud {
    display: flex; flex-direction: row; justify-content: space-between;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 15px;
    font-weight: 700;
  }
  #gameArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    position: relative;
  }
  .stage-msg {
    font-size: clamp(16px, 4.2vw, 20px);
    font-weight: 700;
    min-height: 28px;
    text-align: center;
  }
  .pads {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    max-width: 360px;
  }
  .pad {
    aspect-ratio: 1 / 1;
    border-radius: 24px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(40px, 12vw, 64px);
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.08s ease;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
  }
  .pad:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .pad.lit { filter: brightness(1.6); transform: scale(1.05); }
  .pad.drum { background: #e63946; }
  .pad.triangle { background: #ffb703; }
  .pad.xylo { background: #2a9d8f; }
  .pad.tambourine { background: #6c5ce7; }
  footer {
    display: flex; flex-direction: row; justify-content: space-between;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
  }
  .home-link { color: rgba(255,255,255,0.7); text-decoration: none; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay-card {
    background: #241338;
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    max-width: 320px;
    width: 88%;
  }
  .overlay-card h2 { font-size: 24px; margin-bottom: 10px; }
  .overlay-card p { font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.85); margin-bottom: 18px; }
  .btn-start {
    background: var(--accent);
    color: #241338;
    border: none;
    border-radius: 14px;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: 800;
    min-height: 44px;
    cursor: pointer;
  }
  .result-score { font-size: 40px; font-weight: 900; color: var(--accent); margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🥁 동물 밴드 연주</h1>

    <div class="hud">
      <span>라운드 <span id="roundNum">1</span></span>
      <span>최고 <span id="bestScore">0</span></span>
    </div>

    <div id="gameArea">
      <div class="stage-msg" id="stageMsg">순서를 잘 보세요!</div>
      <div class="pads">
        <button class="pad drum" data-key="drum">🥁</button>
        <button class="pad triangle" data-key="triangle">🔺</button>
        <button class="pad xylo" data-key="xylo">🎹</button>
        <button class="pad tambourine" data-key="tambourine">🪘</button>
      </div>
    </div>

    <footer>
      <small>악기를 순서대로 눌러 흉내내 보세요</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🥁 동물 밴드 연주</h2>
      <p>동물 밴드가 악기를 연주해요. 순서를 잘 보고 똑같이 눌러보세요! 라운드마다 순서가 하나씩 늘어나요.</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>
  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 연주 끝!</h2>
      <div class="result-score" id="finalScore">0</div>
      <p id="resultMsg"></p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

<script>
(function () {
  'use strict';
  const CONFIG = {
    keys: ['drum', 'triangle', 'xylo', 'tambourine'],
    litDuration: 550,
    gapDuration: 280,
    startDelay: 700,
    storageKey: 'percussion-band_best'
  };

  const pads = Array.from(document.querySelectorAll('.pad'));
  const stageMsg = document.getElementById('stageMsg');
  const roundNumEl = document.getElementById('roundNum');
  const bestScoreEl = document.getElementById('bestScore');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const resultMsgEl = document.getElementById('resultMsg');

  const state = {
    sequence: [],
    playerIndex: 0,
    round: 1,
    accepting: false,
    playing: false
  };

  function getBest() {
    return parseInt(localStorage.getItem(CONFIG.storageKey) || '0', 10);
  }
  function setBest(v) {
    localStorage.setItem(CONFIG.storageKey, String(v));
  }
  bestScoreEl.textContent = getBest();

  function randomKey() {
    return CONFIG.keys[Math.floor(Math.random() * CONFIG.keys.length)];
  }

  function padByKey(key) {
    return pads.find(p => p.dataset.key === key);
  }

  function litPad(key, duration) {
    return new Promise(resolve => {
      const pad = padByKey(key);
      pad.classList.add('lit');
      setTimeout(() => {
        pad.classList.remove('lit');
        setTimeout(resolve, CONFIG.gapDuration);
      }, duration);
    });
  }

  async function playSequence() {
    state.accepting = false;
    stageMsg.textContent = '순서를 잘 보세요! 👀';
    await sleep(CONFIG.startDelay);
    for (const key of state.sequence) {
      await litPad(key, CONFIG.litDuration);
    }
    stageMsg.textContent = '이제 따라 눌러보세요! 👉';
    state.playerIndex = 0;
    state.accepting = true;
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  function nextRound() {
    state.round += 1;
    roundNumEl.textContent = state.round;
    state.sequence.push(randomKey());
    playSequence();
  }

  function handlePad(key) {
    if (!state.accepting || !state.playing) return;
    const pad = padByKey(key);
    pad.classList.add('lit');
    setTimeout(() => pad.classList.remove('lit'), 180);

    if (key === state.sequence[state.playerIndex]) {
      state.playerIndex += 1;
      if (state.playerIndex === state.sequence.length) {
        state.accepting = false;
        stageMsg.textContent = '정답! 다음 라운드 ✨';
        setTimeout(nextRound, 900);
      }
    } else {
      endGame();
    }
  }

  pads.forEach(pad => {
    pad.addEventListener('pointerdown', () => handlePad(pad.dataset.key));
  });

  function startGame() {
    state.sequence = [randomKey()];
    state.round = 1;
    state.playing = true;
    roundNumEl.textContent = state.round;
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    playSequence();
  }

  function endGame() {
    state.playing = false;
    state.accepting = false;
    const score = state.round - 1;
    const best = getBest();
    if (score > best) setBest(score);
    bestScoreEl.textContent = getBest();
    finalScoreEl.textContent = score;
    resultMsgEl.textContent = score > best ? '최고 기록 달성! 🏆' : '멋진 연주였어요! 다시 도전!';
    stageMsg.textContent = '';
    endOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('pointerdown', startGame);
  restartBtn.addEventListener('pointerdown', startGame);
})();
</script>
</body>
</html>
