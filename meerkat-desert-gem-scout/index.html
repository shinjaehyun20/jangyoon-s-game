<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐿️ 꼬마 미어캣의 요리조리 사막 보석 탐험</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #9A3412 0%, #C2410C 50%, #EA580C 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #7c2d12;
      box-shadow: 0 10px 35px rgba(234, 88, 12, 0.35);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(124, 45, 18, 0.85);
      color: #FED7AA;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      border-bottom: 1px solid rgba(249, 115, 22, 0.3);
      backdrop-filter: blur(8px);
    }
    .home-btn {
      color: #FFF7ED;
      text-decoration: none;
      font-size: 14px;
      background: rgba(249, 115, 22, 0.3);
      padding: 5px 12px;
      border-radius: 14px;
      transition: background 0.2s;
    }
    .badge {
      background: rgba(249, 115, 22, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #FED7AA;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #431407;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(67, 20, 7, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(8px);
    }
    .overlay h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #FED7AA;
      text-shadow: 0 0 16px rgba(249, 115, 22, 0.5);
    }
    .overlay p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
      color: #FFEDD5;
    }
    .btn {
      background: linear-gradient(135deg, #F97316, #C2410C);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../index.html" class="home-btn">🏠 아케이드</a>
      <div id="score-display">보석: 0</div>
      <div class="badge" id="combo-display">콤보 x0</div>
    </header>
    <canvas id="gameCanvas"></canvas>

    <div id="start-overlay" class="overlay">
      <h1>🐿️ 꼬마 미어캣의 보석 탐험</h1>
      <p>사막 모래 언덕 구멍에서 반짝이는 보석이 솟아올라요!<br>보석이 나온 구멍을 톡톡 터치하여 미어캣과 함께 수집하세요.<br>데굴데굴 굴러오는 모래바람은 피해야 해요!</p>
      <button class="btn" id="start-btn">탐험 시작!</button>
    </div>

    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h1>💎 탐험 완료!</h1>
      <p id="gameover-msg">반짝이는 사막 보석을 가득 찾았어요!</p>
      <button class="btn" id="restart-btn">다시 찾기</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTwinkle(combo) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const freq = 600 + Math.min(combo * 50, 800);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const comboDisplay = document.getElementById('combo-display');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const gameoverMsg = document.getElementById('gameover-msg');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight - 50;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = false;
    let score = 0;
    let combo = 0;

    // 4 Burrow Mounds
    let mounds = [];
    function initMounds() {
      mounds = [
        { x: width * 0.28, y: height * 0.38, hasGem: false, gemTimer: 0, gemType: 0 },
        { x: width * 0.72, y: height * 0.38, hasGem: false, gemTimer: 0, gemType: 0 },
        { x: width * 0.28, y: height * 0.72, hasGem: false, gemTimer: 0, gemType: 0 },
        { x: width * 0.72, y: height * 0.72, hasGem: false, gemTimer: 0, gemType: 0 }
      ];
    }

    let activeMeerkat = { moundIdx: -1, timer: 0 };
    let particles = [];

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          color,
          radius: 3 + Math.random() * 3,
          life: 1
        });
      }
    }

    function resetGame() {
      score = 0;
      combo = 0;
      initMounds();
      particles = [];
      activeMeerkat = { moundIdx: -1, timer: 0 };
      scoreDisplay.textContent = '보석: 0';
      comboDisplay.textContent = '콤보 x0';
    }

    const GEM_COLORS = ['#EF4444', '#3B82F6', '#FBBF24', '#10B981'];

    function update() {
      if (!isPlaying) return;

      // Randomly spawn gems in mounds
      if (Math.random() < 0.04) {
        const idx = Math.floor(Math.random() * mounds.length);
        if (!mounds[idx].hasGem) {
          mounds[idx].hasGem = true;
          mounds[idx].gemTimer = 85;
          mounds[idx].gemType = Math.floor(Math.random() * GEM_COLORS.length);
        }
      }

      for (let m of mounds) {
        if (m.hasGem) {
          m.gemTimer--;
          if (m.gemTimer <= 0) {
            m.hasGem = false;
            combo = Math.max(0, combo - 1);
            comboDisplay.textContent = `콤보 x${combo}`;
          }
        }
      }

      if (activeMeerkat.timer > 0) activeMeerkat.timer--;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Desert Twilight Sky Gradient
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#C2410C');
      grad.addColorStop(0.5, '#EA580C');
      grad.addColorStop(1, '#7C2D12');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Draw Burrow Mounds
      for (let i = 0; i < mounds.length; i++) {
        const m = mounds[i];

        // Burrow Shadow / Hole
        ctx.fillStyle = '#451A03';
        ctx.beginPath();
        ctx.ellipse(m.x, m.y + 15, 45, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // Sandy Rim
        ctx.fillStyle = '#9A3412';
        ctx.beginPath();
        ctx.ellipse(m.x, m.y + 20, 50, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Meerkat if popped up
        if (activeMeerkat.moundIdx === i && activeMeerkat.timer > 0) {
          ctx.fillStyle = '#D97706';
          ctx.beginPath();
          ctx.ellipse(m.x, m.y - 10, 16, 22, 0, 0, Math.PI * 2);
          ctx.fill();
          // Head & Ears
          ctx.beginPath();
          ctx.arc(m.x, m.y - 28, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#78350F';
          ctx.beginPath();
          ctx.arc(m.x - 12, m.y - 30, 3, 0, Math.PI * 2);
          ctx.arc(m.x + 12, m.y - 30, 3, 0, Math.PI * 2);
          ctx.fill();
          // Eyes
          ctx.fillStyle = '#0F172A';
          ctx.beginPath();
          ctx.arc(m.x - 5, m.y - 28, 2.5, 0, Math.PI * 2);
          ctx.arc(m.x + 5, m.y - 28, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Sparkling Gem
        if (m.hasGem) {
          ctx.fillStyle = GEM_COLORS[m.gemType];
          ctx.beginPath();
          ctx.moveTo(m.x, m.y - 18);
          ctx.lineTo(m.x + 12, m.y - 8);
          ctx.lineTo(m.x + 8, m.y + 8);
          ctx.lineTo(m.x - 8, m.y + 8);
          ctx.lineTo(m.x - 12, m.y - 8);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(m.x - 3, m.y - 6, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();

    // Tap Handling
    function handleTap(clientX, clientY) {
      if (!isPlaying) return;
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const tx = clientX - rect.left;
      const ty = clientY - rect.top;

      for (let i = 0; i < mounds.length; i++) {
        const m = mounds[i];
        const dist = Math.hypot(tx - m.x, ty - m.y);
        if (dist < 55) {
          activeMeerkat = { moundIdx: i, timer: 18 };
          if (m.hasGem) {
            combo++;
            score += 20 * combo;
            playTwinkle(combo);
            addParticles(m.x, m.y, GEM_COLORS[m.gemType], 14);
            m.hasGem = false;
          }
          scoreDisplay.textContent = `보석: ${score}`;
          comboDisplay.textContent = `콤보 x${combo}`;
          break;
        }
      }
    }

    window.addEventListener('mousedown', (e) => handleTap(e.clientX, e.clientY));
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) handleTap(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    startBtn.addEventListener('click', () => {
      initAudio();
      startOverlay.style.display = 'none';
      resetGame();
      isPlaying = true;
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      gameoverOverlay.style.display = 'none';
      resetGame();
      isPlaying = true;
    });
  </script>
</body>
</html>
