<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="desertSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="40%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ffab91"/>
    </linearGradient>
    <linearGradient id="sandDuneBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="sandDuneFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="60%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="meerkatFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="40%" stop-color="#bcaaa4"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gemGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#80d8ff"/>
      <stop offset="70%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </radialGradient>
    <radialGradient id="rubyGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ff80ab"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </radialGradient>
  </defs>

  <!-- Warm Desert Sky -->
  <rect width="400" height="300" fill="url(#desertSky)"/>

  <!-- Golden Sun -->
  <circle cx="330" cy="70" r="50" fill="url(#sunGlow)"/>
  <circle cx="330" cy="70" r="28" fill="#fff9c4"/>

  <!-- Back Sand Dunes -->
  <path d="M 0,140 Q 110,95 240,135 T 400,110 L 400,300 L 0,300 Z" fill="url(#sandDuneBack)" opacity="0.85"/>

  <!-- Front Dunes & Burrows -->
  <path d="M 0,175 Q 140,120 280,185 T 400,165 L 400,300 L 0,300 Z" fill="url(#sandDuneFront)"/>

  <!-- Desert Burrows (Mounds) -->
  <ellipse cx="90" cy="245" rx="35" ry="12" fill="#bf360c"/>
  <ellipse cx="320" cy="235" rx="38" ry="13" fill="#bf360c"/>
  <ellipse cx="200" cy="265" rx="42" ry="14" fill="#870000"/>

  <!-- Sparkling Desert Gems Floating -->
  <g transform="translate(85, 195) rotate(-15)">
    <polygon points="0,-16 12,-4 8,14 -8,14 -12,-4" fill="url(#gemGlow)" stroke="#e1f5fe" stroke-width="1.5"/>
    <line x1="0" y1="-16" x2="0" y2="14" stroke="#fff" stroke-width="1" opacity="0.8"/>
    <text x="14" y="-8" font-size="16" fill="#ffd54f">✨</text>
  </g>
  <g transform="translate(325, 185) rotate(12)">
    <polygon points="0,-15 11,-2 7,13 -7,13 -11,-2" fill="url(#rubyGlow)" stroke="#fce4ec" stroke-width="1.5"/>
    <text x="-24" y="-6" font-size="14" fill="#ffd54f">⭐</text>
  </g>

  <!-- Little Meerkat standing tall on guard -->
  <g transform="translate(200, 155)">
    <!-- Shadow -->
    <ellipse cx="0" cy="85" rx="22" ry="8" fill="rgba(62, 39, 35, 0.4)"/>

    <!-- Tail resting on sand -->
    <path d="M -8,70 Q -24,80 -28,95 Q -22,96 -6,78 Z" fill="url(#meerkatFur)"/>
    <path d="M -28,95 Q -27,92 -20,86 L -25,95 Z" fill="#3e2723"/>

    <!-- Slender Body standing upright -->
    <ellipse cx="0" cy="38" rx="15" ry="40" fill="url(#meerkatFur)"/>
    <!-- Cream Tummy -->
    <ellipse cx="0" cy="38" rx="10" ry="28" fill="#efebe9"/>

    <!-- Back Stripes -->
    <path d="M -12,22 Q 0,25 12,22" stroke="#6d4c41" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M -13,32 Q 0,35 13,32" stroke="#6d4c41" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M -12,42 Q 0,45 12,42" stroke="#6d4c41" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Little Paws held against chest -->
    <g transform="translate(0, 24)">
      <ellipse cx="-6" cy="0" rx="4" ry="7" fill="#6d4c41" transform="rotate(-20 -6 0)"/>
      <ellipse cx="6" cy="0" rx="4" ry="7" fill="#6d4c41" transform="rotate(20 6 0)"/>
    </g>

    <!-- Meerkat Head -->
    <g transform="translate(0, -8)">
      <!-- Head shape -->
      <ellipse cx="0" cy="0" rx="16" ry="14" fill="url(#meerkatFur)"/>
      <ellipse cx="0" cy="4" rx="10" ry="8" fill="#efebe9"/>

      <!-- Dark Ear Patches & Cute Round Ears -->
      <circle cx="-14" cy="-3" r="5" fill="#3e2723"/>
      <circle cx="-14" cy="-3" r="3" fill="#212121"/>
      <circle cx="14" cy="-3" r="5" fill="#3e2723"/>
      <circle cx="14" cy="-3" r="3" fill="#212121"/>

      <!-- Dark Eye Mask / Sunglasses patches -->
      <ellipse cx="-7" cy="0" rx="6.5" ry="4.5" fill="#3e2723" transform="rotate(-10 -7 0)"/>
      <ellipse cx="7" cy="0" rx="6.5" ry="4.5" fill="#3e2723" transform="rotate(10 7 0)"/>

      <!-- Big Curious Eyes -->
      <circle cx="-6.5" cy="0" r="3.2" fill="#212121"/>
      <circle cx="-7.5" cy="-1" r="1.2" fill="#ffffff"/>
      <circle cx="6.5" cy="0" r="3.2" fill="#212121"/>
      <circle cx="5.5" cy="-1" r="1.2" fill="#ffffff"/>

      <!-- Nose and Snout -->
      <polygon points="0,4 -3,2 3,2" fill="#212121"/>
      <path d="M -2,6 Q 0,8 2,6" stroke="#212121" stroke-width="1.2" fill="none"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(200, 270)">
    <rect x="-155" y="-18" width="310" height="34" rx="17" fill="rgba(191, 54, 12, 0.85)" stroke="#ffe082" stroke-width="2"/>
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🐾 쫑긋 미어캣의 황금빛 사막 보석 망보기
    </text>
  </g>
</svg>