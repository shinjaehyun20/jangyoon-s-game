<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="desertBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="duneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#desertBg)"/>

  <!-- Desert Sun & Dunes -->
  <circle cx="150" cy="40" r="24" fill="#FEF08A" opacity="0.8"/>
  <path d="M 0 140 Q 60 110 130 145 T 200 130 L 200 200 L 0 200 Z" fill="url(#duneGrad)"/>

  <!-- Burrow Mound -->
  <ellipse cx="100" cy="165" rx="45" ry="16" fill="#7C2D12"/>

  <!-- Cute Alert Meerkat Popping Up -->
  <g transform="translate(100, 115)">
    <!-- Slender Body -->
    <rect x="-14" y="0" width="28" height="42" rx="12" fill="#D97706"/>
    <rect x="-9" y="8" width="18" height="30" rx="8" fill="#FDE68A"/>

    <!-- Cute Head -->
    <ellipse cx="0" cy="-8" rx="16" ry="14" fill="#D97706"/>
    <!-- Cheeks & Snout -->
    <ellipse cx="0" cy="-3" rx="10" ry="7" fill="#FEF3C7"/>
    <ellipse cx="0" cy="-6" rx="4" ry="3" fill="#1C1917"/>

    <!-- Distinctive Dark Eye Patches -->
    <ellipse cx="-7" cy="-9" rx="5" ry="4" fill="#78350F"/>
    <ellipse cx="7" cy="-9" rx="5" ry="4" fill="#78350F"/>
    <circle cx="-6" cy="-9" r="2.2" fill="#0F172A"/>
    <circle cx="8" cy="-9" r="2.2" fill="#0F172A"/>
    <circle cx="-5.5" cy="-10" r="0.8" fill="#FFF"/>
    <circle cx="8.5" cy="-10" r="0.8" fill="#FFF"/>

    <!-- Little Rounded Ears -->
    <circle cx="-16" cy="-11" r="3.5" fill="#78350F"/>
    <circle cx="16" cy="-11" r="3.5" fill="#78350F"/>

    <!-- Paws folded on chest -->
    <ellipse cx="-6" cy="12" rx="3.5" ry="5" fill="#B45309"/>
    <ellipse cx="6" cy="12" rx="3.5" ry="5" fill="#B45309"/>
  </g>

  <!-- Sparkling Ruby Gem -->
  <g transform="translate(45, 120)">
    <polygon points="0,-10 9,-4 6,8 -6,8 -9,-4" fill="#EF4444"/>
    <polygon points="0,-10 5,-4 3,5 -3,5 -5,-4" fill="#F87171"/>
  </g>
</svg>
