<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="riverSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf2f6"/>
      <stop offset="60%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <linearGradient id="riverWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="40%" stop-color="#00acc1"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>
    <linearGradient id="otterFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a17046"/>
      <stop offset="60%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
    <linearGradient id="otterBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <radialGradient id="pearlGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </radialGradient>
    <radialGradient id="rainbowShell" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="40%" stop-color="#b2ebf2"/>
      <stop offset="80%" stop-color="#d1c4e9"/>
      <stop offset="100%" stop-color="#ff80ab"/>
    </radialGradient>
  </defs>

  <!-- Sky and River Bank -->
  <rect width="400" height="300" fill="url(#riverSky)"/>

  <!-- Lush Green River Banks -->
  <path d="M 0,0 L 400,0 L 400,85 Q 300,70 200,85 T 0,75 Z" fill="#81c784"/>
  <path d="M 0,0 L 400,0 L 400,65 Q 280,50 160,65 T 0,55 Z" fill="#66bb6a"/>

  <!-- Sparkling River -->
  <path d="M 0,80 Q 120,65 240,82 T 400,75 L 400,300 L 0,300 Z" fill="url(#riverWater)"/>

  <!-- River Flow Waves & Sparkles -->
  <path d="M 0,120 Q 80,105 180,125 T 400,115" stroke="#e0f7fa" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 0,165 Q 120,150 250,170 T 400,160" stroke="#e0f7fa" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 0,225 Q 90,210 220,230 T 400,220" stroke="#e0f7fa" stroke-width="3.5" fill="none" opacity="0.65"/>
  <circle cx="70" cy="140" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="340" cy="130" r="4" fill="#fff" opacity="0.85"/>
  <circle cx="120" cy="240" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="360" cy="240" r="4.5" fill="#fff" opacity="0.85"/>

  <!-- Floating Clam and Pebble on River -->
  <g transform="translate(60, 200) rotate(-10)">
    <path d="M -16,0 C -16,-18 16,-18 16,0 C 16,10 -16,10 -16,0 Z" fill="url(#rainbowShell)" stroke="#80deea" stroke-width="1.5"/>
    <line x1="0" y1="-16" x2="0" y2="4" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
    <line x1="-8" y1="-12" x2="-2" y2="4" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
    <line x1="8" y1="-12" x2="2" y2="4" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="1" r="5" fill="url(#pearlGlow)"/>
  </g>

  <!-- Baby Otter Floating on Water -->
  <g transform="translate(210, 185)">
    <!-- Water Ripple around Otter -->
    <ellipse cx="0" cy="20" rx="90" ry="24" fill="#80deea" opacity="0.5"/>
    <ellipse cx="0" cy="22" rx="75" ry="18" fill="#e0f7fa" opacity="0.6"/>

    <!-- Tail -->
    <path d="M -70,10 Q -95,20 -90,5 Q -75,0 -60,6 Z" fill="url(#otterFur)"/>

    <!-- Otter Body (Back Float) -->
    <ellipse cx="-10" cy="12" rx="60" ry="28" fill="url(#otterFur)"/>
    <!-- Otter Cream Belly -->
    <ellipse cx="-10" cy="12" rx="42" ry="18" fill="url(#otterBelly)"/>

    <!-- Otter Back Paws/Feet -->
    <ellipse cx="-55" cy="26" rx="10" ry="8" fill="url(#otterFur)"/>
    <ellipse cx="-40" cy="30" rx="10" ry="8" fill="url(#otterFur)"/>

    <!-- Front Paws holding pebble & clam -->
    <ellipse cx="-15" cy="2" rx="9" ry="8" fill="url(#otterFur)"/>
    <ellipse cx="8" cy="2" rx="9" ry="8" fill="url(#otterFur)"/>

    <!-- Cracked Clam & Shining Pearl on Belly -->
    <g transform="translate(-4, 0)">
      <!-- Smooth River Pebble -->
      <ellipse cx="-14" cy="-4" rx="8" ry="6" fill="#90a4ae" stroke="#546e7a" stroke-width="1"/>
      <!-- Sparkling Clam -->
      <path d="M -12,-6 C -12,-20 12,-20 12,-6 C 12,4 -12,4 -12,-6 Z" fill="url(#rainbowShell)" stroke="#00acc1" stroke-width="1.5"/>
      <circle cx="0" cy="-6" r="6" fill="url(#pearlGlow)"/>
      <circle cx="-2" cy="-8" r="2" fill="#ffffff"/>
      <text x="14" y="-12" font-size="16" fill="#ffd54f">✨</text>
    </g>

    <!-- Otter Head -->
    <ellipse cx="45" cy="5" rx="24" ry="22" fill="url(#otterFur)"/>
    <!-- Otter Cream Cheeks / Muzzle -->
    <ellipse cx="50" cy="10" rx="15" ry="11" fill="url(#otterBelly)"/>
    <!-- Ears -->
    <circle cx="36" cy="-12" r="6" fill="url(#otterFur)"/>
    <circle cx="36" cy="-12" r="3.5" fill="#d7ccc8"/>
    <circle cx="56" cy="-12" r="6" fill="url(#otterFur)"/>
    <circle cx="56" cy="-12" r="3.5" fill="#d7ccc8"/>

    <!-- Cute Eyes -->
    <circle cx="43" cy="3" r="3.5" fill="#212121"/>
    <circle cx="42" cy="2" r="1.2" fill="#ffffff"/>
    <circle cx="57" cy="3" r="3.5" fill="#212121"/>
    <circle cx="56" cy="2" r="1.2" fill="#ffffff"/>

    <!-- Nose and Mouth -->
    <ellipse cx="50" cy="9" rx="3.5" ry="2.5" fill="#212121"/>
    <path d="M 47,13 Q 50,15 53,13" stroke="#212121" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="38" y1="10" x2="30" y2="8" stroke="#4e342e" stroke-width="1.2"/>
    <line x1="38" y1="12" x2="28" y2="13" stroke="#4e342e" stroke-width="1.2"/>
    <line x1="62" y1="10" x2="70" y2="8" stroke="#4e342e" stroke-width="1.2"/>
    <line x1="62" y1="12" x2="72" y2="13" stroke="#4e342e" stroke-width="1.2"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(200, 268)">
    <rect x="-150" y="-18" width="300" height="34" rx="17" fill="rgba(0, 96, 100, 0.85)" stroke="#4dd0e1" stroke-width="2"/>
    <text x="0" y="5" font-family="'Pretendard', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🦦 조약돌 수달의 조개 캐칭 강물 모험
    </text>
  </g>
</svg>