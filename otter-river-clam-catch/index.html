<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🦦 아기 수달의 퐁당퐁당 조개 잡기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #E0F7FA 0%, #B2EBF2 50%, #80DEEA 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #E8F5E9;
      box-shadow: 0 10px 30px rgba(0, 96, 100, 0.2);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #00838F;
      color: white;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
    }
    .badge {
      background: rgba(255, 255, 255, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #E0F2F1;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 77, 64, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(4px);
    }
    .overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #80DEEA;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .overlay p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
      color: #E0F7FA;
    }
    .btn {
      background: #00ACC1;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 172, 193, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
      background: #00838F;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <div id="score-display">🐚 조개: <span id="score">0</span></div>
      <div class="badge" id="level-display">맑은 여울 1단계</div>
      <div class="badge" id="timer-display">⏱️ 45s</div>
    </header>

    <canvas id="gameCanvas"></canvas>

    <div id="start-overlay" class="overlay">
      <h1>🦦 아기 수달의 조개 잡기</h1>
      <p>화면을 좌우로 터치해 아기 수달을 움직여보세요!<br>맑은 시냇물로 떠내려오는 반짝반짝 조개를 잡고<br>둥둥 떠다니는 통나무와 바위를 피해 보아요 💦</p>
      <button class="btn" id="start-btn">퐁당 시작하기!</button>
    </div>

    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h1 id="gameover-title">🎉 신나는 조개 수확!</h1>
      <p id="gameover-desc">수달이 모은 조개: 0개</p>
      <button class="btn" id="restart-btn">다시 놀기</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level-display');
    const timerEl = document.getElementById('timer-display');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(freq, type = 'sine', duration = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessSound() {
      playSound(587.33, 'triangle', 0.08); // D5
      setTimeout(() => playSound(739.99, 'triangle', 0.08), 80); // F#5
      setTimeout(() => playSound(880.00, 'triangle', 0.15), 160); // A5
    }

    function playBubbleSound() {
      playSound(440 + Math.random() * 200, 'sine', 0.08);
    }

    let width, height;
    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = false;
    let score = 0;
    let timeLeft = 45;
    let timerInterval = null;

    const otter = {
      x: width / 2,
      y: height - 100,
      targetX: width / 2,
      size: 42,
      swimAngle: 0
    };

    let items = [];
    let ripples = [];
    let bubbles = [];

    // Background ripples & bubbles
    for (let i = 0; i < 15; i++) {
      bubbles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 3 + Math.random() * 6,
        speed: 0.8 + Math.random() * 1.5,
        opacity: 0.3 + Math.random() * 0.4
      });
    }

    function spawnItem() {
      if (!isPlaying) return;
      const rand = Math.random();
      let type = 'clam';
      let points = 10;
      let radius = 18;
      let color = '#FFCC80';

      if (rand < 0.2) {
        type = 'pearl-clam';
        points = 30;
        radius = 22;
        color = '#E1BEE7';
      } else if (rand < 0.35) {
        type = 'starfish';
        points = 20;
        radius = 18;
        color = '#FF8A65';
      } else if (rand < 0.5) {
        type = 'log'; // obstacle
        points = -10;
        radius = 20;
        color = '#8D6E63';
      }

      items.push({
        x: 35 + Math.random() * (width - 70),
        y: -30,
        vy: 2.2 + Math.random() * 2.2,
        vx: (Math.random() - 0.5) * 1.0,
        radius,
        type,
        points,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.08
      });
    }

    function createSplash(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3.5;
        ripples.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: 0.03 + Math.random() * 0.02,
          color,
          r: 2 + Math.random() * 4
        });
      }
    }

    function update() {
      if (!isPlaying) return;

      otter.x += (otter.targetX - otter.x) * 0.18;
      otter.swimAngle += 0.08;

      if (Math.random() < 0.04) {
        spawnItem();
      }

      // Bubbles
      bubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < -10) {
          b.y = height + 10;
          b.x = Math.random() * width;
        }
      });

      // Update items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.vy;
        item.x += item.vx;
        item.rotation += item.rotSpeed;

        // Collision with otter
        const dx = item.x - otter.x;
        const dy = item.y - (otter.y - 10);
        const dist = Math.hypot(dx, dy);

        if (dist < item.radius + otter.size * 0.6) {
          if (item.points > 0) {
            score += item.points;
            scoreEl.textContent = score;
            playSuccessSound();
            createSplash(item.x, item.y, '#80DEEA');
          } else {
            score = Math.max(0, score + item.points);
            scoreEl.textContent = score;
            playSound(180, 'sawtooth', 0.2);
            createSplash(item.x, item.y, '#8D6E63');
          }
          items.splice(i, 1);
          continue;
        }

        if (item.y > height + 40) {
          items.splice(i, 1);
        }
      }

      // Splash particles
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.x += r.vx;
        r.y += r.vy;
        r.life -= r.decay;
        if (r.life <= 0) {
          ripples.splice(i, 1);
        }
      }

      if (score >= 200) {
        levelEl.textContent = '깊은 강물 3단계';
      } else if (score >= 100) {
        levelEl.textContent = '시원한 물살 2단계';
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // River gradient background
      const riverGrad = ctx.createLinearGradient(0, 0, 0, height);
      riverGrad.addColorStop(0, '#B2EBF2');
      riverGrad.addColorStop(0.5, '#80DEEA');
      riverGrad.addColorStop(1, '#4DD0E1');
      ctx.fillStyle = riverGrad;
      ctx.fillRect(0, 0, width, height);

      // River wave lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 3;
      for (let y = 40; y < height; y += 60) {
        ctx.beginPath();
        const offset = Math.sin(otter.swimAngle + y * 0.05) * 15;
        ctx.moveTo(0, y + offset);
        for (let x = 0; x < width; x += 40) {
          ctx.quadraticCurveTo(x + 20, y + offset - 8, x + 40, y + offset);
        }
        ctx.stroke();
      }

      // Bubbles
      bubbles.forEach(b => {
        ctx.fillStyle = `rgba(255, 255, 255, ${b.opacity})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Items
      items.forEach(item => {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rotation);

        if (item.type === 'clam') {
          // Yellow Clam Shell
          ctx.fillStyle = '#FFCC80';
          ctx.beginPath();
          ctx.arc(0, 0, item.radius, Math.PI, 0, false);
          ctx.lineTo(0, item.radius * 0.4);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#FB8C00';
          ctx.lineWidth = 2;
          ctx.stroke();
          // Ridges
          ctx.beginPath();
          ctx.moveTo(-8, -4); ctx.lineTo(-2, 4);
          ctx.moveTo(0, -12); ctx.lineTo(0, 4);
          ctx.moveTo(8, -4); ctx.lineTo(2, 4);
          ctx.stroke();
        } else if (item.type === 'pearl-clam') {
          // Shimmering Purple Pearl Clam
          ctx.fillStyle = '#CE93D8';
          ctx.beginPath();
          ctx.arc(0, 0, item.radius, Math.PI, 0, false);
          ctx.lineTo(0, item.radius * 0.4);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#8E24AA';
          ctx.lineWidth = 2;
          ctx.stroke();
          // Pearl inside
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(0, -2, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#FFD54F';
          ctx.beginPath();
          ctx.arc(2, -4, 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'starfish') {
          // Coral Starfish
          ctx.fillStyle = '#FF8A65';
          ctx.beginPath();
          for (let p = 0; p < 5; p++) {
            const rot = (p * Math.PI * 2) / 5 - Math.PI / 2;
            const innerRot = rot + Math.PI / 5;
            ctx.lineTo(Math.cos(rot) * item.radius, Math.sin(rot) * item.radius);
            ctx.lineTo(Math.cos(innerRot) * (item.radius * 0.45), Math.sin(innerRot) * (item.radius * 0.45));
          }
          ctx.closePath();
          ctx.fill();
        } else if (item.type === 'log') {
          // River log obstacle
          ctx.fillStyle = '#6D4C41';
          ctx.fillRect(-item.radius, -item.radius * 0.4, item.radius * 2, item.radius * 0.8);
          ctx.fillStyle = '#8D6E63';
          ctx.beginPath();
          ctx.arc(item.radius, 0, item.radius * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      });

      // Particles
      ripples.forEach(r => {
        ctx.fillStyle = r.color;
        ctx.globalAlpha = Math.max(0, r.life);
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // Otter
      ctx.save();
      ctx.translate(otter.x, otter.y);

      // Water ripple around otter
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 10, otter.size * 1.1, otter.size * 0.5, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Otter Body (floating on back)
      ctx.fillStyle = '#8D6E63';
      ctx.beginPath();
      ctx.ellipse(0, 0, otter.size * 0.7, otter.size * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Otter Tummy (cream colored)
      ctx.fillStyle = '#D7CCC8';
      ctx.beginPath();
      ctx.ellipse(0, 8, otter.size * 0.45, otter.size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Otter Tail
      ctx.fillStyle = '#795548';
      ctx.beginPath();
      ctx.ellipse(0, otter.size * 0.9, otter.size * 0.25, otter.size * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Otter Head
      ctx.fillStyle = '#8D6E63';
      ctx.beginPath();
      ctx.arc(0, -otter.size * 0.7, otter.size * 0.45, 0, Math.PI * 2);
      ctx.fill();

      // Tiny Ears
      ctx.fillStyle = '#5D4037';
      ctx.beginPath();
      ctx.arc(-otter.size * 0.38, -otter.size * 0.95, 6, 0, Math.PI * 2);
      ctx.arc(otter.size * 0.38, -otter.size * 0.95, 6, 0, Math.PI * 2);
      ctx.fill();

      // Snout
      ctx.fillStyle = '#EFEBE9';
      ctx.beginPath();
      ctx.ellipse(0, -otter.size * 0.6, 12, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Nose
      ctx.fillStyle = '#3E2723';
      ctx.beginPath();
      ctx.arc(0, -otter.size * 0.65, 4, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#3E2723';
      ctx.beginPath();
      ctx.arc(-8, -otter.size * 0.75, 3.5, 0, Math.PI * 2);
      ctx.arc(8, -otter.size * 0.75, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(-7, -otter.size * 0.77, 1.2, 0, Math.PI * 2);
      ctx.arc(9, -otter.size * 0.77, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Paws holding hands on chest
      ctx.fillStyle = '#6D4C41';
      ctx.beginPath();
      ctx.arc(-8, -4, 6, 0, Math.PI * 2);
      ctx.arc(8, -4, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      score = 0;
      timeLeft = 45;
      items = [];
      ripples = [];
      scoreEl.textContent = score;
      levelEl.textContent = '맑은 여울 1단계';
      timerEl.textContent = `⏱️ ${timeLeft}s`;
      isPlaying = true;
      startOverlay.style.display = 'none';
      gameoverOverlay.style.display = 'none';

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      playSound(350, 'sine', 0.3);
      setTimeout(() => playSound(260, 'sine', 0.4), 300);
      document.getElementById('gameover-desc').textContent = `수달이 모은 조개: ${score}개 🐚`;
      gameoverOverlay.style.display = 'flex';
    }

    // Touch & Mouse Listeners
    function handleMove(clientX) {
      const rect = canvas.getBoundingClientRect();
      const relativeX = clientX - rect.left;
      otter.targetX = Math.max(otter.size, Math.min(width - otter.size, relativeX));
    }

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length > 0) {
        handleMove(e.touches[0].clientX);
      }
    }, { passive: false });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (e.touches.length > 0) {
        handleMove(e.touches[0].clientX);
        playBubbleSound();
      }
    }, { passive: false });

    canvas.addEventListener('mousemove', e => {
      handleMove(e.clientX);
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    gameLoop();
  </script>
</body>
</html>
