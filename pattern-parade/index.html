<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#251346">
  <link rel="icon" href="data:,">
  <title>패턴 퍼레이드</title>
  <style>
    :root { --bg:#251346; --panel:#3b2066; --accent:#ffcf5c; --pink:#ff72ad; --mint:#6df2ce; --text:#fffafd; --muted:#d8c8ec; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100vh; height:100dvh; overflow:hidden; touch-action:manipulation; font-family:Arial,"Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--text); }
    button, a { -webkit-tap-highlight-color:transparent; }
    .wrap { width:100%; max-width:480px; height:100vh; height:100dvh; margin:0 auto; padding:10px 12px 8px; display:flex; flex-direction:column; gap:8px; }
    h1 { text-align:center; font-size:clamp(20px,5.5vw,28px); line-height:1.15; }
    .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 12px; border-radius:14px; background:rgba(255,255,255,.09); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); font-size:14px; }
    .hud b { color:var(--accent); font-size:17px; }
    .game-area { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:12px; border-radius:20px; background:radial-gradient(circle at 50% 18%,#5d2d8d 0,#35205f 50%,#251844 100%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.09); overflow:hidden; }
    .stage { width:100%; display:flex; justify-content:space-between; color:var(--muted); font-size:13px; font-weight:800; }
    .track { position:relative; width:100%; padding:18px 8px; border-radius:18px; background:rgba(14,8,33,.46); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
    .track::before,.track::after { content:""; position:absolute; left:12px; right:12px; height:2px; background:linear-gradient(90deg,transparent,var(--pink),var(--accent),transparent); opacity:.65; }
    .track::before { top:8px; } .track::after { bottom:8px; }
    .pattern { min-height:66px; display:flex; justify-content:center; align-items:center; gap:clamp(5px,2vw,10px); }
    .tile { width:clamp(44px,14vw,62px); aspect-ratio:1; border-radius:16px; display:grid; place-items:center; background:#fff; color:#291643; font-size:clamp(25px,8vw,36px); box-shadow:0 7px 0 #cbb4e2,0 12px 24px #0004; }
    .tile.missing { background:linear-gradient(145deg,#ffcf5c,#ff9f68); color:#5b2b43; border:3px dashed #fff; animation:pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { to { transform:translateY(-3px) scale(1.04); } }
    .prompt { text-align:center; color:var(--mint); font-weight:900; min-height:24px; }
    .choices { width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .choice { min-height:64px; border:0; border-radius:16px; background:#fff; color:#281640; font-size:34px; font-weight:900; box-shadow:0 5px 0 #bda6d7; }
    .choice:active { transform:translateY(3px); box-shadow:0 2px 0 #866aa6; }
    .choice.correct { background:var(--mint); }
    .choice.wrong { background:#ff9ab7; }
    footer { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .home-link { color:var(--accent); font-weight:800; text-decoration:none; min-height:32px; display:flex; align-items:center; }
    .overlay { position:fixed; inset:0; display:grid; place-items:center; padding:20px; background:rgba(11,5,27,.84); backdrop-filter:blur(5px); z-index:10; }
    .overlay.hidden { display:none; }
    .overlay-card { width:min(360px,100%); padding:24px; border-radius:24px; background:#fff; color:#2b1747; text-align:center; display:grid; gap:14px; box-shadow:0 24px 70px #0008; }
    .overlay-card h2 { font-size:26px; }
    .overlay-card p { line-height:1.55; color:#604b74; }
    .result-score { color:#d85b98; font-size:32px; font-weight:900; }
    .btn-start { min-height:52px; border:0; border-radius:15px; background:var(--accent); color:#2b1747; font-size:19px; font-weight:900; }
    @media (max-height:620px) { .wrap{gap:5px;padding-top:6px}.game-area{gap:8px;padding:7px}.track{padding:12px 6px}.tile{width:42px}.choice{min-height:50px}.hud{padding:6px 10px} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
  </style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🎭 패턴 퍼레이드 — 반복되는 동물 규칙의 빈칸을 찾는 50초 패턴 놀이 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🎭 패턴 퍼레이드 | 장윤이 게임 놀이터">
<meta property="og:description" content="🎭 패턴 퍼레이드 — 반복되는 동물 규칙의 빈칸을 찾는 50초 패턴 놀이 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
  <main class="wrap">
    <h1>🎭 패턴 퍼레이드</h1>
    <div class="hud"><span>정답 <b id="score">0</b></span><span>최고 <b id="bestScore">0</b></span><span>시간 <b id="time">50</b></span></div>
    <section class="game-area" aria-label="패턴 맞추기 게임 영역">
      <div class="stage"><span id="level">1단계 · 두 친구</span><span id="streak">연속 0</span></div>
      <div class="track"><div class="pattern" id="pattern" aria-label="이모지 패턴"></div></div>
      <p class="prompt" id="message" aria-live="polite">물음표에 올 친구는 누구일까요?</p>
      <div class="choices" id="choices"></div>
    </section>
    <footer><small>반복되는 규칙을 천천히 찾아봐요</small><a class="home-link" href="../index.html">← 홈으로</a></footer>
  </main>

  <div class="overlay" id="startOverlay"><div class="overlay-card"><h2>🎭 규칙을 찾아요</h2><p>퍼레이드 친구들이 반복되는 모습을 보고, <b>❓ 자리에 올 친구</b>를 골라 주세요.</p><button class="btn-start" id="startBtn" type="button">시작!</button></div></div>
  <div class="overlay hidden" id="endOverlay"><div class="overlay-card"><h2>🎉 퍼레이드 완성!</h2><div class="result-score" id="finalScore">0개 정답</div><p id="resultMsg"></p><button class="btn-start" id="restartBtn" type="button">다시 하기</button></div></div>

  <script>
  (() => {
    'use strict';
    const CONFIG = { duration:50, storageKey:'pattern-parade_best', pool:['🦁','🐰','🐸','🐼','🦊','🐙','🦄','🐯','🐧','🐵'] };
    const state = { running:false, score:0, seconds:CONFIG.duration, streak:0, answer:'', timer:null, locked:false };
    const $ = id => document.getElementById(id);
    const els = { score:$('score'), best:$('bestScore'), time:$('time'), level:$('level'), streak:$('streak'), pattern:$('pattern'), choices:$('choices'), message:$('message'), start:$('startOverlay'), end:$('endOverlay'), final:$('finalScore'), result:$('resultMsg') };
    function best() { try { return Number(localStorage.getItem(CONFIG.storageKey) || 0); } catch (_) { return 0; } }
    function saveBest(value) { try { localStorage.setItem(CONFIG.storageKey, String(value)); } catch (_) {} }
    function shuffle(list) { return [...list].sort(() => Math.random() - .5); }
    function makeRound() {
      state.locked = false;
      const difficulty = state.score < 3 ? 1 : state.score < 7 ? 2 : 3;
      const friends = shuffle(CONFIG.pool).slice(0, difficulty === 3 ? 3 : 2);
      let sequence;
      if (difficulty === 1) sequence = [friends[0],friends[1],friends[0],friends[1],friends[0],friends[1]];
      else if (difficulty === 2) sequence = Math.random() < .5 ? [friends[0],friends[0],friends[1],friends[0],friends[0],friends[1]] : [friends[0],friends[1],friends[1],friends[0],friends[1],friends[1]];
      else sequence = Math.random() < .5 ? [friends[0],friends[1],friends[2],friends[0],friends[1],friends[2]] : [friends[0],friends[1],friends[2],friends[2],friends[1],friends[0]];
      const missing = difficulty === 1 ? 4 + Math.floor(Math.random() * 2) : 3 + Math.floor(Math.random() * 3);
      state.answer = sequence[missing];
      els.pattern.replaceChildren(...sequence.map((emoji,index) => {
        const tile = document.createElement('span'); tile.className = `tile${index === missing ? ' missing' : ''}`; tile.textContent = index === missing ? '❓' : emoji; return tile;
      }));
      const distractors = shuffle(CONFIG.pool.filter(item => item !== state.answer)).slice(0,2);
      const options = shuffle([state.answer,...distractors]);
      els.choices.replaceChildren(...options.map(emoji => {
        const button = document.createElement('button'); button.className = 'choice'; button.type = 'button'; button.dataset.emoji = emoji; button.textContent = emoji; button.setAttribute('aria-label',`${emoji} 선택`); return button;
      }));
      els.level.textContent = `${difficulty}단계 · ${difficulty === 1 ? '번갈아' : difficulty === 2 ? '두 번씩' : '세 친구'}`;
      els.message.textContent = '물음표에 올 친구는 누구일까요?';
    }
    function choose(button) {
      if (!state.running || state.locked) return;
      state.locked = true;
      if (button.dataset.emoji === state.answer) {
        state.score += 1; state.streak += 1; button.classList.add('correct');
        els.score.textContent = state.score; els.message.textContent = '딱 맞아요! 퍼레이드 출발 👏';
      } else {
        state.streak = 0; button.classList.add('wrong');
        const right = [...els.choices.children].find(item => item.dataset.emoji === state.answer); if (right) right.classList.add('correct');
        els.message.textContent = `${state.answer} 친구가 정답이에요. 다음엔 찾을 수 있어요!`;
      }
      els.streak.textContent = `연속 ${state.streak}`;
      window.setTimeout(() => { if (state.running) makeRound(); }, 650);
    }
    function startGame() {
      window.clearInterval(state.timer);
      state.running = true; state.score = 0; state.seconds = CONFIG.duration; state.streak = 0;
      els.score.textContent = '0'; els.time.textContent = state.seconds; els.best.textContent = best(); els.streak.textContent = '연속 0';
      els.start.classList.add('hidden'); els.end.classList.add('hidden'); makeRound();
      state.timer = window.setInterval(() => { state.seconds -= 1; els.time.textContent = state.seconds; if (state.seconds <= 0) endGame(); },1000);
    }
    function endGame() {
      if (!state.running) return;
      state.running = false; state.locked = true; window.clearInterval(state.timer);
      const record = Math.max(best(), state.score); saveBest(record); els.best.textContent = record;
      els.final.textContent = `${state.score}개 정답`;
      els.result.textContent = state.score >= 9 ? `규칙 찾기 최고! 최고 기록 ${record}개` : `차근차근 규칙을 찾았어요. 최고 기록 ${record}개`;
      els.end.classList.remove('hidden');
    }
    els.choices.addEventListener('pointerdown', event => { const button = event.target.closest('button[data-emoji]'); if (button) choose(button); });
    $('startBtn').addEventListener('pointerdown', startGame);
    $('restartBtn').addEventListener('pointerdown', startGame);
    els.best.textContent = best();
  })();
  </script>
</body>
</html>
