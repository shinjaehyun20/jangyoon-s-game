<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="cosmic-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="319" height="179" rx="12" fill="url(#cosmic-bg)" stroke="rgba(56,189,248,0.3)"/>
  <g transform="translate(30, 20)">
    <circle cx="50" cy="45" r="22" fill="#f97316" filter="url(#glow)"/>
    <circle cx="45" cy="40" r="10" fill="#fef08a"/>
    <path d="M50 20 L30 5" stroke="#f97316" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <circle cx="170" cy="35" r="26" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="165" cy="30" r="12" fill="#fde047"/>
    <text x="110" y="55" font-size="28" text-anchor="middle" filter="url(#glow)">⭐</text>
    <text x="210" y="70" font-size="24" text-anchor="middle">🛡️</text>
    <text x="110" y="115" font-size="42" text-anchor="middle" filter="url(#glow)">🚀</text>
  </g>
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="146" text-anchor="end" font-size="21" font-weight="900" fill="#38bdf8">우주 운석 대시</text>
    <text x="296" y="165" text-anchor="end" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">COSMIC METEOR DASH</text>
  </g>
</svg>