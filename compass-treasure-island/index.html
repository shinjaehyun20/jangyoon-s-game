<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>동서남북 방위표 보물섬 탐험대 (#067)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100vw; height: 100dvh; overflow: hidden;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(180deg, #E0F2FE 0%, #BAE6FD 50%, #FEF3C7 100%);
    color: #0F172A;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 10px 14px;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.95); border: 3px solid #0284C7;
    border-radius: 18px; padding: 8px 14px; height: 11dvh; min-height: 54px;
  }
  .title-wrap { display: flex; align-items: center; gap: 8px; }
  .title-text { font-size: 1.12rem; font-weight: 900; color: #0369A1; }
  .hud-group { display: flex; align-items: center; gap: 8px; }
  .badge {
    background: #FEF08A; border: 2px solid #F59E0B; border-radius: 14px;
    padding: 5px 10px; font-weight: 800; font-size: 0.92rem; color: #B45309;
  }
  .btn-util {
    background: #E0E7FF; border: 2px solid #4F46E5; border-radius: 12px;
    padding: 6px 10px; font-weight: 800; font-size: 0.88rem; color: #3730A3; cursor: pointer;
    min-height: 44px; display: inline-flex; align-items: center; text-decoration: none;
  }
  .stage {
    flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center;
  }
  .question-card {
    width: 100%; max-width: 520px; background: #FFFFFF;
    border: 4px solid #0284C7; border-radius: 22px; padding: 10px 16px; text-align: center;
    box-shadow: 0 6px 14px rgba(2,132,199,0.14);
  }
  .q-title { font-size: 1.18rem; font-weight: 900; color: #0F172A; margin-bottom: 4px; }
  .q-sub { font-size: 0.92rem; font-weight: 700; color: #475569; }
  .map-grid {
    width: 100%; max-width: 420px; background: rgba(255,255,255,0.92);
    border: 3px solid #F59E0B; border-radius: 22px; padding: 10px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .map-cell {
    height: 10.5dvh; min-height: 50px; max-height: 74px;
    border-radius: 14px; background: #F8FAFC; border: 2px solid #CBD5E1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: 0.95rem; color: #1E293B;
  }
  .map-cell.dir-active { background: #FEF9C3; border: 3px solid #F59E0B; }
  .map-cell.center-cell { background: #DBEAFE; border: 3px solid #2563EB; color: #1D4ED8; }
  .choices-wrap {
    width: 100%; max-width: 520px; background: rgba(255,255,255,0.95);
    border: 3px solid #0284C7; border-radius: 22px; padding: 10px;
  }
  .choices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .choice-btn {
    min-height: 54px; border-radius: 16px; border: 3px solid #38BDF8;
    background: #F0F9FF; font-size: 1.16rem; font-weight: 900; color: #0C4A6E;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .choice-btn:active { transform: scale(0.96); }
  .feedback-bar {
    height: 6.5dvh; min-height: 38px; display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; font-weight: 900; color: #047857; text-align: center;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.72);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #FFFFFF; border: 5px solid #0284C7; border-radius: 26px;
    padding: 24px 20px; max-width: 420px; width: 100%; text-align: center;
  }
  .modal h1 { font-size: 1.52rem; color: #0369A1; margin-bottom: 10px; }
  .modal p { font-size: 1.04rem; color: #334155; font-weight: 700; line-height: 1.5; margin-bottom: 18px; }
  .btn-start {
    width: 100%; min-height: 54px; border-radius: 16px; border: none;
    background: #0284C7; color: #FFFFFF; font-size: 1.22rem; font-weight: 900; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="title-wrap">
      <a href="../../index.html" class="btn-util">← 홈으로</a>
      <span class="title-text">🧭 동서남북 보물섬 탐험</span>
    </div>
    <div class="hud-group">
      <span class="badge" id="progressBadge">1 / 8단계</span>
      <span class="badge" id="scoreBadge">점수 0점</span>
      <button class="btn-util" id="soundBtn" type="button">🔊 소리 켜짐</button>
    </div>
  </div>

  <div class="stage">
    <div class="question-card">
      <div class="q-title" id="qTitle">탐험가에서 북쪽(↑)에는 무엇이 있을까요?</div>
      <div class="q-sub" id="qHint">방위표 기준: 위쪽은 북(↑), 아래쪽은 남(↓), 왼쪽은 서(←), 오른쪽은 동(→)</div>
    </div>

    <div class="map-grid" id="mapGrid"></div>

    <div class="choices-wrap">
      <div class="choices-grid" id="choicesGrid"></div>
    </div>
  </div>

  <div class="feedback-bar" id="feedbackBar">방위표 화살표 방향을 보고 알맞은 보물섬 장소를 골라 보세요!</div>

  <div class="overlay" id="startOverlay">
    <div class="modal">
      <h1>🧭 동서남북 방위표 보물섬</h1>
      <p>장윤이 캡틴! 보물지도에서는<br>위쪽이 북쪽(↑), 아래쪽이 남쪽(↓),<br>왼쪽이 서쪽(←), 오른쪽이 동쪽(→)이에요.<br>방위표를 보고 보물을 찾아볼까요?</p>
      <button class="btn-start" id="startBtn" type="button">보물섬 항해 출발!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="modal">
      <h1>🎉 동서남북 보물지도 완성!</h1>
      <p id="endSummary">8개의 방위표 문제를 모두 멋지게 해결했어요!</p>
      <button class="btn-start" id="restartBtn" type="button">한 번 더 탐험하기</button>
    </div>
  </div>

<script>
const QUESTIONS = [
  { ask: "탐험가의 북쪽(↑)에 있는 것은 무엇일까요?", n: "🌋 화산섬", s: "🏖️ 모래해변", w: "🌴 야자수", e: "🗼 등대", ans: "🌋 화산섬" },
  { ask: "탐험가의 동쪽(→)에 있는 것은 무엇일까요?", n: "🌋 화산섬", s: "🏖️ 모래해변", w: "🌴 야자수", e: "🗼 등대", ans: "🗼 등대" },
  { ask: "탐험가의 남쪽(↓)에 있는 것은 무엇일까요?", n: "🏰 산호성", s: "🐳 고래바위", w: "⚓ 닻마을", e: "⛵ 범선항구", ans: "🐳 고래바위" },
  { ask: "탐험가의 서쪽(←)에 있는 것은 무엇일까요?", n: "🏰 산호성", s: "🐳 고래바위", w: "⚓ 닻마을", e: "⛵ 범선항구", ans: "⚓ 닻마을" },
  { ask: "'💎 황금보물함'은 탐험가의 어느 쪽에 있나요?", n: "💎 황금보물함", s: "🐢 거북이섬", w: "🦀 꽃게바위", e: "🐚 소라동굴", ans: "북쪽 (↑)" },
  { ask: "'🐚 소라동굴'은 탐험가의 어느 쪽에 있나요?", n: "💎 황금보물함", s: "🐢 거북이섬", w: "🦀 꽃게바위", e: "🐚 소라동굴", ans: "동쪽 (→)" },
  { ask: "'🐢 거북이섬'은 탐험가의 어느 쪽에 있나요?", n: "💎 황금보물함", s: "🐢 거북이섬", w: "🦀 꽃게바위", e: "🐚 소라동굴", ans: "남쪽 (↓)" },
  { ask: "'🦀 꽃게바위'는 탐험가의 어느 쪽에 있나요?", n: "💎 황금보물함", s: "🐢 거북이섬", w: "🦀 꽃게바위", e: "🐚 소라동굴", ans: "서쪽 (←)" }
];

let idx = 0, score = 0, soundOn = true, locked = false;
const STORAGE_KEY = "compass-treasure-island_best";
let audioCtx = null;

function playTone(freq, dur) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = "triangle";
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function renderQuestion() {
  locked = false;
  const q = QUESTIONS[idx];
  document.getElementById("progressBadge").textContent = (idx + 1) + " / " + QUESTIONS.length + "단계";
  document.getElementById("scoreBadge").textContent = "점수 " + score + "점";
  document.getElementById("qTitle").textContent = q.ask;

  const mapGrid = document.getElementById("mapGrid");
  mapGrid.innerHTML = "";
  const layout = [
    { text: "🧭 방위표", cls: "map-cell" },
    { text: "북(↑) " + q.n, cls: "map-cell dir-active" },
    { text: "🌊 바다", cls: "map-cell" },
    { text: "서(←) " + q.w, cls: "map-cell dir-active" },
    { text: "🧑‍✈️ 탐험가", cls: "map-cell center-cell" },
    { text: "동(→) " + q.e, cls: "map-cell dir-active" },
    { text: "🌊 바다", cls: "map-cell" },
    { text: "남(↓) " + q.s, cls: "map-cell dir-active" },
    { text: "🗺️ 보물지도", cls: "map-cell" }
  ];
  layout.forEach(item => {
    const d = document.createElement("div");
    d.className = item.cls;
    d.textContent = item.text;
    mapGrid.appendChild(d);
  });

  const choices = idx < 4 ? [q.n, q.e, q.s, q.w] : ["북쪽 (↑)", "동쪽 (→)", "남쪽 (↓)", "서쪽 (←)"];
  const grid = document.getElementById("choicesGrid");
  grid.innerHTML = "";
  choices.forEach(ch => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-btn";
    btn.textContent = ch;
    btn.addEventListener("pointerdown", () => handleChoice(ch));
    grid.appendChild(btn);
  });
}

function handleChoice(ch) {
  if (locked) return;
  const q = QUESTIONS[idx];
  if (ch === q.ans) {
    locked = true;
    score += 10;
    document.getElementById("scoreBadge").textContent = "점수 " + score + "점";
    document.getElementById("feedbackBar").textContent = "정답! '" + ch + "' 방향을 정확하게 찾았어요!";
    playTone(523.25, 0.14); setTimeout(() => playTone(659.25, 0.18), 120);
    setTimeout(() => {
      idx++;
      if (idx < QUESTIONS.length) {
        renderQuestion();
      } else {
        const best = Math.max(score, Number(localStorage.getItem(STORAGE_KEY) || 0));
        localStorage.setItem(STORAGE_KEY, String(best));
        document.getElementById("endSummary").textContent = "최종 점수 " + score + "점! (최고 기록 " + best + "점) 동서남북 방위표 박사가 되었어요!";
        document.getElementById("endOverlay").classList.remove("hidden");
      }
    }, 900);
  } else {
    playTone(220, 0.2);
    document.getElementById("feedbackBar").textContent = "아하, 위(북↑)·아래(남↓)·왼쪽(서←)·오른쪽(동→)을 다시 살펴볼까요?";
  }
}

document.getElementById("soundBtn").addEventListener("pointerdown", () => {
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent = soundOn ? "🔊 소리 켜짐" : "🔇 소리 꺼짐";
});
document.getElementById("startBtn").addEventListener("pointerdown", () => {
  document.getElementById("startOverlay").classList.add("hidden");
  idx = 0; score = 0; renderQuestion();
});
document.getElementById("restartBtn").addEventListener("pointerdown", () => {
  document.getElementById("endOverlay").classList.add("hidden");
  idx = 0; score = 0; renderQuestion();
});
</script>
</body>
</html>
