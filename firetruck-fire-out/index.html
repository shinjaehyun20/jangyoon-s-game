<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🚒 삐뽀삐뽀 소방차 불 끄기</title>
  <style>
    :root {
      --bg: #1a1a24;
      --accent: #ff4757;
      --text: #ffffff;
      --bubble: #54a0ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 12px 14px 10px; gap: 8px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(20px, 5.5vw, 24px);
      text-align: center;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: bold;
    }
    .hud span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #gameArea {
      flex: 1;
      position: relative;
      background: rgba(0, 0, 0, 0.25);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      overflow: hidden;
    }
    .fire {
      position: absolute;
      font-size: clamp(40px, 12vw, 55px);
      cursor: pointer;
      user-select: none;
      animation: flame 0.5s infinite alternate ease-in-out;
      transform-origin: bottom center;
    }
    @keyframes flame {
      0% { transform: scale(1) rotate(-3deg); }
      100% { transform: scale(1.15) rotate(3deg); }
    }
    .water-particle {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: splash 0.4s ease-out forwards;
    }
    @keyframes splash {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }
    .home-link {
      color: var(--bubble);
      text-decoration: none;
      font-weight: bold;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      width: 85%;
      max-width: 360px;
      background: #2f3542;
      border: 3px solid var(--accent);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .overlay-card h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: var(--accent);
    }
    .overlay-card p {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.8);
    }
    .btn-start {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      min-height: 48px;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.1s;
    }
    .btn-start:active {
      transform: scale(0.95);
    }
    .result-score {
      font-size: 48px;
      font-weight: 900;
      color: #ffda79;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🚒 불을 꺼라! 소방대장 장윤</h1>
    <div class="hud">
      <span>⏱️ <span id="timeVal">30</span>초</span>
      <span>🔥 끈 불: <span id="scoreVal">0</span>개</span>
      <span>🏆 최고: <span id="bestVal">0</span></span>
    </div>
    <div id="gameArea"></div>
    <footer>
      <small>불을 터치해서 시원한 물방울로 꺼주세요!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🚒 삐뽀삐뽀 소방대장</h2>
      <p>마을에 불이 났어요! 소방차 물대포를 쏴서 활활 타는 불(🔥)을 터치해 꺼주세요! 30초 동안 불을 몇 개 끌 수 있을까요?</p>
      <button class="btn-start" id="startBtn">출동하기!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 임무 완료!</h2>
      <div class="result-score" id="finalScore">0</div>
      <p id="resultMsg"></p>
      <button class="btn-start" id="restartBtn">다시 출동!</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const CONFIG = {
      gameDuration: 30,
      spawnInterval: 900,
      maxFires: 8,
      bestScoreKey: 'firetruck-fire-out_best'
    };
    const state = {
      score: 0,
      timeLeft: CONFIG.gameDuration,
      isPlaying: false,
      timerId: null,
      spawnId: null
    };

    const dom = {
      gameArea: document.getElementById('gameArea'),
      timeVal: document.getElementById('timeVal'),
      scoreVal: document.getElementById('scoreVal'),
      bestVal: document.getElementById('bestVal'),
      startOverlay: document.getElementById('startOverlay'),
      endOverlay: document.getElementById('endOverlay'),
      startBtn: document.getElementById('startBtn'),
      restartBtn: document.getElementById('restartBtn'),
      finalScore: document.getElementById('finalScore'),
      resultMsg: document.getElementById('resultMsg')
    };

    const loadBestScore = () => {
      const best = localStorage.getItem(CONFIG.bestScoreKey) || 0;
      dom.bestVal.textContent = best;
      return parseInt(best, 10);
    };
    let bestScore = loadBestScore();

    const spawnFire = () => {
      if (!state.isPlaying) return;
      const currentFires = dom.gameArea.getElementsByClassName('fire').length;
      if (currentFires >= CONFIG.maxFires) return;

      const fire = document.createElement('div');
      fire.className = 'fire';
      fire.textContent = '🔥';
      
      const size = 55;
      const areaWidth = dom.gameArea.clientWidth;
      const areaHeight = dom.gameArea.clientHeight;
      const rx = Math.random() * (areaWidth - size - 10) + 5;
      const ry = Math.random() * (areaHeight - size - 10) + 5;
      
      fire.style.left = rx + 'px';
      fire.style.top = ry + 'px';

      fire.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        extinguish(fire, rx + size/2, ry + size/2);
      });

      dom.gameArea.appendChild(fire);
    };

    const extinguish = (fireEl, fx, fy) => {
      if (!state.isPlaying) return;
      
      for (let i = 0; i < 6; i++) {
        createSplash(fx, fy);
      }

      fireEl.remove();
      state.score++;
      dom.scoreVal.textContent = state.score;
      
      setTimeout(spawnFire, 100);
    };

    const createSplash = (x, y) => {
      const particle = document.createElement('div');
      particle.className = 'water-particle';
      particle.textContent = '💧';
      particle.style.left = (x - 12) + 'px';
      particle.style.top = (y - 12) + 'px';
      
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 60 + 20;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;
      
      particle.style.setProperty('--tx', tx + 'px');
      particle.style.setProperty('--ty', ty + 'px');
      
      dom.gameArea.appendChild(particle);
      setTimeout(() => particle.remove(), 400);
    };

    const startGame = () => {
      dom.gameArea.innerHTML = '';
      state.score = 0;
      state.timeLeft = CONFIG.gameDuration;
      state.isPlaying = true;
      
      dom.scoreVal.textContent = '0';
      dom.timeVal.textContent = state.timeLeft;
      dom.startOverlay.classList.add('hidden');
      dom.endOverlay.classList.add('hidden');

      for(let i=0; i<3; i++) spawnFire();
      state.spawnId = setInterval(spawnFire, CONFIG.spawnInterval);

      state.timerId = setInterval(() => {
        state.timeLeft--;
        dom.timeVal.textContent = state.timeLeft;
        if (state.timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    };

    const endGame = () => {
      state.isPlaying = false;
      clearInterval(state.timerId);
      clearInterval(state.spawnId);
      
      if (state.score > bestScore) {
        bestScore = state.score;
        localStorage.setItem(CONFIG.bestScoreKey, bestScore);
        dom.bestVal.textContent = bestScore;
        dom.resultMsg.textContent = '👑 최고 기록 갱신! 장윤 소방대장 최고예요!';
      } else {
        dom.resultMsg.textContent = '마을을 안전하게 구했어요! 정말 대단해요! 👍';
      }

      dom.finalScore.textContent = state.score + '점';
      dom.endOverlay.classList.remove('hidden');
    };

    dom.startBtn.addEventListener('pointerdown', startGame);
    dom.restartBtn.addEventListener('pointerdown', startGame);
  })();
  </script>
</body>
</html>
