<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>빨래 색깔 분류</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:Arial,sans-serif;background:#dff6ff;color:#11324d}.wrap{max-width:480px;height:100%;margin:auto;padding:10px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud,footer{display:flex;justify-content:space-between;background:#fff;border-radius:14px;padding:10px}.game{flex:1;display:flex;flex-direction:column;justify-content:space-around;align-items:center}.cloth{font-size:76px;filter:drop-shadow(0 6px 3px #0002)}.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}.bin,.btn{min-height:68px;border:0;border-radius:18px;font-size:19px;font-weight:900;color:#fff}.red{background:#ef476f}.blue{background:#118ab2}.yellow{background:#e9a800}.msg{min-height:25px;font-weight:800}.home{color:#11324d}.overlay{position:fixed;inset:0;background:#0019;display:grid;place-items:center;padding:20px}.card{background:#fff;border-radius:22px;padding:24px;max-width:350px;text-align:center;display:grid;gap:14px}.hidden{display:none}
</style><!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🧺 빨래 색깔 분류 — 옷 색을 보고 같은 색 바구니를 골라 40초 동안 빨래를 정리하는 생활 학습 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🧺 빨래 색깔 분류 | 장윤이 게임 놀이터">
<meta property="og:description" content="🧺 빨래 색깔 분류 — 옷 색을 보고 같은 색 바구니를 골라 40초 동안 빨래를 정리하는 생활 학습 게임 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head><body><main class="wrap"><h1>🧺 빨래 색깔 분류</h1><div class="hud"><b>정리 <span id="score">0</span></b><b>시간 <span id="time">40</span></b></div><section class="game"><div class="cloth" id="cloth">👕</div><p class="msg" id="msg">같은 색 바구니를 눌러요!</p><div class="bins"><button class="bin red" data-c="red">빨강</button><button class="bin blue" data-c="blue">파랑</button><button class="bin yellow" data-c="yellow">노랑</button></div></section><footer><small>색을 보고 빠르게 골라요</small><a class="home" href="../index.html">← 홈으로</a></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🧺 빨래 정리 시간</h2><p>옷 색과 같은 바구니를 눌러요. 틀려도 점수는 줄지 않아요.</p><button class="btn blue" id="startBtn">시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>✨ 정리 끝!</h2><b id="finalScore"></b><p id="best"></p><button class="btn blue" id="restartBtn">다시 하기</button></div></div><script>
(()=>{'use strict';const COLORS={red:'#ef476f',blue:'#118ab2',yellow:'#ffd166'},ICONS=['👕','🧦','👚','🩳'];let answer,score=0,left=40,timer;const $=id=>document.getElementById(id);function next(){const ks=Object.keys(COLORS);answer=ks[Math.floor(Math.random()*ks.length)];$('cloth').textContent=ICONS[Math.floor(Math.random()*ICONS.length)];$('cloth').style.background=COLORS[answer];$('cloth').style.borderRadius='22px';$('cloth').style.padding='8px 18px'}function pick(c){if(c===answer){score++;$('score').textContent=score;$('msg').textContent='쏙! 잘했어요 👏';next()}else $('msg').textContent='색을 한 번 더 봐요 🙂'}function start(){score=0;left=40;$('score').textContent=0;$('time').textContent=left;$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');next();clearInterval(timer);timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0)end()},1000)}function end(){clearInterval(timer);const old=+(localStorage.getItem('laundry-sort_best')||0),best=Math.max(old,score);localStorage.setItem('laundry-sort_best',best);$('finalScore').textContent=`${score}벌 정리!`;$('best').textContent=`최고 기록 ${best}벌`;$('endOverlay').classList.remove('hidden')};document.querySelector('.bins').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&left>0)pick(b.dataset.c)});$('startBtn').onclick=start;$('restartBtn').onclick=start})();
</script></body></html>
