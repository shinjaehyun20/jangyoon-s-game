<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c24"/>
      <stop offset="60%" stop-color="#121e42"/>
      <stop offset="100%" stop-color="#182c3f"/>
    </linearGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(200,240,255,0.1)"/>
    </linearGradient>
    <radialGradient id="glowYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff880" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffe600" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#a4f832" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a4f832" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0ffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night Sky & Stars -->
  <rect width="400" height="300" fill="url(#nightSky)"/>
  
  <!-- Starfield & Constellation lines -->
  <circle cx="50" cy="40" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="120" cy="70" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="180" cy="45" r="2.5" fill="#ffec80" opacity="0.95"/>
  <circle cx="250" cy="80" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="330" cy="50" r="2.5" fill="#a0ffff" opacity="0.9"/>
  <circle cx="370" cy="90" r="1.5" fill="#fff" opacity="0.7"/>
  <path d="M50 40 L120 70 L180 45 L250 80 L330 50" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="3,3" stroke-width="1.2" fill="none"/>

  <!-- Moon Crescent -->
  <path d="M330 35 A22 22 0 0 0 352 57 A22 22 0 1 1 330 35 Z" fill="#fff4aa" filter="url(#softGlow)"/>

  <!-- Gentle Forest Silhouette -->
  <path d="M0 250 Q60 230 140 245 T280 235 T400 250 L400 300 L0 300 Z" fill="#081426"/>
  <path d="M0 265 Q90 255 190 268 T380 260 L400 300 L0 300 Z" fill="#040b15"/>

  <!-- Glowing Firefly Jar -->
  <g transform="translate(250, 160)">
    <!-- Jar Body -->
    <rect x="0" y="20" width="70" height="90" rx="14" fill="url(#jarGlass)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <rect x="8" y="10" width="54" height="12" rx="4" fill="rgba(255,255,255,0.5)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
    <rect x="12" y="4" width="46" height="8" rx="3" fill="#c89666"/>
    <!-- Jar Internal Light -->
    <circle cx="35" cy="65" r="30" fill="url(#glowYellow)" opacity="0.8"/>
    <circle cx="28" cy="55" r="5" fill="#fff" filter="url(#softGlow)"/>
    <circle cx="45" cy="70" r="4" fill="#a4f832" filter="url(#softGlow)"/>
    <circle cx="32" cy="80" r="3.5" fill="#ffeb3b" filter="url(#softGlow)"/>
  </g>

  <!-- Big Fireflies Fluttering -->
  <g transform="translate(100, 140)">
    <circle cx="0" cy="0" r="26" fill="url(#glowYellow)"/>
    <ellipse cx="0" cy="0" rx="6" ry="9" fill="#1b2a1a"/>
    <ellipse cx="-4" cy="-5" rx="5" ry="3" fill="rgba(255,255,255,0.7)" transform="rotate(-30, -4, -5)"/>
    <ellipse cx="4" cy="-5" rx="5" ry="3" fill="rgba(255,255,255,0.7)" transform="rotate(30, 4, -5)"/>
    <circle cx="0" cy="4" r="5" fill="#fff" filter="url(#softGlow)"/>
  </g>

  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="22" fill="url(#glowCyan)"/>
    <ellipse cx="0" cy="0" rx="5" ry="8" fill="#112233"/>
    <ellipse cx="-4" cy="-4" rx="4" ry="2.5" fill="rgba(255,255,255,0.7)" transform="rotate(-25, -4, -4)"/>
    <ellipse cx="4" cy="-4" rx="4" ry="2.5" fill="rgba(255,255,255,0.7)" transform="rotate(25, 4, -4)"/>
    <circle cx="0" cy="3" r="4" fill="#e0ffff" filter="url(#softGlow)"/>
  </g>

  <!-- Title Badge -->
  <rect x="20" y="22" width="160" height="34" rx="17" fill="rgba(0,0,0,0.5)" stroke="rgba(255,235,59,0.5)" stroke-width="1.5"/>
  <text x="32" y="45" font-family="'Malgun Gothic', sans-serif" font-size="14" font-weight="bold" fill="#ffe600">✨ 별밤 반딧불이 동산</text>
</svg>
