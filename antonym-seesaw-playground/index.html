<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>출렁출렁 반대말 시소 놀이터 (#063)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100vw; height: 100dvh; overflow: hidden;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(180deg, #E0F2FE 0%, #FEF9C3 65%, #DCFCE7 100%);
    color: #0F172A;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 10px 14px;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.94); border: 3px solid #0284C7;
    border-radius: 18px; padding: 8px 14px; height: 11dvh; min-height: 54px;
  }
  .title-wrap { display: flex; align-items: center; gap: 8px; }
  .title-text { font-size: 1.15rem; font-weight: 900; color: #0369A1; }
  .hud-group { display: flex; align-items: center; gap: 8px; }
  .badge {
    background: #FEF08A; border: 2px solid #F59E0B; border-radius: 14px;
    padding: 5px 10px; font-weight: 800; font-size: 0.92rem; color: #B45309;
  }
  .btn-util {
    background: #E0E7FF; border: 2px solid #4F46E5; border-radius: 12px;
    padding: 6px 10px; font-weight: 800; font-size: 0.88rem; color: #3730A3; cursor: pointer;
    min-height: 44px; display: inline-flex; align-items: center; text-decoration: none;
  }
  .stage {
    flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center;
  }
  .question-card {
    width: 100%; max-width: 520px; background: #FFFFFF;
    border: 4px solid #F59E0B; border-radius: 22px; padding: 12px 16px; text-align: center;
    box-shadow: 0 6px 14px rgba(245,158,11,0.16);
  }
  .q-title { font-size: 1.25rem; font-weight: 900; color: #1E293B; margin-bottom: 4px; }
  .q-sub { font-size: 0.95rem; font-weight: 700; color: #475569; }
  .seesaw-box {
    width: 100%; max-width: 520px; height: 28dvh; min-height: 150px;
    background: rgba(255,255,255,0.88); border: 3px dashed #16A34A; border-radius: 22px;
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px;
  }
  .beam {
    width: 88%; height: 14px; background: #D97706; border-radius: 8px;
    position: relative; transition: transform 0.35s ease;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .beam.tilted { transform: rotate(-8deg); }
  .beam.balanced { transform: rotate(0deg); }
  .seat {
    width: 128px; height: 86px; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; transform: translateY(-16px);
  }
  .seat-left { background: #DBEAFE; border: 3px solid #2563EB; color: #1E3A8A; }
  .seat-right { background: #FCE7F3; border: 3px solid #DB2777; color: #831843; }
  .seat-emoji { font-size: 1.9rem; line-height: 1.1; }
  .seat-word { font-size: 1.25rem; margin-top: 2px; }
  .fulcrum {
    width: 0; height: 0;
    border-left: 26px solid transparent; border-right: 26px solid transparent;
    border-bottom: 38px solid #047857; margin-top: -2px;
  }
  .choices-wrap {
    width: 100%; max-width: 520px; background: rgba(255,255,255,0.95);
    border: 3px solid #0284C7; border-radius: 22px; padding: 12px;
  }
  .choices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .choice-btn {
    min-height: 58px; border-radius: 16px; border: 3px solid #38BDF8;
    background: #F0F9FF; font-size: 1.2rem; font-weight: 900; color: #0C4A6E;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.1s;
  }
  .choice-btn:active { transform: scale(0.96); }
  .feedback-bar {
    height: 7dvh; min-height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 900; color: #047857; text-align: center;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.72);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #FFFFFF; border: 5px solid #0284C7; border-radius: 26px;
    padding: 24px 20px; max-width: 420px; width: 100%; text-align: center;
  }
  .modal h1 { font-size: 1.6rem; color: #0369A1; margin-bottom: 10px; }
  .modal p { font-size: 1.05rem; color: #334155; font-weight: 700; line-height: 1.5; margin-bottom: 18px; }
  .btn-start {
    width: 100%; min-height: 54px; border-radius: 16px; border: none;
    background: #0284C7; color: #FFFFFF; font-size: 1.25rem; font-weight: 900; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="title-wrap">
      <a href="../../index.html" class="btn-util">← 홈으로</a>
      <span class="title-text">⚖️ 반대말 시소 놀이터</span>
    </div>
    <div class="hud-group">
      <span class="badge" id="progressBadge">1 / 8단계</span>
      <span class="badge" id="scoreBadge">점수 0점</span>
      <button class="btn-util" id="soundBtn" type="button">🔊 소리 켜짐</button>
    </div>
  </div>

  <div class="stage">
    <div class="question-card">
      <div class="q-title" id="qTitle">왼쪽 낱말과 뜻이 정반대인 낱말을 골라 시소 균형을 맞춰 주세요!</div>
      <div class="q-sub" id="qHint">힌트: 크기가 서로 반대예요</div>
    </div>

    <div class="seesaw-box">
      <div class="beam tilted" id="seesawBeam">
        <div class="seat seat-left">
          <div class="seat-emoji" id="leftEmoji">🐘</div>
          <div class="seat-word" id="leftWord">크다</div>
        </div>
        <div class="seat seat-right">
          <div class="seat-emoji" id="rightEmoji">❓</div>
          <div class="seat-word" id="rightWord">반대말은?</div>
        </div>
      </div>
      <div class="fulcrum"></div>
    </div>

    <div class="choices-wrap">
      <div class="choices-grid" id="choicesGrid"></div>
    </div>
  </div>

  <div class="feedback-bar" id="feedbackBar">알맞은 반대말 카드를 터치해 보세요!</div>

  <div class="overlay" id="startOverlay">
    <div class="modal">
      <h1>⚖️ 출렁출렁 반대말 시소 놀이터</h1>
      <p>장윤이 안녕! 시소 왼쪽에 앉은 낱말 친구와<br>뜻이 정반대인 짝꿍 낱말을 찾아 시소를 수평으로 맞춰 볼까요?</p>
      <button class="btn-start" id="startBtn" type="button">신나는 시소 타기 시작!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="modal">
      <h1>🎉 반대말 시소 박사님 탄생!</h1>
      <p id="endSummary">8문제를 모두 멋지게 해결했어요!</p>
      <button class="btn-start" id="restartBtn" type="button">한 번 더 놀이하기</button>
    </div>
  </div>

<script>
const QUESTIONS = [
  { leftWord: "크다", leftEmoji: "🐘", ansWord: "작다", ansEmoji: "🐜", hint: "코끼리는 몸집이 크고, 개미는 몸집이 작아요!", choices: [["작다","🐜"],["높다","⛰️"],["길다","📏"],["많다","🍎"]] },
  { leftWord: "길다", leftEmoji: "🚂", ansWord: "짧다", ansEmoji: "✏️", hint: "기차는 길고, 몽당연필은 짧아요!", choices: [["넓다","🏟️"],["짧다","✏️"],["무겁다","🪨"],["빠르다","🐆"]] },
  { leftWord: "밝다", leftEmoji: "☀️", ansWord: "어둡다", ansEmoji: "🌙", hint: "낮에는 해가 떠서 밝고, 밤에는 깜깜하고 어두워요!", choices: [["따뜻하다","🧣"],["시원하다","🌬️"],["어둡다","🌙"],["맑다","🌈"]] },
  { leftWord: "무겁다", leftEmoji: "🏋️", ansWord: "가볍다", ansEmoji: "🪶", hint: "바위는 무겁고, 새의 깃털은 사뿐히 가벼워요!", choices: [["가볍다","🪶"],["딱딱하다","🧱"],["두껍다","📕"],["깊다","🌊"]] },
  { leftWord: "빠르다", leftEmoji: "🚄", ansWord: "느리다", ansEmoji: "🐢", hint: "고속열차는 빠르고, 거북이는 엉금엉금 느려요!", choices: [["가깝다","🏠"],["느리다","🐢"],["바쁘다","⏰"],["높다","🦒"]] },
  { leftWord: "덥다", leftEmoji: "🥵", ansWord: "춥다", ansEmoji: "⛄", hint: "여름에는 땀이 나게 덥고, 겨울에는 눈사람처럼 추워요!", choices: [["미지근하다","🍵"],["매콤하다","🌶️"],["춥다","⛄"],["시끄럽다","🥁"]] },
  { leftWord: "열다", leftEmoji: "🚪", ansWord: "닫다", ansEmoji: "🔒", hint: "아침에 창문을 활짝 열고, 밤에는 문을 꼭 닫아요!", choices: [["닫다","🔒"],["넣다","🎒"],["켜다","💡"],["오르다","🪜"]] },
  { leftWord: "들어가다", leftEmoji: "🏠", ansWord: "나오다", ansEmoji: "🚶", hint: "교실 안으로 들어가고, 운동장 밖으로 나와요!", choices: [["올라가다","🎈"],["건너가다","🌉"],["나오다","🚶"],["돌아가다","🔄"]] }
];

let idx = 0, score = 0, soundOn = true, locked = false;
const STORAGE_KEY = "antonym-seesaw-playground_best";
let audioCtx = null;

function playTone(freq, dur) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = "triangle";
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function renderQuestion() {
  locked = false;
  const q = QUESTIONS[idx];
  document.getElementById("progressBadge").textContent = (idx + 1) + " / " + QUESTIONS.length + "단계";
  document.getElementById("scoreBadge").textContent = "점수 " + score + "점";
  document.getElementById("qHint").textContent = "힌트: " + q.hint;
  document.getElementById("leftEmoji").textContent = q.leftEmoji;
  document.getElementById("leftWord").textContent = q.leftWord;
  document.getElementById("rightEmoji").textContent = "❓";
  document.getElementById("rightWord").textContent = "반대말은?";
  document.getElementById("seesawBeam").className = "beam tilted";
  document.getElementById("feedbackBar").textContent = "'" + q.leftWord + "'의 반대말 카드를 골라 보세요!";

  const grid = document.getElementById("choicesGrid");
  grid.innerHTML = "";
  q.choices.forEach(([word, emo]) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-btn";
    btn.innerHTML = "<span>" + emo + "</span><span>" + word + "</span>";
    btn.addEventListener("pointerdown", () => handleChoice(word, emo));
    grid.appendChild(btn);
  });
}

function handleChoice(word, emo) {
  if (locked) return;
  const q = QUESTIONS[idx];
  if (word === q.ansWord) {
    locked = true;
    score += 10;
    document.getElementById("rightEmoji").textContent = emo;
    document.getElementById("rightWord").textContent = word;
    document.getElementById("seesawBeam").className = "beam balanced";
    document.getElementById("scoreBadge").textContent = "점수 " + score + "점";
    document.getElementById("feedbackBar").textContent = "정답이에요! '" + q.leftWord + "' ↔ '" + word + "' 시소 균형 성공!";
    playTone(523.25, 0.14); setTimeout(() => playTone(659.25, 0.18), 120);
    setTimeout(() => {
      idx++;
      if (idx < QUESTIONS.length) {
        renderQuestion();
      } else {
        const best = Math.max(score, Number(localStorage.getItem(STORAGE_KEY) || 0));
        localStorage.setItem(STORAGE_KEY, String(best));
        document.getElementById("endSummary").textContent = "최종 점수 " + score + "점! (최고 기록 " + best + "점) 반대말 8쌍을 모두 완성했어요!";
        document.getElementById("endOverlay").classList.remove("hidden");
      }
    }, 950);
  } else {
    playTone(220, 0.2);
    document.getElementById("feedbackBar").textContent = "아하, '" + word + "' 말고 힌트를 보고 다시 골라 볼까요?";
  }
}

document.getElementById("soundBtn").addEventListener("pointerdown", () => {
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent = soundOn ? "🔊 소리 켜짐" : "🔇 소리 꺼짐";
});
document.getElementById("startBtn").addEventListener("pointerdown", () => {
  document.getElementById("startOverlay").classList.add("hidden");
  idx = 0; score = 0; renderQuestion();
});
document.getElementById("restartBtn").addEventListener("pointerdown", () => {
  document.getElementById("endOverlay").classList.add("hidden");
  idx = 0; score = 0; renderQuestion();
});
</script>
</body>
</html>
