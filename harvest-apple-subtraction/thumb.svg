<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74b9ff" />
      <stop offset="60%" stop-color="#a8e6cf" />
      <stop offset="100%" stop-color="#ffd3b6" />
    </linearGradient>
    <linearGradient id="apple-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7675" />
      <stop offset="50%" stop-color="#d63031" />
      <stop offset="100%" stop-color="#b71540" />
    </linearGradient>
    <linearGradient id="basket-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e1b12c" />
      <stop offset="50%" stop-color="#c2901a" />
      <stop offset="100%" stop-color="#7f5700" />
    </linearGradient>
    <linearGradient id="bear-fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d3a075" />
      <stop offset="100%" stop-color="#a06030" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.18)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#sky-bg)" />

  <!-- Apple Tree Leaves (Green Cloud) -->
  <circle cx="120" cy="90" r="90" fill="#2ed573" opacity="0.85" />
  <circle cx="230" cy="70" r="100" fill="#26de81" opacity="0.9" />
  <circle cx="340" cy="80" r="85" fill="#20bf6b" opacity="0.85" />
  <circle cx="440" cy="110" r="80" fill="#2ed573" opacity="0.8" />

  <!-- Hanging Apples on Tree -->
  <g transform="translate(140, 100)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="url(#apple-red)" />
    <path d="M-6,-24 Q0,-32 8,-28" stroke="#6d4c41" stroke-width="4" fill="none" stroke-linecap="round" />
    <ellipse cx="6" cy="-28" rx="7" ry="4" fill="#2ed573" transform="rotate(-30 6 -28)" />
    <circle cx="-8" cy="-8" r="6" fill="#fff" opacity="0.6" />
  </g>
  <g transform="translate(260, 90)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="30" fill="url(#apple-red)" />
    <path d="M-6,-26 Q0,-34 8,-30" stroke="#6d4c41" stroke-width="4" fill="none" stroke-linecap="round" />
    <ellipse cx="6" cy="-30" rx="8" ry="4" fill="#2ed573" transform="rotate(-30 6 -30)" />
    <circle cx="-9" cy="-9" r="7" fill="#fff" opacity="0.6" />
  </g>
  <g transform="translate(380, 115)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="26" fill="url(#apple-red)" />
    <path d="M-5,-22 Q0,-30 7,-26" stroke="#6d4c41" stroke-width="4" fill="none" stroke-linecap="round" />
    <ellipse cx="5" cy="-26" rx="7" ry="4" fill="#2ed573" transform="rotate(-30 5 -26)" />
    <circle cx="-8" cy="-8" r="5" fill="#fff" opacity="0.6" />
  </g>

  <!-- Ground Hill -->
  <path d="M 0 420 Q 256 360 512 420 L 512 512 L 0 512 Z" fill="#7bed9f" />

  <!-- Cute Bear Character (Bomi) -->
  <g transform="translate(130, 310)" filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="-42" cy="-55" r="20" fill="url(#bear-fur)" />
    <circle cx="-42" cy="-55" r="10" fill="#ffb8b8" />
    <circle cx="42" cy="-55" r="20" fill="url(#bear-fur)" />
    <circle cx="42" cy="-55" r="10" fill="#ffb8b8" />
    <!-- Head -->
    <ellipse cx="0" cy="-20" rx="55" ry="48" fill="url(#bear-fur)" />
    <!-- Cheeks -->
    <circle cx="-32" cy="-8" r="10" fill="#ff7675" opacity="0.5" />
    <circle cx="32" cy="-8" r="10" fill="#ff7675" opacity="0.5" />
    <!-- Snout & Nose -->
    <ellipse cx="0" cy="-10" rx="22" ry="16" fill="#fff5eb" />
    <ellipse cx="0" cy="-16" rx="9" ry="6" fill="#2f3542" />
    <path d="M -6 -7 Q 0 -2 6 -7" stroke="#2f3542" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="-20" cy="-24" r="6" fill="#2f3542" />
    <circle cx="-18" cy="-26" r="2.5" fill="#fff" />
    <circle cx="20" cy="-24" r="6" fill="#2f3542" />
    <circle cx="22" cy="-26" r="2.5" fill="#fff" />
    <!-- Body -->
    <path d="M -40 25 C -40 70 40 70 40 25 Z" fill="url(#bear-fur)" />
    <!-- Hand holding apple -->
    <circle cx="45" cy="18" r="14" fill="url(#bear-fur)" />
  </g>

  <!-- Wicker Apple Basket -->
  <g transform="translate(350, 350)" filter="url(#shadow)">
    <!-- Basket Body -->
    <path d="M -70 -20 L -50 70 Q 0 85 50 70 L 70 -20 Z" fill="url(#basket-wood)" />
    <!-- Basket Rim -->
    <ellipse cx="0" cy="-20" rx="72" ry="14" fill="#f1c40f" stroke="#b7860b" stroke-width="3" />
    <!-- Apples inside basket -->
    <circle cx="-30" cy="-25" r="24" fill="url(#apple-red)" />
    <circle cx="25" cy="-20" r="24" fill="url(#apple-red)" />
    <circle cx="-2" cy="-35" r="26" fill="url(#apple-red)" />
    <circle cx="-8" cy="-42" r="6" fill="#fff" opacity="0.6" />
    <!-- Math Badge: 7 - 3 = 4 -->
    <rect x="-80" y="85" width="160" height="42" rx="21" fill="#ffffff" stroke="#ff4757" stroke-width="3" filter="url(#shadow)" />
    <text x="0" y="114" font-family="'Pretendard', sans-serif" font-weight="900" font-size="24" fill="#ff4757" text-anchor="middle">7 - 3 = 4</text>
  </g>

  <!-- Title Pill -->
  <rect x="56" y="440" width="400" height="48" rx="24" fill="rgba(255,255,255,0.95)" filter="url(#shadow)" />
  <text x="256" y="472" font-family="'Pretendard', sans-serif" font-weight="800" font-size="22" fill="#2f3542" text-anchor="middle">🍎 가을 사과 뺄셈 바구니</text>
</svg>
