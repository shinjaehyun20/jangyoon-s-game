<style>

  html, body {
    width: 100%; height: 100vh; height: 100dvh; overflow: hidden;

  .metric-box span { color: #fde047; }
  .hud-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);

  #blueprintSvg { width: 100%; height: 100%; }

  .palette-tray {
    width: 100%; background: rgba(30, 41, 59, 0.9); border-radius: 14px;
    padding: 10px; border: 1.5px solid rgba(129, 140, 248, 0.3);
    display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;

  .tray-title { font-size: 13px; font-weight: 800; color: #a5b4fc; text-align: center; }
  .block-list {
    display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 60px;
  }
  .shape-block {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px 10px; background: rgba(15, 23, 42, 0.95); border-radius: 12px;
    border: 2px solid transparent; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
    min-height: 48px; min-width: 58px;
  }
  .shape-block:active { transform: scale(0.92); }
  .shape-block.selected {
    border-color: #fde047; box-shadow: 0 0 12px rgba(253, 224, 71, 0.6);
    transform: translateY(-3px);
  }
  .shape-icon { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
  .shape-name { font-size: 11px; font-weight: 800; color: #e2e8f0; margin-top: 2px; }

  .overlay {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.94);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 24px; border-radius: 18px; z-index: 50; text-align: center; gap: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay-badge { font-size: 54px; }
  .overlay-title { font-size: 24px; font-weight: 900; color: #fde047; }
  .overlay-desc { font-size: 14px; color: #cbd5e1; line-height: 1.6; }
  .btn-primary {

<script>
(function() {
  // Web Audio Synth
  let audioCtx = null;
  let muted = false;
  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, dur, type = 'sine') {
    if (muted) return;
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  }

  function playSuccess() {
    playTone(523.25, 0.12, 'sine'); // C5
    setTimeout(() => playTone(659.25, 0.12, 'sine'), 80); // E5
    setTimeout(() => playTone(783.99, 0.2, 'sine'), 160); // G5
  }

  function playWrong() {
    playTone(261.63, 0.15, 'sawtooth');
  }

  function playClearFanfare() {
    const melody = [523.25, 659.25, 783.99, 1046.5];
    melody.forEach((f, i) => {

        { id: 's2', type: 'tri', label: '큰 세모 돛', points: '150,40 150,150 70,150', color: '#f59e0b', shape: 'tri' },
        { id: 's3', type: 'tri', label: '작은 세모 돛', points: '155,70 155,150 220,150', color: '#10b981', shape: 'tri' }
      ]
    },
    {
      id: 'rocket',
      name: '🚀 꼬마 로켓',
      slots: [
        { id: 's1', type: 'rect', label: '로켓 몸체', x: 115, y: 80, w: 70, h: 100, color: '#6366f1', shape: 'rect' },
        { id: 's2', type: 'tri', label: '세모 머리', points: '150,20 115,80 185,80', color: '#ef4444', shape: 'tri' },
        { id: 's3', type: 'tri', label: '왼쪽 날개', points: '115,140 70,180 115,180', color: '#f59e0b', shape: 'tri' },
        { id: 's4', type: 'tri', label: '오른쪽 날개', points: '185,140 230,180 185,180', color: '#f59e0b', shape: 'tri' },

        { id: 's5', type: 'circle', label: '방울 목걸이', cx: 150, cy: 140, r: 12, color: '#ec4899', shape: 'circle' }

    },

      ]
    },
    {
      id: 'castle',
      name: '🏰 무지개 성',
      slots: [
        { id: 's1', type: 'rect', label: '중앙 성벽', x: 110, y: 110, w: 80, h: 80, color: '#9333ea', shape: 'rect' },
        { id: 's2', type: 'rect', label: '왼쪽 탑', x: 55, y: 80, w: 45, h: 110, color: '#3b82f6', shape: 'rect' },
        { id: 's3', type: 'rect', label: '오른쪽 탑', x: 200, y: 80, w: 45, h: 110, color: '#3b82f6', shape: 'rect' },
        { id: 's4', type: 'tri', label: '왼쪽 지붕', points: '77,35 50,80 105,80', color: '#f43f5e', shape: 'tri' },
        { id: 's5', type: 'tri', label: '오른쪽 지붕', points: '222,35 195,80 250,80', color: '#f43f5e', shape: 'tri' },
        { id: 's6', type: 'circle', label: '아치 문', cx: 150, cy: 165, r: 18, color: '#fde047', shape: 'circle' }
      ]
    },
    {
      id: 'bird',
      name: '🐤 아기 새',
      slots: [
        { id: 's1', type: 'circle', label: '통통 몸통', cx: 135, cy: 135, r: 42, color: '#facc15', shape: 'circle' },
        { id: 's2', type: 'circle', label: '동글 머리', cx: 185, cy: 90, r: 28, color: '#fef08a', shape: 'circle' },
        { id: 's3', type: 'tri', label: '뾰족 부리', points: '213,85 240,92 213,100', color: '#f97316', shape: 'tri' },
        { id: 's4', type: 'tri', label: '세모 날개', points: '120,120 70,140 135,160', color: '#fb923c', shape: 'tri' },
        { id: 's5', type: 'circle', label: '초롱초롱 눈', cx: 195, cy: 82, r: 6, color: '#1e293b', shape: 'circle' }
      ]
    }
  ];

  // Game State
  const state = {
    levelIdx: 0,
    score: 0,
    selectedBlock: null,
    placedSlots: new Set(),
    confettiParticles: []
  };

  // Elements
  const levelVal = document.getElementById('levelVal');
  const scoreVal = document.getElementById('scoreVal');
  const stageName = document.getElementById('stageName');
  const stagePrompt = document.getElementById('stagePrompt');
  const svg = document.getElementById('blueprintSvg');
  const blockList = document.getElementById('blockList');
  const startOverlay = document.getElementById('startOverlay');
  const clearOverlay = document.getElementById('clearOverlay');
  const clearSummary = document.getElementById('clearSummary');
  const confettiCanvas = document.getElementById('confettiCanvas');
  const ctxConfetti = confettiCanvas.getContext('2d');
  const muteBtn = document.getElementById('muteBtn');
  const hintBtn = document.getElementById('hintBtn');

  function resizeConfetti() {
    const rect = confettiCanvas.parentElement.getBoundingClientRect();
    confettiCanvas.width = rect.width;
    confettiCanvas.height = rect.height;
  }

  function spawnConfetti() {
    resizeConfetti();
    const colors = ['#f43f5e', '#38bdf8', '#fde047', '#4ade80', '#c084fc', '#fb923c'];
    for (let i = 0; i < 45; i++) {
      state.confettiParticles.push({
        x: confettiCanvas.width / 2,
        y: confettiCanvas.height / 2,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.7) * 9,
        size: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1.0,
        decay: Math.random() * 0.02 + 0.015
      });
    }
  }

  function updateConfetti() {
    ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    for (let i = state.confettiParticles.length - 1; i >= 0; i--) {
      const p = state.confettiParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2; // gravity
      p.life -= p.decay;
      if (p.life <= 0) {
        state.confettiParticles.splice(i, 1);
        continue;
      }
      ctxConfetti.save();
      ctxConfetti.globalAlpha = p.life;
      ctxConfetti.fillStyle = p.color;
      ctxConfetti.beginPath();
      ctxConfetti.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctxConfetti.fill();
      ctxConfetti.restore();
    }
    requestAnimationFrame(updateConfetti);
  }
  requestAnimationFrame(updateConfetti);

  function loadStage(idx) {
    state.levelIdx = idx;
    state.placedSlots.clear();
    state.selectedBlock = null;
    levelVal.textContent = String(idx + 1);

    const bp = BLUEPRINTS[idx];
    stageName.textContent = bp.name;
    stagePrompt.textContent = '알맞은 모양 블록을 골라 쏙 넣어요!';

    // Render SVG Slots
    svg.innerHTML = '';
    bp.slots.forEach(slot => {
      let el;
      if (slot.type === 'rect') {
        el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        el.setAttribute('x', slot.x);
        el.setAttribute('y', slot.y);
        el.setAttribute('width', slot.w);
        el.setAttribute('height', slot.h);
        el.setAttribute('rx', '6');
      } else if (slot.type === 'circle') {
        el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        el.setAttribute('cx', slot.cx);
        el.setAttribute('cy', slot.cy);
        el.setAttribute('r', slot.r);
      } else if (slot.type === 'tri' || slot.type === 'trapezoid') {
        el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        el.setAttribute('points', slot.points);
      }
      el.setAttribute('id', 'slot-' + slot.id);
      el.setAttribute('fill', 'rgba(255, 255, 255, 0.05)');
      el.setAttribute('stroke', 'rgba(165, 180, 252, 0.6)');
      el.setAttribute('stroke-width', '2.5');
      el.setAttribute('stroke-dasharray', '5 4');
      el.style.cursor = 'pointer';
      el.style.transition = 'all 0.3s ease';

      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleSlotClick(slot);
      });
      svg.appendChild(el);
    });

    renderPalette(bp);
  }

  function getShapeSvgIcon(shape) {
    if (shape === 'circle') {
      return '<svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="#fde047"/></svg>';
    } else if (shape === 'tri') {
      return '<svg width="28" height="28" viewBox="0 0 28 28"><polygon points="14,3 3,25 25,25" fill="#f43f5e"/></svg>';
    } else if (shape === 'rect') {
      return '<svg width="28" height="28" viewBox="0 0 28 28"><rect x="4" y="4" width="20" height="20" rx="3" fill="#38bdf8"/></svg>';
    } else if (shape === 'trapezoid') {
      return '<svg width="28" height="28" viewBox="0 0 28 28"><polygon points="6,6 22,6 26,22 2,22" fill="#a855f7"/></svg>';
    }
    return '';
  }

  function getShapeNameKo(shape) {
    if (shape === 'circle') return '동그라미';
    if (shape === 'tri') return '세모';
    if (shape === 'rect') return '네모';
    if (shape === 'trapezoid') return '사다리꼴';
    return '도형';
  }

  function renderPalette(bp) {
    blockList.innerHTML = '';
    // Collect required shape types + 1 decoy shape
    const needed = bp.slots.map(s => s.shape);
    const uniqueShapes = Array.from(new Set(needed));
    if (uniqueShapes.length < 4) {
      const allPossible = ['circle', 'tri', 'rect', 'trapezoid'];
      for (let s of allPossible) {
        if (!uniqueShapes.includes(s)) {
          uniqueShapes.push(s);
          break;
        }
      }
    }

    uniqueShapes.forEach(shape => {
      const btn = document.createElement('div');
      btn.className = 'shape-block';
      btn.innerHTML = `
        <div class="shape-icon">${getShapeSvgIcon(shape)}</div>
        <div class="shape-name">${getShapeNameKo(shape)}</div>
      `;
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        selectShape(shape, btn);
      });
      blockList.appendChild(btn);
    });
  }

  function selectShape(shape, btnEl) {
    state.selectedBlock = shape;
    document.querySelectorAll('.shape-block').forEach(b => b.classList.remove('selected'));
    if (btnEl) btnEl.classList.add('selected');
    playTone(440, 0.08, 'sine');
    stagePrompt.textContent = `[${getShapeNameKo(shape)}] 선택! 설계도의 빈자리를 터치하세요.`;
  }

  function handleSlotClick(slot) {
    if (state.placedSlots.has(slot.id)) return;

    if (!state.selectedBlock) {
      stagePrompt.textContent = '먼저 아래 모양 블록을 하나 골라보세요! 👇';
      playTone(330, 0.1, 'sine');
      return;
    }

    if (slot.shape === state.selectedBlock) {
      // Correct!
      state.placedSlots.add(slot.id);
      state.score += 20;
      scoreVal.textContent = String(state.score);
      playSuccess();

      // Animate slot
      const el = document.getElementById('slot-' + slot.id);
      if (el) {
        el.setAttribute('fill', slot.color);
        el.setAttribute('stroke', '#ffffff');
        el.removeAttribute('stroke-dasharray');
        el.style.transform = 'scale(1.04)';
        setTimeout(() => el.style.transform = 'scale(1)', 180);
      }

      spawnConfetti();
      stagePrompt.textContent = `딩동댕! 멋진 [${slot.label}] 완성! 🎉`;

      // Check stage complete
      const bp = BLUEPRINTS[state.levelIdx];
      if (state.placedSlots.size === bp.slots.length) {
        stagePrompt.textContent = `축하합니다! ${bp.name} 완성! ✨`;
        playClearFanfare();

        setTimeout(() => {
          if (state.levelIdx + 1 < BLUEPRINTS.length) {
            loadStage(state.levelIdx + 1);
          } else {
            // All cleared!
            clearSummary.textContent = `모든 8개 건축물을 환상적으로 완성했어요! 총 점수: ${state.score}점`;
            clearOverlay.classList.remove('hidden');
          }
        }, 1200);
      }
    } else {
      // Wrong shape
      playWrong();
      stagePrompt.textContent = `여기는 [${getShapeNameKo(slot.shape)}] 자리예요! 다시 골라봐요.`;
      const el = document.getElementById('slot-' + slot.id);
      if (el) {
        el.setAttribute('stroke', '#ef4444');
        setTimeout(() => el.setAttribute('stroke', 'rgba(165, 180, 252, 0.6)'), 400);
      }
    }
  }

  // Hint
  hintBtn.addEventListener('click', () => {
    const bp = BLUEPRINTS[state.levelIdx];
    const unfilled = bp.slots.find(s => !state.placedSlots.has(s.id));
    if (unfilled) {
      selectShape(unfilled.shape, null);
      // find button
      const allBtns = document.querySelectorAll('.shape-block');
      allBtns.forEach(b => {
        if (b.textContent.includes(getShapeNameKo(unfilled.shape))) {
          b.classList.add('selected');
        }
      });
      const el = document.getElementById('slot-' + unfilled.id);
      if (el) {
        el.setAttribute('stroke', '#fde047');
        setTimeout(() => {
          if (!state.placedSlots.has(unfilled.id)) {
            el.setAttribute('stroke', 'rgba(165, 180, 252, 0.6)');
          }
        }, 800);
      }
      stagePrompt.textContent = `💡 힌트: 깜빡이는 [${unfilled.label}]에 쏙 넣어보세요!`;
    }
  });

  // Mute
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  function startGame() {
    startOverlay.classList.add('hidden');
    clearOverlay.classList.add('hidden');
    state.score = 0;
    scoreVal.textContent = '0';
    loadStage(0);
    playTone(523.25, 0.15, 'sine');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  window.addEventListener('resize', resizeConfetti);
})();
</script>
</body>
</html>
