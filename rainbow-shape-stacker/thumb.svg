<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="318" height="178" rx="18" fill="url(#bgGrad)" stroke="#818cf8" stroke-width="2"/>
  <circle cx="40" cy="30" r="16" fill="url(#sunGrad)" opacity="0.8"/>
  <g transform="translate(195, 30)">
    <!-- House made of shapes -->
    <!-- Triangle Roof -->
    <polygon points="45,10 5,60 85,60" fill="url(#roofGrad)" stroke="#fff" stroke-width="2"/>
    <!-- Square Body -->
    <rect x="15" y="60" width="60" height="60" rx="4" fill="url(#wallGrad)" stroke="#fff" stroke-width="2"/>
    <!-- Circle Window -->
    <circle cx="45" cy="80" r="12" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <!-- Rectangle Door -->
    <rect x="35" y="96" width="20" height="24" rx="2" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Star on top -->
    <polygon points="45,0 48,7 55,7 50,11 52,18 45,14 38,18 40,11 35,7 42,7" fill="#fbbf24"/>
    <!-- Floating side shapes -->
    <circle cx="-20" cy="40" r="12" fill="#a855f7" stroke="#fff" stroke-width="1.5"/>
    <rect x="85" y="35" width="22" height="22" rx="4" fill="#10b981" stroke="#fff" stroke-width="1.5" transform="rotate(25 96 46)"/>
  </g>
  <g font-family="Pretendard, Noto Sans KR, sans-serif" font-weight="700" fill="#f8fafc">
    <text x="18" y="46" font-size="20" fill="#fde047">알록달록</text>
    <text x="18" y="76" font-size="22" fill="#ffffff">모양 블록 쌓기</text>
    <rect x="18" y="94" width="70" height="22" rx="6" fill="#38bdf8"/>
    <text x="53" y="109" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">초1 수학</text>
    <text x="18" y="140" font-size="11" fill="#c7d2fe">동그라미 세모 네모로</text>
    <text x="18" y="156" font-size="11" fill="#c7d2fe">멋진 건축물 완성!</text>
  </g>
</svg>
