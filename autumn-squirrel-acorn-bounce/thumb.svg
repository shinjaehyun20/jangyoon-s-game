<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDEBD0" />
      <stop offset="60%" stop-color="#F5CBA7" />
      <stop offset="100%" stop-color="#EDBB99" />
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D35400" />
      <stop offset="100%" stop-color="#A04000" />
    </linearGradient>
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9E79F" stop-opacity="1" />
      <stop offset="100%" stop-color="#F39C12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Autumn Leaves Breeze -->
  <path d="M 40,60 Q 60,50 80,70 Q 50,85 40,60 Z" fill="#E74C3C" opacity="0.6" transform="rotate(15 60 65)" />
  <path d="M 320,40 Q 340,30 360,50 Q 330,65 320,40 Z" fill="#F39C12" opacity="0.7" transform="rotate(-25 340 45)" />
  <path d="M 70,220 Q 90,210 110,230 Q 80,245 70,220 Z" fill="#E67E22" opacity="0.5" transform="rotate(40 90 225)" />
  <path d="M 330,230 Q 350,220 370,240 Q 340,255 330,230 Z" fill="#C0392B" opacity="0.6" transform="rotate(-15 350 235)" />

  <!-- Falling Acorns -->
  <g transform="translate(100, 70)">
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#784212" />
    <path d="M -16,-6 Q 0,-20 16,-6 Z" fill="#4A235A" />
    <line x1="0" y1="-14" x2="4" y2="-22" stroke="#4A235A" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Golden Acorn (Center Top) -->
  <g transform="translate(200, 50)">
    <circle cx="0" cy="0" r="28" fill="url(#goldAura)" />
    <ellipse cx="0" cy="0" rx="16" ry="20" fill="#F39C12" />
    <path d="M -18,-6 Q 0,-22 18,-6 Z" fill="#B7950B" />
    <line x1="0" y1="-16" x2="3" y2="-24" stroke="#7D6608" stroke-width="3" stroke-linecap="round" />
    <circle cx="-5" cy="-2" r="3" fill="#FFF" opacity="0.6" />
  </g>

  <!-- Acorn Right -->
  <g transform="translate(290, 85)">
    <ellipse cx="0" cy="0" rx="13" ry="17" fill="#6E2C00" />
    <path d="M -15,-5 Q 0,-18 15,-5 Z" fill="#512E5F" />
    <line x1="0" y1="-12" x2="2" y2="-19" stroke="#512E5F" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Ground -->
  <rect x="0" y="270" width="400" height="30" fill="#E59866" />
  <rect x="0" y="270" width="400" height="4" fill="#D35400" />

  <!-- Squirrel Character -->
  <g transform="translate(200, 195)">
    <!-- Fluffy Tail -->
    <path d="M 25,20 C 60,10 75,-30 45,-45 C 20,-55 10,-20 20,-5 Z" fill="#935116" />
    <path d="M 28,15 C 55,8 65,-22 42,-35 C 22,-43 15,-15 24,-5 Z" fill="#B9770E" opacity="0.6" />

    <!-- Squirrel Body -->
    <ellipse cx="0" cy="20" rx="30" ry="26" fill="#B9770E" />
    <ellipse cx="0" cy="24" rx="18" ry="17" fill="#FDEBD0" />

    <!-- Head -->
    <circle cx="0" cy="-6" r="24" fill="#B9770E" />

    <!-- Ears -->
    <circle cx="-16" cy="-24" r="8" fill="#935116" />
    <circle cx="-16" cy="-24" r="4" fill="#FADBD8" />
    <circle cx="16" cy="-24" r="8" fill="#935116" />
    <circle cx="16" cy="-24" r="4" fill="#FADBD8" />

    <!-- Eyes -->
    <circle cx="-8" cy="-8" r="4.5" fill="#1A1A1A" />
    <circle cx="-9.5" cy="-9.5" r="1.5" fill="#FFFFFF" />
    <circle cx="8" cy="-8" r="4.5" fill="#1A1A1A" />
    <circle cx="6.5" cy="-9.5" r="1.5" fill="#FFFFFF" />

    <!-- Cheeks & Nose -->
    <circle cx="-14" cy="-2" r="5" fill="#F1948A" opacity="0.7" />
    <circle cx="14" cy="-2" r="5" fill="#F1948A" opacity="0.7" />
    <ellipse cx="0" cy="-1" rx="3" ry="2" fill="#6E2C00" />

    <!-- Mouth -->
    <path d="M -4,4 Q 0,8 4,4" fill="none" stroke="#6E2C00" stroke-width="1.8" stroke-linecap="round" />

    <!-- Basket -->
    <rect x="-42" y="-22" width="84" height="26" rx="8" fill="url(#basketGrad)" stroke="#6E2C00" stroke-width="2" />
    <line x1="-38" y1="-14" x2="38" y2="-14" stroke="#F5CBA7" stroke-width="2" stroke-linecap="round" />
    <!-- Acorns in Basket -->
    <circle cx="-20" cy="-24" r="7" fill="#784212" />
    <circle cx="0" cy="-26" r="8" fill="#F39C12" />
    <circle cx="20" cy="-24" r="7" fill="#784212" />
  </g>
</svg>
