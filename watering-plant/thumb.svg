<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dff3e3"/>
      <stop offset="50%" style="stop-color:#a8d8b0"/>
      <stop offset="100%" style="stop-color:#1b3a2b"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- 배경 새싹 장식 -->
  <text x="20" y="150" font-size="22" opacity="0.35">🌿</text>
  <text x="55" y="130" font-size="18" opacity="0.3">🌱</text>
  <text x="90" y="155" font-size="16" opacity="0.3">🌿</text>

  <!-- 메인 식물 -->
  <text x="150" y="115" font-size="70" text-anchor="middle">🌻</text>

  <!-- 물방울 -->
  <text x="205" y="60" font-size="20">💧</text>
  <text x="230" y="90" font-size="16">💧</text>

  <!-- 제목 -->
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="22" font-weight="900" fill="#2e7d32">식물 키우기</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(27,58,43,0.6)" letter-spacing="2">WATERING PLANT</text>
  </g>
