<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🌱 물뿌리개로 식물 키우기</title>
  <style>
    :root {
      --bg: #1b3a2b;
      --accent: #66bb6a;
      --water: #4fc3f7;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(180deg, #dff3e3 0%, #a8d8b0 45%, #1b3a2b 100%);
      color: #1b3a2b;
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 8px; gap: 8px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(20px, 5.5vw, 28px);
      text-align: center;
      text-shadow: 0 2px 8px rgba(255,255,255,0.5);
    }
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.55);
      border-radius: 12px; padding: 8px 16px;
      font-size: 16px; font-weight: bold;
    }
    .hud .round { color: #2e7d32; }
    .hud .score { color: #ef6c00; }
    .hud .best { color: #558b2f; font-size: 13px; }
    #gameArea {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(76,175,80,0.15) 100%);
      overflow: hidden;
      padding-bottom: 10px;
    }
    #plantStage {
      font-size: clamp(60px, 20vw, 110px);
      transition: transform 0.25s ease;
      user-select: none; -webkit-user-select: none;
    }
    #plantStage.grow { animation: growPop 0.35s ease; }
    @keyframes growPop {
      0% { transform: scale(0.8); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    #plantStage.wilt { animation: wiltShake 0.35s ease; filter: grayscale(0.4); }
    @keyframes wiltShake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
    .gauge-wrap {
      width: 88%;
      max-width: 380px;
      margin-top: 10px;
    }
    .gauge-label {
      font-size: 13px; font-weight: bold; margin-bottom: 4px;
      display: flex; justify-content: space-between;
      color: #1b3a2b;
    }
    .gauge-bar {
      height: 22px;
      background: rgba(255,255,255,0.6);
      border-radius: 11px;
      overflow: hidden;
      border: 2px solid rgba(27,58,43,0.25);
    }
    .gauge-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #4fc3f7, #29b6f6);
      transition: width 0.15s ease;
    }
    .gauge-fill.danger { background: linear-gradient(90deg, #ef5350, #e53935); }
    #canBtn {
      margin-top: 14px;
      width: 100%;
      max-width: 380px;
      min-height: 56px;
      background: linear-gradient(135deg, #4fc3f7, #0288d1);
      color: white; border: none; border-radius: 16px;
      font-size: 20px; font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(2,136,209,0.4);
      transition: transform 0.08s;
    }
    #canBtn:active { transform: scale(0.95); }
    footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 0;
    }
    footer small { font-size: 12px; opacity: 0.85; }
    .home-link {
      color: #1b5e20; text-decoration: none;
      font-size: 13px; font-weight: bold;
      background: rgba(255,255,255,0.6);
      padding: 6px 12px; border-radius: 8px;
      min-height: 44px; display: flex; align-items: center;
    }
    .overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.65);
      z-index: 100;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: linear-gradient(135deg, #a8d8b0, #dff3e3);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      max-width: 320px; width: 90%;
      color: #1b3a2b;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .overlay-card h2 { font-size: 26px; margin-bottom: 12px; }
    .overlay-card p { font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
    .result-score { font-size: 44px; font-weight: 900; color: #2e7d32; margin: 12px 0; }
    .btn-start {
      background: linear-gradient(135deg, #66bb6a, #2e7d32);
      color: white; border: none; border-radius: 12px;
      font-size: 18px; font-weight: bold;
      padding: 14px 32px; cursor: pointer;
      min-height: 44px; width: 100%;
      box-shadow: 0 4px 12px rgba(46,125,50,0.4);
      transition: transform 0.1s;
    }
    .btn-start:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🌱 식물 키우기</h1>

    <div class="hud">
      <span class="round">🌼 라운드 <span id="roundDisplay">1</span>/<span id="roundTotal">6</span></span>
      <span class="score">🏆 <span id="scoreDisplay">0</span>점</span>
      <span class="best">최고 <span id="bestDisplay">0</span></span>
    </div>

    <div id="gameArea">
      <div id="plantStage">🌰</div>
      <div class="gauge-wrap">
        <div class="gauge-label"><span>💧 물量</span><span id="gaugeText">40%</span></div>
        <div class="gauge-bar"><div class="gauge-fill" id="gaugeFill"></div></div>
      </div>
      <button id="canBtn">💦 물 주기</button>
    </div>

    <footer>
      <small>딱 맞게 물을 줘야 쑥쑥 자라요!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🌱 식물 키우기</h2>
      <p><strong>💦 물 주기</strong> 버튼을 눌러서<br>물量 게이지를 목표 구간에 맞춰요!<br>너무 적거나 많으면<br>식물이 시들시들해져요.<br>6라운드 동안 쑥쑥 키워봐요!</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 게임 종료!</h2>
      <div class="result-score" id="finalScore">0</div>
      <p id="resultMsg"></p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const CONFIG = {
      TOTAL_ROUNDS: 6,
      STORAGE_KEY: 'watering-plant_best',
      STAGES: ['🌰', '🌱', '🌿', '🪴', '🌻'],
      TARGET_MIN: 45,
      TARGET_MAX: 65,
      FILL_SPEED: 1.8, // %/frame while holding
      DRAIN_ON_RELEASE: false,
    };

    let state = {
      round: 1, score: 0, gauge: 40,
      stageIndex: 0, filling: false, fillRAF: null,
      gameActive: false,
    };

    const $ = id => document.getElementById(id);
    const plantStage = $('plantStage');
    const gaugeFill = $('gaugeFill');
    const gaugeText = $('gaugeText');
    const canBtn = $('canBtn');

    function getBest() { return parseInt(localStorage.getItem(CONFIG.STORAGE_KEY) || '0'); }
    function saveBest(v) { localStorage.setItem(CONFIG.STORAGE_KEY, v); }

    function updateHUD() {
      $('roundDisplay').textContent = state.round;
      $('roundTotal').textContent = CONFIG.TOTAL_ROUNDS;
      $('scoreDisplay').textContent = state.score;
      $('bestDisplay').textContent = getBest();
    }

    function updateGauge() {
      const g = Math.max(0, Math.min(100, state.gauge));
      gaugeFill.style.width = g + '%';
      gaugeText.textContent = Math.round(g) + '%';
      const inTarget = g >= CONFIG.TARGET_MIN && g <= CONFIG.TARGET_MAX;
      gaugeFill.classList.toggle('danger', !inTarget && (g < 15 || g > 90));
    }

    function startFill() {
      if (!state.gameActive) return;
      state.filling = true;
      const tick = () => {
        if (!state.filling) return;
        state.gauge += CONFIG.FILL_SPEED;
        if (state.gauge > 100) state.gauge = 100;
        updateGauge();
        state.fillRAF = requestAnimationFrame(tick);
      };
      state.fillRAF = requestAnimationFrame(tick);
    }

    function stopFill() {
      state.filling = false;
      if (state.fillRAF) cancelAnimationFrame(state.fillRAF);
    }

    function resetGaugeForRound() {
      state.gauge = 20 + Math.random() * 15; // 20~35 시작
      updateGauge();
    }

    function judgeRound() {
      if (!state.gameActive) return;
      const g = state.gauge;
      const inTarget = g >= CONFIG.TARGET_MIN && g <= CONFIG.TARGET_MAX;
      const distance = g < CONFIG.TARGET_MIN ? (CONFIG.TARGET_MIN - g) : (g > CONFIG.TARGET_MAX ? g - CONFIG.TARGET_MAX : 0);

      if (inTarget) {
        state.score += 20;
        state.stageIndex = Math.min(state.stageIndex + 1, CONFIG.STAGES.length - 1);
        plantStage.textContent = CONFIG.STAGES[state.stageIndex];
        plantStage.classList.remove('wilt');
        plantStage.classList.add('grow');
        setTimeout(() => plantStage.classList.remove('grow'), 350);
      } else if (distance <= 12) {
        state.score += 8;
        plantStage.classList.remove('wilt');
        plantStage.classList.add('grow');
        setTimeout(() => plantStage.classList.remove('grow'), 350);
      } else {
        plantStage.classList.remove('grow');
        plantStage.classList.add('wilt');
        setTimeout(() => plantStage.classList.remove('wilt'), 350);
      }

      updateHUD();

      if (state.round >= CONFIG.TOTAL_ROUNDS) {
        setTimeout(endGame, 500);
      } else {
        state.round++;
        setTimeout(() => {
          resetGaugeForRound();
          updateHUD();
        }, 500);
      }
    }

    function startGame() {
      stopFill();
      state = {
        round: 1, score: 0, gauge: 25,
        stageIndex: 0, filling: false, fillRAF: null,
        gameActive: true,
      };
      plantStage.textContent = CONFIG.STAGES[0];
      plantStage.classList.remove('grow', 'wilt');
      $('startOverlay').classList.add('hidden');
      $('endOverlay').classList.add('hidden');
      resetGaugeForRound();
      updateHUD();
    }

    function endGame() {
      stopFill();
      state.gameActive = false;
      const best = getBest();
      if (state.score > best) saveBest(state.score);
      $('finalScore').textContent = state.score + '점';
      const msgs = [
        state.score >= 100 ? '🏆 정원사 마스터!' :
        state.score >= 70 ? '🌻 활짝 피었어요!' :
        state.score >= 40 ? '🌿 잘 자랐어요!' : '🌱 다시 키워봐요!',
        `최고 기록: ${Math.max(state.score, best)}점`
      ];
      $('resultMsg').textContent = msgs.join(' ');
      $('endOverlay').classList.remove('hidden');
    }

    canBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startFill();
    });
    canBtn.addEventListener('pointerup', () => {
      stopFill();
      judgeRound();
    });
    canBtn.addEventListener('pointerleave', () => {
      if (state.filling) { stopFill(); judgeRound(); }
    });
    canBtn.addEventListener('pointercancel', () => {
      if (state.filling) { stopFill(); judgeRound(); }
    });

    $('startBtn').addEventListener('pointerdown', startGame);
    $('restartBtn').addEventListener('pointerdown', startGame);
    updateHUD();
    updateGauge();
  })();
  </script>
</body>
</html>
