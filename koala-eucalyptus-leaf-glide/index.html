<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐨 꼬마 코알라의 살랑살랑 유칼립투스 글라이더</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #1B381E 0%, #2D5A27 50%, #4E8752 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #1e3a1f;
      box-shadow: 0 10px 35px rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 43, 20, 0.85);
      color: #E8F5E9;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      border-bottom: 1px solid rgba(74, 222, 128, 0.2);
    }
    .home-btn {
      color: #A7F3D0;
      text-decoration: none;
      font-size: 14px;
      background: rgba(16, 185, 129, 0.2);
      padding: 5px 12px;
      border-radius: 14px;
      transition: background 0.2s;
    }
    .badge {
      background: rgba(16, 185, 129, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #6EE7B7;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #112211;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 25, 12, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(5px);
    }
    .overlay h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #A7F3D0;
      text-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
    }
    .overlay p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
      color: #D1FAE5;
    }
    .btn {
      background: linear-gradient(135deg, #10B981, #059669);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .instructions {
      margin-top: 15px;
      font-size: 13px;
      color: #6EE7B7;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../index.html" class="home-btn">🏠 아케이드</a>
      <div id="score-display">점수: 0</div>
      <div class="badge" id="combo-display">콤보 x0</div>
    </header>
    <canvas id="gameCanvas"></canvas>

    <div id="start-overlay" class="overlay">
      <h1>🐨 꼬마 코알라의 글라이더</h1>
      <p>초록빛 숲속 바람을 타고 유칼립투스 잎사귀로 하늘을 날아요!<br>화면을 누르고 있으면 둥실 떠오르고, 손을 떼면 부드럽게 내려갑니다.<br>황금 꽃잎과 이슬을 모아보세요!</p>
      <button class="btn" id="start-btn">비행 시작!</button>
      <div class="instructions">터치/마우스 길게 누르기 = 상승 | 손 떼기 = 하강</div>
    </div>

    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h1>✨ 비행 완료!</h1>
      <p id="gameover-msg">숲속을 아름답게 날았어요!</p>
      <button class="btn" id="restart-btn">다시 날기</button>
    </div>
  </div>

  <script>
    // Audio Context Synth
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playTone(freq, duration, type = 'sine', gainVal = 0.1) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    function playChime(combo) {
      const baseFreq = 440 + Math.min(combo * 40, 600);
      playTone(baseFreq, 0.25, 'triangle', 0.15);
      setTimeout(() => playTone(baseFreq * 1.25, 0.2, 'sine', 0.1), 80);
    }
    function playGlissUp() {
      playTone(330, 0.15, 'sine', 0.08);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const comboDisplay = document.getElementById('combo-display');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const gameoverMsg = document.getElementById('gameover-msg');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let width, height;
    function resize() {
      width = canvas.parentElement.clientWidth;
      height = canvas.parentElement.clientHeight - 50;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let isPlaying = false;
    let isPressing = false;
    let score = 0;
    let combo = 0;
    let gameSpeed = 3;
    let distance = 0;

    const koala = {
      x: 80,
      y: 200,
      vy: 0,
      radius: 20,
      angle: 0
    };

    let items = [];
    let obstacles = [];
    let particles = [];
    let bgLeaves = [];

    // Background leaves initialization
    for (let i = 0; i < 25; i++) {
      bgLeaves.push({
        x: Math.random() * 500,
        y: Math.random() * 800,
        speed: 0.5 + Math.random() * 1.5,
        size: 8 + Math.random() * 12,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.05
      });
    }

    function spawnElements() {
      if (Math.random() < 0.05) {
        // Spawn Collectible Leaf or Flower
        const isGolden = Math.random() < 0.25;
        items.push({
          x: width + 20,
          y: 40 + Math.random() * (height - 80),
          isGolden: isGolden,
          radius: isGolden ? 14 : 10,
          rot: 0
        });
      }

      if (Math.random() < 0.015) {
        // Spawn harmless breeze cloud or branch hurdle
        const topHurdle = Math.random() < 0.5;
        obstacles.push({
          x: width + 30,
          y: topHurdle ? 20 : height - 60,
          width: 25,
          height: 50,
          passed: false
        });
      }
    }

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: 2 + Math.random() * 3,
          color: color,
          life: 1
        });
      }
    }

    function resetGame() {
      score = 0;
      combo = 0;
      gameSpeed = 3.2;
      distance = 0;
      koala.y = height / 2;
      koala.vy = 0;
      koala.angle = 0;
      items = [];
      obstacles = [];
      particles = [];
      scoreDisplay.textContent = '점수: 0';
      comboDisplay.textContent = '콤보 x0';
    }

    function update() {
      if (!isPlaying) return;

      distance += gameSpeed;
      if (distance % 500 === 0) {
        gameSpeed = Math.min(gameSpeed + 0.2, 5.5);
      }

      // Physics: hold to rise, release to glide down
      if (isPressing) {
        koala.vy -= 0.45;
        koala.angle = Math.max(koala.angle - 0.04, -0.35);
      } else {
        koala.vy += 0.32;
        koala.angle = Math.min(koala.angle + 0.03, 0.35);
      }

      koala.vy = Math.max(-5, Math.min(koala.vy, 5));
      koala.y += koala.vy;

      // Bound check
      if (koala.y < 25) {
        koala.y = 25;
        koala.vy = 0;
      }
      if (koala.y > height - 25) {
        koala.y = height - 25;
        koala.vy = 0;
      }

      // BG leaves
      for (let leaf of bgLeaves) {
        leaf.x -= leaf.speed;
        leaf.rot += leaf.rotSpeed;
        if (leaf.x < -20) {
          leaf.x = width + 20;
          leaf.y = Math.random() * height;
        }
      }

      spawnElements();

      // Update Items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.x -= gameSpeed;
        item.rot += 0.05;

        // Collision with koala
        const dx = koala.x - item.x;
        const dy = koala.y - item.y;
        const dist = Math.hypot(dx, dy);

        if (dist < koala.radius + item.radius) {
          combo++;
          const pts = item.isGolden ? 50 * combo : 20 * combo;
          score += pts;
          scoreDisplay.textContent = `점수: ${score}`;
          comboDisplay.textContent = `콤보 x${combo}`;
          playChime(combo);
          addParticles(item.x, item.y, item.isGolden ? '#FDE047' : '#6EE7B7', 12);
          items.splice(i, 1);
          continue;
        }

        if (item.x < -30) {
          items.splice(i, 1);
          combo = Math.max(0, combo - 1);
          comboDisplay.textContent = `콤보 x${combo}`;
        }
      }

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        // Collision Check
        if (
          koala.x + koala.radius > obs.x &&
          koala.x - koala.radius < obs.x + obs.width &&
          koala.y + koala.radius > obs.y &&
          koala.y - koala.radius < obs.y + obs.height
        ) {
          // Soft bump: lose combo and bounce
          combo = 0;
          comboDisplay.textContent = '콤보 x0';
          koala.vy = obs.y < height / 2 ? 3 : -3;
          playTone(200, 0.2, 'sawtooth', 0.1);
          addParticles(koala.x, koala.y, '#9CA3AF', 6);
          obstacles.splice(i, 1);
          continue;
        }

        if (obs.x < -40) {
          obstacles.splice(i, 1);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Gradient Sky BG
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#132A13');
      grad.addColorStop(0.5, '#204024');
      grad.addColorStop(1, '#31572C');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Breeze Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const yOff = (i * 120 + (distance * 0.8) % 150);
        ctx.moveTo(0, yOff);
        ctx.bezierCurveTo(width * 0.3, yOff - 20, width * 0.7, yOff + 20, width, yOff);
        ctx.stroke();
      }

      // BG Leaves
      for (let leaf of bgLeaves) {
        ctx.save();
        ctx.translate(leaf.x, leaf.y);
        ctx.rotate(leaf.rot);
        ctx.fillStyle = 'rgba(167, 243, 208, 0.25)';
        ctx.beginPath();
        ctx.ellipse(0, 0, leaf.size, leaf.size * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Obstacles (Soft Mossy Branches)
      for (let obs of obstacles) {
        ctx.fillStyle = '#4B5563';
        ctx.beginPath();
        ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 8);
        ctx.fill();

        ctx.fillStyle = '#10B981';
        ctx.beginPath();
        ctx.arc(obs.x + obs.width / 2, obs.y + (obs.y < 50 ? obs.height : 0), 6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Items
      for (let item of items) {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rot);

        if (item.isGolden) {
          // Golden Flower
          ctx.fillStyle = '#FBBF24';
          ctx.beginPath();
          ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#FFF';
          ctx.beginPath();
          ctx.arc(0, 0, item.radius * 0.4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Fresh Eucalyptus Leaf
          ctx.fillStyle = '#34D399';
          ctx.beginPath();
          ctx.ellipse(0, 0, item.radius * 1.4, item.radius * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#059669';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.restore();
      }

      // Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Draw Koala on Leaf Glider
      ctx.save();
      ctx.translate(koala.x, koala.y);
      ctx.rotate(koala.angle);

      // 1. Giant Leaf Glider
      ctx.fillStyle = '#10B981';
      ctx.beginPath();
      ctx.ellipse(0, 16, 28, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#047857';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 2. Koala Ears
      ctx.fillStyle = '#9CA3AF';
      ctx.beginPath();
      ctx.arc(-16, -10, 9, 0, Math.PI * 2);
      ctx.arc(16, -10, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#E5E7EB';
      ctx.beginPath();
      ctx.arc(-16, -10, 5, 0, Math.PI * 2);
      ctx.arc(16, -10, 5, 0, Math.PI * 2);
      ctx.fill();

      // 3. Koala Head
      ctx.fillStyle = '#9CA3AF';
      ctx.beginPath();
      ctx.arc(0, -2, 14, 0, Math.PI * 2);
      ctx.fill();

      // 4. Blushes
      ctx.fillStyle = 'rgba(252, 165, 165, 0.7)';
      ctx.beginPath();
      ctx.arc(-9, 4, 3, 0, Math.PI * 2);
      ctx.arc(9, 4, 3, 0, Math.PI * 2);
      ctx.fill();

      // 5. Eyes
      ctx.fillStyle = '#1F2937';
      ctx.beginPath();
      ctx.arc(-5, -3, 2, 0, Math.PI * 2);
      ctx.arc(5, -3, 2, 0, Math.PI * 2);
      ctx.fill();

      // 6. Big Oval Nose
      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.ellipse(0, 1, 4, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 7. Little Paws
      ctx.fillStyle = '#6B7280';
      ctx.beginPath();
      ctx.arc(-8, 12, 3, 0, Math.PI * 2);
      ctx.arc(8, 12, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();

    // Input Handlers
    function startPress(e) {
      if (e) e.preventDefault();
      initAudio();
      isPressing = true;
      playGlissUp();
    }
    function endPress(e) {
      if (e) e.preventDefault();
      isPressing = false;
    }

    window.addEventListener('mousedown', startPress);
    window.addEventListener('mouseup', endPress);
    window.addEventListener('touchstart', startPress, { passive: false });
    window.addEventListener('touchend', endPress, { passive: false });

    startBtn.addEventListener('click', () => {
      initAudio();
      startOverlay.style.display = 'none';
      resetGame();
      isPlaying = true;
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      gameoverOverlay.style.display = 'none';
      resetGame();
      isPlaying = true;
    });
  </script>
</body>
</html>
