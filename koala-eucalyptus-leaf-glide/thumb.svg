<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="koalaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="50%" stop-color="#4E8752"/>
      <stop offset="100%" stop-color="#A3C9A8"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#koalaBg)"/>

  <!-- Sun Rays & Breeze -->
  <path d="M 0 40 Q 60 20 120 50 T 200 30" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" fill="none"/>
  <path d="M 0 90 Q 70 70 140 100 T 200 80" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.25" fill="none"/>

  <!-- Eucalyptus Leaves in BG -->
  <path d="M 170 30 Q 185 10 195 25 Q 180 40 170 30 Z" fill="#84CC16" opacity="0.8"/>
  <path d="M 20 150 Q 5 130 15 120 Q 35 135 20 150 Z" fill="#84CC16" opacity="0.7"/>

  <!-- Giant Gliding Eucalyptus Leaf -->
  <path d="M 40 130 C 70 95 130 95 165 135 C 130 145 70 145 40 130 Z" fill="url(#leafGrad)"/>
  <path d="M 40 130 Q 100 125 165 135" stroke="#047857" stroke-width="2" fill="none"/>

  <!-- Cute Koala Rider -->
  <g transform="translate(100, 95)">
    <!-- Fluffy Big Ears -->
    <ellipse cx="-26" cy="-16" rx="14" ry="14" fill="#9CA3AF"/>
    <ellipse cx="-26" cy="-16" rx="9" ry="9" fill="#E5E7EB"/>
    <ellipse cx="26" cy="-16" rx="14" ry="14" fill="#9CA3AF"/>
    <ellipse cx="26" cy="-16" rx="9" ry="9" fill="#E5E7EB"/>

    <!-- Koala Body -->
    <ellipse cx="0" cy="14" rx="20" ry="18" fill="#9CA3AF"/>
    <ellipse cx="0" cy="16" rx="13" ry="12" fill="#F3F4F6"/>

    <!-- Koala Head -->
    <ellipse cx="0" cy="-6" rx="22" ry="19" fill="#9CA3AF"/>
    <ellipse cx="-13" cy="2" rx="4" ry="3" fill="#FCA5A5" opacity="0.6"/>
    <ellipse cx="13" cy="2" rx="4" ry="3" fill="#FCA5A5" opacity="0.6"/>

    <!-- Cute Eyes -->
    <circle cx="-8" cy="-8" r="3" fill="#1F2937"/>
    <circle cx="8" cy="-8" r="3" fill="#1F2937"/>
    <circle cx="-7" cy="-9" r="1" fill="#FFFFFF"/>
    <circle cx="9" cy="-9" r="1" fill="#FFFFFF"/>

    <!-- Iconic Oval Dark Nose -->
    <ellipse cx="0" cy="-2" rx="6" ry="9" fill="#111827"/>
    <ellipse cx="-1" cy="-4" rx="1.5" ry="3" fill="#4B5563" opacity="0.6"/>

    <!-- Little Paws Holding Leaf -->
    <ellipse cx="-12" cy="18" rx="5" ry="4" fill="#6B7280"/>
    <ellipse cx="12" cy="18" rx="5" ry="4" fill="#6B7280"/>
  </g>

  <!-- Golden Blossom Sparkle -->
  <g transform="translate(160, 60)">
    <circle cx="0" cy="0" r="10" fill="url(#flowerGrad)"/>
    <circle cx="0" cy="0" r="4" fill="#FFF"/>
  </g>
</svg>
