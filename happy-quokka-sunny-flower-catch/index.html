<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐾 행복한 아기 쿼카의 햇살 꽃송이 모으기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #38BDF8 0%, #BAE6FD 50%, #FEF08A 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #0284c7;
      box-shadow: 0 10px 35px rgba(14, 165, 233, 0.45);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 116, 144, 0.85);
      color: #CFFAFE;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      border-bottom: 1px solid rgba(103, 232, 249, 0.3);
      backdrop-filter: blur(8px);
    }
    .home-btn {
      color: #ECFEFF;
      text-decoration: none;
      font-size: 14px;
      background: rgba(103, 232, 249, 0.3);
      padding: 5px 12px;
      border-radius: 14px;
      transition: background 0.2s;
    }
    .badge {
      background: rgba(103, 232, 249, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #CFFAFE;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 116, 144, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      z-index: 20;
      color: #ECFEFF;
      backdrop-filter: blur(6px);
    }
    .screen-overlay h1 {
      font-size: 27px;
      margin-bottom: 14px;
      color: #FEF08A;
      text-shadow: 0 3px 12px rgba(234, 179, 8, 0.5);
      line-height: 1.3;
    }
    .screen-overlay p {
      font-size: 15px;
      color: #E0F2FE;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .start-btn {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      color: #FFF;
      border: none;
      padding: 14px 38px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .start-btn:active {
      transform: scale(0.96);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../index.html" class="home-btn">🏠 홈</a>
      <span class="badge" id="score-display">꽃송이: 0</span>
      <span class="badge" id="lives-display">❤️ ❤️ ❤️</span>
    </header>
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="screen-overlay">
      <h1>🐾 행복한 아기 쿼카의<br>햇살 꽃송이 모으기</h1>
      <p>
        세상에서 가장 행복한 동물, <strong>아기 쿼카</strong>와 함께<br>
        하늘에서 쏟아지는 알록달록 <strong>꽃송이</strong>와<br>
        향긋한 <strong>초록 잎사귀</strong>를 가득 모아보세요!<br>
        가시 덤불은 살짝 피해요 🌵
      </p>
      <button class="start-btn" id="start-btn">꽃놀이 시작하기! 🌸</button>
    </div>

    <div id="gameover-screen" class="screen-overlay hidden">
      <h1 id="gameover-title">꽃놀이 완료! 🌻</h1>
      <p id="gameover-desc">
        오늘 모은 행복 점수: <strong id="final-score" style="font-size: 24px; color: #FDE047;">0</strong>점<br>
        <span id="best-score" style="font-size: 14px; opacity: 0.9;">최고 기록: 0점</span>
      </p>
      <button class="start-btn" id="restart-btn">다시 놀기 🐾</button>
    </div>
  </div>

  <script>
    // Cheerful Audio Engine
    class HappyAudioEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playCatch(freq = 587.33) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.3, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }
      playGolden() {
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.18);
          }, i * 65);
        });
      }
      playOuch() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
    }

    const sound = new HappyAudioEngine();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const livesDisplay = document.getElementById('lives-display');
    const startScreen = document.getElementById('start-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');

    let width, height;
    function resize() {
      width = canvas.width = canvas.clientWidth;
      height = canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = false;
    let score = 0;
    let lives = 3;
    let bestScore = parseInt(localStorage.getItem('jangyoon_quokka_best') || '0', 10);

    // Player: Smiling Quokka
    const quokka = {
      x: 0,
      y: 0,
      targetX: 0,
      bounceAnim: 0,
      earWiggle: 0
    };

    let items = [];
    let particles = [];
    let sunRays = [];
    let lastSpawnTime = 0;
    let spawnInterval = 900;

    function initGame() {
      score = 0;
      lives = 3;
      items = [];
      particles = [];
      spawnInterval = 900;
      quokka.x = width / 2;
      quokka.targetX = width / 2;
      quokka.y = height - 90;
      updateHeader();
    }

    function updateHeader() {
      scoreDisplay.innerText = `꽃송이: ${score}`;
      livesDisplay.innerText = '❤️ '.repeat(Math.max(0, lives)).trim() || '💔';
    }

    function spawnItem() {
      const types = [
        { type: 'blossom_pink', score: 100, speed: 2.2, r: 18, color: '#F472B6' },
        { type: 'blossom_pink', score: 100, speed: 2.4, r: 18, color: '#F472B6' },
        { type: 'flower_yellow', score: 150, speed: 2.6, r: 20, color: '#FACC15' },
        { type: 'leaf_green', score: 250, speed: 2.8, r: 16, color: '#4ADE80' },
        { type: 'rainbow_flower', score: 500, speed: 3.2, r: 22, color: '#F43F5E', isGolden: true },
        { type: 'thorn', score: 0, speed: 2.3, r: 20, color: '#713F12', isObstacle: true }
      ];
      const selected = types[Math.floor(Math.random() * types.length)];
      items.push({
        x: 30 + Math.random() * (width - 60),
        y: -30,
        ...selected,
        angle: Math.random() * Math.PI,
        swayOffset: Math.random() * 10,
        rotSpeed: (Math.random() - 0.5) * 0.05
      });
    }

    function createBurst(x, y, color = '#FDE047', count = 12) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 2 + Math.random() * 3.5,
          color,
          alpha: 1,
          decay: 0.025 + Math.random() * 0.02
        });
      }
    }

    // Input Handlers
    function handlePointerMove(e) {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      quokka.targetX = clientX - rect.left;
    }
    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('touchmove', handlePointerMove, { passive: true });
    canvas.addEventListener('touchstart', (e) => {
      sound.init();
      handlePointerMove(e);
    }, { passive: true });

    startBtn.addEventListener('click', () => {
      sound.init();
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      initGame();
      isPlaying = true;
    });

    restartBtn.addEventListener('click', () => {
      sound.init();
      gameoverScreen.classList.add('hidden');
      initGame();
      isPlaying = true;
    });

    // Game Loop
    let lastTime = performance.now();
    function loop(now) {
      const dt = now - lastTime;
      lastTime = now;

      // Sky Background
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#38BDF8');
      skyGrad.addColorStop(0.5, '#BAE6FD');
      skyGrad.addColorStop(0.85, '#FEF08A');
      skyGrad.addColorStop(1, '#86EFAC');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Sun & Sunbeams
      ctx.fillStyle = 'rgba(250, 204, 21, 0.4)';
      ctx.beginPath();
      ctx.arc(width - 50, 60, 45, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FACC15';
      ctx.beginPath();
      ctx.arc(width - 50, 60, 24, 0, Math.PI * 2);
      ctx.fill();

      // Green Grass Hills
      ctx.fillStyle = '#22C55E';
      ctx.beginPath();
      ctx.moveTo(0, height * 0.88);
      ctx.quadraticCurveTo(width * 0.3, height * 0.84, width * 0.6, height * 0.87);
      ctx.quadraticCurveTo(width * 0.85, height * 0.9, width, height * 0.85);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.fill();

      ctx.fillStyle = '#16A34A';
      ctx.beginPath();
      ctx.moveTo(0, height * 0.93);
      ctx.quadraticCurveTo(width * 0.5, height * 0.9, width, height * 0.94);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.fill();

      if (isPlaying) {
        // Spawn items
        if (now - lastSpawnTime > spawnInterval) {
          spawnItem();
          lastSpawnTime = now;
          if (spawnInterval > 460) spawnInterval -= 5;
        }

        // Smooth Quokka Movement
        quokka.x += (quokka.targetX - quokka.x) * 0.2;
        quokka.x = Math.max(45, Math.min(width - 45, quokka.x));
        quokka.bounceAnim = Math.sin(now * 0.008) * 4;
        quokka.earWiggle = Math.sin(now * 0.012) * 0.15;

        // Update items
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          item.y += item.speed;
          item.angle += item.rotSpeed;
          item.x += Math.sin(now * 0.003 + item.swayOffset) * 0.8;

          // Collision with quokka
          const dist = Math.hypot(item.x - quokka.x, item.y - (quokka.y - 10 + quokka.bounceAnim));
          if (dist < item.r + 34) {
            if (item.isObstacle) {
              lives--;
              sound.playOuch();
              createBurst(item.x, item.y, '#713F12', 15);
              updateHeader();
              if (lives <= 0) {
                gameOver();
              }
            } else {
              score += item.score;
              if (item.isGolden) {
                sound.playGolden();
                createBurst(item.x, item.y, '#FDE047', 22);
              } else {
                sound.playCatch(item.type === 'leaf_green' ? 659.25 : 587.33);
                createBurst(item.x, item.y, item.color, 12);
              }
              updateHeader();
            }
            items.splice(i, 1);
            continue;
          }

          // Off screen bottom
          if (item.y > height + 40) {
            items.splice(i, 1);
          }
        }
      }

      // Draw items
      items.forEach(item => {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.angle);

        if (item.type === 'blossom_pink' || item.type === 'flower_yellow' || item.isGolden) {
          // Petals
          const petalColor = item.isGolden ? '#F43F5E' : item.color;
          const centerColor = item.isGolden ? '#FDE047' : '#FFFFFF';
          ctx.fillStyle = petalColor;
          for (let p = 0; p < 5; p++) {
            ctx.save();
            ctx.rotate((p * Math.PI * 2) / 5);
            ctx.beginPath();
            ctx.ellipse(0, -item.r * 0.65, item.r * 0.45, item.r * 0.65, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          // Center core
          ctx.fillStyle = centerColor;
          ctx.beginPath();
          ctx.arc(0, 0, item.r * 0.4, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'leaf_green') {
          // Eucalyptus Leaf
          ctx.fillStyle = '#22C55E';
          ctx.beginPath();
          ctx.moveTo(0, -item.r);
          ctx.quadraticCurveTo(item.r * 0.8, 0, 0, item.r);
          ctx.quadraticCurveTo(-item.r * 0.8, 0, 0, -item.r);
          ctx.fill();
          ctx.strokeStyle = '#15803D';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, -item.r);
          ctx.lineTo(0, item.r);
          ctx.stroke();
        } else if (item.isObstacle) {
          // Prickly Tumbleweed / Thorn
          ctx.fillStyle = '#713F12';
          ctx.beginPath();
          ctx.arc(0, 0, item.r * 0.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#A16207';
          ctx.lineWidth = 2.5;
          for (let t = 0; t < 8; t++) {
            ctx.save();
            ctx.rotate((t * Math.PI * 2) / 8);
            ctx.beginPath();
            ctx.moveTo(0, item.r * 0.5);
            ctx.lineTo(0, item.r * 1.1);
            ctx.stroke();
            ctx.restore();
          }
        }
        ctx.restore();
      });

      // Draw Smiling Quokka
      drawQuokka(quokka.x, quokka.y + quokka.bounceAnim);

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    function drawQuokka(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Shadow on Grass
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 24, 30, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = '#A16207';
      ctx.beginPath();
      ctx.ellipse(0, 10, 28, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cream Tummy
      ctx.fillStyle = '#FDE68A';
      ctx.beginPath();
      ctx.ellipse(0, 12, 18, 15, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#A16207';
      ctx.beginPath();
      ctx.arc(0, -14, 20, 0, Math.PI * 2);
      ctx.fill();

      // Rounded Ears with wiggle
      ctx.save();
      ctx.rotate(quokka.earWiggle);
      ctx.fillStyle = '#713F12';
      ctx.beginPath();
      ctx.arc(-16, -28, 6.5, 0, Math.PI * 2);
      ctx.arc(16, -28, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FDE68A';
      ctx.beginPath();
      ctx.arc(-16, -28, 4, 0, Math.PI * 2);
      ctx.arc(16, -28, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Chubby Cheeks
      ctx.fillStyle = '#FEF3C7';
      ctx.beginPath();
      ctx.ellipse(0, -10, 14, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Shiny Black Nose
      ctx.fillStyle = '#1C1917';
      ctx.beginPath();
      ctx.ellipse(0, -15, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      // World's Best Smile!
      ctx.strokeStyle = '#713F12';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, -13, 7, 0.2 * Math.PI, 0.8 * Math.PI, false);
      ctx.stroke();

      // Rosy Cheeks
      ctx.fillStyle = 'rgba(251, 113, 133, 0.65)';
      ctx.beginPath();
      ctx.arc(-11, -9, 3.5, 0, Math.PI * 2);
      ctx.arc(11, -9, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Shiny Beaming Eyes
      ctx.fillStyle = '#0F172A';
      ctx.beginPath();
      ctx.ellipse(-7, -18, 3, 3.5, 0, 0, Math.PI * 2);
      ctx.ellipse(7, -18, 3, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(-6, -19.5, 1.2, 0, Math.PI * 2);
      ctx.arc(8, -19.5, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Little Paws Holding Flower
      ctx.fillStyle = '#713F12';
      ctx.beginPath();
      ctx.ellipse(-10, 8, 5, 4.5, 0.3, 0, Math.PI * 2);
      ctx.ellipse(10, 8, 5, 4.5, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Flower in Paws
      ctx.fillStyle = '#F43F5E';
      ctx.beginPath();
      ctx.arc(0, 8, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FDE047';
      ctx.beginPath();
      ctx.arc(0, 8, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameOver() {
      isPlaying = false;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('jangyoon_quokka_best', bestScore);
      }
      finalScoreEl.innerText = score;
      bestScoreEl.innerText = `최고 기록: ${bestScore}점`;
      gameoverScreen.classList.remove('hidden');
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
