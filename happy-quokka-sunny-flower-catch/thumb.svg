<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sunnySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="quokkaFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#sunnySky)"/>

  <!-- Warm Sun & Cloud -->
  <circle cx="160" cy="40" r="22" fill="#FACC15" opacity="0.9"/>
  <ellipse cx="40" cy="50" rx="24" ry="14" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="55" cy="45" rx="18" ry="12" fill="#FFFFFF" opacity="0.85"/>

  <!-- Green Sunny Meadow -->
  <path d="M 0 145 Q 100 130 200 145 L 200 200 L 0 200 Z" fill="#22C55E"/>
  <path d="M 0 165 Q 100 155 200 165 L 200 200 L 0 200 Z" fill="#15803D"/>

  <!-- Adorable Smiling Quokka -->
  <g transform="translate(100, 115)">
    <!-- Quokka Plump Body -->
    <ellipse cx="0" cy="20" rx="28" ry="24" fill="url(#quokkaFur)"/>
    <ellipse cx="0" cy="22" rx="18" ry="16" fill="#FDE68A"/>

    <!-- Little Paws Holding a Yellow Flower -->
    <ellipse cx="-12" cy="18" rx="6" ry="5" fill="#713F12"/>
    <ellipse cx="12" cy="18" rx="6" ry="5" fill="#713F12"/>

    <!-- Flower held in paws -->
    <circle cx="0" cy="18" r="6" fill="#F43F5E"/>
    <circle cx="0" cy="18" r="3" fill="#FDE047"/>

    <!-- Round Chubby Head -->
    <circle cx="0" cy="-8" r="22" fill="url(#quokkaFur)"/>

    <!-- Rounded Ears -->
    <circle cx="-18" cy="-24" r="7" fill="#713F12"/>
    <circle cx="-18" cy="-24" r="4.5" fill="#FDE68A"/>
    <circle cx="18" cy="-24" r="7" fill="#713F12"/>
    <circle cx="18" cy="-24" r="4.5" fill="#FDE68A"/>

    <!-- Chubby Cheeks & Snout -->
    <ellipse cx="0" cy="-4" rx="15" ry="11" fill="#FEF3C7"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="3.5" fill="#1C1917"/>

    <!-- World's Happiest Signature Smile! -->
    <path d="M -8 -4 Q 0 4 8 -4" fill="none" stroke="#713F12" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="-12" cy="-4" r="4" fill="#FDA4AF" opacity="0.6"/>
    <circle cx="12" cy="-4" r="4" fill="#FDA4AF" opacity="0.6"/>

    <!-- Shiny Happy Beaming Eyes -->
    <ellipse cx="-7" cy="-12" rx="3" ry="3.5" fill="#0F172A"/>
    <ellipse cx="7" cy="-12" rx="3" ry="3.5" fill="#0F172A"/>
    <circle cx="-6" cy="-13.5" r="1.2" fill="#FFF"/>
    <circle cx="8" cy="-13.5" r="1.2" fill="#FFF"/>
  </g>

  <!-- Falling Colorful Petals -->
  <!-- Pink Petal -->
  <g transform="translate(45, 90)">
    <ellipse cx="0" cy="0" rx="6" ry="9" transform="rotate(30)" fill="#F472B6"/>
  </g>
  <!-- Orange Blossom -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="5" fill="#FB923C"/>
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A"/>
  </g>
  <!-- Green Leaf -->
  <g transform="translate(70, 45)">
    <path d="M 0 -8 Q 6 0 0 8 Q -6 0 0 -8 Z" transform="rotate(-25)" fill="#4ADE80"/>
  </g>
</svg>
