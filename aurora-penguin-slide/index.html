<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐧 오로라 펭귄 눈썰매 | 장윤이의 게임 놀이터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      background: #090e24;
      background: linear-gradient(180deg, #090e24 0%, #172b4d 50%, #203a66 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .ui-overlay {
      position: absolute; top: 16px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 10; pointer-events: none;
    }
    .stat-pill {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 16px; border-radius: 999px;
      font-size: 1.1rem; font-weight: 700; color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: flex; align-items: center; gap: 6px; pointer-events: auto;
    }
    .home-link { text-decoration: none; }
    .btn-action {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; cursor: pointer; pointer-events: auto;
      transition: transform 0.1s;
    }
    .btn-action:active { transform: scale(0.92); }
    .modal-backdrop {
      position: absolute; inset: 0;
      background: rgba(5, 10, 30, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
    }
    .modal-box {
      background: linear-gradient(135deg, #1b2a4a, #243b68);
      border: 2px solid #5eead4; border-radius: 28px;
      padding: 32px 28px; max-width: 360px; width: 90%;
      text-align: center; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 1.6rem; font-weight: 800; margin-bottom: 12px;
      color: #a7f3d0; text-shadow: 0 2px 10px rgba(94, 234, 212, 0.4);
    }
    .modal-desc {
      font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; margin-bottom: 24px;
    }
    .btn-start {
      background: linear-gradient(135deg, #38bdf8, #2dd4bf);
      border: none; color: #032030; font-size: 1.2rem; font-weight: 800;
      padding: 14px 32px; border-radius: 999px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
      transition: transform 0.15s;
    }
    .btn-start:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <a href="../" class="home-link"><div class="stat-pill">🏠 홈</div></a>
    <div class="stat-pill" id="scorePill">⭐ 0</div>
    <div class="btn-action" id="soundBtn">🔊</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="modal-backdrop" id="startModal">
    <div class="modal-box">
      <div style="font-size: 3.5rem; margin-bottom: 8px;">🐧</div>
      <h1 class="modal-title">오로라 펭귄 눈썰매</h1>
      <p class="modal-desc">
        반짝이는 오로라 하늘 아래 귀여운 펭귄 뽀뽀의 신나는 눈썰매 질주!<br><br>
        화면을 좌우로 터치하거나 드래그해서 반짝이 별과 물고기를 모아보세요!
      </p>
      <button class="btn-start" id="startBtn">썰매 출발! 🚀</button>
    </div>
  </div>

  <div class="modal-backdrop" id="overModal" style="display: none;">
    <div class="modal-box">
      <div style="font-size: 3.5rem; margin-bottom: 8px;">🏆</div>
      <h2 class="modal-title">신나는 썰매 완료!</h2>
      <p class="modal-desc" id="finalScoreText">모은 별점: 0점</p>
      <button class="btn-start" id="restartBtn">한 번 더 타기! 🔄</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scorePill = document.getElementById('scorePill');
    const soundBtn = document.getElementById('soundBtn');
    const startModal = document.getElementById('startModal');
    const overModal = document.getElementById('overModal');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const finalScoreText = document.getElementById('finalScoreText');

    let soundOn = true;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playChime(freq, type='sine', dur=0.2) {
      if (!soundOn || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? '🔊' : '🔇';
    });

    let width = 0, height = 0;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameRunning = false;
    let score = 0;
    let speed = 4.5;
    let distance = 0;

    const penguin = {
      x: width / 2,
      y: height - 120,
      targetX: width / 2,
      size: 32,
      tilt: 0
    };

    let items = [];
    let obstacles = [];
    let particles = [];
    let snowflakes = [];

    for (let i = 0; i < 40; i++) {
      snowflakes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 2 + 1
      });
    }

    function spawnItems() {
      if (Math.random() < 0.05) {
        items.push({
          x: Math.random() * (width - 80) + 40,
          y: -40,
          type: Math.random() < 0.3 ? 'fish' : 'star',
          size: 20
        });
      }
      if (Math.random() < 0.03) {
        obstacles.push({
          x: Math.random() * (width - 80) + 40,
          y: -40,
          type: Math.random() < 0.5 ? 'snowball' : 'tree',
          size: 26
        });
      }
    }

    let isTouching = false;
    window.addEventListener('pointerdown', (e) => {
      if (!gameRunning) return;
      isTouching = true;
      penguin.targetX = e.clientX;
    });
    window.addEventListener('pointermove', (e) => {
      if (!gameRunning || !isTouching) return;
      penguin.targetX = e.clientX;
    });
    window.addEventListener('pointerup', () => { isTouching = false; });
    window.addEventListener('keydown', (e) => {
      if (!gameRunning) return;
      if (e.key === 'ArrowLeft') penguin.targetX -= 40;
      if (e.key === 'ArrowRight') penguin.targetX += 40;
    });

    function createBurst(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const sp = Math.random() * 4 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * sp,
          vy: Math.sin(angle) * sp,
          life: 1,
          color
        });
      }
    }

    function resetGame() {
      score = 0;
      speed = 4.5;
      distance = 0;
      penguin.x = width / 2;
      penguin.targetX = width / 2;
      items = [];
      obstacles = [];
      particles = [];
      scorePill.textContent = `⭐ ${score}`;
      gameRunning = true;
    }

    startBtn.addEventListener('click', () => {
      initAudio();
      playChime(587, 'triangle', 0.3);
      startModal.style.display = 'none';
      resetGame();
    });

    restartBtn.addEventListener('click', () => {
      initAudio();
      playChime(587, 'triangle', 0.3);
      overModal.style.display = 'none';
      resetGame();
    });

    let auroraOffset = 0;
    function drawAurora() {
      auroraOffset += 0.01;
      const grad = ctx.createLinearGradient(0, 0, width, height * 0.4);
      grad.addColorStop(0, 'rgba(16, 185, 129, 0.25)');
      grad.addColorStop(0.5, 'rgba(56, 189, 248, 0.35)');
      grad.addColorStop(1, 'rgba(168, 85, 247, 0.15)');

      ctx.save();
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let x = 0; x <= width; x += 20) {
        const y = Math.sin(x * 0.005 + auroraOffset) * 40 + Math.cos(x * 0.01 - auroraOffset) * 20 + 80;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function update() {
      if (!gameRunning) return;

      penguin.x += (penguin.targetX - penguin.x) * 0.15;
      penguin.x = Math.max(penguin.size, Math.min(width - penguin.size, penguin.x));
      penguin.tilt = (penguin.targetX - penguin.x) * 0.02;

      distance += speed;
      speed = Math.min(8.5, 4.5 + distance * 0.0003);

      spawnItems();

      snowflakes.forEach(s => {
        s.y += s.speed + speed * 0.4;
        if (s.y > height) {
          s.y = -10;
          s.x = Math.random() * width;
        }
      });

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += speed;

        const dist = Math.hypot(item.x - penguin.x, item.y - penguin.y);
        if (dist < penguin.size + item.size) {
          if (item.type === 'star') {
            score += 10;
            playChime(880, 'sine', 0.15);
            createBurst(item.x, item.y, '#fef08a');
          } else {
            score += 25;
            playChime(1046, 'triangle', 0.2);
            createBurst(item.x, item.y, '#38bdf8');
          }
          scorePill.textContent = `⭐ ${score}`;
          items.splice(i, 1);
          continue;
        }

        if (item.y > height + 40) items.splice(i, 1);
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += speed;

        const dist = Math.hypot(obs.x - penguin.x, obs.y - penguin.y);
        if (dist < penguin.size * 0.8 + obs.size * 0.8) {
          playChime(220, 'sawtooth', 0.4);
          createBurst(penguin.x, penguin.y, '#ffffff');
          gameRunning = false;
          finalScoreText.textContent = `모은 별점: ${score}점! 🌟`;
          overModal.style.display = 'flex';
          return;
        }

        if (obs.y > height + 40) obstacles.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      drawAurora();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(0, height * 0.6, width, height * 0.4);

      ctx.fillStyle = '#ffffff';
      snowflakes.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      items.forEach(item => {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.font = '24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.type === 'star' ? '⭐' : '🐟', 0, 0);
        ctx.restore();
      });

      obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.font = '26px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(obs.type === 'snowball' ? '⛄' : '🌲', 0, 0);
        ctx.restore();
      });

      ctx.save();
      ctx.translate(penguin.x, penguin.y);
      ctx.rotate(penguin.tilt);

      ctx.fillStyle = '#e11d48';
      ctx.beginPath();
      ctx.roundRect(-24, 12, 48, 8, 4);
      ctx.fill();

      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐧', 0, 0);
      ctx.restore();

      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      requestAnimationFrame(() => {
        update();
        render();
      });
    }
    render();
  </script>
</body>
</html>
