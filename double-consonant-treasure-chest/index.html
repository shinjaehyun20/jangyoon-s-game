<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>반짝반짝 쌍자음 보물상자 열쇠 찾기 (#066)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100vw; height: 100dvh; overflow: hidden;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(180deg, #FEF3C7 0%, #FCE7F3 55%, #E0F2FE 100%);
    color: #0F172A;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 10px 14px;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.95); border: 3px solid #D97706;
    border-radius: 18px; padding: 8px 14px; height: 11dvh; min-height: 54px;
  }
  .title-wrap { display: flex; align-items: center; gap: 8px; }
  .title-text { font-size: 1.12rem; font-weight: 900; color: #B45309; }
  .hud-group { display: flex; align-items: center; gap: 8px; }
  .badge {
    background: #FEF08A; border: 2px solid #F59E0B; border-radius: 14px;
    padding: 5px 10px; font-weight: 800; font-size: 0.92rem; color: #B45309;
  }
  .btn-util {
    background: #E0E7FF; border: 2px solid #4F46E5; border-radius: 12px;
    padding: 6px 10px; font-weight: 800; font-size: 0.88rem; color: #3730A3; cursor: pointer;
    min-height: 44px; display: inline-flex; align-items: center; text-decoration: none;
  }
  .stage {
    flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center;
  }
  .chest-card {
    width: 100%; max-width: 520px; background: #FFFFFF;
    border: 4px solid #D97706; border-radius: 22px; padding: 14px 16px; text-align: center;
    box-shadow: 0 6px 14px rgba(217,119,6,0.16);
  }
  .chest-emoji { font-size: 3.1rem; line-height: 1.1; margin-bottom: 6px; }
  .chest-title { font-size: 1.3rem; font-weight: 900; color: #1E293B; margin-bottom: 4px; }
  .chest-desc { font-size: 0.96rem; font-weight: 700; color: #475569; }
  .choices-wrap {
    width: 100%; max-width: 520px; background: rgba(255,255,255,0.95);
    border: 3px solid #D97706; border-radius: 22px; padding: 12px;
  }
  .choices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .choice-btn {
    min-height: 60px; border-radius: 16px; border: 3px solid #F59E0B;
    background: #FFFBEB; font-size: 1.25rem; font-weight: 900; color: #92400E;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .choice-btn:active { transform: scale(0.96); }
  .feedback-bar {
    height: 7dvh; min-height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 1.08rem; font-weight: 900; color: #047857; text-align: center;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.72);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #FFFFFF; border: 5px solid #D97706; border-radius: 26px;
    padding: 24px 20px; max-width: 420px; width: 100%; text-align: center;
  }
  .modal h1 { font-size: 1.55rem; color: #B45309; margin-bottom: 10px; }
  .modal p { font-size: 1.05rem; color: #334155; font-weight: 700; line-height: 1.5; margin-bottom: 18px; }
  .btn-start {
    width: 100%; min-height: 54px; border-radius: 16px; border: none;
    background: #D97706; color: #FFFFFF; font-size: 1.25rem; font-weight: 900; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="title-wrap">
      <a href="../../index.html" class="btn-util">← 홈으로</a>
      <span class="title-text">🗝️ 쌍자음 보물상자</span>
    </div>
    <div class="hud-group">
      <span class="badge" id="progressBadge">1 / 8단계</span>
      <span class="badge" id="scoreBadge">점수 0점</span>
      <button class="btn-util" id="soundBtn" type="button">🔊 소리 켜짐</button>
    </div>
  </div>

  <div class="stage">
    <div class="chest-card">
      <div class="chest-emoji" id="chestEmoji">🐰</div>
      <div class="chest-title" id="chestTitle">깡충깡충 긴 귀를 가진 동물의 바른 이름은?</div>
      <div class="chest-desc" id="chestDesc">쌍자음(ㄲ, ㄸ, ㅃ, ㅆ, ㅉ)이 들어간 바른 낱말 열쇠를 골라 주세요!</div>
    </div>

    <div class="choices-wrap">
      <div class="choices-grid" id="choicesGrid"></div>
    </div>
  </div>

  <div class="feedback-bar" id="feedbackBar">알맞은 쌍자음 낱말 열쇠를 터치해 보세요!</div>

  <div class="overlay" id="startOverlay">
    <div class="modal">
      <h1>🗝️ 반짝반짝 쌍자음 보물상자</h1>
      <p>장윤이 탐험가님! 보물상자를 열려면<br>ㄲ, ㄸ, ㅃ, ㅆ, ㅉ 쌍자음이 정확하게 들어간<br>바른 낱말 열쇠를 찾아야 해요!</p>
      <button class="btn-start" id="startBtn" type="button">보물상자 열러 출발!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="modal">
      <h1>🎉 쌍자음 황금 보물상자 완성!</h1>
      <p id="endSummary">8개의 쌍자음 보물상자를 모두 열었어요!</p>
      <button class="btn-start" id="restartBtn" type="button">한 번 더 탐험하기</button>
    </div>
  </div>

<script>
const QUESTIONS = [
  { emoji: "🐰", prompt: "깡충깡충 긴 귀를 가진 귀여운 동물 이름은?", desc: "'ㄲ(쌍기역)'이 들어가는 낱말을 찾아보세요!", ans: "토끼", choices: ["토끼", "토기", "도끼", "코끼"] },
  { emoji: "🍓", prompt: "새콤달콤 빨간 봄 과일의 바른 이름은?", desc: "'ㄸ(쌍디귿)'이 들어가는 낱말을 찾아보세요!", ans: "딸기", choices: ["달기", "딸기", "탈기", "따기"] },
  { emoji: "🍞", prompt: "고소하고 폭신폭신한 간식 이름은?", desc: "'ㅃ(쌍비읍)'이 들어가는 낱말을 찾아보세요!", ans: "식빵", choices: ["식방", "식팡", "식빵", "시방"] },
  { emoji: "🌱", prompt: "땅속에서 파릇파릇 돋아나는 작은 싹은?", desc: "'ㅆ(쌍시옷)'이 들어가는 낱말을 찾아보세요!", ans: "새싹", choices: ["새삭", "새싹", "세삭", "재싹"] },
  { emoji: "🐘", prompt: "코가 길쭉하고 몸집이 아주 큰 동물은?", desc: "'ㄲ(쌍기역)'이 들어가는 낱말을 찾아보세요!", ans: "코끼리", choices: ["코기리", "고끼리", "코끼리", "토끼리"] },
  { emoji: "🦗", prompt: "가을 들판에서 폴짝폴짝 뛰는 곤충은?", desc: "'ㄸ(쌍디귿)'이 들어가는 낱말을 찾아보세요!", ans: "메뚜기", choices: ["메두기", "메뚜기", "매투기", "메투기"] },
  { emoji: "🎺", prompt: "빵빵! 신나게 부는 악기의 바른 이름은?", desc: "'ㅃ(쌍비읍)'이 들어가는 낱말을 찾아보세요!", ans: "나팔과 뿔피리", choices: ["나팔과 불피리", "나팔과 풀피리", "나팔과 뿔피리", "나팔과 물피리"] },
  { emoji: "🍲", prompt: "보글보글 따뜻하게 끓여 먹는 맛있는 국물 요리는?", desc: "'ㅉ(쌍지읒)'이 들어가는 낱말을 찾아보세요!", ans: "된장찌개", choices: ["된장지개", "된장치개", "된장찌개", "된장시개"] }
];

let idx = 0, score = 0, soundOn = true, locked = false;
const STORAGE_KEY = "double-consonant-treasure-chest_best";
let audioCtx = null;

function playTone(freq, dur) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function renderQuestion() {
  locked = false;
  const q = QUESTIONS[idx];
  document.getElementById("progressBadge").textContent = (idx + 1) + " / " + QUESTIONS.length + "단계";
  document.getElementById("scoreBadge").textContent = "점수 " + score + "점";
  document.getElementById("chestEmoji").textContent = q.emoji;
  document.getElementById("chestTitle").textContent = q.prompt;
  document.getElementById("chestDesc").textContent = q.desc;
  document.getElementById("feedbackBar").textContent = "쌍자음 열쇠 카드를 골라 보물상자를 열어 보세요!";

  const grid = document.getElementById("choicesGrid");
  grid.innerHTML = "";
  q.choices.forEach(word => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-btn";
    btn.textContent = "🗝️ " + word;
    btn.addEventListener("pointerdown", () => handleChoice(word));
    grid.appendChild(btn);
  });
}

function handleChoice(word) {
  if (locked) return;
  const q = QUESTIONS[idx];
  if (word === q.ans) {
    locked = true;
    score += 10;
    document.getElementById("scoreBadge").textContent = "점수 " + score + "점";
    document.getElementById("feedbackBar").textContent = "찰칵! '" + word + "' 열쇠로 보물상자가 활짝 열렸어요!";
    playTone(587.33, 0.14); setTimeout(() => playTone(783.99, 0.18), 120);
    setTimeout(() => {
      idx++;
      if (idx < QUESTIONS.length) {
        renderQuestion();
      } else {
        const best = Math.max(score, Number(localStorage.getItem(STORAGE_KEY) || 0));
        localStorage.setItem(STORAGE_KEY, String(best));
        document.getElementById("endSummary").textContent = "최종 점수 " + score + "점! (최고 기록 " + best + "점) 쌍자음 낱말 8개를 모두 정확히 찾았어요!";
        document.getElementById("endOverlay").classList.remove("hidden");
      }
    }, 950);
  } else {
    playTone(220, 0.2);
    document.getElementById("feedbackBar").textContent = "아하, '" + word + "' 말고 쌍자음 소리가 나는 바른 글자를 다시 찾아볼까요?";
  }
}

document.getElementById("soundBtn").addEventListener("pointerdown", () => {
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent = soundOn ? "🔊 소리 켜짐" : "🔇 소리 꺼짐";
});
document.getElementById("startBtn").addEventListener("pointerdown", () => {
  document.getElementById("startOverlay").classList.add("hidden");
  idx = 0; score = 0; renderQuestion();
});
document.getElementById("restartBtn").addEventListener("pointerdown", () => {
  document.getElementById("endOverlay").classList.add("hidden");
  idx = 0; score = 0; renderQuestion();
});
</script>
</body>
</html>
