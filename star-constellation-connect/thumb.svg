<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Tiny background stars -->
  <circle cx="30" cy="40" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="170" cy="50" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="160" cy="160" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="45" cy="165" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="95" cy="25" r="1.8" fill="#fde047" opacity="0.8"/>
  <circle cx="180" cy="110" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- Planet with ring -->
  <g transform="translate(145, 140)">
    <ellipse cx="0" cy="0" rx="20" ry="6" fill="none" stroke="#a855f7" stroke-width="2.5" transform="rotate(-20)" opacity="0.7"/>
    <circle cx="0" cy="0" r="12" fill="#6366f1"/>
    <ellipse cx="0" cy="0" rx="20" ry="6" fill="none" stroke="#c084fc" stroke-width="2.5" transform="rotate(-20)" stroke-dasharray="25 40" opacity="0.9"/>
  </g>

  <!-- Constellation Lines -->
  <path d="M 40 120 L 70 85 L 105 100 L 130 60 L 155 75" 
        fill="none" stroke="url(#lineGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Star Nodes -->
  <g filter="url(#glow)">
    <circle cx="40" cy="120" r="6" fill="#fde047"/>
    <circle cx="70" cy="85" r="6" fill="#fde047"/>
    <circle cx="105" cy="100" r="6" fill="#38bdf8"/>
    <circle cx="130" cy="60" r="7" fill="#c084fc"/>
    <circle cx="155" cy="75" r="6" fill="#fde047"/>
  </g>

  <!-- Star labels (1, 2, 3...) -->
  <text x="40" y="123" font-size="7" font-weight="bold" fill="#000" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="70" y="88" font-size="7" font-weight="bold" fill="#000" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="105" y="103" font-size="7" font-weight="bold" fill="#000" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="130" y="63" font-size="7" font-weight="bold" fill="#000" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="155" y="78" font-size="7" font-weight="bold" fill="#000" text-anchor="middle" font-family="sans-serif">5</text>

  <!-- Sparkles -->
  <path d="M 130 35 Q 130 45 120 45 Q 130 45 130 55 Q 130 45 140 45 Q 130 45 130 35" fill="#fde047" opacity="0.9"/>
  <path d="M 60 140 Q 60 146 54 146 Q 60 146 60 152 Q 60 146 66 146 Q 60 146 60 140" fill="#38bdf8" opacity="0.8"/>

  <!-- Title Pill -->
  <rect x="25" y="152" width="150" height="26" rx="13" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5"/>
  <text x="100" y="169" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle" font-family="'Pretendard', sans-serif">🪐 우주 별자리 잇기</text>
</svg>
