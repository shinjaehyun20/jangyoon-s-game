<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6a99"/>
      <stop offset="100%" stop-color="#06263c"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6fd8"/>
      <stop offset="33%" stop-color="#ffd166"/>
      <stop offset="66%" stop-color="#56c870"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="260" cy="30" r="26" fill="rgba(255,255,255,0.06)"/>
  <!-- bubbles -->
  <circle cx="90" cy="60" r="22" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="82" cy="52" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="150" cy="40" r="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <circle cx="190" cy="88" rx="18" r="18" fill="rgba(255,255,255,0.10)" stroke="url(#rainbow)" stroke-width="3"/>
  <circle cx="184" cy="82" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="230" cy="55" r="10" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <!-- net -->
  <line x1="130" y1="150" x2="130" y2="122" stroke="#a86a3a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="130" cy="112" r="26" fill="none" stroke="#e0c060" stroke-width="5"/>
  <line x1="110" y1="90" x2="110" y2="134" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="130" y1="86" x2="130" y2="138" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="150" y1="90" x2="150" y2="134" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="104" y1="98" x2="156" y2="98" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="104" y1="112" x2="156" y2="112" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="104" y1="126" x2="156" y2="126" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- Title -->
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="20" font-weight="900" fill="#7fdfff">비눗방울 잡기</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="2">SOAP BUBBLE CATCH</text>
  </g>
