<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💎 반짝 보석 광산 열차 | 장윤이의 게임 놀이터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: radial-gradient(circle at center, #2d3436 0%, #1e272e 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ui-layer {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 10;
      pointer-events: none;
    }
    .home-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #0984e3;
      color: #0984e3;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(9, 132, 227, 0.3);
      transition: transform 0.15s;
    }
    .home-btn:active {
      transform: scale(0.95);
    }
    .score-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #fdcb6e;
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 18px;
      font-weight: 900;
      color: #d63031;
      box-shadow: 0 4px 12px rgba(253, 203, 110, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 24px;
      border-radius: 20px;
      color: #dfe6e9;
      font-size: 14px;
      font-weight: 700;
      z-index: 10;
      pointer-events: none;
      display: flex;
      gap: 16px;
    }
    .track-btns {
      position: absolute;
      bottom: 70px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 15;
    }
    .lane-btn {
      width: 70px;
      height: 70px;
      border-radius: 35px;
      background: rgba(255, 255, 255, 0.85);
      border: 3px solid #00cec9;
      color: #2d3436;
      font-size: 28px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 206, 201, 0.4);
      cursor: pointer;
      touch-action: manipulation;
    }
    .lane-btn:active {
      transform: scale(0.92);
      background: #81ecec;
    }
  </style>
</head>
<body>
  <div class="ui-layer">
    <a href="../index.html" class="home-btn">🏠 홈으로</a>
    <div class="score-badge">💎 보석 점수: <span id="scoreVal">0</span></div>
  </div>

  <div class="track-btns">
    <button class="lane-btn" id="btnLeft">⬅️</button>
    <button class="lane-btn" id="btnRight">➡️</button>
  </div>

  <div class="controls-hint">
    <span>좌/우 터치 또는 방향키로 레일 변경!</span>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    // Web Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }
    function playGemSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      const notes = [783.99, 880.00, 1046.50, 1174.66, 1318.51];
      const freq = notes[Math.floor(Math.random() * notes.length)];
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }
    function playSwitchSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(480, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    let score = 0;
    let speed = 4.5;
    let currentLane = 1; // 0: Left, 1: Center, 2: Right
    let targetX = 0;
    let cartX = 0;
    let cartY = 0;

    function getLaneX(lane) {
      const spacing = Math.min(130, W * 0.28);
      return W / 2 + (lane - 1) * spacing;
    }

    cartX = targetX = getLaneX(currentLane);
    cartY = H - 150;

    function shiftLane(dir) {
      initAudio();
      const next = Math.max(0, Math.min(2, currentLane + dir));
      if (next !== currentLane) {
        currentLane = next;
        targetX = getLaneX(currentLane);
        playSwitchSound();
      }
    }

    document.getElementById('btnLeft').addEventListener('pointerdown', e => { e.preventDefault(); shiftLane(-1); });
    document.getElementById('btnRight').addEventListener('pointerdown', e => { e.preventDefault(); shiftLane(1); });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') shiftLane(-1);
      if (e.key === 'ArrowRight' || e.key === 'd') shiftLane(1);
    });

    // Touch swipe support
    let touchStartX = 0;
    window.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    window.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) > 35) {
        shiftLane(diff > 0 ? 1 : -1);
      }
    }, { passive: true });

    // Gems & Track Items
    const GEM_TYPES = [
      { name: 'ruby', color: '#ff7675', score: 20 },
      { name: 'sapphire', color: '#74b9ff', score: 25 },
      { name: 'emerald', color: '#55efc4', score: 30 },
      { name: 'diamond', color: '#fd79a8', score: 50 },
      { name: 'gold', color: '#fdcb6e', score: 15 }
    ];

    let items = [];
    function spawnItem() {
      const lane = Math.floor(Math.random() * 3);
      const gem = GEM_TYPES[Math.floor(Math.random() * GEM_TYPES.length)];
      items.push({
        lane,
        x: getLaneX(lane),
        y: -40,
        gem,
        size: 20,
        rotation: 0
      });
    }

    // Particles
    let particles = [];
    function createSparkles(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 4 + Math.random() * 4,
          color,
          alpha: 1,
          decay: 0.03
        });
      }
    }

    let spawnTimer = 0;
    let trackOffset = 0;

    function loop() {
      // Move cart smoothly
      cartX += (targetX - cartX) * 0.18;
      cartY = H - 150;

      // Track motion
      trackOffset = (trackOffset + speed) % 40;

      // Spawn items
      spawnTimer++;
      if (spawnTimer > 40) {
        spawnItem();
        spawnTimer = 0;
      }

      // Update items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += speed;
        it.rotation += 0.05;

        // Collision with cart
        const dist = Math.hypot(cartX - it.x, cartY - it.y);
        if (dist < 45) {
          score += it.gem.score;
          scoreVal.innerText = score;
          playGemSound();
          createSparkles(it.x, it.y, it.gem.color);
          items.splice(i, 1);
          continue;
        }

        if (it.y > H + 50) items.splice(i, 1);
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      draw();
      requestAnimationFrame(loop);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Background Cavern Crystals
      ctx.save();
      for (let i = 0; i < 8; i++) {
        const cx = (i * 120 + 30) % W;
        const cy = 60 + Math.sin(i * 2) * 30;
        ctx.fillStyle = i % 2 === 0 ? '#6c5ce7' : '#00cec9';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + 10, cy + 25);
        ctx.lineTo(cx - 10, cy + 25);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Railway Tracks (3 lanes)
      for (let l = 0; l < 3; l++) {
        const lx = getLaneX(l);

        // Wooden Ties
        ctx.fillStyle = '#634427';
        for (let y = -40 + trackOffset; y < H + 40; y += 40) {
          ctx.fillRect(lx - 32, y, 64, 8);
        }

        // Metal Rails
        ctx.strokeStyle = '#b2bec3';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(lx - 22, 0);
        ctx.lineTo(lx - 22, H);
        ctx.moveTo(lx + 22, 0);
        ctx.lineTo(lx + 22, H);
        ctx.stroke();

        ctx.strokeStyle = '#dfe6e9';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(lx - 23, 0);
        ctx.lineTo(lx - 23, H);
        ctx.moveTo(lx + 21, 0);
        ctx.lineTo(lx + 21, H);
        ctx.stroke();
      }

      // Draw Items (Gems)
      items.forEach(it => {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.rotation);

        ctx.fillStyle = it.gem.color;
        ctx.shadowColor = it.gem.color;
        ctx.shadowBlur = 15;

        // Diamond facet shape
        ctx.beginPath();
        ctx.moveTo(0, -it.size);
        ctx.lineTo(it.size * 0.9, 0);
        ctx.lineTo(0, it.size);
        ctx.lineTo(-it.size * 0.9, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, -it.size * 0.6);
        ctx.lineTo(it.size * 0.4, 0);
        ctx.lineTo(0, it.size * 0.6);
        ctx.lineTo(-it.size * 0.4, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Draw Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Minecart (Player)
      ctx.save();
      ctx.translate(cartX, cartY);

      // Cart Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 24, 38, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wooden Box
      ctx.fillStyle = '#d63031';
      ctx.fillRect(-32, -18, 64, 32);

      ctx.fillStyle = '#e17055';
      ctx.fillRect(-28, -14, 56, 24);

      // Metal Straps & Rivets
      ctx.fillStyle = '#636e72';
      ctx.fillRect(-32, -6, 64, 5);
      ctx.fillStyle = '#ffeaa7';
      ctx.beginPath();
      ctx.arc(-22, -3.5, 2, 0, Math.PI * 2);
      ctx.arc(0, -3.5, 2, 0, Math.PI * 2);
      ctx.arc(22, -3.5, 2, 0, Math.PI * 2);
      ctx.fill();

      // Cart Wheels
      ctx.fillStyle = '#2d3436';
      ctx.beginPath();
      ctx.arc(-22, 14, 8, 0, Math.PI * 2);
      ctx.arc(22, 14, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#b2bec3';
      ctx.beginPath();
      ctx.arc(-22, 14, 3.5, 0, Math.PI * 2);
      ctx.arc(22, 14, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Little sparkling gems piled in cart
      ctx.fillStyle = '#00cec9';
      ctx.beginPath();
      ctx.arc(-10, -22, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fdcb6e';
      ctx.beginPath();
      ctx.arc(8, -24, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fd79a8';
      ctx.beginPath();
      ctx.arc(0, -26, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
