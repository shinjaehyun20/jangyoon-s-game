<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="cave" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="100%" stop-color="#1e272e"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#cave)"/>

  <!-- Glowing Crystals -->
  <polygon points="40,60 55,100 25,100" fill="#6c5ce7"/>
  <polygon points="360,50 375,95 345,95" fill="#00cec9"/>
  <polygon points="120,40 135,80 105,80" fill="#fd79a8"/>

  <!-- Rails -->
  <line x1="200" y1="0" x2="200" y2="300" stroke="#b2bec3" stroke-width="4"/>
  <line x1="160" y1="0" x2="160" y2="300" stroke="#634427" stroke-width="8" stroke-dasharray="10 30"/>
  <line x1="240" y1="0" x2="240" y2="300" stroke="#634427" stroke-width="8" stroke-dasharray="10 30"/>

  <!-- Minecart -->
  <g transform="translate(200, 180)">
    <ellipse cx="0" cy="40" rx="60" ry="16" fill="rgba(0,0,0,0.5)"/>
    <!-- Box -->
    <rect x="-50" y="-10" width="100" height="45" rx="6" fill="#d63031"/>
    <rect x="-44" y="-5" width="88" height="35" rx="4" fill="#e17055"/>
    <rect x="-50" y="8" width="100" height="8" fill="#636e72"/>
    <!-- Wheels -->
    <circle cx="-35" cy="38" r="14" fill="#2d3436"/>
    <circle cx="-35" cy="38" r="6" fill="#b2bec3"/>
    <circle cx="35" cy="38" r="14" fill="#2d3436"/>
    <circle cx="35" cy="38" r="6" fill="#b2bec3"/>
    <!-- Gems in Cart -->
    <polygon points="-20,-25 -10,-10 -30,-10" fill="#00cec9"/>
    <polygon points="0,-30 15,-10 -15,-10" fill="#fdcb6e"/>
    <polygon points="20,-25 30,-10 10,-10" fill="#fd79a8"/>
    <!-- Sparkles -->
    <circle cx="-5" cy="-35" r="4" fill="#ffffff"/>
    <circle cx="25" cy="-28" r="3" fill="#ffffff"/>
  </g>

  <!-- Title Badge -->
  <rect x="70" y="16" width="260" height="42" rx="21" fill="rgba(255, 255, 255, 0.92)" stroke="#0984e3" stroke-width="2"/>
  <text x="200" y="43" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="18" fill="#0984e3">💎 반짝 보석 광산 열차</text>
</svg>