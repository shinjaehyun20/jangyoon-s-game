<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="night" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#night)"/>
  <!-- Twinkling Stars -->
  <circle cx="50" cy="60" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="50" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="70" cy="220" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="330" cy="240" r="1.8" fill="#ffffff" opacity="0.7"/>
  <!-- Constellation Lines -->
  <path d="M100,180 L150,130 L220,100 L280,130 L300,180" stroke="#818cf8" stroke-width="4" fill="none" filter="url(#glow)"/>
  <!-- Constellation Stars with Numbers -->
  <circle cx="100" cy="180" r="12" fill="#fde047" filter="url(#glow)"/>
  <text x="100" y="184" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">1</text>
  <circle cx="150" cy="130" r="12" fill="#fde047" filter="url(#glow)"/>
  <text x="150" y="134" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">2</text>
  <circle cx="220" cy="100" r="14" fill="#fbbf24" filter="url(#glow)"/>
  <text x="220" y="104" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">3</text>
  <circle cx="280" cy="130" r="12" fill="#fde047" filter="url(#glow)"/>
  <text x="280" y="134" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">4</text>
  <circle cx="300" cy="180" r="12" fill="#fde047" filter="url(#glow)"/>
  <text x="300" y="184" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">5</text>
  <!-- Sparkles -->
  <text x="220" y="70" font-size="28" text-anchor="middle" filter="url(#glow)">✨</text>
  <!-- Title text -->
  <text x="200" y="265" font-family="'Pretendard', sans-serif" font-weight="900" font-size="20" fill="#f8fafc" text-anchor="middle" filter="url(#glow)">🌌 반짝 별자리 잇기</text>
</svg>
