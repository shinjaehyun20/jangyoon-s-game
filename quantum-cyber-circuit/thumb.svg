<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="50%" stop-color="#101a36"/>
      <stop offset="100%" stop-color="#060b18"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="400" height="300" fill="url(#cyberBg)"/>
  <path d="M0 60 H400 M0 120 H400 M0 180 H400 M0 240 H400" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>
  <path d="M80 0 V300 M160 0 V300 M240 0 V300 M320 0 V300" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Circuit Lines Glowing -->
  <path d="M60 150 H130 V90 H200 V150 H270 V210 H340" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M60 210 H100 V230 H180 V180" fill="none" stroke="#ff00b4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M220 70 V120 H290 V60 H340" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Power Nodes -->
  <circle cx="60" cy="150" r="18" fill="#ffea00" filter="url(#glow)"/>
  <text x="60" y="157" font-size="20" text-anchor="middle" font-weight="bold">⚡</text>

  <!-- Center Quantum Core -->
  <rect x="160" y="110" width="80" height="80" rx="16" fill="url(#chipGrad)" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="200" cy="150" r="22" fill="#0c122b" stroke="#00f0ff" stroke-width="2"/>
  <text x="200" y="158" font-size="26" text-anchor="middle">🔮</text>

  <!-- Output Node -->
  <circle cx="340" cy="210" r="18" fill="#00ff88" filter="url(#glow)"/>
  <text x="340" y="217" font-size="20" text-anchor="middle" font-weight="bold">💡</text>

  <!-- Sparks & Particles -->
  <circle cx="130" cy="90" r="5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="270" cy="180" r="6" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="100" cy="230" r="4" fill="#ff00b4" filter="url(#glow)"/>

  <!-- Title Badge -->
  <rect x="80" y="246" width="240" height="38" rx="19" fill="#0f1938" stroke="#00f0ff" stroke-width="2"/>
  <text x="200" y="271" fill="#00f0ff" font-size="16" font-family="'Malgun Gothic', sans-serif" font-weight="bold" text-anchor="middle">⚡ 사이버 회로 연결 놀이</text>
</svg>
