<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf1e6"><title>깡충깡충 뛰어세기 토끼</title><style>:root{--bg:#fbf1e6;--scene:#fbe7d8;--ink:#815336;--accent:#bf8350;--shade:#dfc3a3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#18322a;background:var(--bg);overscroll-behavior:none}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:4px solid #f6bd2c;outline-offset:3px}button:disabled{cursor:default}button:active:not(:disabled){transform:translateY(2px)}.app{height:100vh;height:100dvh;max-width:650px;margin:auto;display:flex;flex-direction:column;gap:10px;padding:max(12px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;flex:none}.back{font-size:13px;color:var(--ink);text-decoration:none;font-weight:750}.tools{display:flex;gap:6px}.tool{background:#ffffffb8;color:var(--ink);border:1px solid #0000000b;border-radius:99px;padding:9px 12px;font-size:13px;min-height:38px}.title{text-align:center;flex:none}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink);margin:0 0 4px}.title h1{font-size:clamp(22px,5vw,31px);letter-spacing:-.07em;margin:0;font-weight:850;line-height:1.15}.title p{margin:7px 0 0;font-size:13px;color:#587065}.hud{display:flex;align-items:center;gap:12px;font-weight:750;font-size:13px;flex:none}.progress{height:8px;background:#ffffffa6;flex:1;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);border-radius:10px;transition:width .25s}.stage{min-height:0;flex:1;position:relative;border:1px solid #ffffff;border-radius:24px;overflow:hidden;background:var(--scene);box-shadow:0 8px 24px #203d2210;display:flex;align-items:center;justify-content:center}.scene-art{width:100%;height:100%;position:absolute;inset:0}.question{position:relative;z-index:2;text-align:center;background:#ffffffed;border:1px solid #ffffff;border-radius:22px;padding:17px 24px;max-width:86%;box-shadow:0 6px 20px #2b493116}.question .caption{font-size:13px;font-weight:650;color:#587065;margin-bottom:7px}.question .big{font-size:clamp(33px,8vw,47px);font-weight:850;letter-spacing:-.04em;line-height:1.2}.question .sub{font-size:13px;margin-top:7px;color:#587065}.answers{display:flex;gap:9px;flex:none}.answer{background:white;color:var(--ink);flex:1;min-width:0;min-height:65px;border-radius:18px;box-shadow:0 5px 0 var(--shade);border:2px solid #ffffff;font-size:clamp(18px,4vw,23px);font-weight:800;transition:transform .15s,background .15s}.answer.correct{background:var(--accent);color:white;border-color:var(--accent)}.answer.wrong{background:#fff0ed;border-color:#eb8a76}.answer.used{background:#e3e7e1;color:#849188;box-shadow:none}.feedback{flex:none;min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);font-size:14px;font-weight:700;line-height:1.4;padding:0 6px}.feedback.error{color:#a44130}.feedback.good{color:#217245}.actions{flex:none;display:flex;gap:8px;min-height:46px}.primary,.secondary{border-radius:14px;min-height:46px;padding:10px 16px;font-weight:800}.primary{background:var(--accent);color:#fff;flex:1;box-shadow:0 4px 0 var(--shade)}.primary:disabled{background:#d6dfd4;color:#83907c;box-shadow:none}.secondary{background:#ffffffba;color:var(--ink);border:1px solid #d9e3d1}.help{text-align:center;font-size:11px;color:#617268;flex:none;margin:0;line-height:1.3}.done{position:fixed;z-index:4;inset:0;max-width:650px;margin:auto;background:var(--scene);padding:24px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px}.done[hidden]{display:none}.done .medal{font-size:66px}.done h2{margin:0;font-size:27px;letter-spacing:-.06em}.done p{margin:0;font-size:15px;line-height:1.6}.done .primary{flex:none;min-width:180px}.bob{animation:bob 2.4s ease-in-out infinite}.jump{animation:jump .42s ease-out}.shake{animation:shake .24s ease-out}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes jump{50%{transform:translateY(-22px)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.pond-animal{position:absolute;bottom:5%;left:calc(50% - 34px);font-size:56px;z-index:2}.coin-summary{font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}.coin-summary span{font-size:13px}.coin-summary b{display:block;font-size:26px}.coin-tray{height:44px;display:flex;justify-content:center;align-items:center;gap:3px;margin-top:10px;overflow:hidden}.coin{width:31px;height:31px;border-radius:50%;background:#ffe5a4;border:2px solid #dba744;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;color:#815716}.coin.fifty{background:#e4e9ec;border-color:#aeb8be;color:#5c666d}.coin.ten{background:#e9b48d;border-color:#bb7d54;color:#75482b}.word-slots{display:flex;justify-content:center;gap:7px;margin-top:12px}.word-slot{width:47px;height:52px;background:#eee9ff;border:2px dashed #b6a6dc;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#624994}.word-slot.filled{border-style:solid;background:#ded4ff}.block-answers{flex-wrap:wrap}.block-answers .answer{flex:1 1 calc(25% - 9px);min-height:60px}.rabbit-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:13px}.stone{font-size:22px;font-weight:800;background:#fff5df;border:2px solid #e7cf9b;min-width:43px;height:45px;display:flex;align-items:center;justify-content:center;border-radius:15px}.stone.ask{background:var(--accent);color:#fff;border-color:var(--accent)}@media(max-height:690px){.app{gap:7px;padding:9px 14px}.title h1{font-size:24px}.title p{font-size:12px;margin-top:4px}.tool{padding:6px 10px;min-height:32px}.answer{min-height:53px}.block-answers .answer{min-height:50px}.feedback{min-height:36px;font-size:13px}.actions{min-height:42px}.primary,.secondary{min-height:42px;padding:8px 13px}.question{padding:12px 18px}.question .big{font-size:35px}.question .caption,.question .sub{font-size:12px}.pond-animal{font-size:43px;bottom:3%;left:calc(50% - 26px)}.coin-tray{height:33px;margin-top:6px}.coin-summary b{font-size:23px}.word-slot{width:40px;height:43px;font-size:25px}.rabbit-line{gap:5px}.stone{min-width:38px;height:38px;font-size:20px}}@media(max-height:560px){.app{gap:5px}.title p,.help{display:none}.title h1{font-size:22px}.hud{font-size:12px}.answer{min-height:45px;font-size:18px}.question .big{font-size:29px}.pond-animal{display:none}.question{padding:9px 14px}.feedback{min-height:31px;font-size:12px}.coin-tray{height:27px}.coin{width:25px;height:25px;font-size:9px}.word-slot{height:35px;width:35px;font-size:22px}.block-answers .answer{min-height:43px}.rabbit-line{margin-top:7px}.stone{height:32px;font-size:18px;min-width:34px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head>
<body><main class="app"><header class="top"><a class="back" href="../index.html" aria-label="게임 목록으로 돌아가기">‹ 게임 목록</a><div class="tools"><button class="tool" id="sound" aria-pressed="true">소리 켜짐</button><button class="tool" id="reset">처음부터</button></div></header><section class="title"><p class="eyebrow">즐겁게 배우는 하루</p><h1>깡충깡충 뛰어세기 토끼</h1><p>2씩, 5씩, 10씩! 수의 규칙을 찾아 뛰어요.</p></section><div class="hud"><span id="round">1 / 10</span><div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div><span id="score">0점</span></div><section class="stage" aria-label="문제와 놀이 화면"><svg class="scene-art" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path fill="#fbe7d8" d="M0 0h600v400H0z"/><circle cx="515" cy="65" r="26" fill="#f3c77a"/><path fill="#bcd5b0" d="M0 280q120-90 240 0t360 0v120H0z"/><path fill="#8bb786" d="M0 325q140-60 300 0t300 0v75H0z"/><path d="M-10 380q200-70 620-15" fill="none" stroke="#eed3a8" stroke-width="45"/><g fill="#e6dac2"><ellipse cx="210" cy="365" rx="29" ry="10"/><ellipse cx="340" cy="355" rx="29" ry="10"/><ellipse cx="470" cy="355" rx="29" ry="10"/></g><g fill="#f6f5e9"><ellipse cx="70" cy="80" rx="70" ry="15"/><ellipse cx="205" cy="40" rx="50" ry="12"/></g></svg><div class="question" id="question"><div class="caption">빈 발판에는 어떤 수가 올까요?</div><div class="big" id="step"></div><div class="rabbit-line" id="stones"></div></div><div class="pond-animal bob" id="rabbit" aria-hidden="true">🐰</div><div class="done" id="done" hidden><div class="medal" aria-hidden="true">🏅</div><h2>정말 잘했어요!</h2><p id="doneScore"></p><p>차근차근 생각한 내가 최고!</p><button class="primary" id="again">다시 놀기</button></div></section><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div><div class="actions"><button class="primary" id="next" disabled>다음 문제</button></div><p class="help">숫자 버튼을 누르거나 키보드 1 · 2 · 3으로 골라요.</p></main><script>'use strict';let round=0,score=0,locked=false,soundOn=true,audio=null;const $=id=>document.getElementById(id);const feedback=$('feedback');function say(text,kind=''){feedback.textContent=text;feedback.className='feedback '+kind}function tone(ok=true){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;[ok?523:196,ok?784:147].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.11,t+i*.12+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.16);o.connect(g);g.connect(audio.destination);o.start(t+i*.12);o.stop(t+i*.12+.18)})}catch(e){}}function animate(id,cls){const e=$(id);if(!e)return;e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls)}function hud(){ $('round').textContent=(round+1)+' / '+ROUNDS.length; $('score').textContent=score+'점';$('bar').style.width=(round/ROUNDS.length*100)+'%'}function done(){locked=true;$('bar').style.width='100%';$('round').textContent=ROUNDS.length+' / '+ROUNDS.length;$('doneScore').textContent=score+'점 · '+ROUNDS.length+'문제를 모두 풀었어요!';$('done').hidden=false;$('again').focus();say('끝까지 해냈어요! 다시 도전할 수 있어요.','good')}function success(message){locked=true;score+=10;$('score').textContent=score+'점';tone(true);say(message,'good');$('next').disabled=false;$('next').textContent=round===ROUNDS.length-1?'결과 보기':'다음 문제';}function next(){if(!locked)return;round++;if(round>=ROUNDS.length){done();return}render()}function reset(){round=0;score=0;locked=false;$('done').hidden=true;render()}function baseRender(){locked=false;hud();$('next').disabled=true;$('next').textContent='다음 문제';say(INSTRUCTION)}$('next').addEventListener('click',next);$('reset').addEventListener('click',reset);$('again').addEventListener('click',reset);$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'소리 켜짐':'소리 꺼짐';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(true)});function keyOptions(e){if(e.altKey||e.ctrlKey||e.metaKey)return;const i=Number(e.key)-1;if(i>=0&&i<3){const b=document.querySelectorAll('#answers button')[i];if(b&&!b.disabled){e.preventDefault();b.click()}}if(e.key==='Enter'&&locked&&$('done').hidden){e.preventDefault();next()}}
const ROUNDS=[{step:2,start:2,count:5,blank:3},{step:5,start:5,count:4,blank:2},{step:10,start:10,count:4,blank:3},{step:2,start:4,count:5,blank:2},{step:5,start:10,count:4,blank:1},{step:10,start:20,count:4,blank:2},{step:2,start:10,count:5,blank:3},{step:5,start:20,count:4,blank:2},{step:10,start:50,count:4,blank:1},{step:2,start:20,count:5,blank:3}];const INSTRUCTION='같은 수만큼 뛰어 빈 발판의 수를 찾아요.';function render(){baseRender();const q=ROUNDS[round],correct=q.start+q.step*q.blank;$('step').textContent=q.step+'씩 뛰어요';$('stones').innerHTML='';for(let i=0;i<q.count;i++){const s=document.createElement('span');s.className='stone'+(i===q.blank?' ask':'');s.textContent=i===q.blank?'?':q.start+q.step*i;s.setAttribute('aria-label',(i+1)+'번째 발판 '+s.textContent);$('stones').append(s)}const opts=[correct,correct+q.step,Math.max(0,correct-q.step)];for(let i=0;i<round%3;i++)opts.push(opts.shift());$('answers').innerHTML='';opts.forEach((n,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=n;b.setAttribute('aria-label',(i+1)+'번 '+n);b.addEventListener('click',()=>choose(b,n));$('answers').append(b)})}function choose(b,n){if(locked)return;const q=ROUNDS[round],correct=q.start+q.step*q.blank;if(n!==correct){b.classList.add('wrong');tone(false);say('빈칸 앞의 수 '+(correct-q.step)+'에 '+q.step+'을 더해 봐요.','error');animate('question','shake');return}b.classList.add('correct');document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);const s=$('stones').children[q.blank];s.textContent=correct;s.setAttribute('aria-label',(q.blank+1)+'번째 발판 '+correct);animate('rabbit','jump');success(q.step+'씩 뛰면 '+correct+'! 당근밭으로 깡충!')}document.addEventListener('keydown',keyOptions);reset();</script></body></html>
