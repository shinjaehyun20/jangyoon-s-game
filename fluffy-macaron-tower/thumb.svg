<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="50%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bgGrad)"/>

  <!-- Decorative sparkles and hearts -->
  <text x="35" y="45" font-size="16" fill="#f472b6" opacity="0.8">✨</text>
  <text x="160" y="55" font-size="14" fill="#fb7185" opacity="0.8">💖</text>
  <text x="25" y="130" font-size="12" fill="#ec4899" opacity="0.6">🌸</text>

  <!-- Plate base -->
  <ellipse cx="100" cy="158" rx="65" ry="12" fill="#fff" stroke="#f472b6" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="100" cy="157" rx="55" ry="9" fill="#fdf2f8"/>

  <!-- Macaron 1 (Bottom - Mint Blue) -->
  <g transform="translate(100, 142)" filter="url(#shadow)">
    <!-- Bottom shell -->
    <rect x="-42" y="4" width="84" height="12" rx="6" fill="#67e8f9"/>
    <!-- Cream -->
    <rect x="-38" y="1" width="76" height="8" rx="4" fill="#ecfeff"/>
    <!-- Top shell -->
    <rect x="-42" y="-9" width="84" height="13" rx="6.5" fill="#67e8f9"/>
    <!-- Frills -->
    <circle cx="-30" cy="5" r="1.5" fill="#0891b2"/>
    <circle cx="-10" cy="5" r="1.5" fill="#0891b2"/>
    <circle cx="10" cy="5" r="1.5" fill="#0891b2"/>
    <circle cx="30" cy="5" r="1.5" fill="#0891b2"/>
  </g>

  <!-- Macaron 2 (Middle - Lemon Yellow) -->
  <g transform="translate(100, 115)" filter="url(#shadow)">
    <rect x="-40" y="4" width="80" height="12" rx="6" fill="#fde047"/>
    <rect x="-36" y="1" width="72" height="8" rx="4" fill="#fefce8"/>
    <rect x="-40" y="-9" width="80" height="13" rx="6.5" fill="#fde047"/>
    <circle cx="-28" cy="5" r="1.5" fill="#ca8a04"/>
    <circle cx="-9" cy="5" r="1.5" fill="#ca8a04"/>
    <circle cx="9" cy="5" r="1.5" fill="#ca8a04"/>
    <circle cx="28" cy="5" r="1.5" fill="#ca8a04"/>
  </g>

  <!-- Macaron 3 (Top - Strawberry Pink) -->
  <g transform="translate(100, 88)" filter="url(#shadow)">
    <rect x="-38" y="4" width="76" height="12" rx="6" fill="#f472b6"/>
    <rect x="-34" y="1" width="68" height="8" rx="4" fill="#fdf2f8"/>
    <rect x="-38" y="-9" width="76" height="13" rx="6.5" fill="#f472b6"/>
    <circle cx="-26" cy="5" r="1.5" fill="#db2777"/>
    <circle cx="-8" cy="5" r="1.5" fill="#db2777"/>
    <circle cx="8" cy="5" r="1.5" fill="#db2777"/>
    <circle cx="26" cy="5" r="1.5" fill="#db2777"/>
  </g>

  <!-- Top Cherry / Star -->
  <circle cx="100" cy="74" r="5" fill="#e11d48"/>
  <path d="M 100 70 Q 106 63 112 65" fill="none" stroke="#15803d" stroke-width="1.8"/>

  <!-- Title Pill -->
  <rect x="22" y="162" width="156" height="26" rx="13" fill="rgba(255, 255, 255, 0.92)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="100" y="179" font-size="11" font-weight="800" fill="#db2777" text-anchor="middle" font-family="'Pretendard', sans-serif">🧁 퐁실퐁실 마카롱 타워</text>
</svg>
