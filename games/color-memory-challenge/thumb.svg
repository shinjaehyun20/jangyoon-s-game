<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bg-grad)"/>
  <rect width="200" height="200" rx="28" fill="url(#shine)"/>
  <!-- Color pads grid -->
  <rect x="20" y="42" width="72" height="72" rx="14" fill="#ff4757"/>
  <rect x="108" y="42" width="72" height="72" rx="14" fill="#1e90ff"/>
  <rect x="20" y="126" width="72" height="52" rx="14" fill="#2ed573"/>
  <rect x="108" y="126" width="72" height="52" rx="14" fill="#ffd166"/>
  <!-- Emojis on pads -->
  <text x="56" y="88" text-anchor="middle" font-size="36">🔴</text>
  <text x="144" y="88" text-anchor="middle" font-size="36">🔵</text>
  <text x="56" y="160" text-anchor="middle" font-size="36">🟢</text>
  <text x="144" y="160" text-anchor="middle" font-size="36">🟡</text>
  <!-- Title -->
  <text x="100" y="28" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffd166">🎨 색깔 기억 챌린지</text>
  <!-- Shine overlay -->
  <rect x="20" y="42" width="72" height="18" rx="8" fill="rgba(255,255,255,0.18)"/>
  <rect x="108" y="42" width="72" height="18" rx="8" fill="rgba(255,255,255,0.18)"/>
</svg>
