<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2b0a"/>
      <stop offset="100%" stop-color="#1a4d1a"/>
    </linearGradient>
    <linearGradient id="card-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ed573" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06d6a0" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bg-g)"/>
  <!-- Decorative circles -->
  <circle cx="170" cy="30" r="50" fill="#2ed573" opacity="0.08"/>
  <circle cx="30" cy="180" r="60" fill="#06d6a0" opacity="0.07"/>
  <!-- Center animal card -->
  <rect x="30" y="44" width="140" height="112" rx="20" fill="url(#card-g)" stroke="rgba(46,213,115,0.35)" stroke-width="2"/>
  <!-- Animal emojis -->
  <text x="100" y="98" text-anchor="middle" font-size="52">🐶</text>
  <!-- Sound wave lines -->
  <text x="20" y="115" font-size="16">🎵</text>
  <text x="160" y="115" font-size="16">🎵</text>
  <!-- Question marks -->
  <text x="64" y="145" text-anchor="middle" font-size="22">🐱</text>
  <text x="100" y="145" text-anchor="middle" font-size="22">❓</text>
  <text x="136" y="145" text-anchor="middle" font-size="22">🐮</text>
  <!-- Title -->
  <text x="100" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#a8edbc">🐾 동물 소리 퀴즈</text>
  <!-- Bottom label -->
  <text x="100" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">멍멍! 야옹~ 음메~</text>
</svg>
