<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🦔 아기 고슴도치의 데굴데굴 가을 밤송이</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 50%, #FFCC80 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #FFFDF9;
      box-shadow: 0 10px 30px rgba(110, 44, 0, 0.15);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #D35400;
      color: white;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
    }
    .badge {
      background: rgba(255, 255, 255, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #FDFBF7;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(4px);
    }
    .overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #FFE082;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .overlay p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
      color: #FFF8E1;
    }
    .btn {
      background: #E67E22;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(230, 126, 34, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
      background: #D35400;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <div id="score-display">🌰 밤송이: <span id="score">0</span></div>
      <div class="badge" id="level-display">가을 숲 1단계</div>
      <div class="badge" id="timer-display">⏱️ 45s</div>
    </header>

    <canvas id="gameCanvas"></canvas>

    <div id="start-overlay" class="overlay">
      <h1>🦔 아기 고슴도치의 밤송이 굴리기</h1>
      <p>화면을 터치해 아기 고슴도치를 움직여보세요!<br>가을 숲길로 굴러오는 맛있는 알밤과 도토리를<br>바구니로 쏙쏙 모아보아요 🍁</p>
      <button class="btn" id="start-btn">게임 시작!</button>
    </div>

    <div id="gameover-overlay" class="overlay" style="display: none;">
      <h1 id="gameover-title">🎉 가을 수확 완료!</h1>
      <p id="gameover-desc">수확한 밤송이: 0개</p>
      <button class="btn" id="restart-btn">다시 놀기</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level-display');
    const timerEl = document.getElementById('timer-display');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Audio Context (Web Audio API)
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playSound(freq, type = 'sine', duration = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessSound() {
      playSound(523.25, 'sine', 0.1); // C5
      setTimeout(() => playSound(659.25, 'sine', 0.1), 100); // E5
      setTimeout(() => playSound(783.99, 'sine', 0.2), 200); // G5
    }

    let width, height;
    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let isPlaying = false;
    let score = 0;
    let timeLeft = 45;
    let timerInterval = null;

    // Player (Hedgehog)
    const hedgehog = {
      x: width / 2,
      y: height - 90,
      targetX: width / 2,
      size: 45,
      direction: 1, // 1: right, -1: left
      legOffset: 0
    };

    // Falling / Rolling Items
    let items = [];
    let particles = [];
    let autumnLeaves = [];

    // Background leaves
    for (let i = 0; i < 20; i++) {
      autumnLeaves.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: 10 + Math.random() * 15,
        speed: 0.5 + Math.random() * 1.5,
        angle: Math.random() * Math.PI * 2,
        angularSpeed: (Math.random() - 0.5) * 0.04,
        color: ['#E67E22', '#D35400', '#F39C12', '#C0392B'][Math.floor(Math.random() * 4)]
      });
    }

    function spawnItem() {
      if (!isPlaying) return;
      const typeRand = Math.random();
      let type = 'chestnut';
      let points = 10;
      let radius = 18;
      let color = '#8B4513';

      if (typeRand < 0.2) {
        type = 'golden-chestnut';
        points = 30;
        radius = 22;
        color = '#F39C12';
      } else if (typeRand < 0.4) {
        type = 'acorn';
        points = 15;
        radius = 16;
        color = '#A0522D';
      }

      items.push({
        x: 30 + Math.random() * (width - 60),
        y: -30,
        vy: 2.5 + Math.random() * 2.5,
        vx: (Math.random() - 0.5) * 1.5,
        radius,
        type,
        points,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.15
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 3 + Math.random() * 4,
          color,
          alpha: 1,
          decay: 0.02 + Math.random() * 0.03
        });
      }
    }

    // Controls
    function handlePointer(e) {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      hedgehog.targetX = Math.max(hedgehog.size, Math.min(width - hedgehog.size, clientX - rect.left));
    }

    window.addEventListener('mousemove', handlePointer);
    window.addEventListener('touchmove', handlePointer, { passive: false });
    window.addEventListener('touchstart', handlePointer, { passive: false });

    function startGame() {
      initAudio();
      isPlaying = true;
      score = 0;
      timeLeft = 45;
      items = [];
      particles = [];
      scoreEl.textContent = '0';
      levelEl.textContent = '가을 숲 1단계';
      timerEl.textContent = `⏱️ ${timeLeft}s`;
      startOverlay.style.display = 'none';
      gameoverOverlay.style.display = 'none';

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      playSuccessSound();
      gameoverOverlay.style.display = 'flex';
      document.getElementById('gameover-desc').textContent = `수확한 밤송이 점수: ${score}점! 🦔🍁`;
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    let lastSpawn = 0;
    function update(timestamp) {
      if (isPlaying) {
        // Hedgehog movement
        const dx = hedgehog.targetX - hedgehog.x;
        hedgehog.x += dx * 0.18;
        if (Math.abs(dx) > 2) {
          hedgehog.direction = dx > 0 ? 1 : -1;
          hedgehog.legOffset += 0.3;
        }

        // Spawn items
        if (timestamp - lastSpawn > 800) {
          spawnItem();
          lastSpawn = timestamp;
        }

        // Update items
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          item.y += item.vy;
          item.x += item.vx;
          item.rotation += item.rotSpeed;

          // Wall bounce
          if (item.x < item.radius || item.x > width - item.radius) {
            item.vx *= -1;
          }

          // Catch collision with hedgehog
          const dist = Math.hypot(item.x - hedgehog.x, item.y - (hedgehog.y - 10));
          if (dist < item.radius + hedgehog.size * 0.7) {
            score += item.points;
            scoreEl.textContent = score;
            createExplosion(item.x, item.y, item.type === 'golden-chestnut' ? '#FFD700' : '#E67E22');
            playSound(item.type === 'golden-chestnut' ? 880 : 440, 'sine', 0.1);
            items.splice(i, 1);
            continue;
          }

          // Offscreen
          if (item.y > height + 40) {
            items.splice(i, 1);
          }
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // Update background leaves
      for (const leaf of autumnLeaves) {
        leaf.y += leaf.speed;
        leaf.x += Math.sin(leaf.angle) * 0.8;
        leaf.angle += leaf.angularSpeed;
        if (leaf.y > height + 20) {
          leaf.y = -20;
          leaf.x = Math.random() * width;
        }
      }
    }

    function drawHedgehog(ctx, x, y, size, dir, leg) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir, 1);

      // Spikes
      ctx.fillStyle = '#6D4C41';
      ctx.beginPath();
      ctx.ellipse(-8, -4, size * 0.75, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sharp quills
      ctx.fillStyle = '#5D4037';
      for (let a = 0; a < Math.PI * 1.5; a += 0.3) {
        const qx = Math.cos(a + Math.PI * 0.8) * size * 0.7;
        const qy = Math.sin(a + Math.PI * 0.8) * size * 0.55 - 4;
        ctx.beginPath();
        ctx.moveTo(qx, qy);
        ctx.lineTo(qx * 1.25, qy * 1.25 - 6);
        ctx.lineTo(qx * 1.1 + 4, qy * 1.1);
        ctx.fill();
      }

      // Face / Snout
      ctx.fillStyle = '#FFE0B2';
      ctx.beginPath();
      ctx.ellipse(size * 0.3, 4, size * 0.45, size * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();

      // Nose point
      ctx.beginPath();
      ctx.moveTo(size * 0.4, -4);
      ctx.lineTo(size * 0.85, 6);
      ctx.lineTo(size * 0.4, 16);
      ctx.fill();

      // Nose tip
      ctx.fillStyle = '#2C1B18';
      ctx.beginPath();
      ctx.arc(size * 0.82, 6, 4, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.beginPath();
      ctx.arc(size * 0.45, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(size * 0.47, -1, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Rosy cheek
      ctx.fillStyle = 'rgba(255, 112, 67, 0.55)';
      ctx.beginPath();
      ctx.arc(size * 0.35, 8, 5, 0, Math.PI * 2);
      ctx.fill();

      // Tiny feet
      ctx.fillStyle = '#D7CCC8';
      const legSin = Math.sin(leg) * 4;
      ctx.beginPath();
      ctx.ellipse(-size * 0.3, size * 0.5 + legSin, 6, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(size * 0.2, size * 0.5 - legSin, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Autumn Basket on back
      ctx.fillStyle = '#A1887F';
      ctx.beginPath();
      ctx.arc(-10, -18, 14, 0, Math.PI);
      ctx.fill();
      ctx.strokeStyle = '#6D4C41';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    function drawItem(ctx, item) {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rotation);

      if (item.type === 'golden-chestnut') {
        // Glowing aura
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#F39C12';
        ctx.beginPath();
        ctx.ellipse(0, 0, item.radius, item.radius * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFF9C4';
        ctx.beginPath();
        ctx.ellipse(-item.radius * 0.3, -item.radius * 0.2, item.radius * 0.35, item.radius * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (item.type === 'acorn') {
        // Acorn cap
        ctx.fillStyle = '#5D4037';
        ctx.beginPath();
        ctx.arc(0, -item.radius * 0.3, item.radius * 0.85, Math.PI, Math.PI * 2);
        ctx.fill();
        // Body
        ctx.fillStyle = '#8D6E63';
        ctx.beginPath();
        ctx.ellipse(0, item.radius * 0.2, item.radius * 0.75, item.radius * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Regular Chestnut
        ctx.fillStyle = '#6D4C41';
        ctx.beginPath();
        ctx.ellipse(0, -2, item.radius, item.radius * 0.85, 0, 0, Math.PI * 2);
        ctx.fill();
        // Bottom cap
        ctx.fillStyle = '#D7CCC8';
        ctx.beginPath();
        ctx.ellipse(0, item.radius * 0.45, item.radius * 0.75, item.radius * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Background hills
      ctx.fillStyle = '#FFE082';
      ctx.beginPath();
      ctx.arc(width * 0.8, height - 100, 180, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = '#81C784';
      ctx.beginPath();
      ctx.ellipse(width * 0.3, height - 20, width * 0.6, 70, 0, 0, Math.PI * 2);
      ctx.fill();

      // Falling background leaves
      for (const leaf of autumnLeaves) {
        ctx.save();
        ctx.translate(leaf.x, leaf.y);
        ctx.rotate(leaf.angle);
        ctx.fillStyle = leaf.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, leaf.size, leaf.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Ground path
      ctx.fillStyle = '#A5D6A7';
      ctx.fillRect(0, height - 45, width, 45);

      // Items
      for (const item of items) {
        drawItem(ctx, item);
      }

      // Hedgehog Player
      drawHedgehog(ctx, hedgehog.x, hedgehog.y, hedgehog.size, hedgehog.direction, hedgehog.legOffset);

      // Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function gameLoop(timestamp) {
      update(timestamp);
      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
