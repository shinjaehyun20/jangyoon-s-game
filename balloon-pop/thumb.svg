<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF4E50"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FF9F45"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D96FF"/>
      <stop offset="100%" stop-color="#2B7A78"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#bg)"/>
  
  <!-- Strings -->
  <line x1="70" y1="120" x2="100" y2="180" stroke="#666" stroke-width="2"/>
  <line x1="130" y1="110" x2="100" y2="180" stroke="#666" stroke-width="2"/>
  <line x1="100" y1="135" x2="100" y2="180" stroke="#666" stroke-width="2"/>
  
  <!-- Balloon 1 (Left) -->
  <ellipse cx="70" cy="85" rx="28" ry="34" fill="url(#b1)"/>
  <polygon points="67,118 73,118 70,123" fill="#FF4E50"/>
  <ellipse cx="62" cy="72" rx="6" ry="12" fill="white" opacity="0.6" transform="rotate(-20 62 72)"/>

  <!-- Balloon 2 (Right) -->
  <ellipse cx="130" cy="75" rx="26" ry="32" fill="url(#b3)"/>
  <polygon points="127,106 133,106 130,111" fill="#2B7A78"/>
  <ellipse cx="123" cy="64" rx="5" ry="10" fill="white" opacity="0.6" transform="rotate(-20 123 64)"/>

  <!-- Balloon 3 (Center Top) -->
  <ellipse cx="100" cy="100" rx="30" ry="36" fill="url(#b2)"/>
  <polygon points="97,135 103,135 100,140" fill="#FF9F45"/>
  <ellipse cx="91" cy="86" rx="7" ry="14" fill="white" opacity="0.6" transform="rotate(-20 91 86)"/>
  
  <!-- Sparkles -->
  <text x="140" y="40" font-size="20">✨</text>
  <text x="35" y="50" font-size="16">⭐</text>
</svg>