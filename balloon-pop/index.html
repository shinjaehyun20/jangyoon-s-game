<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎈 풍선 터트리기</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; font-family: 'Arial Rounded MT Bold', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
    }
    #game-container {
      position: relative; width: 100%; height: 100%; max-width: 600px; margin: 0 auto;
      overflow: hidden; background: linear-gradient(180deg, #8EE4AF 0%, #5CD895 100%);
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    #sky-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #A8E6CF 0%, #DCEDC1 100%);
    }
    .cloud {
      position: absolute; background: rgba(255, 255, 255, 0.8); border-radius: 50px;
      animation: floatCloud 20s linear infinite;
    }
    @keyframes floatCloud {
      from { transform: translateX(-150px); }
      to { transform: translateX(650px); }
    }
    #header {
      position: absolute; top: 20px; left: 0; width: 100%; padding: 0 20px;
      display: flex; justify-content: space-between; align-items: center; z-index: 10;
    }
    .badge {
      background: rgba(255, 255, 255, 0.9); padding: 10px 18px; border-radius: 25px;
      font-size: 20px; font-weight: bold; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    #score-badge { color: #FF4E50; }
    #time-badge { color: #2B7A78; }
    .balloon {
      position: absolute; cursor: pointer; transform: translate(-50%, 0);
      transition: transform 0.1s active;
    }
    .balloon:active { transform: translate(-50%, 0) scale(0.9); }
    .balloon-body {
      width: 70px; height: 85px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      position: relative; box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), inset 5px 5px 15px rgba(255,255,255,0.6);
    }
    .balloon-body::after {
      content: ""; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-bottom: 10px solid inherit;
    }
    .string {
      position: absolute; top: 85px; left: 50%; width: 2px; height: 45px;
      background: rgba(100, 100, 100, 0.4); transform: translateX(-50%);
    }
    .pop-text {
      position: absolute; font-size: 24px; font-weight: bold; color: #FFF;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3); pointer-events: none; animation: popUp 0.6s ease-out forwards;
    }
    @keyframes popUp {
      0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -50px) scale(1.5); opacity: 0; }
    }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
    }
    .card {
      background: white; padding: 40px; border-radius: 30px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 80%;
    }
    h1 { margin: 0 0 15px 0; color: #FF4E50; font-size: 32px; }
    p { font-size: 18px; color: #555; margin-bottom: 25px; }
    .btn {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF4E50 100%);
      color: white; border: none; padding: 15px 35px; font-size: 20px;
      font-weight: bold; border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 15px rgba(255,78,80,0.4); transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.95); }
  </style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🎈 풍선 터트리기 — 하늘로 올라가는 알록달록 풍선을 톡톡 터트려요! 별 풍선을 보너스! 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🎈 풍선 터트리기 | 장윤이 게임 놀이터">
<meta property="og:description" content="🎈 풍선 터트리기 — 하늘로 올라가는 알록달록 풍선을 톡톡 터트려요! 별 풍선을 보너스! 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
  <div id="game-container">
    <div id="sky-bg">
      <div class="cloud" style="top: 10%; width: 100px; height: 40px; left: 10%; animation-duration: 25s;"></div>
      <div class="cloud" style="top: 30%; width: 140px; height: 50px; left: 60%; animation-duration: 18s;"></div>
      <div class="cloud" style="top: 60%; width: 120px; height: 45px; left: 20%; animation-duration: 22s;"></div>
    </div>
    <div id="header">
      <div class="badge" id="score-badge">⭐️ <span id="score">0</span></div>
      <div class="badge" id="time-badge">⏱️ <span id="time">30</span>초</div>
    </div>
    <div id="overlay">
      <div class="card">
        <h1>🎈 풍선 터트리기</h1>
        <p>하늘로 올라가는 알록달록 풍선을<br>손가락으로 톡톡 터트려보세요!</p>
        <button class="btn" onclick="startGame()">게임 시작!</button>
      </div>
    </div>
  </div>

  <script>
    const colors = ['#FF6B6B', '#4D96FF', '#6BCB77', '#FFD93D', '#FF9F45', '#9D4EDD'];
    let score = 0, time = 30, gameInterval, spawnInterval, isPlaying = false;
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const overlay = document.getElementById('overlay');
    const container = document.getElementById('game-container');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPopSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function startGame() {
      score = 0; time = 30; isPlaying = true;
      scoreEl.textContent = score; timeEl.textContent = time;
      overlay.style.display = 'none';
      document.querySelectorAll('.balloon').forEach(b => b.remove());
      
      gameInterval = setInterval(() => {
        time--;
        timeEl.textContent = time;
        if (time <= 0) endGame();
      }, 1000);

      spawnInterval = setInterval(spawnBalloon, 400);
    }

    function spawnBalloon() {
      if (!isPlaying) return;
      const b = document.createElement('div');
      b.className = 'balloon';
      const color = colors[Math.floor(Math.random() * colors.length)];
      const x = Math.random() * 80 + 10; // 10% ~ 90%
      const speed = Math.random() * 2 + 2; // 2~4 px per frame
      
      b.style.left = `${x}%`;
      b.style.bottom = '-150px';
      
      b.innerHTML = `
        <div class="balloon-body" style="background: ${color}; border-color: ${color};"></div>
        <div class="string"></div>
      `;

      const touchEvent = (e) => {
        e.stopPropagation();
        if (!isPlaying) return;
        playPopSound();
        score += 10;
        scoreEl.textContent = score;
        
        const pop = document.createElement('div');
        pop.className = 'pop-text';
        pop.textContent = '+10';
        pop.style.left = b.style.left;
        pop.style.top = `${b.offsetTop}px`;
        container.appendChild(pop);
        setTimeout(() => pop.remove(), 600);
        
        b.remove();
      };

      b.addEventListener('mousedown', touchEvent);
      b.addEventListener('touchstart', (e) => { e.preventDefault(); touchEvent(e); }, { passive: false });
      
      container.appendChild(b);

      let currentBottom = -150;
      const moveInterval = setInterval(() => {
        if (!isPlaying) { clearInterval(moveInterval); return; }
        currentBottom += speed;
        b.style.bottom = `${currentBottom}px`;
        if (currentBottom > container.clientHeight + 100) {
          clearInterval(moveInterval);
          b.remove();
        }
      }, 20);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div class="card">
          <h1>⏱️ 시간 종료!</h1>
          <p>대단해요! 장윤이의 최종 점수는<br><strong>⭐️ ${score}점</strong> 입니다!</p>
          <button class="btn" onclick="startGame()">다시 하기</button>
        </div>
      `;
    }
  </script>
</body>
</html>
