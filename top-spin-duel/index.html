<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🪀 팽이 돌리기 대결</title>
  <style>
    :root {
      --bg: #3d2b1f;
      --accent: #e63946;
      --accent2: #457b9d;
      --text: #ffffff;
      --card: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 8px; gap: 6px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(18px, 5vw, 26px);
      font-weight: 900;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border-radius: 14px;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 700;
    }
    #game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #canvas {
      width: 100%;
      max-width: 400px;
      touch-action: none;
      border-radius: 16px;
    }
    .power-bars {
      position: absolute;
      top: 4px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
    }
    .power-bar {
      width: 42%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .power-bar span { font-size: 12px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .power-track {
      width: 100%;
      height: 10px;
      background: rgba(0,0,0,0.35);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .power-fill { height: 100%; width: 0%; transition: width 0.08s linear; }
    .power-fill.mine { background: linear-gradient(90deg, #e63946, #ff9c5c); }
    .power-fill.opp { background: linear-gradient(90deg, #457b9d, #7fdfff); }
    .charge-ui {
      position: absolute;
      bottom: 6%;
      left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .charge-timer { font-size: 15px; font-weight: 700; color: var(--accent2); text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
    .btn-charge {
      background: linear-gradient(135deg, #e63946, #ff9c5c);
      border: none; border-radius: 16px;
      color: #fff; font-size: 20px; font-weight: 900;
      padding: 18px 40px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(230,57,70,0.5);
      transition: transform 0.08s;
    }
    .btn-charge:active { transform: scale(0.92); }
    .boost-hint {
      position: absolute;
      bottom: 6%;
      left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
    }
    .hidden { display: none !important; }
    .round-result {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      border-radius: 16px;
    }
    #roundResultText { font-size: 30px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      padding: 0 2px;
    }
    .home-link { color: var(--accent2); text-decoration: none; font-weight: 700; }
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: linear-gradient(135deg, #4a3320 0%, #241a10 100%);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    .overlay-card h2 { font-size: 28px; margin-bottom: 10px; }
    .overlay-card p { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 18px; line-height: 1.7; }
    .btn-start {
      background: linear-gradient(135deg, #ffd166, #f4a261);
      border: none; border-radius: 14px;
      color: #3d2b1f; font-size: 18px; font-weight: 900;
      padding: 14px 36px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,209,102,0.4);
      transition: transform 0.1s;
    }
    .btn-start:active { transform: scale(0.94); }
    .result-score {
      font-size: 46px; font-weight: 900;
      color: #ffd166;
      margin: 8px 0;
    }
    #bestMsg { font-size: 13px; color: #ffd166; margin: 4px 0 12px; min-height: 20px; }
  </style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🪀 팽이 돌리기 대결 — 탭탭탭 파워 충전 후 상대 팽이와 회전력 대결! 부스트 3회, 5판 승부 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🪀 팽이 돌리기 대결 | 장윤이 게임 놀이터">
<meta property="og:description" content="🪀 팽이 돌리기 대결 — 탭탭탭 파워 충전 후 상대 팽이와 회전력 대결! 부스트 3회, 5판 승부 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
  <div class="wrap">
    <h1>🪀 팽이 돌리기 대결</h1>
    <div class="hud">
      <span>라운드 <span id="roundNum">1</span>/5</span>
      <span>🏆 <span id="winsNum">0</span>승</span>
    </div>
    <div id="game-area">
      <canvas id="canvas"></canvas>
      <div class="power-bars">
        <div class="power-bar">
          <span>나</span>
          <div class="power-track"><div class="power-fill mine" id="myFill"></div></div>
        </div>
        <div class="power-bar">
          <span>상대</span>
          <div class="power-track"><div class="power-fill opp" id="oppFill"></div></div>
        </div>
      </div>
      <div class="charge-ui" id="chargeUI">
        <div class="charge-timer">⏱ <span id="chargeTimer">3.0</span>초</div>
        <button class="btn-charge" id="chargeBtn">탭탭탭! 돌리기</button>
      </div>
      <div class="boost-hint hidden" id="boostHint">팽이를 탭해서 부스트! (<span id="boostsLeft">3</span>회 남음)</div>
      <div class="round-result hidden" id="roundResult">
        <div id="roundResultText"></div>
        <button class="btn-start" id="nextRoundBtn">다음 라운드 ▶</button>
      </div>
    </div>
    <footer>
      <small>탭으로 파워 충전! 대결 중엔 탭으로 부스트!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <!-- 시작 오버레이 -->
  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🪀 팽이 돌리기 대결</h2>
      <p>화면을 빠르게 탭해서 내 팽이<br>파워를 채우세요! (3초)<br><br>대결이 시작되면 파워가 서서히<br>줄어들어요. 상대보다 오래<br>버티면 승리! 팽이를 탭하면<br>부스트(3회)로 파워를 채워요.<br><br>5판 승부, 최고 승수에 도전!</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>

  <!-- 결과 오버레이 -->
  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 대결 종료!</h2>
      <div class="result-score" id="finalScore">0승</div>
      <div id="bestMsg"></div>
      <p id="resultMsg">잘했어요!</p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    const CONFIG = {
      totalRounds: 5,
      chargeDuration: 3000,
      chargePerTap: 9,
      chargeFloor: 25,
      myDecayPerSec: 9,
      oppDecayMin: 7,
      oppDecayMax: 12.5,
      boostAmount: 15,
      boostMax: 3,
      boostCooldown: 900,
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const $ = id => document.getElementById(id);

    let W, H;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      W = canvas.width = Math.min(rect.width, 400);
      H = canvas.height = Math.min(rect.height * 0.86, 420);
    }

    let state = {
      round: 1,
      wins: 0,
      myPower: 0,
      oppPower: 0,
      phase: 'idle',
      chargeTimeLeft: CONFIG.chargeDuration,
      oppDecayRate: 0,
      boostsLeft: CONFIG.boostMax,
      boostReady: true,
      boostCooldownLeft: 0,
      lastTs: 0,
      myRot: 0,
      oppRot: 0,
      animId: null,
    };

    function updateTopHUD() {
      $('roundNum').textContent = Math.min(state.round, CONFIG.totalRounds);
      $('winsNum').textContent = state.wins;
    }

    function updateBars() {
      $('myFill').style.width = Math.max(0, state.myPower) + '%';
      $('oppFill').style.width = Math.max(0, state.oppPower) + '%';
    }

    function drawArena() {
      ctx.clearRect(0, 0, W, H);
      const grad = ctx.createRadialGradient(W / 2, H * 0.55, 10, W / 2, H * 0.55, W * 0.62);
      grad.addColorStop(0, '#8a5a34');
      grad.addColorStop(1, '#3d2b1f');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(W / 2, H * 0.58, W * 0.44, H * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function drawTop(x, y, power, rot, colorMain, colorAccent) {
      ctx.save();
      const wobble = power > 0 && power < 20 ? Math.sin(rot * 6) * 4 * (1 - power / 20) : 0;
      ctx.translate(x + wobble, y);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(0, -34);
      ctx.lineTo(24, 14);
      ctx.lineTo(-24, 14);
      ctx.closePath();
      ctx.fillStyle = power <= 0 ? '#6b6b6b' : colorMain;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-16, -6); ctx.lineTo(16, -6); ctx.lineTo(10, 14); ctx.lineTo(-10, 14);
      ctx.closePath();
      ctx.fillStyle = power <= 0 ? '#9a9a9a' : colorAccent;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 16, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#2b2b2b';
      ctx.fill();
      ctx.restore();
    }

    function drawFrame() {
      drawArena();
      const cx1 = W * 0.32, cx2 = W * 0.68, cy = H * 0.54;
      drawTop(cx1, cy, state.myPower, state.myRot, '#e63946', '#f1faee');
      drawTop(cx2, cy, state.oppPower, state.oppRot, '#457b9d', '#f1faee');
    }

    function startCharging() {
      state.myPower = 0;
      state.chargeTimeLeft = CONFIG.chargeDuration;
      state.phase = 'charging';
      state.lastTs = 0;
      $('chargeUI').classList.remove('hidden');
      $('boostHint').classList.add('hidden');
      $('roundResult').classList.add('hidden');
      updateBars();
      updateTopHUD();
      state.animId = requestAnimationFrame(loop);
    }

    function finishCharging() {
      state.myPower = Math.max(CONFIG.chargeFloor, Math.min(100, state.myPower));
      const roundBoost = (state.round - 1) * 1.5;
      state.oppPower = Math.min(96, 50 + roundBoost + Math.random() * 35);
      state.oppDecayRate = CONFIG.oppDecayMin + Math.random() * (CONFIG.oppDecayMax - CONFIG.oppDecayMin);
      state.boostsLeft = CONFIG.boostMax;
      state.boostReady = true;
      state.boostCooldownLeft = 0;
      state.phase = 'dueling';
      $('chargeUI').classList.add('hidden');
      $('boostHint').classList.remove('hidden');
      $('boostsLeft').textContent = state.boostsLeft;
    }

    function resolveRound() {
      state.phase = 'roundend';
      let win;
      if (state.myPower <= 0 && state.oppPower <= 0) win = true;
      else win = state.oppPower <= 0;
      if (win) state.wins++;
      updateTopHUD();
      $('boostHint').classList.add('hidden');
      $('roundResultText').textContent = win ? '🏆 승리!' : '😅 아쉬워요!';
      $('roundResultText').style.color = win ? '#ffd166' : '#ff9c5c';
      $('nextRoundBtn').textContent = state.round >= CONFIG.totalRounds ? '결과 보기' : '다음 라운드 ▶';
      $('roundResult').classList.remove('hidden');
    }

    function nextRound() {
      $('roundResult').classList.add('hidden');
      state.round++;
      if (state.round > CONFIG.totalRounds) { finishGame(); return; }
      startCharging();
    }

    function finishGame() {
      const best = parseInt(localStorage.getItem('top-spin-duel_best') || '0', 10);
      const isNew = state.wins > best;
      if (isNew) localStorage.setItem('top-spin-duel_best', state.wins);
      $('finalScore').textContent = state.wins + '승 / ' + CONFIG.totalRounds + '판';
      $('bestMsg').textContent = isNew ? '🏆 최고 기록 갱신!' : `최고 기록: ${Math.max(best, state.wins)}승`;
      const msgs = ['팽이왕! 🪀', '멋진 승부! 🔥', '다음엔 전승 도전!'];
      $('resultMsg').textContent = msgs[Math.floor(Math.random() * msgs.length)];
      $('endOverlay').classList.remove('hidden');
    }

    function loop(ts) {
      if (!state.lastTs) state.lastTs = ts;
      const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
      state.lastTs = ts;

      if (state.phase === 'charging') {
        state.chargeTimeLeft -= dt * 1000;
        $('chargeTimer').textContent = Math.max(0, state.chargeTimeLeft / 1000).toFixed(1);
        state.myRot += (state.myPower / 100) * dt * 10;
        updateBars();
        drawFrame();
        if (state.chargeTimeLeft <= 0) {
          finishCharging();
          state.animId = requestAnimationFrame(loop);
          return;
        }
      } else if (state.phase === 'dueling') {
        state.myPower = Math.max(0, state.myPower - CONFIG.myDecayPerSec * dt);
        state.oppPower = Math.max(0, state.oppPower - state.oppDecayRate * dt);
        state.myRot += (state.myPower / 100) * dt * 14;
        state.oppRot += (state.oppPower / 100) * dt * 14;
        if (!state.boostReady) {
          state.boostCooldownLeft -= dt * 1000;
          if (state.boostCooldownLeft <= 0) state.boostReady = true;
        }
        updateBars();
        drawFrame();
        if (state.myPower <= 0 || state.oppPower <= 0) {
          resolveRound();
          return;
        }
      } else {
        drawFrame();
      }
      state.animId = requestAnimationFrame(loop);
    }

    function startGame() {
      cancelAnimationFrame(state.animId);
      resize();
      state = {
        round: 1, wins: 0, myPower: 0, oppPower: 0, phase: 'idle',
        chargeTimeLeft: CONFIG.chargeDuration, oppDecayRate: 0,
        boostsLeft: CONFIG.boostMax, boostReady: true, boostCooldownLeft: 0,
        lastTs: 0, myRot: 0, oppRot: 0, animId: null,
      };
      $('startOverlay').classList.add('hidden');
      $('endOverlay').classList.add('hidden');
      startCharging();
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (state.phase === 'charging') {
        state.myPower = Math.min(100, state.myPower + CONFIG.chargePerTap);
      } else if (state.phase === 'dueling') {
        if (state.boostReady && state.boostsLeft > 0) {
          state.myPower = Math.min(100, state.myPower + CONFIG.boostAmount);
          state.boostsLeft--;
          state.boostReady = false;
          state.boostCooldownLeft = CONFIG.boostCooldown;
          $('boostsLeft').textContent = state.boostsLeft;
        }
      }
    });
    $('chargeBtn').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (state.phase === 'charging') state.myPower = Math.min(100, state.myPower + CONFIG.chargePerTap);
    });

    $('startBtn').addEventListener('pointerdown', startGame);
    $('restartBtn').addEventListener('pointerdown', startGame);
    $('nextRoundBtn').addEventListener('pointerdown', nextRound);
    window.addEventListener('resize', () => { resize(); });
    resize();
    updateTopHUD();
    drawFrame();
  })();
  </script>
</body>
</html>
