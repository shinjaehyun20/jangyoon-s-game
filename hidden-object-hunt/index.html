<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🔍 숨은 그림 찾기 챌린지</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    background: #0f172a;
    color: #fff;
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 10px 12px; gap: 8px;
    margin: 0 auto;
  }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.08); border-radius: 12px; padding: 6px 12px;
  }
  .btn-back {
    color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 700;
    padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.05);
  }
  h1 { font-size: 18px; color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.4); }
  .hud {
    display: flex; justify-content: space-between;
    background: rgba(255,255,255,0.06); border-radius: 12px; padding: 8px 14px;
    font-size: 14px; font-weight: 700;
  }
  .hud span { color: #38bdf8; }
  .scene-card {
    position: relative; flex: 1;
    border-radius: 16px; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(56,189,248,0.15);
    border: 2px solid rgba(255,255,255,0.1);
  }
  .stage-title {
    position: absolute; top: 10px; left: 12px; z-index: 5;
    background: rgba(15,23,42,0.75); padding: 4px 10px; border-radius: 20px;
    font-size: 13px; font-weight: 800; color: #f43f5e; backdrop-filter: blur(4px);
  }
  .object-item {
    position: absolute; width: 46px; height: 46px;
    margin-left: -23px; margin-top: -23px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; cursor: pointer; border-radius: 50%;
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .object-item:active { transform: scale(1.2); }
  .object-item.found {
    opacity: 0.25; filter: grayscale(1); pointer-events: none;
  }
  .target-panel {
    background: rgba(255,255,255,0.08); border-radius: 14px; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .target-title { font-size: 12px; font-weight: 700; color: #cbd5e1; text-align: center; }
  .target-list {
    display: flex; justify-content: space-around; align-items: center;
  }
  .target-slot {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 24px; position: relative; padding: 4px 8px; border-radius: 8px;
    background: rgba(255,255,255,0.04); transition: all 0.2s;
  }
  .target-slot.done {
    background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.5);
  }
  .target-slot.done::after {
    content: '✓'; position: absolute; top: -4px; right: -4px;
    background: #22c55e; color: #fff; font-size: 10px; font-weight: 900;
    width: 16px; height: 16px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center;
  }
  .overlay {
    position: absolute; inset: 0; background: rgba(15,23,42,0.9);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 20; border-radius: 16px; text-align: center; padding: 20px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #0f172a; font-size: 18px; font-weight: 800;
    padding: 12px 28px; border: none; border-radius: 25px;
    box-shadow: 0 6px 18px rgba(245,158,11,0.4); cursor: pointer;
  }
  .btn-primary:active { transform: scale(0.95); }
  .sparkle-fx {
    position: absolute; pointer-events: none; z-index: 10;
    font-size: 24px; animation: popUp 0.6s forwards ease-out;
  }
  @keyframes popUp {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -80%) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="../index.html" class="btn-back">◀ 전체 목록</a>
    <h1>🔍 숨은 그림 찾기</h1>
    <div style="width: 60px;"></div>
  </div>
  <div class="hud">
    <div>⏱️ 시간: <span id="time">45</span>s</div>
    <div>📍 스테이지: <span id="stage">1</span>/3</div>
    <div>⭐ 점수: <span id="score">0</span></div>
    <div>🏆 최고: <span id="best">0</span></div>
  </div>

  <div id="sceneCard" class="scene-card">
    <div id="stageTitle" class="stage-title">🧸 장난감 방</div>
    <div id="overlay" class="overlay">
      <h2 style="color: #fbbf24; font-size: 24px;">🔍 숨은 그림 찾기 챌린지</h2>
      <p style="color: #94a3b8; font-size: 14px; line-height: 1.6;">
        그림 속에 숨겨진 5개의 물건을 찾아보세요!<br>3개 스테이지를 45초 안에 모두 클리어하세요!
      </p>
      <button class="btn-primary" onclick="startGame()">🚀 게임 시작</button>
    </div>
  </div>

  <div class="target-panel">
    <div class="target-title">찾아야 할 숨은 물건 5개</div>
    <div id="targetList" class="target-list"></div>
  </div>
</div>

<script>
  const stages = [
    {
      title: "🧸 1단계: 장난감 방",
      targets: [
        { icon: "🧸", name: "곰인형" },
        { icon: "🔑", name: "열쇠" },
        { icon: "🎨", name: "팔레트" },
        { icon: "💎", name: "보석" },
        { icon: "🚗", name: "미니카" }
      ],
      deco: ["⚽", "🪀", "🎲", "🧩", "🎺", "🥁", "🎯", "🪆", "🪁", "🎁", "🎈", "🔮", "🎨", "🧸", "🔑", "💎", "🚗", "🤹", "🎨", "🧸"]
    },
    {
      title: "🚀 2단계: 우주선 내부",
      targets: [
        { icon: "🪐", name: "행성" },
        { icon: "🛸", name: "UFO" },
        { icon: "🤖", name: "로봇" },
        { icon: "🔋", name: "건전지" },
        { icon: "🛰️", name: "인공위성" }
      ],
      deco: ["⭐", "🌙", "☄️", "🌌", "🌠", "🛰️", "🛸", "🪐", "🤖", "🔋", "🔭", "⚡", "🌟", "🪐", "🛸", "🤖", "🔋", "🛰️", "🛸", "🤖"]
    },
    {
      title: "🌴 3단계: 보물섬",
      targets: [
        { icon: "🗺️", name: "지도" },
        { icon: "🦜", name: "앵무새" },
        { icon: "🪙", name: "동전" },
        { icon: "🧭", name: "나침반" },
        { icon: "👑", name: "왕관" }
      ],
      deco: ["🐚", "🦀", "🌴", "⛵", "⚓", "🏴‍☠️", "⚔️", "💎", "🗺️", "🦜", "🪙", "🧭", "👑", "🐚", "🌴", "🪙", "🧭", "👑", "🗺️", "🦜"]
    }
  ];

  let currentStage = 0;
  let score = 0;
  let bestScore = parseInt(localStorage.getItem('hidden_object_hunt_best') || '0');
  let timeLeft = 45;
  let timerId = null;
  let foundCount = 0;
  let audioCtx = null;

  document.getElementById('best').textContent = bestScore;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(freq, duration = 0.1, type = 'sine') {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playSuccessSound() {
    if (!audioCtx) return;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      setTimeout(() => playSound(freq, 0.15, 'triangle'), idx * 80);
    });
  }

  function playClearSound() {
    if (!audioCtx) return;
    [440, 554.37, 659.25, 880].forEach((freq, idx) => {
      setTimeout(() => playSound(freq, 0.2, 'sine'), idx * 100);
    });
  }

  function startGame() {
    initAudio();
    document.getElementById('overlay').style.display = 'none';
    currentStage = 0;
    score = 0;
    timeLeft = 45;
    document.getElementById('score').textContent = score;
    document.getElementById('time').textContent = timeLeft;

    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;
      document.getElementById('time').textContent = timeLeft;
      if (timeLeft <= 0) {
        endGame(false);
      }
    }, 1000);

    loadStage(currentStage);
  }

  function loadStage(stageIdx) {
    foundCount = 0;
    document.getElementById('stage').textContent = stageIdx + 1;
    const stageData = stages[stageIdx];
    document.getElementById('stageTitle').textContent = stageData.title;

    const sceneCard = document.getElementById('sceneCard');
    // Clear old items except title and overlay
    const oldItems = sceneCard.querySelectorAll('.object-item');
    oldItems.forEach(el => el.remove());

    // Build targets hud
    const targetList = document.getElementById('targetList');
    targetList.innerHTML = '';
    stageData.targets.forEach((t, i) => {
      const slot = document.createElement('div');
      slot.className = 'target-slot';
      slot.id = `target-${i}`;
      slot.innerHTML = `<span>${t.icon}</span>`;
      targetList.appendChild(slot);
    });

    // Generate positions grid
    const targetIcons = stageData.targets.map(t => t.icon);
    const decoIcons = stageData.deco.filter(icon => !targetIcons.includes(icon));
    const allItems = [...stageData.targets.map(t => ({ icon: t.icon, isTarget: true })),
                      ...decoIcons.slice(0, 15).map(icon => ({ icon, isTarget: false }))];
    
    // Shuffle all items
    allItems.sort(() => Math.random() - 0.5);

    const positions = [];
    const rows = 5, cols = 4;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        // jitter
        const x = 12 + c * 23 + (Math.random() * 8 - 4);
        const y = 16 + r * 16 + (Math.random() * 6 - 3);
        positions.push({ x, y });
      }
    }
    positions.sort(() => Math.random() - 0.5);

    allItems.forEach((item, i) => {
      if (i >= positions.length) return;
      const el = document.createElement('div');
      el.className = 'object-item';
      el.textContent = item.icon;
      el.style.left = positions[i].x + '%';
      el.style.top = positions[i].y + '%';
      el.style.transform = `rotate(${(Math.random() * 30 - 15)}deg)`;

      if (item.isTarget) {
        el.dataset.isTarget = "true";
        el.dataset.targetIcon = item.icon;
      }

      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        onObjectClick(el, item);
      });
      sceneCard.appendChild(el);
    });
  }

  function onObjectClick(el, item) {
    if (el.classList.contains('found')) return;

    if (item.isTarget) {
      el.classList.add('found');
      foundCount++;
      score += 100 + timeLeft * 2;
      document.getElementById('score').textContent = score;

      playSound(880, 0.1, 'sine');
      createSparkle(el, '✨ +100');

      // Update HUD slot
      const stageData = stages[currentStage];
      const targetIdx = stageData.targets.findIndex(t => t.icon === item.icon);
      if (targetIdx !== -1) {
        const slot = document.getElementById(`target-${targetIdx}`);
        if (slot) slot.classList.add('done');
      }

      if (foundCount >= 5) {
        playSuccessSound();
        setTimeout(() => {
          if (currentStage + 1 < stages.length) {
            currentStage++;
            loadStage(currentStage);
          } else {
            endGame(true);
          }
        }, 500);
      }
    } else {
      playSound(220, 0.15, 'sawtooth');
      el.style.transform = 'scale(0.8)';
      setTimeout(() => el.style.transform = 'scale(1)', 200);
    }
  }

  function createSparkle(el, text) {
    const rect = el.getBoundingClientRect();
    const parentRect = document.getElementById('sceneCard').getBoundingClientRect();
    const sp = document.createElement('div');
    sp.className = 'sparkle-fx';
    sp.textContent = text;
    sp.style.left = (rect.left - parentRect.left + rect.width / 2) + 'px';
    sp.style.top = (rect.top - parentRect.top + rect.height / 2) + 'px';
    sp.style.color = '#fbbf24';
    sp.style.fontWeight = 'bold';
    document.getElementById('sceneCard').appendChild(sp);
    setTimeout(() => sp.remove(), 600);
  }

  function endGame(isWin) {
    clearInterval(timerId);
    if (isWin) playClearSound();

    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('hidden_object_hunt_best', bestScore);
      document.getElementById('best').textContent = bestScore;
    }

    const overlay = document.getElementById('overlay');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2 style="color: ${isWin ? '#34d399' : '#f87171'}; font-size: 26px;">
        ${isWin ? '🎉 탐험 성공!' : '⏰ 시간 종료!'}
      </h2>
      <p style="color: #e2e8f0; font-size: 16px;">
        최종 점수: <b style="color:#fbbf24; font-size: 20px;">${score}점</b><br>
        최고 기록: <b>${bestScore}점</b>
      </p>
      <button class="btn-primary" onclick="startGame()">🔄 다시 도전하기</button>
    `;
  }
</script>
</body>
</html>
