<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bambooSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="50%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="bambooStalk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="chimeWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="softChimeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Serene Bamboo Forest Background -->
  <rect width="200" height="200" rx="24" fill="url(#bambooSky)"/>

  <!-- Background Bamboo Stalks -->
  <rect x="25" y="0" width="12" height="200" rx="4" fill="url(#bambooStalk)" opacity="0.4"/>
  <rect x="165" y="0" width="14" height="200" rx="5" fill="url(#bambooStalk)" opacity="0.4"/>
  <rect x="5" y="0" width="8" height="200" rx="3" fill="url(#bambooStalk)" opacity="0.25"/>
  <rect x="185" y="0" width="10" height="200" rx="4" fill="url(#bambooStalk)" opacity="0.3"/>

  <!-- Horizontal Bamboo Hanging Branch -->
  <path d="M -10 42 Q 100 36 210 46 L 210 54 Q 100 44 -10 50 Z" fill="#047857"/>

  <!-- Hanging Wind Chimes (Bamboo Tubes) -->
  <g stroke="#78350F" stroke-width="1.2">
    <!-- Strings -->
    <line x1="60" y1="46" x2="60" y2="70"/>
    <line x1="85" y1="45" x2="85" y2="65"/>
    <line x1="115" y1="45" x2="115" y2="68"/>
    <line x1="140" y1="47" x2="140" y2="72"/>
  </g>

  <!-- Chime Tubes -->
  <g>
    <rect x="55" y="70" width="10" height="38" rx="4" fill="url(#chimeWood)" filter="url(#softChimeGlow)"/>
    <rect x="80" y="65" width="10" height="48" rx="4" fill="url(#chimeWood)" filter="url(#softChimeGlow)"/>
    <rect x="110" y="68" width="10" height="44" rx="4" fill="url(#chimeWood)" filter="url(#softChimeGlow)"/>
    <rect x="135" y="72" width="10" height="34" rx="4" fill="url(#chimeWood)" filter="url(#softChimeGlow)"/>
  </g>

  <!-- Floating Musical Notes & Sparkles -->
  <g fill="#F59E0B" opacity="0.85" filter="url(#softChimeGlow)">
    <circle cx="48" cy="62" r="3"/>
    <circle cx="155" cy="58" r="2.5"/>
    <circle cx="72" cy="115" r="2"/>
    <circle cx="128" cy="112" r="2.2"/>
  </g>

  <!-- Baby Panda Character sitting cute at bottom -->
  <g transform="translate(100, 150)">
    <!-- Round Black Ears -->
    <circle cx="-24" cy="-28" r="10" fill="#1E293B"/>
    <circle cx="24" cy="-28" r="10" fill="#1E293B"/>

    <!-- Round Chubby Body -->
    <circle cx="0" cy="12" r="32" fill="#FFFFFF"/>

    <!-- Black Back/Shoulders stripe -->
    <path d="M -30 6 Q 0 -6 30 6 Q 32 20 28 26 Q 0 16 -28 26 Z" fill="#1E293B"/>

    <!-- Round Cute Head -->
    <circle cx="0" cy="-8" r="28" fill="#FFFFFF"/>

    <!-- Panda Black Eye Patches -->
    <ellipse cx="-11" cy="-8" rx="7.5" ry="9" fill="#1E293B" transform="rotate(-15, -11, -8)"/>
    <ellipse cx="11" cy="-8" rx="7.5" ry="9" fill="#1E293B" transform="rotate(15, 11, -8)"/>

    <!-- Shiny Eyes -->
    <circle cx="-10" cy="-8" r="2.8" fill="#FFFFFF"/>
    <circle cx="-9" cy="-9" r="1.2" fill="#1E293B"/>
    <circle cx="10" cy="-8" r="2.8" fill="#FFFFFF"/>
    <circle cx="11" cy="-9" r="1.2" fill="#1E293B"/>

    <!-- Nose & Mouth -->
    <ellipse cx="0" cy="-1" rx="3" ry="2" fill="#1E293B"/>
    <path d="M -3 3 Q 0 5.5 3 3" fill="none" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="-18" cy="-2" rx="4" ry="2.5" fill="#FDA4AF" opacity="0.7"/>
    <ellipse cx="18" cy="-2" rx="4" ry="2.5" fill="#FDA4AF" opacity="0.7"/>

    <!-- Cute Front Paws holding a bamboo shoot -->
    <ellipse cx="-12" cy="14" rx="6" ry="8" fill="#1E293B"/>
    <ellipse cx="12" cy="14" rx="6" ry="8" fill="#1E293B"/>
    <path d="M -4 20 Q 0 8 4 20 Z" fill="#10B981"/>
  </g>
</svg>
