<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐼 아기 팬더의 딸랑딸랑 대나무 풍경</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #D1FAE5 0%, #A7F3D0 50%, #34D399 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #064E3B;
      box-shadow: 0 10px 40px rgba(5, 150, 105, 0.45);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(4, 120, 87, 0.85);
      backdrop-filter: blur(8px);
      color: #ECFDF5;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      border-bottom: 1px solid rgba(167, 243, 208, 0.3);
    }
    .header-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFF;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .hud {
      display: flex;
      gap: 12px;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(6, 78, 59, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      color: #FFF;
    }
    .overlay.hidden {
      display: none;
    }
    .overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #FDE68A;
      text-shadow: 0 0 15px rgba(253, 230, 138, 0.5);
    }
    .overlay p {
      font-size: 15px;
      line-height: 1.6;
      color: #D1FAE5;
      margin-bottom: 24px;
    }
    .guide-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: left;
      border: 1px solid rgba(167, 243, 208, 0.2);
    }
    .guide-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .btn-start {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFF;
      font-size: 18px;
      font-weight: bold;
      padding: 14px 36px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-start:active {
      transform: scale(0.96);
    }
    .score-display {
      font-size: 38px;
      font-weight: 800;
      color: #FDE68A;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(253, 230, 138, 0.6);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <a href="../index.html" class="header-btn">🏠 홈</a>
      <div class="hud">
        <div class="hud-item">🎋 <span id="score-text">0</span></div>
        <div class="hud-item">❤️ <span id="lives-text">3</span></div>
        <div class="hud-item">⏳ <span id="timer-text">45</span>s</div>
      </div>
    </header>

    <canvas id="gameCanvas"></canvas>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
      <div style="font-size: 64px; margin-bottom: 10px;">🐼🎋🎵</div>
      <h1>아기 팬더의 대나무 풍경</h1>
      <p>바람결에 딸랑딸랑 흔들리는 대나무 풍경을 연주해요!<br>빛나는 대나무 풍경과 맑은 이슬방울을 터치하세요.</p>
      <div class="guide-box">
        <div class="guide-row">🎋 <strong>대나무 풍경 터치</strong>: 아름다운 멜로디 & +10점</div>
        <div class="guide-row">💧 <strong>맑은 이슬방울</strong>: 떨어지는 이슬을 터치해 +20점</div>
        <div class="guide-row">🎋 <strong>황금 대나무순</strong>: +50점 슈퍼 멜로디</div>
        <div class="guide-row">🍂 <strong>바싹 마른 갈잎</strong>: 조심하세요! 하트가 줄어들어요</div>
      </div>
      <button class="btn-start" id="start-btn">풍경 연주 시작! 🎵</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="overlay hidden">
      <div style="font-size: 64px; margin-bottom: 10px;" id="result-emoji">🎋</div>
      <h1 id="result-title">숲속 풍경 연주회 완성!</h1>
      <div class="score-display" id="final-score">0점</div>
      <p id="result-msg">아기 팬더와 함께 숲속 가득 영롱한 풍경 소리를 피워냈어요!</p>
      <button class="btn-start" id="restart-btn">다시 연주하기 🔄</button>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer (Pentatonic Chime System)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Pentatonic scale: C4, D4, E4, G4, A4, C5
    const CHIME_FREQS = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

    function playChime(freqIndex = 0) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const freq = CHIME_FREQS[freqIndex % CHIME_FREQS.length];

      // Fundamental + harmonic overtone
      [1, 2.76, 5.4].forEach((mult, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = i === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq * mult, now);
        
        const initialVol = 0.25 / (i + 1);
        gain.gain.setValueAtTime(initialVol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8 - i * 0.15);

        osc.start(now);
        osc.stop(now + 0.8);
      });
    }

    function playSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'dew') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, now);
        osc.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'golden') {
        [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'triangle';
          o.frequency.setValueAtTime(f, now + idx * 0.05);
          g.gain.setValueAtTime(0.18, now + idx * 0.05);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.05 + 0.25);
          o.start(now + idx * 0.05);
          o.stop(now + idx * 0.05 + 0.25);
        });
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.22);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'win') {
        [392.00, 523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(f, now + idx * 0.1);
          g.gain.setValueAtTime(0.25, now + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
          o.start(now + idx * 0.1);
          o.stop(now + idx * 0.1 + 0.3);
        });
      }
    }

    // Canvas & Game Variables
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('score-text');
    const livesText = document.getElementById('lives-text');
    const timerText = document.getElementById('timer-text');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScore = document.getElementById('final-score');
    const resultTitle = document.getElementById('result-title');
    const resultMsg = document.getElementById('result-msg');
    const resultEmoji = document.getElementById('result-emoji');

    let width = 0;
    let height = 0;
    let score = 0;
    let lives = 3;
    let timeLeft = 45;
    let isRunning = false;
    let lastTime = 0;
    let timerInterval = null;

    // 5 Bamboo Chimes hanging from top branch
    let chimes = [];
    function initChimes() {
      chimes = [];
      const chimeCount = 5;
      const spacing = width / (chimeCount + 1);
      const lengths = [70, 95, 115, 85, 65];
      for (let i = 0; i < chimeCount; i++) {
        chimes.push({
          x: spacing * (i + 1),
          y: 45,
          width: 16,
          height: lengths[i],
          freqIndex: i,
          swingAngle: 0,
          swingSpeed: 0,
          glow: 0
        });
      }
    }

    // Baby Panda at bottom
    const panda = {
      x: 0,
      y: 0,
      targetX: 0,
      bounce: 0
    };

    let items = [];
    let particles = [];
    let spawnTimer = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
      panda.y = height - 85;
      if (panda.x === 0) {
        panda.x = width / 2;
        panda.targetX = width / 2;
      }
      initChimes();
    }
    window.addEventListener('resize', resize);

    function spawnFallingItem() {
      const types = [
        { type: 'dew', char: '💧', points: 20, speed: 1.8, size: 28, prob: 0.55 },
        { type: 'golden', char: '🎋', points: 50, speed: 2.4, size: 30, prob: 0.2 },
        { type: 'dryleaf', char: '🍂', points: -1, speed: 2.0, size: 28, prob: 0.25 }
      ];

      const r = Math.random();
      let cumulative = 0;
      let selected = types[0];
      for (const t of types) {
        cumulative += t.prob;
        if (r <= cumulative) {
          selected = t;
          break;
        }
      }

      items.push({
        x: Math.random() * (width - 60) + 30,
        y: 40,
        speed: selected.speed + Math.random() * 0.6,
        type: selected.type,
        char: selected.char,
        points: selected.points,
        size: selected.size,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 2,
          radius: Math.random() * 3 + 2,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    // Touch / Tap handling
    function handlePointerDown(e) {
      if (!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const clickY = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      // Check if tap on hanging chimes
      for (let i = 0; i < chimes.length; i++) {
        const c = chimes[i];
        if (Math.abs(clickX - c.x) < 25 && clickY >= c.y && clickY <= c.y + c.height + 25) {
          c.swingSpeed = (Math.random() - 0.5) * 0.4 + 0.3;
          c.glow = 1.0;
          playChime(c.freqIndex);
          score += 10;
          scoreText.textContent = score;
          addParticles(c.x, c.y + c.height, '#FDE68A', 8);
          panda.bounce = 8;
          return;
        }
      }

      // Check tap on falling items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        const dist = Math.hypot(clickX - it.x, clickY - it.y);
        if (dist <= 30) {
          if (it.type === 'dryleaf') {
            lives--;
            livesText.textContent = lives;
            playSound('hit');
            addParticles(it.x, it.y, '#92400E', 12);
            if (lives <= 0) {
              endGame(false);
              return;
            }
          } else {
            score += it.points;
            scoreText.textContent = score;
            playSound(it.type);
            const col = it.type === 'dew' ? '#6EE7B7' : '#FDE68A';
            addParticles(it.x, it.y, col, 10);
            panda.bounce = 6;
          }
          items.splice(i, 1);
          return;
        }
      }

      // Otherwise move panda towards tap
      panda.targetX = clickX;
    }
    canvas.addEventListener('pointerdown', handlePointerDown);

    function drawPanda(x, y) {
      ctx.save();
      ctx.translate(x, y - panda.bounce);

      // Black Ears
      ctx.fillStyle = '#1E293B';
      ctx.beginPath();
      ctx.arc(-22, -26, 11, 0, Math.PI * 2);
      ctx.arc(22, -26, 11, 0, Math.PI * 2);
      ctx.fill();

      // White Body
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(0, 14, 30, 0, Math.PI * 2);
      ctx.fill();

      // Black shoulders
      ctx.fillStyle = '#1E293B';
      ctx.beginPath();
      ctx.ellipse(0, 10, 28, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // White Head
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(0, -6, 26, 0, Math.PI * 2);
      ctx.fill();

      // Black Eye Patches
      ctx.fillStyle = '#1E293B';
      ctx.beginPath();
      ctx.ellipse(-10, -6, 7.5, 9, -0.2, 0, Math.PI * 2);
      ctx.ellipse(10, -6, 7.5, 9, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Shiny Eyes
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(-9, -6, 2.5, 0, Math.PI * 2);
      ctx.arc(11, -6, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Nose & Mouth
      ctx.fillStyle = '#1E293B';
      ctx.beginPath();
      ctx.arc(0, 1, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1E293B';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(0, 3, 3, 0.2, Math.PI - 0.2);
      ctx.stroke();

      // Pink Blush
      ctx.fillStyle = 'rgba(253, 164, 175, 0.7)';
      ctx.beginPath();
      ctx.ellipse(-16, 2, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.ellipse(16, 2, 4, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Paws
      ctx.fillStyle = '#1E293B';
      ctx.beginPath();
      ctx.ellipse(-12, 14, 6, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(12, 14, 6, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function update(dt) {
      panda.x += (panda.targetX - panda.x) * 0.15;
      if (panda.bounce > 0) panda.bounce *= 0.88;

      // Update chimes swing & decay
      for (const c of chimes) {
        c.swingAngle += c.swingSpeed;
        c.swingSpeed *= 0.94;
        c.swingAngle *= 0.92;
        if (c.glow > 0) c.glow -= dt * 1.5;
      }

      // Spawn falling items
      spawnTimer += dt;
      if (spawnTimer > 0.7) {
        spawnFallingItem();
        spawnTimer = 0;
      }

      // Update falling items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.speed * 60 * dt;
        it.wobble += 0.05;
        it.x += Math.sin(it.wobble) * 0.8;

        // Auto catch if near panda
        const dist = Math.hypot(it.x - panda.x, it.y - panda.y);
        if (dist < 40) {
          if (it.type === 'dryleaf') {
            lives--;
            livesText.textContent = lives;
            playSound('hit');
            addParticles(it.x, it.y, '#92400E', 12);
            if (lives <= 0) {
              endGame(false);
              return;
            }
          } else {
            score += it.points;
            scoreText.textContent = score;
            playSound(it.type);
            const col = it.type === 'dew' ? '#6EE7B7' : '#FDE68A';
            addParticles(it.x, it.y, col, 10);
            panda.bounce = 8;
          }
          items.splice(i, 1);
          continue;
        }

        if (it.y > height + 40) {
          items.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // 1. Forest Canopy Background Gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#064E3B');
      bgGrad.addColorStop(0.5, '#047857');
      bgGrad.addColorStop(1, '#065F46');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 2. Background Bamboo Stalks
      ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
      ctx.fillRect(30, 0, 14, height);
      ctx.fillRect(width - 45, 0, 16, height);
      ctx.fillRect(width * 0.3, 0, 10, height);
      ctx.fillRect(width * 0.7, 0, 12, height);

      // 3. Top Hanging Branch
      ctx.fillStyle = '#065F46';
      ctx.beginPath();
      ctx.moveTo(0, 35);
      ctx.quadraticCurveTo(width / 2, 45, width, 38);
      ctx.lineTo(width, 50);
      ctx.quadraticCurveTo(width / 2, 55, 0, 45);
      ctx.fill();

      // 4. Draw Chimes
      for (const c of chimes) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.swingAngle);

        // String
        ctx.strokeStyle = '#D97706';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 20);
        ctx.stroke();

        // Bamboo Chime Body
        if (c.glow > 0) {
          ctx.shadowColor = '#FDE68A';
          ctx.shadowBlur = c.glow * 20;
        }
        const chimeGrad = ctx.createLinearGradient(-c.width / 2, 0, c.width / 2, 0);
        chimeGrad.addColorStop(0, '#B45309');
        chimeGrad.addColorStop(0.5, '#F59E0B');
        chimeGrad.addColorStop(1, '#78350F');
        ctx.fillStyle = chimeGrad;
        ctx.beginPath();
        ctx.roundRect(-c.width / 2, 20, c.width, c.height, 5);
        ctx.fill();

        // Bamboo node line
        ctx.strokeStyle = 'rgba(254, 240, 138, 0.6)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-c.width / 2, 20 + c.height * 0.5);
        ctx.lineTo(c.width / 2, 20 + c.height * 0.5);
        ctx.stroke();

        ctx.restore();
      }

      // 5. Draw Falling Items
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const it of items) {
        ctx.font = `${it.size}px sans-serif`;
        ctx.fillText(it.char, it.x, it.y);
      }

      // 6. Draw Baby Panda
      drawPanda(panda.x, panda.y);

      // 7. Draw Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function gameLoop(timestamp) {
      if (!isRunning) return;
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      score = 0;
      lives = 3;
      timeLeft = 45;
      items = [];
      particles = [];
      scoreText.textContent = score;
      livesText.textContent = lives;
      timerText.textContent = timeLeft;

      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      isRunning = true;
      lastTime = performance.now();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isRunning) return;
        timeLeft--;
        timerText.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame(true);
        }
      }, 1000);

      requestAnimationFrame(gameLoop);
    }

    function endGame(isClear) {
      isRunning = false;
      clearInterval(timerInterval);

      if (isClear) {
        playSound('win');
        resultEmoji.textContent = '🎋🐼🎉';
        resultTitle.textContent = '대나무 숲 풍경 연주회 완결!';
        resultMsg.textContent = `아기 팬더와 함께 숲속 가득 영롱한 풍경 소리를 피워냈어요!`;
      } else {
        resultEmoji.textContent = '🥺🍂';
        resultTitle.textContent = '갈잎이 날려 연주가 멈췄어요!';
        resultMsg.textContent = `조금만 더 조심해서 다시 딸랑딸랑 연주해봐요!`;
      }

      finalScore.textContent = `${score}점`;
      gameoverOverlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Initial setup
    resize();
    draw();
  </script>
</body>
</html>
