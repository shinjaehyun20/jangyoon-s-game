<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="forest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe76" />
      <stop offset="50%" stop-color="#f6e58d" />
      <stop offset="100%" stop-color="#badc58" />
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c5028" />
      <stop offset="50%" stop-color="#6a3917" />
      <stop offset="100%" stop-color="#4d270c" />
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9ca24" />
      <stop offset="100%" stop-color="#f0932b" />
    </linearGradient>
    <linearGradient id="acorn-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53331b" />
      <stop offset="100%" stop-color="#362010" />
    </linearGradient>
    <linearGradient id="acorn-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cd853f" />
      <stop offset="100%" stop-color="#8b4513" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.18)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#forest-bg)" />

  <!-- Autumn Leaves in Background -->
  <path d="M 40 80 Q 70 50 100 80 Q 70 120 40 80 Z" fill="#eb4d4b" opacity="0.6" transform="rotate(25 70 80)" />
  <path d="M 420 60 Q 450 30 480 60 Q 450 100 420 60 Z" fill="#f0932b" opacity="0.7" transform="rotate(-35 450 60)" />
  <path d="M 450 420 Q 470 390 490 420 Q 470 450 450 420 Z" fill="#e056fd" opacity="0.4" />

  <!-- Wooden Scale Stand -->
  <polygon points="230,460 282,460 262,250 250,250" fill="url(#wood)" filter="url(#shadow)" />
  <ellipse cx="256" cy="460" rx="90" ry="16" fill="url(#wood)" />
  <circle cx="256" cy="250" r="14" fill="url(#brass)" stroke="#ffffff" stroke-width="2" />

  <!-- Balance Beam (Horizontal) -->
  <rect x="76" y="244" width="360" height="12" rx="6" fill="url(#wood)" filter="url(#shadow)" />

  <!-- Left Scale Pan -->
  <line x1="116" y1="250" x2="80" y2="340" stroke="#777" stroke-width="3" stroke-linecap="round" />
  <line x1="116" y1="250" x2="152" y2="340" stroke="#777" stroke-width="3" stroke-linecap="round" />
  <path d="M 68 340 C 68 375 164 375 164 340 Z" fill="url(#brass)" filter="url(#shadow)" />

  <!-- Left Pan Acorns (Target: 8) -->
  <g transform="translate(100, 310)">
    <!-- Acorn 1 -->
    <ellipse cx="0" cy="12" rx="14" ry="16" fill="url(#acorn-body)" />
    <path d="M -15 8 Q 0 -4 15 8 Z" fill="url(#acorn-cap)" />
    <rect x="-2" y="-7" width="4" height="6" rx="2" fill="#362010" />
  </g>
  <g transform="translate(130, 312)">
    <!-- Acorn 2 -->
    <ellipse cx="0" cy="12" rx="14" ry="16" fill="url(#acorn-body)" />
    <path d="M -15 8 Q 0 -4 15 8 Z" fill="url(#acorn-cap)" />
    <rect x="-2" y="-7" width="4" height="6" rx="2" fill="#362010" />
  </g>
  <!-- Number Badge on Left Pan: 8 -->
  <circle cx="116" cy="385" r="22" fill="#eb4d4b" stroke="#ffffff" stroke-width="3" filter="url(#shadow)" />
  <text x="116" y="393" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">8</text>

  <!-- Right Scale Pan -->
  <line x1="396" y1="250" x2="360" y2="340" stroke="#777" stroke-width="3" stroke-linecap="round" />
  <line x1="396" y1="250" x2="432" y2="340" stroke="#777" stroke-width="3" stroke-linecap="round" />
  <path d="M 348 340 C 348 375 444 375 444 340 Z" fill="url(#brass)" filter="url(#shadow)" />

  <!-- Right Pan Acorns (3 + 5 = 8) -->
  <g transform="translate(380, 310)">
    <ellipse cx="0" cy="12" rx="14" ry="16" fill="url(#acorn-body)" />
    <path d="M -15 8 Q 0 -4 15 8 Z" fill="url(#acorn-cap)" />
    <rect x="-2" y="-7" width="4" height="6" rx="2" fill="#362010" />
  </g>
  <g transform="translate(410, 312)">
    <ellipse cx="0" cy="12" rx="14" ry="16" fill="url(#acorn-body)" />
    <path d="M -15 8 Q 0 -4 15 8 Z" fill="url(#acorn-cap)" />
    <rect x="-2" y="-7" width="4" height="6" rx="2" fill="#362010" />
  </g>
  <!-- Number Badges on Right Pan: 3 + 5 -->
  <circle cx="396" cy="385" r="22" fill="#6ab04c" stroke="#ffffff" stroke-width="3" filter="url(#shadow)" />
  <text x="396" y="393" font-family="'Pretendard', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">3+5</text>

  <!-- Cute Squirrel Toto at Center Top -->
  <g transform="translate(256, 140)">
    <!-- Fluffy Tail -->
    <path d="M 25 15 C 65 -25 75 -75 35 -95 C -15 -115 -25 -65 10 -40 C 30 -20 20 10 20 10 Z" fill="#d35400" />
    <path d="M 20 15 C 50 -15 58 -55 30 -70 C 5 -85 -5 -45 15 -30 Z" fill="#f39c12" />
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="32" ry="38" fill="#e67e22" filter="url(#shadow)" />
    <ellipse cx="0" cy="24" rx="20" ry="26" fill="#fde3a7" />
    <!-- Head -->
    <circle cx="0" cy="-25" r="28" fill="#e67e22" filter="url(#shadow)" />
    <!-- Ears -->
    <polygon points="-22,-45 -12,-60 -5,-40" fill="#d35400" />
    <polygon points="22,-45 12,-60 5,-40" fill="#d35400" />
    <!-- Eyes -->
    <circle cx="-10" cy="-28" r="5" fill="#2c3e50" />
    <circle cx="-8" cy="-30" r="2" fill="#ffffff" />
    <circle cx="10" cy="-28" r="5" fill="#2c3e50" />
    <circle cx="12" cy="-30" r="2" fill="#ffffff" />
    <!-- Cheeks & Snout -->
    <circle cx="-18" cy="-18" r="8" fill="#ff7675" opacity="0.6" />
    <circle cx="18" cy="-18" r="8" fill="#ff7675" opacity="0.6" />
    <ellipse cx="0" cy="-18" rx="7" ry="5" fill="#fde3a7" />
    <polygon points="0,-19 -4,-22 4,-22" fill="#2c3e50" />
    <!-- Tiny Hands holding acorn -->
    <ellipse cx="-8" cy="8" rx="6" ry="5" fill="#e67e22" />
    <ellipse cx="8" cy="8" rx="6" ry="5" fill="#e67e22" />
    <circle cx="0" cy="10" r="7" fill="#cd853f" />
  </g>

  <!-- Big Equal Sign & Celebration Stars -->
  <text x="256" y="240" font-family="'Pretendard', sans-serif" font-size="36" font-weight="900" fill="#6ab04c" text-anchor="middle">⚖️ 8 = 8</text>
  <text x="180" y="100" font-size="32">✨</text>
  <text x="330" y="110" font-size="32">🌟</text>

  <!-- Title Badge at Bottom -->
  <rect x="56" y="440" width="400" height="52" rx="26" fill="rgba(255,255,255,0.95)" filter="url(#shadow)" />
  <text x="256" y="475" font-family="'Pretendard', sans-serif" font-size="22" font-weight="900" fill="#6a3917" text-anchor="middle">🌰 도토리 덧셈 양팔저울</text>
</svg>