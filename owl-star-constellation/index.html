<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🦉 부엉이 박사님의 반짝반짝 별자리 잇기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #0A1128 0%, #1C2541 50%, #000814 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #0B132B;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(28, 37, 65, 0.85);
      border-bottom: 1px solid rgba(100, 181, 246, 0.2);
      color: #E0E1DD;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .badge {
      background: rgba(100, 181, 246, 0.2);
      border: 1px solid rgba(100, 181, 246, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      color: #FFE082;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 17, 40, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(6px);
    }
    .overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #FFE082;
      text-shadow: 0 0 12px rgba(255, 224, 130, 0.6);
    }
    .overlay p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.6;
      color: #E0E1DD;
    }
    .btn {
      background: linear-gradient(135deg, #1E88E5 0%, #3949AB 100%);
      color: white;
      border: 1px solid #64B5F6;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(30, 136, 229, 0.5);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    #hint-banner {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 19, 43, 0.85);
      border: 1px solid #48CAE4;
      color: #CAF0F8;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <div id="constellation-name">✨ 큰곰자리 (북두칠성)</div>
      <div class="badge" id="progress-display">1 / 5 별자리</div>
    </header>

    <canvas id="gameCanvas"></canvas>
    <div id="hint-banner">💡 반짝이는 1번 별부터 순서대로 이어보세요!</div>

    <div id="start-overlay" class="overlay">
      <h1>🦉 부엉이 박사님의 별자리 잇기</h1>
      <p>가을 밤하늘에 별빛이 쏟아져요!<br>부엉이 박사님과 함께 별들을 콕콕 터치해<br>신비로운 가을 별자리를 완성해 볼까요? ✨</p>
      <button class="btn" id="start-btn">별 보러 가기</button>
    </div>

    <div id="win-overlay" class="overlay" style="display: none;">
      <h1 id="win-title">🌟 별자리 완성!</h1>
      <p id="win-desc">밤하늘의 모든 별자리를 찾았어요!<br>부엉이 박사님이 멋진 천문학자 메달을 선물합니다 🏅</p>
      <button class="btn" id="next-btn">다음 별자리</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const constNameEl = document.getElementById('constellation-name');
    const progressEl = document.getElementById('progress-display');
    const hintBanner = document.getElementById('hint-banner');
    const startOverlay = document.getElementById('start-overlay');
    const winOverlay = document.getElementById('win-overlay');
    const startBtn = document.getElementById('start-btn');
    const nextBtn = document.getElementById('next-btn');

    // Audio Context
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTone(freq, type = 'sine', duration = 0.25) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const scaleNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // C4 ~ C5
    function playStarConnect(index) {
      const note = scaleNotes[index % scaleNotes.length];
      playTone(note, 'triangle', 0.35);
    }
    function playCompleteFanfare() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
        setTimeout(() => playTone(f, 'sine', 0.4), idx * 120);
      });
    }

    let width, height;
    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Constellations Data (Normalized coordinates 0 ~ 1)
    const CONSTELLATIONS = [
      {
        name: "✨ 큰곰자리 (북두칠성)",
        desc: "하늘의 커다란 국자 모양 별자리! 길을 찾는 나침반이 되어준답니다.",
        stars: [
          { x: 0.20, y: 0.30 },
          { x: 0.32, y: 0.38 },
          { x: 0.45, y: 0.42 },
          { x: 0.58, y: 0.42 },
          { x: 0.72, y: 0.54 },
          { x: 0.58, y: 0.64 },
          { x: 0.48, y: 0.52 }
        ]
      },
      {
        name: "👑 카시오페이아자리 (W 별자리)",
        desc: "하늘에 빛나는 알파벳 W 모양의 아름다운 여왕님 별자리예요!",
        stars: [
          { x: 0.18, y: 0.40 },
          { x: 0.32, y: 0.58 },
          { x: 0.50, y: 0.42 },
          { x: 0.68, y: 0.60 },
          { x: 0.82, y: 0.38 }
        ]
      },
      {
        name: "⭐ 작은곰자리 (북극성)",
        desc: "가장 끝에 밤하늘의 길잡이인 환한 북극성이 반짝이고 있어요!",
        stars: [
          { x: 0.22, y: 0.35 },
          { x: 0.35, y: 0.45 },
          { x: 0.48, y: 0.50 },
          { x: 0.60, y: 0.48 },
          { x: 0.72, y: 0.58 },
          { x: 0.62, y: 0.68 },
          { x: 0.50, y: 0.58 }
        ]
      },
      {
        name: "🦢 백조자리 (하늘의 십자가)",
        desc: "은하수 위를 커다란 날개로 우아하게 날아가는 백조의 모습이에요.",
        stars: [
          { x: 0.50, y: 0.25 },
          { x: 0.50, y: 0.42 },
          { x: 0.50, y: 0.65 },
          { x: 0.25, y: 0.42 },
          { x: 0.75, y: 0.42 }
        ]
      },
      {
        name: "🐎 페가수스자리 (가을 사각형)",
        desc: "가을 밤하늘의 커다란 사각형을 품은 날개 달린 신비로운 천마예요!",
        stars: [
          { x: 0.30, y: 0.35 },
          { x: 0.70, y: 0.35 },
          { x: 0.70, y: 0.65 },
          { x: 0.30, y: 0.65 },
          { x: 0.15, y: 0.50 }
        ]
      }
    ];

    let currentConstIndex = 0;
    let connectedStars = 0;
    let particles = [];
    let backgroundStars = [];
    let isPlaying = false;

    // Background twinkling stars
    for (let i = 0; i < 60; i++) {
      backgroundStars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 0.8 + Math.random() * 1.8,
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.02 + Math.random() * 0.05
      });
    }

    function getScreenCoords(normStar) {
      return {
        x: normStar.x * width,
        y: 80 + normStar.y * (height - 180)
      };
    }

    function createSparkles(x, y, color = '#FFE082') {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 2 + Math.random() * 3,
          color,
          alpha: 1,
          decay: 0.02 + Math.random() * 0.03
        });
      }
    }

    function loadConstellation(index) {
      currentConstIndex = index % CONSTELLATIONS.length;
      connectedStars = 0;
      const c = CONSTELLATIONS[currentConstIndex];
      constNameEl.textContent = c.name;
      progressEl.textContent = `${currentConstIndex + 1} / ${CONSTELLATIONS.length} 별자리`;
      hintBanner.textContent = `💡 반짝이는 1번 별부터 순서대로 이어보세요!`;
      winOverlay.style.display = 'none';
      isPlaying = true;
    }

    function handleStarTouch(clientX, clientY) {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const tx = clientX - rect.left;
      const ty = clientY - rect.top;

      const c = CONSTELLATIONS[currentConstIndex];
      const nextStarIndex = connectedStars;

      if (nextStarIndex < c.stars.length) {
        const star = getScreenCoords(c.stars[nextStarIndex]);
        const dist = Math.hypot(tx - star.x, ty - star.y);

        if (dist < 38) { // Generous touch target
          playStarConnect(nextStarIndex);
          createSparkles(star.x, star.y, '#FFEB3B');
          connectedStars++;

          if (connectedStars === c.stars.length) {
            // Completed!
            isPlaying = false;
            playCompleteFanfare();
            createSparkles(star.x, star.y, '#64B5F6');
            setTimeout(() => {
              document.getElementById('win-title').textContent = `🌟 ${c.name} 완성!`;
              document.getElementById('win-desc').innerHTML = `${c.desc}<br><br>부엉이 박사님: "참 잘했어요! 다음 별자리도 찾아볼까요?" 🦉`;
              winOverlay.style.display = 'flex';
            }, 600);
          } else {
            hintBanner.textContent = `💡 멋져요! 다음 ${connectedStars + 1}번 별을 터치하세요!`;
          }
        }
      }
    }

    window.addEventListener('pointerdown', (e) => {
      initAudio();
      handleStarTouch(e.clientX, e.clientY);
    });

    startBtn.addEventListener('click', () => {
      initAudio();
      startOverlay.style.display = 'none';
      loadConstellation(0);
    });

    nextBtn.addEventListener('click', () => {
      loadConstellation(currentConstIndex + 1);
    });

    function update() {
      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      // Twinkles
      for (const bs of backgroundStars) {
        bs.twinkle += bs.twinkleSpeed;
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Deep space gradient
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#060B19');
      grad.addColorStop(0.5, '#0F1A36');
      grad.addColorStop(1, '#1A2951');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Moon
      ctx.fillStyle = '#FFFDE7';
      ctx.beginPath();
      ctx.arc(width * 0.85, 90, 26, 0, Math.PI * 2);
      ctx.shadowColor = '#FFE082';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;
      // Crescent dark cutout
      ctx.fillStyle = '#060B19';
      ctx.beginPath();
      ctx.arc(width * 0.82, 85, 24, 0, Math.PI * 2);
      ctx.fill();

      // Twinkling background stars
      for (const bs of backgroundStars) {
        const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(bs.twinkle));
        ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
        ctx.beginPath();
        ctx.arc(bs.x, bs.y, bs.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Current Constellation
      const c = CONSTELLATIONS[currentConstIndex];

      // Draw dashed guideline for all stars
      ctx.strokeStyle = 'rgba(100, 181, 246, 0.25)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      for (let i = 0; i < c.stars.length; i++) {
        const pt = getScreenCoords(c.stars[i]);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw connected solid starlight lines
      if (connectedStars > 1) {
        ctx.strokeStyle = '#FFE082';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#FFD54F';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        for (let i = 0; i < connectedStars; i++) {
          const pt = getScreenCoords(c.stars[i]);
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Draw Stars
      for (let i = 0; i < c.stars.length; i++) {
        const pt = getScreenCoords(c.stars[i]);
        const isConnected = i < connectedStars;
        const isNext = i === connectedStars;

        if (isNext) {
          // Pulsing halo for the target star
          const pulse = 14 + 6 * Math.sin(Date.now() * 0.008);
          ctx.fillStyle = 'rgba(255, 235, 59, 0.3)';
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pulse, 0, Math.PI * 2);
          ctx.fill();
        }

        // Star core
        ctx.fillStyle = isConnected ? '#FFFDE7' : isNext ? '#FFE082' : 'rgba(200, 225, 255, 0.6)';
        ctx.shadowColor = isConnected ? '#FFD54F' : '#64B5F6';
        ctx.shadowBlur = isConnected ? 15 : 8;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, isConnected ? 8 : 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Number Badge
        ctx.fillStyle = isConnected ? '#4CAF50' : isNext ? '#FFB300' : 'rgba(255,255,255,0.7)';
        ctx.font = 'bold 12px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(i + 1, pt.x, pt.y - 14);
      }

      // Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Cute Professor Owl in Bottom Right
      drawOwl(ctx, width - 65, height - 75);
    }

    function drawOwl(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Body
      ctx.fillStyle = '#8D6E63';
      ctx.beginPath();
      ctx.ellipse(0, 10, 28, 32, 0, 0, Math.PI * 2);
      ctx.fill();

      // Belly
      ctx.fillStyle = '#FFF8E1';
      ctx.beginPath();
      ctx.ellipse(0, 16, 18, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.fillStyle = '#6D4C41';
      ctx.beginPath();
      ctx.moveTo(-16, -16);
      ctx.lineTo(-10, -32);
      ctx.lineTo(-4, -20);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(16, -16);
      ctx.lineTo(10, -32);
      ctx.lineTo(4, -20);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(-10, -4, 11, 0, Math.PI * 2);
      ctx.arc(10, -4, 11, 0, Math.PI * 2);
      ctx.fill();

      // Glasses Rim
      ctx.strokeStyle = '#FFA000';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(-10, -4, 11, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(10, -4, 11, 0, Math.PI * 2);
      ctx.stroke();

      // Pupils
      ctx.fillStyle = '#263238';
      ctx.beginPath();
      ctx.arc(-9, -4, 5, 0, Math.PI * 2);
      ctx.arc(11, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(-8, -6, 2, 0, Math.PI * 2);
      ctx.arc(12, -6, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#FFB300';
      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.lineTo(-4, -3);
      ctx.lineTo(4, -3);
      ctx.fill();

      // Scholar Cap
      ctx.fillStyle = '#1565C0';
      ctx.beginPath();
      ctx.moveTo(0, -32);
      ctx.lineTo(-24, -24);
      ctx.lineTo(0, -16);
      ctx.lineTo(24, -24);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
