<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🎈 무지개 풍선 팡팡</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: linear-gradient(180deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 8px; gap: 8px;
      margin: 0 auto;
      position: relative;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 8px;
    }
    h1 {
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .hud {
      display: flex; justify-content: space-around;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.4);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .hud-val { color: #fef08a; font-size: 18px; font-weight: 900; margin-left: 4px; }
    #gameArea {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: rgba(255,255,255,0.15);
      border: 1px dashed rgba(255,255,255,0.4);
      touch-action: none;
    }
    .balloon {
      position: absolute;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      box-shadow: inset -4px -4px 8px rgba(0,0,0,0.15), inset 4px 4px 8px rgba(255,255,255,0.6), 0 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.1s ease;
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -6px;
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 6px solid rgba(0,0,0,0.2);
    }
    .pop-effect {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      animation: popAnim 0.4s ease-out forwards;
    }
    @keyframes popAnim {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 8px;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-weight: 600;
    }
    .home-link {
      color: #ffffff;
      text-decoration: none;
      background: rgba(0,0,0,0.2);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .overlay-card h2 { font-size: 22px; color: #1e293b; margin-bottom: 8px; }
    .overlay-card p { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
    .btn-start {
      width: 100%;
      min-height: 48px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    .result-score { font-size: 36px; font-weight: 900; color: #3b82f6; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎈 무지개 풍선 팡팡</h1>
    </header>

    <div class="hud">
      <div>점수: <span class="hud-val" id="scoreVal">0</span></div>
      <div>시간: <span class="hud-val" id="timeVal">45</span>초</div>
      <div>최고: <span class="hud-val" id="bestVal">0</span></div>
    </div>

    <div id="gameArea"></div>

    <footer>
      <small>떠오르는 무지개 풍선을 터치하세요!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🎈 무지개 풍선 팡팡</h2>
      <p>하늘로 날아가는 알록달록 무지개 풍선을 터치해서 팡팡 터뜨려봐요!<br>⭐ 별 풍선은 주변을 한꺼번에 터뜨려요!</p>
      <button class="btn-start" id="startBtn">게임 시작!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 게임 완료!</h2>
      <p>오늘의 풍선 터뜨리기 실력:</p>
      <div class="result-score" id="finalScore">0점</div>
      <p id="resultMsg">멋진 솜씨예요!</p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const GAME_ID = 'balloon-rainbow-pop';
    const BEST_KEY = GAME_ID + '_best';
    const gameArea = document.getElementById('gameArea');
    const scoreVal = document.getElementById('scoreVal');
    const timeVal = document.getElementById('timeVal');
    const bestVal = document.getElementById('bestVal');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const finalScore = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let score = 0;
    let timeLeft = 45;
    let gameInterval = null;
    let spawnInterval = null;
    let isRunning = false;
    let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    bestVal.textContent = best;

    const COLORS = [
      { bg: '#ef4444', emoji: '🍓', pts: 10 },
      { bg: '#f97316', emoji: '🍊', pts: 10 },
      { bg: '#eab308', emoji: '🍋', pts: 10 },
      { bg: '#22c55e', emoji: '🍏', pts: 10 },
      { bg: '#06b6d4', emoji: '🐬', pts: 10 },
      { bg: '#8b5cf6', emoji: '🍇', pts: 10 },
      { bg: '#ec4899', emoji: '💖', pts: 15 },
      { bg: '#facc15', emoji: '⭐', pts: 30, special: true }
    ];

    function createBalloon() {
      if (!isRunning) return;
      const b = document.createElement('div');
      b.className = 'balloon';
      const col = COLORS[Math.floor(Math.random() * COLORS.length)];
      const size = Math.floor(Math.random() * 20) + 48; // 48~68px
      const maxX = gameArea.clientWidth - size;
      const startX = Math.max(0, Math.floor(Math.random() * maxX));

      b.style.width = size + 'px';
      b.style.height = (size * 1.2) + 'px';
      b.style.backgroundColor = col.bg;
      b.style.left = startX + 'px';
      b.style.bottom = '-70px';
      b.textContent = col.emoji;

      let posY = -70;
      const speed = (Math.random() * 1.5) + 2.0;

      const moveTimer = setInterval(() => {
        if (!isRunning) {
          clearInterval(moveTimer);
          if (b.parentNode) b.remove();
          return;
        }
        posY += speed;
        b.style.bottom = posY + 'px';
        if (posY > gameArea.clientHeight + 80) {
          clearInterval(moveTimer);
          if (b.parentNode) b.remove();
        }
      }, 20);

      const onPop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        clearInterval(moveTimer);
        score += col.pts;
        scoreVal.textContent = score;

        // Pop effect
        const rect = b.getBoundingClientRect();
        const areaRect = gameArea.getBoundingClientRect();
        const fx = document.createElement('div');
        fx.className = 'pop-effect';
        fx.textContent = col.special ? '✨💥✨' : '💥';
        fx.style.left = (rect.left - areaRect.left + size / 4) + 'px';
        fx.style.top = (rect.top - areaRect.top) + 'px';
        gameArea.appendChild(fx);
        setTimeout(() => { if (fx.parentNode) fx.remove(); }, 400);

        if (col.special) {
          // Special bomb burst
          const balloons = document.querySelectorAll('.balloon');
          balloons.forEach(other => {
            if (other !== b && Math.random() < 0.6) {
              other.dispatchEvent(new Event('pointerdown'));
            }
          });
        }

        if (b.parentNode) b.remove();
      };

      b.addEventListener('pointerdown', onPop);
      gameArea.appendChild(b);
    }

    function startGame() {
      score = 0;
      timeLeft = 45;
      isRunning = true;
      scoreVal.textContent = score;
      timeVal.textContent = timeLeft;
      gameArea.innerHTML = '';
      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');

      gameInterval = setInterval(() => {
        timeLeft--;
        timeVal.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      spawnInterval = setInterval(() => {
        createBalloon();
      }, 450);
    }

    function endGame() {
      isRunning = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);

      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, best.toString());
        bestVal.textContent = best;
      }

      finalScore.textContent = score + '점';
      endOverlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  })();
  </script>
</body>
</html>
