<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="319" height="179" rx="12" fill="url(#bg)" stroke="rgba(255,255,255,0.15)"/>
  
  <!-- Balloons Visual -->
  <g transform="translate(40, 20)">
    <circle cx="50" cy="50" r="32" fill="#ef4444" opacity="0.9"/>
    <text x="50" y="58" font-size="24" text-anchor="middle" fill="#fff">🍓</text>
    
    <circle cx="110" cy="35" r="38" fill="#facc15" opacity="0.95" filter="url(#glow)"/>
    <text x="110" y="44" font-size="28" text-anchor="middle" fill="#fff">⭐</text>
    
    <circle cx="160" cy="65" r="30" fill="#3b82f6" opacity="0.9"/>
    <text x="160" y="73" font-size="22" text-anchor="middle" fill="#fff">🐬</text>

    <circle cx="85" cy="85" r="28" fill="#22c55e" opacity="0.9"/>
    <text x="85" y="93" font-size="20" text-anchor="middle" fill="#fff">🍏</text>
  </g>

  <!-- Title -->
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="146" text-anchor="end" font-size="21" font-weight="900" fill="#fef08a">무지개 풍선 팡팡</text>
    <text x="296" y="165" text-anchor="end" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">BALLOON RAINBOW POP</text>
  </g>
</svg>