<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#forestGrad)"/>

  <!-- Branch -->
  <rect x="40" y="210" width="320" height="26" rx="13" fill="#78350f"/>

  <!-- Chameleon Body -->
  <g transform="translate(160, 195) scale(1.4)">
    <ellipse cx="0" cy="0" rx="36" ry="24" fill="url(#rainbowGrad)"/>
    <!-- Head -->
    <ellipse cx="26" cy="-8" rx="18" ry="16" fill="#22c55e"/>
    <!-- Eye -->
    <circle cx="28" cy="-12" r="8" fill="#facc15"/>
    <circle cx="30" cy="-12" r="4" fill="#0f172a"/>
    <circle cx="31" cy="-13" r="1.5" fill="#fff"/>
    <!-- Tail -->
    <path d="M -36,0 C -55,-15 -50,-35 -38,-35 C -30,-35 -30,-20 -40,-15" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Flying Candy Bug -->
  <g transform="translate(280, 80) scale(1.2)" filter="url(#glow)">
    <!-- Wings -->
    <ellipse cx="-8" cy="-8" rx="12" ry="6" fill="rgba(255,255,255,0.7)" transform="rotate(-20)"/>
    <ellipse cx="8" cy="-8" rx="12" ry="6" fill="rgba(255,255,255,0.7)" transform="rotate(20)"/>
    <!-- Body -->
    <circle cx="0" cy="0" r="14" fill="#ef4444"/>
    <circle cx="-3" cy="-3" r="3" fill="#fff"/>
  </g>

  <!-- Tongue -->
  <path d="M 205, 180 Q 240, 140 275, 85" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>

  <!-- Title Badge -->
  <rect x="55" y="240" width="290" height="42" rx="21" fill="rgba(20, 83, 45, 0.9)" stroke="#fef08a" stroke-width="1.5"/>
  <text x="200" y="267" fill="#fef08a" font-family="'Pretendard', sans-serif" font-size="15" font-weight="900" text-anchor="middle">🌈 무지개 카멜레온의 색깔 냠냠</text>
</svg>
