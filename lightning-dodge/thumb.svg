<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d26"/>
      <stop offset="50%" style="stop-color:#2b2b5c"/>
      <stop offset="100%" style="stop-color:#4a4a8c"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="319" height="179" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- 먹구름 -->
  <text x="30" y="55" font-size="30" opacity="0.5">☁️</text>
  <text x="100" y="40" font-size="24" opacity="0.4">☁️</text>
  <text x="60" y="90" font-size="20" opacity="0.35">☁️</text>

  <!-- 메인 번개 -->
  <text x="150" y="105" font-size="72" text-anchor="middle">⚡</text>

  <!-- 병아리 -->
  <text x="205" y="150" font-size="40">🐥</text>

  <!-- 별 점수 -->
  <text x="40" y="130" font-size="18">⭐</text>
  <text x="80" y="150" font-size="14">⭐</text>

  <!-- 제목 -->
  <g font-family="'Pretendard','Noto Sans KR',sans-serif">
    <text x="296" y="148" text-anchor="end" font-size="22" font-weight="900" fill="#ffd93d">번개 피하기</text>
    <text x="296" y="166" text-anchor="end" font-size="10" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="2">LIGHTNING DODGE</text>
  </g>
</svg>
