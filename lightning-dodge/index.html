<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>⚡ 번개 피하기</title>
  <style>
    :root {
      --bg: #1a1a3d;
      --accent: #ffd93d;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(180deg, #0d0d26 0%, #2b2b5c 60%, #4a4a8c 100%);
      color: var(--text);
    }
    .wrap {
      width: 100%; max-width: 480px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 10px 12px 8px; gap: 8px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(20px, 5.5vw, 28px);
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.1);
      border-radius: 12px; padding: 8px 16px;
      font-size: 16px; font-weight: bold;
    }
    .hud .time { color: #90caf9; }
    .hud .score { color: var(--accent); }
    .hud .best { color: #b0bec5; font-size: 13px; }
    #gameArea {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(13,13,38,0.4) 0%, rgba(74,74,140,0.25) 100%);
    }
    .lane-guide {
      position: absolute; top: 0; bottom: 0;
      width: 1px; background: rgba(255,255,255,0.08);
    }
    .cloud-warn {
      position: absolute; top: 6px;
      width: 26.6%; height: 34px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .cloud-warn.show { opacity: 1; animation: pulseWarn 0.4s ease infinite alternate; }
    @keyframes pulseWarn {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
    .bolt {
      position: absolute; top: -60px;
      width: 26.6%;
      font-size: clamp(30px, 8vw, 44px);
      text-align: center;
      filter: drop-shadow(0 0 6px rgba(255,235,59,0.8));
    }
    .coin {
      position: absolute; top: -50px;
      width: 26.6%;
      font-size: clamp(24px, 6vw, 34px);
      text-align: center;
    }
    #player {
      position: absolute; bottom: 10px;
      width: 26.6%;
      font-size: clamp(34px, 9vw, 48px);
      text-align: center;
      transition: left 0.12s ease-out;
    }
    .flash {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.9);
      opacity: 0;
      pointer-events: none;
    }
    .flash.on { opacity: 1; transition: opacity 0.05s; }
    .flash.fade { opacity: 0; transition: opacity 0.25s; }
    #touchZones {
      position: absolute; inset: 0;
      display: flex;
    }
    .zone { flex: 1; }
    footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 0;
    }
    footer small { font-size: 12px; opacity: 0.7; }
    .home-link {
      color: #90caf9; text-decoration: none;
      font-size: 13px; font-weight: bold;
      background: rgba(255,255,255,0.1);
      padding: 6px 12px; border-radius: 8px;
      min-height: 44px; display: flex; align-items: center;
    }
    .overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75);
      z-index: 100;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: linear-gradient(135deg, #2b2b5c, #1a1a3d);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      max-width: 320px; width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .overlay-card h2 { font-size: 26px; margin-bottom: 12px; }
    .overlay-card p { font-size: 15px; line-height: 1.6; opacity: 0.9; margin-bottom: 20px; }
    .result-score { font-size: 48px; font-weight: 900; color: var(--accent); margin: 12px 0; }
    .btn-start {
      background: linear-gradient(135deg, #ffd93d, #ffb300);
      color: #1a1a3d; border: none; border-radius: 12px;
      font-size: 18px; font-weight: bold;
      padding: 14px 32px; cursor: pointer;
      min-height: 44px; width: 100%;
      box-shadow: 0 4px 12px rgba(255,217,61,0.4);
      transition: transform 0.1s;
    }
    .btn-start:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⚡ 번개 피하기</h1>

    <div class="hud">
      <span class="time">⏱ <span id="timerDisplay">30</span>초</span>
      <span class="score">⭐ <span id="scoreDisplay">0</span>점</span>
      <span class="best">최고 <span id="bestDisplay">0</span></span>
    </div>

    <div id="gameArea">
      <div class="cloud-warn" id="warn0" style="left:0%"></div>
      <div class="cloud-warn" id="warn1" style="left:36.7%"></div>
      <div class="cloud-warn" id="warn2" style="left:73.4%"></div>
      <div id="player" style="left:36.7%">🐥</div>
      <div class="flash" id="flash"></div>
      <div id="touchZones">
        <div class="zone" id="zoneLeft"></div>
        <div class="zone" id="zoneMid"></div>
        <div class="zone" id="zoneRight"></div>
      </div>
    </div>

    <footer>
      <small>먹구름 그림자를 보고 미리 피해요!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>⚡ 번개 피하기</h2>
      <p>화면을 <strong>왼쪽 / 가운데 / 오른쪽</strong> 탭해서<br>병아리를 옮겨요!<br>먹구름 ☁️ 이 나타나면<br>번개가 떨어질 신호예요!<br>별 ⭐ 은 받으면 점수가 올라가요.</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 게임 종료!</h2>
      <div class="result-score" id="finalScore">0</div>
      <p id="resultMsg"></p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const CONFIG = {
      TIME_LIMIT: 30,
      STORAGE_KEY: 'lightning-dodge_best',
      LANE_LEFT: [0, 36.7, 73.4],
      WARN_MS: 550,        // 먹구름이 보이고 나서 번개가 치기까지 대기시간
      SPAWN_MS_START: 950, // 초반 스폰 간격
      SPAWN_MS_MIN: 480,   // 후반 최소 스폰 간격
      FALL_MS: 1400,        // 낙하 애니메이션 시간(대략, transition 미사용 - JS interval)
      COIN_CHANCE: 0.32,
    };

    let state = {
      score: 0, timer: CONFIG.TIME_LIMIT,
      interval: null, spawnTimeout: null,
      gameActive: false, lane: 1,
      elapsedMs: 0,
    };

    const $ = id => document.getElementById(id);
    const player = $('player');
    const gameArea = $('gameArea');
    const flash = $('flash');
    const warns = [$('warn0'), $('warn1'), $('warn2')];

    function getBest() { return parseInt(localStorage.getItem(CONFIG.STORAGE_KEY) || '0'); }
    function saveBest(v) { localStorage.setItem(CONFIG.STORAGE_KEY, v); }

    function updateHUD() {
      $('timerDisplay').textContent = state.timer;
      $('scoreDisplay').textContent = state.score;
      $('bestDisplay').textContent = getBest();
    }

    function movePlayer(lane) {
      if (!state.gameActive) return;
      state.lane = lane;
      player.style.left = CONFIG.LANE_LEFT[lane] + '%';
    }

    function currentSpawnInterval() {
      const progress = Math.min(state.elapsedMs / (CONFIG.TIME_LIMIT * 1000), 1);
      return CONFIG.SPAWN_MS_START - (CONFIG.SPAWN_MS_START - CONFIG.SPAWN_MS_MIN) * progress;
    }

    function scheduleSpawn() {
      if (!state.gameActive) return;
      state.spawnTimeout = setTimeout(() => {
        spawnEvent();
        scheduleSpawn();
      }, currentSpawnInterval());
    }

    function spawnEvent() {
      if (!state.gameActive) return;
      const lane = Math.floor(Math.random() * 3);
      const isCoin = Math.random() < CONFIG.COIN_CHANCE;

      if (isCoin) {
        dropItem(lane, '⭐', 'coin');
        return;
      }

      // 번개: 먹구름 경고 -> 낙하
      const warn = warns[lane];
      warn.classList.add('show');
      setTimeout(() => {
        warn.classList.remove('show');
        if (!state.gameActive) return;
        dropItem(lane, '⚡', 'bolt');
      }, CONFIG.WARN_MS);
    }

    function dropItem(lane, emoji, type) {
      const el = document.createElement('div');
      el.className = type === 'coin' ? 'coin' : 'bolt';
      el.textContent = emoji;
      el.style.left = CONFIG.LANE_LEFT[lane] + '%';
      el.style.top = '-50px';
      gameArea.appendChild(el);

      const areaHeight = gameArea.clientHeight;
      const groundY = areaHeight - 60;
      let y = -50;
      const speed = 6.5;

      const fallInterval = setInterval(() => {
        if (!state.gameActive) { clearInterval(fallInterval); el.remove(); return; }
        y += speed;
        el.style.top = y + 'px';

        if (y >= groundY) {
          clearInterval(fallInterval);
          const hit = (state.lane === lane);
          if (type === 'bolt' && hit) {
            triggerHit();
          } else if (type === 'coin' && hit) {
            state.score += 5;
            updateHUD();
          }
          el.remove();
        }
      }, 16);
    }

    function triggerHit() {
      flash.classList.add('on');
      setTimeout(() => {
        flash.classList.remove('on');
        flash.classList.add('fade');
        setTimeout(() => flash.classList.remove('fade'), 250);
      }, 60);
      state.score = Math.max(0, state.score - 3);
      state.timer = Math.max(0, state.timer - 2);
      updateHUD();
      if (state.timer <= 0) endGame();
    }

    function startGame() {
      clearInterval(state.interval);
      clearTimeout(state.spawnTimeout);
      document.querySelectorAll('.bolt, .coin').forEach(n => n.remove());
      warns.forEach(w => w.classList.remove('show'));

      state = { score: 0, timer: CONFIG.TIME_LIMIT, gameActive: true, lane: 1, elapsedMs: 0, interval: null, spawnTimeout: null };
      movePlayer(1);
      $('startOverlay').classList.add('hidden');
      $('endOverlay').classList.add('hidden');
      updateHUD();

      state.interval = setInterval(() => {
        state.timer--;
        state.elapsedMs += 1000;
        updateHUD();
        if (state.timer <= 0) endGame();
      }, 1000);

      scheduleSpawn();
    }

    function endGame() {
      clearInterval(state.interval);
      clearTimeout(state.spawnTimeout);
      state.gameActive = false;
      const best = getBest();
      if (state.score > best) saveBest(state.score);
      $('finalScore').textContent = state.score + '점';
      const msgs = [
        state.score >= 60 ? '⚡ 번개왕!' :
        state.score >= 30 ? '🌟 대단해요!' :
        state.score >= 10 ? '😊 잘했어요!' : '🐣 다시 해봐요!',
        `최고 기록: ${Math.max(state.score, best)}점`
      ];
      $('resultMsg').textContent = msgs.join(' ');
      $('endOverlay').classList.remove('hidden');
    }

    $('zoneLeft').addEventListener('pointerdown', () => movePlayer(0));
    $('zoneMid').addEventListener('pointerdown', () => movePlayer(1));
    $('zoneRight').addEventListener('pointerdown', () => movePlayer(2));
    $('startBtn').addEventListener('pointerdown', startGame);
    $('restartBtn').addEventListener('pointerdown', startGame);
    updateHUD();
  })();
  </script>
</body>
</html>
