<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>요리조리 그림자 모양 탐정</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100vw; height: 100dvh; overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: radial-gradient(circle at 50% 25%, #312E81 0%, #1E1B4B 70%, #0F172A 100%);
    color: #F8FAFC; touch-action: manipulation;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 12px;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(30,41,59,0.92); border-radius: 18px; padding: 10px 16px;
    border: 3px solid #FACC15;
  }
  .title-box { font-size: 1.25rem; font-weight: 900; color: #FDE047; }
  .score-box { display: flex; gap: 10px; font-size: 1.05rem; font-weight: 800; }
  .badge { background: #334155; padding: 4px 12px; border-radius: 999px; border: 2px solid #94A3B8; color: #FEF08A; }
  .stage-card {
    background: rgba(15,23,42,0.88); border-radius: 24px; padding: 14px;
    border: 3px solid #6366F1; flex: 1; margin: 10px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: space-around;
  }
  .clue-box {
    font-size: 1.15rem; font-weight: 800; color: #E0E7FF; text-align: center;
    background: rgba(49,46,129,0.85); padding: 10px 16px; border-radius: 16px;
    border: 2px dashed #818CF8; width: 100%;
  }
  .spotlight-stage {
    width: 240px; height: 165px; border-radius: 20px;
    background: radial-gradient(circle at 50% 55%, #FEF9C3 0%, #FDE047 48%, #1E293B 78%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; box-shadow: 0 0 28px rgba(250,204,21,0.45);
    border: 3px solid #FACC15;
  }
  .shadow-shape {
    color: #0F172A; font-weight: 900; display: flex; align-items: center; justify-content: center;
  }
  .angle-tabs {
    display: flex; gap: 10px;
  }
  .angle-btn {
    padding: 8px 16px; border-radius: 999px; border: 2px solid #FACC15;
    background: #1E293B; color: #FDE047; font-size: 1rem; font-weight: 800; cursor: pointer;
  }
  .angle-btn.active { background: #FACC15; color: #0F172A; }
  .choices-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;
  }
  .choice-card {
    background: #1E293B; border: 3px solid #475569; border-radius: 18px;
    padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; color: #F8FAFC; font-size: 1.05rem; font-weight: 800;
    transition: transform 0.12s ease;
  }
  .choice-card:active { transform: scale(0.96); }
  .choice-icon { font-size: 2.1rem; }
  .choice-type { font-size: 0.85rem; color: #93C5FD; }
  .feedback-bar {
    font-size: 1.15rem; font-weight: 900; min-height: 30px; text-align: center; color: #FDE047;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="title-box">🔦 요리조리 그림자 모양 탐정</div>
    <div class="score-box">
      <span class="badge" id="stepBadge">1 / 10단계</span>
      <span class="badge" id="scoreBadge">🌟 0점</span>
    </div>
  </div>

  <div class="stage-card">
    <div class="clue-box" id="clueBox">앞에서 비춘 그림자와 위에서 비춘 그림자를 보고 알맞은 물건을 찾아보세요!</div>
    <div class="angle-tabs">
      <button class="angle-btn active" id="frontBtn" type="button">🔦 앞에서 비추기</button>
      <button class="angle-btn" id="topBtn" type="button">🔦 위에서 비추기</button>
    </div>
    <div class="spotlight-stage">
      <div class="shadow-shape" id="shadowDisplay"></div>
    </div>
    <div class="choices-grid" id="choicesGrid"></div>
    <div class="feedback-bar" id="feedbackBar">손전등 방향을 바꿔 가며 그림자를 관찰해 보세요!</div>
  </div>

<script>
const PUZZLES = [
  {
    clue: "앞에서 비추면 반듯한 네모, 위에서 비추어도 반듯한 네모 그림자가 생겨요!",
    frontSvg: '<svg width="96" height="96"><rect x="14" y="14" width="68" height="68" rx="4" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><rect x="14" y="14" width="68" height="68" rx="4" fill="#0F172A"/></svg>',
    answerIdx: 0,
    options: [
      { icon: "🎲", name: "주사위", shape: "상자 모양" },
      { icon: "⚽", name: "축구공", shape: "공 모양" },
      { icon: "🥫", name: "통조림 캔", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "어느 방향에서 손전등을 비추어도 항상 동그라미 그림자만 나오는 물건은 무엇일까요?",
    frontSvg: '<svg width="96" height="96"><circle cx="48" cy="48" r="36" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><circle cx="48" cy="48" r="36" fill="#0F172A"/></svg>',
    answerIdx: 1,
    options: [
      { icon: "📦", name: "택배 상자", shape: "상자 모양" },
      { icon: "🏀", name: "농구공", shape: "공 모양" },
      { icon: "🔋", name: "건전지", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "앞에서 비추면 길쭉한 네모인데, 위에서 비추면 동그라미 그림자가 생겨요!",
    frontSvg: '<svg width="96" height="96"><rect x="24" y="10" width="48" height="76" rx="4" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><circle cx="48" cy="48" r="32" fill="#0F172A"/></svg>',
    answerIdx: 2,
    options: [
      { icon: "📘", name: "국어책", shape: "상자 모양" },
      { icon: "🔮", name: "유리구슬", shape: "공 모양" },
      { icon: "🥫", name: "옥수수 캔", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "앞에서 보면 납작하고 넓은 네모, 위에서 보면 큼직한 네모 그림자가 나오는 물건은?",
    frontSvg: '<svg width="110" height="96"><rect x="10" y="34" width="90" height="28" rx="3" fill="#0F172A"/></svg>',
    topSvg: '<svg width="110" height="96"><rect x="16" y="12" width="78" height="72" rx="4" fill="#0F172A"/></svg>',
    answerIdx: 0,
    options: [
      { icon: "📕", name: "동화책", shape: "상자 모양" },
      { icon: "⚾", name: "야구공", shape: "공 모양" },
      { icon: "🕯️", name: "원기둥 초", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "데구르르 어디로든 잘 굴러가고, 앞과 위 그림자가 모두 작은 동그라미예요!",
    frontSvg: '<svg width="96" height="96"><circle cx="48" cy="48" r="26" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><circle cx="48" cy="48" r="26" fill="#0F172A"/></svg>',
    answerIdx: 1,
    options: [
      { icon: "🧱", name: "쌓기나무", shape: "상자 모양" },
      { icon: "🟠", name: "탁구공", shape: "공 모양" },
      { icon: "🧻", name: "두루마리 휴지", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "눕히면 굴러가고 세우면 잘 서 있어요! 앞 그림자는 네모, 위 그림자는 동그라미예요.",
    frontSvg: '<svg width="96" height="96"><rect x="20" y="14" width="56" height="68" rx="4" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><circle cx="48" cy="48" r="34" fill="#0F172A"/></svg>',
    answerIdx: 2,
    options: [
      { icon: "🎁", name: "선물 상자", shape: "상자 모양" },
      { icon: "⚽", name: "축구공", shape: "공 모양" },
      { icon: "🧻", name: "둥근 휴지통", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "뾰족한 꼭짓점이 8개, 평평한 면이 6개인 반듯한 상자 모양 물건을 찾아라!",
    frontSvg: '<svg width="96" height="96"><rect x="14" y="20" width="68" height="56" rx="3" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><rect x="14" y="20" width="68" height="56" rx="3" fill="#0F172A"/></svg>',
    answerIdx: 0,
    options: [
      { icon: "🎁", name: "선물 상자", shape: "상자 모양" },
      { icon: "🎾", name: "테니스공", shape: "공 모양" },
      { icon: "🔋", name: "건전지", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "앞에서 비추면 세로로 긴 네모, 위에서 비추면 작은 동그라미 그림자가 생겨요!",
    frontSvg: '<svg width="96" height="96"><rect x="32" y="10" width="32" height="76" rx="4" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><circle cx="48" cy="48" r="20" fill="#0F172A"/></svg>',
    answerIdx: 2,
    options: [
      { icon: "📦", name: "장난감 상자", shape: "상자 모양" },
      { icon: "🏐", name: "배구공", shape: "공 모양" },
      { icon: "🔋", name: "건전지", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "쌓기 놀이를 할 때 옆으로도 위로도 반듯하게 잘 쌓이는 네모 상자 모양은?",
    frontSvg: '<svg width="96" height="96"><rect x="16" y="16" width="64" height="64" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><rect x="16" y="16" width="64" height="64" fill="#0F172A"/></svg>',
    answerIdx: 0,
    options: [
      { icon: "🧱", name: "나무 블록", shape: "상자 모양" },
      { icon: "🔮", name: "구슬", shape: "공 모양" },
      { icon: "🥫", name: "음료수 캔", shape: "둥근기둥 모양" }
    ]
  },
  {
    clue: "마지막 탐정 문제! 위에서 보면 동그라미 윗면이 보이고, 앞에서 보면 네모로 보이는 물건은?",
    frontSvg: '<svg width="96" height="96"><rect x="22" y="12" width="52" height="72" rx="4" fill="#0F172A"/></svg>',
    topSvg: '<svg width="96" height="96"><circle cx="48" cy="48" r="30" fill="#0F172A"/></svg>',
    answerIdx: 2,
    options: [
      { icon: "🎲", name: "주사위", shape: "상자 모양" },
      { icon: "🏀", name: "농구공", shape: "공 모양" },
      { icon: "🥤", name: "둥근 물통", shape: "둥근기둥 모양" }
    ]
  }
];

let idx = 0;
let score = 0;
let currentAngle = "front";
let audioCtx = null;

function beep(freq, dur) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(0.14, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function renderShadow() {
  const pz = PUZZLES[idx];
  document.getElementById("shadowDisplay").innerHTML = (currentAngle === "front") ? pz.frontSvg : pz.topSvg;
  document.getElementById("frontBtn").classList.toggle("active", currentAngle === "front");
  document.getElementById("topBtn").classList.toggle("active", currentAngle === "top");
}

function renderPuzzle() {
  const pz = PUZZLES[idx];
  currentAngle = "front";
  document.getElementById("stepBadge").textContent = (idx + 1) + " / " + PUZZLES.length + "단계";
  document.getElementById("scoreBadge").textContent = "🌟 " + score + "점";
  document.getElementById("clueBox").textContent = "🕵️ 탐정 단서: " + pz.clue;
  document.getElementById("feedbackBar").textContent = "앞에서 비추기와 위에서 비추기를 모두 눌러 확인해 보세요!";
  renderShadow();

  const grid = document.getElementById("choicesGrid");
  grid.innerHTML = "";
  pz.options.forEach((opt, oIdx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-card";
    btn.innerHTML = '<div class="choice-icon">' + opt.icon + '</div><div>' + opt.name + '</div><div class="choice-type">(' + opt.shape + ')</div>';
    btn.addEventListener("click", () => {
      if (oIdx === pz.answerIdx) {
        score += 10;
        document.getElementById("scoreBadge").textContent = "🌟 " + score + "점";
        document.getElementById("feedbackBar").textContent = "🎉 정답! '" + opt.name + "'(" + opt.shape + ")의 그림자를 정확히 찾았어요!";
        beep(587, 0.1);
        setTimeout(() => beep(784, 0.18), 110);
        setTimeout(() => {
          idx = (idx + 1) % PUZZLES.length;
          renderPuzzle();
        }, 1100);
      } else {
        document.getElementById("feedbackBar").textContent = "🔍 다시 관찰해 볼까요? 위에서 비춘 그림자 모양도 확인해 보세요!";
        beep(240, 0.16);
      }
    });
    grid.appendChild(btn);
  });
}

document.getElementById("frontBtn").addEventListener("click", () => {
  currentAngle = "front";
  beep(440, 0.08);
  renderShadow();
});
document.getElementById("topBtn").addEventListener("click", () => {
  currentAngle = "top";
  beep(520, 0.08);
  renderShadow();
});

renderPuzzle();
</script>
</body>
</html>
