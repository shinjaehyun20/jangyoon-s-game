<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>딱지치기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh; height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  :root {
    --bg: #5a1420;
    --bg2: #2d0a10;
    --accent: #f2c94c;
    --blue: #2f5f8f;
    --text: #ffffff;
  }
  body {
    background: radial-gradient(ellipse at top, #7a1f2b 0%, var(--bg2) 75%);
  }
  .wrap {
    width: 100%; max-width: 480px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 10px 12px 8px; gap: 8px;
    margin: 0 auto;
  }
  h1 {
    font-size: clamp(20px, 5.5vw, 28px);
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .hud {
    display: flex; flex-direction: row; align-items: center; justify-content: space-around;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 14px;
    font-weight: 700;
  }
  .hud span.value { color: var(--accent); font-size: 16px; margin-left: 4px; }

  #gameArea {
    flex: 1;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: space-between;
    min-height: 0;
  }

  .msg-line {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    min-height: 22px;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
    transition: opacity .2s;
  }

  .ground {
    position: relative;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  .ground::before {
    content: '';
    position: absolute;
    left: 50%; top: 62%;
    transform: translate(-50%, -50%);
    width: 76%; height: 46%;
    background: radial-gradient(ellipse, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 72%);
    border-radius: 50%;
  }

  .ddakji-3d {
    position: relative;
    width: 104px; height: 104px;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.4,1.6,.5,1);
  }
  .ddakji-3d.flipped { transform: rotateY(180deg) scale(1.05); }
  .ddakji-3d.wobble { animation: wobble .5s ease; }
  @keyframes wobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    50% { transform: rotate(6deg); }
    75% { transform: rotate(-4deg); }
  }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    box-shadow: 0 6px 14px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.25);
  }
  .face::before, .face::after {
    content: '';
    position: absolute; inset: 8%;
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 4px;
  }
  .face::after {
    inset: 26%;
    transform: rotate(45deg);
  }
  .face.front { background: conic-gradient(var(--blue), #6fa8d8, var(--blue), #6fa8d8, var(--blue)); }
  .face.back { background: conic-gradient(#c0392b, var(--accent), #c0392b, var(--accent), #c0392b); transform: rotateY(180deg); }

  #playerDdakji {
    width: 92px; height: 92px;
    background: conic-gradient(#c0392b, var(--accent), #c0392b, var(--accent), #c0392b);
    border-radius: 10px;
    box-shadow: 0 6px 14px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.3);
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
    touch-action: none;
    transition: transform .12s;
  }
  #playerDdakji::before {
    content: '';
    position: absolute; width: 60px; height: 60px;
    border: 2px solid rgba(255,255,255,.35); border-radius: 4px;
  }
  #playerDdakji.charging { transform: scale(1.12); box-shadow: 0 0 22px rgba(242,201,76,.8), inset 0 0 0 3px rgba(255,255,255,.5); }
  #playerDdakji.strike { animation: strikeAnim .3s ease; }
  @keyframes strikeAnim {
    0% { transform: translateY(0) scale(1.12); }
    50% { transform: translateY(40px) scale(0.95) rotate(-10deg); }
    100% { transform: translateY(0) scale(1); }
  }

  .player-zone {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding-bottom: 4px;
  }
  .player-label { font-size: 12px; opacity: .8; }

  .gauge-track {
    width: 100%;
    height: 18px;
    background: rgba(255,255,255,.12);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 6px rgba(0,0,0,.4);
  }
  .gauge-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6fa8d8, var(--accent));
    transition: width .05s linear;
  }
  .gauge-need {
    position: absolute; top: 0; bottom: 0;
    width: 2px; background: #fff;
    box-shadow: 0 0 4px #fff;
  }

  .gust {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: gustFly .7s ease-out forwards;
  }
  @keyframes gustFly {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); }
  }

  footer {
    display: flex; flex-direction: row; justify-content: space-between; align-items: center;
    font-size: 12px;
  }
  .home-link { color: var(--accent); text-decoration: none; min-height: 44px; display: flex; align-items: center; }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay-card {
    background: linear-gradient(160deg, #7a1f2b, #2d0a10);
    border-radius: 18px;
    padding: 26px 22px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 2px rgba(242,201,76,.4);
  }
  .overlay-card h2 { font-size: 22px; margin-bottom: 10px; }
  .overlay-card p { font-size: 14px; line-height: 1.5; margin-bottom: 16px; opacity: .9; }
  .result-score { font-size: 40px; font-weight: 900; color: var(--accent); margin-bottom: 6px; }
  .btn-start {
    min-height: 44px;
    padding: 10px 26px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #3a2400;
    cursor: pointer;
  }
</style>
<!-- jangyoon-s-game catalog metadata -->
<meta name="description" content="🎴 딱지치기 — 딱지를 힘차게 아래로 스와이프해 상대 딱지를 뒤집는 전통놀이, 5판 도전 장윤이 게임 놀이터의 어린이 미니게임입니다.">
<meta property="og:title" content="🎴 딱지치기 | 장윤이 게임 놀이터">
<meta property="og:description" content="🎴 딱지치기 — 딱지를 힘차게 아래로 스와이프해 상대 딱지를 뒤집는 전통놀이, 5판 도전 장윤이 게임 놀이터의 어린이 미니게임입니다.">
</head>
<body>
  <div class="wrap">
    <h1>🎴 딱지치기</h1>

    <div class="hud">
      <div>라운드 <span class="value" id="roundLabel">1/5</span></div>
      <div>성공 <span class="value" id="scoreLabel">0</span></div>
      <div>최고 <span class="value" id="bestLabel">0</span></div>
    </div>

    <div id="gameArea">
      <div class="msg-line" id="msgLine">내 딱지를 힘차게 아래로 쓸어내려요!</div>

      <div class="ground">
        <div class="ddakji-3d" id="oppDdakji">
          <div class="face front"></div>
          <div class="face back"></div>
        </div>
      </div>

      <div class="player-zone">
        <div class="gauge-track">
          <div class="gauge-fill" id="gaugeFill"></div>
          <div class="gauge-need" id="gaugeNeed"></div>
        </div>
        <div id="playerDdakji"></div>
        <div class="player-label">↓ 내 딱지 (아래로 스와이프!)</div>
      </div>
    </div>

    <footer>
      <small>힘차게 아래로 쓸어내려 상대 딱지를 뒤집어요!</small>
      <a class="home-link" href="../index.html">← 홈으로</a>
    </footer>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <h2>🎴 딱지치기</h2>
      <p>내 딱지를 손가락으로 힘차게 아래로 쓸어내려서<br>상대 딱지를 뒤집어요!<br>라운드가 오를수록 더 세게 쳐야 해요. 5판 도전!</p>
      <button class="btn-start" id="startBtn">시작!</button>
    </div>
  </div>
  <div class="overlay hidden" id="endOverlay">
    <div class="overlay-card">
      <h2>🎉 게임 종료!</h2>
      <div class="result-score" id="finalScore">0/5</div>
      <p id="resultMsg"></p>
      <button class="btn-start" id="restartBtn">다시 하기</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    const CONFIG = {
      ROUNDS: 5,
      THRESHOLDS: [22, 32, 42, 55, 68],
      SPEED_DIVISOR: 2.0,
      STRIKE_DELAY: 320,
      RESULT_DELAY: 1100,
      BEST_KEY: 'ddakji-flip_best'
    };

    const els = {
      round: document.getElementById('roundLabel'),
      score: document.getElementById('scoreLabel'),
      best: document.getElementById('bestLabel'),
      msg: document.getElementById('msgLine'),
      opp: document.getElementById('oppDdakji'),
      player: document.getElementById('playerDdakji'),
      gaugeFill: document.getElementById('gaugeFill'),
      gaugeNeed: document.getElementById('gaugeNeed'),
      ground: document.querySelector('.ground'),
      startOverlay: document.getElementById('startOverlay'),
      endOverlay: document.getElementById('endOverlay'),
      startBtn: document.getElementById('startBtn'),
      restartBtn: document.getElementById('restartBtn'),
      finalScore: document.getElementById('finalScore'),
      resultMsg: document.getElementById('resultMsg')
    };

    const state = {
      round: 0,
      score: 0,
      tracking: false,
      locked: true,
      points: [],
      maxSpeed: 0
    };

    function getBest() {
      return parseInt(localStorage.getItem(CONFIG.BEST_KEY) || '0', 10);
    }
    function setBest(v) {
      if (v > getBest()) localStorage.setItem(CONFIG.BEST_KEY, String(v));
    }

    function updateHUD() {
      els.round.textContent = (state.round + 1) + '/' + CONFIG.ROUNDS;
      els.score.textContent = state.score;
      els.best.textContent = getBest();
      const need = CONFIG.THRESHOLDS[Math.min(state.round, CONFIG.THRESHOLDS.length - 1)];
      els.gaugeNeed.style.left = need + '%';
    }

    function resetRoundBoard() {
      els.opp.classList.remove('flipped', 'wobble');
      els.gaugeFill.style.width = '0%';
      state.maxSpeed = 0;
      els.msg.textContent = '내 딱지를 힘차게 아래로 쓸어내려요!';
      state.locked = false;
      updateHUD();
    }

    function startGame() {
      state.round = 0;
      state.score = 0;
      els.startOverlay.classList.add('hidden');
      els.endOverlay.classList.add('hidden');
      resetRoundBoard();
    }

    function spawnGust() {
      const rect = els.opp.getBoundingClientRect();
      const groundRect = els.ground.getBoundingClientRect();
      for (let i = 0; i < 8; i++) {
        const g = document.createElement('div');
        g.className = 'gust';
        g.textContent = '💨';
        const angle = (Math.PI * 2 * i) / 8;
        const dx = Math.cos(angle) * 70;
        const dy = Math.sin(angle) * 70;
        g.style.setProperty('--dx', dx + 'px');
        g.style.setProperty('--dy', dy + 'px');
        g.style.left = (rect.left - groundRect.left + rect.width / 2) + 'px';
        g.style.top = (rect.top - groundRect.top + rect.height / 2) + 'px';
        els.ground.appendChild(g);
        setTimeout(() => g.remove(), 720);
      }
    }

    function evaluateStrike() {
      const power = Math.min(100, (state.maxSpeed / CONFIG.SPEED_DIVISOR) * 100);
      const need = CONFIG.THRESHOLDS[Math.min(state.round, CONFIG.THRESHOLDS.length - 1)];
      els.player.classList.add('strike');
      setTimeout(() => {
        els.player.classList.remove('strike');
        if (power >= need) {
          state.score++;
          els.opp.classList.add('flipped');
          spawnGust();
          els.msg.textContent = '찰싹! 뒤집었다 🎉';
        } else {
          els.opp.classList.add('wobble');
          els.msg.textContent = '아깝다! 다음엔 더 힘차게!';
        }
        updateHUD();
        setTimeout(nextRound, CONFIG.RESULT_DELAY);
      }, CONFIG.STRIKE_DELAY);
    }

    function nextRound() {
      state.round++;
      if (state.round >= CONFIG.ROUNDS) {
        endGame();
        return;
      }
      resetRoundBoard();
    }

    function endGame() {
      state.locked = true;
      setBest(state.score);
      els.finalScore.textContent = state.score + '/' + CONFIG.ROUNDS;
      els.resultMsg.textContent = state.score >= 4
        ? '딱지왕이네요! 정말 잘했어요 👑'
        : (state.score >= 2 ? '멋져요! 다음엔 더 세게 쳐봐요!' : '재밌었죠? 한 번 더 도전해봐요!');
      els.endOverlay.classList.remove('hidden');
    }

    function onDown(e) {
      if (state.locked) return;
      state.tracking = true;
      state.points = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
      state.maxSpeed = 0;
      els.player.classList.add('charging');
      els.gaugeFill.style.width = '0%';
    }
    function onMove(e) {
      if (!state.tracking) return;
      const last = state.points[state.points.length - 1];
      const now = performance.now();
      const dx = e.clientX - last.x;
      const dy = e.clientY - last.y;
      const dt = Math.max(1, now - last.t);
      const dist = Math.hypot(dx, dy);
      const speed = dist / dt;
      if (dy > 0) {
        state.maxSpeed = Math.max(state.maxSpeed, speed);
      }
      state.points.push({ x: e.clientX, y: e.clientY, t: now });
      const power = Math.min(100, (state.maxSpeed / CONFIG.SPEED_DIVISOR) * 100);
      els.gaugeFill.style.width = power + '%';
    }
    function onUp() {
      if (!state.tracking) return;
      state.tracking = false;
      state.locked = true;
      els.player.classList.remove('charging');
      evaluateStrike();
    }

    els.player.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);

    els.startBtn.addEventListener('click', startGame);
    els.restartBtn.addEventListener('click', startGame);

    els.best.textContent = getBest();
  })();
  </script>
</body>
</html>
