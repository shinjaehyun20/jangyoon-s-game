<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf4fb"><title>또박또박 문장부호 탐험대</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#29364a;background:var(--bg)}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #156da8;outline-offset:3px}button:disabled{cursor:default}main{height:100vh;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;gap:clamp(7px,1.5vh,14px);padding:clamp(12px,3vw,24px);padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--accent)}h1{font-size:clamp(20px,4.5vw,30px);line-height:1.25;margin:3px 0}h2{font-size:clamp(19px,4.5vw,27px);margin:0}p{margin:0;line-height:1.5}.sound{border:1px solid #d2d9cf;border-radius:16px;background:#fff;padding:10px;white-space:nowrap;font-size:12px;min-height:44px}.progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}.dots{display:flex;gap:7px}.dot{width:13px;height:13px;border-radius:50%;background:#d9ded5}.dot.on{background:var(--accent)}.scene{background:#fffdf8;border:2px solid #ffffff;border-radius:28px;box-shadow:0 7px 0 #253d3210;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:clamp(10px,2vh,20px);text-align:center;position:relative;overflow:hidden}.hint{font-size:clamp(13px,3.4vw,16px);color:#526358}.feedback{min-height:48px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.6vw,17px);font-weight:700;line-height:1.4;padding:3px 6px}.next{width:100%;min-height:48px;background:var(--accent);border:0;border-radius:17px;color:white;font-weight:800;padding:13px;box-shadow:0 4px 0 var(--shadow)}.next:disabled{background:#c7cfca;box-shadow:0 4px 0 #b1bbb5;color:#fff}.choices{display:flex;justify-content:center;gap:clamp(7px,2vw,14px)}.choice{border:2px solid #fff;background:white;box-shadow:0 5px 0 #d5ddce;min-height:64px;border-radius:21px;font-weight:800;transition:transform .15s,background .15s}.choice:active{transform:translateY(3px)}.choice.good{background:#d7f6cb;border-color:#58a83a}.choice.wrong{background:#ffeadb;border-color:#dc975e}.foot{font-size:11px;text-align:center;color:#607267}.end{font-size:clamp(56px,13vw,90px)}[hidden]{display:none!important}@media(max-height:650px){main{gap:5px;padding:10px}.feedback{min-height:37px}.choice{min-height:53px}.next{min-height:44px;padding:10px}.foot{display:none}.scene{border-radius:20px;padding:8px}h1{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}:root{--bg:#eaf4fb;--accent:#1e6fa8;--shadow:#144d75}.orchard{font-size:clamp(46px,10vh,86px);line-height:1}.sentence-card{background:#eef6fc;border:2px dashed #69a7d4;border-radius:20px;padding:clamp(12px,2.2vh,20px) clamp(14px,3vw,24px);width:100%;max-width:560px;font-size:clamp(21px,4.8vw,32px);font-weight:900;line-height:1.45;color:#1e3549;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}.slot-box{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 10px;border-radius:12px;background:#ffd166;color:#1e3549;border:2px solid #e09f24;font-weight:900;font-size:clamp(22px,5vw,30px)}.recipe{background:#eaf4fb;padding:8px 16px;border-radius:15px;font-size:clamp(15px,3.6vw,20px);font-weight:700;color:#1e5680}.choice{flex:1;max-width:170px;padding:8px 10px;background:#2b82bf;color:white;font-size:clamp(22px,5vw,32px);box-shadow:0 5px 0 #1c5c8c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.choice small{font-size:clamp(12px,2.8vw,15px);font-weight:700;opacity:.95}.choice.good,.choice.wrong{color:#29364a}
/* Keep the puzzle and home control reachable on short mobile screens. */
@media (max-height:500px) and (orientation:landscape){
main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:44px 18px minmax(64px,1fr) 28px 44px 34px;gap:5px;padding:8px;max-width:900px}
header{grid-column:1/3;grid-row:1}h1{font-size:20px}.progress{grid-column:1/3;grid-row:2}
.scene{grid-column:1;grid-row:3/7;padding:6px;gap:4px;justify-content:space-evenly;border-radius:16px}
.scene .hint{display:none}.orchard{font-size:44px}.sentence-card{font-size:20px;padding:10px}.slot-box{min-width:36px;height:36px;font-size:20px}.recipe{font-size:14px;padding:6px 12px}
.choices{grid-column:2;grid-row:3;align-self:center;gap:6px}.choice{min-height:48px;padding:6px;min-width:0;font-size:20px}.choice small{font-size:11px}
.feedback{grid-column:2;grid-row:4;min-height:0;font-size:12px;padding:0}.next{grid-column:2;grid-row:5;min-height:44px;padding:8px}
.foot{display:block;grid-column:2;grid-row:6;font-size:10px;line-height:1.1}.foot a{padding:5px!important}.end{font-size:52px}
}
@media (max-height:700px) and (orientation:portrait){
main{gap:6px;padding:10px}h1{font-size:20px}.scene{padding:8px;gap:4px}.scene .hint{font-size:12px}.orchard{font-size:50px}.sentence-card{font-size:22px;padding:12px}.recipe{font-size:15px}.choice{min-height:52px;padding:6px;font-size:22px}.feedback{min-height:30px;font-size:13px}.next{min-height:44px;padding:8px}.foot{display:block;font-size:10px}.foot a{padding:5px!important}
}
</style></head><body><main><header><div><div class="eyebrow">초등 1학년 · 국어 놀이터</div><h1>또박또박 문장부호 탐험대</h1></div><button class="sound" id="sound" aria-pressed="false">소리 꺼짐</button></header><div class="progress"><span id="count"></span><div class="dots" id="dots" aria-hidden="true"></div></div><section class="scene" id="scene" aria-label="문제"></section><div class="choices" id="choices" role="group" aria-label="답 고르기"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" disabled>다음 문제 →</button><div class="foot"><a id="homeBtn" href="../index.html" style="display:inline-block;padding:8px;color:inherit;font-weight:700">🏠 게임 모음</a> · 버튼을 눌러 골라요 · 키보드는 탭 키와 엔터 키로 놀아요</div></main><script>'use strict';const $=s=>document.querySelector(s);let turn=0,solved=false,misses=0,sound=false,audio;const total=6;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'소리 켜짐':'소리 꺼짐';$('#sound').setAttribute('aria-pressed',sound);if(sound)tone(true)};function tone(ok){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?660:260;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.start();o.stop(audio.currentTime+.23)}catch{}}function progress(){$('#count').textContent=(turn+1)+' / '+total+' 문제';$('#dots').innerHTML=Array.from({length:total},(_,i)=>'<span class="dot '+(i<turn?'on':'')+'"></span>').join('');$('#next').disabled=true;$('#feedback').textContent='';solved=false}function result(btn,ok,message){if(solved)return;tone(ok);if(ok){solved=true;btn.classList.add('good');document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('#feedback').textContent=message;$('#next').disabled=false;$('#next').textContent=turn===total-1?'오늘의 탐험 결과 보기':'다음 문제 →'}else{misses++;btn.classList.add('wrong');$('#feedback').textContent=message}}$('#next').onclick=()=>{if(!solved)return;turn++;if(turn===total)finish();else render()};function finish(){$('#count').textContent='여섯 문제 완성!';document.querySelectorAll('.dot').forEach(x=>x.classList.add('on'));$('#scene').innerHTML='<div class="end">🚂</div><h2>참 잘했어요!</h2><p>여섯 문장의 문장부호를 끝까지 찾아냈어요.<br>또박또박 읽고 생각한 내가 멋져요!</p>';$('#choices').innerHTML='';$('#feedback').textContent=misses===0?'모든 문장부호를 한 번에 맞혔어요!':'다시 생각하며 끝까지 해냈어요!';$('#next').textContent='다시 놀기 ↻';$('#next').disabled=false;$('#next').onclick=()=>location.reload();$('#next').focus()}
const questions=[{emoji:'🎒',text:'장윤이가 즐겁게 학교에 가요',ans:'.',label:'마침표',clue:'설명하는 문장 끝에는 무엇을 찍을까요?',desc:'설명하는 문장 끝에는 마침표(.)를 찍어요!'},{emoji:'🕒',text:'지금 몇 시 몇 분인가요',ans:'?',label:'물음표',clue:'물어보는 문장 끝에는 무엇을 찍을까요?',desc:'물어보는 문장 끝에는 물음표(?)를 찍어요!'},{emoji:'🌈',text:'우와, 하늘에 무지개가 정말 아름답구나',ans:'!',label:'느낌표',clue:'기쁘거나 감탄하는 말 끝에는 무엇을 찍을까요?',desc:'기쁜 느낌을 나타낼 때는 느낌표(!)를 써요!'},{emoji:'🍎',text:'어떤 과일을 가장 좋아하니',ans:'?',label:'물음표',clue:'질문하는 말 끝에는 어떤 부호가 올까요?',desc:'질문하는 말 끝에는 물음표(?)가 와요!'},{emoji:'🐶',text:'강아지가 공원에서 신나게 뛰어놀아요',ans:'.',label:'마침표',clue:'사실을 알려주는 문장 끝에는 무엇을 찍을까요?',desc:'사실을 알려주는 문장에는 마침표(.)를 찍어요!'},{emoji:'🎉',text:'앗, 드디어 보물상자를 찾았다',ans:'!',label:'느낌표',clue:'놀라거나 반가운 소리 끝에는 무엇을 찍을까요?',desc:'놀라거나 반가운 소리에는 느낌표(!)를 찍어요!'}];const marks=[{mark:'.',name:'마침표'},{mark:'?',name:'물음표'},{mark:'!',name:'느낌표'}];function render(){progress();const q=questions[turn];$('#scene').innerHTML='<div class="hint">문장 끝에 알맞은 문장부호 기차 칸을 골라요!</div><div class="orchard" aria-hidden="true">'+q.emoji+'</div><div class="sentence-card"><span id="sentenceText">'+q.text+'</span><span class="slot-box" id="slot">?</span></div><div class="recipe">'+q.clue+'</div>';$('#choices').replaceChildren();marks.forEach(m=>{const b=document.createElement('button');b.className='choice';b.setAttribute('aria-label',m.name+' '+m.mark);b.innerHTML='<span>'+m.mark+'</span><small>'+m.name+'</small>';b.onclick=()=>{const ok=m.mark===q.ans;if(ok){$('#slot').textContent=m.mark}result(b,ok,ok?'맞았어요! '+q.desc:'다시 생각해 볼까요? '+q.clue)};$('#choices').append(b)})}render();</script></body></html>
