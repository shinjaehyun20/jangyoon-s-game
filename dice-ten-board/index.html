<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf6ee"><title>알록달록 주사위 덧셈 보드</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#29364a;background:var(--bg)}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #156da8;outline-offset:3px}button:disabled{cursor:default}main{height:100vh;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;gap:clamp(7px,1.5vh,14px);padding:clamp(12px,3vw,24px);padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--accent)}h1{font-size:clamp(20px,4.5vw,30px);line-height:1.25;margin:3px 0}h2{font-size:clamp(19px,4.5vw,27px);margin:0}p{margin:0;line-height:1.5}.sound{border:1px solid #d2d9cf;border-radius:16px;background:#fff;padding:10px;white-space:nowrap;font-size:12px;min-height:44px}.progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}.dots{display:flex;gap:7px}.dot{width:13px;height:13px;border-radius:50%;background:#d9ded5}.dot.on{background:var(--accent)}.scene{background:#fffdf8;border:2px solid #ffffff;border-radius:28px;box-shadow:0 7px 0 #253d3210;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:clamp(10px,2vh,20px);text-align:center;position:relative;overflow:hidden}.hint{font-size:clamp(13px,3.4vw,16px);color:#526358}.feedback{min-height:48px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.6vw,17px);font-weight:700;line-height:1.4;padding:3px 6px}.next{width:100%;min-height:48px;background:var(--accent);border:0;border-radius:17px;color:white;font-weight:800;padding:13px;box-shadow:0 4px 0 var(--shadow)}.next:disabled{background:#c7cfca;box-shadow:0 4px 0 #b1bbb5;color:#fff}.choices{display:flex;justify-content:center;gap:clamp(7px,2vw,14px)}.choice{border:2px solid #fff;background:white;box-shadow:0 5px 0 #d5ddce;min-height:64px;border-radius:21px;font-weight:800;transition:transform .15s,background .15s}.choice:active{transform:translateY(3px)}.choice.good{background:#d7f6cb;border-color:#58a83a}.choice.wrong{background:#ffeadb;border-color:#dc975e}.foot{font-size:11px;text-align:center;color:#607267}.end{font-size:clamp(56px,13vw,90px)}[hidden]{display:none!important}@media(max-height:650px){main{gap:5px;padding:10px}.feedback{min-height:37px}.choice{min-height:53px}.next{min-height:44px;padding:10px}.foot{display:none}.scene{border-radius:20px;padding:8px}h1{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}:root{--bg:#eaf6ee;--accent:#2b7a56;--shadow:#1d543b}.dice-row{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.5vw,18px);font-size:clamp(26px,5.5vw,40px);font-weight:900;color:#2b7a56}.die-box{width:clamp(66px,16vw,92px);height:clamp(66px,16vw,92px);border-radius:20px;background:#ffffff;color:#1e352b;border:3px solid #74b894;box-shadow:0 6px 0 #d3e8dc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(28px,6.5vw,42px);line-height:1}.die-box small{font-size:clamp(12px,2.8vw,15px);color:#4b725f;margin-top:4px}.die-box.ans{background:#fff3c4;border-color:#e6a825;color:#8c5800}.track{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:480px;background:#eaf6ee;padding:10px;border-radius:18px}.cell{background:#fff;border:2px solid #cbe4d5;border-radius:12px;padding:6px 2px;font-size:clamp(12px,2.8vw,15px);font-weight:800;color:#4f6d5d;display:flex;flex-direction:column;align-items:center;gap:2px}.cell.here{background:#ffd166;border-color:#d99014;color:#29364a}.choice{flex:1;max-width:150px;padding:8px 6px;background:#358f65;color:white;font-size:clamp(20px,4.8vw,28px);box-shadow:0 5px 0 #236345}.choice.good,.choice.wrong{color:#29364a}
/* Keep the puzzle and home control reachable on short mobile screens. */
@media (max-height:500px) and (orientation:landscape){
main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:44px 18px minmax(64px,1fr) 28px 44px 34px;gap:5px;padding:8px;max-width:900px}
header{grid-column:1/3;grid-row:1}h1{font-size:20px}.progress{grid-column:1/3;grid-row:2}
.scene{grid-column:1;grid-row:3/7;padding:6px;gap:4px;justify-content:space-evenly;border-radius:16px}
.scene .hint{display:none}.dice-row{font-size:24px;gap:8px}.die-box{width:56px;height:56px;font-size:24px;border-radius:14px}.die-box small{font-size:10px;margin-top:2px}.track{padding:6px;gap:4px}.cell{padding:4px 2px;font-size:11px}
.choices{grid-column:2;grid-row:3;align-self:center;gap:6px}.choice{min-height:48px;padding:6px;min-width:0;font-size:18px}
.feedback{grid-column:2;grid-row:4;min-height:0;font-size:12px;padding:0}.next{grid-column:2;grid-row:5;min-height:44px;padding:8px}
.foot{display:block;grid-column:2;grid-row:6;font-size:10px;line-height:1.1}.foot a{padding:5px!important}.end{font-size:52px}
}
@media (max-height:700px) and (orientation:portrait){
main{gap:6px;padding:10px}h1{font-size:20px}.scene{padding:8px;gap:4px}.scene .hint{font-size:12px}.die-box{width:64px;height:64px;font-size:26px}.track{padding:6px}.choice{min-height:52px;padding:6px;font-size:20px}.feedback{min-height:30px;font-size:13px}.next{min-height:44px;padding:8px}.foot{display:block;font-size:10px}.foot a{padding:5px!important}
}
</style></head><body><main><header><div><div class="eyebrow">초등 1학년 · 수학 놀이터</div><h1>알록달록 주사위 덧셈 보드</h1></div><button class="sound" id="sound" aria-pressed="false">소리 꺼짐</button></header><div class="progress"><span id="count"></span><div class="dots" id="dots" aria-hidden="true"></div></div><section class="scene" id="scene" aria-label="문제"></section><div class="choices" id="choices" role="group" aria-label="답 고르기"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" disabled>다음 문제 →</button><div class="foot"><a id="homeBtn" href="../index.html" style="display:inline-block;padding:8px;color:inherit;font-weight:700">🏠 게임 모음</a> · 버튼을 눌러 골라요 · 키보드는 탭 키와 엔터 키로 놀아요</div></main><script>'use strict';const $=s=>document.querySelector(s);let turn=0,solved=false,misses=0,sound=false,audio;const total=6;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'소리 켜짐':'소리 꺼짐';$('#sound').setAttribute('aria-pressed',sound);if(sound)tone(true)};function tone(ok){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?660:260;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.start();o.stop(audio.currentTime+.23)}catch{}}function progress(){$('#count').textContent=(turn+1)+' / '+total+' 문제';$('#dots').innerHTML=Array.from({length:total},(_,i)=>'<span class="dot '+(i<turn?'on':'')+'"></span>').join('');$('#next').disabled=true;$('#feedback').textContent='';solved=false}function result(btn,ok,message){if(solved)return;tone(ok);if(ok){solved=true;btn.classList.add('good');document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('#feedback').textContent=message;$('#next').disabled=false;$('#next').textContent=turn===total-1?'골인 축하 보기':'다음 문제 →'}else{misses++;btn.classList.add('wrong');$('#feedback').textContent=message}}$('#next').onclick=()=>{if(!solved)return;turn++;if(turn===total)finish();else render()};function finish(){$('#count').textContent='여섯 문제 완성!';document.querySelectorAll('.dot').forEach(x=>x.classList.add('on'));$('#scene').innerHTML='<div class="end">🎲</div><h2>참 잘했어요!</h2><p>주사위 눈을 정확히 더해 보드판 끝까지 도착했어요.<br>차근차근 수를 더한 내가 멋져요!</p>';$('#choices').innerHTML='';$('#feedback').textContent=misses===0?'모든 주사위 덧셈을 한 번에 해결했어요!':'다시 생각하며 끝까지 골인했어요!';$('#next').textContent='다시 놀기 ↻';$('#next').disabled=false;$('#next').onclick=()=>location.reload();$('#next').focus()}
const pips=['','⚀','⚁','⚂','⚃','⚄','⚅'];const rounds=[{a:2,b:3,opts:[4,5,6,7]},{a:3,b:4,opts:[6,7,8,9]},{a:4,b:4,opts:[6,7,8,10]},{a:5,b:2,opts:[5,6,7,8]},{a:6,b:3,opts:[7,8,9,10]},{a:5,b:5,opts:[8,9,10,11]}];function board(activeStep){return '<div class="track" aria-label="보드판 징검다리">'+Array.from({length:6},(_,i)=>{const here=i===activeStep;return '<div class="cell'+(here?' here':'')+'"><span>'+(here?'🐥':i===5?'🏁':'⭐')+'</span><span>'+(i+1)+'단계</span></div>'}).join('')+'</div>'}function render(){progress();const q=rounds[turn],sum=q.a+q.b;$('#scene').innerHTML='<div class="hint">두 주사위의 숫자를 더하면 모두 몇 칸 앞으로 갈까요?</div><div class="dice-row"><div class="die-box" aria-label="첫째 주사위 '+q.a+'"><span>'+q.a+'</span><small>'+pips[q.a]+'</small></div><span>＋</span><div class="die-box" aria-label="둘째 주사위 '+q.b+'"><span>'+q.b+'</span><small>'+pips[q.b]+'</small></div><span>＝</span><div class="die-box ans" id="ansSlot" aria-label="합계 빈칸"><span>?</span><small>합계</small></div></div>'+board(turn);$('#choices').replaceChildren();q.opts.forEach(n=>{const b=document.createElement('button');b.className='choice';b.textContent=n+'칸';b.setAttribute('aria-label',n+'칸 점프');b.onclick=()=>{const ok=n===sum;if(ok){$('#ansSlot').innerHTML='<span>'+sum+'</span><small>정답!</small>'}result(b,ok,ok?'맞았어요! '+q.a+' 더하기 '+q.b+'는 '+sum+'칸 점프!':'천천히 다시 더해 볼까요? ('+q.a+' + '+q.b+')')};$('#choices').append(b)})}render();</script></body></html>
