<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="50%" stop-color="#fab1a0" />
      <stop offset="100%" stop-color="#ff7675" />
    </linearGradient>
    <linearGradient id="lion-mane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
    <linearGradient id="lion-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>
    <linearGradient id="tile-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8f9fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.18)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#bg-grad)" />

  <!-- Playful Background Shapes -->
  <circle cx="80" cy="80" r="30" fill="#ffffff" opacity="0.4" />
  <circle cx="430" cy="110" r="40" fill="#ffffff" opacity="0.3" />
  <circle cx="450" cy="380" r="25" fill="#ffffff" opacity="0.35" />

  <!-- Cute Lion Head -->
  <g transform="translate(256, 190)" filter="url(#shadow)">
    <!-- Mane Petals -->
    <circle cx="0" cy="-90" r="40" fill="url(#lion-mane)" />
    <circle cx="64" cy="-64" r="40" fill="url(#lion-mane)" />
    <circle cx="90" cy="0" r="40" fill="url(#lion-mane)" />
    <circle cx="64" cy="64" r="40" fill="url(#lion-mane)" />
    <circle cx="0" cy="90" r="40" fill="url(#lion-mane)" />
    <circle cx="-64" cy="64" r="40" fill="url(#lion-mane)" />
    <circle cx="-90" cy="0" r="40" fill="url(#lion-mane)" />
    <circle cx="-64" cy="-64" r="40" fill="url(#lion-mane)" />

    <!-- Lion Ears -->
    <circle cx="-50" cy="-60" r="18" fill="url(#lion-face)" />
    <circle cx="-50" cy="-60" r="10" fill="#f8a5c2" />
    <circle cx="50" cy="-60" r="18" fill="url(#lion-face)" />
    <circle cx="50" cy="-60" r="10" fill="#f8a5c2" />

    <!-- Lion Face Base -->
    <circle cx="0" cy="0" r="75" fill="url(#lion-face)" />

    <!-- Cheeks & Snout -->
    <circle cx="-42" cy="15" r="14" fill="#ff7675" opacity="0.45" />
    <circle cx="42" cy="15" r="14" fill="#ff7675" opacity="0.45" />
    <ellipse cx="0" cy="18" rx="30" ry="22" fill="#ffffff" />
    <polygon points="-12,10 12,10 0,22" fill="#2d3436" rx="3" />
    <path d="M-8,24 Q0,32 8,24" stroke="#2d3436" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Big Sparkly Eyes -->
    <circle cx="-25" cy="-12" r="10" fill="#2d3436" />
    <circle cx="-22" cy="-15" r="4" fill="#ffffff" />
    <circle cx="25" cy="-12" r="10" fill="#2d3436" />
    <circle cx="28" cy="-15" r="4" fill="#ffffff" />
  </g>

  <!-- Word Puzzle Tiles: '사' and '자' -->
  <g transform="translate(160, 360)" filter="url(#shadow)">
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="url(#tile-grad)" stroke="#0984e3" stroke-width="4" />
    <text x="0" y="16" font-family="'Pretendard', sans-serif" font-weight="900" font-size="52" fill="#0984e3" text-anchor="middle">사</text>
  </g>
  <g transform="translate(270, 360)" filter="url(#shadow)">
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="url(#tile-grad)" stroke="#0984e3" stroke-width="4" />
    <text x="0" y="16" font-family="'Pretendard', sans-serif" font-weight="900" font-size="52" fill="#0984e3" text-anchor="middle">자</text>
  </g>
  <g transform="translate(380, 360)" filter="url(#shadow)">
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="4" stroke-dasharray="6 4" />
    <text x="0" y="16" font-family="'Pretendard', sans-serif" font-weight="900" font-size="44" fill="#e17055" text-anchor="middle">✨</text>
  </g>

  <!-- Bottom Title Pill -->
  <rect x="56" y="440" width="400" height="48" rx="24" fill="rgba(255,255,255,0.95)" filter="url(#shadow)" />
  <text x="256" y="472" font-family="'Pretendard', sans-serif" font-weight="800" font-size="22" fill="#2f3542" text-anchor="middle">🦁 동물 친구 이름 맞추기 받침 퍼즐</text>
</svg>
