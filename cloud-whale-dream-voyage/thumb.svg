<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e130c"/>
      <stop offset="50%" stop-color="#2a5298"/>
      <stop offset="100%" stop-color="#9b51e0"/>
    </linearGradient>
    <linearGradient id="whalePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb8b8"/>
      <stop offset="100%" stop-color="#ff7675"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="24" fill="url(#skyBg)"/>

  <!-- Stars & Aurora Glow -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="340" cy="60" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="120" cy="90" r="2" fill="#ffeaa7" opacity="0.8"/>
  <circle cx="300" cy="180" r="3" fill="#ffffff" opacity="0.7"/>

  <path d="M0 80 Q 200 40 400 90 L 400 130 Q 200 70 0 120 Z" fill="#00cec9" opacity="0.25"/>
  <path d="M0 110 Q 200 70 400 120 L 400 160 Q 200 100 0 150 Z" fill="#a29bfe" opacity="0.25"/>

  <!-- Star Ring -->
  <circle cx="280" cy="140" r="46" fill="none" stroke="#ffeaa7" stroke-width="6" opacity="0.85"/>
  <circle cx="280" cy="94" r="5" fill="#fff" filter="drop-shadow(0 0 6px #ffeaa7)"/>

  <!-- Cloud Whale -->
  <g transform="translate(160, 150)">
    <!-- Trail Puffs -->
    <circle cx="-70" cy="6" r="14" fill="#ffb8b8" opacity="0.4"/>
    <circle cx="-90" cy="10" r="10" fill="#ffb8b8" opacity="0.25"/>

    <!-- Tail -->
    <path d="M-45 0 L-70 -18 L-60 0 L-70 18 Z" fill="#ff7675"/>

    <!-- Body -->
    <ellipse cx="0" cy="0" rx="55" ry="36" fill="url(#whalePink)"/>
    <circle cx="-20" cy="-14" r="24" fill="url(#whalePink)"/>
    <circle cx="16" cy="-16" r="22" fill="url(#whalePink)"/>
    <circle cx="0" cy="16" r="20" fill="url(#whalePink)"/>

    <!-- Belly -->
    <ellipse cx="6" cy="14" rx="36" ry="18" fill="#ffffff"/>

    <!-- Eye & Smile -->
    <circle cx="26" cy="-6" r="5" fill="#2d3436"/>
    <circle cx="28" cy="-8" r="2" fill="#ffffff"/>
    <circle cx="18" cy="4" r="7" fill="#ff4757" opacity="0.4"/>

    <!-- Flipper -->
    <ellipse cx="4" cy="8" rx="14" ry="7" fill="#ff7675" transform="rotate(25 4 8)"/>

    <!-- Spout -->
    <circle cx="10" cy="-30" r="3.5" fill="#74b9ff"/>
    <circle cx="16" cy="-38" r="3" fill="#74b9ff"/>
  </g>

  <!-- Title Banner -->
  <rect x="50" y="248" width="300" height="38" rx="19" fill="#ffffff" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.25))"/>
  <text x="200" y="273" font-family="'Pretendard', sans-serif" font-weight="900" font-size="18" fill="#6c5ce7" text-anchor="middle">🐳 몽실몽실 구름고래</text>
</svg>
