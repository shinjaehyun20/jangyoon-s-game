<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>펭귄의 풍선 더하기 축제</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body { width: 100vw; height: 100dvh; overflow: hidden; background: linear-gradient(180deg, #E3F6FF 0%, #B8E8FC 100%); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #123B5D; }
  .app { width: 100%; height: 100%; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 14px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; border: 3px solid #3AB0FF; border-radius: 18px; padding: 8px 14px; box-shadow: 0 4px 0 #1E88E5; }
  .title-badge { font-size: 1.05rem; font-weight: 800; color: #0D5C91; }
  .stats { display: flex; gap: 10px; font-size: 0.95rem; font-weight: 800; }
  .stat-pill { background: #E8F7FF; padding: 4px 10px; border-radius: 999px; border: 2px solid #3AB0FF; }
  .sky-stage { flex: 1; display: flex; flex-direction: column; justify-content: space-around; align-items: center; background: rgba(255,255,255,0.88); border: 3px solid #3AB0FF; border-radius: 24px; margin: 10px 0; padding: 12px; }
  .penguin-row { display: flex; align-items: center; gap: 12px; width: 100%; background: #F0FAFF; border-radius: 16px; padding: 8px 12px; border: 2px dashed #3AB0FF; }
  .penguin-icon { font-size: 2.4rem; line-height: 1; }
  .speech { font-size: 0.96rem; font-weight: 700; line-height: 1.35; color: #123B5D; word-break: keep-all; }
  .target-cloud { display: flex; flex-direction: column; align-items: center; background: #FFF8D6; border: 4px solid #FFB100; border-radius: 24px; padding: 10px 26px; box-shadow: 0 5px 0 #E09600; }
  .target-label { font-size: 0.95rem; font-weight: 800; color: #9C6500; }
  .target-number { font-size: 2.5rem; font-weight: 900; color: #D96B00; line-height: 1.1; }
  .sum-slots { display: flex; align-items: center; gap: 10px; font-size: 1.7rem; font-weight: 900; color: #0D5C91; }
  .slot-box { width: 68px; height: 64px; border-radius: 16px; border: 3px dashed #3AB0FF; background: #F7FCFF; display: flex; align-items: center; justify-content: center; font-size: 1.65rem; font-weight: 900; color: #0D5C91; }
  .slot-box.filled { border-style: solid; background: #D6F0FF; }
  .balloon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  .balloon-btn { height: 66px; border-radius: 22px; border: 3px solid #1E88E5; background: #FFFFFF; font-size: 1.55rem; font-weight: 900; color: #123B5D; box-shadow: 0 5px 0 #1E88E5; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: transform 0.08s; }
  .balloon-btn.selected { background: #FFE169; border-color: #D96B00; box-shadow: 0 5px 0 #D96B00; color: #5C2D00; transform: translateY(-2px); }
  .bottom-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .action-btn { flex: 1; height: 48px; border-radius: 14px; border: none; font-size: 1rem; font-weight: 800; cursor: pointer; background: #1E88E5; color: #FFFFFF; box-shadow: 0 4px 0 #0D5C91; }
  .action-btn.secondary { background: #607D8B; box-shadow: 0 4px 0 #37474F; }
  .overlay { position: fixed; inset: 0; background: rgba(18, 59, 93, 0.72); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .overlay.hidden { display: none; }
  .modal { background: #FFFFFF; border: 4px solid #3AB0FF; border-radius: 26px; padding: 22px 18px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 0 #0D5C91; }
  .modal h2 { font-size: 1.5rem; color: #0D5C91; margin-bottom: 10px; }
  .modal p { font-size: 1.02rem; line-height: 1.45; color: #123B5D; margin-bottom: 16px; font-weight: 700; word-break: keep-all; }
  .start-btn { width: 100%; height: 54px; border-radius: 16px; border: none; background: #FF7F3F; color: #FFFFFF; font-size: 1.2rem; font-weight: 900; box-shadow: 0 5px 0 #C85015; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="title-badge">🐧 펭귄의 풍선 더하기 축제</div>
    <div class="stats">
      <div class="stat-pill" id="stageText">1 / 8단계</div>
      <div class="stat-pill" id="scoreText">🎈 0점</div>
    </div>
  </div>

  <div class="sky-stage">
    <div class="penguin-row">
      <div class="penguin-icon" id="penguinFace">🐧</div>
      <div class="speech" id="guideSpeech">숫자 풍선 2개를 골라 구름에 적힌 목표 숫자를 만들어 주세요!</div>
    </div>

    <div class="target-cloud">
      <div class="target-label">🌟 목표 합계 구름</div>
      <div class="target-number" id="targetNum">10</div>
    </div>

    <div class="sum-slots">
      <div class="slot-box" id="slotA">?</div>
      <span>+</span>
      <div class="slot-box" id="slotB">?</div>
      <span>=</span>
      <div class="slot-box filled" id="slotGoal">10</div>
    </div>

    <div class="balloon-grid" id="balloonGrid"></div>
  </div>

  <div class="bottom-bar">
    <button class="action-btn secondary" id="clearPickBtn">↩️ 선택 지우기</button>
    <button class="action-btn" id="hintBtn">💡 덧셈 힌트</button>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="modal">
    <h2>🎈 펭귄의 풍선 더하기 축제</h2>
    <p>아기 펭귄이 하늘섬 축제로 날아갈 수 있도록 <b>숫자 풍선 2개</b>를 골라 목표 숫자를 만들어 주세요! (1학년 2학기 모으기·덧셈 놀이)</p>
    <button class="start-btn" id="startGameBtn">풍선 띄우기 시작!</button>
  </div>
</div>

<div class="overlay hidden" id="clearOverlay">
  <div class="modal">
    <h2>🎉 하늘섬 도착 성공!</h2>
    <p id="clearMessage">8단계를 모두 풀어 아기 펭귄이 하늘섬 축제에 도착했어요!</p>
    <button class="start-btn" id="playAgainBtn">다시 날아오르기!</button>
  </div>
</div>

<script>
(function() {
  const STAGES = [
    { target: 10, options: [6, 4, 3, 5, 2, 7], pair: [6, 4], hint: "6개에 4개를 더 모으면 딱 10이 돼요!" },
    { target: 12, options: [10, 2, 5, 4, 8, 3], pair: [10, 2], hint: "10묶음 1개와 낱개 2개를 더하면 12가 돼요!" },
    { target: 15, options: [10, 5, 7, 6, 9, 4], pair: [10, 5], hint: "10과 5를 모으면 15가 만들어져요!" },
    { target: 14, options: [11, 3, 5, 6, 10, 2], pair: [11, 3], hint: "11에서 3만큼 더 앞으로 세어 보면 14예요!" },
    { target: 17, options: [12, 5, 4, 8, 10, 3], pair: [12, 5], hint: "낱개 2와 5를 더하면 7이니까 12 + 5 = 17이에요!" },
    { target: 19, options: [13, 6, 4, 7, 11, 5], pair: [13, 6], hint: "13에 6을 더하면 19가 완성돼요!" },
    { target: 20, options: [14, 6, 12, 5, 11, 7], pair: [14, 6], hint: "4와 6이 만나면 10이 되니까 14 + 6 = 20이에요!" },
    { target: 25, options: [20, 5, 13, 4, 15, 7], pair: [20, 5], hint: "10묶음 2개인 20에 낱개 5를 더하면 25예요!" }
  ];

  let audioCtx = null;
  function playTone(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  let stageIdx = 0;
  let score = 0;
  let selectedIndices = [];
  let currentOptions = [];
  let locked = false;

  const stageText = document.getElementById("stageText");
  const scoreText = document.getElementById("scoreText");
  const penguinFace = document.getElementById("penguinFace");
  const guideSpeech = document.getElementById("guideSpeech");
  const targetNum = document.getElementById("targetNum");
  const slotA = document.getElementById("slotA");
  const slotB = document.getElementById("slotB");
  const slotGoal = document.getElementById("slotGoal");
  const balloonGrid = document.getElementById("balloonGrid");
  const startOverlay = document.getElementById("startOverlay");
  const clearOverlay = document.getElementById("clearOverlay");
  const clearMessage = document.getElementById("clearMessage");

  function renderStage() {
    locked = false;
    selectedIndices = [];
    const st = STAGES[stageIdx];
    currentOptions = st.options.slice();
    stageText.textContent = (stageIdx + 1) + " / " + STAGES.length + "단계";
    scoreText.textContent = "🎈 " + score + "점";
    penguinFace.textContent = "🐧";
    guideSpeech.textContent = "풍선 2개를 차례대로 눌러 합이 " + st.target + "이 되게 해 주세요!";
    targetNum.textContent = st.target;
    slotGoal.textContent = st.target;
    updateSlots();
    renderBalloons();
  }

  function updateSlots() {
    if (selectedIndices.length === 0) {
      slotA.textContent = "?";
      slotA.className = "slot-box";
      slotB.textContent = "?";
      slotB.className = "slot-box";
    } else if (selectedIndices.length === 1) {
      slotA.textContent = currentOptions[selectedIndices[0]];
      slotA.className = "slot-box filled";
      slotB.textContent = "?";
      slotB.className = "slot-box";
    } else {
      slotA.textContent = currentOptions[selectedIndices[0]];
      slotA.className = "slot-box filled";
      slotB.textContent = currentOptions[selectedIndices[1]];
      slotB.className = "slot-box filled";
    }
  }

  function renderBalloons() {
    balloonGrid.innerHTML = "";
    currentOptions.forEach((val, idx) => {
      const btn = document.createElement("button");
      const isSel = selectedIndices.includes(idx);
      btn.className = "balloon-btn" + (isSel ? " selected" : "");
      btn.innerHTML = "🎈 " + val;
      btn.addEventListener("click", () => toggleBalloon(idx));
      balloonGrid.appendChild(btn);
    });
  }

  function toggleBalloon(idx) {
    if (locked) return;
    const pos = selectedIndices.indexOf(idx);
    if (pos !== -1) {
      selectedIndices.splice(pos, 1);
      playTone(392, 0.08, "sine");
      updateSlots();
      renderBalloons();
      return;
    }
    if (selectedIndices.length < 2) {
      selectedIndices.push(idx);
      playTone(523.25, 0.08, "sine");
      updateSlots();
      renderBalloons();
    }
    if (selectedIndices.length === 2) {
      checkAnswer();
    }
  }

  function checkAnswer() {
    locked = true;
    const st = STAGES[stageIdx];
    const a = currentOptions[selectedIndices[0]];
    const b = currentOptions[selectedIndices[1]];
    const sum = a + b;
    if (sum === st.target) {
      score += 100;
      scoreText.textContent = "🎈 " + score + "점";
      penguinFace.textContent = "🥳";
      guideSpeech.textContent = "짝짝짝! " + a + " + " + b + " = " + st.target + " 정답이에요! 두둥실 날아올라요!";
      playTone(587.33, 0.12, "sine");
      setTimeout(() => playTone(783.99, 0.22, "triangle"), 120);
      setTimeout(() => {
        stageIdx++;
        if (stageIdx >= STAGES.length) {
          clearMessage.textContent = "총 " + score + "점으로 8단계 덧셈 구름을 모두 통과했어요! 참 잘했어요!";
          clearOverlay.classList.remove("hidden");
        } else {
          renderStage();
        }
      }, 950);
    } else {
      penguinFace.textContent = "😮";
      guideSpeech.textContent = a + " + " + b + " = " + sum + "이에요! 합이 " + st.target + "이 되는 풍선 2개를 다시 골라 볼까요?";
      playTone(280, 0.18, "sine");
      setTimeout(() => {
        selectedIndices = [];
        locked = false;
        updateSlots();
        renderBalloons();
      }, 850);
    }
  }

  document.getElementById("clearPickBtn").addEventListener("click", () => {
    if (locked) return;
    selectedIndices = [];
    updateSlots();
    renderBalloons();
    playTone(349.23, 0.1, "sine");
  });

  document.getElementById("hintBtn").addEventListener("click", () => {
    const st = STAGES[stageIdx];
    penguinFace.textContent = "💡";
    guideSpeech.textContent = st.hint;
    playTone(440, 0.1, "sine");
  });

  document.getElementById("startGameBtn").addEventListener("click", () => {
    startOverlay.classList.add("hidden");
    stageIdx = 0;
    score = 0;
    renderStage();
  });

  document.getElementById("playAgainBtn").addEventListener("click", () => {
    clearOverlay.classList.add("hidden");
    stageIdx = 0;
    score = 0;
    renderStage();
  });

  renderStage();
})();
</script>
</body>
</html>
