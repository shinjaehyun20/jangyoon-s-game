<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="carnivalSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#190d3d"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <radialGradient id="fireworkCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffd32a"/>
      <stop offset="100%" stop-color="#ff3838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#54a0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night Carnival Sky -->
  <rect width="400" height="300" fill="url(#carnivalSky)"/>

  <!-- Glowing City / Castle Silhouette -->
  <path d="M 0,300 L 40,240 L 70,250 L 90,210 L 110,250 L 160,230 L 190,200 L 210,200 L 240,230 L 290,240 L 320,195 L 345,240 L 400,220 L 400,300 Z" fill="#110926" opacity="0.85"/>
  <rect x="185" y="240" width="30" height="60" fill="#ffd32a" opacity="0.3"/>

  <!-- Big Central Gold & Red Firework -->
  <circle cx="200" cy="110" r="75" fill="url(#fireworkCenter)" opacity="0.75"/>
  <!-- Firework Rays -->
  <g stroke="#ffd32a" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="200" y1="110" x2="200" y2="40"/>
    <line x1="200" y1="110" x2="200" y2="180"/>
    <line x1="200" y1="110" x2="130" y2="110"/>
    <line x1="200" y1="110" x2="270" y2="110"/>
    <line x1="200" y1="110" x2="150" y2="60"/>
    <line x1="200" y1="110" x2="250" y2="160"/>
    <line x1="200" y1="110" x2="150" y2="160"/>
    <line x1="200" y1="110" x2="250" y2="60"/>
  </g>

  <!-- Cyan Spark Firework Left -->
  <circle cx="85" cy="90" r="55" fill="url(#cyanBurst)" opacity="0.7"/>
  <g stroke="#00d2d3" stroke-width="2.5" stroke-linecap="round">
    <line x1="85" y1="90" x2="85" y2="45"/>
    <line x1="85" y1="90" x2="85" y2="135"/>
    <line x1="85" y1="90" x2="40" y2="90"/>
    <line x1="85" y1="90" x2="130" y2="90"/>
  </g>

  <!-- Magenta Spark Firework Right -->
  <circle cx="315" cy="85" r="50" fill="#ff7675" opacity="0.25"/>
  <g stroke="#ff7675" stroke-width="2.5" stroke-linecap="round">
    <line x1="315" y1="85" x2="315" y2="45"/>
    <line x1="315" y1="85" x2="315" y2="125"/>
    <line x1="315" y1="85" x2="275" y2="85"/>
    <line x1="315" y1="85" x2="355" y2="85"/>
  </g>

  <!-- 300 Milestone Celebration Badge -->
  <circle cx="200" cy="110" r="34" fill="#ffffff" stroke="#ffd32a" stroke-width="4"/>
  <text x="200" y="117" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" fill="#ff3838" text-anchor="middle">300!</text>

  <!-- Festive Floating Balloons & Emoticons -->
  <text x="60" y="180" font-size="28" text-anchor="middle">🎈</text>
  <text x="340" y="175" font-size="28" text-anchor="middle">🎉</text>
  <text x="200" y="175" font-size="30" text-anchor="middle">🎆</text>

  <!-- Bottom Banner -->
  <rect x="35" y="248" width="330" height="40" rx="20" fill="#1e1338" opacity="0.95" stroke="#ff3838" stroke-width="2.5"/>
  <text x="200" y="274" font-family="'Malgun Gothic', sans-serif" font-weight="bold" font-size="15" fill="#fff" text-anchor="middle">🎆 300회 축제! 무지개 불꽃놀이 대축제</text>
</svg>
