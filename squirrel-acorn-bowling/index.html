<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐿️ 아기 다람쥐의 도토리 굴리기 대작전</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 50%, #A5D6A7 100%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #F1F8E9;
      box-shadow: 0 10px 30px rgba(46, 125, 50, 0.2);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #4E342E;
      color: #FFF8E1;
      font-weight: bold;
      font-size: 15px;
      z-index: 10;
    }
    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #EFEBE9;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(62, 39, 35, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      text-align: center;
      padding: 24px;
      backdrop-filter: blur(4px);
    }
    .overlay h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #FFE082;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .overlay p {
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
      color: #FFF3E0;
    }
    .btn {
      background: #FF8F00;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 143, 0, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
      background: #F57C00;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <div id="score-display">🌰 점수: 0</div>
      <div class="badge" id="round-display">라운드 1/5</div>
    </header>
    <canvas id="gameCanvas"></canvas>

    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
      <h1>🐿️ 아기 다람쥐의 도토리 굴리기</h1>
      <p>귀여운 아기 다람쥐와 함께 황금 도토리를 굴려요!<br>화면을 터치하고 뒤로 당겼다 놓으면<br>도토리가 솔방울 핀들을 향해 퐁퐁 굴러갑니다! 🌰🎳</p>
      <button class="btn" id="start-btn">시작하기!</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-overlay" class="overlay hidden">
      <h1 id="over-title">🎉 최고예요!</h1>
      <p id="over-desc">아기 다람쥐가 행복해해요!<br>최종 점수: <b id="final-score" style="color:#FFD54F; font-size:22px;">0</b>점</p>
      <button class="btn" id="restart-btn">다시 굴리기!</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const roundDisplay = document.getElementById('round-display');
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScore = document.getElementById('final-score');

    let W, H;
    function resize() {
      const rect = canvas.getBoundingClientRect();
      W = canvas.width = rect.width;
      H = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 0);

    // Audio synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    function playSound(freq, duration, type = 'sine') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let score = 0;
    let round = 1;
    const maxRounds = 5;
    let gameState = 'START'; // START, AIM, ROLLING, ROUND_CLEAR, GAMEOVER

    // Squirrel & Ball setup
    let ball = { x: 0, y: 0, r: 18, vx: 0, vy: 0, rolling: false };
    let drag = { active: false, startX: 0, startY: 0, curX: 0, curY: 0 };
    let pins = [];
    let particles = [];

    function initPins() {
      pins = [];
      const rows = 4;
      const startY = H * 0.22;
      const pinDistX = 38;
      const pinDistY = 34;

      for (let r = 0; r < rows; r++) {
        const count = r + 1;
        const rowWidth = (count - 1) * pinDistX;
        const startX = W / 2 - rowWidth / 2;
        for (let c = 0; c < count; c++) {
          pins.push({
            x: startX + c * pinDistX,
            y: startY - r * pinDistY,
            r: 14,
            knocked: false,
            opacity: 1
          });
        }
      }
    }

    function resetBall() {
      ball.x = W / 2;
      ball.y = H * 0.82;
      ball.vx = 0;
      ball.vy = 0;
      ball.rolling = false;
    }

    function startRound() {
      initPins();
      resetBall();
      gameState = 'AIM';
      roundDisplay.textContent = `라운드 ${round}/${maxRounds}`;
    }

    function startGame() {
      initAudio();
      score = 0;
      round = 1;
      scoreDisplay.textContent = `🌰 점수: ${score}`;
      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      resize();
      startRound();
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Touch/Mouse controls
    function onPointerDown(e) {
      if (gameState !== 'AIM' || ball.rolling) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const px = clientX - rect.x;
      const py = clientY - rect.y;

      const dist = Math.hypot(px - ball.x, py - ball.y);
      if (dist < 50) {
        drag.active = true;
        drag.startX = ball.x;
        drag.startY = ball.y;
        drag.curX = px;
        drag.curY = py;
        playSound(350, 0.08);
      }
    }

    function onPointerMove(e) {
      if (!drag.active) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      drag.curX = clientX - rect.x;
      drag.curY = clientY - rect.y;
    }

    function onPointerUp(e) {
      if (!drag.active) return;
      drag.active = false;

      const dx = drag.startX - drag.curX;
      const dy = drag.startY - drag.curY;
      const power = Math.min(Math.hypot(dx, dy), 120);

      if (power > 15 && dy > 0) {
        const angle = Math.atan2(dy, dx);
        ball.vx = Math.cos(angle) * (power * 0.18);
        ball.vy = -Math.sin(angle) * (power * 0.18);
        ball.rolling = true;
        gameState = 'ROLLING';
        playSound(440, 0.15, 'triangle');
      }
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp, { passive: false });

    function addParticles(x, y, count = 12, color = '#FFB300') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1,
          color
        });
      }
    }

    let lastTime = 0;
    function update(dt) {
      // Particles update
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (gameState === 'ROLLING') {
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.99;
        ball.vy *= 0.99;

        // Bounce walls
        if (ball.x - ball.r < 20) {
          ball.x = 20 + ball.r;
          ball.vx = -ball.vx * 0.8;
          playSound(280, 0.06);
        } else if (ball.x + ball.r > W - 20) {
          ball.x = W - 20 - ball.r;
          ball.vx = -ball.vx * 0.8;
          playSound(280, 0.06);
        }

        // Collision with pins
        let hit = false;
        pins.forEach(pin => {
          if (!pin.knocked) {
            const dist = Math.hypot(ball.x - pin.x, ball.y - pin.y);
            if (dist < ball.r + pin.r) {
              pin.knocked = true;
              hit = true;
              score += 20;
              scoreDisplay.textContent = `🌰 점수: ${score}`;
              addParticles(pin.x, pin.y, 14, '#8D6E63');
              playSound(520 + Math.random() * 100, 0.12, 'square');
            }
          }
        });

        // Check roll end (off top or stopped)
        if (ball.y < -30 || Math.hypot(ball.vx, ball.vy) < 0.2 || ball.y > H + 50) {
          gameState = 'ROUND_CLEAR';
          setTimeout(() => {
            const knockedCount = pins.filter(p => p.knocked).length;
            if (knockedCount === pins.length) {
              // Strike bonus!
              score += 50;
              scoreDisplay.textContent = `🌰 점수: ${score}`;
              addParticles(W / 2, H * 0.3, 30, '#FFD54F');
              playSound(880, 0.3, 'sine');
            }

            if (round < maxRounds) {
              round++;
              startRound();
            } else {
              gameState = 'GAMEOVER';
              finalScore.textContent = score;
              gameoverOverlay.classList.remove('hidden');
              playSound(660, 0.4);
            }
          }, 800);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Lane background (Forest wooden trail)
      const laneX = 20;
      const laneW = W - 40;
      ctx.fillStyle = '#D7CCC8';
      ctx.fillRect(laneX, 0, laneW, H);

      // Lane borders
      ctx.strokeStyle = '#8D6E63';
      ctx.lineWidth = 4;
      ctx.strokeRect(laneX, -10, laneW, H + 20);

      // Leaf patterns on sides
      ctx.fillStyle = '#C8E6C9';
      ctx.fillRect(0, 0, 20, H);
      ctx.fillRect(W - 20, 0, 20, H);

      // Pins (Pinecones)
      pins.forEach(pin => {
        ctx.save();
        ctx.translate(pin.x, pin.y);
        if (pin.knocked) {
          ctx.globalAlpha = 0.3;
          ctx.rotate(Math.PI / 4);
        }
        // Draw Pinecone pin
        ctx.fillStyle = '#5D4037';
        ctx.beginPath();
        ctx.ellipse(0, 0, pin.r, pin.r * 1.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#795548';
        ctx.beginPath();
        ctx.ellipse(0, -pin.r * 0.4, pin.r * 0.7, pin.r * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Green top sprout
        ctx.fillStyle = '#4CAF50';
        ctx.beginPath();
        ctx.arc(0, -pin.r * 1.2, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Aim Line
      if (drag.active) {
        const dx = drag.startX - drag.curX;
        const dy = drag.startY - drag.curY;
        ctx.save();
        ctx.strokeStyle = '#FF9800';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + dx * 1.5, ball.y + dy * 1.5);
        ctx.stroke();
        ctx.restore();
      }

      // Ball (Golden Acorn)
      ctx.save();
      ctx.translate(ball.x, ball.y);
      // Acorn body
      ctx.fillStyle = '#FFB300';
      ctx.beginPath();
      ctx.ellipse(0, ball.r * 0.2, ball.r, ball.r * 1.2, 0, 0, Math.PI * 2);
      ctx.fill();
      // Acorn cap
      ctx.fillStyle = '#6D4C41';
      ctx.beginPath();
      ctx.arc(0, -ball.r * 0.3, ball.r * 1.05, Math.PI, 0);
      ctx.fill();
      // Stem
      ctx.strokeStyle = '#4E342E';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -ball.r * 0.3);
      ctx.lineTo(0, -ball.r * 0.8);
      ctx.stroke();
      // Cute eyes
      ctx.fillStyle = '#3E2723';
      ctx.beginPath();
      ctx.arc(-5, ball.r * 0.2, 2.5, 0, Math.PI * 2);
      ctx.arc(5, ball.r * 0.2, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Squirrel Character at launch area
      if (gameState === 'AIM') {
        const sqX = ball.x + 38;
        const sqY = ball.y + 10;
        ctx.save();
        ctx.translate(sqX, sqY);
        // Fluffy tail
        ctx.fillStyle = '#D84315';
        ctx.beginPath();
        ctx.ellipse(14, -12, 14, 22, Math.PI / 6, 0, Math.PI * 2);
        ctx.fill();
        // Body
        ctx.fillStyle = '#E64A19';
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        // Belly
        ctx.fillStyle = '#FFE0B2';
        ctx.beginPath();
        ctx.ellipse(-3, 2, 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        // Head
        ctx.fillStyle = '#E64A19';
        ctx.beginPath();
        ctx.arc(-4, -18, 13, 0, Math.PI * 2);
        ctx.fill();
        // Ears
        ctx.beginPath();
        ctx.arc(-9, -28, 4, 0, Math.PI * 2);
        ctx.arc(1, -28, 4, 0, Math.PI * 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.arc(-8, -19, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    let prevT = performance.now();
    function loop(t) {
      const dt = Math.min((t - prevT) / 1000, 0.1);
      prevT = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
