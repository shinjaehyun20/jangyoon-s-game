<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="50%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="laneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#BCAAA4"/>
    </linearGradient>
    <radialGradient id="acornGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </radialGradient>
  </defs>

  <!-- Rounded Background -->
  <rect width="300" height="300" rx="28" fill="url(#bgGrad)"/>

  <!-- Wooden Bowling Lane -->
  <path d="M 70,280 L 110,60 L 190,60 L 230,280 Z" fill="url(#laneGrad)" stroke="#8D6E63" stroke-width="3"/>

  <!-- Pinecone Pins at the top -->
  <g transform="translate(150, 75)">
    <!-- Back row -->
    <ellipse cx="-30" cy="-15" rx="8" ry="12" fill="#5D4037"/>
    <ellipse cx="-10" cy="-15" rx="8" ry="12" fill="#5D4037"/>
    <ellipse cx="10" cy="-15" rx="8" ry="12" fill="#5D4037"/>
    <ellipse cx="30" cy="-15" rx="8" ry="12" fill="#5D4037"/>
    <!-- Middle row -->
    <ellipse cx="-20" cy="0" rx="9" ry="13" fill="#6D4C41"/>
    <ellipse cx="0" cy="0" rx="9" ry="13" fill="#6D4C41"/>
    <ellipse cx="20" cy="0" rx="9" ry="13" fill="#6D4C41"/>
    <!-- Front pin (being hit with stars) -->
    <ellipse cx="0" cy="18" rx="10" ry="15" fill="#795548"/>
    <circle cx="0" cy="8" r="4" fill="#4CAF50"/>
  </g>

  <!-- Golden Acorn Rolling with motion trail -->
  <path d="M 120,230 Q 135,170 148,110" stroke="#FFD54F" stroke-width="4" stroke-dasharray="8 6" fill="none" opacity="0.8"/>
  
  <!-- Acorn in center-lane -->
  <g transform="translate(148, 125)">
    <!-- Acorn Body -->
    <ellipse cx="0" cy="4" rx="22" ry="26" fill="url(#acornGrad)"/>
    <!-- Cap -->
    <path d="M -23,-4 Q 0,-24 23,-4 Z" fill="#6D4C41"/>
    <circle cx="0" cy="-12" r="3" fill="#4E342E"/>
    <!-- Cute Eyes -->
    <circle cx="-7" cy="4" r="3" fill="#3E2723"/>
    <circle cx="7" cy="4" r="3" fill="#3E2723"/>
    <circle cx="-6" cy="2.5" r="1" fill="#FFFFFF"/>
    <circle cx="8" cy="2.5" r="1" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M -4,12 Q 0,16 4,12" stroke="#3E2723" stroke-width="1.8" fill="none"/>
    <!-- Cheeks -->
    <circle cx="-13" cy="9" r="3" fill="#FF8A80" opacity="0.7"/>
    <circle cx="13" cy="9" r="3" fill="#FF8A80" opacity="0.7"/>
  </g>

  <!-- Cute Squirrel at bottom-left corner -->
  <g transform="translate(75, 235)">
    <!-- Fluffy Tail -->
    <path d="M -15,10 C -45,15 -50,-35 -20,-30 C -5,-25 -10,0 -5,15 Z" fill="#D84315"/>
    <path d="M -18,5 C -38,8 -40,-25 -20,-22 Z" fill="#FF8A65"/>
    <!-- Body -->
    <ellipse cx="10" cy="5" rx="18" ry="22" fill="#E64A19"/>
    <ellipse cx="7" cy="7" rx="10" ry="14" fill="#FFE0B2"/>
    <!-- Head -->
    <circle cx="12" cy="-18" rx="16" ry="16" fill="#E64A19"/>
    <!-- Ears -->
    <ellipse cx="5" cy="-32" rx="4" ry="7" fill="#D84315"/>
    <ellipse cx="17" cy="-32" rx="4" ry="7" fill="#D84315"/>
    <!-- Eyes & Smile -->
    <circle cx="7" cy="-18" r="2.5" fill="#212121"/>
    <circle cx="17" cy="-18" r="2.5" fill="#212121"/>
    <path d="M 10,-12 Q 12,-9 14,-12" stroke="#212121" stroke-width="1.5" fill="none"/>
    <circle cx="3" cy="-14" r="3" fill="#FF8A80" opacity="0.6"/>
    <circle cx="21" cy="-14" r="3" fill="#FF8A80" opacity="0.6"/>
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="70" r="4" fill="#FFD54F"/>
  <circle cx="180" cy="75" r="5" fill="#FFD54F"/>
  <circle cx="240" cy="180" r="3" fill="#FFF59D"/>
</svg>
