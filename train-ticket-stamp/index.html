<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🎟️ 기차표 도장 찍기</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{--bg:#25123f;--card:rgba(255,255,255,.12);--accent:#ffcf5c;--ink:#6d3df2;--text:#fff}
    html,body{width:100%;height:100vh;height:100dvh;overflow:hidden;touch-action:none;font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#6d3df2 0,#25123f 56%,#12051f 100%);color:var(--text)}
    .wrap{width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;overflow:hidden}h1{text-align:center;font-size:clamp(21px,5.8vw,29px);text-shadow:0 3px 12px #000}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.hud span{background:var(--card);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:8px 5px;text-align:center;font-size:12px}.hud b{display:block;font-size:clamp(17px,5vw,24px)}
    #gameArea{position:relative;flex:1;min-height:0;border:1px solid rgba(255,255,255,.18);border-radius:26px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));touch-action:none;perspective:900px}.station{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(180deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:42px 42px}.rail{position:absolute;left:0;right:0;bottom:18%;height:34px;background:repeating-linear-gradient(90deg,#6b4326 0 22px,#3b2213 22px 33px);box-shadow:0 -10px 0 rgba(0,0,0,.18)}
    .ticket-window{position:absolute;left:50%;top:45%;width:min(88%,390px);height:126px;transform:translate(-50%,-50%) rotateX(12deg);border-radius:22px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.18);overflow:hidden;box-shadow:0 20px 35px rgba(0,0,0,.32)}.ticket-strip{position:absolute;top:22px;left:0;height:82px;display:flex;gap:10px;transform:translateX(var(--x,0px));will-change:transform}.ticket{min-width:116px;height:82px;border-radius:14px;background:linear-gradient(135deg,#fff8d7,#ffd57e);color:#44230b;display:grid;place-items:center;font-weight:1000;font-size:30px;box-shadow:inset 0 0 0 2px rgba(105,58,20,.16);position:relative}.ticket:before,.ticket:after{content:'';position:absolute;top:30px;width:20px;height:20px;border-radius:50%;background:#3a175e}.ticket:before{left:-10px}.ticket:after{right:-10px}.ticket.good{background:linear-gradient(135deg,#eaffc7,#a7f070)}.slot{position:absolute;left:50%;top:0;bottom:0;width:80px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);border-left:3px dashed rgba(255,255,255,.5);border-right:3px dashed rgba(255,255,255,.5)}
    .stamp{position:absolute;left:50%;top:17%;width:112px;height:94px;transform:translate(-50%,0);transition:transform .08s;display:grid;place-items:center}.stamp.pressed{transform:translate(-50%,42px) scale(.98)}.stamp-head{width:86px;height:48px;border-radius:14px 14px 22px 22px;background:linear-gradient(#ff72b6,#b62d86);box-shadow:0 10px 0 #6e1f58,0 18px 22px rgba(0,0,0,.25);display:grid;place-items:center;font-size:28px}.handle{width:42px;height:48px;border-radius:20px 20px 10px 10px;background:linear-gradient(#ffd166,#f19b38);margin-bottom:-7px;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12)}
    .panel{position:absolute;left:12px;right:12px;bottom:12px;border-radius:20px;background:rgba(18,5,31,.74);padding:10px;text-align:center;border:1px solid rgba(255,255,255,.16);font-weight:900}.big{color:#ffe08c;font-size:clamp(15px,4.2vw,18px)}.hint{font-size:12px;color:rgba(255,255,255,.78);margin-top:4px}.puff{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:44px;animation:pop .5s ease-out forwards;pointer-events:none}@keyframes pop{to{transform:translate(-50%,-84%) scale(1.8);opacity:0}}
    footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.8)}.home-link{color:#fff;text-decoration:none;background:rgba(255,255,255,.16);padding:9px 12px;border-radius:14px;min-height:44px;display:inline-flex;align-items:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(13,4,25,.72);backdrop-filter:blur(8px);z-index:20;padding:18px}.overlay.hidden{display:none}.overlay-card{width:min(92vw,380px);border-radius:28px;padding:24px 18px;text-align:center;background:linear-gradient(160deg,#fff8d7,#ffd8f0);color:#34124f;box-shadow:0 22px 70px rgba(0,0,0,.35)}.overlay-card h2{font-size:28px;margin-bottom:8px}.overlay-card p{line-height:1.5;margin:8px 0}.btn-start{border:0;border-radius:18px;min-height:54px;padding:0 24px;margin-top:12px;background:linear-gradient(135deg,#ff5ca8,#6d3df2);color:#fff;font-weight:900;font-size:18px;box-shadow:0 10px 0 #34124f;cursor:pointer}.btn-start:active{transform:translateY(4px);box-shadow:0 6px 0 #34124f}.result-score{font-size:42px;font-weight:1000;color:#6d3df2}
    @media (prefers-reduced-motion:reduce){.ticket-strip{will-change:auto}.stamp{transition:none}}
  </style>
</head>
<body><div class="wrap"><h1>🎟️ 기차표 도장 찍기</h1><div class="hud"><span>도장<b id="score">0</b></span><span>남은 표<b id="left">12</b></span><span>최고<b id="best">0</b></span></div><div id="gameArea" aria-label="도장 버튼을 꾹 눌렀다 떼어 기차표 별칸에 찍는 게임"><div class="station"></div><div class="rail"></div><div id="stamp" class="stamp"><div class="handle"></div><div class="stamp-head">⭐</div></div><div class="ticket-window"><div class="slot"></div><div id="strip" class="ticket-strip"></div></div><div class="panel"><div id="message" class="big">별표가 가운데 오면 꾹 눌렀다 떼요!</div><div class="hint">핵심 동사: hold-to-punch · 누르고 떼기</div></div></div><footer><small>반짝 별표 도장 12장 도전</small><a class="home-link" href="../index.html">← 홈으로</a></footer></div><div class="overlay" id="startOverlay"><div class="overlay-card"><h2>🎟️ 기차표 도장 찍기</h2><p>기차표가 지나가요. 별표 표가 가운데 오면 도장을 꾹 눌렀다가 떼세요.</p><p>너무 일찍 찍어도 다시 도전할 수 있어요!</p><button class="btn-start" id="startBtn">시작!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="overlay-card"><h2>🚂 출발 준비 완료!</h2><div class="result-score" id="finalScore">0</div><p id="resultMsg"></p><button class="btn-start" id="restartBtn">다시 하기</button></div></div>
<script>(function(){'use strict';const CONFIG={TOTAL:12,SPEED:92};const $=id=>document.getElementById(id);const area=$('gameArea'),strip=$('strip'),stamp=$('stamp');const state={playing:false,score:0,left:CONFIG.TOTAL,x:0,last:0,pressed:false,best:Number(localStorage.getItem('train-ticket-stamp_best')||0),tickets:[]};$('best').textContent=state.best;function makeTickets(){state.tickets=[];strip.innerHTML='';for(let i=0;i<CONFIG.TOTAL+6;i++){const good=i%3===1||i===CONFIG.TOTAL-1;state.tickets.push(good);const d=document.createElement('div');d.className='ticket'+(good?' good':'');d.textContent=good?'⭐':'🚂';strip.appendChild(d)}}function render(){strip.style.setProperty('--x',state.x+'px');$('score').textContent=state.score;$('left').textContent=state.left}function currentHit(){const aw=area.clientWidth;const center=aw/2;const idx=Math.round((center-state.x-58)/126);const ticketCenter=state.x+idx*126+58;return {idx,dist:Math.abs(ticketCenter-center),good:!!state.tickets[idx]}}function puff(txt){const p=document.createElement('div');p.className='puff';p.textContent=txt;area.appendChild(p);setTimeout(()=>p.remove(),520)}function punch(){if(!state.playing)return;const h=currentHit();if(h.good&&h.dist<42){state.score+=h.dist<18?3:2;$('message').textContent=h.dist<18?'반짝 완벽 도장! ⭐':'좋아요! 도장 성공!';puff('⭐');}else{$('message').textContent='아까워요, 별표가 가운데 올 때 찍어요!';puff('💨')}state.left--;if(state.left<=0){setTimeout(end,450)}}function loop(t){if(!state.playing)return;if(!state.last)state.last=t;const dt=Math.min(.04,(t-state.last)/1000);state.last=t;state.x-=CONFIG.SPEED*dt;if(state.x<-126*(CONFIG.TOTAL+2))state.x=area.clientWidth;render();requestAnimationFrame(loop)}function start(){state.playing=true;state.score=0;state.left=CONFIG.TOTAL;state.x=area.clientWidth*.62;state.last=0;state.pressed=false;makeTickets();$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');$('message').textContent='별표가 가운데 오면 꾹 눌렀다 떼요!';render();requestAnimationFrame(loop)}function end(){state.playing=false;state.best=Math.max(state.best,state.score);localStorage.setItem('train-ticket-stamp_best',String(state.best));$('best').textContent=state.best;$('finalScore').textContent=state.score+'점';$('resultMsg').textContent=state.score>=22?'차장님 최고! 모든 승객이 활짝 웃어요.':'다시 하면 별표 표를 더 많이 찍을 수 있어요.';$('endOverlay').classList.remove('hidden')}function down(e){if(!state.playing)return;e.preventDefault();state.pressed=true;stamp.classList.add('pressed');try{stamp.setPointerCapture(e.pointerId)}catch(_e){}}function up(e){if(!state.playing||!state.pressed)return;e.preventDefault();state.pressed=false;stamp.classList.remove('pressed');punch()}stamp.addEventListener('pointerdown',down);stamp.addEventListener('pointerup',up);stamp.addEventListener('pointercancel',up);$('startBtn').addEventListener('click',start);$('restartBtn').addEventListener('click',start);window.__GAME_TEST__={start,state,punch,hit:currentHit};makeTickets();render();})();</script></body></html>
