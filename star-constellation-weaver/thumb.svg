<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad)"/>
  
  <!-- Tiny stars -->
  <circle cx="45" cy="50" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="30" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="340" cy="60" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="370" cy="220" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="60" cy="250" r="1" fill="#fff" opacity="0.4"/>

  <!-- Constellation lines -->
  <g stroke="#38bdf8" stroke-width="4" filter="url(#glow)" stroke-linecap="round">
    <line x1="80" y1="140" x2="140" y2="180" />
    <line x1="140" y1="180" x2="200" y2="130" />
    <line x1="200" y1="130" x2="260" y2="175" />
    <line x1="260" y1="175" x2="320" y2="125" />
  </g>
  <g stroke="#fef08a" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="140" x2="140" y2="180" />
    <line x1="140" y1="180" x2="200" y2="130" />
    <line x1="200" y1="130" x2="260" y2="175" />
    <line x1="260" y1="175" x2="320" y2="125" />
  </g>

  <!-- Stars -->
  <g fill="#fef08a" filter="url(#glow)">
    <circle cx="80" cy="140" r="8"/>
    <circle cx="140" cy="180" r="8"/>
    <circle cx="200" cy="130" r="9"/>
    <circle cx="260" cy="175" r="8"/>
    <circle cx="320" cy="125" r="8"/>
  </g>
  <g fill="#ffffff">
    <circle cx="80" cy="140" r="4"/>
    <circle cx="140" cy="180" r="4"/>
    <circle cx="200" cy="130" r="5"/>
    <circle cx="260" cy="175" r="4"/>
    <circle cx="320" cy="125" r="4"/>
  </g>

  <!-- Title Badge -->
  <rect x="75" y="235" width="250" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="262" fill="#fef08a" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" text-anchor="middle">✨ 반짝 별자리 엮기</text>
</svg>
